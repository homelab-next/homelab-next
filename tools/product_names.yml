# SPDX-License-Identifier: Apache-2.0
# The product-name lint's vocabulary and exemptions (tools/product_name_lint.py; ADR-0027 rule 1;
# docs/modules.md, "The product-name lint").
#
# products: products the platform names that have no provider module yet. Each one moves out of
# this list when its provider module ships (the module's product block then names it). A name
# here must be unambiguous: a common word (vault, cortex, shuffle) would match ordinary text.
# retired: names deliberately no longer linted ({name, reason}); without an entry here, CI refuses
# a change that stops linting a name the base commit linted (a dropped alias, product or module).
# moved: {from, to, reason}: a reviewed split, whose new path may carry the counts its source had at
# the base commit (no product's total may rise all the same).
# allow: reviewed path globs where a product name belongs, each with its reason. Provider module
# directories, site configuration (examples/modules/sites, examples/private-overlay, lab/) and
# Markdown prose are always allowed; everything else that names a product today is counted in
# tools/product_names.baseline.json, which only shrinks.
products:
  - {name: openbao, why: the secrets slot's reference product}
  - {name: vaultwarden, why: the operator password manager the secret seeding copies into}
  - {name: litellm, why: the LLM gateway's reference product}
  - {name: stackstorm, aliases: [st2], why: the automation slot's reference product (workflow runs and event rules)}
  - {name: nifi, why: the log pipeline's reference product}
  - {name: prometheus, why: the metrics service's reference product}
  - {name: grafana, why: the dashboards' reference product}
  - {name: uptime-kuma, why: the uptime monitor's reference product}
  - {name: authentik, why: the idp's reference product}
  - {name: wazuh, why: the SIEM's reference product}
  - {name: suricata, why: a network sensor product}
  - {name: technitium, why: the dns slot's reference product}
  - {name: trino, why: the lake query engine's reference product}
  - {name: iceberg, why: "the lake table format's reference product (outside prose the word is only ever the product here)"}
  - {name: minio, why: the object store's reference product}
  - {name: openproject, why: the projects slot's reference product}
  - {name: proxmox, why: the hypervisor the compute model renders for}
  - {name: unifi, why: the network adapter the site renders for}
  - {name: tailscale, why: the remote-access product}
  - {name: ollama, why: an inference server product}
  - {name: vllm, why: an inference server product}
  - {name: agentmetry, why: the agent telemetry product}
allow:
  - path: "tests/lake/golden/novelty_finding.*"
    reason: "the novelty_finding table's DDL goldens (ADR-0036), named like every other table's by the engine whose generated DDL each pins (the older tables' goldens are in the baseline); the generator is counted where it lives, homelabnext/lake/ddl.py"
  - path: "tests/generators/tiers/golden/caddy/**"
    reason: "the all-tiers golden of the edge generator (ADR-0039 step 3), at its output path like the older golden in the baseline; the generator is counted where it lives, homelabnext/generators/builtin.py"
  - path: "tests/generators/edge/golden/caddy/**"
    reason: "the golden of the edge generator's upstream TLS and deployment scope (registry 2.10 edge_tls, --edge-host), at the generator's output paths like the older goldens; the generator is counted where it lives, homelabnext/generators/builtin.py"
  - path: "tests/generators/edge/test_edge_tls.py"
    reason: "the tests of the edge generator's upstream TLS and deployment scope, keyed by the generator's id and its output paths; the generator is counted where it lives, homelabnext/generators/builtin.py"
  - path: "tools/tls_verify_lint.py"
    reason: "the TLS-verify gate (F-07) reads the edge's config files by their file names and names the one directive that turns an upstream's verification off; the configuration it judges is counted where it lives"
  - path: "tools/tests/test_tls_verify_lint.py"
    reason: "the TLS-verify gate's tests plant the edge's config files under their file names and the directive it refuses"
  - path: "tests/generators/tiers/golden/prometheus/**"
    reason: "the all-tiers golden of the metrics generator (ADR-0039 step 3), at its output path like the older golden in the baseline; the generator is counted where it lives, homelabnext/generators/builtin.py"
  - path: "tests/generators/test_gen_tiers.py"
    reason: "the tier rule of each built-in generator, keyed by the generator's id and its output paths (ADR-0039 step 3); the ids are counted where they live, homelabnext/generators/builtin.py"
  - path: "tests/modules/test_ntfy_module.py"
    reason: "the tests of the ntfy provider module (modules/ntfy): its manifest, conformance target and an overlay that selects it, by the module's id, which is its product's name"
  - path: "tests/modules/ntfy_front.py"
    reason: "the deny-all front the ntfy module's tests put before the loopback stand-in of the product's API (conformance/fakes/ntfy_api.py, in the baseline)"
  - path: "tests/roles/test_ntfy_role.py"
    reason: "the tests of the ntfy module's role (modules/ntfy/roles/ntfy), named for the module id as a module role must be (role:<module id>)"
  - path: "tests/modules/test_edge_module.py"
    reason: "the tests of the caddy provider module (modules/caddy): its manifest, conformance target, an overlay that selects it and its Caddyfile adapted by the product, by the module's id, which is its product's name"
  - path: "tests/roles/test_caddy_role.py"
    reason: "the tests of the caddy module's roles (modules/caddy/roles/caddy and caddy_auth_proxy), named for the module id as a module role must be (role:<module id>)"
  - path: "homelabnext/conform/adapters/caddy.py"
    reason: "the edge provider module's conformance adapter (modules/caddy's provides.slots.edge.adapter), a shared adapter as the module rules require, named for its module like the ntfy one; it drives the product's own binary"
  - path: "homelabnext/generators/realm_format.py"
    reason: "the two names of the IdP realm format the idp_realm generator renders (ADR-0034 decision 2: the realm is the reference IdP's own import format): its registry impl and its user-profile component; every other module takes them from here"
  - path: "homelabnext/conform/adapters/keycloak.py"
    reason: "the shared conformance adapter of the idp slot's provider module (modules/keycloak), on the product's own admin and OIDC endpoints; a provider's adapter lives in homelabnext.conform.adapters until module code is loaded (docs/modules.md, the adapter allowlist), as the ntfy adapter's debt is in the baseline"
  - path: "tests/modules/test_keycloak_module.py"
    reason: "the tests of the idp provider module (modules/keycloak): its manifest, conformance target and an overlay that selects it, by the module's id, which is its product's name"
  - path: "tests/modules/keycloak_stand_in.py"
    reason: "the HTTPS stand-in of the idp provider's admin and OIDC API that the module's tests and its adapter's conformance run use"
  - path: "tests/roles/test_keycloak_role.py"
    reason: "the tests of the idp provider module's role (modules/keycloak/roles/keycloak), named for the module id as a module role must be (role:<module id>)"
  - path: "tests/generators/golden/idp/**"
    reason: "the golden of the idp_realm generator, in the realm format's product's own representation (its user-profile component); the format's names are counted where they live, homelabnext/generators/realm_format.py"
  - path: "tests/generators/tiers/golden/idp/**"
    reason: "the all-tiers golden of the idp_realm generator (ADR-0039 step 3), in the realm format's product's own representation; the format's names are counted where they live, homelabnext/generators/realm_format.py"
  - path: "tests/generators/fixtures/all-tiers.services.yml"
    reason: "the all-tiers registry fixture's eval idp row names the realm format's product as its impl, which is what makes the realm render for it (generators/realm_format.py)"
  - path: "examples/services.yml"
    reason: "the example lab's registry is a (fictional) site's configuration, like examples/modules/sites/: its rows choose products (impl), which is where a product name belongs (ADR-0027 rule 1); its idp row names the realm format's product, which is what makes the example realm render (generators/realm_format.py, ADR-0034 decision 2)"
  - path: "schemas/platform/examples/service.valid.yml"
    reason: "the schema-layout copy of examples/services.yml (tests/registry/test_schema_example_sync.py holds them equal): the same fictional site's configuration"
  - path: "docs/scripts/catalog.json"
    reason: generated from the scripts' hnx-script header comments, which are prose
  - path: "tools/*.allow.yml"
    reason: other gates' reviewed path lists; a path that names a product is counted where it lives
  - path: "tools/allowlist_counts.yml"
    reason: the allowlist ratchet's counts file keys each gate's list by the name of that gate's allow file, which the ratchet derives from the file name; a path that names a product is counted where it lives
  - path: "tools/dup_check.baseline.json"
    reason: the duplication baseline lists paths; a path that names a product is counted where it lives
  - path: "schemas/_frozen/*"
    reason: frozen baselines are append-only byte copies of reviewed live schemas (schema_check.py --freeze), counted where the live schema lives; a copy of a schema that names a product in an enum or a description would otherwise double its debt
  - path: "detections/attack_coverage.json"
    reason: generated (detections coverage --out); its backends map is keyed by each compiled backend's registered name, counted where the backend lives (homelabnext/detections/backends/)
  - path: "NOTICE"
    reason: the attribution notice is prose
  - path: "tools/pin_freshness.py"
    reason: the version-pin report maps each pin dependabot cannot parse to its product's upstream release list, as the licence register maps each image; the configuration that runs a product is counted where it lives
  - path: "tools/tests/test_pin_*.py"
    reason: the pin tests read the pins (role defaults, CI versions, example registries) and hold the copies of one product's version equal; the configuration they read is counted where it lives
  - path: ".github/dependabot.yml"
    reason: "dependabot's ignore rules name an image or package by its registry name (a release never to propose, such as a compromised one); the configuration that runs it is counted where it lives"
  - path: "tools/licences.yml"
    reason: the licence register names each pinned package and compose image it reviews; the configuration that runs them is counted where it lives
  - path: "compose/lab-in-a-box/config/nats/nats.conf"
    reason: "the lab bus's ACL: each grant names the subject it allows, so the automation bridge's grants name its durables (st2-*), token for token in both ack reply-subject forms; a lint must not push an ACL toward wildcards or one ack form when the other is due (nats-server 2.16 enables v2, 2.17 removes the flag)"
  - path: "tools/experimental.yml"
    reason: the reviewed list of experimental and frozen components names each component it takes out of the blocking set, and the paths of its tests and docs; the code those name is counted where it lives
  - path: "compose/lab-in-a-box/config/llm-gateway/gateway/gateway.json"
    reason: "generated (hnx gen gateway render, ADR-0038): the neutral gateway config is the gateway's upstream table, where each role's backend svc name and model id belong by design (as in the role table); it names only what the role table and the gateway spec name, and is counted where those live"
  - path: "compose/lab-in-a-box/config/llm-gateway/litellm/config.yaml"
    reason: "generated (hnx gen gateway render): the reference gateway product's own config file, with one deployment-parameters key per role binding, so its count follows the role table (a role added to it adds one) and a baseline entry, which may never rise, cannot hold it; the renderer writes those keys and is counted where it lives, homelabnext/generators/llm_gateway.py"
  - path: "examples/*/gateway/gateway/gateway.json"
    reason: "generated (hnx gen gateway render, ADR-0038) for the gateway examples: the upstream table of backend svc names and model ids, exactly what each example's role table and gateway spec name, counted where those live"
  - path: "tools/tests/test_product_name_lint.py"
    reason: the lint's own tests plant product names on purpose
  - path: "ansible/roles/openbao/**"
    reason: "the secret store's server-mode role (ADR-0042 decision 6) installs, configures and snapshots that one product, so its name, binary, configuration format and release URL are the role itself; reviewed as an exemption until provider modules ship (docs/modules.md, modules/<id>/roles/), where it moves and this entry goes"
  - path: "ansible/playbooks/openbao.yml"
    reason: "the playbook that runs the role above on cap_secrets names it; moves with it into the provider module"
  - path: "tests/roles/test_openbao.py"
    reason: "the role's own tests name the role and the product's CLI and API they fake; move with it into the provider module"
