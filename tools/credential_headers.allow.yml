# Reviewed templated `headers` values of uri/get_url tasks (tests/roles/test_credential_uri_tasks.py).
# A template string cannot be inspected, so the scan refuses one unless it is listed here with the
# exact file, the task name, the credential headers the template can build and why it was
# reviewed; the listed headers are then held to the scan's rules. Every entry must match exactly
# one scanned task.
allow:
  - path: ansible/roles/vllm_server/tasks/health.yml
    task: Ask each instance what it serves
    headers: [Authorization]
    reason: builds only Authorization (Bearer, from the hnx_secret lookup) when an API key reference is set, and no header otherwise
