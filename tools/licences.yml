# SPDX-License-Identifier: Apache-2.0
# The licence register (tools/licence_check.py; ADR-0011 decision 4): every Python package
# constraints/*.txt pins and every image a compose/ stack runs or builds FROM, with its licence (an SPDX
# expression: ids joined by AND or OR, no parentheses) and how this repository uses it. Owned in
# CODEOWNERS with the rest of tools/: an entry here is a reviewed licence decision.
#
#   kind   linked: held to the linked-code rule, which refuses a copyleft licence (GPL, AGPL,
#                  SSPL; LGPL and MPL are allowed unmodified). The default for a Python package:
#                  anything homelabnext/ imports, any extra's dependency, and what they pull in.
#          tool:   a program run as its own process that homelabnext/ never imports (the reason
#                  says how it runs; NOTICE names a copyleft one).
#          service: a container image a compose file runs, or the base image of one it builds
#                  (the reason says where its licence is stated).
#   reason required for tool and service.
#
# The Python licences are the PyPI metadata of the pinned versions (License-Expression, else the
# License field or classifier). A new pin or image fails `make licence-check` until it is listed
# here, and an entry nothing pins any more fails it too; a version bump of a listed package is
# left to CI's dependency review, which reads the licence of every changed dependency.
# An image's tag bump passes this gate unread (nothing reviews an image's licence again), so a
# minor or major image bump re-reads its licence in that pull request and updates the entry
# (CONTRIBUTING.md, "Keeping pins current").
python:
  annotated-types: {spdx: MIT, kind: linked}
  ansible-core: {spdx: GPL-3.0-or-later, kind: tool, reason: "run as ansible-playbook by the role tests and deploys; homelabnext/ never imports it (NOTICE, ADR-0011)"}
