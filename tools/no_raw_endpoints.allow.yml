# SPDX-License-Identifier: Apache-2.0
# Paths allowed to contain endpoint literals. Every entry needs a reason.
allow:
  - path: "examples/**"
    reason: synthetic example lab and registry data (documentation address ranges only)
  - path: "tests/**/golden/**"
    reason: golden outputs rendered from the synthetic example lab
  - path: "homelabnext/golden/examples/codemode/*.yml"
    reason: the Code Mode golden suites' fixtures, fictional broker results a correlation joins (documentation addresses only, RFC 5737)
  - path: "tests/**/fixtures/**"
    reason: negative fixtures that deliberately contain literals
  - path: "detections/fixtures/cloud-metadata-probe/**"
    reason: the link-local cloud metadata address the rule matches, beside documentation and link-local neighbours it must not
  - path: "schemas/**/examples/**"
    reason: schema example documents use documentation addresses
  - path: "compose/lab-in-a-box/docker-compose.yml"
    reason: the reference environment binds published ports to loopback, probes its own containers and names the in-network capability aliases; an environment definition, not a code default
  - path: "compose/lab-in-a-box/.env.example"
    reason: default loopback bind address and the documentation-range subnet of the compose network
  - path: "compose/lab-in-a-box/config/llm-gateway/*/**"
    reason: generated by hnx gen gateway from the role table; a gateway's upstream table is the one place backend aliases and ports belong (ADR-0007, ADR-0022), example.internal names only
  - path: "compose/lab-in-a-box/config/trino/config.properties"
    reason: the query engine's own listener URI inside its container
  - path: "compose/lab-in-a-box/config/trino/catalog/iceberg.properties"
    reason: points the engine at the in-network aliases of the catalog and object store (example.internal names, compose network only)
  - path: "compose/lab-in-a-box/config/prometheus/prometheus.yml"
    reason: the lab's Prometheus scrapes itself inside its own container (its own listener, compose network only)
  - path: "inventory/**"
    reason: the inventory is where addresses legitimately live
  - path: "tests/gates/test_network_guard.py"
    reason: the network guard's own tests classify loopback and documentation-range literals
  - path: "conformance/fixtures/**"
    reason: recorded fixtures and cassettes
  - path: "CONTRIBUTING.md"
    reason: prose listing the documentation address ranges
  - path: "README.md"
    reason: prose listing the documentation address ranges
  - path: "docs/glossary.md"
    reason: prose listing the documentation address ranges
  - path: "docs/interfaces.md"
    reason: prose listing the documentation address ranges
  - path: "homelabnext/ids/lint.py"
    reason: the lint rule that defines which documentation ranges are tolerated
  - path: "tools/leak_scan.py"
    reason: the scanner defines the documentation ranges it tolerates
  - path: "tools/tests/test_leak_scan.py"
    reason: scanner tests plant documentation-range addresses on purpose
  - path: "tests/agent/test_agent_screen.py"
    reason: screener tests plant documentation-range addresses to prove they are redacted from prompts
  - path: "ansible/roles/example_service/tasks/health.yml"
    reason: loopback health probe of the service the role just started (not a cross-service endpoint)
  - path: "schemas/events/negative/alert.created.wrong-type.json"
    reason: negative schema fixture; documentation address
  - path: "schemas/status/negative/observation.link-is-address.json"
    reason: negative fixture - an address as a status link must be rejected (documentation range)
  - path: "schemas/ids/negative/logical-id.ip-literal.json"
    reason: negative fixture - an IP literal in a logical id must be rejected
  - path: "schemas/platform/negative/model_roles.backend-is-url.json"
    reason: negative fixture - a URL backend must be rejected
  - path: "tests/ids/test_ids_grammar.py"
    reason: tests plant documentation-range addresses to prove they are rejected in ids
  - path: "tests/ids/test_ids_lint.py"
    reason: tests plant documentation-range addresses to prove the lint catches them
  - path: "tests/overlay/fake_openbao.py"
    reason: a fake OpenBao that binds loopback for the vault password client and hnx_secret lookup tests
  - path: "tests/overlay/test_private_overlay_example.py"
    reason: a redirect test points at a loopback discard port that must never be reached
  - path: "tests/roles/test_role_lint.py"
    reason: tests plant a loopback literal to prove role_lint flags it
  - path: "tests/roles/test_role_render.py"
    reason: render tests use synthetic example.internal endpoints and a loopback literal as expected values
  - path: "tests/roles/test_product_roles.py"
    reason: central product roles enroll guests by address; the synthetic guests use documentation addresses (the data under test)
  - path: "tests/roles/test_control_roles.py"
    reason: the firewall, drill and directory tests use documentation addresses and example.internal registry endpoints as the data under test
  - path: "schemas/platform/negative/module_selection.*.yml"
    reason: negative selections generated from the example site profiles, whose scope blocks hold documentation addresses only (private_leak_check enforces it)
  - path: "schemas/platform/negative/service.*.yml"
    reason: negative registry fixtures derived from the synthetic example lab (documentation addresses only)
  - path: "docs/compute-model.md"
    reason: guest example uses a documentation-range address
  - path: "schemas/platform/examples/guest.*.yml"
    reason: guest examples are synthetic fleet data (documentation addresses only)
  - path: "schemas/platform/negative/guest.*.yml"
    reason: negative guest fixtures (documentation addresses only)
  - path: "tests/compute/*"
    reason: synthetic fleet, site model, goldens and tests (documentation addresses only; addresses are the data under test)
  - path: "tests/logpipeline/**"
    reason: runtime-label tests and evasion fixtures; the observed address is the data under test (documentation ranges, RFC 5737 and RFC 3849)
  - path: "tests/scope/*"
    reason: scope tests resolve guests by address alias; documentation-range addresses are the data under test
  - path: "tests/schemas/fixtures/**"
    reason: 1.1-only guest fixtures (documentation addresses only)
  - path: "tests/integration/**"
    reason: synthetic fleet files and assertions on documentation addresses
  - path: "tests/decommission/**"
    reason: fictional lab data in the documentation address ranges, used as audit fixtures
  - path: "docs/decommission.md"
    reason: prose example using a documentation address
  - path: "tests/modules/test_egress_policy.py"
    reason: the example sites' documentation addresses (RFC 5737, RFC 3849) as the rendered ruleset names them
