# Reviewed exemptions from tools/shared_helpers_lint.py (checklist M-03). Each names the path, the
# rule (notify | state | lake) and why the code may not use the shared library. An entry that no
# longer matches anything fails the lint, so this list cannot rot.
allow:
  - path: compose/lab-in-a-box/smoke_checks.py
    rule: lake
    reason: the lab smoke check probes the query engine product itself over its REST protocol, stdlib only inside the container; it tests the server the lake library talks to, it is not a consumer of the seam
  - path: tools/shared_helpers_lint.py
    rule: lake
    reason: the lint names the Trino REST endpoint in order to detect it
  - path: homelabnext/conform/adapters/ntfy.py
    rule: notify
    reason: the notify conformance adapter reads a topic back from ntfy (GET poll) to observe delivery independently of the sender under test; every send goes through homelabnext.notify.NtfySender
  - path: homelabnext/status/agents/store.py
    rule: lake
    reason: the status hub's agent activity store is a local SQLite file of agent events (both tiers, redacted before writing), not a client of the shared lake; nothing here queries the lake
  - path: homelabnext/orchestration/store.py
    rule: lake
    reason: the status hub's orchestration telemetry store is a local SQLite file of job records and gateway turns (names and numbers only), not a client of the shared lake; nothing here queries the lake
  - path: homelabnext/_sqlite.py
    rule: lake
    reason: the one-transaction SQLite connection the hub's two local stores (agent activity, orchestration telemetry) share; a local file, not a client of the shared lake
  - path: ansible/roles/last_run/files/hnx-last-run.py
    rule: state
    reason: the last-run writer is a standalone stdlib script installed on every guest, which has no homelabnext package to import; its record is a contract document (schemas/status/last_run.schema.json) the status hub reads, not checker state
  - path: hooks/claude_code_activity.py
    rule: state
    reason: the hook is a standalone stdlib script copied to workstations and cloud sessions, so it cannot import homelabnext.state; each spool file is one immutable record handed to the hub, not checker state
  - path: conformance/fakes/records_target.py
    rule: records
    reason: the records conformance mutants move or copy a note out of the inbox by hand on purpose (a non-atomic or lane-skipping decision), so the suite can prove it catches each defect; the honest fake uses the library
  - path: tools/migrate/jellyfin.py
    rule: lake
    reason: the media server's importer reads and rewrites that server's own local SQLite files (users, devices, watch state, item paths) with the stdlib module; they are an application's config databases, not a lake, and nothing here queries the shared lake
  - path: tools/migrate/media_automation.py
    rule: lake
    reason: the media automation importer reads and rewrites the library managers' and the request app's own local SQLite files (series, files, indexers, download clients, requests) with the stdlib module; they are applications' config databases, not a lake, and nothing here queries the shared lake
  - path: modules/media-automation/roles/media_automation/files/stalled-torrent-repair.py
    rule: state
    reason: a standalone stdlib script installed on the media guest, which has no homelabnext package to import; its state file is the script's own memory of when each torrent last made progress (hash, progress, first-seen time), not checker state
  - path: modules/gitea/roles/gitea/files/hnx_gitea.py
    rule: lake
    reason: the forge role's helper reads the forge's own SQLite database (a dump's SQL loaded into memory, or the instance's database file opened read-only) to count rows and fingerprint accounts for the export and restore checks, with the stdlib module because it runs on a guest with no homelabnext package; it is an application's database, not the shared lake, and nothing here queries the lake
  - path: modules/cti-pipeline/roles/cti_pipeline/files/cti_state.py
    rule: lake
    reason: the pipeline role's state tool copies the app's own local SQLite store (data/cti.db) through the database's backup API, counts its tables' rows and runs its integrity check for the export and restore checks, with the stdlib module because it runs on a guest with no homelabnext package; it is an application's database, not the shared lake, and nothing here queries the lake
