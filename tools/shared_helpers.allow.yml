# Reviewed exemptions from tools/shared_helpers_lint.py (checklist M-03). Each names the path, the
# rule (notify | state | lake) and why the code may not use the shared library. An entry that no
# longer matches anything fails the lint, so this list cannot rot.
allow:
  - path: compose/lab-in-a-box/smoke_checks.py
    rule: lake
    reason: the lab smoke check probes the query engine product itself over its REST protocol, stdlib only inside the container; it tests the server the lake library talks to, it is not a consumer of the seam
  - path: homelabnext/records/decider.py
    rule: state
    reason: the decision sidecar is a record artefact written atomically next to the note it decides before the note moves lanes; it is part of the record, not checker state
  - path: tools/shared_helpers_lint.py
    rule: lake
    reason: the lint names the Trino REST endpoint in order to detect it
  - path: homelabnext/conform/adapters/ntfy.py
    rule: notify
    reason: the notify conformance adapter reads a topic back from ntfy (GET poll) to observe delivery independently of the sender under test; every send goes through homelabnext.notify.NtfySender
