# SPDX-License-Identifier: Apache-2.0
# Settings and the reviewed allowlist for `hnx scripts reality` (M-02) and `hnx scripts
# runner-lint` (M-04); docs/scripts.md.  Every entry names a catalogued script id (or, under
# external_exec, a scheduled exec path) and the reason.  An entry that no longer matches anything
# fails the check, so this list only ever shrinks by being right.

# invariants registers whose criteria may run a check script
registers:
  - examples/registers/invariants.yml
# fleet_units specs (homelabnext.generators.fleet_units) whose entries are scheduled jobs
fleet_unit_specs:
  - "**/fleet_units.yml"
  - "**/fleet_units/*.yml"
# fleet_units specs that are not this tree's jobs: the fictional module examples (ADR-0027 draft)
# name module code the repository does not ship, so their execs resolve to nothing here; the
# module contract tests validate them with fleet_units.validate and the module rules instead
# (namespaced names, no root, no hardening opt-out, no direct paging)
fleet_unit_specs_exclude:
  - "examples/modules/**"

# active scripts with no caller in the tree
uncalled:
  decommission-check: >-
    the operator runs it by hand at step 8 of a service swap (docs/swap.md), with the retired
    service's names as arguments; the swap runner calls the same scanner as a library
  lab-rehearsal-swap-lake-query: >-
    run by lab-smoke (compose/lab-in-a-box/smoke.sh) through its `rehearsals/*.sh` glob, which
    names no path the scanner can resolve; the nightly workflow runs lab-smoke
  claude-code-activity-hook: >-
    a Claude Code hook: the coding agent runs it from the operator's own settings.json (outside
    this tree, snippet in docs/status.md section 6) on every hook event; nothing in the repository
    calls it
  broker-example-service-status: &broker-handler >-
    an example broker handler: the broker service runs it on request through the example manifest
    (examples/broker/manifest.yml handler_docs), from a digest-checked copy in the run directory,
    and tests/broker run it the same way; a manifest is data, not a caller the scanner reads
  broker-example-service-restart: *broker-handler
  workflow-broker-agent-job-submit: >-
    the workflow broker's handler for agent.job.submit: the broker runs it through
    workflows/broker.manifest.json (pinned by workflows/handlers/agent-job-submit.handler.json) when
    a StackStorm rule in live mode submits agent work; a manifest is data, not a caller the scanner
    reads
  overlay-vault-pass-client: >-
    a template for the private overlay repository (examples/private-overlay/): Ansible runs it
    there as the vault password client its ansible.cfg names; nothing in this repository runs a
    deploy
  overlay-runner-job-started: >-
    a template for the private overlay's self-hosted deploy runner: the GitHub Actions runner
    service runs it as ACTIONS_RUNNER_HOOK_JOB_STARTED before every job (docs/private-overlay.md
    "The self-hosted runner"); tests/overlay run it with fake job environments
  lab-postgres-litellm-role: >-
    the postgres image's own entrypoint runs every *.sh in /docker-entrypoint-initdb.d, which the
    lab's postgres service mounts from compose/lab-in-a-box/config/postgres/init, once on a fresh
    volume; the scanner reads only a service's command and entrypoint, not a mounted init dir

# checks that no invariants criterion runs
not_in_runner:
  conform-coverage: >-
    CI wrapper around the conformance report; the same report already runs in the invariants
    runner through plugin X-10 (homelabnext.conform.plugins.x10_conformance), so running this
    script there too would measure one property twice
  check-changelog: >-
    release hygiene of the tree (an Unreleased section and one for the current version); the
    nearest checklist row, F-15, also needs a what-changed event per deploy (SERVER), so
    registering this as F-15 would claim more than it measures
  run-output-lint: >-
    a lint of the repository's own script sources (where they write scratch files), not a property
    of a running fleet; make check and CI run it, and an invariant would re-run the same AST pass

# scheduled execs that are not scripts of this repository (product binaries); none yet
external_exec: {}
