# SPDX-License-Identifier: Apache-2.0
# The lab's events service: NATS JetStream with accounts and per-user permissions.
#
# Who may publish a subject is what makes a pinned `source` mean anything: the StackStorm bridge
# and A03 act on a decision.returned with source svc:broker, so only the broker's user may publish
# <prefix>.homelabnext.decision.> and <prefix>.homelabnext.proposal.> (docs/broker.md, "The bus
# ACL"; docs/stackstorm.md).  The streams and the provisioner (hnx-lab-admin) live in HNX; every
# other user lives in an account of its own, HNX-<user>, with JetStream off, that imports from HNX
# exactly the services its allow-list names (homelab-next #360 round 5: a reply subject is not
# checked against anyone's allow-list, and JetStream takes its own deliveries and answers as
# requests when they land on $JS.API.*, so in one account a user holding only its durable's
# MSG.NEXT could have the server delete the stream with reply $JS.API.STREAM.DELETE.<stream>;
# across a service import the reply is rewritten to a private _R_ subject and the answer goes
# back to the client's own account, where no JetStream API listens).  A client names its
# JetStream calls under JS.HNX.API (an account without JetStream answers $JS.API.* itself; the
# adapter's api_prefix), its acks and stream subjects as they are.  This block is what the
# events_bus role renders for these users (ansible/plugins/filter/hnx_bus.py hnx_bus_accounts;
# tests/roles/test_hnx_bus_filter.py holds the two to each other).  Every user gets an
# allow-list and nothing else: no wildcard over $JS.API, so no STREAM.PURGE, STREAM.UPDATE,
# STREAM.DELETE or MSG.DELETE for anyone, and each user's replies arrive on its own inbox prefix
# (_INBOX.<user>, the adapter's default for a user), never on a shared _INBOX.> (that stops another
# user READING them; it cannot stop a forged reply, so each client matches its replies by its own
# unguessable inbox token).  No user but hnx-lab-admin may create a consumer: a create takes a
# push deliver_subject, which the server delivers as itself to any subject (another user's _INBOX
# included), whatever the creator may publish to.  hnx-lab-admin pre-creates the bridge's PULL
# durables (the filtered form $JS.API.CONSUMER.CREATE.<stream>.<durable>.<filter>, no
# deliver_subject; broker_e2e.py, the events_bus role's provisioner on a deployment) and alone
# reads a stored message back (STREAM.MSG.GET reads every subject's); the bridge binds to them
# with INFO, MSG.NEXT and its acks.  Its acks are granted in both of ADR-15's reply-subject forms,
# each token for token as the consumer subscribes to it, never a wildcard over the stream or
# consumer tokens: v1 $JS.ACK.<stream>.<durable>.*.*.*.*.* (exactly 9 tokens) and v2
# $JS.ACK.<domain>.<account hash>.<stream>.<durable>.*.*.*.*.> (11 or more), with the domain "_"
# (none is configured) and the hash of HNX, the account that holds the stream (server/events.go
# getHash: the first 8 bytes of sha256(account name), each mod 62 into 0-9A-Za-z; "hKkTAyOX").
# nats-server 2.15.1 sends v1; upstream main enables js_ack_fc_v2 (v2) in 2.16 and removes the
# flag in 2.17, and a grant of one form alone would then refuse every ack, so each delivery would
# run to max_deliver.
#
#   HNX      the standing bus: stream HNXLAB_BROKER (subjects hnxlab.>) and its DLQ, and the
#            bridge's durables, provisioned (with limits) by hnx-lab-admin (broker_e2e.py), never by
#            a client; it exports each client's calls to that client's account alone
#   HNX-hnx-broker, HNX-hnx-st2-bridge
#            one client each, JetStream off, importing only its own calls
#   CONFORM  `hnx conform run events` (smoke.sh): scratch streams of its own; a separate account,
#            so nothing it does can reach the HNX subjects or streams, with its own JetStream
#            limits (8 MiB memory, 256 MiB file, 64 streams, 256 consumers), so scratch streams a
#            failed run leaves behind cannot take the server's whole store from HNX
#
# <prefix>.homelabnext.agent.job.> (agent.job.failed, which StackStorm's A02 acts on) belongs to
# the orchestration controller's user and nobody else's.  The lab runs no controller, so no user
# here may publish it at all; a deployment grants it to the controller's user only
# (docs/stackstorm.md).
#
# Passwords come from the environment (docker-compose.yml, from .env.example: fake placeholders).
# The format is the JSON subset of the NATS config syntax, plus `$VAR` references and `#` comment
# lines, so tests/compose can read the permissions the server enforces (and the docs' excerpts).
{
  "port": 4222,
  "http_port": 8222,
  "jetstream": {"store_dir": "/data", "max_memory_store": 33554432, "max_file_store": 1073741824},
  "accounts": {
    "HNX": {
      "jetstream": "enabled",
      "users": [
        {"user": "hnx-lab-admin", "password": $LAB_EVENTS_ADMIN_PASSWORD,
         "permissions": {
           "publish": {"allow": ["$JS.API.STREAM.INFO.HNXLAB_BROKER",
                                 "$JS.API.STREAM.INFO.HNXLAB_BROKER_DLQ",
                                 "$JS.API.STREAM.CREATE.HNXLAB_BROKER",
                                 "$JS.API.STREAM.CREATE.HNXLAB_BROKER_DLQ",
                                 "$JS.API.STREAM.MSG.GET.HNXLAB_BROKER",
                                 "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-agent-job-failed",
                                 "$JS.API.CONSUMER.CREATE.HNXLAB_BROKER.st2-agent-job-failed.hnxlab.homelabnext.agent.job.failed",
                                 "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-decision-returned",
                                 "$JS.API.CONSUMER.CREATE.HNXLAB_BROKER.st2-decision-returned.hnxlab.homelabnext.decision.returned",
                                 "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-proposal-created",
                                 "$JS.API.CONSUMER.CREATE.HNXLAB_BROKER.st2-proposal-created.hnxlab.homelabnext.proposal.created"]},
           "subscribe": {"allow": ["_INBOX.hnx-lab-admin.>"]}}}
      ],
      "exports": [
        {"service": "$JS.ACK.HNXLAB_BROKER.st2-agent-job-failed.*.*.*.*.*", "accounts": ["HNX-hnx-st2-bridge"]},
        {"service": "$JS.ACK.HNXLAB_BROKER.st2-decision-returned.*.*.*.*.*", "accounts": ["HNX-hnx-st2-bridge"]},
        {"service": "$JS.ACK.HNXLAB_BROKER.st2-proposal-created.*.*.*.*.*", "accounts": ["HNX-hnx-st2-bridge"]},
        {"service": "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-agent-job-failed.*.*.*.*.>", "accounts": ["HNX-hnx-st2-bridge"]},
        {"service": "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-decision-returned.*.*.*.*.>", "accounts": ["HNX-hnx-st2-bridge"]},
        {"service": "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-proposal-created.*.*.*.*.>", "accounts": ["HNX-hnx-st2-bridge"]},
        {"service": "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-agent-job-failed", "accounts": ["HNX-hnx-st2-bridge"]},
        {"service": "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-decision-returned", "accounts": ["HNX-hnx-st2-bridge"]},
        {"service": "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-proposal-created", "accounts": ["HNX-hnx-st2-bridge"]},
        {"service": "$JS.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-agent-job-failed", "accounts": ["HNX-hnx-st2-bridge"], "response_type": "stream"},
        {"service": "$JS.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-decision-returned", "accounts": ["HNX-hnx-st2-bridge"], "response_type": "stream"},
        {"service": "$JS.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-proposal-created", "accounts": ["HNX-hnx-st2-bridge"], "response_type": "stream"},
        {"service": "$JS.API.STREAM.INFO.HNXLAB_BROKER", "accounts": ["HNX-hnx-broker", "HNX-hnx-st2-bridge"]},
        {"service": "$JS.API.STREAM.INFO.HNXLAB_BROKER_DLQ", "accounts": ["HNX-hnx-broker", "HNX-hnx-st2-bridge"]},
        {"service": "hnxlab.homelabnext.decision.>", "accounts": ["HNX-hnx-broker"]},
        {"service": "hnxlab.homelabnext.proposal.>", "accounts": ["HNX-hnx-broker"]}
      ]
    },
    "HNX-hnx-broker": {
      "users": [
        {"user": "hnx-broker", "password": $LAB_EVENTS_BROKER_PASSWORD,
         "permissions": {
           "publish": {"allow": ["hnxlab.homelabnext.decision.>",
                                 "hnxlab.homelabnext.proposal.>",
                                 "JS.HNX.API.STREAM.INFO.HNXLAB_BROKER",
                                 "JS.HNX.API.STREAM.INFO.HNXLAB_BROKER_DLQ"]},
           "subscribe": {"allow": ["_INBOX.hnx-broker.>"]}}}
      ],
      "imports": [
        {"service": {"account": "HNX", "subject": "hnxlab.homelabnext.decision.>"}},
        {"service": {"account": "HNX", "subject": "hnxlab.homelabnext.proposal.>"}},
        {"service": {"account": "HNX", "subject": "$JS.API.STREAM.INFO.HNXLAB_BROKER"}, "to": "JS.HNX.API.STREAM.INFO.HNXLAB_BROKER"},
        {"service": {"account": "HNX", "subject": "$JS.API.STREAM.INFO.HNXLAB_BROKER_DLQ"}, "to": "JS.HNX.API.STREAM.INFO.HNXLAB_BROKER_DLQ"}
      ]
    },
    "HNX-hnx-st2-bridge": {
      "users": [
        {"user": "hnx-st2-bridge", "password": $LAB_EVENTS_ST2_BRIDGE_PASSWORD,
         "permissions": {
           "publish": {"allow": ["JS.HNX.API.STREAM.INFO.HNXLAB_BROKER",
                                 "JS.HNX.API.STREAM.INFO.HNXLAB_BROKER_DLQ",
                                 "JS.HNX.API.CONSUMER.INFO.HNXLAB_BROKER.st2-agent-job-failed",
                                 "JS.HNX.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-agent-job-failed",
                                 "$JS.ACK.HNXLAB_BROKER.st2-agent-job-failed.*.*.*.*.*",
                                 "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-agent-job-failed.*.*.*.*.>",
                                 "JS.HNX.API.CONSUMER.INFO.HNXLAB_BROKER.st2-decision-returned",
                                 "JS.HNX.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-decision-returned",
                                 "$JS.ACK.HNXLAB_BROKER.st2-decision-returned.*.*.*.*.*",
                                 "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-decision-returned.*.*.*.*.>",
                                 "JS.HNX.API.CONSUMER.INFO.HNXLAB_BROKER.st2-proposal-created",
                                 "JS.HNX.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-proposal-created",
                                 "$JS.ACK.HNXLAB_BROKER.st2-proposal-created.*.*.*.*.*",
                                 "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-proposal-created.*.*.*.*.>"]},
           "subscribe": {"allow": ["_INBOX.hnx-st2-bridge.>"]}}}
      ],
      "imports": [
        {"service": {"account": "HNX", "subject": "$JS.API.STREAM.INFO.HNXLAB_BROKER"}, "to": "JS.HNX.API.STREAM.INFO.HNXLAB_BROKER"},
        {"service": {"account": "HNX", "subject": "$JS.API.STREAM.INFO.HNXLAB_BROKER_DLQ"}, "to": "JS.HNX.API.STREAM.INFO.HNXLAB_BROKER_DLQ"},
        {"service": {"account": "HNX", "subject": "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-agent-job-failed"}, "to": "JS.HNX.API.CONSUMER.INFO.HNXLAB_BROKER.st2-agent-job-failed"},
        {"service": {"account": "HNX", "subject": "$JS.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-agent-job-failed"}, "to": "JS.HNX.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-agent-job-failed"},
        {"service": {"account": "HNX", "subject": "$JS.ACK.HNXLAB_BROKER.st2-agent-job-failed.*.*.*.*.*"}},
        {"service": {"account": "HNX", "subject": "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-agent-job-failed.*.*.*.*.>"}},
        {"service": {"account": "HNX", "subject": "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-decision-returned"}, "to": "JS.HNX.API.CONSUMER.INFO.HNXLAB_BROKER.st2-decision-returned"},
        {"service": {"account": "HNX", "subject": "$JS.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-decision-returned"}, "to": "JS.HNX.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-decision-returned"},
        {"service": {"account": "HNX", "subject": "$JS.ACK.HNXLAB_BROKER.st2-decision-returned.*.*.*.*.*"}},
        {"service": {"account": "HNX", "subject": "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-decision-returned.*.*.*.*.>"}},
        {"service": {"account": "HNX", "subject": "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-proposal-created"}, "to": "JS.HNX.API.CONSUMER.INFO.HNXLAB_BROKER.st2-proposal-created"},
        {"service": {"account": "HNX", "subject": "$JS.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-proposal-created"}, "to": "JS.HNX.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-proposal-created"},
        {"service": {"account": "HNX", "subject": "$JS.ACK.HNXLAB_BROKER.st2-proposal-created.*.*.*.*.*"}},
        {"service": {"account": "HNX", "subject": "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-proposal-created.*.*.*.*.>"}}
      ]
    },
    "CONFORM": {
      "jetstream": {"max_mem": 8388608, "max_file": 268435456, "max_streams": 64,
                    "max_consumers": 256},
      "users": [
        {"user": "hnx-conformance", "password": $LAB_EVENTS_CONFORMANCE_PASSWORD}
      ]
    }
  }
}
