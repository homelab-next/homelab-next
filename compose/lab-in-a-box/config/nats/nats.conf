# SPDX-License-Identifier: Apache-2.0
# The lab's events service: NATS JetStream with accounts and per-user permissions.
#
# Who may publish a subject is what makes a pinned `source` mean anything: the StackStorm bridge
# and A03 act on a decision.returned with source svc:broker, so only the broker's user may publish
# <prefix>.homelabnext.decision.> and <prefix>.homelabnext.proposal.> (docs/broker.md, "The bus
# ACL"; docs/stackstorm.md).  Every user in HNX gets an allow-list and nothing else: no wildcard
# over $JS.API, so no STREAM.PURGE, STREAM.UPDATE, STREAM.DELETE or MSG.DELETE for anyone, and
# each user's replies arrive on its own inbox prefix (_INBOX.<user>, the adapter's default for a
# user), never on a shared _INBOX.> (that stops another user READING them; it cannot stop a forged
# reply, since a reply subject is not checked against anyone's allow-list, so each client matches
# its replies by its own unguessable inbox token).  No user but hnx-lab-admin may create a
# consumer: a create takes a push deliver_subject, which the server delivers as itself to any
# subject (another user's _INBOX included), whatever the creator may publish to.  hnx-lab-admin
# pre-creates the bridge's PULL durables (the filtered form
# $JS.API.CONSUMER.CREATE.<stream>.<durable>.<filter>, no deliver_subject; broker_e2e.py, the
# events_bus role's provisioner on a deployment); the bridge binds to them with INFO, MSG.NEXT and
# its acks.  Its acks are granted in both of ADR-15's reply-subject forms, each token for token as the
# consumer subscribes to it, never a wildcard over the stream or consumer tokens: v1
# $JS.ACK.<stream>.<durable>.*.*.*.*.* (exactly 9 tokens) and v2
# $JS.ACK.<domain>.<account hash>.<stream>.<durable>.*.*.*.*.> (11 or more), with the domain "_"
# (none is configured) and the account's hash (server/events.go getHash: the first 8 bytes of
# sha256(account name), each mod 62 into 0-9A-Za-z; "hKkTAyOX" for HNX).  nats-server 2.15.1 sends
# v1; upstream main enables js_ack_fc_v2 (v2) in 2.16 and removes the flag in 2.17, and a grant
# of one form alone would then refuse every ack, so each delivery would run to max_deliver.
#
#   HNX      the standing bus: stream HNXLAB_BROKER (subjects hnxlab.>) and its DLQ, and the
#            bridge's durables, provisioned (with limits) by hnx-lab-admin (broker_e2e.py), never by
#            a client
#   CONFORM  `hnx conform run events` (smoke.sh): scratch streams of its own; a separate account,
#            so nothing it does can reach the HNX subjects or streams, with its own JetStream
#            limits (8 MiB memory, 256 MiB file, 64 streams, 256 consumers), so scratch streams a
#            failed run leaves behind cannot take the server's whole store from HNX
#
# <prefix>.homelabnext.agent.job.> (agent.job.failed, which StackStorm's A02 acts on) belongs to
# the orchestration controller's user and nobody else's.  The lab runs no controller, so no user
# here may publish it at all; a deployment grants it to the controller's user only
# (docs/stackstorm.md).
#
# Passwords come from the environment (docker-compose.yml, from .env.example: fake placeholders).
# The format is the JSON subset of the NATS config syntax, plus `$VAR` references and `#` comment
# lines, so tests/compose can read the permissions the server enforces (and the docs' excerpts).
{
  "port": 4222,
  "http_port": 8222,
  "jetstream": {"store_dir": "/data", "max_memory_store": 33554432, "max_file_store": 1073741824},
  "accounts": {
    "HNX": {
      "jetstream": "enabled",
      "users": [
        {"user": "hnx-broker", "password": $LAB_EVENTS_BROKER_PASSWORD,
         "permissions": {
           "publish": {"allow": ["hnxlab.homelabnext.decision.>", "hnxlab.homelabnext.proposal.>",
                                 "$JS.API.STREAM.INFO.HNXLAB_BROKER",
                                 "$JS.API.STREAM.INFO.HNXLAB_BROKER_DLQ"]},
           "subscribe": {"allow": ["_INBOX.hnx-broker.>"]}}},
        {"user": "hnx-st2-bridge", "password": $LAB_EVENTS_ST2_BRIDGE_PASSWORD,
         "permissions": {
           "publish": {"allow": ["$JS.API.STREAM.INFO.HNXLAB_BROKER",
                                 "$JS.API.STREAM.INFO.HNXLAB_BROKER_DLQ",
                                 "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-agent-job-failed",
                                 "$JS.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-agent-job-failed",
                                 "$JS.ACK.HNXLAB_BROKER.st2-agent-job-failed.*.*.*.*.*",
                                 "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-agent-job-failed.*.*.*.*.>",
                                 "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-decision-returned",
                                 "$JS.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-decision-returned",
                                 "$JS.ACK.HNXLAB_BROKER.st2-decision-returned.*.*.*.*.*",
                                 "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-decision-returned.*.*.*.*.>",
                                 "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-proposal-created",
                                 "$JS.API.CONSUMER.MSG.NEXT.HNXLAB_BROKER.st2-proposal-created",
                                 "$JS.ACK.HNXLAB_BROKER.st2-proposal-created.*.*.*.*.*",
                                 "$JS.ACK._.hKkTAyOX.HNXLAB_BROKER.st2-proposal-created.*.*.*.*.>"]},
           "subscribe": {"allow": ["_INBOX.hnx-st2-bridge.>"]}}},
        {"user": "hnx-lab-admin", "password": $LAB_EVENTS_ADMIN_PASSWORD,
         "permissions": {
           "publish": {"allow": ["$JS.API.STREAM.INFO.HNXLAB_BROKER",
                                 "$JS.API.STREAM.INFO.HNXLAB_BROKER_DLQ",
                                 "$JS.API.STREAM.CREATE.HNXLAB_BROKER",
                                 "$JS.API.STREAM.CREATE.HNXLAB_BROKER_DLQ",
                                 "$JS.API.STREAM.MSG.GET.HNXLAB_BROKER",
                                 "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-agent-job-failed",
                                 "$JS.API.CONSUMER.CREATE.HNXLAB_BROKER.st2-agent-job-failed.hnxlab.homelabnext.agent.job.failed",
                                 "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-decision-returned",
                                 "$JS.API.CONSUMER.CREATE.HNXLAB_BROKER.st2-decision-returned.hnxlab.homelabnext.decision.returned",
                                 "$JS.API.CONSUMER.INFO.HNXLAB_BROKER.st2-proposal-created",
                                 "$JS.API.CONSUMER.CREATE.HNXLAB_BROKER.st2-proposal-created.hnxlab.homelabnext.proposal.created"]},
           "subscribe": {"allow": ["_INBOX.hnx-lab-admin.>"]}}}
      ]
    },
    "CONFORM": {
      "jetstream": {"max_mem": 8388608, "max_file": 268435456, "max_streams": 64,
                    "max_consumers": 256},
      "users": [
        {"user": "hnx-conformance", "password": $LAB_EVENTS_CONFORMANCE_PASSWORD}
      ]
    }
  }
}
