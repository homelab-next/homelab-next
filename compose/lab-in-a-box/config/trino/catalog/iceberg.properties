# Iceberg tables through the REST catalog; object storage through the S3 API with static fake
# credentials (substituted from the container environment by Trino).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lake-catalog.svc.example.internal:8181/catalog
iceberg.rest-catalog.warehouse=${ENV:LAB_WAREHOUSE}
iceberg.rest-catalog.vended-credentials-enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://object-store.svc.example.internal:3900
s3.region=${ENV:LAB_S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:LAB_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:LAB_S3_SECRET_KEY}
