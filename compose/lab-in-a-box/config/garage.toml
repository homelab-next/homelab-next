# Single-node object store for the lab-in-a-box.  The rpc secret and admin token come from the
# environment (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN), never from this file.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.lab.example"

[admin]
api_bind_addr = "[::]:3903"
