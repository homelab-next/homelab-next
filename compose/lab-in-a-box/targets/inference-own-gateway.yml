# SPDX-License-Identifier: Apache-2.0
# inference through the lab's own LLM gateway (ADR-0038: the orchestrator's cmd/gateway, built from
# its private repository) on the conformance gateway spec, never a lab's: render
# config/llm-gateway-conformance/gateway.yml with the test-only option (--conformance, and
# a loopback --conformance-host when everything runs on one machine), start the fake inference
# server and the gateway in its -conformance mode on loopback, export HNX_ENDPOINT_LLM_GATEWAY
# and every HNX_SECRET_* the rendered gateway.json names (docs/llm-gateway.md, "Running the suite
# against the lab's own gateway").  Not in smoke.sh: the gateway is not part of the lab-in-a-box.
#
# Every feature the acceptance run of ADR-0038 decision 7 names.  The plain client sends no
# X-HNX-TLP, so model, embed_model and throttle_model are roles that stay in the lab; the tlp-admit
# checks send the header themselves.
name: lab-inference-own-gateway
capabilities:
  inference:
    adapter: homelabnext.conform.adapters.llm_gateway:make
    features: [streaming, embeddings, gateway, tlp-ceiling, tlp-admit, turn-records]
    config:
      roles: compose/lab-in-a-box/config/llm-gateway-conformance/model_roles.json
      model: fast-classifier
      embed_model: embedder
      capability: llm-gateway
      # gateway-limit-throttles: 3 a minute (a rerun inside the minute starts on a used-up key)
      throttle_key: secret:llm-gateway/key-conformance-throttle
      throttle_model: fast-classifier
      throttle_requests: 3
      # tlp-ceiling: a red-ceiling key is scoped away from the role that leaves the lab
      over_ceiling_key: secret:llm-gateway/key-conformance-red
      over_ceiling_model: cloud-reasoner
      over_ceiling_served: fast-classifier
      # tlp-admit: a clear-ceiling sender, the role that leaves the lab and one that stays
      tlp_sender_key: secret:llm-gateway/key-conformance-clear
      tlp_model: cloud-reasoner
      tlp_local_model: fast-classifier
      failover_model: failover
      # read back over /v1/usage: what served it was fast-classifier, never spare
      failover_served: fast-classifier-1
      # turn-records: tagged calls of this run, read back over GET /v1/usage
      telemetry_key: secret:llm-gateway/key-telemetry-reader
