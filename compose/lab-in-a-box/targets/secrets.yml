# SPDX-License-Identifier: Apache-2.0
# secrets on the lab's OpenBao (dev mode; HNX_ENDPOINT_SECRETS from smoke.sh, the throwaway root
# token from LAB_SECRETS_DEV_TOKEN in .env.example).  KV v2 for versions; leases are child tokens.
# Every check uses its own namespace under secret/hnx-conform/, removed afterwards.
name: lab-secrets
capabilities:
  secrets:
    adapter: homelabnext.conform.adapters.openbao:make
    config:
      token_env: LAB_SECRETS_DEV_TOKEN
      mount: secret
