# SPDX-License-Identifier: Apache-2.0
#
# Lab-in-a-box: a laptop/CI-sized reference environment for the capability seams, inside a 4 GB
# RAM budget (the sum of the mem_limit values below is asserted by tests/compose):
# the mem_limit values sum to 3584 MB of the 3584 MB the test allows (4 GB less OS/docker headroom);
# the broker end-to-end services took the last 256 MB.  Services under a compose profile (the LLM
# gateway: `--profile gateway`) are not started by default and are
# budgeted on their own: the gateway profiles' mem_limit values sum to 960 MB (tests/compose).  StackStorm (MongoDB, RabbitMQ and its own
# services) and NiFi (a 1 GB default heap) do not fit; the status hub tests them against
# source-verified responses instead (tests/status/test_status_products.py).
#
# Every capability is reachable inside the compose network by its registry alias
# <capability>.svc.example.internal, so clients resolve it the same way they will on a real lab.
# Settings come from the env file; run through the helper so the defaults are applied:
#
#   docker compose --env-file .env.example -f docker-compose.yml up -d --wait
#
# Everything here is fake: throwaway credentials, in-memory or scratch volumes, documentation
# addresses.  Images are pinned by tag AND digest; bump both together in one reviewed change.
name: hnx-lab

x-restart: &restart
  restart: "no"
  init: true

# Least privilege for every container (see tests/compose).  The exceptions are spelled out where
# they occur: postgres adds back the capabilities its entrypoint needs to chown the data directory
# and switch user.
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: ${LAB_SUBNET:-198.51.100.0/24}

volumes:
  postgres-data:
  object-store-meta:
  object-store-data:
  events-data:
  query-data:
  uptime-data:
  broker-run:
  broker-data:
  broker-state:
  broker-outbox:   # <state>/outbox: the broker writes it, the relay only reads it
  broker-relay:    # <state>/relay: the relay's markers; the broker only reads them
  orchestrator-state:

services:
  # --- object-store: S3 API ---------------------------------------------------------------
  object-store:
    <<: [*restart, *hardened]
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: ["/garage", "server"]
    environment:
      GARAGE_RPC_SECRET: ${LAB_OBJECT_STORE_RPC_SECRET:?see .env.example}
      GARAGE_ADMIN_TOKEN: ${LAB_OBJECT_STORE_ADMIN_TOKEN:?see .env.example}
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - object-store-meta:/var/lib/garage/meta
      - object-store-data:/var/lib/garage/data
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_OBJECT_STORE:-3900}:3900"
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_OBJECT_STORE_ADMIN:-3903}:3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 192m
    networks:
      lab:
        aliases: [garage, object-store.svc.example.internal]

  # --- postgres: catalog metadata ---------------------------------------------------------
  postgres:
    <<: [*restart, *hardened]
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_POSTGRES_PASSWORD:?see .env.example}
      POSTGRES_DB: catalog
      # read once, by config/postgres/init/10-litellm.sh: the LLM gateway's own role and schema
      LAB_GATEWAY_DB_PASSWORD: ${LAB_GATEWAY_DB_PASSWORD:?see .env.example}
    # the entrypoint chowns the data directory, then drops to the postgres user
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "fsync=off"]
    # 18+: PGDATA is /var/lib/postgresql/18/docker and the image's VOLUME is /var/lib/postgresql,
    # so the volume mounts there.  The 18 entrypoint exits on a mount at the old .../data, or on
    # a volume a 16 server initialised: recreate it (`docker compose down -v`; CHANGELOG).
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    # over TCP: the entrypoint's init server listens on the socket only, so a socket probe
    # would call postgres healthy while /docker-entrypoint-initdb.d is still running
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    networks:
      lab:
        aliases: [postgres.svc.example.internal]

  # --- lake-catalog: Iceberg REST catalog -------------------------------------------------
  catalog-migrate:
    <<: [*restart, *hardened]
    image: quay.io/lakekeeper/catalog:v0.14.1@sha256:7c5d6b178a1b5ae230bd7d3e7a09da4704ce58fafc66a8b90c3b6edb69ba9817
    command: ["migrate"]
    environment: &catalog-env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lab:${LAB_POSTGRES_PASSWORD}@postgres:5432/catalog
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lab:${LAB_POSTGRES_PASSWORD}@postgres:5432/catalog
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAB_CATALOG_ENCRYPTION_KEY:?see .env.example}
      RUST_LOG: warn
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    networks: [lab]

  lake-catalog:
    <<: [*restart, *hardened]
    image: quay.io/lakekeeper/catalog:v0.14.1@sha256:7c5d6b178a1b5ae230bd7d3e7a09da4704ce58fafc66a8b90c3b6edb69ba9817
    command: ["serve"]
    environment: *catalog-env
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_CATALOG:-8181}:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 256m
    networks:
      lab:
        aliases: [lake-catalog.svc.example.internal]

  # --- one-shot initialiser: object-store layout/bucket/key + catalog bootstrap/warehouse ---
  lab-init:
    <<: [*restart, *hardened]
    image: hnx-lab-fakes:local
    build:
      context: ../..
      dockerfile: compose/lab-in-a-box/fakes/Dockerfile
    command: ["python", "/app/lab_init.py"]
    environment:
      LAB_S3_ACCESS_KEY: ${LAB_S3_ACCESS_KEY:?see .env.example}
      LAB_S3_SECRET_KEY: ${LAB_S3_SECRET_KEY:?see .env.example}
      LAB_S3_BUCKET: ${LAB_S3_BUCKET:?see .env.example}
      LAB_S3_REGION: ${LAB_S3_REGION:?see .env.example}
      LAB_WAREHOUSE: ${LAB_WAREHOUSE:?see .env.example}
      LAB_OBJECT_STORE_ADMIN_TOKEN: ${LAB_OBJECT_STORE_ADMIN_TOKEN:?see .env.example}
      LAB_OBJECT_STORE_ADMIN_URL: http://object-store.svc.example.internal:3903
      LAB_S3_URL: http://object-store.svc.example.internal:3900
      LAB_CATALOG_URL: http://lake-catalog.svc.example.internal:8181
    depends_on:
      object-store:
        condition: service_healthy
      lake-catalog:
        condition: service_healthy
    mem_limit: 64m
    networks: [lab]

  # --- lake-query: Trino, single node, tiny heap ------------------------------------------
  lake-query:
    <<: [*restart, *hardened]
    image: trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    environment:
      LAB_WAREHOUSE: ${LAB_WAREHOUSE:?see .env.example}
      LAB_S3_REGION: ${LAB_S3_REGION:?see .env.example}
      LAB_S3_ACCESS_KEY: ${LAB_S3_ACCESS_KEY:?see .env.example}
      LAB_S3_SECRET_KEY: ${LAB_S3_SECRET_KEY:?see .env.example}
    volumes:
      # the whole etc directory (config, jvm.config, node.properties, catalog/): nothing in the
      # image's own etc is used
      - ./config/trino:/etc/trino:ro
      - query-data:/data/trino
    depends_on:
      lab-init:
        condition: service_completed_successfully
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_QUERY:-8080}:8080"
    healthcheck:
      # the image's own check (bash builtins and curl): since 484 the image has no grep to pipe
      # /v1/info through. It reads the port from config.properties and passes once the server
      # reports "starting":false.
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: 1232m  # the JVM heap is 896M (config/trino/jvm.config); 336M is left off-heap
    networks:
      lab:
        aliases: [lake-query.svc.example.internal]

  # --- events: NATS JetStream -------------------------------------------------------------
  # Accounts and per-user permissions (config/nats/nats.conf): only the broker's user may publish
  # the broker's subjects; no client connects without a user.  Since 2.12 the filestore's caches
  # give memory back under GC pressure, which GOMEMLIMIT sets (Go does not derive it from the
  # cgroup): below mem_limit, so the server frees caches before the kernel kills it.
  events:
    <<: [*restart, *hardened]
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      LAB_EVENTS_BROKER_PASSWORD: ${LAB_EVENTS_BROKER_PASSWORD:?see .env.example}
      LAB_EVENTS_ST2_BRIDGE_PASSWORD: ${LAB_EVENTS_ST2_BRIDGE_PASSWORD:?see .env.example}
      LAB_EVENTS_ADMIN_PASSWORD: ${LAB_EVENTS_ADMIN_PASSWORD:?see .env.example}
      LAB_EVENTS_CONFORMANCE_PASSWORD: ${LAB_EVENTS_CONFORMANCE_PASSWORD:?see .env.example}
      GOMEMLIMIT: 96MiB
    volumes:
      - events-data:/data
      - ./config/nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_EVENTS:-4222}:4222"
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_EVENTS_MONITOR:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 128m
    networks:
      lab:
        aliases: [events.svc.example.internal]

  # --- secrets: OpenBao in dev mode (in memory, auto-unsealed; never for real secrets) ----
  # ==========================================================================================
  # DEV MODE. This is not a secrets service anything may rely on:
  #   * no persistence: storage is in memory, every secret is gone when the container stops;
  #   * no TLS: the API is plain HTTP;
  #   * a known root token: LAB_SECRETS_DEV_TOKEN is a root token, published in .env.example,
  #     and dev mode starts unsealed, so whoever reaches the port owns the instance.
  # It is published on LAB_BIND only, loopback by default; bind_guard.sh refuses anything else
  # while the token is still the placeholder.  Production uses OpenBao in server mode instead:
  # integrated (raft) storage, TLS, real unseal keys or auto-unseal, and the root token revoked
  # after initialisation (docs/architecture.md, "The reference environment").
  # It runs hardened like the rest: since 2.6 the image starts as the openbao user, so its
  # entrypoint neither chowns nor switches user, and OpenBao has not used mlock since 2.0 (no
  # IPC_LOCK).
  # ==========================================================================================
  secrets:
    <<: [*restart, *hardened]
    image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    # the image's own default since 2.2: the root token is not written to ~/.vault-token
    command: ["server", "-dev", "-dev-no-store-token"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${LAB_SECRETS_DEV_TOKEN:?see .env.example}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_SECRETS:-8200}:8200"
    healthcheck:
      # dev mode listens on IPv4 only, and "localhost" resolves to IPv6 first in this image
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    networks:
      lab:
        aliases: [secrets.svc.example.internal]

  # --- notify: ntfy -----------------------------------------------------------------------
  notify:
    <<: [*restart, *hardened]
    image: binwiederhier/ntfy:v2.33.1@sha256:29bc952294d58957f6ca6638eca9a653a33555989224edbdf4bb9433ee606497
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://notify.svc.example.internal
      NTFY_LISTEN_HTTP: ":80"
    cap_add: [NET_BIND_SERVICE]  # listens on port 80 inside the container
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_NOTIFY:-8090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 96m
    networks:
      lab:
        aliases: [notify.svc.example.internal]

  # --- inference: the project's fake OpenAI-compatible server -----------------------------
  inference:
    <<: [*restart, *hardened]
    image: hnx-lab-fakes:local
    build:
      context: ../..
      dockerfile: compose/lab-in-a-box/fakes/Dockerfile
    # example-4b, example-27b and example-embed-8d: the bindings of model_roles.valid.json (the
    # gateway profile; the last is the embedding role's)
    command: ["python", "/app/openai_server.py", "--host", "0.0.0.0", "--allow-any-host",
              "--port", "8000", "--model", "example-4b", "--model", "example-27b",
              "--model", "example-embed-8d"]
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_INFERENCE:-8001}:8000"
    healthcheck: &fake-health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 64m
    networks:
      lab:
        # inference-large/-small: the svc: backends the role table binds (config/llm-gateway)
        aliases: [inference.svc.example.internal, inference-large.svc.example.internal,
                  inference-small.svc.example.internal]

  # --- cases: the project's fake case system ----------------------------------------------
  cases:
    <<: [*restart, *hardened]
    image: hnx-lab-fakes:local
    build:
      context: ../..
      dockerfile: compose/lab-in-a-box/fakes/Dockerfile
    command: ["python", "/app/fake_cases.py", "--port", "8000"]
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_CASES:-8002}:8000"
    healthcheck: *fake-health
    mem_limit: 64m
    networks:
      lab:
        aliases: [cases.svc.example.internal]

  # --- metrics: Prometheus scraping itself, with two rules that always fire ---------------
  # The status hub's poll-prometheus collector reads it in smoke_checks.py: the alerts mapping
  # sees a warning and a critical alert, the query mapping sees the self-scrape target up.
  metrics:
    <<: [*restart, *hardened]
    # Prometheus 3: retention lives in prometheus.yml (`storage.tsdb.retention`); the
    # --storage.tsdb.retention.time flag is deprecated and --storage.tsdb.retention is gone.
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_METRICS:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 192m
    networks:
      lab:
        aliases: [metrics.svc.example.internal]

  # --- uptime: Uptime Kuma, provisioned headlessly by uptime-init -------------------------
  # The slim rootless image: no embedded MariaDB or Chromium (the lab uses SQLite and HTTP
  # monitors), and it runs as the image's own `node` user (uid 1000), which owns /app/data in the
  # image and so in a fresh volume: no capability is added back.  UPTIME_KUMA_DB_TYPE picks
  # SQLite without the first-run "setup database" page, which would otherwise hold the server
  # (and answer /api/entry-page with type setup-database, hence the health check reads the type).
  # Kuma tries `sudo service nscd start` and logs that it failed: no-new-privileges, by design.
  uptime:
    <<: [*restart, *hardened]
    image: louislam/uptime-kuma:2.5.6-slim-rootless@sha256:6eb4e96a7cbdb8a5d6779aa26dce2cb97dcea65b486856b9b2280f73a1d0adf4
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - uptime-data:/app/data
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_UPTIME:-3001}:3001"
    healthcheck: &kuma-health
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/entry-page', r => { let b = ''; r.on('data', c => b += c); r.on('end', () => process.exit(r.statusCode === 200 && /\"type\":\"entryPage\"/.test(b) ? 0 : 1)); }).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 256m
    networks:
      lab:
        aliases: [uptime.svc.example.internal]

  # Uptime Kuma (2.x as 1.x) has no REST API for setup, monitors or status pages; this runs
  # config/uptime/provision.js in the same image, with its own socket.io client (the API the
  # UI uses): admin user, a monitor that answers (metrics) and one that cannot (a closed port),
  # their first heartbeats, then the public status page "lab".  It stays up once done and is
  # healthy only then, so `up --wait` returns with the page in place.
  uptime-init:
    <<: [*restart, *hardened]
    image: louislam/uptime-kuma:2.5.6-slim-rootless@sha256:6eb4e96a7cbdb8a5d6779aa26dce2cb97dcea65b486856b9b2280f73a1d0adf4
    entrypoint: ["node", "/provision/provision.js"]
    working_dir: /app
    environment:
      NODE_PATH: /app/node_modules
      KUMA_URL: http://uptime.svc.example.internal:3001
      KUMA_USERNAME: lab
      KUMA_PASSWORD: ${LAB_UPTIME_PASSWORD:?see .env.example}
      KUMA_SLUG: lab
      KUMA_UP_URL: http://metrics.svc.example.internal:9090/-/healthy
      KUMA_DOWN_URL: http://metrics.svc.example.internal:9/
      KUMA_MARKER: /tmp/provisioned.json
    volumes:
      - ./config/uptime/provision.js:/provision/provision.js:ro
    depends_on:
      uptime:
        condition: service_healthy
      metrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/provisioned.json"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 96m
    networks: [lab]

  # --- broker end to end (ADR-0017; docs/broker.md, "Testing") ----------------------------
  # Three containers, three users, one socket on a shared volume.  The broker serves the example
  # production manifest (examples/broker/manifest.production.yml: callers and the relay by system
  # user, created in broker/Dockerfile); the hub relays approvals to it; broker-edge plays the
  # edge in front of the hub (its address is the hub's one trusted proxy) and starts every other
  # peer of the socket as its own uid: the agent's `hnx broker mcp`, an unmapped uid and the
  # relay's audit read, and the broker's outbox relay (as its own uid, hnx-broker-relay, which
  # sees only <state>/outbox read-only and its own <state>/relay: `hnx broker relay --once`
  # publishes to the events service while the broker itself keeps no network).  smoke_checks.py
  # runs broker_e2e.py in it.  Nothing here is published.
  broker:
    <<: [*restart, *hardened]
    image: hnx-lab-broker:local
    build: &broker-build
      context: ../..
      dockerfile: compose/lab-in-a-box/broker/Dockerfile
    user: "10010:10010"
    group_add: ["10020"]  # SupplementaryGroups=hnx-broker-clients, to give the socket that group
    command: ["python", "-m", "homelabnext.cli", "broker", "serve",
              "--manifest", "/src/examples/broker/manifest.production.yml",
              "--state", "/var/lib/hnx-broker/state", "--data-root", "/srv/agents",
              "--socket", "/run/hnx-broker/broker.sock", "--socket-mode", "660",
              "--socket-group", "hnx-broker-clients"]
    environment:
      HNX_BROKER_SECRET_DEMO_API_TOKEN: ${LAB_BROKER_DEMO_TOKEN:?see .env.example}
    volumes:
      - broker-run:/run/hnx-broker
      - broker-data:/srv/agents
      - broker-state:/var/lib/hnx-broker
      - broker-outbox:/var/lib/hnx-broker/state/outbox
      - broker-relay:/var/lib/hnx-broker/state/relay:ro  # read to prune the outbox
    network_mode: none  # the broker has no network listener; its socket is its only door
    healthcheck:
      test: ["CMD", "test", "-S", "/run/hnx-broker/broker.sock"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 48m  # measured peak 35 MB

  status-hub:
    <<: [*restart, *hardened]
    image: hnx-lab-broker:local
    build: *broker-build
    user: "10012:10012"
    group_add: ["10020"]  # hnx-broker-clients: may connect to the socket
    command: ["python", "/src/compose/lab-in-a-box/broker_e2e.py", "serve-hub",
              "--dir", "/var/lib/hnx-hub", "--bind", "0.0.0.0", "--port", "8099"]
    environment:
      LAB_BROKER_EDGE_ADDRESS: ${LAB_BROKER_EDGE_ADDRESS:?see .env.example}
      HNX_SECRET_STATUS_FRONT_DOOR_SECRET: ${LAB_HUB_FRONT_DOOR_SECRET:?see .env.example}
    volumes:
      - broker-run:/run/hnx-broker
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8099/status.json', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 64m  # measured peak 42 MB
    networks:
      lab:
        aliases: [status-hub.svc.example.internal]

  # root with only SETUID/SETGID: it starts each peer as that peer's uid (broker_e2e.py as ...);
  # in the broker's group only to stat the lane file the agent wrote (the data root is read-only)
  broker-edge:
    <<: [*restart, *hardened]
    image: hnx-lab-broker:local
    build: *broker-build
    user: "0:0"
    cap_add: [SETUID, SETGID]
    group_add: ["10010", "10020"]
    command: ["sleep", "infinity"]
    environment:
      HNX_SECRET_STATUS_FRONT_DOOR_SECRET: ${LAB_HUB_FRONT_DOOR_SECRET:?see .env.example}
      MALLOC_ARENA_MAX: "2"
      # the bus-relay and bus-acl steps: the broker's relay publishes its outbox to the events
      # service as hnx-broker (the relay's process gets only that password); the operator
      # (hnx-lab-admin) provisions the stream and reads it back; hnx-st2-bridge tries to forge
      # one, then reads and acks through its own durable (its acks must take)
      HNX_ENDPOINT_EVENTS: nats://events.svc.example.internal:4222
      LAB_BROKER_EVENTS_TARGET: /src/compose/lab-in-a-box/broker/events-relay.yml
      HNX_SECRET_EVENTS_BROKER: ${LAB_EVENTS_BROKER_PASSWORD:?see .env.example}
      HNX_SECRET_EVENTS_ST2_BRIDGE: ${LAB_EVENTS_ST2_BRIDGE_PASSWORD:?see .env.example}
      HNX_SECRET_EVENTS_ADMIN: ${LAB_EVENTS_ADMIN_PASSWORD:?see .env.example}
    volumes:
      - broker-run:/run/hnx-broker
      - broker-data:/srv/agents:ro
      # the relay's view of the broker's state, nothing more: approvals/, claims/, the audit
      # trail and the digest key are not mounted here
      - broker-outbox:/var/lib/hnx-broker/state/outbox:ro
      - broker-relay:/var/lib/hnx-broker/state/relay
    depends_on:
      broker:
        condition: service_healthy
      status-hub:
        condition: service_healthy
      events:
        condition: service_healthy
    healthcheck:  # a shell test, not python: the scenario's processes need the memory
      test: ["CMD", "test", "-S", "/run/hnx-broker/broker.sock"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 144m  # measured peak 120 MB: the MCP client and server, one CLI at a time
    networks:
      lab:
        ipv4_address: ${LAB_BROKER_EDGE_ADDRESS:?see .env.example}

  # --- LLM gateway (optional; docs/llm-gateway.md, ADR-0022) -------------------------------------
  # Not started by `make lab-up`: `docker compose --profile gateway up` adds LiteLLM (the chosen
  # gateway) on the lab's own postgres, in its own schema and role.  It serves the role aliases of schemas/platform/examples/model_roles.valid.json in
  # front of the fake inference server, from config generated by `hnx gen gateway render`
  # (config/llm-gateway, never edited by hand).  Conformance: targets/inference-gateway.yml.
  # --- orchestration: the controller (orchestrator/cmd/controller) -------------------------
  # Built from this checkout, with the exec runner running /bin/sh sessions (no model): the smoke
  # submits a job through the job API and waits for it to finish (smoke_checks.py: orchestration).
  # The entrypoint writes the tokens file from HNX_SECRET_ORCHESTRATOR_TOKEN's digest.
  orchestrator:
    <<: [*restart, *hardened]
    image: hnx-lab-orchestrator:local
    build:
      context: ../..
      dockerfile: compose/lab-in-a-box/orchestrator/Dockerfile
    command: ["/bin/sh", "/app/entrypoint.sh"]
    environment:
      HNX_SECRET_ORCHESTRATOR_TOKEN: ${LAB_ORCHESTRATOR_TOKEN:?see .env.example}
      GOMEMLIMIT: 32MiB  # below mem_limit, so the collector works before the kernel kills it
    volumes:
      - orchestrator-state:/var/lib/orchestrator
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_ORCHESTRATOR:-8088}:8088"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8088/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 48m
    networks:
      lab:
        aliases: [orchestration.svc.example.internal]

  llm-gateway:
    <<: [*restart, *hardened]
    profiles: [gateway]
    image: litellm/litellm-database:v1.106.3@sha256:f631537bfc317970ceda5fac99b436161cb7a78d515d7037226de396a71b9bf9
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      HNX_SECRET_LLM_GATEWAY_MASTER_KEY: ${LAB_GATEWAY_MASTER_KEY:?see .env.example}
      # keys and limits live in postgres: without it a wrong key is "No connected db", not a 401.
      # Role litellm owns only schema litellm (config/postgres/init), never the lab superuser.
      HNX_SECRET_LLM_GATEWAY_DATABASE_URL: postgresql://litellm:${LAB_GATEWAY_DB_PASSWORD:?see .env.example}@postgres.svc.example.internal:5432/catalog?schema=litellm
      LITELLM_SALT_KEY: ${LAB_GATEWAY_SALT_KEY:?see .env.example}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"  # the bundled cost map: no download at startup
      LITELLM_TELEMETRY: "False"
    volumes:
      - ./config/llm-gateway/litellm/config.yaml:/etc/litellm/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_healthy
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LAB_PORT_GATEWAY:-4000}:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 896m  # measured on 1.106.2: 604 MB RSS, 692 MB cgroup peak (1.103.7: 528 and 621)
    networks:
      lab:
        aliases: [llm-gateway.svc.example.internal]

  # one-shot: LiteLLM keeps virtual keys in postgres, not in its config file, so the generated
  # keys.json is applied through the admin API (idempotent; a rotated value replaces the old key)
  llm-gateway-keys:
    <<: [*restart, *hardened]
    profiles: [gateway]
    image: hnx-lab-broker:local
    build: *broker-build
    command: ["python", "-m", "homelabnext.cli", "gen", "gateway", "provision",
              "/etc/llm-gateway/keys.json", "--allow-plaintext"]
    environment:
      HNX_ENDPOINT_LLM_GATEWAY: http://llm-gateway.svc.example.internal:4000
      HNX_SECRET_LLM_GATEWAY_MASTER_KEY: ${LAB_GATEWAY_MASTER_KEY:?see .env.example}
      HNX_SECRET_LLM_GATEWAY_KEY_READER: ${LAB_GATEWAY_KEY_READER:?see .env.example}
      HNX_SECRET_LLM_GATEWAY_KEY_RESPONDER: ${LAB_GATEWAY_KEY_RESPONDER:?see .env.example}
      HNX_SECRET_LLM_GATEWAY_KEY_CONFORMANCE_THROTTLE: ${LAB_GATEWAY_KEY_THROTTLE:?see .env.example}
    volumes:
      - ./config/llm-gateway/litellm/keys.json:/etc/llm-gateway/keys.json:ro
    depends_on:
      llm-gateway:
        condition: service_healthy
    mem_limit: 64m
    networks: [lab]
