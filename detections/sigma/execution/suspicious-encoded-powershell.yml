# SPDX-License-Identifier: Apache-2.0
title: Suspicious encoded PowerShell command line
det: det:suspicious-encoded-powershell
description: PowerShell launched with an encoded command argument, a common way to hide a payload.
status: experimental
logsource: {category: process_creation, product: windows}
detection:
  selection_img:
    Image|endswith: ['\powershell.exe', '\pwsh.exe']
  selection_flag:
    CommandLine|contains: [' -enc ', ' -encodedcommand ', ' -ec ']
  filter_mgmt:
    ParentImage|endswith: '\ccmexec.exe'
  condition: all of selection_* and not filter_mgmt
level: high
tags: [attack.execution, attack.t1059.001]
falsepositives: [Software deployment agents that wrap scripts in encoded commands]
