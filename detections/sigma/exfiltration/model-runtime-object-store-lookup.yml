# SPDX-License-Identifier: Apache-2.0
title: A model runtime looked up a public cloud object store
det: det:model-runtime-object-store-lookup
description: >
  A guest that serves models or runs model-written code resolved a public cloud
  object-storage endpoint. A lab model runtime has no reason to: its weights come from the lab's
  model store. An open-weight model has been reported (2026-10) to list /tmp, read the resolver
  configuration and attempt an HTTP PUT of a file to a cloud bucket while asked to write a
  detection rule. The egress filter refuses the connection; this rule says it was attempted.
  The pipeline labels a model runtime's events (labels.hnx_runtime: model) from the guest
  model, by the address the collector saw (docs/log-pipeline.md); the event's own label is
  never kept. Each endpoint is listed with and without the root's trailing
  dot; the list is the same in det:model-runtime-object-store-lookup and
  det:model-runtime-object-store-request.
status: experimental
logsource: {category: dns}
detection:
  selection_runtime:
    Runtime: model
  selection_store:
    DnsQueryName|endswith:
        - .aliyuncs.com
        - .aliyuncs.com.
        - .amazonaws.com
        - .amazonaws.com.
        - .blob.core.windows.net
        - .blob.core.windows.net.
        - .storage.googleapis.com
        - .storage.googleapis.com.
        - .r2.cloudflarestorage.com
        - .r2.cloudflarestorage.com.
        - .backblazeb2.com
        - .backblazeb2.com.
        - .digitaloceanspaces.com
        - .digitaloceanspaces.com.
        - .wasabisys.com
        - .wasabisys.com.
        - .myqcloud.com
        - .myqcloud.com.
        - .myhuaweicloud.com
        - .myhuaweicloud.com.
  condition: selection_runtime and selection_store
level: high
tags: [attack.exfiltration, attack.t1567.002]
falsepositives: [A model runtime deliberately fetching weights from a cloud bucket; give it the lab model store instead]
