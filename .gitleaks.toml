# gitleaks configuration: the default ruleset plus allowances for exact, known-fake values only.
# Each entry matches one whole secret string (regexTarget = "secret", anchored), so nothing else in
# any file is exempt: a real credential added next to a fixture is still caught.  No allowance is
# path-scoped, because gitleaks 8.28 skips an allowlisted path entirely (condition = "AND" does
# not narrow it).  A new fixture line can instead carry an inline `gitleaks:allow` comment.
[extend]
useDefault = true

[[allowlists]]
description = "broker conformance suite: the fake secret argument it plants to prove the audit trail redacts it"
regexTarget = "secret"
regexes = ['''^tok-SECRET-123$''']

[[allowlists]]
description = "leak scanner tests (historical revision): the first half of a planted fake credential, split on purpose"
regexTarget = "secret"
regexes = ['''^Zx9Qw3Rt7Yp2$''']
