# gitleaks configuration: the default ruleset plus allowances for exact, known-fake values only.
# Each entry matches one whole secret string (regexTarget = "secret", anchored), so nothing else in
# any file is exempt: a real credential added next to a fixture is still caught.  No allowance is
# path-scoped, because gitleaks 8.28 skips an allowlisted path entirely (condition = "AND" does
# not narrow it).  A new fixture line can instead carry an inline `gitleaks:allow` comment.
[extend]
useDefault = true

[[allowlists]]
description = "broker conformance suite: the fake secret argument it plants to prove the audit trail redacts it"
regexTarget = "secret"
regexes = ['''^zq7-opaque-4b1d-fake-DO-NOT-LOG$''', '''^tok-SECRET-123$''']

[[allowlists]]
description = "leak scanner tests (historical revision): the first half of a planted fake credential, split on purpose"
regexTarget = "secret"
regexes = ['''^Zx9Qw3Rt7Yp2$''']

[[allowlists]]
description = "MCP importer tests: the fake hex key planted in a hosted URL's host name to prove it is refused and never copied"
regexTarget = "secret"
regexes = ['''^9f8e7d6c5b4a3928$''']

[[allowlists]]
description = "Go test policy tests: an import path that only ends like a quarantined package, to prove a skips.yml entry does not cover it"
regexTarget = "secret"
regexes = ['''^cmd/x/internal/api$''']

[[allowlists]]
description = "lake ceiling tests: `limit=MAX_LIMIT` (a keyword argument naming a constant), which the generic key rule reads as a value after the auth in authentication"
regexTarget = "secret"
regexes = ['''^limit=MAX_LIMIT$''']
