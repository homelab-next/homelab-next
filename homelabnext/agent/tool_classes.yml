# SPDX-License-Identifier: Apache-2.0
# Capability classes of every grant an agent profile can hold (checklist G-03, docs/agent.md
# "Readers cannot act").  A profile grants three kinds of thing, each classified:
#   mcp:           the MCP servers (tools) it may call, by catalog id.  NOT listed here: the
#                  section is derived from the MCP catalog (examples/mcp/<id>.yml, or the private
#                  overlay's; ADR-0024, docs/mcp-catalog.md), a server's classes being the union
#                  of its tools' classes.  A file passed with --classes may not have its own
#                  `mcp:` section, nor a reader_forbidden that leaves out a class listed here;
#   capabilities:  the platform capabilities (cap: ids, capabilities.yml) it may use;
#   tiers:         the broker action tier it may request (read < write < execute < privileged).
# A grant may carry several classes; it is as dangerous as the worst of them.
#
# A profile that reads raw or untrusted content (reads_untrusted) may hold NO grant in a class
# listed under reader_forbidden, and NO grant that is not classified at all (unknown is refused,
# never assumed harmless).  The compiler refuses such a reader whatever the ceiling policy
# allows, `hnx agent verify` refuses a hand-edited one, and `hnx agent lint` checks every profile
# in the repository.  Adding an MCP server = adding a catalog record, in a reviewed change.
#
# Agents act only through the broker (checklist G-13, ADR-0030, docs/agent.md "Actors act only
# through the broker"): ANY profile, reader or not, may hold a grant in a class listed under
# broker_only only through the broker.  An MCP server with a broker_only tool is granted only when
# its catalog record says `acts_via: broker` (its acting tools are broker calls), or `acts_via:
# direct` with a direct_reason, a current human approve review and the ceiling policy's
# direct_mcp entry for that profile; a broker_only capability other than cap:broker is never
# granted; and a tier whose classes are broker_only (execute, privileged) needs cap:broker.  A
# file passed with --classes may forbid more, never less (a table that leaves out a class listed
# here is refused, as for reader_forbidden).

classes:
  read: queries or fetches from a platform service; no effect outside the agent's own output
  record-write: writes structured records through a platform API that validates them (proposals, annotations, case notes, events)
  exec: runs commands, workflows, containers or broker actions with side effects (shell)
  file-write: creates or changes files, objects or repositories
  egress: sends data to a destination outside the platform (web fetch, search, browser, mail, chat, notifications, tunnels)
  send: sends a message or a request that changes something elsewhere (mail, chat, a notification, an HTTP request); an effect, so it goes through the broker (its notify actions)
  credential: reads or issues credentials (secret stores, identity providers)

reader_forbidden: [exec, file-write, egress, send, credential]

broker_only: [exec, file-write, send, credential]

tiers:
  read: [read]
  write: [record-write]
  execute: [exec]
  privileged: [exec, credential]

capabilities:
  cap:lake-query: [read]
  cap:lake-catalog: [read]
  cap:monitoring: [read]
  cap:inference: [read]
  cap:fast-classifier: [read]
  cap:context: [read]
  cap:records-propose: [record-write]
  cap:records: [record-write]
  cap:cases: [record-write]
  cap:projects: [record-write]
  cap:events: [record-write]
  cap:detections: [record-write]
  cap:object-store: [read, file-write]
  cap:notify: [egress, send]
  cap:edge: [egress]
  cap:orchestration: [exec]
  cap:broker: [exec]
  cap:hypervisor: [exec]
  cap:secrets: [credential]
  cap:idp: [credential]
  # every other capability the registry, the conformance contracts and the module slots name
  # (G-13 fails closed: a capability this table does not class is refused for every profile)
  cap:metrics: [read]
  cap:uptime: [read]
  cap:dashboards: [read]
  cap:status-hub: [read]
  cap:agent-audit: [read]
  cap:hot-index: [read]
  cap:siem-source: [read]
  cap:automation: [exec]
  cap:agent-runtime: [exec]
  cap:dataflow: [exec]
  cap:log-pipeline: [exec]
  cap:dns: [exec]
  cap:edge-proxy: [exec]
  cap:backup: [exec]
  cap:exposure-management: [exec]
  cap:records-db: [file-write]
  cap:static-hosting: [file-write]

