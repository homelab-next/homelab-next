# SPDX-License-Identifier: Apache-2.0
# Capability classes of every grant an agent profile can hold (checklist G-03, docs/agent.md
# "Readers cannot act").  A profile grants three kinds of thing, each classified here:
#   mcp:           the MCP servers (tools) it may call, by slug;
#   capabilities:  the platform capabilities (cap: ids, capabilities.yml) it may use;
#   tiers:         the broker action tier it may request (read < write < execute < privileged).
# A grant may carry several classes; it is as dangerous as the worst of them.
#
# A profile that reads raw or untrusted content (reads_untrusted) may hold NO grant in a class
# listed under reader_forbidden, and NO grant that is not classified here at all (unknown is
# refused, never assumed harmless).  The compiler refuses such a reader whatever the ceiling
# policy allows, `hnx agent verify` refuses a hand-edited one, and `hnx agent lint` checks every
# profile in the repository.  Adding a tool = adding it here, in a reviewed change.

classes:
  read: queries or fetches from a platform service; no effect outside the agent's own output
  record-write: writes structured records through a platform API that validates them (proposals, annotations, case notes, events)
  exec: runs commands, workflows, containers or broker actions with side effects (shell)
  file-write: creates or changes files, objects or repositories
  egress: sends data to a destination outside the platform (web fetch, search, browser, mail, chat, notifications, tunnels)
  credential: reads or issues credentials (secret stores, identity providers)

reader_forbidden: [exec, file-write, egress, credential]

tiers:
  read: [read]
  write: [record-write]
  execute: [exec]
  privileged: [exec, credential]

capabilities:
  cap:lake-query: [read]
  cap:lake-catalog: [read]
  cap:monitoring: [read]
  cap:inference: [read]
  cap:fast-classifier: [read]
  cap:context: [read]
  cap:records-propose: [record-write]
  cap:records: [record-write]
  cap:cases: [record-write]
  cap:projects: [record-write]
  cap:events: [record-write]
  cap:detections: [record-write]
  cap:object-store: [read, file-write]
  cap:notify: [egress]
  cap:edge: [egress]
  cap:orchestration: [exec]
  cap:broker: [exec]
  cap:hypervisor: [exec]
  cap:secrets: [credential]
  cap:idp: [credential]

mcp:
  # platform servers
  lake: [read]
  records: [record-write]
  cases: [record-write]
  hnx-catalog: [read]  # `hnx mcp serve`: read-only answers from this repository (docs/mcp.md)
  hnx-broker: [record-write, exec]  # `hnx broker mcp`: broker actions as the authenticated caller (docs/broker.md)
  # common third-party servers, classified so a profile naming one is judged, not guessed
  shell: [exec]
  bash: [exec]
  terminal: [exec]
  exec: [exec]
  ssh: [exec]
  docker: [exec]
  kubernetes: [exec]
  ansible: [exec]
  filesystem: [read, file-write]
  git: [read, file-write]
  github: [egress, file-write]
  gitlab: [egress, file-write]
  fetch: [egress]
  http: [egress]
  web: [egress]
  web-search: [egress]
  browser: [egress]
  playwright: [egress]
  puppeteer: [egress]
  email: [egress]
  smtp: [egress]
  slack: [egress]
  ntfy: [egress]
  vault: [credential]
