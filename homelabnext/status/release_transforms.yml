# SPDX-License-Identifier: Apache-2.0
#
# The status hub's release transforms (ADR-0033 decisions 7 and 8; docs/status.md, "TLP ceilings
# and release transforms"). The hub's own data is the lab's, so it is `red` (decision 2); a
# transform is the only way any of it reaches a `clear` reader. Each one names what it serves (a
# public export or the view whose data it shapes), its input and output label, the fields it
# keeps with the kind of value each may hold, and the fields it withdraws with the reason. A
# field it does not keep is dropped, and every field the source carries today is either kept or
# withdrawn here (the day-one migration).
#
# This file is governance: a change to it needs a human approve (CODEOWNERS). Paths: `a.b` is
# field `b` of mapping `a`, `a[]` each item of list `a`, `*` every key of a mapping whose keys are
# data (view ids). A kept path keeps a scalar only; a mapping is kept only through the fields
# listed under it, and a withdrawn path withdraws everything under it.
#
# Kinds (homelabnext.status.release.KINDS): slug, title, time, count, bool, const:<value>,
# enum:<set>. Every kept string also passes the content checks (no dotted name, IP address, path
# or TLP marker); a value that fails is replaced by `withheld` (null for a count or a flag).
#
# What identifies a lab system is never kept beside its state: the public view says how many
# things are in which state, not which ones.
release_transforms_version: 1

transforms:
  - id: status-public
    what: The public status document and the page drawn from it (health counts, never which system).
    serves: [status.json, exceptions, grid, sources]
    input: red
    output: clear
    keep:
      schema: const:homelabnext.status/1
      generated_at: time
      title: title
      main: slug
      summary.total: count
      summary.ok: count
      summary.warn: count
      summary.fail: count
      summary.unknown: count
      summary.stale: count
      menu[].id: slug
      menu[].title: title
      menu[].kind: enum:menu-kind
      menu[].panel: slug
      menu[].group: slug
      menu[].available: bool
      views.*.panel: slug
      views.*.ok: count
      views.*.total: count
      views.*.modules[].state: enum:state
      views.*.modules[].counts.total: count
      views.*.modules[].counts.ok: count
      views.*.modules[].counts.warn: count
      views.*.modules[].counts.fail: count
      views.*.modules[].counts.unknown: count
      views.*.modules[].counts.stale: count
      modules[].state: enum:state
      modules[].counts.total: count
      modules[].counts.ok: count
      modules[].counts.warn: count
      modules[].counts.fail: count
      modules[].counts.unknown: count
      modules[].counts.stale: count
      agents.counts.working: count
      agents.counts.waiting: count
      agents.counts.stuck: count
      agents.counts.errored: count
      agents.counts.done: count
      agents.sessions[].session_id: slug
      agents.sessions[].parent_session_id: slug
      agents.sessions[].state: enum:session-state
      agents.sessions[].runtime: slug
      agents.sessions[].surface: enum:surface
      agents.sessions[].agent: slug
      agents.sessions[].first_seen: time
      agents.sessions[].last_seen: time
      agents.sessions[].last_kind: enum:activity-kind
      agents.sessions[].last_outcome: enum:outcome
      agents.sessions[].last_tool: slug
      agents.sessions[].events: count
      agents.sessions[].tool_calls: count
      agents.sessions[].denials: count
      agents.sessions[].approvals: count
      agents.sessions[].errors: count
      agents.sessions[].prompts: count
      agents.sessions[].tokens_in: count
      agents.sessions[].tokens_out: count
      agents.sessions[].cost_usd: count
      agents.sessions[].idle_s: count
      agents.sessions[].stuck_after_s: count
    withdraw:
      - {field: act_via, why: "the address of the lab's broker or approval service"}
      - {field: "menu[].href", why: "an external entry's link is a lab service address (a page's path is fixed by the code, not data)"}
      - {field: "menu[].service", why: "a registry service name is lab inventory"}
      - {field: "views.*.live", why: "live work is per-item telemetry: item names, summaries and values"}
      - {field: "views.*.attention", why: "each item names what is failing (its module, source, item and summary) beside its state; the exceptions counts say how many"}
      - {field: "views.*.sources", why: "each source id beside its state names which collector is failing, and the rest is lab configuration, paths and error text"}
      - {field: "views.*.modules[].module", why: "a module name beside its state names which lab system is failing; the tile keeps its state and counts"}
      - {field: "views.*.modules[].service", why: "a registry service name is lab inventory"}
      - {field: "views.*.modules[].capability", why: "which product fills which capability is lab inventory"}
      - {field: "views.*.modules[].sources", why: "the module's source ids beside its state locate the fault"}
      - {field: "views.*.modules[].links", why: "links to the lab's service and capability pages"}
      - {field: "views.*.modules[].items", why: "per-item telemetry (names, summaries, values)"}
      - {field: "modules[].module", why: "a module name beside its state names which lab system is failing; summary and counts say how many"}
      - {field: "modules[].service", why: "a registry service name is lab inventory"}
      - {field: "modules[].capability", why: "which product fills which capability is lab inventory"}
      - {field: "modules[].sources", why: "the module's source ids beside its state locate the fault"}
      - {field: "modules[].links", why: "links to the lab's service and capability pages"}
      - {field: "modules[].items", why: "per-item telemetry (names, summaries, values)"}
      - {field: sources, why: "each source id beside its state names which collector is failing, and the rest is lab configuration, paths and error text"}
      - {field: observations, why: "every reading, with item names, summaries, values and history: raw lab telemetry"}
      - {field: "agents.sessions[].host", why: "names a lab machine"}
      - {field: "agents.sessions[].project", why: "names the repository or work a session ran in, which can be private"}
      - {field: "agents.sessions[].model", why: "which model, and so which provider, received the lab's prompts"}

  - id: agent-sessions-public
    what: Agent sessions on the Agents pages (state, counts and usage per session).
    serves: [agents, agent-analytics]
    input: red
    output: clear
    keep:
      session_id: slug
      parent_session_id: slug
      state: enum:session-state
      runtime: slug
      surface: enum:surface
      agent: slug
      first_seen: time
      last_seen: time
      last_kind: enum:activity-kind
      last_outcome: enum:outcome
      last_tool: slug
      events: count
      tool_calls: count
      denials: count
      approvals: count
      errors: count
      prompts: count
      tokens_in: count
      tokens_out: count
      cost_usd: count
      idle_s: count
      stuck_after_s: count
    withdraw:
      - {field: host, why: "names a lab machine"}
      - {field: project, why: "names the repository or work a session ran in, which can be private"}
      - {field: model, why: "which model, and so which provider, received the lab's prompts"}

  - id: agent-events-public
    what: Agent activity events (summary tier) on the Activity and analytics pages and in the exports.
    serves: [agents, activity, agent-analytics, activity.csv, activity.jsonl]
    input: red
    output: clear
    keep:
      event_id: slug
      session_id: slug
      parent_session_id: slug
      runtime: slug
      surface: enum:surface
      agent: slug
      time: time
      kind: enum:activity-kind
      tool: slug
      outcome: enum:outcome
      tokens_in: count
      tokens_out: count
      cost_usd: count
      has_detail: bool
    withdraw:
      - {field: host, why: "names a lab machine"}
      - {field: project, why: "names the repository or work a session ran in, which can be private"}
      - {field: model, why: "which model, and so which provider, received the lab's prompts"}
