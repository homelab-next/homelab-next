[defaults]
roles_path = roles
lookup_plugins = plugins/lookup
inventory = inventory/example/hosts.yml
retry_files_enabled = False
interpreter_python = auto_silent
# Host keys are always checked. Ansible pushes configuration and secrets to hosts that grant it
# sudo, so an unverified host key hands all of that to whoever answers on the address. Bootstrap
# trust once, out of band, instead of turning the check off:
#   * known_hosts: after a guest is created, read its key from the hypervisor console or the
#     cloud-init log, compare, then record it, for example
#       ssh-keyscan -t ed25519 <host> > /tmp/k && ssh-keygen -lf /tmp/k   # compare fingerprint
#       cat /tmp/k >> ~/.ssh/known_hosts
#   * or SSH host certificates: sign each host key with a host CA and trust the CA once with a
#     "@cert-authority *.example.internal <ca.pub>" line in known_hosts; new hosts then need no
#     per-host step.
# A guest cloned from a template must regenerate its host keys on first boot (cloud-init does so
# by default; never ship /etc/ssh/ssh_host_* inside a template), or every clone shares one key and
# a key mismatch can no longer reveal an impostor.
host_key_checking = True
