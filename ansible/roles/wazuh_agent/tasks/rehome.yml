# SPDX-License-Identifier: Apache-2.0
# Move an agent that is already enrolled with ANOTHER manager to the registry's manager (opt-in:
# wazuh_agent_rehome). The deployment variables only act on a first install, so the package cannot
# do it: back up the configuration, the key and the enrolment password, point the configuration at
# the manager, write the enrolment password from the secret store (never on an argv), empty the
# key, enrol with agent-auth (which reads the password file) and start the agent. An agent already
# on the registry's manager is left alone. Rollback: stop the agent, restore the three
# *.pre-rehome-<stamp> files, start it (the old manager still holds the old key).
- block:
    - name: Read the agent configuration
      ansible.builtin.slurp:
        src: "{{ home }}/etc/ossec.conf"
      register: wazuh_agent_conf

    - name: Work out the configured managers
      ansible.builtin.set_fact:
        wazuh_agent_configured: >-
          {{ wazuh_agent_conf.content | b64decode | regex_replace('(?s)<!--.*?-->', '')
             | regex_findall('<address>\s*([^<\s]+)\s*</address>') }}
        wazuh_agent_want: "{{ lookup('hnx_registry', wazuh_agent_manager_id, field='host') }}"

    - name: Re-home the agent to the registry's manager
      when: wazuh_agent_configured | length > 0 and wazuh_agent_want not in wazuh_agent_configured
      block:
        - name: Back up the configuration, the key and the enrolment password (once per stamp)
          ansible.builtin.copy:
            src: "{{ home }}/etc/{{ item }}"
            dest: "{{ home }}/etc/{{ item }}.pre-rehome-{{ wazuh_agent_rehome_stamp }}"
            remote_src: true
            mode: preserve
            force: false
          loop: [ossec.conf, client.keys, authd.pass]
          failed_when: false

        - name: Stop the agent
          ansible.builtin.command:
            argv: ["{{ wazuh_agent_systemctl_cli }}", stop, wazuh-agent]
          changed_when: true

        - name: Point every server block at the registry's manager
          ansible.builtin.replace:
            path: "{{ home }}/etc/ossec.conf"
            regexp: '<address>\s*{{ item | regex_escape }}\s*</address>'
            replace: "<address>{{ wazuh_agent_want }}</address>"
          loop: "{{ wazuh_agent_configured | unique }}"

        - name: Write the enrolment password (read by agent-auth; never an argument)
          ansible.builtin.copy:
            content: "{{ lookup('hnx_secret', wazuh_agent_enrollment_ref) }}"
            dest: "{{ home }}/etc/authd.pass"
            group: "{{ wazuh_agent_config_group }}"
            mode: "0640"
          no_log: true

        - name: Empty the key the old manager issued
          ansible.builtin.copy:
            content: ""
            dest: "{{ home }}/etc/client.keys"
            group: "{{ wazuh_agent_config_group }}"
            mode: "0640"

        - name: Enrol with the registry's manager
          ansible.builtin.command:
            argv:
              - "{{ wazuh_agent_auth_cli }}"
              - -m
              - "{{ wazuh_agent_want }}"
              - -p
              - "{{ wazuh_agent_enrollment_port | string }}"
          changed_when: true

        - name: Start the agent
          ansible.builtin.command:
            argv: ["{{ wazuh_agent_systemctl_cli }}", start, wazuh-agent]
          changed_when: true
  vars:
    home: "{{ wazuh_agent_state_file | dirname | dirname | dirname }}"
  tags: [rehome]
