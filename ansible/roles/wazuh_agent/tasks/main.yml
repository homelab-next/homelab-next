# SPDX-License-Identifier: Apache-2.0
# Control siem-agent (ADR-0016 decision 7): the vendor's pinned agent from its signed apt
# repository. The deployment variables (WAZUH_MANAGER, WAZUH_REGISTRATION_PASSWORD, ...) take effect
# on the first install only: moving the agent to another manager later is a reinstall
# (docs/compute-model.md, "Bound products"), unless the site opts into the agent_rehome role.
- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Refuse a host that is not Debian-family (the role installs from the vendor apt repository)
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: "wazuh_agent supports Debian-family guests only (got {{ ansible_facts['os_family'] }})"

- name: Install gpg (it checks the vendor key's fingerprint)
  ansible.builtin.apt:
    name: gpg
    state: present

- name: Fetch the vendor signing key and check it against the pinned fingerprints
  ansible.builtin.include_tasks: signing_key.yml

- name: Add the vendor apt repository, signed by the checked vendor key
  ansible.builtin.deb822_repository:
    name: wazuh
    types: deb
    uris: "{{ wazuh_agent_repository }}/{{ wazuh_agent_version.split('.')[0] }}.x/apt/"
    suites: stable
    components: main
    signed_by: "{{ wazuh_agent_keyring }}"

# The package is held (below), so moving it to a new pin (the upgrade hook's bump path) must be
# allowed to change that one held package; the hold is set again right after.
- name: Install the pinned agent (the first install enrolls it with the manager)
  ansible.builtin.apt:
    name: "wazuh-agent={{ wazuh_agent_version }}-{{ wazuh_agent_package_revision }}"
    allow_change_held_packages: true
    update_cache: true
  environment: >-
    {{ {'WAZUH_MANAGER': lookup('hnx_registry', wazuh_agent_manager_id, field='host'),
        'WAZUH_MANAGER_PORT': lookup('hnx_registry', wazuh_agent_manager_id, field='port') | string,
        'WAZUH_REGISTRATION_PORT': wazuh_agent_enrollment_port | string,
        'WAZUH_REGISTRATION_PASSWORD': lookup('hnx_secret', wazuh_agent_enrollment_ref)}
       | combine({'WAZUH_AGENT_NAME': wazuh_agent_name} if wazuh_agent_name else {})
       | combine({'WAZUH_AGENT_GROUP': wazuh_agent_groups | join(',')} if wazuh_agent_groups else {}) }}
  no_log: true

- name: Hold the package again, so an unattended upgrade cannot move the agent past its manager
  ansible.builtin.dpkg_selections:
    name: wazuh-agent
    selection: hold

- name: Re-home an agent enrolled with another manager (opt-in, role agent_rehome)
  ansible.builtin.include_role:
    name: agent_rehome
  when: agent_rehome_enabled | default(false) | bool

# What the agent watches (file-integrity paths, the audit log, the remote-command switches) is the
# siem_agent_watch role's, which names no product; it reports a change so the agent restarts below.
- name: Configure what the agent watches
  ansible.builtin.include_role:
    name: siem_agent_watch
  vars:
    siem_agent_watch_auditd: "{{ hostvars[inventory_hostname].siem_agent_watch_auditd | default('auto') }}"

# The vendor unit has no Restart= and a 45 s start timeout: the agent's start blocks until the manager answers, so a guest
# that boots before the SIEM is up (a whole-host power cycle starts every guest at once) times out ONCE and stays failed
# until someone restarts it (2026-11-26: 7 guests and the hypervisor). The drop-in retries every 30 s without a start limit,
# so the agent joins as soon as the manager is reachable.
# Two tasks, not one: a set_fact resolves all its values before defining any, so a value naming another
# fact of the same task fails ("'siem_agent_unit' is undefined", 2026-11-28 on every guest).
- name: Name the agent unit
  ansible.builtin.set_fact:
    siem_agent_unit: wazuh-agent

- name: Name the agent unit's drop-in directory
  ansible.builtin.set_fact:
    siem_agent_unit_dropin_dir: "/etc/systemd/system/{{ siem_agent_unit }}.service.d"

- name: Create the agent unit's drop-in directory
  ansible.builtin.file:
    path: "{{ siem_agent_unit_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Let the agent retry a start that failed before the manager was up
  ansible.builtin.copy:
    dest: "{{ siem_agent_unit_dropin_dir }}/10-hnx-retry.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by homelabnext (the siem-agent role); local changes are overwritten.
      [Unit]
      StartLimitIntervalSec=0

      [Service]
      Restart=on-failure
      RestartSec=30
      # A hard reset during a start leaves the vendor start script's lock directory behind, and every later start then
      # waits on it until the unit times out (2026-11-28: hnx-idp-01, hnx-lake-01), so a retry alone never recovers.
      # Removed only when no agent daemon runs; the lock is the vendor script's own, never one this role makes.
      ExecStartPre=-/bin/sh -c 'ps -eo comm= | grep -q "^wazuh-" || rm -rf -- /var/ossec/var/start-script-lock'
      TimeoutStartSec=120
  # the start task below reloads systemd (daemon_reload) before it starts the unit

- name: Enable and start the agent (restarted when its watch configuration changed)
  ansible.builtin.systemd_service:
    name: "{{ siem_agent_unit }}"
    enabled: true
    state: "{{ 'restarted' if siem_agent_watch_changed | default(false) | bool else 'started' }}"
    daemon_reload: true
