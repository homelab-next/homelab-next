- block:
    - name: Ensure the manifest directory exists
      ansible.builtin.file:
        path: "{{ wazuh_agent_manifest_dir }}"
        state: directory
        mode: "0750"
    - name: Write the backup manifest (nothing to keep; a rebuilt guest re-enrolls)
      ansible.builtin.copy:
        dest: "{{ wazuh_agent_manifest_dir }}/backup-manifest.json"
        content: "{{ {'service': 'wazuh_agent', 'paths': [], 'note': 'the agent re-enrolls; its events live in the SIEM'} | to_nice_json }}\n"
        mode: "0640"
  tags: [backup]
