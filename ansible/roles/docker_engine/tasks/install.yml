# The packages are held (below), so moving one to a new pin (the upgrade hook's bump path) must be
# allowed to change those held packages; the holds are set again right after. They install in one
# transaction because the engine depends on the matching CLI and containerd.
# docker_engine_would_install (set by main.yml, true only in --check when the vendor repository is
# about to be added) leaves the apt tasks out: they would fail on a repository that is not there.
- name: Say what a real run would install (--check, the vendor repository not added yet)
  ansible.builtin.debug:
    msg: >-
      docker_engine (check mode): the vendor repository is not on this host yet, so apt cannot be asked
      about its packages; a real run would add it, then would install
      {{ docker_engine_packages | map(attribute='name') | zip(docker_engine_packages | map(attribute='version')) | map('join', '=') | join(', ') }}
      and hold them
  when: docker_engine_would_install | default(false) | bool

- name: Install the pinned engine, CLI, containerd and plugins
  ansible.builtin.apt:
    name: "{{ docker_engine_packages | map(attribute='name') | zip(docker_engine_packages | map(attribute='version')) | map('join', '=') | list }}"
    allow_change_held_packages: true
    update_cache: true
    # docker-ce Recommends docker-ce-rootless-extras, which apt would take at the newest version
    # (5:29.10.0 beside the pinned 29.9.2 engine). This role pins and holds exactly the packages
    # in docker_engine_packages and installs nothing outside that list.
    install_recommends: false
  when: not (docker_engine_would_install | default(false) | bool)

- name: Hold the packages at their pins again
  ansible.builtin.dpkg_selections:
    name: "{{ item.name }}"
    selection: hold
  loop: "{{ docker_engine_packages }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (docker_engine_would_install | default(false) | bool)
