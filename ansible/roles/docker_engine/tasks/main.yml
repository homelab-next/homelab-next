# SPDX-License-Identifier: Apache-2.0
# The container engine a compose_app guest (or the lab-in-a-box) needs: Docker Engine from the
# vendor's signed apt repository, the engine, CLI, containerd, buildx and compose packages pinned
# and held, and a daemon.json, checked by dockerd before it goes live, that bounds container logs.
- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Check the host has a vendor apt repository (Debian or Ubuntu)
  ansible.builtin.include_tasks: platform.yml

- name: Install gpg (it checks the vendor key's fingerprint)
  ansible.builtin.apt:
    name: gpg
    state: present

# docker-ce Recommends these and the packages below install without recommends (the unpinned
# rootless extras would come with them), so they are named here: apparmor loads the docker-default
# profile containers run under, ca-certificates is what registry TLS is verified against.
- name: Install what docker-ce recommends and the engine needs (apparmor, ca-certificates)
  ansible.builtin.apt:
    name: "{{ docker_engine_prerequisites }}"
    state: present

- name: Fetch the vendor signing key and check it against the pinned fingerprints
  ansible.builtin.include_tasks: signing_key.yml

- name: Add the vendor apt repository, signed by the checked vendor key
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_engine_apt_uri }}"
    suites: "{{ docker_engine_release }}"
    components: stable
    signed_by: "{{ docker_engine_keyring }}"
  register: docker_engine_repo

# Under --check the repository above is only reported, never written, so on a guest that has none yet
# apt cannot name the packages and there is no unit to start. A dry run that sees the repository
# change says what a real run would install (install.yml) and leaves the rest to it. Never true in a
# real run.
- name: Name whether this dry run is about to add the repository the packages come from
  ansible.builtin.set_fact:
    docker_engine_would_install: "{{ ansible_check_mode and docker_engine_repo is changed }}"

- name: Install the pinned packages and hold them
  ansible.builtin.include_tasks: install.yml

- name: Write the daemon configuration and restart while a restart is owed
  ansible.builtin.include_tasks: config.yml

- name: Enable and start the engine
  ansible.builtin.include_tasks: service.yml
