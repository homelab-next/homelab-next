# The repository root is configurable (a lab mirror may stand in for the vendor), so the key it
# serves is not trusted for coming from it: it is fetched to a staging file and installed for apt
# only when every primary key in it is one of the pinned vendor fingerprints.
- name: Fetch, check and install the vendor signing key
  block:
    - name: Ensure the apt keyring directory exists
      ansible.builtin.file:
        path: "{{ docker_engine_keyring | dirname }}"
        state: directory
        mode: "0755"
    - name: Fetch the signing key to a staging file
      ansible.builtin.get_url:
        url: "{{ docker_engine_apt_uri }}/gpg"
        dest: "{{ docker_engine_keyring }}.download"
        mode: "0644"
        force: true
      changed_when: false
    - name: Make a scratch GnuPG home (reading the key must not touch a real keyring)
      ansible.builtin.tempfile:
        state: directory
        suffix: .hnx-gnupg
      register: docker_engine_gnupg_home
      changed_when: false
    - name: List the keys in the downloaded file
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --homedir
          - "{{ docker_engine_gnupg_home.path }}"
          - --with-colons
          - --show-keys
          - "{{ docker_engine_keyring }}.download"
      register: docker_engine_key_listing
      changed_when: false
    # Fail closed: every primary key (each pub record) must have been read with its fingerprint,
    # so a listing the pattern does not follow is refused rather than skipped.
    - name: Fail unless the file holds the pinned vendor key and nothing else
      vars:
        docker_engine_key_found: "{{ docker_engine_key_listing.stdout | regex_findall('(?m)^pub:.*\\n^fpr:+([0-9A-F]{40}):') }}"
        docker_engine_key_count: "{{ docker_engine_key_listing.stdout | regex_findall('(?m)^pub:') | length }}"
      ansible.builtin.assert:
        that:
          - docker_engine_key_found | length > 0
          - docker_engine_key_found | length == docker_engine_key_count | int
          - docker_engine_key_found | difference(docker_engine_key_fingerprints) | length == 0
        fail_msg: >-
          docker_engine: the signing key from {{ docker_engine_apt_uri }} has primary key(s)
          {{ docker_engine_key_found | join(', ') or 'none' }}, not the pinned
          {{ docker_engine_key_fingerprints | join(', ') }} (docker_engine_key_fingerprints)
    - name: Install the checked key for apt
      ansible.builtin.copy:
        src: "{{ docker_engine_keyring }}.download"
        dest: "{{ docker_engine_keyring }}"
        remote_src: true
        mode: "0644"
  always:
    - name: Remove the staging file and the scratch GnuPG home
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ [docker_engine_keyring ~ '.download'] + ([docker_engine_gnupg_home.path] if docker_engine_gnupg_home.path is defined else []) }}"
      changed_when: false  # scratch files only: a second run must report no change
