# SPDX-License-Identifier: Apache-2.0
# The lockout guard comes first: the kept account must exist and keep a way in, an authorized key
# that is not revoked or, only with ssh_hardening_keep_user_cert_only, a trusted user CA and a
# principal listed for it. The CA, principals and revoked-key files are written next (a CA or
# revoked file only after ssh-keygen -l parses it), so a drop-in naming them never goes live
# before they exist. A changed drop-in is
# staged (outside sshd_config.d's *.conf glob), and a test configuration that reads the staged
# file before the main one (so it wins, as the live drop-in will) must pass sshd -t and, through
# sshd -T for the kept account, be key-only, refuse root, admit that account and name the files
# the role wrote. Only then does it
# replace the live file. Replacing it leaves a reload-pending marker that only a successful reload
# removes, so a failed (or disabled) reload is retried on the next run.
- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

# A pure read, so it runs under --check too: skipped, it registered no home, the keys path fell
# back to /nonexistent and the guard below failed a dry run on a host that was fine.
- name: Look up the kept account (name:x:uid:gid:gecos:home:shell)
  ansible.builtin.command:
    argv: ["{{ ssh_hardening_getent_cli }}", passwd, "{{ ssh_hardening_keep_user }}"]
  register: ssh_hardening_account
  changed_when: false
  failed_when: false
  check_mode: false

- name: Look for the kept account's authorized keys
  ansible.builtin.stat:
    path: "{{ ssh_hardening_authorized_keys_path }}"
  register: ssh_hardening_keys

- name: Read the kept account's authorized keys
  when: ssh_hardening_keys.stat.exists and ssh_hardening_keys.stat.size > 0
  ansible.builtin.slurp:
    src: "{{ ssh_hardening_authorized_keys_path }}"
  register: ssh_hardening_keys_text

- name: Refuse to make SSH key-only for an account that would have no way in
  vars:
    # the key blobs (the base64 field after the key type; options before it are skipped)
    ssh_hardening_key_blobs: >-
      {{ ((ssh_hardening_keys_text.content | default('')) | b64decode)
         | regex_findall('(?:^|\s)(?:ssh-|ecdsa-|sk-)\S+\s+(AAAA[A-Za-z0-9+/]+={0,3})') | unique }}
    ssh_hardening_revoked_blobs: "{{ ssh_hardening_revoked_keys | map('split') | map(attribute=1) | list }}"
    ssh_hardening_ca_blobs: "{{ ssh_hardening_trusted_user_ca_keys | map('split') | map(attribute=1) | list }}"
    ssh_hardening_by_key: "{{ ssh_hardening_key_blobs | difference(ssh_hardening_revoked_blobs) | length > 0 }}"
    ssh_hardening_by_cert: >-
      {{ ssh_hardening_keep_user_cert_only | bool
         and ssh_hardening_ca_blobs | difference(ssh_hardening_revoked_blobs) | length > 0
         and (ssh_hardening_authorized_principals[ssh_hardening_keep_user] | default([])) | length > 0 }}
  ansible.builtin.assert:
    that:
      - ssh_hardening_account.rc == 0
      - ssh_hardening_by_key | bool or ssh_hardening_by_cert | bool
    fail_msg: >-
      ssh_hardening: {{ ssh_hardening_keep_user }} does not exist, or has no unrevoked key in
      .ssh/authorized_keys in its home and no certificate path (ssh_hardening_keep_user_cert_only
      with an unrevoked user CA and a principal listed for it); key-only SSH would lock it out

- name: Put the kept account in the first allow group
  when: ssh_hardening_manage_membership | bool
  block:
    - name: Ensure the allow group exists
      ansible.builtin.group:
        name: "{{ ssh_hardening_allow_groups[0] }}"
        system: true
    - name: Add the kept account to it
      ansible.builtin.user:
        name: "{{ ssh_hardening_keep_user }}"
        groups: ["{{ ssh_hardening_allow_groups[0] }}"]
        append: true

- name: Ensure the state directory exists
  ansible.builtin.file:
    path: "{{ ssh_hardening_state_dir }}"
    state: directory
    mode: "0700"

- name: Write the user CA keys (only a file ssh-keygen parses replaces the live one)
  when: ssh_hardening_trusted_user_ca_keys | length > 0
  ansible.builtin.copy:
    dest: "{{ ssh_hardening_trusted_user_ca_file }}"
    content: "{{ ssh_hardening_trusted_user_ca_keys | join('\n') }}\n"
    mode: "0644"
    validate: "{{ ssh_hardening_keygen_cli }} -l -f %s"

- name: Write the revoked keys (only a file ssh-keygen parses replaces the live one)
  when: ssh_hardening_revoked_keys | length > 0
  ansible.builtin.copy:
    dest: "{{ ssh_hardening_revoked_keys_file }}"
    content: "{{ ssh_hardening_revoked_keys | join('\n') }}\n"
    mode: "0644"
    validate: "{{ ssh_hardening_keygen_cli }} -l -f %s"

- name: Ensure the principals directory exists
  ansible.builtin.file:
    path: "{{ ssh_hardening_principals_dir }}"
    state: directory
    mode: "0755"

- name: Write each listed account's principals
  ansible.builtin.copy:
    dest: "{{ ssh_hardening_principals_dir }}/{{ item.key }}"
    content: "{{ item.value | join('\n') }}\n"
    mode: "0644"
  loop: "{{ ssh_hardening_authorized_principals | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: List the principals files
  ansible.builtin.find:
    paths: "{{ ssh_hardening_principals_dir }}"
    file_type: any
    hidden: true
  register: ssh_hardening_principal_files

- name: Remove the principals of accounts no longer listed (their certificates stop working)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ ssh_hardening_principal_files.files | map(attribute='path')
       | reject('in', ssh_hardening_authorized_principals.keys() | map('regex_replace', '^', ssh_hardening_principals_dir ~ '/') | list)
       | list }}

- name: Compare the drop-in with the live file
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: "{{ ssh_hardening_dropin }}"
    mode: "0600"
  check_mode: true
  register: ssh_hardening_written

# Under --check nothing is staged, so there is no file for sshd to judge or to install: the dry
# run reports the drop-in it would write (the comparison above, with --diff), and the real run
# tests it before it goes live.
- name: Test the new drop-in, then install it
  when: ssh_hardening_written is changed and not ansible_check_mode
  vars:
    ssh_hardening_staged: "{{ ssh_hardening_state_dir }}/staged.conf"
    ssh_hardening_test_config: "{{ ssh_hardening_state_dir }}/test-sshd_config"
  block:
    - name: Stage the new drop-in
      ansible.builtin.template:
        src: hardening.conf.j2
        dest: "{{ ssh_hardening_staged }}"
        mode: "0600"
    - name: Write a test configuration that reads the staged drop-in first, then the live one
      ansible.builtin.copy:
        dest: "{{ ssh_hardening_test_config }}"
        content: "Include {{ ssh_hardening_staged }}\nInclude {{ ssh_hardening_main_config }}\n"
        mode: "0600"
    - name: Test the whole configuration with the new drop-in
      ansible.builtin.command:
        argv: ["{{ ssh_hardening_sshd_cli }}", -t, -f, "{{ ssh_hardening_test_config }}"]
      changed_when: false
    - name: Check the effective configuration keeps the account's access
      ansible.builtin.include_tasks: effective.yml
    - name: Mark a reload as owed before the live file changes
      ansible.builtin.copy:
        dest: "{{ ssh_hardening_state_dir }}/reload-pending"
        content: "the drop-in changed; sshd has not reloaded since\n"
        mode: "0600"
    - name: Install the tested drop-in as the live file
      ansible.builtin.copy:
        src: "{{ ssh_hardening_staged }}"
        dest: "{{ ssh_hardening_dropin }}"
        remote_src: true
        mode: "0600"
  always:
    - name: Remove the staged files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ssh_hardening_state_dir }}/staged.conf"
        - "{{ ssh_hardening_state_dir }}/test-sshd_config"

- name: Look for a reload still owed
  ansible.builtin.stat:
    path: "{{ ssh_hardening_state_dir }}/reload-pending"
  register: ssh_hardening_pending

- name: Reload sshd while a reload is owed (open sessions stay up)
  when: ssh_hardening_pending.stat.exists and ssh_hardening_reload | bool
  block:
    - name: Reload sshd
      ansible.builtin.command:
        argv: ["{{ ssh_hardening_systemctl_cli }}", reload, "{{ ssh_hardening_service }}"]
      changed_when: true
    - name: Clear the owed reload
      ansible.builtin.file:
        path: "{{ ssh_hardening_state_dir }}/reload-pending"
        state: absent
