- name: Refuse a downgrade, a no-op or a malformed version
  ansible.builtin.assert:
    that:
      - trivy_target_version is match('^[0-9]+\.[0-9]+\.[0-9]+\Z')
      - trivy_version == '' or trivy_target_version is version(trivy_version, '>')
    fail_msg: "target {{ trivy_target_version }} is not a newer x.y.z than {{ trivy_version or 'the unpinned install' }}"
  tags: [upgrade]
