- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Ensure the script directory exists
  ansible.builtin.file:
    path: "{{ trivy_script | dirname }}"
    state: directory
    mode: "0755"

- name: Write the scan script
  ansible.builtin.template:
    src: scan.sh.j2
    dest: "{{ trivy_script }}"
    mode: "0750"

- name: Install the shared last-run writer and the record directory (role last_run)
  ansible.builtin.include_role:
    name: last_run
  vars:
    last_run_dir: "{{ trivy_last_run_dir }}"
    last_run_group: "{{ trivy_last_run_group }}"
    last_run_writer: "{{ trivy_last_run_writer }}"

- name: Write the service and timer units
  ansible.builtin.template:
    src: "scan.{{ item }}.j2"
    dest: "{{ trivy_unit_dir }}/hnx-trivy.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  register: trivy_units

- name: Ask whether the trivy timer is enabled
  ansible.builtin.command:
    argv: ["{{ trivy_systemctl_cli }}", is-enabled, hnx-trivy.timer]
  register: trivy_timer_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ask whether the trivy timer is started
  ansible.builtin.command:
    argv: ["{{ trivy_systemctl_cli }}", is-active, hnx-trivy.timer]
  register: trivy_timer_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Reload systemd (units changed) and enable and start the timer (changed, or not both)
  ansible.builtin.command:
    argv: "{{ [trivy_systemctl_cli] + item }}"
  vars:
    trivy_timer_owed: >-
      {{ trivy_units is changed
         or trivy_timer_enabled.stdout | default('') | trim != 'enabled'
         or trivy_timer_active.stdout | default('') | trim != 'active' }}
  loop: >-
    {{ ([['daemon-reload']] if trivy_units is changed else [])
       + ([['enable', '--now', 'hnx-trivy.timer']] if trivy_timer_owed | bool else []) }}
  loop_control:
    label: "{{ item | join(' ') }}"
  changed_when: true
