# The address groups the stock suricata.yaml defines besides HOME_NET and EXTERNAL_NET (the
# shipped rules reference them). The generated file replaces the whole address-groups mapping,
# so it carries them too, with the stock values.
suricata_enroll_standard_groups:
  EXTERNAL_NET: "!$HOME_NET"
  HTTP_SERVERS: "$HOME_NET"
  SMTP_SERVERS: "$HOME_NET"
  SQL_SERVERS: "$HOME_NET"
  DNS_SERVERS: "$HOME_NET"
  TELNET_SERVERS: "$HOME_NET"
  AIM_SERVERS: "$EXTERNAL_NET"
  DC_SERVERS: "$HOME_NET"
  DNP3_SERVER: "$HOME_NET"
  DNP3_CLIENT: "$HOME_NET"
  MODBUS_CLIENT: "$HOME_NET"
  MODBUS_SERVER: "$HOME_NET"
  ENIP_CLIENT: "$HOME_NET"
  ENIP_SERVER: "$HOME_NET"

# Beside the live groups file: present while a changed file has gone live without a successful
# reload-rules since (main retries the reload until it succeeds).
suricata_enroll_pending_file: ".hnx-address-groups.reload-pending"
