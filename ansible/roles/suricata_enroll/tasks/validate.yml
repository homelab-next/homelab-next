# Every value lands in a YAML file Suricata parses: refuse anything but plain names, an IPv4 ip,
# and extra addresses that are bare IPv4 or lower-case IPv6 (the guest model's own rules: no prefix,
# port or zone), and refuse an empty list (HOME_NET cannot be empty).
- name: Validate the enrolled guests and the file names
  vars:
    _enroll_guests: "{{ suricata_enroll_guests }}"
    _enroll_extras: "{{ _enroll_guests | selectattr('extra_addresses', 'defined') | map(attribute='extra_addresses') | list }}"
  ansible.builtin.assert:
    that:
      - _enroll_guests | length > 0
      - _enroll_guests | map(attribute='ip') | select('match', '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}\Z') | list | length == _enroll_guests | length
      - _enroll_extras | reject('iterable') | list | length == 0
      - _enroll_extras | select('string') | list | length == 0
      - _enroll_extras | select('mapping') | list | length == 0
      - >-
        _enroll_extras | flatten(levels=1)
        | reject('match', '^(?:(?:[0-9]{1,3}\.){3}[0-9]{1,3}|[0-9a-f]{0,4}(?::[0-9a-f]{0,4}){2,7})\Z') | list | length == 0
      - _enroll_guests | map(attribute='zone') | select('match', '^[a-z][a-z0-9-]{0,40}\Z') | list | length == _enroll_guests | length
      - _enroll_guests | map(attribute='name') | select('match', '^[a-z0-9][a-z0-9-]{0,62}\Z') | list | length == _enroll_guests | length
      - suricata_enroll_config_dir is match('^/[A-Za-z0-9._/-]+\Z')
      - suricata_enroll_config_file is match('^[A-Za-z0-9._-]+\.ya?ml\Z')
      - suricata_enroll_groups_file is match('^[A-Za-z0-9._-]+\.ya?ml\Z')
    fail_msg: >-
      suricata_enroll: at least one guest, each with an IPv4 ip, a zone id and a name, and any
      extra_addresses a list of bare IPv4 or lower-case IPv6 addresses; an absolute
      config directory and plain .yaml file names
