# SPDX-License-Identifier: Apache-2.0
# Install the four toolkit packages at the pinned version and hold them, without ever moving
# anything else. Only the toolkit packages that are held now are released (the pinned install must
# be able to move them: a version bump is a re-run), apt simulates the install first, and the run
# fails before installing anything unless the simulation touches only those four packages.
# Nothing is ever allowed past a hold: no --allow-change-held-packages, no --allow-downgrades.
- name: Install the pinned toolkit packages, then hold them again whatever happens
  vars:
    nvidia_container_toolkit_apt_env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_SUSPEND: "1"
      NEEDRESTART_MODE: l
    nvidia_container_toolkit_unhold: "{{ nvidia_container_toolkit_snap.held | select('in', nvidia_container_toolkit_packages) | list }}"
  block:
    - name: Refresh the package lists
      ansible.builtin.command:
        argv: ["{{ nvidia_container_toolkit_apt_get_cli }}", update]
      changed_when: false  # the lists are not the host's state

    - name: Release the held toolkit packages (and no other package)
      ansible.builtin.command:
        argv: ["{{ nvidia_container_toolkit_apt_mark_cli }}", unhold, "{{ item }}"]
      loop: "{{ nvidia_container_toolkit_unhold }}"

    - name: Simulate the install
      ansible.builtin.command:
        argv: >-
          {{ [nvidia_container_toolkit_apt_get_cli, 'install', '-s', '-y', '--no-install-recommends']
             + nvidia_container_toolkit_package_specs }}
      environment: "{{ nvidia_container_toolkit_apt_env }}"
      register: nvidia_container_toolkit_simulation
      changed_when: false
      check_mode: false  # a simulation: it runs in --check too

    - name: Fail, before installing anything, unless apt would touch only the toolkit packages
      vars:
        nvidia_container_toolkit_wanted: "{{ nvidia_container_toolkit_simulation.stdout | regex_findall('(?m)^Inst (\\S+)') }}"
        nvidia_container_toolkit_removed: "{{ nvidia_container_toolkit_simulation.stdout | regex_findall('(?m)^(?:Remv|Purg) (\\S+)') }}"
        nvidia_container_toolkit_foreign: "{{ nvidia_container_toolkit_wanted | difference(nvidia_container_toolkit_packages) }}"
      ansible.builtin.assert:
        that:
          - nvidia_container_toolkit_foreign | length == 0
          - nvidia_container_toolkit_removed | length == 0
        fail_msg: >-
          nvidia_container_toolkit: installing {{ nvidia_container_toolkit_package_specs | join(' ') }}
          would also install {{ nvidia_container_toolkit_foreign | join(', ') or 'nothing' }} and
          remove {{ nvidia_container_toolkit_removed | join(', ') or 'nothing' }}; the role never
          installs, upgrades or removes a driver, a kernel or any other package, so nothing was
          installed (a dependency the host cannot satisfy: add the package yourself, or pin another version)

    - name: Install the pinned toolkit packages
      ansible.builtin.command:
        argv: >-
          {{ [nvidia_container_toolkit_apt_get_cli, 'install', '-y', '--no-install-recommends',
              '-o', 'Dpkg::Options::=--force-confold'] + nvidia_container_toolkit_package_specs }}
      environment: "{{ nvidia_container_toolkit_apt_env }}"
  always:
    - name: Hold the toolkit packages at the pin
      ansible.builtin.command:
        argv: "{{ [nvidia_container_toolkit_apt_mark_cli, 'hold'] + nvidia_container_toolkit_packages }}"

- name: Read the packages again
  ansible.builtin.include_tasks: snapshot.yml

- name: Fail unless the driver, the kernel and every other held package are as they were
  vars:
    nvidia_container_toolkit_changed: "{{ nvidia_container_toolkit_before.protected | symmetric_difference(nvidia_container_toolkit_snap.protected) | list }}"
    nvidia_container_toolkit_released: "{{ nvidia_container_toolkit_before.held | difference(nvidia_container_toolkit_snap.held) | list }}"
  ansible.builtin.assert:
    that:
      - nvidia_container_toolkit_changed | length == 0
      - nvidia_container_toolkit_released | length == 0
    fail_msg: >-
      nvidia_container_toolkit: the install touched the driver, the kernel or another held package
      (never touched is the guarantee): protected packages whose version or state differs from
      before ("name version state"): {{ nvidia_container_toolkit_changed | join('; ') or 'none' }};
      held before and not held now: {{ nvidia_container_toolkit_released | join(', ') or 'none' }}

- name: Fail unless every toolkit package is installed at the pin and held
  when: not ansible_check_mode
  ansible.builtin.assert:
    that: >-
      nvidia_container_toolkit_snap.toolkit.values()
      | select('equalto', nvidia_container_toolkit_apt_version ~ ' hi') | list | length
      == nvidia_container_toolkit_packages | length
    fail_msg: >-
      nvidia_container_toolkit: not installed at {{ nvidia_container_toolkit_apt_version }} and held
      (dpkg state hi): {{ nvidia_container_toolkit_snap.toolkit | to_json }}
