# Fixed, not settings: other firewall managers the role will not run beside (each owns the
# ruleset its own way; a guest using one is exempted from the control with a reason instead).
nftables_host_conflicting_units: [pve-firewall.service, ufw.service, firewalld.service]
nftables_host_cidr: '^(?:any|[0-9]{1,3}(?:\.[0-9]{1,3}){3}/[0-9]{1,2})\Z'
# A rule's source or dest: any, an IPv4 CIDR, or (a zone's subnet6, resolved by the generator) an
# IPv6 prefix, whose shape this allows and the hnx_rule_prefix6_problems filter then judges.
nftables_host_rule_addr: '^(?:any|[0-9]{1,3}(?:\.[0-9]{1,3}){3}/[0-9]{1,2}|(?=[0-9a-f]*:)[0-9a-f:]{2,39}/[0-9]{1,3})\Z'
# Fixed, not settings: destinations no rule may reopen (the output chain refuses them first,
# whatever policy_out says): cloud instance metadata services, which a lab host never needs and an
# agent or model has been seen probing (docs/compute-model.md, "Model runtimes").
# Built from integers, as homelabnext.modules.egress.METADATA is (no address literal in a role):
# the link-local one most clouds use, the container credentials endpoint beside it, Oracle Cloud's,
# Alibaba Cloud's, and the IPv6 one. A test keeps the two equal.
nftables_host_refused_v4:
  - "{{ '%d.%d.%d.%d' | format(169, 254, 169, 254) }}"
  - "{{ '%d.%d.%d.%d' | format(169, 254, 170, 2) }}"
  - "{{ '%d.%d.%d.%d' | format(192, 0, 0, 192) }}"
  - "{{ '%d.%d.%d.%d' | format(100, 100, 100, 200) }}"
nftables_host_refused_v6:
  - "{{ '%x:%x::%x' | format(0xfd00, 0x0ec2, 0x0254) }}"
# The kernel log prefixes the detections match (det:model-runtime-egress-drop and
# det:cloud-metadata-refused): stable, change them only with those rules.
nftables_host_log_dropped: "hnx-egress-drop: "
nftables_host_log_refused: "hnx-egress-refused: "
