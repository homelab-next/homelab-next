# Fixed, not settings: other firewall managers the role will not run beside (each owns the
# ruleset its own way; a guest using one is exempted from the control with a reason instead).
nftables_host_conflicting_units: [pve-firewall.service, ufw.service, firewalld.service]
nftables_host_cidr: '^(?:any|[0-9]{1,3}(?:\.[0-9]{1,3}){3}/[0-9]{1,2})\Z'
