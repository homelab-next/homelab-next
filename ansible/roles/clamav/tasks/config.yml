- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Look at the guest's freshclam configuration
  ansible.builtin.stat:
    path: "{{ clamav_freshclam_config }}"
  register: clamav_freshclam_stat

- name: Point freshclam at the lab mirror
  ansible.builtin.lineinfile:
    path: "{{ clamav_freshclam_config }}"
    regexp: '^PrivateMirror '
    line: "PrivateMirror {{ clamav_private_mirror }}"
    state: "{{ 'present' if clamav_private_mirror else 'absent' }}"
  when: clamav_private_mirror | length > 0 or clamav_freshclam_stat.stat.exists
  notify: Restart freshclam

- name: Ensure the script directory exists
  ansible.builtin.file:
    path: "{{ clamav_script | dirname }}"
    state: directory
    mode: "0755"

- name: Write the scan script
  ansible.builtin.template:
    src: scan.sh.j2
    dest: "{{ clamav_script }}"
    mode: "0750"

- name: Install the shared last-run writer and the record directory (role last_run)
  ansible.builtin.include_role:
    name: last_run
  vars:
    last_run_dir: "{{ clamav_last_run_dir }}"
    last_run_group: "{{ clamav_last_run_group }}"
    last_run_writer: "{{ clamav_last_run_writer }}"

- name: Write the service and timer units
  ansible.builtin.template:
    src: "scan.{{ item }}.j2"
    dest: "{{ clamav_unit_dir }}/hnx-clamav.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  register: clamav_units

- name: Ask whether the clamav timer is enabled
  ansible.builtin.command:
    argv: ["{{ clamav_systemctl_cli }}", is-enabled, hnx-clamav.timer]
  register: clamav_timer_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ask whether the clamav timer is started
  ansible.builtin.command:
    argv: ["{{ clamav_systemctl_cli }}", is-active, hnx-clamav.timer]
  register: clamav_timer_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Reload systemd (units changed) and enable and start the timer (changed, or not both)
  ansible.builtin.command:
    argv: "{{ [clamav_systemctl_cli] + item }}"
  vars:
    clamav_timer_owed: >-
      {{ clamav_units is changed
         or clamav_timer_enabled.stdout | default('') | trim != 'enabled'
         or clamav_timer_active.stdout | default('') | trim != 'active' }}
  loop: >-
    {{ ([['daemon-reload']] if clamav_units is changed else [])
       + ([['enable', '--now', 'hnx-clamav.timer']] if clamav_timer_owed | bool else []) }}
  loop_control:
    label: "{{ item | join(' ') }}"
  changed_when: true
