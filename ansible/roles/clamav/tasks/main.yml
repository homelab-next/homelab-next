- name: Refuse a host that is not Debian-family (the role installs the distribution's package)
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: "clamav supports Debian-family guests only (got {{ ansible_facts['os_family'] }})"

- name: Install clamav, clamav-freshclam
  ansible.builtin.apt:
    name: ['clamav', 'clamav-freshclam']
    state: present

- name: Write the configuration, the scan script and its timer
  ansible.builtin.include_tasks: config.yml

- name: Keep the signatures current (freshclam runs as its own service)
  ansible.builtin.systemd_service:
    name: clamav-freshclam
    enabled: true
    state: started
