# Fixed, not settings: each supported distribution's security origin (its Release file's Origin,
# Label and Suite/Codename). ${distro_codename} is expanded by unattended-upgrades itself.
unattended_upgrades_security_origins:
  Debian: "origin=Debian,codename=${distro_codename}-security,label=Debian-Security"
  Ubuntu: "origin=Ubuntu,archive=${distro_codename}-security"
# logind's ScheduledShutdown as `busctl get-property` prints it: (st) "<type>" <usec since epoch>;
# nothing pending is (st) "" 18446744073709551615 (or 0).
unattended_upgrades_busctl_pattern: '^\(st\) "([^"]*)" ([0-9]+)$'
unattended_upgrades_no_shutdown_usec: [0, 18446744073709551615]
# `shutdown --show` (systemd): "<Reboot|Shutdown|...> scheduled for <time>, use 'shutdown -c' to
# cancel." on a pending one, "No scheduled shutdown." otherwise (either on stdout or stderr).
unattended_upgrades_show_pattern: "(\\S+) scheduled for (.+?), use "
unattended_upgrades_show_none: No scheduled shutdown
