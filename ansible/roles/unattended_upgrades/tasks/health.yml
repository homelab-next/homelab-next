- block:
    # A secret store reboots sealed: with reboot_time "never" a pending shutdown is a failure,
    # whatever scheduled it (config cancels one; this catches one scheduled later).
    - name: Read the scheduled shutdown (reboot_time never)
      ansible.builtin.include_tasks:
        file: scheduled_shutdown.yml
        apply:
          tags: [health]
      when: unattended_upgrades_reboot_time == 'never'
    - name: Fail while a shutdown is scheduled on a reboot-never host
      ansible.builtin.assert:
        that: not unattended_upgrades_shutdown_pending | bool
        fail_msg: >-
          unattended_upgrades: reboot_time is never but logind holds a pending
          {{ unattended_upgrades_shutdown_desc }}; cancel it (`shutdown -c`, or run the role's
          config hook)
      when: unattended_upgrades_reboot_time == 'never'
    - name: Read the stamp of the last unattended run
      ansible.builtin.stat:
        path: "{{ unattended_upgrades_stamp_file }}"
      register: unattended_upgrades_stamp
    - name: Fail unless an unattended run finished recently
      ansible.builtin.assert:
        that:
          - unattended_upgrades_stamp.stat.exists
          - (now(utc=true).timestamp() - unattended_upgrades_stamp.stat.mtime) < unattended_upgrades_max_age_hours | int * 3600
        fail_msg: >-
          unattended_upgrades: no unattended run in the last {{ unattended_upgrades_max_age_hours }}h
          ({{ unattended_upgrades_stamp_file }} is missing or older)
  tags: [health]
