- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Look for a local MTA and a root alias (for notify auto)
  block:
    - name: Look for the local MTA's sendmail
      ansible.builtin.stat:
        path: "{{ lynis_sendmail_cli }}"
      register: lynis_mta
    - name: Look for the aliases file
      ansible.builtin.stat:
        path: "{{ lynis_aliases_file }}"
      register: lynis_aliases_stat
    - name: Read the aliases file
      ansible.builtin.slurp:
        src: "{{ lynis_aliases_file }}"
      register: lynis_aliases
      when: lynis_aliases_stat.stat.exists

- name: Choose the integrity sweep's alert channel
  ansible.builtin.set_fact:
    lynis_notify_mode: >-
      {{ lynis_notify if lynis_notify != 'auto' else
         ('mail' if lynis_mta.stat.exists and lynis_aliases_stat.stat.exists
                    and (lynis_aliases.content | b64decode) is search('(?m)^root\s*:\s*\S')
          else 'none') }}
    lynis_notify_url: "{{ lookup('hnx_registry', lynis_notify_id, field='url') if lynis_notify == 'notify' else '' }}"

- name: Refuse a notify endpoint that is not http(s), or a token over plain http
  ansible.builtin.assert:
    that:
      - lynis_notify_mode != 'notify' or lynis_notify_url is match('^https?://')
      - lynis_notify_mode != 'notify' or lynis_notify_auth_ref == '' or lynis_notify_url is match('^https://')
    fail_msg: "lynis: the notify endpoint {{ lynis_notify_url }} is not http(s), or a token would go over plain http"

- name: Write the ntfy token (owner-only)
  when: lynis_notify_mode == 'notify' and lynis_notify_auth_ref != ''
  block:
    - name: Ensure the token directory exists
      ansible.builtin.file:
        path: "{{ lynis_notify_auth_file | dirname }}"
        state: directory
        mode: "0700"
    - name: Write the token
      ansible.builtin.copy:
        dest: "{{ lynis_notify_auth_file }}"
        content: "{{ lookup('hnx_secret', lynis_notify_auth_ref) }}\n"
        mode: "0600"
      no_log: true

- name: Ensure the script directory exists
  ansible.builtin.file:
    path: "{{ lynis_script | dirname }}"
    state: directory
    mode: "0755"

- name: Write the scan script
  ansible.builtin.template:
    src: scan.sh.j2
    dest: "{{ lynis_script }}"
    mode: "0750"

- name: Write the package integrity sweep
  ansible.builtin.template:
    src: dpkg-verify.py.j2
    dest: "{{ lynis_verify_script }}"
    mode: "0700"
  when: lynis_dpkg_verify | bool

- name: Test the alert channel once when it changed (--test; skipped in check mode)
  when: >-
    lynis_notify_test_on_change | bool and not ansible_check_mode
    and lynis_notify_mode in ['notify', 'mail'] and lynis_dpkg_verify | bool
  block:
    - name: Fingerprint the channel (mode, URL, topic, priority, recipient, token digest)
      ansible.builtin.set_fact:
        lynis_sweep_fp: >-
          {{ [lynis_notify_mode, lynis_notify_url, lynis_notify_topic, lynis_notify_priority | string, lynis_mail_to,
               (lookup('hnx_secret', lynis_notify_auth_ref) | hash('sha256')) if lynis_notify_auth_ref != '' else '']
             | join('|') | hash('sha256') }}
      no_log: true
    - name: Look for the digest of the channel last tested
      ansible.builtin.slurp:
        src: "{{ lynis_state_dir }}/sweep-channel-test.sha256"
      register: lynis_sweep_tested
      failed_when: false
    - name: Send one test message through the script's own send path
      ansible.builtin.command:
        argv: ["{{ lynis_verify_script }}", --test]
      register: lynis_sweep_test
      when: >-
        lynis_sweep_tested.content is not defined
        or (lynis_sweep_tested.content | b64decode | trim) != lynis_sweep_fp
      changed_when: true
      failed_when: false
    - name: Fail the play with the script's error when the channel could not deliver
      ansible.builtin.assert:
        that: lynis_sweep_test is skipped or lynis_sweep_test.rc == 0
        fail_msg: >-
          lynis: the alert channel did not deliver its test message
          ({{ (lynis_sweep_test.stderr | default('') | trim) or (lynis_sweep_test.stdout | default('') | trim) }});
          a control whose channel cannot deliver is not a control (set lynis_notify_test_on_change: false to skip the test)
    - name: Ensure the state directory exists
      ansible.builtin.file:
        path: "{{ lynis_state_dir }}"
        state: directory
        mode: "0700"
    - name: Remember the tested channel, so an unchanged one is not tested again
      ansible.builtin.copy:
        dest: "{{ lynis_state_dir }}/sweep-channel-test.sha256"
        content: "{{ lynis_sweep_fp }}\n"
        mode: "0600"
      when: lynis_sweep_test is not skipped

- name: Install the shared last-run writer and the record directory (role last_run)
  ansible.builtin.include_role:
    name: last_run
  vars:
    last_run_dir: "{{ lynis_last_run_dir }}"
    last_run_group: "{{ lynis_last_run_group }}"
    last_run_writer: "{{ lynis_last_run_writer }}"

- name: Write the service and timer units
  ansible.builtin.template:
    src: "scan.{{ item }}.j2"
    dest: "{{ lynis_unit_dir }}/hnx-lynis.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  register: lynis_units

- name: Ask whether the lynis timer is enabled
  ansible.builtin.command:
    argv: ["{{ lynis_systemctl_cli }}", is-enabled, hnx-lynis.timer]
  register: lynis_timer_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ask whether the lynis timer is started
  ansible.builtin.command:
    argv: ["{{ lynis_systemctl_cli }}", is-active, hnx-lynis.timer]
  register: lynis_timer_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Reload systemd (units changed) and enable and start the timer (changed, or not both)
  ansible.builtin.command:
    argv: "{{ [lynis_systemctl_cli] + item }}"
  vars:
    lynis_timer_owed: >-
      {{ lynis_units is changed
         or lynis_timer_enabled.stdout | default('') | trim != 'enabled'
         or lynis_timer_active.stdout | default('') | trim != 'active' }}
  loop: >-
    {{ ([['daemon-reload']] if lynis_units is changed else [])
       + ([['enable', '--now', 'hnx-lynis.timer']] if lynis_timer_owed | bool else []) }}
  loop_control:
    label: "{{ item | join(' ') }}"
  changed_when: true
