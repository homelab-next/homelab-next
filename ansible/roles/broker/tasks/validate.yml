# SPDX-License-Identifier: Apache-2.0
# Values land in systemd units and the relay's target file: refuse anything that could add a line,
# a directive or a key, and a bus endpoint that would carry a password in clear off the host.
- name: Validate the settings
  ansible.builtin.assert:
    that:
      - broker_logical_id is match('^[a-z0-9][a-z0-9-]*\Z')
      - broker_hnx_bin is match('^/[A-Za-z0-9._/-]+\Z')
      - broker_runtime_release is match('^[0-9a-f]{0,64}\Z')
      - broker_user is match('^[a-z_][a-z0-9_-]{0,31}\Z') and broker_user != 'root'
      - broker_group is match('^[a-z_][a-z0-9_-]{0,31}\Z') and broker_group != 'root'
      - broker_clients_group is match('^[a-z_][a-z0-9_-]{0,31}\Z') and broker_clients_group not in ['root', broker_group]
      - broker_client_users | select('match', '^[a-z_][a-z0-9_-]{0,31}\Z') | list | length == broker_client_users | length
      - broker_client_users | intersect(['root', broker_user, broker_relay_user]) | length == 0
      - broker_config_dir is match('^/[A-Za-z0-9._/-]+\Z')
      - broker_state_root is match('^/[A-Za-z0-9._/-]+\Z')
      - broker_data_root is match('^/[A-Za-z0-9._/-]+\Z')
      - broker_socket_dir is match('^/run/[A-Za-z0-9._-]+\Z')
      - broker_socket_mode is match('^[0-7]?[0-7][0-7]0\Z')
      - broker_handlers | map('basename') | select('match', '^[A-Za-z0-9][A-Za-z0-9._-]*\Z') | list | length == broker_handlers | length
      - broker_handlers | map('basename') | unique | length == broker_handlers | length
      - broker_secret_refs.keys() | select('match', '^[A-Z][A-Z0-9_]{0,63}\Z') | list | length == broker_secret_refs | length
      - broker_secret_refs.values() | select('match', '^secret:[a-z0-9][a-z0-9/_.-]*\Z') | list | length == broker_secret_refs | length
      - broker_approvals_url == '' or broker_approvals_url is match('^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/[A-Za-z0-9._/-]*\Z')
      - broker_backup_dir is match('^/[A-Za-z0-9._/-]+\Z')
      - broker_export_dir is match('^/[A-Za-z0-9._/-]+\Z')
      - broker_systemd_dir is match('^/[A-Za-z0-9._/-]+\Z')
    fail_msg: >-
      broker: a logical id, absolute paths ([A-Za-z0-9._/-]), a socket directory under /run, a
      socket mode that grants others nothing, non-root users and groups (the clients' group is not
      the broker's own), handler files with plain distinct names, secrets as {NAME: secret:<name>},
      and an https Approvals URL without query or credentials (or none)

- name: Validate the relay's settings
  ansible.builtin.assert:
    that:
      - broker_relay_user is match('^[a-z_][a-z0-9_-]{0,31}\Z') and broker_relay_user not in ['root', broker_user]
      - broker_relay_group is match('^[a-z_][a-z0-9_-]{0,31}\Z') and broker_relay_group not in ['root', broker_group, broker_clients_group]
      - broker_relay_config_dir is match('^/[A-Za-z0-9._/-]+\Z')
      - broker_relay_state_dir is match('^/[A-Za-z0-9._/-]+\Z')
      # a password goes only over tls:// or to loopback (the adapter refuses it otherwise)
      - >-
        broker_relay_events_endpoint is match('^tls://[A-Za-z0-9.-]+:[0-9]{1,5}\Z')
        or broker_relay_events_endpoint is match('^nats://(127\.[0-9.]+|\[::1\]|localhost):[0-9]{1,5}\Z')
      - broker_relay_events_user is match('^[a-z][a-z0-9-]{0,31}\Z')
      - broker_relay_password_ref is match('^secret:[a-z0-9][a-z0-9/_.-]*\Z')
      - broker_relay_ca_file == '' or broker_relay_ca_file is match('^/[A-Za-z0-9._/-]+\Z')
      - broker_relay_stream is match('^[A-Z][A-Z0-9_]{0,31}\Z')
      - broker_relay_subject_prefix is match('^[a-z][a-z0-9_-]{0,31}\Z')
      - broker_relay_duplicate_window | int > 0
    fail_msg: >-
      broker: the relay needs its own non-root user and group, absolute paths, a bus endpoint that
      is tls://host:port or nats:// to loopback, a bus user, its password as a secret: reference,
      the standing stream (upper-case) and its subject prefix, and a positive duplicate window
  when: broker_relay | bool
