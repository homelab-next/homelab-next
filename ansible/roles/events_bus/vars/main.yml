# Fixed, not settings: where the release archive is unpacked and the provisioning tool installed.
events_bus_cache_dir: /var/cache/homelabnext/events-bus
events_bus_provision_bin: /usr/local/libexec/homelabnext/hnx-events-provision
# The upper bound on what any user's allow-list may name is the hnx_bus_subject_problems filter
# (ansible/plugins/filter/hnx_bus.py), compared token by token: no subject starting with a
# wildcard, nothing reaching $SYS, another client's _INBOX or a destructive stream call
# (STREAM.DELETE/PURGE/UPDATE, STREAM.MSG.DELETE), nothing covering $JS.API.> or $JS.API.STREAM.>.
