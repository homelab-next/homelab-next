# SPDX-License-Identifier: Apache-2.0
# The events capability's bus (docs/events.md; the lab runs the same server in a container,
# compose/lab-in-a-box/config/nats/nats.conf): the pinned server release, the bus account (the
# streams and the operator's user) and one account per client user that imports exactly its own
# calls from it (a reply subject is not permission-checked: homelab-next #360 round 5), every
# user an allow-list and nothing else, JetStream on disk, the standing streams provisioned with
# limits by the operator's user (never by a client). Passwords are stored as bcrypt hashes.
#
# It listens on loopback only, and validation refuses any other address: a client on another host
# needs TLS (the adapter refuses a password over plaintext nats:// to anything but loopback), which
# this role does not set up yet.
# events_bus_archive_url and _sha256 pin the server (no default: the playbook pins the release).
events_bus_version: "2.15.2"
events_bus_user: hnx-events
events_bus_group: hnx-events
events_bus_bin: /usr/local/libexec/homelabnext/nats-server
events_bus_config_dir: /etc/hnx-events
events_bus_store_dir: /var/lib/hnx-events
events_bus_listen_address: 127.0.0.1  # no-raw-endpoint: allow loopback default, the bus has no TLS listener yet
events_bus_port: 4222
# The monitoring endpoint (/healthz, /varz): loopback only, for the health hook.
events_bus_monitor_port: 8222
events_bus_account: HNX
events_bus_max_memory_store: 33554432
events_bus_max_file_store: 1073741824
# The standing streams: [{name, subject_prefix, max_bytes}], each with a DLQ of a quarter its
# size (homelabnext.conform.adapters.nats_jetstream.provision_streams), created by
# events_bus_admin_user when missing; an existing one is left alone.
events_bus_streams: []
events_bus_admin_user: ""
events_bus_admin_password_ref: ""
# The durables clients bind to: [{stream, durable, user, filter, ack_wait, max_deliver,
# deliver_policy | replay_s | start_seq}], each a PULL durable (no deliver_subject) owned by one user, who is
# granted its CONSUMER.INFO, CONSUMER.MSG.NEXT and acks and nothing that creates a consumer: a
# consumer create takes a push deliver_subject too, which the server delivers as itself to any
# subject, so only events_bus_admin_user creates them. Validated always; created only when
# events_bus_provision_durables is true.
events_bus_durables: []
# Off by default: a durable's start position is fixed when it is created (deliver_policy new sees
# only what is published after it exists), so the first creation on a stream that already holds
# events is the operator's decision. Turn it on once that is decided (docs/broker.md).
events_bus_provision_durables: false
# Optional: a user that only watches for what an ACL bypass would leave -- a stream or durable
# deleted, a stream changed ($JS.EVENT.ADVISORY.STREAM.DELETED.>, .CONSUMER.DELETED.>,
# .STREAM.UPDATED.>). It lives in an account of its own (<events_bus_account>-<user>) that imports
# exactly those advisories from the bus account as streams; it publishes nothing and holds no
# JetStream call. "" (the default): none; the health hook's missing-stream check is the backstop.
events_bus_monitor_user: ""
events_bus_monitor_password_ref: ""
# The interpreter of a homelab-next release with the nats extra (role hnx_runtime): provisioning
# uses the project's own adapter.
events_bus_hnx_python: /opt/hnx/current/bin/python
# SSH logins whose only power is a TCP forward to this bus, for a client on another host while the
# bus listens on loopback and has no TLS listener: [{user, ed25519 (the public key's base64), from: [addresses], state}].
# Each is a system account (no shell, locked password, a root-owned home) in
# events_bus_forward_ssh_group (sshd's AllowGroups), with ONE authorized key restricted to
# restrict,port-forwarding,permitopen=<this bus>,from=<from>,command="/bin/false", and a sshd Match
# block that allows a local TCP forward to the bus's own listen address and port and nothing else (no
# TTY, no remote forward, no socket forward, no agent, no X11, no tunnel). The client still signs in
# to the bus with its own bus user and password: the forward carries that, encrypted, to loopback.
# `state: absent` removes the account and its key. [] (the default): none, and no drop-in.
events_bus_forward_logins: []
events_bus_forward_ssh_group: hnx-ssh
events_bus_forward_home: /var/lib/hnx-events-forward
events_bus_forward_sshd_dropin: /etc/ssh/sshd_config.d/50-hnx-events-forward.conf
events_bus_sshd_main_config: /etc/ssh/sshd_config
events_bus_sshd_cli: sshd
events_bus_ssh_service: ssh
events_bus_systemd_dir: /etc/systemd/system
events_bus_start: true
