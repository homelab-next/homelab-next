# SPDX-License-Identifier: Apache-2.0
- block:
    - name: Ask the bus for its health, JetStream included
      ansible.builtin.uri:
        url: "{{ events_bus_monitor_url }}/healthz?js-enabled-only=true"
        status_code: 200
        timeout: 5
      changed_when: false
    - name: And for its consumers, none of them a push consumer
      ansible.builtin.include_tasks: push_consumers.yml
  tags: [health]
