# Data only (role interface section 2): the configuration and the unit are main's and are left as
# they are. The bus is stopped for the copy (JetStream writes its store while it runs) and started
# again after; the store is the bus user's, as main makes it.
- block:
    - name: Stop the bus
      ansible.builtin.systemd_service:
        name: hnx-events.service
        state: stopped
    - name: Restore JetStream's store
      ansible.builtin.copy:
        src: "{{ events_bus_restore_source }}/"
        dest: "{{ events_bus_store_dir }}/"
        remote_src: true
        owner: "{{ events_bus_user }}"
        group: "{{ events_bus_group }}"
        mode: preserve
    - name: Start the bus again
      ansible.builtin.systemd_service:
        name: hnx-events.service
        state: started
  tags: [restore]
