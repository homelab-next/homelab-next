- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Create the hub's group
  ansible.builtin.group:
    name: "{{ status_hub_group }}"
    system: true

- name: Create the broker socket's group (the Approvals page)
  ansible.builtin.group:
    name: "{{ status_hub_broker_clients_group }}"
    system: true
  when: status_hub_approvals_socket | length > 0

- name: Create the hub's account
  ansible.builtin.user:
    name: "{{ status_hub_user }}"
    group: "{{ status_hub_group }}"
    groups: "{{ [status_hub_broker_clients_group] if status_hub_approvals_socket else [] }}"
    append: true
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin

- name: Create the directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ status_hub_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ status_hub_config_dir }}", owner: root, mode: "0750"}
    - {path: "{{ status_hub_state_dir }}", owner: "{{ status_hub_user }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"

- name: Install the registry
  ansible.builtin.copy:
    src: "{{ status_hub_registry }}"
    dest: "{{ status_hub_config_dir }}/services.yml"
    owner: root
    group: "{{ status_hub_group }}"
    mode: "0640"
  register: status_hub_registry_file

- name: Write agents.yml and views.yml
  ansible.builtin.template:
    src: "{{ item }}.yml.j2"
    dest: "{{ status_hub_config_dir }}/{{ item }}.yml"
    owner: root
    group: "{{ status_hub_group }}"
    mode: "0640"
  loop: "{{ ['agents'] if status_hub_views_file | length > 0 else ['agents', 'views'] }}"
  register: status_hub_config

- name: Install the lab's own views (replacing the built-in menu)
  ansible.builtin.copy:
    src: "{{ status_hub_views_file }}"
    dest: "{{ status_hub_config_dir }}/views.yml"
    owner: root
    group: "{{ status_hub_group }}"
    mode: "0640"
  register: status_hub_views_installed
  when: status_hub_views_file | length > 0

- name: Create the register files' directory
  ansible.builtin.file:
    path: "{{ status_hub_registers_dir }}"
    state: directory
    owner: root
    group: "{{ status_hub_group }}"
    mode: "0750"
  when: status_hub_registers_dir | length > 0

# The guest pages (Topology, Baselines) and the topology, dataflow and schedule JSON read the lab's
# guest directory and site model: delivered flat beside the registry, and a guest file the lab no
# longer has is removed (a stale guest would stay on the map).
- name: Create the guest directory
  ansible.builtin.file:
    path: "{{ status_hub_config_dir }}/guests"
    state: directory
    owner: root
    group: "{{ status_hub_group }}"
    mode: "0750"
  when: status_hub_guests_src | length > 0

- name: Deliver the guest files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ status_hub_config_dir }}/guests/{{ item | basename }}"
    owner: root
    group: "{{ status_hub_group }}"
    mode: "0640"
  loop: "{{ query('ansible.builtin.fileglob', status_hub_guests_src ~ '/*.yml') | sort }}"
  register: status_hub_guests_delivered
  when: status_hub_guests_src | length > 0

- name: List the guest files on the hub host
  ansible.builtin.find:
    paths: "{{ status_hub_config_dir }}/guests"
    patterns: ["*.yml"]
    file_type: file
  register: status_hub_guests_present
  check_mode: false
  when: status_hub_guests_src | length > 0

- name: Remove a guest file the lab no longer has
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ status_hub_guests_present.files | map(attribute='path')
       | reject('in', query('ansible.builtin.fileglob', status_hub_guests_src ~ '/*.yml') | map('basename')
                | map('regex_replace', '^', status_hub_config_dir ~ '/guests/') | list)
       | list }}
  register: status_hub_guests_removed
  when: status_hub_guests_src | length > 0

- name: Deliver the site model
  ansible.builtin.copy:
    src: "{{ status_hub_site_src }}"
    dest: "{{ status_hub_config_dir }}/site.yml"
    owner: root
    group: "{{ status_hub_group }}"
    mode: "0640"
  register: status_hub_site_delivered
  when: status_hub_site_src | length > 0

- name: Check the views against their schema and the registry
  ansible.builtin.command:
    argv: ["{{ status_hub_hnx_bin }}", status, views, check, "{{ status_hub_config_dir }}/views.yml",
           --registry, "{{ status_hub_config_dir }}/services.yml"]
  changed_when: false
  check_mode: false  # read-only: it runs in --check too

- name: Write the secrets the hub reads at run time (HNX_SECRET_<NAME>, root and the hub only)
  ansible.builtin.copy:
    dest: "{{ status_hub_config_dir }}/secrets.env"
    content: |
      # Managed by homelabnext (role status_hub): resolved from their references.
      {% for ref in status_hub_secret_refs | sort %}
      {% set value = lookup('hnx_secret', ref) %}
      {% if value is search("['\\\\\n\r]") %}{{ 0 / 0 }}{% endif %}
      HNX_SECRET_{{ ref | regex_replace('^secret:', '') | regex_replace('[^A-Za-z0-9]', '_') | upper }}='{{ value }}'
      {% endfor %}
    owner: root
    group: "{{ status_hub_group }}"
    mode: "0640"
  register: status_hub_env
  no_log: true
  diff: false

- name: Create the TLS directory (root, readable by the hub's group)
  ansible.builtin.file:
    path: "{{ status_hub_tls_dir }}"
    state: directory
    owner: root
    group: "{{ status_hub_group }}"
    mode: "0750"
  when: status_hub_tls | bool

# The certificate, its key and the client CA come from the secret store by reference (never a
# literal in the inventory), like every other secret the roles deliver.
- name: Write the server certificate, its key and the client CA bundle
  ansible.builtin.copy:
    dest: "{{ status_hub_tls_dir }}/{{ item.file }}"
    content: "{{ lookup('hnx_secret', item.ref) | trim }}\n"
    owner: root
    group: "{{ status_hub_group }}"
    mode: "0640"
  loop:
    - {file: server.crt, ref: "{{ status_hub_tls_cert_ref }}"}
    - {file: server.key, ref: "{{ status_hub_tls_key_ref }}"}
    - {file: client-ca.crt, ref: "{{ status_hub_client_ca_ref }}"}
  loop_control:
    label: "{{ item.file }}"
  register: status_hub_tls_files
  no_log: true
  diff: false
  when: status_hub_tls | bool

- name: Write the unit
  ansible.builtin.template:
    src: hnx-hub.service.j2
    dest: "{{ status_hub_systemd_dir }}/hnx-hub.service"
    owner: root
    group: root
    mode: "0644"
  register: status_hub_unit

- name: Enable and start the hub, restarting it when its unit, configuration or secrets changed
  ansible.builtin.systemd_service:
    name: hnx-hub.service
    enabled: true
    daemon_reload: "{{ status_hub_unit is changed }}"
    state: >-
      {{ 'restarted' if (status_hub_unit is changed or status_hub_registry_file is changed
         or status_hub_config is changed or status_hub_env is changed
         or (status_hub_views_installed is defined and status_hub_views_installed is changed)
         or (status_hub_guests_delivered is defined and status_hub_guests_delivered is changed)
         or (status_hub_guests_removed is defined and status_hub_guests_removed is changed)
         or (status_hub_site_delivered is defined and status_hub_site_delivered is changed)
         or status_hub_tls_files is changed) else 'started' }}
  when: status_hub_start | bool

- name: Wait for the hub to answer (plain HTTP)
  ansible.builtin.uri:
    url: "http://{{ ('[' ~ status_hub_bind_address ~ ']') if ':' in status_hub_bind_address else status_hub_bind_address }}:{{ status_hub_port | int }}/status.json"
    headers:
      Host: "{{ status_hub_allowed_hosts | first if status_hub_bind_address not in status_hub_loopback else 'localhost' }}"
    status_code: 200
  register: status_hub_up
  until: status_hub_up.status == 200
  retries: 30
  delay: 1
  changed_when: false
  when: status_hub_start | bool and not status_hub_tls | bool

- name: Wait for the hub's TLS listener
  ansible.builtin.wait_for:
    host: "{{ status_hub_bind_address }}"
    port: "{{ status_hub_port | int }}"
    timeout: 30
  when: status_hub_start | bool and status_hub_tls | bool

- name: Check the TLS listener (refused without a client certificate)
  ansible.builtin.include_tasks: tls_probe.yml
  when: status_hub_start | bool and status_hub_tls | bool

- name: Collect the registered status sources (a timer; state.json for the hub to read)
  ansible.builtin.include_tasks: collect.yml
  when: status_hub_collect | bool

# The scheduled copy of the hub's state (ADR-0042 decision 2, the same timer every compose application uses,
# switched on by the same group variable): the activity store through SQLite's online backup, the rest of the
# state directory as a tree. The hub runs as a unit, so the timer's manifest has no database job and no compose file.
- name: Schedule the copy of the hub's state
  ansible.builtin.include_role:
    name: compose_app
    tasks_from: export_timer
  vars:
    compose_app_name: "{{ status_hub_logical_id }}"
    compose_app_dir: "{{ status_hub_config_dir }}"
    compose_app_owner: root
    compose_app_group: root
    compose_app_export_dir: "{{ status_hub_export_dir }}"
    compose_app_export_files:
      - {name: hub-activity-db, kind: sqlite, glob: "{{ status_hub_state_dir }}/activity.db"}
      - name: hub-state
        kind: tree
        path: "{{ status_hub_state_dir }}"
        exclude: ["activity.db*", "*.lock"]
  when: compose_app_export_timer | default(false) | bool
