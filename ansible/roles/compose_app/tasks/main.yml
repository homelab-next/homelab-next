- name: Validate the application spec
  ansible.builtin.include_tasks: validate.yml

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ compose_app_dir }}"
    - "{{ compose_app_data_dir }}"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ compose_app_dir }}/docker-compose.yml"
    mode: "0640"
  register: compose_app_rendered

- name: Validate rendered file with docker compose config
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ compose_app_dir }}/docker-compose.yml", config, --quiet]
  changed_when: false
  when: compose_app_validate_with_docker | bool

- name: Start the application
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ compose_app_dir }}/docker-compose.yml", up, -d, --remove-orphans]
  changed_when: compose_app_rendered.changed
  when: compose_app_start | bool
