- name: Validate the application spec
  ansible.builtin.include_tasks: validate.yml

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ compose_app_owner }}"
    group: "{{ compose_app_group }}"
    mode: "0750"
  loop:
    - "{{ compose_app_dir }}"
    - "{{ compose_app_data_dir }}"

- name: Create the secrets directory
  ansible.builtin.file:
    path: "{{ compose_app_dir }}/secrets"
    state: directory
    owner: "{{ compose_app_owner }}"
    group: "{{ compose_app_group }}"
    mode: "0700"
  when: compose_app_secret_env | length > 0

# One env_file per service, 0600, read by docker compose on the host and never written into
# docker-compose.yml. Values are single-quoted, which compose reads literally (no $ expansion);
# validate.yml refuses a value holding a quote or a line break.
- name: Write secret env_files
  ansible.builtin.copy:
    dest: "{{ compose_app_dir }}/secrets/{{ item.key }}.env"
    content: "{% for k, v in item.value | dictsort %}{{ k }}='{{ v }}'\n{% endfor %}"
    owner: "{{ compose_app_owner }}"
    group: "{{ compose_app_group }}"
    mode: "0600"
  loop: "{{ compose_app_secret_env | dict2items }}"
  register: compose_app_secrets_written
  no_log: true
  diff: false

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ compose_app_dir }}/docker-compose.yml"
    owner: "{{ compose_app_owner }}"
    group: "{{ compose_app_group }}"
    mode: "0640"
  register: compose_app_rendered

- name: Validate rendered file with docker compose config
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ compose_app_dir }}/docker-compose.yml", config, --quiet]
  changed_when: false
  when: compose_app_validate_with_docker | bool

# With the cgroupfs driver docker would read the slice name as a cgroup directory of its own,
# outside the slice systemd limits: the containers would run unconfined while the slice looked
# installed. Debian's docker on cgroup v2 uses systemd; docker_engine leaves the default.
- name: Read docker's cgroup driver (a cgroup parent needs systemd)
  ansible.builtin.command:
    argv: [docker, info, --format, "{{ '{{' }}.CgroupDriver{{ '}}' }}"]
  register: compose_app_cgroup_driver
  changed_when: false
  check_mode: false
  when: compose_app_start | bool and compose_app_cgroup_parent | length > 0

- name: Refuse a cgroup parent docker would not put under its systemd slice
  ansible.builtin.assert:
    that:
      - compose_app_cgroup_driver.stdout | trim == 'systemd'
    fail_msg: >-
      docker's cgroup driver is {{ compose_app_cgroup_driver.stdout | trim | to_json }}, not systemd:
      with it the containers would not run in {{ compose_app_cgroup_parent }} (set "exec-opts":
      ["native.cgroupdriver=systemd"] in /etc/docker/daemon.json, or leave hnx_module_slice unset)
  when: compose_app_start | bool and compose_app_cgroup_parent | length > 0

# A slice with no unit file is still created by systemd when docker asks for it, with no limits:
# the containers would look confined and be unlimited. The limits play installs the unit first.
- name: Read the slice's unit (installed by the module's limits play)
  ansible.builtin.command:
    argv: [systemctl, show, --property=LoadState, --property=FragmentPath, "{{ compose_app_cgroup_parent }}"]
  register: compose_app_slice_unit
  changed_when: false
  check_mode: false
  when: compose_app_start | bool and compose_app_cgroup_parent | length > 0

# Under --check the limits play only reports the slice file it would write, so on a fresh guest there
# is no unit for the slice yet: the dry run says so instead of failing, and a real run (which
# installs the unit first, or stops here) is judged as ever.
- name: Say the slice's unit is not installed yet (--check, the limits play has not written it)
  ansible.builtin.debug:
    msg: >-
      {{ compose_app_cgroup_parent }} is not installed yet (check mode): the module's limits play
      writes it, and a real run refuses to start the containers unless it is there
  when: >-
    compose_app_start | bool and compose_app_cgroup_parent | length > 0 and ansible_check_mode
    and 'LoadState=loaded' not in compose_app_slice_unit.stdout_lines

- name: Refuse a slice that has no unit file (it would carry no limits)
  ansible.builtin.assert:
    that:
      - "'LoadState=loaded' in compose_app_slice_unit.stdout_lines"
      - compose_app_slice_unit.stdout_lines | select('match', '^FragmentPath=/.+') | list | length == 1
    fail_msg: >-
      {{ compose_app_cgroup_parent }} has no unit file: install the module limits first (modules.yml,
      tag hnx_limits) or the containers would run in an empty slice with no limits
  when: >-
    compose_app_start | bool and compose_app_cgroup_parent | length > 0
    and not (ansible_check_mode and 'LoadState=loaded' not in compose_app_slice_unit.stdout_lines)

- name: Start the application
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ compose_app_dir }}/docker-compose.yml", up, -d, --remove-orphans]
  changed_when: compose_app_rendered.changed or compose_app_secrets_written.changed
  when: compose_app_start | bool

# A container with a restart policy that did not come back after a power cycle stays down until
# someone looks (LL-571): at boot this unit runs the same `up -d`, after docker.
- name: Install and enable the boot unit
  when: compose_app_boot_unit | bool and compose_app_start | bool
  block:
    - name: Write the boot unit
      ansible.builtin.template:
        src: boot.service.j2
        dest: "{{ compose_app_unit_dir }}/hnx-compose-{{ compose_app_name }}.service"
        mode: "0644"
      register: compose_app_boot_written
    - name: Ask whether the boot unit is enabled
      ansible.builtin.command:
        argv: ["{{ compose_app_systemctl_cli }}", is-enabled, "hnx-compose-{{ compose_app_name }}.service"]
      register: compose_app_boot_enabled
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Reload systemd (the unit changed) and enable it (not enabled yet)
      ansible.builtin.command:
        argv: "{{ [compose_app_systemctl_cli] + item }}"
      loop: >-
        {{ ([['daemon-reload']] if compose_app_boot_written is changed else [])
           + ([['enable', 'hnx-compose-' ~ compose_app_name ~ '.service']]
              if (compose_app_boot_written is changed or compose_app_boot_enabled.stdout | default('') | trim != 'enabled') else []) }}
      loop_control:
        label: "{{ item | join(' ') }}"
      changed_when: true

# The opt-out has to opt out: with the boot unit off, one left by an earlier run is disabled and
# deleted (idempotent: nothing to do when there is none).
- name: Look for a boot unit left by an earlier run
  ansible.builtin.stat:
    path: "{{ compose_app_unit_dir }}/hnx-compose-{{ compose_app_name }}.service"
  register: compose_app_boot_left
  when: not (compose_app_boot_unit | bool)

- name: Remove the boot unit the opt-out no longer wants
  when: not (compose_app_boot_unit | bool) and compose_app_boot_left.stat.exists
  block:
    - name: Disable it
      ansible.builtin.command:
        argv: ["{{ compose_app_systemctl_cli }}", disable, "hnx-compose-{{ compose_app_name }}.service"]
      changed_when: true
      failed_when: false
    - name: Delete the unit file
      ansible.builtin.file:
        path: "{{ compose_app_unit_dir }}/hnx-compose-{{ compose_app_name }}.service"
        state: absent
    - name: Reload systemd
      ansible.builtin.command:
        argv: ["{{ compose_app_systemctl_cli }}", daemon-reload]
      changed_when: true
