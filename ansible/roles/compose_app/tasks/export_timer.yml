# The scheduled, application-consistent dump (ADR-0042 decision 2, ADR-0008 decision 1): one
# systemd timer per application runs hnx-export-run, which dumps every database engine the spec
# runs (or compose_app_export_engines names) from inside its own container into the export
# directory, where the guest's image backup picks it up; a restore drill reads it from there.
# Besides the databases, compose_app_export_files names SQLite files (a glob) and state trees the same
# timer copies and verifies (a product whose state is SQLite or plain files has no database server to
# dump). Opt-in with compose_app_export_timer; an application with neither renders nothing.
- name: Work out the dump jobs (a database image, or the explicit override; none disables)
  ansible.builtin.set_fact:
    compose_app_export_jobs: >-
      {%- set out = [] -%}
      {%- for sname, svc in (compose_app_spec | default({}, true)).services | default({}, true) | dictsort -%}
      {%- set base = (svc.image | string).split('/')[-1] -%}
      {%- set auto = 'postgres' if base is match('^(postgres|postgis|pgvector|timescaledb)') else ('mysql' if base is match('^(mariadb|mysql)') else '') -%}
      {%- set engine = compose_app_export_engines[sname] | default(auto) -%}
      {%- if engine in ['postgres', 'mysql'] -%}
      {%- set _ = out.append({'service': sname, 'engine': engine}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- for f in compose_app_export_files -%}
      {%- set base = {'service': f.name, 'engine': f.kind} -%}
      {%- if f.kind == 'sqlite' -%}
      {%- set extra = {'glob': f.glob} -%}
      {%- else -%}
      {%- set extra = {'path': f.path, 'exclude': f.exclude | default([])} -%}
      {%- if f.pre_exec is defined -%}{%- set extra = extra | combine({'pre_exec': f.pre_exec}) -%}{%- endif -%}
      {%- if f.stop_service | default(false) -%}{%- set extra = extra | combine({'stop_service': true}) -%}{%- endif -%}
      {%- endif -%}
      {%- set _ = out.append(base | combine(extra)) -%}
      {%- endfor -%}
      {{ out }}
    compose_app_export_images: >-
      {%- set out = {} -%}
      {%- for sname, svc in (compose_app_spec | default({}, true)).services | default({}, true) | dictsort -%}
      {%- set _ = out.update({sname: svc.image ~ ':' ~ svc.tag ~ '@' ~ svc.digest}) -%}
      {%- endfor -%}
      {{ out }}

- name: Refuse an engine the dump does not know
  ansible.builtin.assert:
    that:
      - compose_app_export_engines.values() | reject('in', ['postgres', 'mysql', 'none']) | list | length == 0
      - compose_app_export_engines.keys() | reject('in', (compose_app_spec | default({}, true)).services | default({}, true) | list) | list | length == 0
    fail_msg: "compose_app_export_engines: each key is a service of the spec and each value postgres, mysql or none"

- name: Refuse a file job the script would not run
  ansible.builtin.assert:
    that:
      - compose_app_export_files | map(attribute='kind') | reject('in', ['sqlite', 'tree']) | list | length == 0
      - compose_app_export_files | selectattr('kind', 'eq', 'sqlite') | rejectattr('glob', 'defined') | list | length == 0
      - compose_app_export_files | selectattr('kind', 'eq', 'tree') | rejectattr('path', 'defined') | list | length == 0
      - compose_app_export_files | map(attribute='name') | unique | list | length == compose_app_export_files | length
      - (compose_app_export_files | map(attribute='name') | list) | intersect(compose_app_export_jobs | rejectattr('engine', 'in', ['sqlite', 'tree']) | map(attribute='service') | list) | length == 0
      # a tree's pre_exec is {service, argv: [str, ...]}; stop_service is a bool
      - compose_app_export_files | selectattr('kind', 'eq', 'tree') | selectattr('pre_exec', 'defined') | rejectattr('pre_exec.service', 'defined') | list | length == 0
      - compose_app_export_files | selectattr('kind', 'eq', 'tree') | selectattr('pre_exec', 'defined') | rejectattr('pre_exec.argv', 'defined') | list | length == 0
      - compose_app_export_files | selectattr('kind', 'eq', 'tree') | selectattr('pre_exec', 'defined') | map(attribute='pre_exec.argv') | map('length') | reject('gt', 0) | list | length == 0
      - compose_app_export_files | selectattr('kind', 'eq', 'sqlite') | selectattr('pre_exec', 'defined') | list | length == 0
      - compose_app_export_files | selectattr('kind', 'eq', 'sqlite') | selectattr('stop_service', 'defined') | list | length == 0
    fail_msg: "compose_app_export_files: each entry has a unique name, a kind (sqlite with a glob, tree with a path) and a name no service of the spec uses; a tree's pre_exec is {service, argv: [str, ...]} and stop_service is a bool; a sqlite entry has neither"

- name: Remove the timer an application with no database no longer wants
  when: compose_app_export_jobs | length == 0
  block:
    - name: Look for the units an earlier run left
      ansible.builtin.stat:
        path: "{{ compose_app_unit_dir }}/hnx-export-{{ compose_app_name }}.timer"
      register: compose_app_export_left
    - name: Disable and delete them
      when: compose_app_export_left.stat.exists
      block:
        - name: Disable the timer
          ansible.builtin.command:
            argv: ["{{ compose_app_systemctl_cli }}", disable, --now, "hnx-export-{{ compose_app_name }}.timer"]
          changed_when: true
          failed_when: false
        - name: Delete the unit files
          ansible.builtin.file:
            path: "{{ compose_app_unit_dir }}/hnx-export-{{ compose_app_name }}.{{ item }}"
            state: absent
          loop: [service, timer]
        - name: Reload systemd
          ansible.builtin.command:
            argv: ["{{ compose_app_systemctl_cli }}", daemon-reload]
          changed_when: true

- name: Install the dump timer
  when: compose_app_export_jobs | length > 0
  block:
    - name: Create the script directory
      ansible.builtin.file:
        path: "{{ compose_app_export_script | dirname }}"
        state: directory
        owner: "{{ compose_app_owner }}"
        group: "{{ compose_app_group }}"
        mode: "0755"

    # A module that bind-mounts export/db into its database container for its own export hook owns
    # it as the database's user (keycloak, lakekeeper, openproject, intelowl, dfir-iris): the dump
    # only creates the directory when it is missing and never changes an existing one's owner or
    # mode, or each deploy would hand it back and forth (the dump runs as root and writes beneath it).
    - name: Look for the export directory
      ansible.builtin.stat:
        path: "{{ compose_app_export_dir }}/db"
      register: compose_app_export_db_dir

    - name: Create the export directory when it is missing
      ansible.builtin.file:
        path: "{{ compose_app_export_dir }}/db"
        state: directory
        owner: "{{ compose_app_owner }}"
        group: "{{ compose_app_group }}"
        mode: "0700"
      when: not compose_app_export_db_dir.stat.exists

    - name: Install the dump script
      ansible.builtin.copy:
        src: hnx-export-run.py
        dest: "{{ compose_app_export_script }}"
        owner: "{{ compose_app_owner }}"
        group: "{{ compose_app_group }}"
        mode: "0755"

    - name: Does any job need the compose file (a database dump, a pre_exec, or a stop_service)
      ansible.builtin.set_fact:
        compose_app_export_needs_compose: >-
          {{ (compose_app_export_jobs | selectattr('engine', 'in', ['postgres', 'mysql']) | list | length > 0)
             or (compose_app_export_jobs | selectattr('engine', 'eq', 'tree') | selectattr('pre_exec', 'defined') | list | length > 0)
             or (compose_app_export_jobs | selectattr('engine', 'eq', 'tree') | selectattr('stop_service', 'defined') | list | length > 0) }}

    - name: Write the manifest
      ansible.builtin.copy:
        content: "{{ {'app': compose_app_name, 'export_dir': compose_app_export_dir ~ '/db', 'jobs': compose_app_export_jobs, 'images': compose_app_export_images} | combine({'compose_file': compose_app_dir ~ '/docker-compose.yml'} if compose_app_export_needs_compose else {}) | to_nice_json }}\n"
        dest: "{{ compose_app_export_manifest }}"
        owner: "{{ compose_app_owner }}"
        group: "{{ compose_app_group }}"
        mode: "0600"

    - name: Install the shared last-run writer and the record directory (role last_run)
      ansible.builtin.include_role:
        name: last_run
      vars:
        last_run_dir: "{{ compose_app_export_last_run_dir }}"
        last_run_group: "{{ compose_app_export_last_run_group }}"
        last_run_writer: "{{ compose_app_export_last_run_writer }}"

    - name: Write the service unit
      ansible.builtin.template:
        src: export.service.j2
        dest: "{{ compose_app_unit_dir }}/hnx-export-{{ compose_app_name }}.service"
        owner: "{{ compose_app_owner }}"
        group: "{{ compose_app_group }}"
        mode: "0644"
      register: compose_app_export_service_unit

    - name: Write the timer unit
      ansible.builtin.template:
        src: export.timer.j2
        dest: "{{ compose_app_unit_dir }}/hnx-export-{{ compose_app_name }}.timer"
        owner: "{{ compose_app_owner }}"
        group: "{{ compose_app_group }}"
        mode: "0644"
      register: compose_app_export_timer_unit

    - name: Ask whether the timer is enabled
      ansible.builtin.command:
        argv: ["{{ compose_app_systemctl_cli }}", is-enabled, "hnx-export-{{ compose_app_name }}.timer"]
      register: compose_app_export_enabled
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Reload systemd (units changed)
      ansible.builtin.command:
        argv: ["{{ compose_app_systemctl_cli }}", daemon-reload]
      when: (compose_app_export_service_unit is changed or compose_app_export_timer_unit is changed)
      changed_when: true

    - name: Enable and start the timer
      ansible.builtin.command:
        argv: ["{{ compose_app_systemctl_cli }}", enable, --now, "hnx-export-{{ compose_app_name }}.timer"]
      when: (compose_app_export_service_unit is changed or compose_app_export_timer_unit is changed) or compose_app_export_enabled.stdout | default('') | trim != 'enabled'
      changed_when: true
