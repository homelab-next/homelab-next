# SPDX-License-Identifier: Apache-2.0
# Spec rules (see docs/role-interface.md section 6). Everything a service may carry is checked
# here before anything is rendered; the template only ever emits keys from this allowlist, and
# every scalar it emits is JSON-quoted, so a value cannot add a key of its own.
- name: Validate project name and role-level settings
  ansible.builtin.assert:
    that:
      - compose_app_name is string and compose_app_name is match('^[a-z0-9][a-z0-9-]*\Z')
      - compose_app_restart_policy in compose_app_restart_policies
      - compose_app_security_opt is sequence and compose_app_security_opt is not string
      - "'no-new-privileges:true' in compose_app_security_opt or compose_app_allow_privileged | bool"
      - compose_app_cap_drop is sequence and compose_app_cap_drop is not string
    fail_msg: >-
      compose_app_name must match ^[a-z0-9][a-z0-9-]*$, the restart policy must be one of
      {{ compose_app_restart_policies }}, and no-new-privileges may only be dropped together
      with compose_app_allow_privileged

- name: Validate the cgroup parent (a module role slice, or none)
  ansible.builtin.assert:
    that:
      - compose_app_cgroup_parent is string
      - compose_app_cgroup_parent == '' or compose_app_cgroup_parent is match(compose_app_cgroup_parent_pattern)
      - hnx_module_slice is not defined or compose_app_cgroup_parent in ['', hnx_module_slice]
    fail_msg: >-
      compose_app_cgroup_parent must be empty or a module role slice (hnx-<module>-<host role>.slice,
      the name homelabnext.modules.limits gives it), and in a module play its own role's slice
      (hnx_module_slice), never another module's; not {{ compose_app_cgroup_parent | string | truncate(80) | to_json }}

- name: Validate the pinned network subnet (one shared judgement, network_subnet.yml)
  ansible.builtin.include_tasks: network_subnet.yml

- name: Validate services exist
  ansible.builtin.assert:
    that:
      - compose_app_spec.services is mapping
      - compose_app_spec.services | length > 0
    fail_msg: "compose_app_spec.services must be a non-empty mapping"

- name: Validate each service (pinning, healthcheck, allowed keys)
  ansible.builtin.assert:
    that:
      - item.key is match('^[a-z0-9][a-z0-9_.-]*\Z')
      - item.value is mapping
      - item.value.keys() | difference(compose_app_service_keys) | length == 0
      - item.value.image is defined and item.value.image is string
      - item.value.image is match(compose_app_repository_pattern)
      - item.value.tag is defined and item.value.tag is string and item.value.tag != 'latest'
      - item.value.tag is match('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}\Z')
      - item.value.digest is defined and item.value.digest is string
      - item.value.digest is match('^sha256:[0-9a-f]{64}\Z')
      - item.value.digest != 'sha256:' ~ ('0' * 64) or compose_app_allow_placeholder_digest | bool
      - item.value.healthcheck is defined and item.value.healthcheck is mapping
      - item.value.healthcheck.test is defined and item.value.healthcheck.test is sequence
      - item.value.healthcheck.test is not string and item.value.healthcheck.test | length > 0
      - item.value.healthcheck.test | reject('string') | list | length == 0
      - item.value.healthcheck.keys() | difference(['test', 'interval', 'timeout', 'retries', 'start_period']) | length == 0
      - item.value.healthcheck | dict2items | rejectattr('key', 'in', ['test', 'retries']) | map(attribute='value') | map('string') | reject('match', '^[0-9]+(ms|s|m|h)\Z') | list | length == 0
      - item.value.healthcheck.retries | default(3) is integer
      - item.value.restart | default(compose_app_restart_policy) in compose_app_restart_policies
      - item.value.depends_on | default([]) | difference(compose_app_spec.services.keys() | list) | length == 0
    fail_msg: >-
      service '{{ item.key }}' violates the compose_app spec: only the keys {{ compose_app_service_keys }};
      image is a repository without tag or digest; tag matches ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ and is
      not latest; digest is sha256:<64 hex>; healthcheck.test is a non-empty list of strings and its
      durations look like 30s; depends_on names services in the spec
  loop: "{{ compose_app_spec.services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate each service (exposure and privilege)
  ansible.builtin.assert:
    that:
      # environment: plain keys only, and no secret in clear (use compose_app_secret_env)
      - item.value.environment | default({}) is mapping
      - item.value.environment | default({}) | list | reject('match', '^[A-Za-z_][A-Za-z0-9_]*\Z') | list | length == 0
      - item.value.environment | default({}) | list | select('search', compose_app_sensitive_name_pattern) | reject('search', '_FILE\Z') | list | length == 0
      # ports: an explicit host address, always
      - item.value.ports | default([]) | reject('string') | list | length == 0
      - item.value.ports | default([]) | reject('match', compose_app_port_pattern) | list | length == 0
      # privilege
      - not (item.value.privileged | default(false) | bool) or compose_app_allow_privileged | bool
      - item.value.cap_add | default([]) | reject('string') | list | length == 0
      - item.value.cap_add | default([]) | reject('match', '^[A-Z][A-Z_]*\Z') | list | length == 0
      - item.value.cap_add | default([]) | map('regex_replace', '^CAP_', '') | intersect(compose_app_dangerous_caps | difference(['NET_ADMIN'] if compose_app_allow_net_admin | bool else [])) | length == 0 or compose_app_allow_privileged | bool
      - item.value.init is not defined or item.value.init is boolean
      - item.value.user is not defined or (item.value.user | string) is match('^[A-Za-z0-9_][A-Za-z0-9_.-]*(:[A-Za-z0-9_][A-Za-z0-9_.-]*)?\Z')
      # root in any spelling: the runtime reads a numeric user or group as a number (00, 000:0),
      # so a zero or the name root is refused as the user (compose_app_allow_root) and as the group
      # (compose_app_allow_root_group, or compose_app_allow_root, which covers both)
      - item.value.user is not defined or compose_app_allow_root | bool or (item.value.user | string).split(':')[0] is not match('^(?:root|0+)\Z')
      - item.value.user is not defined or compose_app_allow_root | bool or compose_app_allow_root_group | bool or (item.value.user | string).split(':')[1:] | select('match', '^(?:root|0+)\Z') | list | length == 0
      - item.value.read_only | default(false) is boolean
      # a GPU: a render node or a CDI name from the fixed pattern, and groups by number, never root's
      - item.value.devices | default([]) is sequence and item.value.devices | default([]) is not string and item.value.devices | default([]) is not mapping
      - item.value.devices | default([]) | reject('string') | list | length == 0
      - item.value.devices | default([]) | reject('match', compose_app_device_pattern) | list | length == 0
      - item.value.devices | default([]) | unique | list | length == item.value.devices | default([]) | length
      # the tunnel node needs the same opt-in as the capability that uses it
      - "'/dev/net/tun' not in item.value.devices | default([]) or compose_app_allow_net_admin | bool"
      - item.value.group_add | default([]) is sequence and item.value.group_add | default([]) is not string and item.value.group_add | default([]) is not mapping
      - item.value.group_add | default([]) | map('string') | reject('match', compose_app_group_add_pattern) | list | length == 0
      - item.value.group_add | default([]) | map('string') | select('match', compose_app_group_add_pattern) | map('int') | select('gt', 4294967295) | list | length == 0
      # ulimits: only memlock, -1 or a non-negative integer (never a string or a boolean)
      - item.value.ulimits is not defined or item.value.ulimits is mapping
      - item.value.ulimits | default({}) | list | difference(compose_app_ulimit_names) | length == 0
      - item.value.ulimits | default({}) | dict2items | map(attribute='value') | reject('integer') | list | length == 0
      - item.value.ulimits | default({}) | dict2items | map(attribute='value') | select('boolean') | list | length == 0
      - item.value.ulimits | default({}) | dict2items | map(attribute='value') | select('lt', -1) | list | length == 0
      - item.value.mem_limit is not defined or (item.value.mem_limit | string) is match('^[0-9]+[bkmgBKMG]?\Z')
      - item.value.env_file | default([]) | reject('string') | list | length == 0
      - item.value.env_file | default([]) | select('search', compose_app_interpolated_volume_pattern) | list | length == 0
      - item.value.env_file | default([]) | select('search', compose_app_noncanonical_source_pattern) | list | length == 0
    fail_msg: >-
      service '{{ item.key }}' is refused: environment keys must be plain names and secret-looking ones
      belong in compose_app_secret_env (a *_FILE pointer is fine); ports must be host_ip:host_port:container_port;
      privileged, or cap_add of
      {{ compose_app_dangerous_caps }}, needs compose_app_allow_privileged; running as root (user root or 0, written
      any way) needs compose_app_allow_root, and the root group compose_app_allow_root_group; mem_limit looks like 256m;
      env_file is a list of canonical paths without `$` or a leading `~`; devices is a list of DRM render
      nodes (/dev/dri/renderDNNN) or CDI GPU names (nvidia.com/gpu=N or =all) and group_add a list of
      group numbers other than 0; ulimits only memlock, -1 or a number
  loop: "{{ compose_app_spec.services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Volumes are judged as docker compose and the kernel will read them: a source spelled with
# compose interpolation ($VAR, ${VAR:-/}) or a leading ~ is whatever the deploy host's environment
# says, and /., // or a trailing / is a different path from its text, so both are refused before
# the source is matched against the rules.
# network_mode joins another service's network namespace (a sidecar with no network of its own):
# only service:<name> of this spec, never itself, never a service that publishes nothing is
# needed, and the sharing service publishes no port (compose refuses it; the publisher is the
# service whose namespace it is) and waits for that service to be healthy
- name: Validate each service (a shared network namespace)
  ansible.builtin.assert:
    that:
      - item.value.network_mode is string
      - item.value.network_mode is match(compose_app_network_mode_pattern)
      - item.value.network_mode.split(':')[1] in compose_app_spec.services
      - item.value.network_mode.split(':')[1] != item.key
      - item.value.ports | default([]) | length == 0
      - item.value.network_mode.split(':')[1] in item.value.depends_on | default([])
      - compose_app_spec.services[item.value.network_mode.split(':')[1]].network_mode is not defined
      # a sharer cannot change the owner's firewall or routes: no NET_ADMIN, no device of its own
      - item.value.cap_add | default([]) | map('regex_replace', '^CAP_', '') | select('eq', 'NET_ADMIN') | list | length == 0
      - item.value.devices | default([]) | length == 0
    fail_msg: >-
      service '{{ item.key }}' network_mode must be service:<another service of the spec> that has
      no network_mode of its own, the service must also be in its depends_on, and it publishes no
      port of its own (publish on the service whose namespace it shares), and it has neither NET_ADMIN
      nor a device (it could rewrite the owner's firewall)
  loop: "{{ compose_app_spec.services | dict2items | selectattr('value.network_mode', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate each service (volumes)
  ansible.builtin.assert:
    that:
      - item.value.volumes | default([]) | reject('string') | list | length == 0
      - item.value.volumes | default([]) | select('search', compose_app_interpolated_volume_pattern) | list | length == 0
      - item.value.volumes | default([]) | select('search', ':') | map('regex_replace', '(?s):.*', '') | select('search', compose_app_noncanonical_source_pattern) | list | length == 0
      - item.value.volumes | default([]) | select('search', compose_app_docker_socket_pattern) | list | length == 0 or compose_app_allow_docker_socket | bool
    fail_msg: >-
      service '{{ item.key }}' has a refused bind source: volumes are short-syntax strings; no `$` and
      no leading `~` (docker compose would interpolate them from the deploy host's environment); the
      source canonical (no //, no . or .. component other than a leading ./, no trailing /); a
      container-runtime socket or state directory (docker, containerd, podman, CRI-O) or host root
      needs compose_app_allow_docker_socket, which by itself unlocks only /var/run/docker.sock and
      /run/docker.sock (any other runtime path must also be listed in compose_app_bind_extra)
  loop: "{{ compose_app_spec.services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# A tmpfs mount is RAM that counts against the container's memory limit: the target is a canonical
# container path that does not overlap any other mount of the service (a volume's container path,
# an anonymous volume, another tmpfs), the size a bounded integer of bytes, the mode octal digits
# in a string (a bare number would be read as decimal by YAML before this sees it).
- name: Validate each service (tmpfs mounts)
  vars:
    _compose_app_tmpfs: "{{ item.value.tmpfs | default([]) }}"
    _compose_app_volume_targets: >-
      {{ item.value.volumes | default([]) | map('string') | map('regex_replace', '^[^:]*:([^:]*).*$', '\1') | list }}
    _compose_app_tmpfs_overlap: >-
      {%- set ts = (_compose_app_tmpfs | selectattr('target', 'defined') | map(attribute='target') | map('string') | list)
            if _compose_app_tmpfs is sequence and _compose_app_tmpfs is not string and _compose_app_tmpfs is not mapping else [] -%}
      {%- set out = [] -%}
      {%- for t in ts -%}
      {%-   set i = loop.index0 -%}
      {%-   for o in _compose_app_volume_targets + ts -%}
      {%-     if not (loop.index0 == i + _compose_app_volume_targets | length) and (t == o or t.startswith(o ~ '/') or o.startswith(t ~ '/')) -%}
      {%-       set _ = out.append(t ~ ' vs ' ~ o) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out | join(', ') }}
    _compose_app_tmpfs_own_uid: "{{ (item.value.user | default('') | string).split(':')[0] | int(-1) }}"
    _compose_app_tmpfs_own_gid: "{{ ((item.value.user | default('') | string).split(':')[1:] + ['-1'])[0] | int(-1) }}"
    _compose_app_tmpfs_denied: >-
      {%- set out = [] -%}
      {%- set ids = (item.value.user | default('') | string).split(':') -%}
      {%- set own_uid = ids[0] | int(-1) if ids[0] is match('^[1-9][0-9]*\Z') else -1 -%}
      {%- set own_gid = ids[1] | int(-1) if ids | length > 1 and ids[1] is match('^[1-9][0-9]*\Z') else -1 -%}
      {%- for e in _compose_app_tmpfs if e is mapping and e.target is defined -%}
      {%-   set t = e.target | string -%}
      {%-   set owned = e.uid is defined and e.gid is defined and own_uid > 0 and own_gid > 0
                        and (e.uid | string) is match('^[0-9]{1,10}\Z') and (e.gid | string) is match('^[0-9]{1,10}\Z')
                        and (e.uid | string | int) == own_uid and (e.gid | string | int) == own_gid -%}
      {%-   if t not in compose_app_tmpfs_allowed_exact and not (t in compose_app_tmpfs_owned_exact and owned) -%}
      {%-     for r in compose_app_tmpfs_denied_roots -%}
      {%-       if t == r or t.startswith(r ~ '/') -%}{%- set _ = out.append(t) -%}{%- endif -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out | join(', ') }}
  ansible.builtin.assert:
    that:
      - _compose_app_tmpfs is sequence and _compose_app_tmpfs is not string and _compose_app_tmpfs is not mapping
      - _compose_app_tmpfs | reject('mapping') | list | length == 0
      - _compose_app_tmpfs | map('list') | flatten | difference(compose_app_tmpfs_keys) | length == 0
      - _compose_app_tmpfs | rejectattr('target', 'defined') | list | length == 0
      - _compose_app_tmpfs | rejectattr('size_bytes', 'defined') | list | length == 0
      - _compose_app_tmpfs | map(attribute='target') | reject('string') | list | length == 0
      - _compose_app_tmpfs | map(attribute='target') | reject('match', compose_app_tmpfs_target_pattern) | list | length == 0
      # a bool or a float is not a count of bytes; a digit string is accepted (a templated value)
      - _compose_app_tmpfs | map(attribute='size_bytes') | map('string') | reject('match', '^[1-9][0-9]{0,15}\Z') | list | length == 0
      - _compose_app_tmpfs | map(attribute='size_bytes') | map('string') | map('int') | select('lt', compose_app_tmpfs_size_min) | list | length == 0
      - _compose_app_tmpfs | map(attribute='size_bytes') | map('string') | map('int') | select('gt', compose_app_tmpfs_size_max) | list | length == 0
      - _compose_app_tmpfs | selectattr('mode', 'defined') | map(attribute='mode') | reject('string') | list | length == 0
      - _compose_app_tmpfs | selectattr('mode', 'defined') | map(attribute='mode') | reject('match', compose_app_tmpfs_mode_pattern) | list | length == 0
      - _compose_app_tmpfs_overlap | length == 0
      - _compose_app_tmpfs_denied | length == 0
      # an owner is a number, and only the service's own: `user: uid:gid` is the one identity it may
      # chown a mount to; `exec` is a real bool (a quoted "false" would be truthy)
      - _compose_app_tmpfs | selectattr('uid', 'defined') | map(attribute='uid') | map('string') | reject('match', '^[0-9]{1,10}\Z') | list | length == 0
      - _compose_app_tmpfs | selectattr('gid', 'defined') | map(attribute='gid') | map('string') | reject('match', '^[0-9]{1,10}\Z') | list | length == 0
      - _compose_app_tmpfs | selectattr('uid', 'defined') | map(attribute='uid') | map('string') | map('int') | reject('equalto', _compose_app_tmpfs_own_uid | int) | list | length == 0
      - _compose_app_tmpfs | selectattr('gid', 'defined') | map(attribute='gid') | map('string') | map('int') | reject('equalto', _compose_app_tmpfs_own_gid | int) | list | length == 0
      - _compose_app_tmpfs | selectattr('exec', 'defined') | map(attribute='exec') | reject('boolean') | list | length == 0
      # the permission digits (the last three) may not all be 0: nobody could use the mount
      - _compose_app_tmpfs | selectattr('mode', 'defined') | map(attribute='mode') | map('string') | select('match', '^[01]?000\Z') | list | length == 0
    fail_msg: >-
      service '{{ item.key }}' has a refused tmpfs mount ({{ _compose_app_tmpfs_overlap | default('') }}{{ _compose_app_tmpfs_denied | default('') }}): tmpfs is a list of
      {target, size_bytes, mode, uid, gid, exec}; target an absolute canonical container path (not /), size_bytes an
      integer from {{ compose_app_tmpfs_size_min }} to {{ compose_app_tmpfs_size_max }} bytes, mode (optional) a quoted
      string of three octal digits with an optional leading 0 or 1 (sticky) such as "1777" or "0700", never
      setuid or setgid and never 000, a target never one of {{ compose_app_tmpfs_denied_roots }} or under them (/dev/shm
      itself is allowed; /run only with uid and gid both set to the service's own non-root user:group), uid and gid
      (optional) digits equal to the service's own user, exec (optional) a bool, and no target may equal or lie inside or
      above another mount of the service (a volume's container path or another tmpfs)
  loop: "{{ compose_app_spec.services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Bind sources are an allow-list: a host path is mounted only when it lies under one of
# compose_app_bind_roots (the application's own directories by default) or is listed on its own,
# with a reason, in compose_app_bind_extra. A relative source (./x) stays in the project directory,
# and a named volume and an anonymous one (a container path alone, /var/lib/app) are docker's; anything else on the host (/etc, /proc, /dev, /root, the
# systemd and D-Bus sockets, another runtime's state) is refused, and the runtime sockets still
# need compose_app_allow_docker_socket on top. That flag lets through only the docker socket
# itself (/var/run/docker.sock, /run/docker.sock), never host root, /var, /run or a path that
# merely contains docker.sock; another runtime path needs the flag and its own listing (host root,
# /run, /var and /var/lib cannot be listed).
- name: Validate the bind roots and listed bind sources
  ansible.builtin.assert:
    that:
      - compose_app_bind_roots is sequence and compose_app_bind_roots is not string
      - compose_app_bind_roots | reject('string') | list | length == 0
      - compose_app_bind_roots | reject('match', '^/') | list | length == 0
      - compose_app_bind_roots | select('search', compose_app_interpolated_volume_pattern) | list | length == 0
      - compose_app_bind_roots | select('search', compose_app_noncanonical_source_pattern) | list | length == 0
      - compose_app_bind_roots | select('match', compose_app_host_wide_pattern) | list | length == 0
      - compose_app_bind_roots | select('search', compose_app_docker_socket_pattern) | list | length == 0
      - compose_app_bind_extra is sequence and compose_app_bind_extra is not string
      - compose_app_bind_extra | reject('mapping') | list | length == 0
      - compose_app_bind_extra | rejectattr('path', 'defined') | list | length == 0
      - compose_app_bind_extra | rejectattr('reason', 'defined') | list | length == 0
      - compose_app_bind_extra | map(attribute='path') | reject('string') | list | length == 0
      - compose_app_bind_extra | map(attribute='path') | reject('match', '^/') | list | length == 0
      - compose_app_bind_extra | map(attribute='path') | select('search', compose_app_interpolated_volume_pattern) | list | length == 0
      - compose_app_bind_extra | map(attribute='path') | select('search', compose_app_noncanonical_source_pattern) | list | length == 0
      - compose_app_bind_extra | map(attribute='path') | select('match', compose_app_host_wide_pattern) | list | length == 0
      - compose_app_bind_extra | map(attribute='reason') | map('string') | map('trim') | select('match', '^.{10,}') | list | length == compose_app_bind_extra | length
    fail_msg: >-
      compose_app_bind_roots must be a list of absolute, canonical directories, none of them a
      host-wide directory (/, /etc, /proc, /sys, /dev, /boot, /root, /run, /var, /var/lib, /usr,
      /home, /opt, /srv, /tmp ...) or a container-runtime path; compose_app_bind_extra must be a list
      of {path, reason} with an absolute, canonical path and a reason of at least 10 characters

# An env_file is a host path too: docker compose reads it on the deploy host, as the user running
# compose (root, usually), and hands its contents to the container, so /etc/shadow or another
# application's secrets/<service>.env would reach this one. Its path follows the bind-source rule
# (relative to the project directory, under compose_app_bind_roots or listed), the runtime flag
# aside: a socket is never an env_file.
- name: Validate each service (bind and env_file sources inside the allowed roots)
  vars:
    _compose_app_outside: >-
      {%- set roots = compose_app_bind_roots | list -%}
      {%- set listed = compose_app_bind_extra | map(attribute='path') | list -%}
      {%- set out = [] -%}
      {%- set sources = [] -%}
      {%- for v in item.value.volumes | default([]) -%}
      {%-   if v is search(':') or v is not match('^/') -%}
      {%-     set _ = sources.append({'kind': 'volume', 'src': v | regex_replace('(?s):.*', ''), 'shown': v | regex_replace('(?s):.*', '')}) -%}
      {%-   endif -%}
      {#- a container path alone is an anonymous volume: no host source -#}
      {%- endfor -%}
      {%- for f in item.value.env_file | default([]) -%}
      {%-   set _ = sources.append({'kind': 'env_file', 'src': f, 'shown': 'env_file=' ~ f}) -%}
      {%- endfor -%}
      {%- for s in sources -%}
      {%-   set src = s.src -%}
      {%-   set ns = namespace(ok=false) -%}
      {%-   if s.kind == 'volume' and src is match('^[A-Za-z0-9][A-Za-z0-9_.-]*\Z') -%}
      {#-     a named volume is docker's -#}
      {%-     set ns.ok = true -%}
      {%-   elif src is not match('^/') -%}
      {#-     ./relative (an env_file may also be a bare relative path): the project directory -#}
      {%-     if s.kind == 'env_file' or src is match('^\./|^\.\Z') -%}{%- set ns.ok = true -%}{%- endif -%}
      {%-   else -%}
      {%-     if src in listed -%}{%- set ns.ok = true -%}{%- endif -%}
      {%-     for r in roots -%}
      {%-       if src == r or src.startswith(r ~ '/') -%}{%- set ns.ok = true -%}{%- endif -%}
      {%-     endfor -%}
      {%-     if s.kind == 'volume' and compose_app_allow_docker_socket | bool and src in ['/var/run/docker.sock', '/run/docker.sock'] -%}
      {%-       set ns.ok = true -%}
      {%-     endif -%}
      {%-   endif -%}
      {#-   the project directory itself and its secrets/ hold every service's 0600 env file and
              the rendered compose file: never mounted or read wholesale unless listed -#}
      {%-   if not (s.kind == 'volume' and src is match('^[A-Za-z0-9][A-Za-z0-9_.-]*\Z')) -%}
      {%-     if src == '.' -%}{%- set path = compose_app_dir -%}
      {%-     elif src is match('^\./') -%}{%- set path = compose_app_dir ~ src[1:] -%}
      {%-     elif src is not match('^/') -%}{%- set path = compose_app_dir ~ '/' ~ src -%}
      {%-     else -%}{%- set path = src -%}{%- endif -%}
      {%-     if path not in listed and (path == compose_app_dir or path == compose_app_dir ~ '/secrets' or path.startswith(compose_app_dir ~ '/secrets/')) -%}
      {%-       set ns.ok = false -%}
      {%-     endif -%}
      {%-   endif -%}
      {%-   if not ns.ok -%}{%- set _ = out.append(s.shown) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | join(' ') }}
  ansible.builtin.assert:
    that:
      - _compose_app_outside | length == 0
    fail_msg: >-
      service '{{ item.key }}' mounts or reads a host path outside the allowed roots ({{ _compose_app_outside }}):
      a bind source or env_file must be ./relative, a named volume (bind sources), under
      compose_app_bind_roots ({{ compose_app_bind_roots | join(', ') }}) or listed with a reason
      in compose_app_bind_extra; the application directory itself ({{ compose_app_dir }}, `.`) and
      its secrets/ directory need their own entry there
  loop: "{{ compose_app_spec.services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# The values are never echoed: no_log hides the item, the label and the failure message alike.
- name: Validate secret environment files
  ansible.builtin.assert:
    that:
      - item.key in compose_app_spec.services
      - item.value is mapping
      - item.value | list | reject('match', '^[A-Za-z_][A-Za-z0-9_]*\Z') | list | length == 0
      - item.value.values() | reject('string') | list | length == 0
      - item.value.values() | select('search', "['\r\n\x00]") | list | length == 0
      - item.value | list | intersect(compose_app_spec.services[item.key].environment | default({}) | list) | length == 0
    fail_msg: >-
      compose_app_secret_env: keys must name services in the spec, variable names must be plain, values
      must be strings without a single quote or a line break, and a variable may not also be in environment
  loop: "{{ compose_app_secret_env | dict2items }}"
  no_log: true
