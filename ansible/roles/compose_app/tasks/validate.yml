# SPDX-License-Identifier: Apache-2.0
# Spec rules (see docs/role-interface.md section 6). Everything a service may carry is checked
# here before anything is rendered; the template only ever emits keys from this allowlist, and
# every scalar it emits is JSON-quoted, so a value cannot add a key of its own.
- name: Validate project name and role-level settings
  ansible.builtin.assert:
    that:
      - compose_app_name is string and compose_app_name is match('^[a-z0-9][a-z0-9-]*\Z')
      - compose_app_restart_policy in compose_app_restart_policies
      - compose_app_security_opt is sequence and compose_app_security_opt is not string
      - "'no-new-privileges:true' in compose_app_security_opt or compose_app_allow_privileged | bool"
      - compose_app_cap_drop is sequence and compose_app_cap_drop is not string
    fail_msg: >-
      compose_app_name must match ^[a-z0-9][a-z0-9-]*$, the restart policy must be one of
      {{ compose_app_restart_policies }}, and no-new-privileges may only be dropped together
      with compose_app_allow_privileged

- name: Validate services exist
  ansible.builtin.assert:
    that:
      - compose_app_spec.services is mapping
      - compose_app_spec.services | length > 0
    fail_msg: "compose_app_spec.services must be a non-empty mapping"

- name: Validate each service (pinning, healthcheck, allowed keys)
  ansible.builtin.assert:
    that:
      - item.key is match('^[a-z0-9][a-z0-9_.-]*\Z')
      - item.value is mapping
      - item.value.keys() | difference(compose_app_service_keys) | length == 0
      - item.value.image is defined and item.value.image is string
      - item.value.image is match(compose_app_repository_pattern)
      - item.value.tag is defined and item.value.tag is string and item.value.tag != 'latest'
      - item.value.tag is match('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}\Z')
      - item.value.digest is defined and item.value.digest is string
      - item.value.digest is match('^sha256:[0-9a-f]{64}\Z')
      - item.value.digest != 'sha256:' ~ ('0' * 64) or compose_app_allow_placeholder_digest | bool
      - item.value.healthcheck is defined and item.value.healthcheck is mapping
      - item.value.healthcheck.test is defined and item.value.healthcheck.test is sequence
      - item.value.healthcheck.test is not string and item.value.healthcheck.test | length > 0
      - item.value.healthcheck.test | reject('string') | list | length == 0
      - item.value.healthcheck.keys() | difference(['test', 'interval', 'timeout', 'retries', 'start_period']) | length == 0
      - item.value.healthcheck | dict2items | rejectattr('key', 'in', ['test', 'retries']) | map(attribute='value') | map('string') | reject('match', '^[0-9]+(ms|s|m|h)\Z') | list | length == 0
      - item.value.healthcheck.retries | default(3) is integer
      - item.value.restart | default(compose_app_restart_policy) in compose_app_restart_policies
      - item.value.depends_on | default([]) | difference(compose_app_spec.services.keys() | list) | length == 0
    fail_msg: >-
      service '{{ item.key }}' violates the compose_app spec: only the keys {{ compose_app_service_keys }};
      image is a repository without tag or digest; tag matches ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ and is
      not latest; digest is sha256:<64 hex>; healthcheck.test is a non-empty list of strings and its
      durations look like 30s; depends_on names services in the spec
  loop: "{{ compose_app_spec.services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate each service (exposure and privilege)
  ansible.builtin.assert:
    that:
      # environment: plain keys only, and no secret in clear (use compose_app_secret_env)
      - item.value.environment | default({}) is mapping
      - item.value.environment | default({}) | list | reject('match', '^[A-Za-z_][A-Za-z0-9_]*\Z') | list | length == 0
      - item.value.environment | default({}) | list | select('search', compose_app_sensitive_name_pattern) | reject('search', '_FILE\Z') | list | length == 0
      # ports: an explicit host address, always
      - item.value.ports | default([]) | reject('string') | list | length == 0
      - item.value.ports | default([]) | reject('match', compose_app_port_pattern) | list | length == 0
      # privilege
      - not (item.value.privileged | default(false) | bool) or compose_app_allow_privileged | bool
      - item.value.cap_add | default([]) | reject('string') | list | length == 0
      - item.value.cap_add | default([]) | reject('match', '^[A-Z][A-Z_]*\Z') | list | length == 0
      - item.value.cap_add | default([]) | map('regex_replace', '^CAP_', '') | intersect(compose_app_dangerous_caps) | length == 0 or compose_app_allow_privileged | bool
      - item.value.user is not defined or (item.value.user | string) is match('^[A-Za-z0-9_][A-Za-z0-9_.-]*(:[A-Za-z0-9_][A-Za-z0-9_.-]*)?\Z')
      # root in any spelling: the runtime reads a numeric user or group as a number (00, 000:0),
      # so a zero, the name root, and root as the group are all refused
      - item.value.user is not defined or compose_app_allow_root | bool or (item.value.user | string).split(':') | select('match', '^(?:root|0+)\Z') | list | length == 0
      - item.value.read_only | default(false) is boolean
      - item.value.mem_limit is not defined or (item.value.mem_limit | string) is match('^[0-9]+[bkmgBKMG]?\Z')
      - item.value.env_file | default([]) | reject('string') | list | length == 0
    fail_msg: >-
      service '{{ item.key }}' is refused: environment keys must be plain names and secret-looking ones
      belong in compose_app_secret_env (a *_FILE pointer is fine); ports must be host_ip:host_port:container_port;
      privileged, or cap_add of
      {{ compose_app_dangerous_caps }}, needs compose_app_allow_privileged; running as root (user or group root or
      0, written any way) needs compose_app_allow_root; mem_limit looks like 256m
  loop: "{{ compose_app_spec.services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Volumes are judged as docker compose and the kernel will read them: a source spelled with
# compose interpolation ($VAR, ${VAR:-/}) or a leading ~ is whatever the deploy host's environment
# says, and /., // or a trailing / is a different path from its text, so both are refused before
# the source is matched against the rules.
- name: Validate each service (volumes)
  ansible.builtin.assert:
    that:
      - item.value.volumes | default([]) | reject('string') | list | length == 0
      - item.value.volumes | default([]) | select('search', compose_app_interpolated_volume_pattern) | list | length == 0
      - item.value.volumes | default([]) | map('regex_replace', '(?s):.*', '') | select('search', compose_app_noncanonical_source_pattern) | list | length == 0
      - item.value.volumes | default([]) | select('search', compose_app_docker_socket_pattern) | list | length == 0 or compose_app_allow_docker_socket | bool
    fail_msg: >-
      service '{{ item.key }}' has a refused bind source: volumes are short-syntax strings; no `$` and
      no leading `~` (docker compose would interpolate them from the deploy host's environment); the
      source canonical (no //, no . or .. component other than a leading ./, no trailing /); a
      container-runtime socket or state directory (docker, containerd, podman, CRI-O) or host root
      needs compose_app_allow_docker_socket
  loop: "{{ compose_app_spec.services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Bind sources are an allow-list: a host path is mounted only when it lies under one of
# compose_app_bind_roots (the application's own directories by default) or is listed on its own,
# with a reason, in compose_app_bind_extra. A relative source (./x) stays in the project directory
# and a named volume is docker's; anything else on the host (/etc, /proc, /dev, /root, the
# systemd and D-Bus sockets, another runtime's state) is refused, and the runtime sockets still
# need compose_app_allow_docker_socket on top.
- name: Validate the bind roots and listed bind sources
  ansible.builtin.assert:
    that:
      - compose_app_bind_roots is sequence and compose_app_bind_roots is not string
      - compose_app_bind_roots | reject('string') | list | length == 0
      - compose_app_bind_roots | reject('match', '^/') | list | length == 0
      - compose_app_bind_roots | select('search', compose_app_interpolated_volume_pattern) | list | length == 0
      - compose_app_bind_roots | select('search', compose_app_noncanonical_source_pattern) | list | length == 0
      - compose_app_bind_roots | select('match', compose_app_host_wide_pattern) | list | length == 0
      - compose_app_bind_roots | select('search', compose_app_docker_socket_pattern) | list | length == 0
      - compose_app_bind_extra is sequence and compose_app_bind_extra is not string
      - compose_app_bind_extra | reject('mapping') | list | length == 0
      - compose_app_bind_extra | rejectattr('path', 'defined') | list | length == 0
      - compose_app_bind_extra | rejectattr('reason', 'defined') | list | length == 0
      - compose_app_bind_extra | map(attribute='path') | reject('string') | list | length == 0
      - compose_app_bind_extra | map(attribute='path') | reject('match', '^/') | list | length == 0
      - compose_app_bind_extra | map(attribute='path') | select('search', compose_app_interpolated_volume_pattern) | list | length == 0
      - compose_app_bind_extra | map(attribute='path') | select('search', compose_app_noncanonical_source_pattern) | list | length == 0
      - compose_app_bind_extra | map(attribute='path') | select('match', compose_app_host_wide_pattern) | list | length == 0
      - compose_app_bind_extra | map(attribute='reason') | map('string') | map('trim') | select('match', '^.{10,}') | list | length == compose_app_bind_extra | length
    fail_msg: >-
      compose_app_bind_roots must be a list of absolute, canonical directories, none of them a
      host-wide directory (/, /etc, /proc, /sys, /dev, /boot, /root, /run, /var, /var/lib, /usr,
      /home, /opt, /srv, /tmp ...) or a container-runtime path; compose_app_bind_extra must be a list
      of {path, reason} with an absolute, canonical path and a reason of at least 10 characters

- name: Validate each service (bind sources inside the allowed roots)
  vars:
    _compose_app_outside: >-
      {%- set roots = compose_app_bind_roots | list -%}
      {%- set listed = compose_app_bind_extra | map(attribute='path') | list -%}
      {%- set out = [] -%}
      {%- for v in item.value.volumes | default([]) -%}
      {%-   set src = v | regex_replace('(?s):.*', '') -%}
      {%-   set ns = namespace(ok=false) -%}
      {%-   if src is match('^\./|^\.\Z') -%}
      {%-     set ns.ok = true -%}
      {%-   elif src is match('^[A-Za-z0-9][A-Za-z0-9_.-]*\Z') -%}
      {%-     set ns.ok = true -%}
      {%-   elif src is match('^/') -%}
      {%-     if src in listed -%}{%- set ns.ok = true -%}{%- endif -%}
      {%-     for r in roots -%}
      {%-       if src == r or src.startswith(r ~ '/') -%}{%- set ns.ok = true -%}{%- endif -%}
      {%-     endfor -%}
      {%-     if compose_app_allow_docker_socket | bool and src is search(compose_app_docker_socket_pattern) -%}
      {%-       set ns.ok = true -%}
      {%-     endif -%}
      {%-   endif -%}
      {%-   if not ns.ok -%}{%- set _ = out.append(src) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | join(' ') }}
  ansible.builtin.assert:
    that:
      - _compose_app_outside | length == 0
    fail_msg: >-
      service '{{ item.key }}' mounts a host path outside the allowed roots ({{ _compose_app_outside }}):
      a bind source must be ./relative, a named volume, under compose_app_bind_roots
      ({{ compose_app_bind_roots | join(', ') }}) or listed with a reason in compose_app_bind_extra
  loop: "{{ compose_app_spec.services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# The values are never echoed: no_log hides the item, the label and the failure message alike.
- name: Validate secret environment files
  ansible.builtin.assert:
    that:
      - item.key in compose_app_spec.services
      - item.value is mapping
      - item.value | list | reject('match', '^[A-Za-z_][A-Za-z0-9_]*\Z') | list | length == 0
      - item.value.values() | reject('string') | list | length == 0
      - item.value.values() | select('search', "['\r\n\x00]") | list | length == 0
      - item.value | list | intersect(compose_app_spec.services[item.key].environment | default({}) | list) | length == 0
    fail_msg: >-
      compose_app_secret_env: keys must name services in the spec, variable names must be plain, values
      must be strings without a single quote or a line break, and a variable may not also be in environment
  loop: "{{ compose_app_secret_env | dict2items }}"
  no_log: true
