# Fixed spec rules, not settings: role vars outrank inventory, so a deployment cannot loosen them.
compose_app_service_keys:
  [image, tag, digest, healthcheck, command, user, env_file, environment, ports, volumes,
   depends_on, restart, cap_add, read_only, mem_limit, privileged]
compose_app_restart_policies: ["no", always, on-failure, unless-stopped]
# docker (and its distribution) image grammar, repository part only: optional registry[:port]/
compose_app_repository_pattern: '^(?:[A-Za-z0-9.-]+(?::[0-9]+)?/)?[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*(?:/[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*)*\Z'
# host_ip:host_port:container_port[/proto]; the host address is never implied
compose_app_port_pattern: '^(?:[0-9]{1,3}(?:\.[0-9]{1,3}){3}|\[[0-9A-Fa-f:.]+\]):[0-9]{1,5}:[0-9]{1,5}(?:/(?:tcp|udp))?\Z'
# a bind source that hands the container the docker daemon (or the host root / runtime dir)
compose_app_docker_socket_pattern: 'docker\.sock|^/(?:var/)?run(?:/docker)?/?(?::|\Z)|^/(?::|\Z)|^/var/lib/docker(?:/|:|\Z)'
compose_app_sensitive_name_pattern: '(?i)(password|passwd|secret|token|api_?key|private_?key|credential)'
# capabilities that amount to privileged: refused in cap_add unless compose_app_allow_privileged
compose_app_dangerous_caps:
  [ALL, SYS_ADMIN, SYS_MODULE, SYS_RAWIO, SYS_PTRACE, SYS_BOOT, DAC_READ_SEARCH, BPF, PERFMON,
   NET_ADMIN, MAC_ADMIN, MAC_OVERRIDE]
