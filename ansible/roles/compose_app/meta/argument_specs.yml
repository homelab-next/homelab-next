# SPDX-License-Identifier: Apache-2.0
argument_specs:
  main:
    short_description: Render and start a compose application from a typed spec.
    description:
    - 'Typed application spec. services: mapping of service name to {image (repository, no tag), tag (not
      ''latest''), digest (sha256:<64 hex>), healthcheck {test: list, interval, timeout, retries, start_period}
      (required), optional command, user, env_file, environment, ports (host_ip:host_port:container_port),
      volumes, depends_on, restart, cap_add, read_only, mem_limit, privileged, devices (DRM render nodes, CDI GPU names or /dev/net/tun), network_mode (service:<another service>), init,
      group_add (group numbers), tmpfs (list of {target, size_bytes, mode, uid, gid, exec}, RAM-backed mounts, uid and gid only the own user of the service, /run only with them)}. No other key is accepted.'
    - Every service gets security_opt no-new-privileges and cap_drop ALL. Secrets go in
      compose_app_secret_env, never in environment. Privileged containers, docker socket mounts and
      running as root are refused unless the matching compose_app_allow_* flag is set.
    options:
      compose_app_name: &id001
        type: str
        description: Compose project name (lowercase letters, digits, hyphen).
        required: true
      compose_app_spec: &id004
        type: dict
        description: Typed application spec.
        required: true
        options:
          services:
            type: dict
            description: Service definitions keyed by name.
            required: true
      compose_app_dir: &id002
        type: path
        description: Directory holding docker-compose.yml.
        default: /opt/compose/{{ compose_app_name }}
      compose_app_data_dir: &id005
        type: path
        description: Bind-mount data root, used by backup, restore and export.
        default: '{{ compose_app_dir }}/data'
      compose_app_export_dir: &id007
        type: path
        description: Open-format export target.
        default: /var/backups/compose/{{ compose_app_name }}/export
      compose_app_owner: &id008
        type: str
        description: Owner of the application directory and every file the role writes.
        default: root
      compose_app_group: &id009
        type: str
        description: Group of the application directory and every file the role writes.
        default: root
      compose_app_restart_policy:
        type: str
        description: Default restart policy.
        default: unless-stopped
      compose_app_secret_env:
        type: dict
        description: >-
          Service name to {VARIABLE: value}. Written to secrets/<service>.env with mode 0600 and
          passed as an env_file, never into docker-compose.yml. Values may not hold a single quote
          or a line break. Supply it from the secrets capability; it has no literal default.
        default: {}
        no_log: true
      compose_app_security_opt:
        type: list
        elements: str
        description: security_opt applied to every service; must keep no-new-privileges:true.
        default: ['no-new-privileges:true']
      compose_app_cap_drop:
        type: list
        elements: str
        description: cap_drop applied to every service.
        default: [ALL]
      compose_app_allow_privileged:
        type: bool
        description: Permit privileged, a dangerous cap_add, or dropping no-new-privileges.
        default: false
      compose_app_bind_roots:
        type: list
        elements: str
        description: >-
          Host directories a bind source may lie under (absolute, canonical, not a host-wide
          directory such as /etc, /var or /srv). Relative sources and named volumes need none.
        default: ['{{ compose_app_dir }}', '{{ compose_app_data_dir }}']
      compose_app_bind_extra:
        type: list
        elements: dict
        description: >-
          Further host paths a bind source may be, each {path, reason}: the exact path, absolute
          and canonical, and why the application needs it (at least 10 characters).
        default: []
      compose_app_allow_docker_socket:
        type: bool
        description: >-
          Permit the docker socket (/var/run/docker.sock or /run/docker.sock) as a bind source; any
          other container-runtime socket or state directory also needs its own
          compose_app_bind_extra entry, and host root, /run, /var and /var/lib stay refused.
        default: false
      compose_app_allow_root:
        type: bool
        description: Permit an explicit user (or group) of root or 0, in any spelling.
        default: false
      compose_app_allow_net_admin:
        type: bool
        description: Permit NET_ADMIN (only) in cap_add, for a VPN client that owns a network namespace others share.
        default: false
      compose_app_allow_root_group:
        type: bool
        description: >-
          Permit the root group alone (user 1000:0), for images built to run as an arbitrary uid
          in group 0; the user itself must still not be root.
        default: false
      compose_app_log_max_size:
        type: str
        description: json-file max-size.
        default: 10m
      compose_app_log_max_file:
        type: int
        description: json-file max-file.
        default: 3
      compose_app_dependencies: &id003
        type: list
        description: Logical ids of dependencies resolved via the registry.
        default: []
        elements: str
      compose_app_allow_placeholder_digest: &id006
        type: bool
        description: Permit the all-zero placeholder digest (development only).
        default: false
      compose_app_validate_with_docker:
        type: bool
        description: Run docker compose config on the rendered file.
        default: true
      compose_app_start:
        type: bool
        description: Run docker compose up -d after rendering.
        default: true
      compose_app_cgroup_parent:
        type: str
        description: >-
          The systemd slice every container runs in (compose cgroup_parent), a module role slice
          hnx-<module>-<host role>.slice or empty for docker's default. Defaults to
          hnx_module_slice, which the module apply path sets on each module play (in a module
          play only that slice is accepted). Starting needs docker's systemd cgroup driver and
          the slice's unit file; with compose_app_start false neither is checked.
        default: "{{ hnx_module_slice | default('') }}"
      compose_app_network_subnet:
        type: str
        description: >-
          Pin the project's default network to this IPv4 CIDR (prefix /16 to /29), so a host
          firewall rule keyed on a container's source address stays valid across recreates. Empty:
          docker picks one. Changing it recreates the network (and its containers).
        default: ""
      compose_app_boot_unit:
        type: bool
        description: >-
          Install and enable hnx-compose-<name>.service, a oneshot that runs docker compose up -d
          at boot, after docker, so a container that did not come back after a power cycle (seen
          Exited with unless-stopped, LL-571) is started and a failure to start it shows as a failed
          unit. Needs compose_app_start. Off by default: a removal must then remove the unit too
          (the unit does nothing once the compose file is gone, but a kept compose file comes back
          at the next boot).
        default: false
      compose_app_unit_dir:
        type: path
        description: Where the boot unit is written.
        default: /etc/systemd/system
      compose_app_systemctl_cli:
        type: str
        description: The systemctl command.
        default: systemctl
      compose_app_export_timer:
        type: bool
        description: >-
          Schedule the application-consistent database dump (tasks/export_timer.yml, ADR-0042
          decision 2): a timer runs hnx-export-run, which dumps every PostgreSQL, MariaDB or MySQL
          service of the spec from inside its container into <export dir>/db. Opt-in.
        default: false
      compose_app_export_engines:
        type: dict
        description: >-
          Overrides of the engine found from a service's image: {service: postgres, mysql or none}
          (none disables the dump of that service). Each key is a service of the spec.
        default: {}
      compose_app_export_files:
        type: list
        elements: dict
        description: >-
          Files the export timer copies and verifies besides the databases (tasks/export_timer.yml):
          {name, kind: sqlite, glob} copies every SQLite file the absolute glob matches through the
          online backup API and checks it; {name, kind: tree, path, exclude} writes a gzip tar of a
          directory. A glob that matches nothing is a failed run.
        default: []
      compose_app_export_calendar:
        type: str
        description: The timer's OnCalendar, in UTC, before the guest's image backup.
        default: "*-*-* 07:30:00 UTC"
      compose_app_export_script:
        type: path
        description: Where the dump script is installed.
        default: /usr/local/libexec/homelabnext/hnx-export-run
      compose_app_export_manifest:
        type: path
        description: Where the role writes the dump script's manifest (the jobs, the export directory).
        default: "{{ compose_app_dir }}/export-manifest.json"
      compose_app_export_last_run_dir:
        type: path
        description: The directory of the timer's last-run record (role last_run).
        default: /var/lib/homelabnext/last-run
      compose_app_export_last_run_group:
        type: str
        description: The group that may read the last-run record.
        default: root
      compose_app_export_last_run_writer:
        type: path
        description: Where the shared last-run writer is installed.
        default: /usr/local/libexec/homelabnext/hnx-last-run
  health:
    short_description: Assert every service of the spec has a container and every container is running and healthy.
    options:
      compose_app_name: *id001
      compose_app_dir: *id002
      compose_app_spec:
        type: dict
        description: The application spec; its services are the set that must be running.
        required: true
  readiness:
    short_description: Check every declared dependency is reachable.
    options:
      compose_app_name: *id001
      compose_app_dependencies: *id003
  backup:
    short_description: Write a backup manifest of bind mounts from the spec.
    options:
      compose_app_name: *id001
      compose_app_dir: *id002
      compose_app_owner: *id008
      compose_app_group: *id009
      compose_app_spec: *id004
      compose_app_data_dir: *id005
  restore:
    short_description: Restore the data directory from a backup source.
    options:
      compose_app_name: *id001
      compose_app_data_dir: *id005
      compose_app_restore_source:
        type: path
        description: Directory to restore from.
        required: true
  upgrade:
    short_description: Validate a tag+digest bump and record it as pending.
    options:
      compose_app_name: *id001
      compose_app_dir: *id002
      compose_app_owner: *id008
      compose_app_group: *id009
      compose_app_spec: *id004
      compose_app_allow_placeholder_digest: *id006
      compose_app_upgrade_service:
        type: str
        description: Service to bump.
        required: true
      compose_app_upgrade_tag:
        type: str
        description: New tag.
        required: true
      compose_app_upgrade_digest:
        type: str
        description: New digest (sha256:<64 hex>).
        required: true
  export:
    short_description: Write the open-format exit copy of the data directory.
    options:
      compose_app_name: *id001
      compose_app_data_dir: *id005
      compose_app_export_dir: *id007
