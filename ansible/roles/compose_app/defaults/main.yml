# SPDX-License-Identifier: Apache-2.0
# compose_app_name and compose_app_spec are required (no default).
compose_app_dir: "/opt/compose/{{ compose_app_name }}"
compose_app_data_dir: "{{ compose_app_dir }}/data"
compose_app_export_dir: "/var/backups/compose/{{ compose_app_name }}/export"
compose_app_owner: root
compose_app_group: root
compose_app_restart_policy: unless-stopped
compose_app_log_max_size: 10m
compose_app_log_max_file: 3
compose_app_dependencies: []
# Secrets: service name -> {VARIABLE: value}, written to secrets/<service>.env (0600) and passed
# as an env_file. Supply it from the secrets capability at run time; it has no literal default.
compose_app_secret_env: {}
# Applied to every service. Dropping no-new-privileges needs compose_app_allow_privileged.
compose_app_security_opt: ["no-new-privileges:true"]
compose_app_cap_drop: [ALL]
# Host directories a bind source may lie under (./relative sources and named volumes are always
# fine); any other host path needs an entry, with its reason, in compose_app_bind_extra:
# [{path: /srv/shared, reason: "the media library the app serves read-only"}].
compose_app_bind_roots: ["{{ compose_app_dir }}", "{{ compose_app_data_dir }}"]
compose_app_bind_extra: []
# Escape hatches, all off: each one lets a container reach the host.
compose_app_allow_privileged: false
compose_app_allow_docker_socket: false
compose_app_allow_root: false
# the root group alone (user 1000:0, for images built to run as an arbitrary uid in group 0)
compose_app_allow_root_group: false
# NET_ADMIN in cap_add (a VPN client that owns the network namespace others share), and nothing
# else the dangerous list refuses; privileged and the other capabilities stay behind
# compose_app_allow_privileged
compose_app_allow_net_admin: false
compose_app_allow_placeholder_digest: false
compose_app_validate_with_docker: true
# The systemd slice every container of the application runs in (compose cgroup_parent): the
# module apply path sets hnx_module_slice on each module play to the role's slice
# (hnx-<module>-<host role>.slice, installed by the play's limits play), so the slice's CPU and
# memory limits confine the containers. Empty: docker's default (system.slice). Only a module role
# slice is accepted (in a module play, its own), and before a start docker must use the systemd
# cgroup driver and the slice must have its unit file (with compose_app_start false neither is
# checked: nothing starts).
compose_app_cgroup_parent: "{{ hnx_module_slice | default('') }}"
compose_app_start: true
# Pin the project's default network to this IPv4 CIDR (empty: docker picks one from its pool). A
# service that must be admitted by a host firewall rule keyed on the container's source address
# (a container reaching the host's own address arrives on the host's INPUT chain with that source)
# needs an address that does not move between recreates. Changing it recreates the network.
compose_app_network_subnet: ""
# A oneshot unit that runs docker compose up -d at boot (after docker), so a container that did not
# come back after a power cycle is started and a failure shows as a failed unit (LL-571). Opt-in:
# the module's remove playbook must remove hnx-compose-<name>.service with the project.
compose_app_boot_unit: false
compose_app_unit_dir: /etc/systemd/system
compose_app_systemctl_cli: systemctl
# The scheduled, application-consistent database dump (tasks/export_timer.yml; ADR-0042 decision 2):
# a timer per application dumps each PostgreSQL / MariaDB / MySQL service of the spec from inside
# its container into compose_app_export_dir (read by the guest's image backup and the restore
# drill). Opt-in, so a lab turns it on for every host in one group variable. Engines are found by
# image name; compose_app_export_engines {service: postgres|mysql|none} overrides (none disables).
compose_app_export_timer: false
compose_app_export_engines: {}
# Files the same timer copies and verifies besides the databases: a list of {name, kind: sqlite, glob}
# (every SQLite file the absolute glob matches, copied through SQLite's online backup and integrity-checked)
# or {name, kind: tree, path, exclude: [patterns]} (a gzip tar of a directory). For a product whose state is
# SQLite or plain files. A name is also the directory it is written to, so it must not be a service name.
compose_app_export_files: []
# 07:30 UTC is 01:30 to 02:30 in the lab's zone, before the 04:30 (America/Chicago) image backup
compose_app_export_calendar: "*-*-* 07:30:00 UTC"
compose_app_export_script: /usr/local/libexec/homelabnext/hnx-export-run
compose_app_export_manifest: "{{ compose_app_dir }}/export-manifest.json"
compose_app_export_last_run_dir: /var/lib/homelabnext/last-run
compose_app_export_last_run_group: root
compose_app_export_last_run_writer: /usr/local/libexec/homelabnext/hnx-last-run
