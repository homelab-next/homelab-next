- name: Refuse a host that is not Debian-family (the role installs the distribution's package)
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: "rkhunter supports Debian-family guests only (got {{ ansible_facts['os_family'] }})"

- name: Install rkhunter
  ansible.builtin.apt:
    name: ['rkhunter']
    state: present

- name: Write the configuration, the scan script and its timer
  ansible.builtin.include_tasks: config.yml

- name: Record the current file properties once (rkhunter --propupd)
  ansible.builtin.command:
    argv: [rkhunter, --propupd, --nocolors]
    creates: /var/lib/rkhunter/db/rkhunter.dat
