- block:
    - name: Ensure the state directory exists
      ansible.builtin.file:
        path: "{{ node_exporter_state_dir }}"
        state: directory
        mode: "0750"
    - name: Write the backup manifest (nothing to keep; the arguments are rendered)
      ansible.builtin.copy:
        dest: "{{ node_exporter_state_dir }}/backup-manifest.json"
        content: "{{ {'service': 'node_exporter', 'paths': [], 'note': 'the exporter keeps no data; its arguments are rendered'} | to_nice_json }}\n"
        mode: "0640"
  tags: [backup]
