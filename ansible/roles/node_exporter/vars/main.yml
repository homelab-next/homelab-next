# Fixed, not settings: role vars outrank inventory, so a deployment cannot loosen them.
node_exporter_ipv4_pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}\Z'
# the metric families the alert rules and the health hook rely on
node_exporter_required_families:
  - node_filesystem_avail_bytes
  - node_filesystem_size_bytes
  - node_filesystem_readonly
  - node_memory_MemAvailable_bytes
  - node_memory_MemTotal_bytes
