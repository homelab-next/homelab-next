# SPDX-License-Identifier: Apache-2.0
# The census of what runs (docs/modules.md, "What the loader checks"): read-only on the hosts;
# module_census_dir, a fresh directory on the controller, is required and has no default.
module_census_systemctl_cli: systemctl
# where the notifier owners write the pairs they hold, <dir>/<owner>/pairs.json
# (homelabnext.notify.record.RECORD_DIR)
module_census_pairs_dir: /var/lib/homelabnext/notify-pairs
# On a host that runs the broker: its socket, under /run/, which the census asks as root for the
# agents it serves; the broker's manifest lists root in operators (manifest 1.8).  Empty: this
# host runs no broker, and the census does not ask.
module_census_broker_socket: ""
# The hnx command a broker host runs, an absolute path (a test points it at a stand-in).
module_census_hnx_cli: /opt/hnx/bin/hnx
# The MCP client configurations installed on this host, each {path, client}: what a client
# registers when it starts (docs/modules.md, "MCP servers, from the installed clients").  Trusted
# overlay input (it names files the census reads); each file must be named as its client's
# configuration, and only the server names it registers leave the host.  Empty: none, and the
# census does not look.
module_census_mcp_configs: []
# On a host that runs the lake catalog (the lake-catalog slot: an Iceberg REST catalog): its
# address, http(s)://<loopback IP>:<port> (the census lists it from its own host), the warehouse
# whose tables it lists, and the catalog's API root.  Empty: this host runs no catalog, and the
# census does not ask.
module_census_catalog_url: ""
module_census_catalog_warehouse: ""
module_census_catalog_api_root: /catalog
# The bearer token the catalog wants, a file on this host root's alone (mode 0600): read there as
# root and sent only to the loopback address above, never to the controller.  Empty: no token.
module_census_catalog_token_file: ""
