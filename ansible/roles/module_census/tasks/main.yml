# SPDX-License-Identifier: Apache-2.0
# Read-only on the hosts: two systemctl queries each (enabled unit files, active units), the
# sockets it listens on (the kernel's socket tables), the notify pairs records at one fixed
# directory (<dir>/<owner>/pairs.json, never a glob), read in one step by the role's
# notify_pairs_records module, and on a host that runs the broker
# (module_census_broker_socket set) one more, the broker's operator answer of the agents it serves
# (hnx broker agents, as root, which the broker's manifest must list in operators), and the MCP
# client configurations the host lists (module_census_mcp_configs, read in one step), and on a lake
# catalog host (module_census_catalog_url set) the tables its Iceberg REST catalog lists (hnx
# modules catalog-tables: GET only, to a loopback address, the token read on the host and never
# returned; as root when a token file is named).  The answers are written on the controller
# (delegate_to: localhost, never as root), where hnx modules gather parses them strictly; the
# binding of a unit to a module is its name, decided by the loader, never by anything written here.
- name: Validate the inputs
  ansible.builtin.assert:
    that:
      - module_census_dir is match('^/[A-Za-z0-9._/-]+\Z') and '..' not in module_census_dir
      - module_census_systemctl_cli is match('^[A-Za-z0-9._/-]+\Z')
      - module_census_hnx_cli is match('^/[A-Za-z0-9._/-]+\Z') and '..' not in module_census_hnx_cli
      - module_census_broker_socket == '' or (module_census_broker_socket is match('^/run/[A-Za-z0-9._/-]+\Z') and '..' not in module_census_broker_socket)
      - inventory_hostname is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\Z')
      - module_census_pairs_dir is match('^/[A-Za-z0-9._/-]+\Z') and '..' not in module_census_pairs_dir
      - module_census_mcp_configs is sequence and module_census_mcp_configs is not string
      - module_census_mcp_configs | reject('mapping') | list | length == 0
      - module_census_mcp_configs | rejectattr('path', 'defined') | list | length == 0
      - module_census_mcp_configs | rejectattr('client', 'defined') | list | length == 0
      - module_census_mcp_configs | map(attribute='path') | reject('string') | list | length == 0
      - module_census_mcp_configs | map(attribute='path') | reject('match', '^/[A-Za-z0-9._/-]+\Z') | list | length == 0
      - module_census_mcp_configs | map(attribute='path') | select('search', '\.\.') | list | length == 0
      - module_census_mcp_configs | map(attribute='client') | reject('in', module_census_mcp_clients) | list | length == 0
      - module_census_catalog_url == '' or module_census_catalog_url is match('^https?://(127\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|\[::1\]):[0-9]{1,5}\Z')
      - module_census_catalog_url == '' or module_census_catalog_warehouse is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\Z')
      - module_census_catalog_api_root is match('^/[A-Za-z0-9._/-]*\Z') and '..' not in module_census_catalog_api_root
      - module_census_catalog_token_file == '' or (module_census_catalog_token_file is match('^/[A-Za-z0-9._/-]+\Z') and '..' not in module_census_catalog_token_file)
    fail_msg: "module_census: the census directory is an absolute path of [A-Za-z0-9._/-], the systemctl command a plain path, the hnx command an absolute path, the broker socket empty or a path under /run/, the host name a plain name (it names the host's answer file), the notify pairs directory an absolute path of [A-Za-z0-9._/-], and each MCP client configuration {path, client} an absolute path of [A-Za-z0-9._/-] and one of {{ module_census_mcp_clients | join(', ') }}, the lake catalog empty or http(s)://<loopback IP>:<port> with a warehouse name, its API root a path of [A-Za-z0-9._/-] and its token file empty or an absolute path of [A-Za-z0-9._/-]"

- name: Look at the census directory on the controller
  ansible.builtin.stat:
    path: "{{ module_census_dir }}"
  register: module_census_dir_stat
  delegate_to: localhost  # workstation-ref: allow the census is the deploy run's own (the runner), never a runtime dependency
  become: false

- name: Fail unless the census directory is a directory
  ansible.builtin.assert:
    that:
      - module_census_dir_stat.stat.isdir | default(false)
      - not (module_census_dir_stat.stat.islnk | default(false))
    fail_msg: "module_census: {{ module_census_dir }} is not a directory on the controller"

- name: Write the play's hosts (every host it targets, an unreachable one included)
  ansible.builtin.copy:
    content: "{{ ansible_play_hosts_all | to_json }}\n"
    dest: "{{ module_census_dir }}/_hosts.json"
    mode: "0600"
  delegate_to: localhost  # workstation-ref: allow the census is the deploy run's own (the runner), never a runtime dependency
  become: false
  run_once: true

- name: List the enabled fleet units
  ansible.builtin.command:
    argv:
      - "{{ module_census_systemctl_cli }}"
      - list-unit-files
      - --no-legend
      - --plain
      - --no-pager
      - --type=service,timer
      - --state=enabled
      - hnx-*
  register: module_census_units
  changed_when: false
  # systemctl exits 1 when no unit file matches the pattern, and prints nothing then
  failed_when: >-
    module_census_units.rc not in [0, 1]
    or (module_census_units.rc == 1 and module_census_units.stdout | length > 0)

- name: List the active fleet units (one may run without being enabled)
  ansible.builtin.command:
    argv:
      - "{{ module_census_systemctl_cli }}"
      - list-units
      - --no-legend
      - --plain
      - --no-pager
      - --type=service,timer
      - --state=active
      - hnx-*
  register: module_census_active
  changed_when: false
  # list-units exits 0 with nothing printed when no unit matches; anything else is a failure
  failed_when: module_census_active.rc != 0

# One step (library/notify_pairs_records.py): nothing can be swapped between a check and a read.
- name: Read each notifier owner's pairs record, never through a link
  notify_pairs_records:
    dir: "{{ module_census_pairs_dir }}"
    owners: "{{ module_census_pair_owners }}"
    max_bytes: "{{ module_census_pairs_max_bytes }}"
  register: module_census_pairs

# One step (library/mcp_client_configs.py): each installed MCP client configuration is read and
# parsed on the host, and only the server names it registers come back, never its text (a
# configuration can hold secrets).  no_log keeps the task's arguments and result out of every log
# and callback; a refusal is reported by the next task from the registered message, which names
# a path and a reason only.
- name: Read the installed MCP client configurations, never through a link
  mcp_client_configs:
    files: "{{ module_census_mcp_configs }}"
    max_bytes: "{{ module_census_mcp_max_bytes }}"
  register: module_census_mcp
  no_log: true
  failed_when: false
  when: module_census_mcp_configs | length > 0

- name: Stop on an MCP client configuration the census refuses
  ansible.builtin.fail:
    msg: "{{ module_census_mcp.msg | default('module_census: the MCP client configurations were not read') }}"
  when: module_census_mcp_configs | length > 0 and (module_census_mcp.failed | default(false) or module_census_mcp.configs is not defined)

# The kernel's own socket tables (library/listening_sockets.py): the TCP ports this host listens
# on and the UDP ports it has bound, never a command's output; hnx modules check judges each
# selected module's service row by whether its placed host listens on its port.
- name: List the sockets this host listens on
  listening_sockets:
    tables: "{{ module_census_socket_tables }}"
  register: module_census_listening

# The broker answers a peer its manifest lists in operators (homelabnext.broker.server, manifest
# 1.8): the agent keys it serves, one per line, and nothing else.  This one task runs as root, the
# identity the census host's manifest lists; the others stay unprivileged.  A broker that does not
# answer, or does not count root an operator, fails the census.
- name: Ask the running broker which agents it serves
  ansible.builtin.command:
    argv:
      - "{{ module_census_hnx_cli }}"
      - broker
      - agents
      - --socket
      - "{{ module_census_broker_socket }}"
  register: module_census_agents
  changed_when: false
  become: true
  become_user: root
  when: module_census_broker_socket != ''

# The lake-catalog slot's contract is the Iceberg REST catalog (homelabnext.lake.rest_catalog):
# hnx modules catalog-tables lists its namespaces and tables with GET requests only, to the
# catalog's own loopback address, and prints names only, as JSON.  The token, when the catalog
# wants one, is read on this host from a file root's alone and sent to that address alone (no
# redirect, no proxy): it never reaches the controller.  The task becomes root only to read it.
# no_log keeps its arguments and result out of every log and callback; a refusal is reported by
# the next task from the command's own error line, which never carries the token.
- name: List the lake tables the catalog on this host holds
  ansible.builtin.command:
    argv: "{{ [module_census_hnx_cli, 'modules', 'catalog-tables', '--url', module_census_catalog_url, '--warehouse', module_census_catalog_warehouse, '--api-root', module_census_catalog_api_root] + (['--token-file', module_census_catalog_token_file] if module_census_catalog_token_file != '' else []) }}"
  register: module_census_tables
  changed_when: false
  failed_when: false
  no_log: true
  become: "{{ module_census_catalog_token_file != '' }}"
  become_user: root
  when: module_census_catalog_url != ''

- name: Stop on a lake catalog the census could not list
  ansible.builtin.fail:
    msg: "module_census: the lake catalog was not listed: {{ module_census_tables.stderr_lines | default([]) | last | default('no answer') }}"
  when: module_census_catalog_url != '' and (module_census_tables.rc | default(1)) != 0

- name: Write this host's answer on the controller
  ansible.builtin.copy:
    content: "{{ ({'host': inventory_hostname, 'enabled': module_census_units.stdout_lines, 'active': module_census_active.stdout_lines, 'pairs': module_census_pairs_found, 'listening': module_census_listening.sockets} | combine({'agents': module_census_agents.stdout_lines} if module_census_broker_socket != '' else {}) | combine({'mcp': module_census_mcp.configs} if module_census_mcp_configs | length > 0 else {}) | combine({'tables': module_census_tables.stdout | from_json} if module_census_catalog_url != '' else {})) | to_json }}\n"
    dest: "{{ module_census_dir }}/{{ inventory_hostname }}.json"
    mode: "0600"
  no_log: true  # the answer is names only, but never shown in a diff or a callback either
  vars:
    # the host's boot id and clock, and per owner the record's text and whether its process runs
    module_census_pairs_found: "{{ {'boot_id': module_census_pairs.boot_id, 'now': module_census_pairs.now, 'records': module_census_pairs.records} }}"
  delegate_to: localhost  # workstation-ref: allow the census is the deploy run's own (the runner), never a runtime dependency
  become: false
