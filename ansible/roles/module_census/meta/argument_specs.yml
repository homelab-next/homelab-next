argument_specs:
  main:
    short_description: List each host's enabled and active fleet units, the sockets it listens on and, on a lake catalog host, the tables its catalog holds (read-only) and write the answers on the controller.
    options:
      module_census_dir: &dir
        type: path
        description: "A directory on the controller, empty when the play starts (the deploy makes a fresh one): the role writes <host>.json for each host and _hosts.json, the play's hosts, and hnx modules gather reads them."
        required: true
      module_census_systemctl_cli: &cli
        type: str
        description: "The systemctl command each host runs (a test points it at a stand-in)."
        default: systemctl
      module_census_pairs_dir:
        type: path
        description: "Where the notifier owners write the notify pairs they hold, <dir>/<owner>/pairs.json (owners broker and status; homelabnext.notify.record): read in one step by the role's notify_pairs_records module, never through a link at any step, from directories no one but their owner may write; a record missing means the host holds none of that owner."
        default: /var/lib/homelabnext/notify-pairs
      module_census_broker_socket:
        type: str
        description: "On a host that runs the broker, its socket, under /run/: the census asks it, as root, for the agents it serves (hnx broker agents); the broker's manifest lists root in operators (manifest 1.8). Empty: the host runs no broker."
        default: ""
      module_census_hnx_cli:
        type: str
        description: "The hnx command a broker host runs, an absolute path (a test points it at a stand-in)."
        default: /opt/hnx/bin/hnx
      module_census_mcp_configs:
        type: list
        elements: dict
        description: "The MCP client configurations installed on this host (what hnx mcp catalog render wrote and the deploy installed), each {path, client}: path absolute, client one of claude-code, generic, hermes (a fleet host's clients), the file named as that client's configuration (claude-code [name].mcp.json, generic [name.]mcp.json, hermes config.yaml). Trusted overlay input: it names files the census reads on the host. Each is read and parsed on the host by the role's mcp_client_configs module (never through a link, from files and directories root's or the connection user's that their group and others may not write, the file a single link) and only the server names it registers are returned, never its text; an absent file is read as a client that registers nothing. Empty: the host has none, and the census does not look."
        default: []
      module_census_catalog_url:
        type: str
        description: "On a host that runs the lake catalog (the lake-catalog slot's Iceberg REST catalog), its address, http(s)://<loopback IP literal>:<port>: the census lists the warehouse's tables from the catalog's own host (hnx modules catalog-tables: GET requests only, names only, no redirect followed, no proxy). Empty: the host runs no catalog, and tables are gathered from no host here."
        default: ""
      module_census_catalog_warehouse:
        type: str
        description: "The warehouse whose tables the census lists (required with module_census_catalog_url)."
        default: ""
      module_census_catalog_api_root:
        type: str
        description: "The catalog's API root under its address."
        default: /catalog
      module_census_catalog_token_file:
        type: str
        description: "A file on the catalog host holding the bearer token the catalog wants, root's alone (mode 0600, a single link, never through a link): the listing task becomes root to read it, and the token goes only to the loopback address, never to the controller. Empty: the catalog takes no token, and the task does not become."
        default: ""
  health:
    short_description: Fail unless the host answers systemctl --version.
    options:
      module_census_systemctl_cli: *cli
  readiness:
    short_description: No dependency; succeeds.
    options: {}
  backup:
    short_description: Nothing to back up; the census is taken again on every run.
    options: {}
  restore:
    short_description: Nothing to restore; the census is taken again on every run.
    options: {}
  upgrade:
    short_description: Nothing installed, nothing to upgrade.
    options: {}
  export:
    short_description: Nothing kept on the host; the census is the controller's directory.
    options: {}
