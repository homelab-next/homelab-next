- name: Validate the settings
  ansible.builtin.assert:
    that:
      - open_webui_gateway_id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)*\Z')
      - open_webui_gateway_impls | length > 0 or open_webui_gateway_id is not match(open_webui_backend_id_pattern)
      - open_webui_gateway_key_ref is match('^secret:[a-z0-9][a-z0-9/_.-]*\Z')
      - open_webui_session_key_ref is match('^secret:[a-z0-9][a-z0-9/_.-]*\Z')
      - open_webui_gateway_key_ref != open_webui_session_key_ref
      - open_webui_image is match('^[^@:]+(/[^@:]+)*:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}@sha256:[0-9a-f]{64}\Z')
      - open_webui_port | int >= 1 and open_webui_port | int <= 65535
      - open_webui_gateway_capabilities is sequence
      - open_webui_gateway_impls is sequence
      - open_webui_gateway_capabilities | length > 0
      - open_webui_gateway_capabilities | reject('match', '^[a-z][a-z0-9]*(-[a-z0-9]+)*\\Z') | list | length == 0
      # the headers the gateway reads: a TLP label it accepts (empty: none), a tag prefix
      # (the gateway's own pattern: nothing a header value cannot carry)
      - open_webui_gateway_tlp is string
      - open_webui_gateway_tlp == '' or open_webui_gateway_tlp in open_webui_tlp_labels
      - open_webui_gateway_tag_prefix is string
      - open_webui_gateway_tag_prefix is match('^[A-Za-z0-9._:/-]{0,64}\\Z')
      - open_webui_gateway_tag_per_user is boolean
      # sign-in: an https issuer, this app's client, its secret by reference and a public URL to
      # redirect back to, all or none
      - open_webui_oidc_issuer_url is string
      - >-
        open_webui_oidc_issuer_url == '' or open_webui_oidc_issuer_url
        is match('^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[1-9][0-9]{0,4})?(/[A-Za-z0-9._~-]+)*\\Z')
      - >-
        open_webui_oidc_issuer_url == '' or (open_webui_oidc_client_id
        is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}\\Z')
        and open_webui_oidc_client_secret_ref is match('^secret:[a-z0-9][a-z0-9/_.-]*\\Z')
        and open_webui_public_url | length > 0)
      - open_webui_oidc_provider_name is match('^[A-Za-z0-9][A-Za-z0-9 ._-]{0,31}\\Z')
      # the break-glass administrator: an email and its password's reference, both or neither
      - open_webui_admin_email is string
      # the first account Open WebUI sees becomes its administrator: with a sign-in issuer the
      # break-glass administrator must exist first, so the first OIDC user can never be one
      - open_webui_oidc_issuer_url == '' or open_webui_admin_email != ''
      - (open_webui_admin_email == '') == (open_webui_admin_password_ref == '')
      - open_webui_admin_email == '' or open_webui_admin_email is match('^[A-Za-z0-9._+-]{1,64}@[a-z0-9]([a-z0-9.-]*[a-z0-9])?\\Z')
      - open_webui_admin_password_ref == '' or open_webui_admin_password_ref is match('^secret:[a-z0-9][a-z0-9/_.-]*\\Z')
      - >-
        [open_webui_gateway_key_ref, open_webui_session_key_ref, open_webui_oidc_client_secret_ref,
         open_webui_admin_password_ref] | select('!=', '') | list | length
        == [open_webui_gateway_key_ref, open_webui_session_key_ref, open_webui_oidc_client_secret_ref,
            open_webui_admin_password_ref] | select('!=', '') | list | unique | length
      # the optional front (the concierge shim): its base URL, the key Open WebUI presents to it, extra services
      - open_webui_connection_url is string
      - open_webui_connection_url == '' or open_webui_connection_url is match('^http://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[1-9][0-9]{0,4})?/v1\\Z')
      - open_webui_connection_key_ref is string
      - open_webui_connection_key_ref == '' or open_webui_connection_key_ref is match('^secret:[a-z0-9][a-z0-9/_.-]*\\Z')
      - open_webui_extra_services is mapping
      - open_webui_extra_secret_env is mapping
      - open_webui_extra_services | length == 0 or open_webui_connection_url != ''
      # web search: the registry id of the lab's metasearch service, or empty (off)
      - open_webui_web_search_id is string
      - open_webui_web_search_id == '' or open_webui_web_search_id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)*\\Z')
      - open_webui_web_search_id != open_webui_gateway_id
      - open_webui_web_search_capabilities is sequence
      - open_webui_web_search_capabilities | length > 0
      - open_webui_web_search_result_count | string is match('^[0-9]{1,2}\\Z')
      - open_webui_web_search_result_count | int >= 1 and open_webui_web_search_result_count | int <= 20
      - open_webui_extra_env is mapping
      - open_webui_extra_env | list | reject('in', open_webui_allowed_env) | list | length == 0
      - open_webui_extra_env | list | select('in', open_webui_fixed_env) | list | length == 0
      - open_webui_extra_env | list | select('search', open_webui_reserved_env_pattern) | list | length == 0
      - open_webui_extra_env | list | reject('match', '^[A-Z][A-Z0-9_]*\Z') | list | length == 0
      - open_webui_extra_env.values() | reject('string') | list | length == 0
      - >-
        open_webui_extra_env.get('GLOBAL_LOG_LEVEL', 'INFO') | upper
        in open_webui_log_levels
      # an https origin, lower-case host (punycode for a non-ASCII name; no IPv6 literal), no
      # path; a port from 1 to 65535 but never :443, since the websocket's origin check is exact
      # and a browser never sends the default port
      - open_webui_public_url is string
      - >-
        open_webui_public_url | length == 0 or open_webui_public_url
        is match('^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[1-9][0-9]{0,4})?\Z')
      - open_webui_public_url is not search(':443\Z')
      - >-
        (open_webui_public_url.rsplit(':', 1)[1] if open_webui_public_url is search(':[0-9]+\Z')
         else '1') | int <= 65535
    fail_msg: >-
      open_webui: the gateway's registry id (not a model backend: Open WebUI talks to the LLM
      gateway only), two distinct secret: references (this app's gateway key, the session key),
      an image pinned by tag and digest, a port, an optional public URL (https://host[:port],
      lower-case host, port 1-65535 and not 443, no path), an optional web search id (a registry
      id, not the gateway's) with a result count of 1 to 20, and extra settings (strings) named in
      open_webui_allowed_env ({{ open_webui_allowed_env | join(', ') }}),
      none of them fixed or reserved, with GLOBAL_LOG_LEVEL one of
      {{ open_webui_log_levels | join(', ') }}; refused names:
      {{ ((open_webui_extra_env if open_webui_extra_env is mapping else {}) | list
          | reject('in', open_webui_allowed_env)
          | union((open_webui_extra_env if open_webui_extra_env is mapping else {}) | list
                  | select('in', open_webui_fixed_env))
          | union((open_webui_extra_env if open_webui_extra_env is mapping else {}) | list
                  | select('search', open_webui_reserved_env_pattern))
          | list) | join(', ') or 'none' }}

- name: Resolve the gateway id through the registry
  ansible.builtin.assert:
    that: lookup('hnx_registry', open_webui_gateway_id, field='capability') in open_webui_gateway_capabilities
    fail_msg: >-
      open_webui: {{ open_webui_gateway_id }} is registry service with capability
      '{{ lookup('hnx_registry', open_webui_gateway_id, field='capability') }}', not
      {{ open_webui_gateway_capabilities | join(' or ') }}: Open WebUI talks to the LLM gateway only, never to an
      engine or another service, whatever the id is called

- name: Resolve the web search id through the registry
  ansible.builtin.assert:
    that: lookup('hnx_registry', open_webui_web_search_id, field='capability') in open_webui_web_search_capabilities
    fail_msg: >-
      open_webui: the web search id {{ open_webui_web_search_id }} is a registry service with capability
      '{{ lookup('hnx_registry', open_webui_web_search_id, field='capability') }}', not
      {{ open_webui_web_search_capabilities | join(' or ') }}: web search goes to the lab's own
      metasearch service only
  when: open_webui_web_search_id | length > 0

- name: Resolve the gateway's product through the registry
  ansible.builtin.assert:
    that: >-
      open_webui_gateway_impls | length == 0
      or lookup('hnx_registry', open_webui_gateway_id, field='impl') in open_webui_gateway_impls
    fail_msg: >-
      open_webui: {{ open_webui_gateway_id }} is registry service of product
      '{{ lookup('hnx_registry', open_webui_gateway_id, field='impl') }}', not
      {{ open_webui_gateway_impls | join(' or ') }}: Open WebUI talks to the LLM gateway only,
      never to an engine behind it
