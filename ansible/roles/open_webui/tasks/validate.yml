- name: Validate the settings
  ansible.builtin.assert:
    that:
      - open_webui_gateway_id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)*\Z')
      - open_webui_gateway_id is not match(open_webui_backend_id_pattern)
      - open_webui_gateway_key_ref is match('^secret:[a-z0-9][a-z0-9/_.-]*\Z')
      - open_webui_session_key_ref is match('^secret:[a-z0-9][a-z0-9/_.-]*\Z')
      - open_webui_gateway_key_ref != open_webui_session_key_ref
      - open_webui_image is match('^[^@:]+(/[^@:]+)*:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}@sha256:[0-9a-f]{64}\Z')
      - open_webui_port | int >= 1 and open_webui_port | int <= 65535
      - open_webui_extra_env is mapping
      - open_webui_extra_env | list | reject('in', open_webui_allowed_env) | list | length == 0
      - open_webui_extra_env | list | select('in', open_webui_fixed_env) | list | length == 0
      - open_webui_extra_env | list | select('search', open_webui_reserved_env_pattern) | list | length == 0
      - open_webui_extra_env | list | reject('match', '^[A-Z][A-Z0-9_]*\Z') | list | length == 0
      - open_webui_extra_env.values() | reject('string') | list | length == 0
      # a value is passed through as it is, never a template
      - open_webui_extra_env.values() | select('search', '[{]([{]|%)') | list | length == 0
      - >-
        open_webui_extra_env.get('GLOBAL_LOG_LEVEL', 'INFO') | upper
        in open_webui_log_levels
      # an https origin, lower-case host (punycode for a non-ASCII name; no IPv6 literal), no
      # path; a port from 1 to 65535 but never :443, since the websocket's origin check is exact
      # and a browser never sends the default port
      - open_webui_public_url is string
      - >-
        open_webui_public_url | length == 0 or open_webui_public_url
        is match('^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[1-9][0-9]{0,4})?\Z')
      - open_webui_public_url is not search(':443\Z')
      - >-
        (open_webui_public_url.rsplit(':', 1)[1] if open_webui_public_url is search(':[0-9]+\Z')
         else '1') | int <= 65535
    fail_msg: >-
      open_webui: the gateway's registry id (not a model backend: Open WebUI talks to the LLM
      gateway only), two distinct secret: references (this app's gateway key, the session key),
      an image pinned by tag and digest, a port, an optional public URL (https://host[:port],
      lower-case host, port 1-65535 and not 443, no path), and extra settings (plain strings, no
      template) named in open_webui_allowed_env ({{ open_webui_allowed_env | join(', ') }}),
      none of them fixed or reserved, with GLOBAL_LOG_LEVEL one of
      {{ open_webui_log_levels | join(', ') }}; refused names:
      {{ ((open_webui_extra_env if open_webui_extra_env is mapping else {}) | list
          | reject('in', open_webui_allowed_env)
          | union((open_webui_extra_env if open_webui_extra_env is mapping else {}) | list
                  | select('in', open_webui_fixed_env))
          | union((open_webui_extra_env if open_webui_extra_env is mapping else {}) | list
                  | select('search', open_webui_reserved_env_pattern))
          | list) | join(', ') or 'none' }}

- name: Resolve the gateway id through the registry
  ansible.builtin.assert:
    that: lookup('hnx_registry', open_webui_gateway_id, field='capability') == open_webui_gateway_capability
    fail_msg: >-
      open_webui: {{ open_webui_gateway_id }} is registry service with capability
      '{{ lookup('hnx_registry', open_webui_gateway_id, field='capability') }}', not
      {{ open_webui_gateway_capability }}: Open WebUI talks to the LLM gateway only, never to an
      engine or another service, whatever the id is called
