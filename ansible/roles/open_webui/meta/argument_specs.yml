argument_specs:
  main:
    short_description: Run Open WebUI as a compose_app, pointed at the LLM gateway with its own key.
    options:
      open_webui_gateway_id: &gateway
        type: str
        description: "The LLM gateway's logical id in the registry (never a model backend's)."
        required: true
      open_webui_image: &image
        type: str
        description: "repository:tag@sha256:<digest> of the Open WebUI image."
        default: "ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded"
      open_webui_gateway_key_ref: &gwkey
        type: str
        description: "secret:<name> of this app's gateway key (a key of the gateway spec)."
        default: secret:llm-gateway/key-chat-ui
      open_webui_gateway_capabilities: &gwcaps
        type: list
        elements: str
        description: "Registry capabilities the gateway id may resolve to (the lab's own gateway answers as inference)."
        default: [llm-gateway]
      open_webui_gateway_impls: &gwimpls
        type: list
        elements: str
        description: "Registry impl (product) the gateway id must also be, when a capability has two kinds of provider; empty: not checked."
        default: []
      open_webui_gateway_tlp:
        type: str
        description: "TLP label sent as X-HNX-TLP on every gateway call (clear, green, amber, amber+strict, red); empty sends none."
        default: ""
      open_webui_gateway_tag_prefix:
        type: str
        description: "Prefix of the X-HNX-Tag usage tag (letters, digits and . _ : / -, up to 64); empty sends no tag unless per-user."
        default: ""
      open_webui_gateway_tag_per_user:
        type: bool
        description: "Append the signed-in user's id to the usage tag (prefix:user-id)."
        default: false
      open_webui_oidc_issuer_url:
        type: str
        description: "https://host/realms/<realm> of the OpenID Connect issuer; empty keeps local accounts only. Needs open_webui_public_url."
        default: ""
      open_webui_oidc_client_id:
        type: str
        description: "This app's client id at the issuer (required with an issuer)."
        default: ""
      open_webui_oidc_client_secret_ref:
        type: str
        description: "secret:<name> of the client's secret (required with an issuer)."
        default: ""
      open_webui_oidc_provider_name:
        type: str
        description: "The sign-in button's label."
        default: SSO
      open_webui_admin_email:
        type: str
        description: "Email of the break-glass local administrator, created at start only while no user exists; empty: none."
        default: ""
      open_webui_admin_password_ref:
        type: str
        description: "secret:<name> of the break-glass administrator's password (with open_webui_admin_email)."
        default: ""
      open_webui_web_search_id:
        type: str
        description: "Registry id of the lab's metasearch service (capability in open_webui_web_search_capabilities); empty keeps web search off."
        default: ""
      open_webui_web_search_capabilities:
        type: list
        elements: str
        description: "Registry capabilities the web search id may resolve to."
        default: [web-search]
      open_webui_web_search_result_count:
        type: int
        description: "Results a web search puts in front of the model (1 to 20)."
        default: 5
      open_webui_connection_url:
        type: str
        description: "Optional base URL (ending /v1) of a front between Open WebUI and the gateway (the concierge shim); empty: the gateway's registry URL."
        default: ""
      open_webui_connection_key_ref:
        type: str
        description: "secret:<name> of the key Open WebUI presents on that connection; empty: the gateway key."
        default: ""
      open_webui_extra_services:
        type: dict
        description: "Extra compose services (sidecars) for the same project, by name."
        default: {}
      open_webui_extra_secret_env:
        type: dict
        description: "Service name to {VARIABLE: secret:<name>} for the extra services; read at deploy time into their 0600 env_files."
        default: {}
      open_webui_session_key_ref: &session
        type: str
        description: "secret:<name> of the session signing key (WEBUI_SECRET_KEY)."
        default: secret:open-webui/session-key
      open_webui_bind: &bind
        type: str
        description: "Host address the port is published on (loopback: the front door proxies it)."
        default: 127.0.0.1  # no-raw-endpoint: allow loopback default
      open_webui_port: &port
        type: int
        description: "Host port."
        default: 3000
      open_webui_dir: &dir
        type: path
        description: "The compose project directory (data/ under it)."
        default: /opt/compose/open-webui
      open_webui_owner: &owner
        type: str
        description: "Owner of the project directory."
        default: root
      open_webui_group: &group
        type: str
        description: "Group of the project directory."
        default: root
      open_webui_mem_limit:
        type: str
        description: "Container memory limit."
        default: 2g
      open_webui_extra_env:
        type: dict
        description: >-
          Extra non-secret Open WebUI settings, each named in the role's allowlist
          (open_webui_allowed_env); any other name is refused.
        default: {}
      open_webui_public_url:
        type: str
        description: >-
          https://host[:port] users reach it at (lower-case host, no path, not :443); sets
          WEBUI_URL and makes it the only CORS origin. Empty keeps upstream's default.
        default: ""
      open_webui_export_dir: &export
        type: path
        description: "Open-format export target."
        default: /var/backups/compose/open-webui/export
      open_webui_start:
        type: bool
        description: "Run docker compose up after rendering."
        default: true
      open_webui_validate_with_docker:
        type: bool
        description: "Run docker compose config on the rendered file."
        default: true
      open_webui_health_timeout: &htimeout
        type: int
        description: "Seconds for the health request."
        default: 10
  health:
    short_description: Fail unless the container is healthy and Open WebUI answers /health.
    options:
      open_webui_dir: *dir
      open_webui_bind: *bind
      open_webui_port: *port
      open_webui_health_timeout: *htimeout
  readiness:
    short_description: Fail unless the LLM gateway accepts connections.
    options:
      open_webui_gateway_id: *gateway
  backup:
    short_description: Name the data directory (chats, users, settings) for the backup.
    options: &appopts
      open_webui_gateway_id: *gateway
      open_webui_image: *image
      open_webui_dir: *dir
      open_webui_owner: *owner
      open_webui_group: *group
      open_webui_export_dir: *export
  restore:
    short_description: Restore the data directory from a backup source.
    options:
      open_webui_dir: *dir
      open_webui_restore_source:
        type: path
        description: Directory to restore from.
        required: true
  upgrade:
    short_description: Validate an image bump (tag and digest) and record it as pending.
    options:
      <<: *appopts
      open_webui_target_image:
        type: str
        description: "repository:tag@sha256:<digest> to move to."
        required: true
  export:
    short_description: Write the open-format exit copy of the data directory.
    options: *appopts
