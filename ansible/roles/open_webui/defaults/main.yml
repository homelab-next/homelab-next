# SPDX-License-Identifier: Apache-2.0
# Open WebUI, the chat front end (ADR-0023): it talks to the LLM gateway, which maps the role
# names it lists to backends and enforces this app's own key, and never to vLLM or llama-server
# directly. Ollama, direct connections, sign-up and the update check are off.
open_webui_image: "ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded"
# open_webui_gateway_id (required): the gateway's logical id in the registry, e.g. llm-gateway
# this app's gateway key, by reference (the gateway spec's key for the chat front end)
open_webui_gateway_key_ref: secret:llm-gateway/key-chat-ui
# the signing key of Open WebUI's sessions, by reference
open_webui_session_key_ref: secret:open-webui/session-key
# published on loopback: the front door (reverse proxy with the lab's sign-in) is the way in
open_webui_bind: 127.0.0.1  # no-raw-endpoint: allow loopback default, the front door proxies it
open_webui_port: 3000
open_webui_dir: /opt/compose/open-webui
open_webui_owner: root
open_webui_group: root
open_webui_mem_limit: 2g
# extra, non-secret Open WebUI settings, from the allowlist in vars/ (open_webui_allowed_env)
open_webui_extra_env: {}
# the address users reach it at through the front door (https://host[:port], no path), optional:
# when set it is WEBUI_URL and the only CORS origin; empty leaves upstream's CORS default ('*')
open_webui_public_url: ""
open_webui_export_dir: /var/backups/compose/open-webui/export
open_webui_start: true
open_webui_validate_with_docker: true
open_webui_health_timeout: 10
# the registry capabilities the gateway id may resolve to (default: the LLM gateway of the old
# stack; the lab's own gateway answers as 'inference')
open_webui_gateway_capabilities: [llm-gateway]
# the registry 'impl' (the product) the gateway id must also be, when a capability has two kinds of
# provider (the gateway and an engine behind it both answer 'inference'); empty: not checked, and
# the id may then not be named like a model backend
open_webui_gateway_impls: []
# optional per-request headers the gateway reads, sent on every call of the one gateway connection
# (Open WebUI's connection 'headers' setting, set from the environment on every start): X-HNX-TLP
# is the TLP label of what this app sends (empty: none sent, which the gateway reads as red) and
# X-HNX-Tag a usage tag, the prefix (empty: none) with ':' and the signed-in user's id when per-user
open_webui_gateway_tlp: ""
open_webui_gateway_tag_prefix: ""
open_webui_gateway_tag_per_user: false
# optional OpenID Connect sign-in (empty issuer: none): the issuer (https://host/realms/<realm>),
# this app's client and the reference of that client's secret; needs open_webui_public_url (the
# redirect is <public url>/oauth/oidc/callback). The password form stays on for the break-glass admin.
open_webui_oidc_issuer_url: ""
open_webui_oidc_client_id: ""
open_webui_oidc_client_secret_ref: ""
open_webui_oidc_provider_name: SSO
# optional break-glass local administrator, created at start only while the database has no user
# (email, and the reference of its password; both or neither)
open_webui_admin_email: ""
open_webui_admin_password_ref: ""
