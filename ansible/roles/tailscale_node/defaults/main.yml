# SPDX-License-Identifier: Apache-2.0
# Remote access over Tailscale (control remote-access, applied per guest). The node joins with
# an auth key named by a secret reference (secret:<name>, resolved by the hnx_secret lookup),
# and advertises tag:zone-<zone> for its zone, the same tag the tailscale-acl target writes
# policy for. No exit node and no subnet routes are advertised.
tailscale_node_version: "1.88.4"
# The vendor package repository (stable track, Debian); point it at a lab mirror to control it.
tailscale_node_repository: "https://pkgs.tailscale.com/stable/debian"
# The primary-key fingerprints the repository's signing key (<repository>/<release>.noarmor.gpg)
# must carry: the vendor's "Tailscale Inc. (Package repository signing key)". A mirror serves the
# same key; a key rotation adds the new fingerprint here.
tailscale_node_key_fingerprints:
  - "2596A99EAAB33821893C0A79458CA832957F5868"
# The guest's zone from the generated inventory (hnx_zone): its tag is tag:zone-<zone>.
tailscale_node_zone: "{{ hnx_zone }}"
tailscale_node_extra_tags: []
# Empty: the host name.
tailscale_node_hostname: ""
tailscale_node_cli: tailscale
# Where the auth key is written for `tailscale up --auth-key=file:...`; removed right after.
tailscale_node_auth_key_file: /run/homelabnext-tailscale-auth
