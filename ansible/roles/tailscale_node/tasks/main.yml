# SPDX-License-Identifier: Apache-2.0
# Control remote-access (ADR-0016 decision 7): the client from the vendor's signed apt repository,
# joined once with an auth key; who may reach the node is the tailnet policy the tailscale-acl
# target renders from the site model. A node already running is left as it is (re-tagging a running
# node is a `tailscale set`, not done here yet).
- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Check the host has a vendor apt repository (Debian or Ubuntu)
  ansible.builtin.include_tasks: platform.yml

- name: Install gpg (it checks the vendor key's fingerprint)
  ansible.builtin.apt:
    name: gpg
    state: present

- name: Fetch the vendor signing key and check it against the pinned fingerprints
  ansible.builtin.include_tasks: signing_key.yml

- name: Add the vendor apt repository, signed by the checked vendor key
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "{{ tailscale_node_apt_uri }}"
    suites: "{{ tailscale_node_release }}"
    components: main
    signed_by: "{{ tailscale_node_keyring }}"

# The package is held (below), so moving it to a new pin (the upgrade hook's bump path) must be
# allowed to change that one held package; the hold is set again right after.
- name: Install the pinned client
  ansible.builtin.apt:
    name: "tailscale={{ tailscale_node_version }}"
    allow_change_held_packages: true
    update_cache: true

- name: Hold the package at its pin again
  ansible.builtin.dpkg_selections:
    name: tailscale
    selection: hold

- name: Enable and start the daemon
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Read the node state
  ansible.builtin.command:
    argv: ["{{ tailscale_node_cli }}", status, --json]
  register: tailscale_node_status
  changed_when: false
  failed_when: false

- name: Join the tailnet with the zone tags (only when not running yet)
  when: >-
    tailscale_node_status.rc != 0
    or (tailscale_node_status.stdout | from_json).BackendState != 'Running'
  block:
    - name: Write the auth key to a transient file only root can read
      ansible.builtin.copy:
        dest: "{{ tailscale_node_auth_key_file }}"
        content: "{{ lookup('hnx_secret', tailscale_node_auth_key_ref) }}"
        mode: "0600"
      no_log: true
    - name: Bring the node up (no exit node, no subnet routes)
      ansible.builtin.command:
        argv: >-
          {{ [tailscale_node_cli, 'up', '--auth-key=file:' ~ tailscale_node_auth_key_file,
              '--advertise-tags=' ~ (tailscale_node_tags | join(','))]
             + (['--hostname=' ~ tailscale_node_hostname] if tailscale_node_hostname else []) }}
      changed_when: true
  always:
    - name: Remove the transient auth key file
      ansible.builtin.file:
        path: "{{ tailscale_node_auth_key_file }}"
        state: absent
