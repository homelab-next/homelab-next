- name: Validate the client command, the networks and the DNS choice
  ansible.builtin.assert:
    that:
      - subnet_router_cli is match('^/?[A-Za-z0-9._/-]+\Z')
      - subnet_router_advertise_routes | length > 0
      - subnet_router_advertise_routes | select('match', '^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])/(?:[89]|[12][0-9]|3[0-2])\Z') | list | length == subnet_router_advertise_routes | length
      - subnet_router_accept_dns is boolean
      - subnet_router_sysctl_file is match('^/[A-Za-z0-9._/-]+\Z')
      - subnet_router_sysctl_cli is match('^/?[A-Za-z0-9._/-]+\Z')
    fail_msg: >-
      subnet_router: a client command, at least one IPv4 CIDR (/8 to /32) to advertise, a boolean
      accept_dns and an absolute sysctl file path
