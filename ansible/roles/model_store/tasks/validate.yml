# Paths and names reach the hf command line and file modes: refuse anything outside the store's
# grammar (the same rules as homelabnext.models.store), and every floating revision.
- name: Validate the store settings
  ansible.builtin.assert:
    that:
      - model_store_manifest is mapping
      - model_store_manifest.models is defined and model_store_manifest.models is mapping
      - model_store_manifest.models | length > 0
      - model_store_root is match('^/[A-Za-z0-9._/-]+\Z') and '..' not in model_store_root.split('/')
      - model_store_owner is match('^[a-z_][a-z0-9_-]{0,31}\Z')
      - model_store_group is match('^[a-z_][a-z0-9_-]{0,31}\Z')
      - model_store_exports_group is match('^[a-z_][a-z0-9_-]{0,31}\Z')
      - model_store_manage_accounts is boolean
      - model_store_hf_install is boolean
      - model_store_hf_venv is match('^/[A-Za-z0-9._/-]+\Z') and '..' not in model_store_hf_venv.split('/')
      - model_store_uid | string == '' or model_store_uid | string is match('^[1-9][0-9]{0,9}\Z')
      - model_store_gid | string == '' or model_store_gid | string is match('^[1-9][0-9]{0,9}\Z')
      - model_store_exports_gid | string == '' or model_store_exports_gid | string is match('^[1-9][0-9]{0,9}\Z')
      - model_store_hf_endpoint == '' or model_store_hf_endpoint is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?\Z')
      - model_store_hf_token_ref == '' or model_store_hf_token_ref is match('^secret:[a-z0-9][a-z0-9/_.-]*\Z')
      - model_store_fetch_ids | difference(model_store_manifest.models.keys() | list) | length == 0
    fail_msg: >-
      model_store: a manifest with models, an absolute root, account and group names, an https
      hub mirror or nothing, a secret: reference for the hub token or nothing, and fetch ids that
      name manifest entries

- name: Refuse a fetch from the public hub on a host whose outbound traffic is default-deny
  ansible.builtin.assert:
    that:
      - not (model_store_require_mirror | bool) or not (model_store_fetch | bool) or model_store_hf_endpoint != ''
      - not (model_store_require_mirror | bool) or model_store_hf_endpoint is not match(model_store_public_hub_pattern, ignorecase=True)
    fail_msg: >-
      model_store: this host's outbound policy is default-deny, so the public hub is unreachable;
      set model_store_hf_endpoint to the lab's hub mirror (an https endpoint that the guest's
      firewall_rules.outbound_allow must reach, never the public hub's own host); this role opens
      no egress

- name: Refuse an entry that is not pinned, or a path that leaves its directory
  ansible.builtin.assert:
    that:
      - item.key is match('^[a-z][a-z0-9]*([-.][a-z0-9]+)*\Z')
      - item.value.format in ['hf', 'gguf', 'export']
      - >-
        item.value.format == 'export' and (item.value.source.run | default('')) is match('^[a-z0-9][a-z0-9._-]{0,63}\Z')
        or item.value.format != 'export'
        and (item.value.source.repo | default('')) is match('^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*\Z')
        and '..' not in item.value.source.repo
        and (item.value.source.revision | default('')) is match(model_store_revision_pattern)
      - item.value.files | length > 0
      - item.value.files | map(attribute='path') | select('match', '^[A-Za-z0-9_][A-Za-z0-9._-]*(/[A-Za-z0-9_][A-Za-z0-9._-]*)*\Z') | list | length == item.value.files | length
      - item.value.files | map(attribute='path') | select('search', '(^|/)\.\.(/|$)') | list | length == 0
      - item.value.files | map(attribute='sha256') | select('match', '^[0-9a-f]{64}\Z') | list | length == item.value.files | length
    fail_msg: >-
      model_store: {{ item.key }} must be pinned: a hub entry names a full 40-hex commit as
      source.revision (got {{ item.value.source.revision | default('none') }}; a branch such as
      main is a different model tomorrow), an export its run id, and every file a relative path
      and a sha256
  loop: "{{ model_store_manifest.models | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# A GGUF entry is ONE model: a single .gguf, or one complete split series as gguf-split names it
# (<stem>-00001-of-0000M.gguf .. -0000M-of-0000M, in one directory, the stem carrying the quant).
# The same rule as homelabnext.models.store: a partial series would load a truncated model (or
# fail hours into a fetch), and two stems or totals are two models (mixed quants) under one digest.
# The expression says ok when the entry holds one model (an empty template result is not a string).
- name: Refuse a GGUF entry that is not one single file or one complete split series
  ansible.builtin.assert:
    that: model_store_gguf_problem | trim == 'ok'
    fail_msg: >-
      model_store: {{ item.key }} must hold exactly one GGUF model, one single-file .gguf or one
      complete split series <stem>-00001-of-0000M.gguf .. <stem>-0000M-of-0000M.gguf in one
      directory whose stem carries the entry's quant: {{ model_store_gguf_problem }}
  vars:
    model_store_split: '^(?:.*/)?[^/]+-[0-9]{5}-of-[0-9]{5}[.]gguf\Z'
    model_store_gguf_problem: >-
      {%- set g = item.value.files | map(attribute='path') | select('match', '.*[.]gguf\Z') | sort | list -%}
      {%- set s = g | select('match', model_store_split) | list -%}
      {%- if g | length == 0 -%}it lists no .gguf
      {%- elif g | length == 1 and s | length == 0 -%}ok
      {%- elif s | length != g | length -%}a single-file .gguf beside other .gguf files ({{ g | reject('match', model_store_split) | join(', ') }})
      {%- else -%}
      {%- set heads = s | map('regex_replace', '-[0-9]{5}-of-[0-9]{5}[.]gguf\Z', '') | unique | list -%}
      {%- set totals = s | map('regex_replace', '^.*-of-([0-9]{5})[.]gguf\Z', '\\1') | unique | list -%}
      {%- if heads | length != 1 or totals | length != 1 -%}mixed quants or series ({{ heads | join(', ') }} of {{ totals | join(', ') }})
      {%- else -%}
      {%- set nums = s | map('regex_replace', '^.*-([0-9]{5})-of-[0-9]{5}[.]gguf\Z', '\\1') | map('int') | sort | list -%}
      {%- if nums != range(1, (totals[0] | int) + 1) | list -%}an incomplete series {{ heads[0] }}-*-of-{{ totals[0] }} (has {{ nums | join(', ') }})
      {%- elif (item.value.quant | default('') | lower) not in (heads[0] | basename | lower) -%}the series {{ heads[0] | basename }} does not carry the quant {{ item.value.quant | default('') }}
      {%- else -%}ok
      {%- endif -%}
      {%- endif -%}
      {%- endif -%}
  when: item.value.format == 'gguf' or (item.value.format == 'export' and item.value.layout | default('') == 'gguf')
  loop: "{{ model_store_manifest.models | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
