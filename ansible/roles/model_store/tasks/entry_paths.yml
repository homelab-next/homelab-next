# model_store_entry ({key, value}) -> its directory (homelabnext.models.store.Entry.directory) and
# the directory the hf CLI writes (the hub cache for hf, the entry directory for gguf).
- name: Locate {{ model_store_entry.key }}
  ansible.builtin.set_fact:
    model_store_entry_dir: >-
      {{ model_store_root ~ (
           '/hf/hub/models--' ~ model_store_entry.value.source.repo | replace('/', '--')
           ~ '/snapshots/' ~ model_store_entry.value.source.revision
         if model_store_entry.value.format == 'hf' else
           '/gguf/' ~ model_store_entry.value.source.repo
         if model_store_entry.value.format == 'gguf' else
           '/exports/' ~ model_store_entry.value.source.run) }}
    model_store_entry_top: >-
      {{ model_store_root ~ (
           '/hf/hub/models--' ~ model_store_entry.value.source.repo | replace('/', '--')
         if model_store_entry.value.format == 'hf' else
           '/gguf/' ~ model_store_entry.value.source.repo
         if model_store_entry.value.format == 'gguf' else
           '/exports/' ~ model_store_entry.value.source.run) }}
    # What a walk of an export allows: the files of every export entry of the same run (the key
    # is (source, run, quant), so two quants may share a directory), as check_disk unions them.
    model_store_entry_listed: >-
      {{ (model_store_manifest.models.values() | selectattr('format', 'eq', 'export')
          | selectattr('source.run', 'eq', model_store_entry.value.source.run)
          | map(attribute='files') | flatten(levels=1) | map(attribute='path') | unique | list)
         if model_store_entry.value.format == 'export'
         else (model_store_entry.value.files | map(attribute='path') | list) }}
  tags: [health, verify]
