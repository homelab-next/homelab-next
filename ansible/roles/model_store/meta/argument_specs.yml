argument_specs:
  main:
    short_description: Create the model store, fetch every hub entry at its pinned revision and verify it by sha256.
    options:
      model_store_manifest: &manifest
        type: dict
        description: "The store manifest (schemas/platform/model_store.schema.json), for example lookup('file', 'model_store.json') | from_json."
        required: true
      model_store_root: &root
        type: path
        description: "The store root (default: the manifest's root, /srv/models)."
        default: "{{ model_store_manifest.root | default('/srv/models') }}"
      model_store_owner: &owner
        type: str
        description: "Account owning the tree (the fetcher); engines never run as it."
        default: models
      model_store_group: &group
        type: str
        description: "Group the engines' accounts join: read-only access (directories 2750, files 0640)."
        default: models
      model_store_exports_group: &xgroup
        type: str
        description: "Group allowed to write exports/ (the trainers, Unsloth Studio)."
        default: model-trainers
      model_store_manage_accounts:
        type: bool
        description: "Create model_store_owner and the two groups when absent (false: they must already exist)."
        default: true
      model_store_uid:
        type: str
        description: "Fixed numeric uid for model_store_owner when it is created (empty: the system picks)."
        default: ""
      model_store_gid:
        type: str
        description: "Fixed numeric gid for model_store_group when it is created (empty: the system picks)."
        default: ""
      model_store_exports_gid:
        type: str
        description: "Fixed numeric gid for model_store_exports_group when it is created (empty: the system picks)."
        default: ""
      model_store_fetch: &fetch
        type: bool
        description: "Fetch the hub entries (false: create the layout and the manifest copy only)."
        default: true
      model_store_fetch_ids: &ids
        type: list
        elements: str
        description: "The entries this host keeps: fetch only these ids, and health and verify check only these (empty: every entry; an id that names no entry is refused)."
        default: []
      model_store_hf_install: &hfinstall
        type: bool
        description: "Install the hf CLI (huggingface_hub, pinned and hashed) into model_store_hf_venv; false: the site provides it."
        default: true
      model_store_hf_venv: &hfvenv
        type: path
        description: "The managed CLI's virtualenv."
        default: /opt/hnx/model-store/venv
      model_store_hf_cli: &cli
        type: str
        description: "The Hugging Face CLI (default: the managed virtualenv's hf, or hf on the PATH when not installing)."
        default: "{{ (model_store_hf_venv ~ '/bin/hf') if (model_store_hf_install | bool) else 'hf' }}"
      model_store_hf_endpoint: &endpoint
        type: str
        description: "A hub mirror (https URL) used instead of the public hub; empty: the hub."
        default: ""
      model_store_require_mirror: &mirror
        type: bool
        description: "Refuse a fetch without model_store_hf_endpoint (default: the host's hnx_firewall.policy_out is DROP or REJECT, so the public hub is unreachable)."
        default: "{{ (hnx_firewall | default({})).get('policy_out', 'ACCEPT') in ['DROP', 'REJECT'] }}"
      model_store_hf_token_ref: &token
        type: str
        description: "secret:<name> holding the hub token for gated repositories; empty: anonymous."
        default: ""
      model_store_export_dir: &export
        type: path
        description: "Where the export hook writes the manifest and the sha256sum listings."
        default: /var/backups/model-store/export
  health:
    short_description: "Fail unless the layout exists and the files of every entry this host keeps (model_store_fetch_ids; empty: every entry) are present with their sizes."
    options:
      model_store_manifest: *manifest
      model_store_root: *root
      model_store_fetch_ids: *ids
  verify:
    short_description: "Fail unless the files of every entry this host keeps (model_store_fetch_ids; empty: every entry) match their sha256 (the slow pass)."
    options:
      model_store_manifest: *manifest
      model_store_root: *root
      model_store_fetch_ids: *ids
  readiness:
    short_description: The hf CLI runs and reports its version (when fetching).
    options:
      model_store_hf_install: *hfinstall
      model_store_hf_venv: *hfvenv
      model_store_hf_cli: *cli
      model_store_fetch: *fetch
  backup:
    short_description: Name exports/ and manifests/ (hub entries are re-fetched from the manifest).
    options:
      model_store_manifest: *manifest
      model_store_root: *root
  restore:
    short_description: Restore exports/ from a backup source.
    options:
      model_store_root: *root
      model_store_restore_source:
        type: path
        description: Directory to restore exports/ from.
        required: true
  upgrade:
    short_description: Nothing pinned here; a model changes by a new manifest entry.
    options: {}
  export:
    short_description: Write the manifest and each entry's sha256sum listing.
    options:
      model_store_manifest: *manifest
      model_store_export_dir: *export
