- block:
    - name: Ensure the state directory exists
      ansible.builtin.file:
        path: "{{ chrony_state_dir }}"
        state: directory
        mode: "0750"
    - name: Write the backup manifest (nothing to keep; the configuration is rendered)
      ansible.builtin.copy:
        dest: "{{ chrony_state_dir }}/backup-manifest.json"
        content: "{{ {'service': 'chrony', 'paths': [], 'note': 'the configuration is rendered from the registry'} | to_nice_json }}\n"
        mode: "0640"
  tags: [backup]
