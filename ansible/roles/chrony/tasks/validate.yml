# Every value reaches a line of chrony.conf: refuse anything that could add a directive.
- name: Validate the time sources and limits
  ansible.builtin.assert:
    that:
      - chrony_server_ids | length > 0
      - chrony_server_ids | select('match', '^[a-z0-9][a-z0-9-]*\Z') | list | length == chrony_server_ids | length
      - chrony_server_hosts | select('match', '^[A-Za-z0-9][A-Za-z0-9.:-]*\Z') | list | length == chrony_server_hosts | length
      - chrony_pools | select('match', '^[A-Za-z0-9][A-Za-z0-9.-]*\Z') | list | length == chrony_pools | length
      - chrony_makestep_threshold | float > 0
      - chrony_makestep_limit | int >= -1
      - chrony_max_offset | float > 0
      - chrony_service is match('^[A-Za-z0-9@._-]+\Z')
    fail_msg: >-
      chrony: time sources are registry logical ids whose hosts are plain names or addresses,
      pools are plain host names, and the step threshold and offset limit are positive numbers
