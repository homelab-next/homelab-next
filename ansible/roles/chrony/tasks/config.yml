# SPDX-License-Identifier: Apache-2.0
# A changed configuration is parsed by chronyd -p (print the configuration and exit) before it
# replaces the live one, so a bad value never reaches the daemon. Replacing the live file leaves a
# restart-pending marker that only a successful restart removes, so a failed (or disabled) restart
# is retried on the next run even though the file no longer changes.
- name: Resolve and validate the time sources
  ansible.builtin.include_tasks: validate.yml

- name: Ensure the state directory exists
  ansible.builtin.file:
    path: "{{ chrony_state_dir }}"
    state: directory
    mode: "0750"

# Written by one template task, checked by `chronyd -p` (print the configuration and exit) before
# it replaces the live file.  Not on Ansible's own temporary copy: Debian's AppArmor profile for
# chronyd lets it read /etc/chrony but not the connecting user's home where that copy sits, so the
# check failed on every real Debian 13 guest whatever the configuration said.  The validate
# command copies the candidate beside the live file (a mktemp name, so nothing else is touched),
# runs chronyd on that copy, removes it and returns chronyd's exit code.  One task, so --check
# reports the change without needing a staged file, and nothing is left behind.
- name: Write the configuration, checked by chronyd beside the live file before it goes live
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ chrony_config_file }}"
    mode: "0644"
    validate: >-
      /bin/sh -c 'c=$(mktemp "$2/.homelabnext-check.XXXXXX.conf") || exit 1;
      cat "$3" > "$c" && "$1" -p -f "$c"; rc=$?; rm -f "$c"; exit $rc'
      chrony-check {{ chrony_daemon_cli | quote }} {{ chrony_config_file | dirname | quote }} %s
  register: chrony_written

# 82341a4e staged the candidate at this path and left it there
- name: Remove the staged copy an earlier version of this role left beside the live file
  ansible.builtin.file:
    path: "{{ chrony_config_file | dirname }}/.homelabnext-staged.conf"
    state: absent

- name: Mark a restart as owed
  ansible.builtin.copy:
    dest: "{{ chrony_state_dir }}/restart-pending"
    content: "chrony.conf changed; the daemon has not been restarted since\n"
    mode: "0640"
  when: chrony_written is changed

- name: Look for a restart still owed
  ansible.builtin.stat:
    path: "{{ chrony_state_dir }}/restart-pending"
  register: chrony_pending

- name: Restart the daemon while a restart is owed
  when: chrony_pending.stat.exists and chrony_restart | bool
  block:
    - name: Restart chrony (it reads its sources only at start)
      ansible.builtin.command:
        argv: ["{{ chrony_systemctl_cli }}", restart, "{{ chrony_service }}"]
      changed_when: true
    - name: Clear the owed restart
      ansible.builtin.file:
        path: "{{ chrony_state_dir }}/restart-pending"
        state: absent
