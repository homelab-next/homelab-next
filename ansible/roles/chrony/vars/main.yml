# Derived, not a setting: each time source's host, resolved through the registry.
chrony_server_hosts: "{{ query('hnx_registry', *chrony_server_ids, field='host') }}"
# Where a new configuration waits for chronyd -p: beside the live file, which the daemon's AppArmor
# profile lets it read (tasks/config.yml).
chrony_staged_file: "{{ chrony_config_file | dirname }}/.homelabnext-staged.conf"
