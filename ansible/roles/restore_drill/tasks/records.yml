# Load the records and work out each guest's age; shared by main and health.
- name: Validate the guests and limits
  ansible.builtin.assert:
    that:
      - restore_drill_guests | length > 0
      - restore_drill_guests | selectattr('id', 'defined') | selectattr('id', 'match', '^guest:[a-z0-9][a-z0-9-]*\Z') | list | length == restore_drill_guests | length
      - restore_drill_guests | selectattr('name', 'defined') | selectattr('name', 'match', '^[a-z0-9][a-z0-9-]*\Z') | list | length == restore_drill_guests | length
      - restore_drill_interval_days | int > 0 and restore_drill_max_age_days | int >= restore_drill_interval_days | int
      - restore_drill_now == '' or restore_drill_now is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\Z')
    fail_msg: >-
      restore_drill: at least one guest with an id guest:<name> and a plain name, an interval of
      at least a day no longer than the maximum age, and a time of the form YYYY-MM-DDTHH:MM:SSZ

- name: Look for the drill records
  ansible.builtin.stat:
    path: "{{ restore_drill_state_file }}"
  register: restore_drill_state_stat

- name: Read the drill records
  ansible.builtin.slurp:
    src: "{{ restore_drill_state_file }}"
  register: restore_drill_state_raw
  when: restore_drill_state_stat.stat.exists

- name: Work out each guest's last verified drill and its age
  vars:
    restore_drill_fmt: "%Y-%m-%dT%H:%M:%SZ"
    restore_drill_records: "{{ (restore_drill_state_raw.content | b64decode | from_json).guests if restore_drill_state_stat.stat.exists else {} }}"
  ansible.builtin.set_fact:
    restore_drill_time: "{{ restore_drill_now or now(utc=true).strftime(restore_drill_fmt) }}"
    restore_drill_known: "{{ restore_drill_records }}"
    restore_drill_ages: >-
      {%- set out = {} -%}
      {%- set t = (restore_drill_now or now(utc=true).strftime(restore_drill_fmt)) | to_datetime(restore_drill_fmt) -%}
      {%- for g in restore_drill_guests -%}
      {%- set last = (restore_drill_records[g.id] | default({})).last_verified | default('') -%}
      {%- set _ = out.update({g.id: ((t - (last | to_datetime(restore_drill_fmt))).total_seconds() / 86400) if last else none}) -%}
      {%- endfor -%}
      {{ out }}
