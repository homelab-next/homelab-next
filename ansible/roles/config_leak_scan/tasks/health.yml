- block:
    - name: Scan the configuration directories
      ansible.builtin.include_tasks:
        file: scan.yml
        apply:
          tags: [health]
    - name: Fail while a secret-looking value sits outside the accepted paths
      ansible.builtin.assert:
        that: config_leak_scan_hits | length == 0
        fail_msg: >-
          config_leak_scan: {{ config_leak_scan_hits | map('dict2items') | map('map', attribute='value') | map('join', ':') | join(', ') }}
    - name: Fail while a file could not be scanned (unreadable or oversized; binaries are skipped)
      ansible.builtin.assert:
        that: config_leak_scan_unscanned | length == 0
        fail_msg: >-
          config_leak_scan: not scanned: {{ config_leak_scan_unscanned | map('dict2items') | map('map', attribute='value') | map('join', ' ') | join(', ') }}
          (accept a path with config_leak_scan_unscanned_accepted only if it cannot hold a secret)
  tags: [health]
