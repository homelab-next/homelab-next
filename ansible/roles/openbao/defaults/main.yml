# SPDX-License-Identifier: Apache-2.0
# The secret store in server mode (docs/architecture.md, "It is not a deployment"; ADR-0042
# decision 6): integrated (raft) storage, TLS on the listener, a file audit device, Shamir unseal
# by the operator. The role installs, configures and runs the server; it never initialises,
# unseals, or touches an unseal share or a root token (README.md, "What the role never does").
#
# The release lab-in-a-box pins (compose/lab-in-a-box/docker-compose.yml, service `secrets`);
# tools/tests/test_pin_consistency.py holds the two equal. 2.7.1 was published 2026-10-01.
openbao_version: "2.7.1"
# sha256 of the release archive per CPU architecture. Taken from the release's checksums.txt after
# checking its detached signature (checksums.txt.gpgsig) against the project's release key,
# primary fingerprint 66D15FDD87287219C8E15478D200CD702853E6D0 (openbao-gpg-pub-20240618.asc).
# The upgrade entry point takes the next release's pair the same way (README.md, "Upgrading").
openbao_checksums:
  amd64: "0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243"
  arm64: "2b3807d90f224df05d4fe1fdede7f052d2227596c648a56bd291381f8fd01840"
# Where the release archives are fetched from (<repository>/v<version>/<archive>); a mirror must
# serve byte-identical archives, since the checksum above is checked either way.
openbao_release_repository: "https://github.com/openbao/openbao/releases/download"
openbao_user: openbao
openbao_group: openbao
# Each release is unpacked into <install_dir>/<version>/ and openbao_bin points at the pinned one.
openbao_install_dir: /opt/openbao
openbao_bin: /usr/local/bin/bao
openbao_config_dir: /etc/openbao
openbao_data_dir: /var/lib/openbao/raft
openbao_audit_dir: /var/log/openbao
openbao_unit_dir: /etc/systemd/system
openbao_logrotate_dir: /etc/logrotate.d
openbao_systemctl_cli: systemctl
openbao_state_dir: /var/lib/homelabnext/openbao
openbao_port: 8200
openbao_cluster_port: 8201
# The raft node id; unique per server.
openbao_node_id: "{{ inventory_hostname_short }}"
# The https URL other raft members reach this one on; empty: the listen address and cluster port.
openbao_cluster_addr: ""
# Swap: this release never locks its memory (2.7 reads `disable_mlock` as an unknown field and
# ignores it), so with swap on, unsealed keys and secrets can be paged to disk. main refuses a host
# with active swap unless openbao_allow_swap (README.md, "Memory and swap").
openbao_allow_swap: false
openbao_ui: false
openbao_log_level: info
# TLS: PEMs supplied by the caller (the internal CA's server certificate, its key, the CA itself).
openbao_tls_cert_pem: ""
openbao_tls_private_key_pem: ""
openbao_tls_ca_pem: ""
# TEST RUNS ONLY: generate a throwaway CA and server certificate on the host instead. Never for a
# server that will hold a real secret: the CA key sits beside the server on the same disk.
openbao_tls_selfsigned_for_tests: false
openbao_tls_selfsigned_sans: []
openbao_tls_min_protocol: tls12
# A running server whose binary, configuration or unit changed is restarted only when this is true:
# a restart seals it, and only the operator can unseal. Otherwise main records the restart as owed
# (readiness reports it) and leaves the server running.
openbao_allow_restart: false
openbao_health_timeout: 10
# Where the backup hook writes the raft snapshot and its manifest, and the export hook its copy.
# Both hooks (and restore and upgrade) take openbao_snapshot_token, which has no default.
openbao_backup_dir: /var/backups/openbao
openbao_export_dir: /var/backups/openbao/export
# The restore hook restores a snapshot another cluster wrote only with this set (the server then
# answers to THAT cluster's unseal keys).
openbao_restore_force: false
