# Fixed, not settings.
# The unit's name, and the files main writes under openbao_config_dir.
openbao_service: openbao
openbao_config_file: "{{ openbao_config_dir }}/openbao.hcl"
openbao_tls_dir: "{{ openbao_config_dir }}/tls"
openbao_tls_cert_file: "{{ openbao_tls_dir }}/server.pem"
openbao_tls_key_file: "{{ openbao_tls_dir }}/server-key.pem"
# The CA the server's certificate chains to: clients (and the hooks, on the host) verify with it.
# Supplied PEMs: the internal CA's, written here. ACME: the host's public trust store.
openbao_tls_ca_file: "{{ openbao_acme_trust_bundle if openbao_tls_source == 'acme' else openbao_tls_dir ~ '/ca.pem' }}"
# ACME: the root-only environment file holding the DNS provider's token (the renewal unit's
# EnvironmentFile=), the renewal script, and the unit's name.
openbao_acme_env_file: "{{ openbao_config_dir }}/acme/dns.env"
openbao_acme_script: /usr/local/libexec/homelabnext/openbao-acme-renew
openbao_acme_unit: hnx-openbao-acme
# The DNS provider's environment variable for its token (lego's provider documentation).
openbao_acme_token_env:
  cloudflare: CF_DNS_API_TOKEN
# The shared last-run writer (role last_run); the renewal unit's ExecStartPre= and ExecStopPost=.
openbao_last_run_writer: /usr/local/libexec/homelabnext/hnx-last-run
openbao_audit_file: "{{ openbao_audit_dir }}/audit.log"
# Debian/Ubuntu machine names to the release's architecture names.
openbao_arch_names:
  x86_64: amd64
  amd64: amd64
  aarch64: arm64
  arm64: arm64
# sys/health answers with a status per state; asking with these codes makes every state a 200
# and the body says which (readiness reads it; health asks without them, so only active is 200).
openbao_health_query: "standbyok=true&perfstandbyok=true&sealedcode=200&uninitcode=200&drsecondarycode=200"
# The listen address as it is written before a port (an IPv6 address in brackets).
openbao_listen_address_hostport: "{{ ('[' ~ openbao_listen_address ~ ']') if ':' in openbao_listen_address else openbao_listen_address }}"
# Who owns what the service account must read but never write (the releases, the configuration,
# the TLS files, the snapshots): root. Tests running unprivileged override it as extra variables.
openbao_owner: root
openbao_owner_group: root
# The cluster URL the configuration carries: openbao_cluster_addr, else the listen address.
openbao_cluster_url: "{{ openbao_cluster_addr or ('https://' ~ openbao_listen_address_hostport ~ ':' ~ (openbao_cluster_port | int)) }}"
# The active swap areas (tests point it at a file of their own).
openbao_proc_swaps: /proc/swaps
# TLS 1.2 suites the listener accepts: forward-secret AEAD only (TLS 1.3 has only AEAD suites).
openbao_tls_cipher_suites:
  - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
  - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
  - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
  - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
  - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
  - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
