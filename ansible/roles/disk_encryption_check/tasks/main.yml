# Control disk-encryption (ADR-0016 decision 7): verification only (see defaults/main.yml).
- name: Find the unencrypted data volumes
  ansible.builtin.include_tasks: scan.yml

- name: Ensure the state directory exists
  ansible.builtin.file:
    path: "{{ disk_encryption_check_state_dir }}"
    state: directory
    mode: "0750"

- name: Write the report
  ansible.builtin.copy:
    dest: "{{ disk_encryption_check_state_dir }}/report.json"
    content: "{{ {'unencrypted': disk_encryption_check_unencrypted, 'accepted': disk_encryption_check_accepted} | to_nice_json }}\n"
    mode: "0640"

- name: Report the data volumes without an encrypted mapping (the health hook fails on them)
  ansible.builtin.debug:
    msg: >-
      disk_encryption_check: {{ disk_encryption_check_unencrypted | map(attribute='mountpoint') | join(', ') }}
      {{ 'has' if disk_encryption_check_unencrypted | length == 1 else 'have' }} no encrypted
      mapping; encryption happens when the guest is provisioned, never in place
  when: disk_encryption_check_unencrypted | length > 0
