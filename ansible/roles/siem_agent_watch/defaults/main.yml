# What the SIEM endpoint agent watches (applied by the siem-agent control's role, which includes this
# one; it names no product, the agent's file layout being the vendor-neutral "ossec" one). The vendor
# default already watches /etc, /usr/bin, /usr/sbin, /bin, /sbin and /boot on a schedule; these add
# real-time watches on what an intruder edits to stay (ssh, pam, sudo, audit rules, cron) and
# scheduled watches on locally installed code.
siem_agent_watch_fim_realtime_paths: [/etc/ssh, /etc/pam.d, /etc/sudoers.d, /etc/audit/rules.d, /etc/cron.d]
siem_agent_watch_fim_paths: [/usr/local/bin, /usr/local/sbin]
# (siem_agent_watch_auditd, required: the kernel audit log as a source - auto = when the audit daemon
# is installed and the host is not a container, since an unprivileged container has no kernel audit
# system and its audit daemon never runs; enabled; or disabled. The including role passes `auto`
# unless the host sets it.)
siem_agent_watch_audit_log: /var/log/audit/audit.log
siem_agent_watch_manifest_dir: /var/lib/homelabnext/siem-agent-watch
