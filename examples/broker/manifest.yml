# SPDX-License-Identifier: Apache-2.0
# Example broker manifest (schemas/broker/manifest 1.5): one agent profile with three write lanes,
# a read-only status action, an approval-gated restart and three read-only lookups (a service's
# name, a DHCP server's leases, a hypervisor node's guests).  Walkthrough: docs/broker.md.
#   hnx broker validate examples/broker/manifest.yml
# dev_identity: true lets the CLI's asserted --as identity drive it, for the walkthrough only; a
# deployment authenticates callers on the socket instead (manifest.production.yml).
manifest_id: example-lab-broker
default: deny
mode: enforce
dev_identity: true
approval_ttl_s: 900
approvers:
  - {issuer: sso, subject: operator-one, kind: human}
handler_docs:
  - handlers/service-status.handler.json
  - handlers/service-restart.handler.json
  - handlers/dns-lookup.handler.json
  - handlers/dhcp-leases.handler.json
  - handlers/hypervisor-guests.handler.json
lanes:
  # the agent's own memory: <data-root>/memory/<profile>/<name>.md, never overwritten
  - name: memory
    kind: files
    root: memory
    per_actor: true
    filename_pattern: '^[a-z0-9][a-z0-9-]{0,62}\.md$'
    max_bytes: 65536
    format: text
  # the agent's findings: <data-root>/findings/<profile>/<YYYY-MM-DD>-<slug>.md
  - name: findings
    kind: files
    root: findings
    per_actor: true
    filename_pattern: '^\d{4}-\d{2}-\d{2}-[a-z0-9][a-z0-9-]{0,60}\.md$'
    max_bytes: 262144
    format: text
  # proposals: a records note into <data-root>/records/inbox/, validated by the records schema
  - name: proposals
    kind: records-inbox
    root: records
    per_actor: false
    max_bytes: 65536
    note_types: [proposal]
actions:
  - {action: memory.write, tier: write, handler: builtin/lane, lane: memory, requires_approval: false}
  - {action: finding.write, tier: write, handler: builtin/lane, lane: findings, requires_approval: false}
  - {action: proposal.file, tier: write, handler: builtin/lane, lane: proposals, requires_approval: false}
  - {action: service.status, tier: read, handler: handlers/service-status.sh, requires_approval: false}
  - {action: service.restart, tier: execute, handler: handlers/service-restart.sh, requires_approval: true}
  # read actions for a correlation (a name, its lease, the guest holding it): stand-ins only
  - {action: dns.lookup, tier: read, handler: handlers/dns-lookup.sh, requires_approval: false}
  - {action: dhcp.leases, tier: read, handler: handlers/dhcp-leases.sh, requires_approval: false}
  - {action: hypervisor.guests, tier: read, handler: handlers/hypervisor-guests.sh, requires_approval: false}
grants:
  - profile: profile:triage
    actions: [memory.write, finding.write, proposal.file, service.status, service.restart,
              dns.lookup, dhcp.leases, hypervisor.guests]
    max_tier: execute
  - profile: profile:reader
    actions: [service.status, dns.lookup, dhcp.leases, hypervisor.guests]
    max_tier: read
