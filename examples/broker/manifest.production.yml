# Example production broker manifest (schemas/broker/manifest 1.6): the walkthrough's actions, with
# callers authenticated on the socket instead of asserted.  Deploying it: docs/broker.md.
#   hnx broker validate examples/broker/manifest.production.yml
#   hnx broker serve --manifest examples/broker/manifest.production.yml \
#     --state /var/lib/hnx-broker/state --data-root /srv/agents \
#     --socket /run/hnx-broker/broker.sock --socket-group hnx-broker-clients
manifest_id: example-lab-broker-production
default: deny
mode: enforce
# the CLI's asserted --as identity is refused: every caller is a socket peer listed below
dev_identity: false
approval_ttl_s: 900
approvers:
  - {issuer: sso, subject: operator-one, kind: human}
# one system user per agent; its processes act as exactly that profile
callers:
  - {user: hnx-agent-triage, profile: profile:triage}
  - {user: hnx-agent-reader, profile: profile:reader}
# the hub behind the SSO front door files approvals for the person it authenticated (issuer sso)
approval_relays:
  - {user: hnx-hub, issuer: sso}
# accepted work is bounded per agent: at most 10 requests pending at once, and one open approval
# page per agent, 10 minutes apart at least, however many it files (lanes: quotas per directory)
quotas: {pending_per_actor: 10, notify_window_s: 600}
handler_docs:
  - handlers/service-status.handler.json
  - handlers/service-restart.handler.json
lanes:
  - name: memory
    kind: files
    root: memory
    per_actor: true
    filename_pattern: '^[a-z0-9][a-z0-9-]{0,62}\.md$'
    max_bytes: 65536
    max_files: 1000
    max_total_bytes: 16777216
    format: text
  # findings are append-only (one note per run, never deleted): a file cap would be a retention
  # limit in disguise, so the lane has none; a byte cap and a write rate bound it instead
  - name: findings
    kind: files
    root: findings
    per_actor: true
    filename_pattern: '^\d{4}-\d{2}-\d{2}-[a-z0-9][a-z0-9-]{0,60}\.md$'
    max_bytes: 262144
    max_files: null
    max_total_bytes: 1073741824
    max_writes_per_hour: 20
    format: text
  - name: proposals
    kind: records-inbox
    root: records
    per_actor: false
    max_bytes: 65536
    note_types: [proposal]
actions:
  - {action: memory.write, tier: write, handler: builtin/lane, lane: memory, requires_approval: false}
  - {action: finding.write, tier: write, handler: builtin/lane, lane: findings, requires_approval: false}
  - {action: proposal.file, tier: write, handler: builtin/lane, lane: proposals, requires_approval: false}
  - {action: service.status, tier: read, handler: handlers/service-status.sh, requires_approval: false}
  - {action: service.restart, tier: execute, handler: handlers/service-restart.sh, requires_approval: true}
  # dns.lookup, dhcp.leases and hypervisor.guests (manifest.yml) are stand-ins answering fixed
  # fictional data, so a production manifest does not carry them
grants:
  - profile: profile:triage
    actions: [memory.write, finding.write, proposal.file, service.status, service.restart]
    max_tier: execute
  - profile: profile:reader
    actions: [service.status]
    max_tier: read
