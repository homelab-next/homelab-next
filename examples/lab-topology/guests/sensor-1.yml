id: guest:sensor-1
description: Network intrusion sensor on the mirrored core uplink.
kind: vm
provisioning: terraform
placement: {node: hv-1, vmid: 121}
resources:
  cpu: {cores: 4}
  memory: {size_mb: 8192}
  disks: [{name: rootfs, size_gb: 64, pool: fast}]
image: {logical: debian-12-cloudinit, kind: template-clone, os_type: linux-6}
network: {zone: services, ip: 192.0.2.71}
capability: cap:detections
capability_groups: [cap_siem, cap_sensor]
tags: [prod]
owners: {primary: platform-team}
