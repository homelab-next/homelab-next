# SPDX-License-Identifier: Apache-2.0
id: guest:hub-1
description: The read-only status hub these maps are served from.
kind: lxc
provisioning: terraform
placement: {node: hv-2, vmid: 125}
resources:
  cpu: {cores: 2}
  memory: {size_mb: 2048}
  disks: [{name: rootfs, size_gb: 16, pool: fast}]
image: {logical: debian-12-standard, kind: tarball, os_type: debian}
network: {zone: services, ip: 192.0.2.75}
capability: cap:records
capability_groups: [cap_monitoring]
tags: [prod]
owners: {primary: platform-team}
