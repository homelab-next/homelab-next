# SPDX-License-Identifier: Apache-2.0
id: guest:cases-1
description: Case management; every alert worth a look becomes a case.
kind: lxc
provisioning: terraform
placement: {node: hv-1, vmid: 122}
resources:
  cpu: {cores: 2}
  memory: {size_mb: 4096}
  disks: [{name: rootfs, size_gb: 32, pool: fast}]
image: {logical: debian-12-standard, kind: tarball, os_type: debian}
network: {zone: services, ip: 192.0.2.72}
firewall_rules:
  inbound_allow:
    - {name: from-siem, proto: tcp, ports: "9000", source: "192.0.2.70/32"}
    - {name: from-soar, proto: tcp, ports: "9000", source: "192.0.2.73/32"}
capability: cap:cases
capability_groups: [cap_cases]
tags: [prod]
owners: {primary: platform-team}
