# SPDX-License-Identifier: Apache-2.0
id: guest:mon-1
description: Metrics, uptime checks and the notification relay.
kind: lxc
provisioning: terraform
placement: {node: hv-2, vmid: 124}
resources:
  cpu: {cores: 2}
  memory: {size_mb: 4096}
  disks: [{name: rootfs, size_gb: 32, pool: fast}]
image: {logical: debian-12-standard, kind: tarball, os_type: debian}
network: {zone: services, ip: 192.0.2.74}
capability: cap:notify
capability_groups: [cap_monitoring]
tags: [prod]
owners: {primary: platform-team}
