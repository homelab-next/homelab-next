runbooks:
- id: RB-001
  title: Renew the internal proxy certificate
  purpose: Restore a valid certificate on the reverse proxy without dropping connections.
  systems: [proxy, tls]
  steps:
  - do: Run the renewal job in verbose mode and read its output.
    verify: output ends with "certificate renewed" and the exit code is 0
  - do: Reload the proxy configuration.
    verify: the reload command exits 0 and the proxy health endpoint returns 200
  - do: Connect from a client and read the new expiry date.
    verify: openssl reports a notAfter date more than 60 days away
- id: RB-002
  title: Add a lesson to the register
  purpose: Record a diagnosed problem so the next author finds it by symptom.
  systems: [registers]
  steps:
  - do: Append an entry with id LL-NEW and fill symptom, contributing factor and root cause.
    verify: the entry has all three fields and the root cause is not a person
  - do: Write the control and a verification that names a command and its expected result.
    verify: python3 -m homelabnext.registers build exits 0
  - do: Commit; the hook allocates the number, then run the same commit again.
    verify: git diff shows LL-NEW replaced by a number
