    exit 0 from what `make ids-check` runs (check-dupes, then check-uids, over every register):
    every record carries its canonical uid, no uid is held twice and every record file is named
    `<uid>.md`, so no record is keyed by a placeholder or a number (records are identified by
    uids, ADR-0019; exit 100 outside a git checkout)
