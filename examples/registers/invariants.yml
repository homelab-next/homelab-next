# SPDX-License-Identifier: Apache-2.0
# Criterion ids are docs/checklist.md row ids and mean what that row means; an auto or server
# criterion states the row's statement verbatim (tests/invariants/test_inv_example_register.py).
# The auto criteria run the same gates as `make check`, so `hnx invariants run` sees them too.
pillars:
- letter: F
  title: Foundation
- letter: T
  title: Transport and processing
- letter: S
  title: Storage and query
- letter: D
  title: Detection as code
- letter: O
  title: Outputs
- letter: P
  title: Control plane
- letter: R
  title: Orchestration
- letter: Q
  title: Quality gates
- letter: M
  title: Scripts, context and access
- letter: A
  title: AI layer
- letter: G
  title: AI safety guardrails
- letter: K
  title: Fast classifiers and decision specs
- letter: L
  title: Feedback and assurance
- letter: X
  title: Modularity
# Tombstones (homelabnext/registers/ids.py): ids this register once used with a meaning that
# collided with the checklist's.  They stay here so `register_ids.py check-lost` still finds them
# and nothing can reuse them by accident.
retired:
  F-01:
    replaced_by: Q-09
    reason: >-
      Was "the repository carries a licence file", which is not checklist F-01 (rebuildable
      from git). No checklist row is about the licence alone; it is the file every SPDX header
      points at, so the check now runs as part of Q-09.
  F-02:
    replaced_by: L-07
    reason: >-
      Was "every runbook step has a verify", which is checklist L-07, not F-02 (network
      segments are enforced).
  F-03:
    replaced_by: F-09
    reason: >-
      Was "the backup target accepted a write in the last day", which is part of checklist F-09
      (backups follow 3-2-1), not F-03 (SSO and MFA).
criteria:
- id: F-05
  statement: Secrets are not in git or readable on disk.
  evidence: auto
  observable: python3 tools/leak_scan.py --groups secret . && echo no secrets found
  expected: exit 0 (covers the tracked tree; history is `make leak-scan-history`, perms are server-side)
  expect_regex: no secrets found
  slow: true
  remediation: >-
    Remove the secret, rotate it (it is burned once committed), and load it from the environment
    or the secrets store instead; a key in git is readable by everyone who ever cloned it.
- id: F-09
  statement: Backups follow 3-2-1 with an immutable copy.
  evidence: server
  observable: >-
    query the backup system for the newest recovery point of each guest (< 24 h), the newest
    offsite or immutable copy (< 7 days), and attempt a delete with the automation identity
  remediation: Investigate the failing job; an unrecoverable backup is no backup.
- id: F-18
  statement: The public tree contains no private identifiers.
  evidence: auto
  observable: python3 tools/leak_scan.py . && echo tree clean
  expected: exit 0
  expect_regex: tree clean
  slow: true
  remediation: >-
    Replace the address, domain, e-mail or MAC with a documentation value (192.0.2.0/24,
    example.org); a published private identifier maps the lab for anyone who reads the repo.
- id: F-19
  statement: Every guest has a defense baseline.
  evidence: auto
  observable: >-
    python3 -c 'import yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m homelabnext.cli guests baselines examples/minimal/guests
    --site examples/minimal/site.yml --check
  expected: >-
    exit 0: the example lab has a baseline set and every guest (vm, lxc and host) names one or
    more baselines from it or carries a documented baseline.exemption; exit 1 when a guest has
    neither or there is no baseline set (nothing to check never reads as checked)
  expect_regex: 'baselines: ok'
  remediation: >-
    Give the guest `baseline.names` from _baselines.yml (or `baseline.exemption.reason` with a
    review date); a guest created without a decided set of defenses is the one nothing watches
    (docs/compute-model.md, ADR-0016).
- id: F-20
  statement: Every machine says what powers it.
  evidence: auto
  observable: >-
    python3 -c 'import yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m homelabnext.cli guests validate examples/lab-topology/guests
    --site examples/lab-topology/site.yml
  expected: >-
    exit 0: the example lab's site lists its UPSes, and its router, switch, edge devices,
    hypervisors and physical hosts each name a UPS of the site or `none` with a reason (or take
    power.default), and every UPS feeds something; exit 1 names the device or UPS that breaks it
  expect_regex: '^ok: '
  remediation: >-
    Give the device `power: {ups: <id>}` (or `{ups: none, reason: ...}`), fix the UPS id, or
    remove a UPS that feeds nothing; a machine whose power nobody wrote down is the one that
    surprises you in a power cut (docs/network-model.md, Power).
- id: D-02
  statement: Every rule is tested.
  evidence: auto
  observable: python3 -m homelabnext.detections lint && python3 -m homelabnext.detections run
  expected: exit 0
  expect_regex: "RESULT: ok"
  remediation: >-
    Add the missing must-fire and must-not-fire fixtures, or fix the rule the fixture runner
    names; an untested rule is a rule nobody knows still fires.
- id: D-07
  statement: Rules compile for every supported engine.
  evidence: auto
  observable: >-
    python3 -c 'import pytest' 2>/dev/null || exit 100;
    python3 -m pytest -q -p no:cacheprovider tests/detections/test_detections.py -k golden
  expected: exit 0 (exit 100 when pytest is not installed, which is could-not-measure)
  expect_regex: passed
  slow: true
  remediation: >-
    Fix the backend or rule that changed the compiled output, or, if the change is intended,
    refresh the goldens with UPDATE_GOLDEN=1 and review the diff.
- id: P-08
  statement: Work follows the board rules and links to strategy by uid.
  evidence: auto
  observable: python3 -m homelabnext.cli projects check --dir examples/projects --strategy examples/strategy
  expected: exit 0, with no problem in a non-empty directory (a missing one is exit 2)
  expect_regex: ' 0 problem\(s\) in [1-9][0-9]* item\(s\) of '
  remediation: >-
    Run `hnx projects check` and fix what it names: close a project whose steps are all
    finished, give a finished item its one-line result, re-point a link at an existing record or
    item (by uid). A broken rule here means the board can no longer be trusted as the work queue.
- id: Q-04
  statement: Every component ships tests.
  evidence: auto
  observable: python3 tools/component_tests.py && echo every component has tests
  expected: exit 0 (a component directory with no tests, or a stale allowlist entry, fails)
  expect_regex: every component has tests
  remediation: >-
    Add a test file for the component the gate names, or, for a genuine exception, an ALLOW entry
    in tools/component_tests.py with the reason; untested code is code nobody can change safely.
- id: Q-07
  statement: Security-critical code is well covered.
  evidence: auto
  observable: >-
    python3 -c 'import pytest_cov' 2>/dev/null || exit 100;
    python3 tools/coverage_floor.py && echo coverage floor held
  expected: exit 0 (exit 100 when pytest-cov is not installed, which is could-not-measure)
  expect_regex: coverage floor held
  slow: true
  remediation: >-
    Write tests for the unit the table shows below its floor (from its own test directory); a
    broker, scope guard or decision path nobody exercises is where a regression ships unseen.
- id: Q-09
  statement: Every source file carries an SPDX header.
  evidence: auto
  observable: test -s LICENSE && python3 tools/check_spdx.py && echo spdx headers present
  expected: exit 0 (also fails if the LICENSE file the headers point at is missing or empty)
  expect_regex: spdx headers present
  remediation: >-
    Add `SPDX-License-Identifier: Apache-2.0` in the first five lines of each file listed (and
    restore LICENSE if it is gone); without them nobody may legally reuse the work.
- id: Q-10
  statement: Every schema ships an example and a negative.
  evidence: auto
  observable: python3 tools/schema_check.py --strict
  expected: exit 0
  expect_regex: " 0 errors, 0 warnings"
  slow: true
  remediation: >-
    Add the missing example or negative under the schema's examples directory, or fix the
    schema; a schema with no negative has never been shown to reject anything.
- id: Q-11
  statement: Tests are hermetic.
  evidence: auto
  observable: python3 tools/hermetic_lint.py && echo no clock or randomness in tests
  expected: >-
    exit 0 (direct clock and randomness calls in test code, and library clock reads outside an
    injectable default or fallback; the network half is enforced while the tests run, by
    tests/network_guard.py)
  expect_regex: no clock or randomness in tests
  remediation: >-
    Inject the clock or a seeded random.Random into the code under test instead of reading them
    in the test; a test that depends on the time of day passes until the day it does not.
- id: M-01
  statement: Every script is catalogued.
  evidence: auto
  observable: >-
    python3 -c 'import yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m homelabnext.cli scripts catalog --check
  expected: >-
    exit 0: every script (docs/scripts.md) has a valid `# hnx-script:` header and
    docs/scripts/catalog.json and catalog.md are what the headers produce now
  expect_regex: "scripts catalog: current"
  remediation: >-
    Add or fix the header the check names, then run `hnx scripts catalog` and commit both files; a
    script nobody catalogued is a script nobody knows to maintain, schedule or retire.
- id: M-02
  statement: The catalog matches reality.
  evidence: auto
  observable: >-
    python3 -c 'import yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m homelabnext.cli scripts reality
  expected: >-
    exit 0: 0 scheduled or called but uncatalogued scripts, 0 uncalled active scripts, 0 duplicate
    ids, and every header's triggers are exactly the callers found in the tree
  expect_regex: catalog matches reality
  remediation: >-
    Make the header's trigger list match what the check found, catalogue the file a caller runs,
    or retire the uncalled script; a reviewed exception goes in tools/scripts.allow.yml with its
    reason. A catalog that drifts from what runs is how a check stops running without anyone noticing.
- id: M-04
  statement: Checks run in one place.
  evidence: auto
  observable: >-
    python3 -c 'import yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m homelabnext.cli scripts runner-lint
  expected: >-
    exit 0: every `kind: check` script is run by the invariants criteria its header names, and no
    timer, fleet unit or scheduled workflow runs a check directly
  expect_regex: every check runs through the invariants runner
  remediation: >-
    Add a criterion whose observable (or plugin) runs the check and schedule `hnx invariants run`
    instead of the script; a check on its own timer pages on its own terms and drops out of the
    one place that says whether everything holds.
- id: M-03
  statement: Helpers are shared, not copied.
  evidence: auto
  observable: >-
    python3 -c 'import yaml' 2>/dev/null || exit 100;
    python3 tools/shared_helpers_lint.py && python3 tools/dup_check.py && echo helpers shared
  expected: >-
    exit 0 (0 private notify, state or lake-query helpers outside the shared libraries, and 0
    copy-pasted clones or stale entries beyond tools/dup_check.baseline.json)
  expect_regex: helpers shared
  remediation: >-
    Call homelabnext.notify, homelabnext.state or homelabnext.lake instead of the private copy, or
    record a reviewed exception with its reason in tools/shared_helpers.allow.yml; for a new clone,
    move the copied code into one shared function (a stale baseline entry: `make dup-baseline`). A
    copied helper misses every fix the shared one gets.
- id: F-07
  statement: Internal TLS is verified.
  evidence: auto
  observable: >-
    python3 -c 'import yaml' 2>/dev/null || exit 100;
    python3 tools/tls_verify_lint.py && echo tls verification on
  expected: exit 0 (0 clients with certificate verification disabled; RL013 covers roles)
  expect_regex: tls verification on
  remediation: >-
    Trust the internal CA instead of turning verification off; a client that skips verification
    accepts any certificate, so anyone on the path can read and change its traffic.
- id: F-17
  statement: Nothing at runtime points at the workstation.
  evidence: auto
  observable: >-
    python3 -c 'import yaml' 2>/dev/null || exit 100;
    python3 tools/workstation_refs.py && echo no workstation references
  expected: exit 0 (0 runtime configs reference the admin workstation)
  expect_regex: no workstation references
  remediation: >-
    Point the config at a registry alias or a fleet host instead of the workstation; a runtime that
    depends on the admin workstation stops when the laptop does.
- id: Q-05
  statement: Every seam has a contract test.
  evidence: auto
  observable: >-
    python3 -c 'import yaml, jsonschema' 2>/dev/null || exit 100;
    python3 tools/contract_coverage.py && echo every seam contract-tested
  expected: exit 0 (every event type and shared table has a schema plus publisher and consumer tests)
  expect_regex: every seam contract-tested
  remediation: >-
    Add the missing publisher and consumer fixtures for the seam the gate names; a seam without a
    contract test can change shape on one side and break the other side silently.
- id: Q-08
  statement: Fixed bugs stay fixed.
  evidence: auto
  observable: >-
    git rev-parse HEAD >/dev/null 2>&1 || exit 100;
    b=$(git rev-list -1 --before='90 days ago' HEAD);
    python3 tools/fix_has_test.py --range "${b:+$b..}HEAD" && echo fixes carry tests
  expected: exit 0 (every bugfix in the last 90 days touches a test file; CI also proves it fails without the fix)
  expect_regex: fixes carry tests
  remediation: >-
    Add a regression test to the fix that fails on its parent commit (or a reviewed
    `No-regression-test:` trailer); a fix without one is how the same bug ships twice.
- id: M-17
  statement: Register ids are never lost.
  evidence: auto
  observable: >-
    IFS=$'\n'; f=$(git ls-files -- '*invariants.yml' '*/lessons/*.md' '*/runbooks/*.md'
    '*/objectives/*.md' '*/measures/*.md' '*/requirements/*.md' '*/rfis/*.md') || exit 100;
    [ -n "$f" ] || { echo no registers tracked; exit 100; };
    python3 tools/register_ids.py check-lost && echo no ids lost
  expected: >-
    exit 0: every record uid the last commit had is still a record, and every invariant id is
    still a live criterion or a `retired:` tombstone (exit 100 outside a git checkout)
  expect_regex: no ids lost
  remediation: >-
    Restore the record whole from `git show HEAD:<path>` (or MERGE_HEAD), with its <uid>.events/;
    a record that is wrong is retired through its lifecycle, never deleted. An invariant id that
    was wrong is retired under `retired:` with a reason instead.
- id: L-06
  statement: Every lesson has a root cause, control and verification.
  evidence: auto
  observable: >-
    d=$(mktemp -d) && python3 -m homelabnext.registers build examples/registers "$d" >/dev/null;
    rc=$?; rm -rf "$d"; [ $rc -eq 0 ] && echo lessons valid
  expected: exit 0
  expect_regex: lessons valid
  remediation: >-
    Fix the lesson the build names; a lesson with no root cause, control or falsifiable test is
    an opinion, and the fatal schema refuses to render it.
- id: L-07
  statement: Every runbook step has a verify.
  evidence: auto
  observable: >-
    d=$(mktemp -d) && python3 -m homelabnext.registers build examples/registers "$d" >/dev/null;
    rc=$?; rm -rf "$d"; [ $rc -eq 0 ] && echo steps verified
  expected: exit 0
  expect_regex: steps verified
  remediation: Add the missing verify; a step that cannot be checked is a hope, not a step.
- id: T-02
  statement: Events validate against the schema.
  evidence: auto
  observable: >-
    python3 -c 'import pytest, yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m pytest -q -p no:cacheprovider tests/events/test_events.py -k "validates or schema or negatives or invalid or non_object"
  expected: >-
    exit 0 with every selected test passed and none skipped (fixture events validate against the
    envelope and type schemas and negatives are refused); exit 100 when a test dependency is not
    installed, which is could-not-measure
  expect_regex: '\b\d+ passed(, \d+ deselected)?(, \d+ warnings?)? in '
  slow: true
  remediation: >-
    Fix the event builder or the schema the failing test names; an event that does not validate in
    CI is one consumers will misread in production.
- id: T-04
  statement: Events are enriched.
  evidence: auto
  observable: >-
    python3 -c 'import pytest, yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m pytest -q -p no:cacheprovider tests/events/test_enrich.py
  expected: >-
    exit 0 with every selected test passed and none skipped (the enrichment fixture adds asset
    owner and criticality; the coverage metric is right on a fake stream); exit 100 when a test
    dependency is not installed, which is could-not-measure
  expect_regex: '\b\d+ passed(, \d+ deselected)?(, \d+ warnings?)? in '
  slow: true
  remediation: >-
    Fix homelabnext/events/enrich.py (or the inventory it reads) until the fixture stream carries
    owner and criticality again; an alert with no owner or criticality is triaged blind.
- id: T-07
  statement: Event envelopes are contract-tested.
  evidence: auto
  observable: >-
    python3 -c 'import yaml, jsonschema' 2>/dev/null || exit 100;
    python3 tools/contract_coverage.py && echo every event type contract-tested
  expected: >-
    exit 0: every event type has an envelope schema plus passing publisher and consumer contract
    tests
  expect_regex: every event type contract-tested
  remediation: >-
    Add the publisher and consumer fixtures for the event type the gate names; an event type
    without a contract test can change shape on the publisher and break every consumer silently.
- id: S-06
  statement: Replaying a batch creates no duplicates.
  evidence: auto
  observable: >-
    python3 -c 'import pytest, pyiceberg, pyarrow' 2>/dev/null || exit 100;
    python3 -m pytest -q -p no:cacheprovider tests/lake/test_iceberg.py -k "replay or duplicate or checkpoint or converge"
  expected: >-
    exit 0 with every selected test passed and none skipped (the lake extras' Iceberg tables over
    a SQLite catalog); exit 100 when a test dependency is not installed, which is
    could-not-measure
  expect_regex: '\b\d+ passed(, \d+ deselected)?(, \d+ warnings?)? in '
  slow: true
  remediation: >-
    Fix the lake writer's content keys or batch ledger until a replay after a crash between commit
    and checkpoint adds no rows; a duplicate row double-counts every alert and metric built on it.
- id: S-07
  statement: Query results are engine-independent.
  evidence: auto
  observable: >-
    python3 -c 'import pytest, duckdb' 2>/dev/null || exit 100;
    python3 -m pytest -q -p no:cacheprovider tests/lake/test_parity.py
  expected: >-
    exit 0 with every selected test passed and none skipped (the fixed query set against DuckDB,
    the fake lake and the recorded cassette); exit 100 when a test dependency is not installed,
    which is could-not-measure
  expect_regex: '\b\d+ passed(, \d+ deselected)?(, \d+ warnings?)? in '
  slow: true
  remediation: >-
    Fix the engine adapter or the query the parity test names, or re-record the cassette if the
    change is intended (and review the diff); an engine-dependent answer means a lake swap
    silently changes results.
- id: D-04
  statement: Coverage counts only tested rules.
  evidence: auto
  observable: >-
    python3 -c 'import yaml' 2>/dev/null || exit 100;
    python3 -m homelabnext.detections coverage --check detections/attack_coverage.json
  expected: >-
    exit 0: the committed ATT&CK coverage report is the one the passing fixtures produce now
  expect_regex: ATT&CK coverage report current
  remediation: >-
    Run `python -m homelabnext.detections coverage --out detections/attack_coverage.json` and
    commit it, or fix the fixture that stopped passing; coverage that counts an untested rule
    claims detection nobody has shown works.
- id: D-06
  statement: Evasion variants are reported.
  evidence: auto
  observable: >-
    python3 -c 'import pytest, yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m pytest -q -p no:cacheprovider tests/detections/test_detections.py -k "evasion"
  expected: >-
    exit 0 with every selected test passed and none skipped (the fixture runner lists every
    evasion fixture as caught or missed and a miss does not fail the rule); exit 100 when a test
    dependency is not installed, which is could-not-measure
  expect_regex: '\b\d+ passed(, \d+ deselected)?(, \d+ warnings?)? in '
  slow: true
  remediation: >-
    Restore the runner's evasion report (each evasion fixture listed as caught or missed, a miss
    never failing the rule); a hidden evasion gap is a blind spot nobody knows to close.
- id: O-08
  statement: Notifications are state-diffed.
  evidence: auto
  observable: >-
    python3 -c 'import pytest, yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m pytest -q -p no:cacheprovider tests/notify/test_notify.py -k "same_problem or state_change or recovery or ok_without or new_problem_after"
  expected: >-
    exit 0 with every selected test passed and none skipped (the fake sender sees one send for a
    repeated state and one for a recovery); exit 100 when a test dependency is not installed,
    which is could-not-measure
  expect_regex: '\b\d+ passed(, \d+ deselected)?(, \d+ warnings?)? in '
  slow: true
  remediation: >-
    Fix homelabnext.notify's state diff so a standing state stays quiet and a recovery sends
    exactly once; a notifier that repeats itself trains everyone to mute it.
- id: P-02
  statement: Default deny.
  evidence: auto
  observable: >-
    python3 -c 'import pytest, yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m pytest -q -p no:cacheprovider tests/broker/test_broker.py -k "decision_table or default_deny or only_explicit_allows"
  expected: >-
    exit 0 with every selected test passed and none skipped (the broker decision table and the
    default-deny manifest tests); exit 100 when a test dependency is not installed, which is
    could-not-measure
  expect_regex: '\b\d+ passed(, \d+ deselected)?(, \d+ warnings?)? in '
  slow: true
  remediation: >-
    Fix the broker decision or the manifest the table test names so an unlisted intent is denied;
    anything not explicitly allowed must be refused.
- id: P-03
  statement: Approvals are bound and attributable.
  evidence: auto
  observable: >-
    python3 -c 'import pytest, yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m pytest -q -p no:cacheprovider tests/broker/test_broker.py -k "decision_table or digest or approv"
  expected: >-
    exit 0 with every selected test passed and none skipped (the decision table's approval cases,
    including a request altered after approval); exit 100 when a test dependency is not installed,
    which is could-not-measure
  expect_regex: '\b\d+ passed(, \d+ deselected)?(, \d+ warnings?)? in '
  slow: true
  remediation: >-
    Fix the approval binding the table names (approver identity, request digest, expiry, single
    use); an approval that survives a changed request approves something nobody saw.
- id: P-07
  statement: Broker isolation holds.
  evidence: auto
  observable: >-
    python3 -c 'import pytest, yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m pytest -q -p no:cacheprovider tests/broker/test_broker.py -k "access"
  expected: >-
    exit 0 with every selected test passed and none skipped (the `access_cases` table test); exit
    100 when a test dependency is not installed, which is could-not-measure
  expect_regex: '\b\d+ passed(, \d+ deselected)?(, \d+ warnings?)? in '
  slow: true
  remediation: >-
    Fix the broker's request ownership check so a foreign read or cancel is refused and audited;
    one caller seeing another's request breaks the isolation every grant assumes.
- id: R-01
  statement: Workflows are code.
  evidence: auto
  observable: >-
    python3 -c 'import yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m homelabnext.cli workflows validate
  expected: >-
    exit 0: every pack in git validates offline and the deploy pins match the validated pack
    digests
  expect_regex: 'workflows validate: [1-9]\d* pack\(s\), 0 problem\(s\)'
  remediation: >-
    Fix the pack or refresh the deploy pin the validator names; a pack deployed from anything but
    a validated commit is unreviewed automation.
- id: R-03
  statement: Deterministic steps come first.
  evidence: auto
  observable: >-
    python3 -c 'import yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m homelabnext.cli workflows validate
  expected: >-
    exit 0 (validator rules `deterministic-first` and `model-input`)
  expect_regex: 'workflows validate: [1-9]\d* pack\(s\), 0 problem\(s\)'
  remediation: >-
    Move the deterministic enrichment before the model step the validator names; a model that sees
    raw, unenriched input guesses what a lookup would have told it.
- id: R-04
  statement: Risky actions need bound approval.
  evidence: auto
  observable: >-
    python3 -c 'import yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m homelabnext.cli workflows validate
  expected: >-
    exit 0 (validator rule `approval-binding`; the BrokerExecutor table test runs in `make test`)
  expect_regex: 'workflows validate: [1-9]\d* pack\(s\), 0 problem\(s\)'
  remediation: >-
    Bind the risky action to an approval of its payload digest in the pack; a risky action that
    runs on an unbound approval runs whatever the payload became.
- id: R-07
  statement: Workflow fixtures round-trip.
  evidence: auto
  observable: >-
    python3 -c 'import yaml, jsonschema' 2>/dev/null || exit 100;
    python3 -m homelabnext.cli workflows validate
  expected: >-
    exit 0: every pack's fixture events produce exactly the expected action calls offline
  expect_regex: 'workflows validate: [1-9]\d* pack\(s\), 0 problem\(s\)'
  remediation: >-
