# Fictional lessons for the example lab. Authors write `LL-NEW`; tools/register_ids.py allocates.
lessons:
- id: LL-001
  title: Certificate expired on the internal reverse proxy
  date: 2026-01-12
  systems: [proxy, tls]
  recurrences: 1
  status: controlled
  symptom: >
    Every web UI behind the proxy showed a browser certificate warning at 06:10 UTC. Monitoring
    reported the proxy as up because it only checked the TCP port.
  contributing_factor: >
    The renewal timer ran, but renewal failed silently because the DNS challenge credential had
    been rotated and the renewal job logged the error without a non-zero exit.
  root_cause: >
    Nothing measured certificate lifetime from the client side, so a failed renewal was
    indistinguishable from a successful one until expiry.
  preventive_control: >
    A daily check connects to every listener over TLS and fails when the certificate has fewer
    than 14 days left; the result pages through the invariants runner.
  verification:
    observable: openssl s_client -connect proxy.lab.example:443 -servername proxy.lab.example | openssl x509 -noout -checkend 1209600
    expected: exit 0 (certificate valid for at least 14 more days)
- id: LL-002
  title: Two authors took the same lesson number
  date: 2026-02-03
  systems: [registers, git]
  recurrences: 3
  status: partial
  symptom: Two merge requests each added `LL-040`; the second merge needed a hand renumber.
  contributing_factor: Authors read the file to find "the next free id" and appended an entry.
  root_cause: >
    Id allocation was a read-then-write on shared state with no lock, so concurrent authors were
    guaranteed to collide eventually.
  preventive_control: >
    Authors write `LL-NEW`; a commit hook allocates the number under a host-wide lock, and a
    second hook fails the commit when an id present in a parent commit has vanished.
  verification:
    observable: python3 tools/register_ids.py check-lost examples/registers/lessons.yml
    expected: exit 0; exit 1 naming the id when an entry is dropped
- id: LL-003
  title: Backup job silently skipped a new guest
  date: 2026-03-20
  systems: [backup]
  recurrences: 0
  status: open
  symptom: A guest created in March had no recovery point for five weeks.
  contributing_factor: Backup jobs list guests by hand and nobody added the new one.
  root_cause: >
    The set of guests that exist and the set that are backed up are maintained in two places
    with no comparison between them.
  open_reason: >
    The comparison needs the hypervisor API, which is not reachable from the example lab yet.
  verification:
    observable: compare guest inventory against backup job membership
    expected: empty difference
