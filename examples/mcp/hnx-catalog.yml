# MCP catalog record (schemas/platform/mcp_server.schema.json, docs/mcp-catalog.md). Fictional,
# like every example: the package, image and hash values name nothing real.
id: hnx-catalog
description: 'Read-only structured answers from this repository: capability contracts, schemas, the registry, the
  knowledge graph, context in levels (summaries, outlines, sections), lessons due, terms, invariants (hnx mcp serve, docs/mcp.md).'
owner: platform-team
status: active
origin:
  kind: first-party
  path: homelabnext/mcp/
transport:
  type: stdio
  bin: hnx
  entry: mcp-serve
  args: [--scope-from-profile, '{profile_file}', --policy, /etc/hnx/policy/ceilings.yml, --lock, /etc/hnx/policy/profiles.lock.yml]
runtime: agent-local
egress: none
data_tier: cloud-allowed
implements: ['cap:context']
tools:
- {name: context_for, classes: [read], approval: false}
- {name: find_services, classes: [read], approval: false}
- {name: get_contract, classes: [read], approval: false}
- {name: get_schema, classes: [read], approval: false}
- {name: invariants_status, classes: [read], approval: false}
- {name: lessons_due, classes: [read], approval: false}
- {name: list_capabilities, classes: [read], approval: false}
- {name: outline, classes: [read], approval: false}
- {name: related, classes: [read], approval: false}
- {name: section, classes: [read], approval: false}
- {name: terms, classes: [read], approval: false}
author: agent:example-builder
reviews:
- {by: 'agent:example-checker', kind: agent, role: check, date: '2026-10-25', verdict: pass, digest: 'sha256:9153bf7fdb9b'}
- {by: 'agent:example-auditor', kind: agent, role: audit, date: '2026-10-25', verdict: pass, digest: 'sha256:9153bf7fdb9b'}
- {by: 'human:example-operator', kind: human, role: approve, date: '2026-10-25', verdict: pass, digest: 'sha256:9153bf7fdb9b'}
