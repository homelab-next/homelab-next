# generated by hnx mcp catalog render from the MCP catalog (mcp/, sha256:206c239be949) for home fallback; do not edit, render again
mcp_servers:
  hnx-broker:
    args:
    - broker
    - mcp
    - --socket
    - /run/hnx-broker/broker.sock
    command: hnx
  hnx-catalog:
    args:
    - mcp
    - serve
    - --scope-from-profile
    - /etc/hnx/profiles/broker-agent.json
    - --policy
    - /etc/hnx/policy/ceilings.yml
    - --lock
    - /etc/hnx/policy/profiles.lock.yml
    command: hnx
  notes-broker-agent-real:
    args:
    - --no-config
    - --from
    - example-notes-mcp==1.2.0
    - notes-mcp
    command: uvx
    env:
      NOTES_MODE: write
      NOTES_ROOT: notes/
      NOTES_TOKEN: ${HNX_SECRET_MCP_NOTES_TOKEN}
      NOTES_WRITABLE_PREFIX: agents/broker-agent/
    timeout: 120
  notes-broker-agent-shadow:
    args:
    - --no-config
    - --from
    - example-notes-mcp==1.2.0
    - notes-mcp
    command: uvx
    env:
      NOTES_MODE: read
      NOTES_ROOT: notes/
      NOTES_TOKEN: ${HNX_SECRET_MCP_NOTES_TOKEN}
      NOTES_WRITABLE_PREFIX: agents/broker-agent/
    timeout: 120
  notes-collector-real:
    args:
    - --no-config
    - --from
    - example-notes-mcp==1.2.0
    - notes-mcp
    command: uvx
    env:
      NOTES_MODE: write
      NOTES_ROOT: notes/
      NOTES_TOKEN: ${HNX_SECRET_MCP_NOTES_TOKEN}
      NOTES_WRITABLE_PREFIX: agents/collector/inbox/
    timeout: 120
  notes-collector-shadow:
    args:
    - --no-config
    - --from
    - example-notes-mcp==1.2.0
    - notes-mcp
    command: uvx
    env:
      NOTES_MODE: read
      NOTES_ROOT: notes/
      NOTES_TOKEN: ${HNX_SECRET_MCP_NOTES_TOKEN}
      NOTES_WRITABLE_PREFIX: agents/collector/inbox/
    timeout: 120
  records:
    args:
    - --no-config
    - --from
    - example-records-mcp==2.3.1
    - records-mcp
    command: uvx
    env:
      RECORDS_TOKEN: ${HNX_SECRET_MCP_RECORDS_TOKEN}
