    - records-mcp
    command: uvx
    env:
      RECORDS_TOKEN: ${HNX_SECRET_MCP_RECORDS_TOKEN}
  web:
    args:
    - -y
    - --prefix=/var/lib/hnx/npm-prefix
    - --package=@example/mcp-web@1.1.0
    - --
    - mcp-web
    command: npx
