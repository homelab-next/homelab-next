# generated by hnx mcp catalog render from the MCP catalog (mcp/, sha256:f1d798013018) for orchestrator; do not edit, render again
kinds:
  browser:
    args:
    - -y
    - --prefix=/var/lib/hnx/npm-prefix
    - --package=@example/mcp-browser@1.1.0
    - --
    - mcp-browser
    command: npx
  cases:
    args:
    - --no-config
    - --from
    - example-cases-mcp==1.0.4
    - cases-mcp
    command: uvx
    env:
      CASES_TOKEN: ${HNX_SECRET_MCP_CASES_TOKEN}
  fetch:
    args:
    - -y
    - --prefix=/var/lib/hnx/npm-prefix
    - --package=@example/mcp-fetch@1.1.0
    - --
    - mcp-fetch
    command: npx
  hnx-broker:
    args:
    - broker
    - mcp
    - --socket
    - /run/hnx-broker/broker.sock
    command: hnx
  hnx-codemode:
    args:
    - codemode
    - mcp
    - --index
    - /etc/hnx/codemode
    - --socket
    - /run/hnx-broker/broker.sock
    command: hnx
  notes:
    allowed_env:
    - NOTES_MODE
    - NOTES_WRITABLE_PREFIX
    allowed_values:
      NOTES_MODE:
      - read
      - write
    args:
    - --no-config
    - --from
    - example-notes-mcp==1.2.0
    - notes-mcp
    command: uvx
    env:
      NOTES_ROOT: notes/
      NOTES_TOKEN: ${HNX_SECRET_MCP_NOTES_TOKEN}
    profile_scope:
      root_key: NOTES_ROOT
      scope_roots:
      - notes/
      writable:
      - NOTES_WRITABLE_PREFIX
