# SPDX-License-Identifier: Apache-2.0
# A fictional orchestrator profile (schemas/platform/orchestrator_profile.schema.json): its own
# fields are the orchestrator's; the grants: block at the end is rendered from the MCP catalog
# (examples/mcp/clients/orchestrator.yml).
id: collector-v1
agent_key: collector
default_task_description: Collect the day's new notes into the inbox.

# Per-job MCP grants (ADR-022). Generated by hnx mcp catalog render --client orchestrator
# from the homelab-next MCP catalog and this profile's grants; edit those, never this block.
grants:
  real:
  - name: notes-collector-real
    kind: notes
    env:
      NOTES_MODE: write
      NOTES_WRITABLE_PREFIX: agents/collector/inbox/
  - name: records
    kind: records
  shadow:
  - name: notes-collector-shadow
    kind: notes
    env:
      NOTES_MODE: read
      NOTES_WRITABLE_PREFIX: agents/collector/inbox/
  - name: records
    kind: records
