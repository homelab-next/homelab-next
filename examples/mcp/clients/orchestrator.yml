# SPDX-License-Identifier: Apache-2.0
# Render spec: the orchestrator's catalog of kinds (one per catalog stdio server) and the grants:
# block of each profile file, spliced in place (everything from the block's marker comment to the
# end of the file). orchestrator/internal/grants loads both in place (its tests). Fictional, like
# every example.
client: orchestrator
catalog: ..
policy: policy/ceilings.yml          # the ceilings its profiles are judged against
npm_prefix: /var/lib/hnx/npm-prefix # an empty directory every npx launch reads its config from
lanes: [real, shadow]
profiles:
  - file: profile.collector.json
    grants_file: orchestrator/profiles/collector.yaml
    params:
      notes: {writable: agents/collector/inbox/}
      notes@shadow: {mode: read, writable: agents/collector/inbox-shadow/}
owns: [orchestrator/*.yaml, orchestrator/profiles/*.yaml]
# every orchestrator profile with a grants: block must accept the rendered catalog, rendered here
# or not (its controller refuses to start otherwise): read here as strict YAML, judged by the
# controller's loader
check_profiles: orchestrator/profiles/*.yaml
outputs:
  - {path: orchestrator/mcp_catalog.yaml}
