# SPDX-License-Identifier: Apache-2.0
id: guest:idp-1
description: "Single sign-on and forward-auth identity for every web front end."
kind: lxc
provisioning: terraform
placement: {node: main-1, vmid: 107}
resources:
  cpu: {cores: 2}
  memory: {size_mb: 2048}
  disks: [{name: rootfs, size_gb: 16, pool: fast}]
image: {logical: debian-12-standard, kind: tarball, os_type: debian}
network: {zone: mgmt, ip: 192.0.2.7}
firewall_rules:
  inbound_allow:
    - {name: ssh, proto: tcp, ports: "22", source: "zone:mgmt"}
    - {name: sso-mgmt, proto: tcp, ports: "9443", source: "zone:mgmt"}
    - {name: sso-services, proto: tcp, ports: "9443", source: "zone:services"}
    - {name: sso-edge, proto: tcp, ports: "9443", source: "zone:edge"}
capability: cap:idp
tags: [prod]
owners: {primary: platform-team}
