# SPDX-License-Identifier: Apache-2.0
id: guest:hub-1
description: "The read-only status hub."
kind: lxc
provisioning: terraform
placement: {node: main-1, vmid: 125}
resources:
  cpu: {cores: 2}
  memory: {size_mb: 2048}
  disks: [{name: rootfs, size_gb: 16, pool: fast}]
image: {logical: debian-12-standard, kind: tarball, os_type: debian}
network: {zone: services, ip: 192.0.2.75}
firewall_rules:
  inbound_allow:
    - {name: ssh, proto: tcp, ports: "22", source: "zone:mgmt"}
    - {name: hub, proto: tcp, ports: "8090", source: "zone:mgmt"}
    - {name: hub-proxy, proto: tcp, ports: "8090", source: "198.51.100.10/32"}
capability: cap:records
capability_groups: [cap_monitoring]
tags: [prod]
owners: {primary: platform-team}
