placement: {node: sensor-1}
network: {zone: services, ip: 192.0.2.71}
capability: cap:detections
capability_groups: [cap_sensor, cap_siem]
power: {ups: ups-a}
tags: [prod, sensor]
owners: {primary: platform-team}
