# SPDX-License-Identifier: Apache-2.0
#
# The status hub shell (ADR-0013, docs/status.md): a main page and a left menu. Each entry is a
# built-in panel over a selection of the registered status sources (`hnx status sources` is the
# menu of what exists) or an external link to a registry service. Schema:
# schemas/status/views.schema.json. Fictional, like every example.
views_version: 1

shell:
  title: Northwind status
  main: overview

menu:
  - id: overview
    title: Overview
    panel: exceptions
  - id: modules
    title: All modules
    panel: grid
  - id: governance
    title: Proposals and approvals
    panel: grid
    select: {sources: [proposals, approvals]}
  - id: fleet
    title: Invariants and alerts
    panel: grid
    select: {sources: [invariants, metrics-alerts]}
  - id: sources
    title: Sources
    panel: sources
  # agent activity (stage 1b, optional: listed as unavailable without --agents)
  - id: agents
    title: Agents
    panel: agents
  - id: activity
    title: Activity
    panel: activity
  - id: agent-analytics
    title: Agent analytics
    panel: agent-analytics
  # strategy to task (docs/strategy.md; listed as unavailable without --strategy)
  - id: strategy
    title: Strategy
    panel: strategy
  - id: requirements
    title: Requirements
    panel: requirements
  - id: objectives
    title: Objectives
    panel: objectives
  - id: rfis
    title: RFIs
    panel: rfis
  # guest baselines (docs/compute-model.md; listed as unavailable without --guests)
  - id: baselines
    title: Baselines
    panel: baselines
  - id: grafana
    title: Grafana
    external: {service: dashboards}
  - id: agentmetry
    title: Agentmetry
    external: {service: agentmetry, optional: true}
  # rendered only for a request through the trusted front door (docs/status.md)
  - id: agent-detail
    title: Session detail
    panel: agent-detail
    group: private
  - id: access-log
    title: Access log
    panel: agent-access-log
    group: private
  # the broker Approvals page (ADR-0017 stage 2b; listed only when agents.yml has approvals:)
  - id: approvals
    title: Approvals
    panel: approvals
    group: private
