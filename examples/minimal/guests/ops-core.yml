# SPDX-License-Identifier: Apache-2.0
# The lab's operations guest: the internal assessment scanner (cap_scanner) and the backup host
# where restore drills run (cap_backup), the product hosts of two central baseline controls.
id: guest:ops-core
kind: vm
provisioning: terraform
placement: {node: hv-a, vmid: 181, vmid_scheme: freeform}
resources:
  cpu: {cores: 4}
  memory: {size_mb: 8192, balloon_min_mb: 4096}
  disks: [{name: rootfs, size_gb: 64, pool: fast, format: qcow2}]
image: {logical: debian-12-cloudinit, kind: template-clone, os_type: linux-6}
cloudinit: {user: ansible, ssh_authorized_keys: [operator]}
network: {zone: mgmt, ip: 192.0.2.20, vlan_tag_mode: per_vlan_bridge}
firewall_rules:
  inbound_allow:
    - {name: ssh-mgmt, proto: tcp, ports: "22", source: "zone:mgmt"}
capability: cap:orchestration
capability_groups: [cap_scanner, cap_backup]
tags: [prod]
backup: {policy: daily}
owners: {primary: platform-team}
baseline: {names: [server]}
