# SPDX-License-Identifier: Apache-2.0
id: guest:hv-a
kind: host
provisioning: host-only
placement: {node: hv-a}
network: {zone: mgmt, ip: 192.0.2.10}
capability: cap:events
tags: [prod, hypervisor]
owners: {primary: platform-team}
baseline:
  names: [server]
  remove:
    - {control: backup-verify, reason: "A hypervisor is rebuilt from its configuration, not restored from a backup."}
    - {control: host-firewall, reason: "The hypervisor's own firewall (pve-firewall) filters it; a second ruleset beside it is refused."}
