# Review policy (homelabnext/reviews.py): per artefact kind and state, the reviews it must carry,
# each one current with the artefact's content digest (`hnx reviews digest FILE`) and verdict pass.
# Every state is listed (an empty list means none needed); an unknown kind or state is fatal.
# The identities below are the example lab's fictional reviewers, like everything in examples/.
version: 1
reviewers:
  # a human review counts only from a `kind: human` entry here (fail closed, like broker
  # approvers); an `agent:` identity is an agent with or without an entry
  - {issuer: human, subject: example-operator, kind: human}
  - {issuer: agent, subject: example-checker, kind: agent}
  - {issuer: agent, subject: example-auditor, kind: agent}
requirements:
  lesson.pitfall:
    open: []        # recording a problem is never blocked
    partial: []
    controlled:     # "it is under control" is a claim: an agent checks it, another audits it
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
    retired:        # graduating into a mechanism also needs a human approve
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
  lesson.practice:
    active:
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
    incorporated:
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
    superseded:
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
    retired:
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
  runbook:
    active:
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
    superseded: []
  system-page:
    draft: []
    reviewed:       # and no TODO(human) left in its blocks
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
  # the strategy-to-task records (docs/strategy.md): the strategy itself is the owner's to sign
  strategy:
    active:
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
  objective:
    active:
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
    achieved:       # "we got there" is a claim about effect: a human signs it
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
    retired:
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
  measure:
    active:         # the seven doctrine fields are checked, and audited
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
    retired:
      - {role: check, kind: agent}
  requirement:
    active:
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
    answered:
      - {role: check, kind: agent}
    expired: []     # the LTIOV sweep: time decided it
    retired:
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
  rfi:              # an RFI is a question: raising and closing one is never blocked
    open: []
    answered: []
    expired: []
    no-find: []
  # the MCP catalog (docs/mcp-catalog.md): a server is code that runs with an agent's grants, so
  # making it grantable is a supply-chain decision a human approves after the agents' review
  mcp-server:
    draft: []       # imported or new: not grantable, never blocked
    active:
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
    deprecated: []  # still grantable while profiles move off it
    retired: []     # not grantable
  # fetched modules (docs/modules.md, "Supply chain"): reviews live in the overlay's
  # lab/modules.lock, keyed by the module's tree digest (`hnx reviews digest <module dir>`). A
  # module is code that runs as root on its hosts, so every kind is a human's to approve
  module-provider:
    locked:         # fills a slot: the core runs its adapter
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
  module-feature:
    locked:         # credentials, data grants and egress come with it
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
  module-core:
    locked:         # always installed: staff agents and the core's own consumers
      - {role: check, kind: agent}
      - {role: audit, kind: agent}
      - {role: approve, kind: human}
