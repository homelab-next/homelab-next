# SPDX-License-Identifier: Apache-2.0
#
# Synthetic example lab for HomelabNext. Everything here is fictional:
# addresses come from the RFC 5737 documentation ranges, names live under
# example.internal / lab.example. Every generator renders from this file.
registry_version: 1

lab:
  name: northwind
  domain: example.internal
  svc_label: svc
  owner: platform-team

zones:
  mgmt:
    cidr: 192.0.2.0/24
    description: management and shared infrastructure services
  data:
    cidr: 198.51.100.0/25
    description: storage, catalog, query and bus
  compute:
    cidr: 198.51.100.128/25
    description: inference and agent runtime
  edge:
    cidr: 203.0.113.0/24
    description: reverse proxy and public entry

hosts:
  dns-core:     {address: 192.0.2.5,       zone: mgmt,    role: resolver}
  mon-core:     {address: 192.0.2.20,      zone: mgmt,    role: monitoring}
  idp-core:     {address: 192.0.2.30,      zone: mgmt,    role: identity}
  secrets-core: {address: 192.0.2.31,      zone: mgmt,    role: secrets}
  lake-core:    {address: 198.51.100.40,   zone: data,    role: lake}
  bus-core:     {address: 198.51.100.50,   zone: data,    role: events}
  infer-core:   {address: 198.51.100.130,  zone: compute, role: inference}
  runtime-core:   {address: 198.51.100.140,  zone: compute, role: agent-runtime}
  edge-core:    {address: 203.0.113.10,    zone: edge,    role: edge}

services:
  dns:
    capability: dns
    impl: technitium
    host: dns-core
    protocol: dns
    port: 53
    health: {kind: none}
    clients: [mgmt, data, compute, edge]
    owner: platform-team
    version: "13.0"
    tls: none
    tags: [core]

  edge-proxy:
    capability: edge-proxy
    impl: caddy
    host: edge-core
    protocol: https
    port: 443
    health: {kind: tcp}
    upstreams: [dashboards, idp, status-hub]
    owner: platform-team
    version: "2.8.4"
    tls: public
    tags: [core, edge]

  idp:
    capability: idp
    impl: authentik
    host: idp-core
    protocol: https
    port: 9443
    health: {kind: http, path: /-/health/live/, expect_status: 204}
    clients: [edge, data, compute]
    owner: identity-team
    version: "2024.8"
    tls: internal
    auth: own
    public_hostname: login.lab.example
    backup_job: daily-core
    tags: [core, identity]

  secrets:
    capability: secrets
    impl: openbao
    host: secrets-core
    protocol: https
    port: 8200
    health: {kind: http, path: /v1/sys/health, expect_status: 200}
    clients: [data, compute]
    owner: identity-team
    version: "2.1.0"
    tls: mtls
    backup_job: daily-core
    tags: [core, secrets]

  object-store:
    capability: object-store
    impl: minio
    host: lake-core
    protocol: https
    port: 9000
    health: {kind: http, path: /minio/health/live, expect_status: 200}
    metrics: {path: /minio/v2/metrics/cluster}
    upstreams: [secrets]
    owner: data-team
    version: "2024.9"
    tls: internal
    backup_job: weekly-lake
    tags: [data, storage]

  lake-catalog:
    capability: lake-catalog
    impl: lakekeeper
    host: lake-core
    protocol: https
    port: 8181
    health: {kind: http, path: /health, expect_status: 200}
    metrics: {path: /metrics}
    upstreams: [object-store, idp, records-db]
    owner: data-team
    version: "0.5.2"
    tls: internal
    backup_job: daily-core
    tags: [data, catalog]

  lake-query:
    capability: lake-query
    impl: trino
    host: lake-core
    protocol: https
    port: 8443
    health: {kind: http, path: /v1/info, expect_status: 200, interval_s: 30}
    metrics: {path: /metrics, port: 9091}
    upstreams: [lake-catalog, object-store, idp]
    owner: data-team
    version: "450.0"
    tls: internal
    auth: idp
    mcp: {name: lake_query, transport: http, path: /mcp}
    tags: [data, query]

  records-db:
    capability: records-db
    impl: postgresql
    host: lake-core
    protocol: postgres
    port: 5432
    health: {kind: tcp}
    owner: data-team
    version: "16.4"
    tls: internal
    backup_job: daily-core
    tags: [data, database]
    status_sources:
      - id: proposals
        kind: poll-file
        target: {file: examples/status/records}
        interval_s: 300
        timeout_s: 10
        mapping: {builtin: records-lanes, warn_after_s: 604800}
        what: The proposal lanes - notes in the inbox and approved but not completed, with the oldest age.
      - id: approvals
        kind: poll-file
        target: {file: examples/status/broker-pending.json}
        interval_s: 300
        timeout_s: 10
        mapping: {builtin: broker-pending, warn_after_s: 3600}
        what: Broker requests waiting for an approval, with the oldest age (optional - only with a broker).

  events:
    capability: events
    impl: nats
    host: bus-core
    protocol: nats
    port: 4222
    health: {kind: tcp}
    metrics: {path: /metrics, port: 7777}
    clients: [compute]
    owner: data-team
    version: "2.10.20"
    tls: mtls
    tags: [data, bus]

  inference:
    capability: inference
    impl: vllm
    host: infer-core
    protocol: http
    port: 8000
    health: {kind: http, path: /health, expect_status: 200}
    metrics: {path: /metrics}
    owner: ml-team
    version: "0.6.1"
    tls: none
    tags: [compute, inference]

  agent-runtime:
    capability: agent-runtime
    impl: orchestrator
    host: runtime-core
    protocol: http
    port: 8088
    health: {kind: http, path: /healthz, expect_status: 200}
    metrics: {path: /metrics}
    upstreams: [lake-query, inference, notify, events, secrets]
    owner: ml-team
    version: "0.3.0"
    tls: none
    mcp: {name: agent_runtime, transport: sse, path: /sse}
    tags: [compute, agents]
    status_sources:
      # the LLM orchestrator's own queue summary (GET /admin/queue-summary); it has no other
      # health endpoint, so a failed poll is the reading (on_error: fail)
      - id: orchestrator-queues
        kind: poll-http-json
        target: {path: /admin/queue-summary}
        interval_s: 60
        timeout_s: 5
        on_error: fail
        mapping: {builtin: orchestrator-queue, warn_after_s: 3600}
        what: Queued and running orchestrator jobs; the oldest queued job waiting over an hour is warn.
      - id: orchestrator-runs
        kind: push-event
        interval_s: 300
        what: Run outcomes the orchestrator publishes itself as status.observed events.

  notify:
    capability: notify
    impl: ntfy
    host: mon-core
    protocol: http
    port: 8080
    health: {kind: http, path: /v1/health, expect_status: 200}
    clients: [data, compute]
    owner: platform-team
    version: "2.11"
    tls: none
    tags: [ops, notify]
    status_sources:
      - id: notify-health
        kind: poll-http-json
        target: {path: /v1/health}
        interval_s: 60
        timeout_s: 5
        on_error: fail
        mapping:
          state: healthy
          states: {"true": ok, "false": fail}
        what: Whether the notification service answers its own health endpoint.

  metrics:
    capability: metrics
    impl: prometheus
    host: mon-core
    protocol: http
    port: 9090
    health: {kind: http, path: /-/healthy, expect_status: 200}
    metrics: {path: /metrics}
    upstreams: [notify]
    owner: platform-team
    version: "2.54.1"
    tls: none
    tags: [ops, monitoring]
    status_sources:
      - id: metrics-alerts
        kind: poll-prometheus
        target: {path: /api/v1/alerts}
        interval_s: 60
        timeout_s: 10
        mapping: {builtin: prometheus-alerts, item: instance}
        what: Every firing alert of the metrics service, fail or warn by its severity label; resolved alerts drop out.
      - id: metrics-targets
        kind: poll-prometheus
        target: {path: /api/v1/query}
        interval_s: 60
        timeout_s: 10
        mapping:
          query: up
          item: job
          thresholds: {fail: 0, direction: below}
          empty: fail
        what: Whether each scrape job's targets answer (up is 1); a job whose target is down is fail.
      - id: invariants
        kind: poll-file
        target: {file: examples/registers/invariants.results.json}
        interval_s: 3600
        stale_after_s: 10800
        timeout_s: 10
        mapping: {builtin: invariants-results, module: invariants}
        what: The last invariants run, one item per criterion (pass is ok, fail is fail, error is unknown).

  uptime:
    capability: uptime
    impl: uptime-kuma
    host: mon-core
    protocol: http
    port: 3001
    health: {kind: http, path: /api/entry-page, expect_status: 200}
    owner: platform-team
    version: "1.23.16"
    tls: none
    tags: [ops, monitoring]
    status_sources:
      - id: uptime-monitors
        kind: poll-uptime-kuma
        target: {path: /api/status-page/lab}
        interval_s: 60
        timeout_s: 10
        what: Every monitor on the uptime service's public status page (no login); down is fail, pending is warn.

  automation:
    capability: automation
    impl: stackstorm
    host: runtime-core
    protocol: https
    port: 443
    health: {kind: tcp}
    owner: platform-team
    version: "3.8.1"
    tls: internal
    tags: [ops, automation]
    status_sources:
      - id: automation-executions
        kind: poll-stackstorm
        target: {path: /api/v1/executions}
        interval_s: 120
        timeout_s: 15
        auth: {secret: "secret:stackstorm/status-token", header: St2-Api-Key}
        mapping: {window_s: 3600, limit: 100}
        what: Actions with failed or timed-out executions in the last hour (fail) and the running executions.

  dataflow:
    capability: dataflow
    impl: nifi
    host: lake-core
    protocol: https
    port: 9443
    health: {kind: tcp}
    owner: data-team
    version: "2.0.0"
    tls: internal
    tags: [data, dataflow]
    status_sources:
      - id: dataflow-status
        kind: poll-nifi
        target: {path: /nifi-api/flow/status}
        interval_s: 60
        timeout_s: 10
        auth: {secret: "secret:nifi/status-token"}
        mapping:
          thresholds: {warn: 10000, fail: 100000}
        what: Queued flowfiles, invalid and stopped components, and error or warning bulletins of the dataflow service.

  agentmetry:
    capability: agent-audit
    impl: agentmetry
    host: mon-core
    protocol: http
    port: 8000
    health: {kind: http, path: /api/v1/health, expect_status: 200}
    owner: platform-team
    version: "0.2.0"
    tls: none
    tags: [ops, agents]
    status_sources:
      - id: agentmetry-audit
        kind: poll-http-json
        target: {path: /api/v1/audit/status}
        interval_s: 300
        timeout_s: 10
        auth: {secret: "secret:agentmetry/api-token", header: X-API-Key}
        mapping: {builtin: agentmetry-audit, module: agents, warn_after_s: 86400}
        what: Whether the agent dashboard's audit trail is being written (warn when off, empty or silent for a day).

  dashboards:
    capability: dashboards
    impl: grafana
    host: mon-core
    protocol: http
    port: 3000
    health: {kind: http, path: /api/health, expect_status: 200}
    metrics: {path: /metrics}
    upstreams: [metrics, idp]
    owner: platform-team
    version: "11.2.0"
    tls: none
    auth: idp
    public_hostname: dashboards.lab.example
    backup_job: daily-core
    tags: [ops, ui]

  status-hub:
    capability: status-hub
    impl: homelabnext
    host: mon-core
    protocol: http
    port: 8099
    health: {kind: http, path: /status.json, expect_status: 200}
    upstreams: [idp]
    owner: platform-team
    version: "0.1.0"
    tls: none
    auth: idp
    public_hostname: status.lab.example
    # the edge adds this header (value from the secret store) so the hub can trust the
    # forward-auth identity headers for its private agent-activity tier (docs/status.md)
    front_door: {header: X-Hnx-Front-Door, secret: "secret:status/front-door-secret"}
    tags: [ops, ui]
    status_sources:
      - id: agent-spool
        kind: agent-activity
        target: {file: build/status/agent-spool}
        interval_s: 30
        timeout_s: 10
        mapping: {builtin: agent-spool, module: agents}
        what: Agent sessions from the local hook spool (Claude Code hooks and other CLIs); stuck and errored sessions need attention.
      - id: agent-push
        kind: agent-activity
        interval_s: 60
        timeout_s: 10
        mapping: {builtin: agent-push, module: agents}
        what: Agent sessions pushed to the ingest listener (cloud sessions, orchestrators); stuck and errored sessions need attention.
      - id: agentmetry-trail
        kind: agent-activity
        target: {file: build/status/agentmetry/audit-forward.jsonl}
        interval_s: 60
        timeout_s: 10
        mapping: {builtin: agentmetry-jsonl, module: agents}
        what: Agent sessions read from an Agentmetry canonical JSONL trail (optional external app).
