# SPDX-License-Identifier: Apache-2.0
#
# How each credential the lab names gets its value (`hnx secrets plan|seed`, docs/private-overlay.md,
# "Seeding the credentials"). Names are matched without the `secret:` prefix; the first rule whose
# glob matches wins. A name no rule matches is `unclassified`: listed, never generated (a value
# made up for a key another system issues would only fail later). Nothing here is a value: this
# file is safe in git.
#
#   password  letters, digits, - and _          (length: 20-128, default 32)
#   token     URL-safe base64 of N random bytes  (bytes: 16-128, default 32; prefix: optional)
#   hex       N random bytes as hex              (bytes: 16-128)
#   external  issued by something else: never generated; `seed --ask` prompts for it,
#             `seed --from-file NAME=FILE` reads it (keys, kubeconfigs), else it is listed with `how`
#
# Seeding stores a value; where a service must also know it (the SIEM's enrolment password, the
# directory's bind account, the UPS monitor), the role sets it from the same name, or you set it
# in that service's console from the value in OpenBao.
secrets_version: 1

# names no file in the overlay holds: the deploy's vault password is a workflow variable
also: [ansible/vault-password]

rules:
  # --- issued elsewhere -------------------------------------------------------------------------
  - {match: "tailscale/*", kind: external, how: "Tailscale admin console > Settings > Keys: a tagged, pre-approved auth key"}
  - {match: "network/router/*", kind: external, how: "the router console: its API key, and the local admin set at adoption"}
  - {match: "unifi/*", kind: external, how: "UniFi console > Integrations: create an API key"}
  - {match: "models/*-token", kind: external, how: "the model hub's account settings: a read-only access token"}
  - {match: "llm-gateway/upstream-*", kind: external, how: "the cloud model provider's console: an API key with a spend limit"}
  - {match: "llm-gateway/database-url", kind: external, how: "create the gateway's database user, then store postgresql://USER:PASSWORD@HOST/DB"}
  - {match: "*/ntfy-token", kind: external, how: "on the ntfy server: `ntfy token add <user>`"}
  - {match: "mcp/ssh-key", kind: external, how: "a dedicated key pair: --from-file mcp/ssh-key=PATH (the private key)"}
  - {match: "mcp/kubeconfig", kind: external, how: "a scoped service-account kubeconfig: --from-file mcp/kubeconfig=PATH"}
  - {match: "mcp/vault-token", kind: external, how: "an OpenBao token for the MCP server's policy: `bao token create -policy=...`"}
  - {match: "mcp/*", kind: external, how: "the token or password the connected system issues (its settings, API tokens)"}
  - {match: "stackstorm/*", kind: external, how: "on StackStorm: `st2 apikey create`"}
  - {match: "nifi/*", kind: external, how: "NiFi's own token for the status reader"}
  - {match: "publishing/deny-list", kind: external, how: "content, not a credential: --from-file publishing/deny-list=PATH"}

  # --- keys the software only checks, never shows a person --------------------------------------
  - {match: "llm-gateway/master-key", kind: token, bytes: 32, prefix: "sk-"}   # LiteLLM keys start with sk-
  - {match: "llm-gateway/key-*", kind: token, bytes: 32, prefix: "sk-"}
  - {match: "*/session-key", kind: token, bytes: 48}
  - {match: "*csrf-secret", kind: token, bytes: 48}
  - {match: "*front-door-secret", kind: token, bytes: 48}
  - {match: "status/ingest/*", kind: token, bytes: 32}
  - {match: "vaultwarden/admin-token", kind: token, bytes: 48}
  - {match: "agentmetry/api-token", kind: token, bytes: 32}

  # --- passwords a person may type, or software that wants a password ---------------------------
  - {match: "ansible/vault-password", kind: password, length: 48}
  - {match: "siem/enrollment-password", kind: password, length: 32}
  - {match: "idp/*", kind: password, length: 32}
  - {match: "assessment/gmp-password", kind: password, length: 32}
  - {match: "nut/monitor-password", kind: password, length: 32}

# Copies for people, in the Vaultwarden folder below (`seed --vaultwarden`; the folder is created
# if it does not exist). OpenBao stays the source of truth: the deploy never reads Vaultwarden.
# The break-glass material (OpenBao's unseal keys and root-token recovery, the operator's age
# identity) is not seeded here at all: add it to Vaultwarden by hand, and keep a copy off the lab,
# since a Vaultwarden on the lab is down exactly when you need them.
vaultwarden:
  folder: homelab
  include: ["*"]
  exclude: ["status/ingest/*"]   # machine-to-machine tokens nobody types
