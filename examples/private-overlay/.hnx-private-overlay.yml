# SPDX-License-Identifier: Apache-2.0
# Marks a repository as an hnx PRIVATE overlay (docs/private-overlay.md, ADR-0021).
#
# `python3 hnx/tools/private_leak_check.py private .` refuses to run on a tree without this file:
# its rules allow real addresses and host names, so they must never run on the public repository
# by accident.  The public repository reads `private_paths` below from this skeleton to fail its
# own CI if any of those paths is ever committed there.
hnx_private_overlay: 1

# Only the public skeleton says this.  Delete the line in your private copy.
fictional: true

# Files ansible-vault must have encrypted (globs, relative to the repository root).  vault.yml,
# *.vault, *.vault.yml and *.vault.yaml are always included.
ansible_vault_files:
  - ansible/inventory/*/group_vars/*/vault.yml
  - ansible/inventory/*/host_vars/*/vault.yml

# Further directories (or globs) whose every file must be SOPS-encrypted, on top of lab/sealed/,
# which the check always seals.
sealed_paths: []

# Files the check may leave unscanned (binary, larger than 5 MB), as globs.  Anything else it
# cannot read is a finding; a sealed or vault file is never let through.
allow_unscanned: []

# Paths that exist only in a private overlay: the public repository must never contain them.
private_paths:
  - lab/
  - ansible/inventory/production/
