# SPDX-License-Identifier: Apache-2.0
# TEMPLATE for the PRIVATE overlay repository (fictional; docs/private-overlay.md).  Copy it to
# .github/workflows/checks.yml there and make its `checks` job (the last one, which needs every
# other job) the required status check of main.
#
# Runs on every pull request and push with no secret and no Environment: it proves nothing was
# committed in plain text that should have been sealed, and no credential value was committed at
# all.  Decrypting and validating the sealed files happens only in deploy.yml, which runs only
# when the operator dispatches it from main.  `pull_request` (never pull_request_target): a pull request's code
# runs with a read-only token and no secrets.
#
# The homelab-next commit every job uses (HNX_REF) is the tracked file locks/hnx-ref, read and
# proved to be on homelab-next's main by the `hnx-pin` job; the other jobs use only the commit it
# hands them (docs/private-overlay.md, "The pinned homelab-next commit").
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # HNX_REF, from this change's locks/hnx-ref, refused unless it is a full commit SHA on
  # homelab-next's main: GitHub serves any commit of the fork network (an unmerged pull request,
  # a fork's branch) under the parent's name, so a full SHA alone proves nothing was reviewed.
  # Nothing from hnx/ runs in this job.
  hnx-pin:
    name: hnx pin on homelab-next main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.hnx-ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: refuse an unpinned hnx
        # HNX_REF is the tracked file locks/hnx-ref: one full commit SHA, comment lines allowed
        id: hnx-ref
        run: |
          set -euo pipefail
          if [ ! -f locks/hnx-ref ] || [ -L locks/hnx-ref ]; then echo "::error::locks/hnx-ref (the pinned homelab-next commit) is missing"; exit 1; fi
          ref="$(grep -Ev '^[[:space:]]*(#|$)' locks/hnx-ref || true)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::locks/hnx-ref must hold one full commit SHA (40 lowercase hex) and nothing else but comments"; exit 1; }
          [[ ! "$ref" =~ ^0{40}$ ]] || { echo "::error::locks/hnx-ref still holds the template's placeholder: pin the homelab-next commit you reviewed"; exit 1; }
          echo "sha=$ref" >> "$GITHUB_OUTPUT"

      - name: refuse an hnx/ the change itself carries
        # the pinned checkout goes to hnx/: a pull request that tracks hnx/ must not get its own
        # files under the pinned commit's name
        run: |
          set -euo pipefail
          if [ -e hnx ] || [ -L hnx ]; then echo "::error::the overlay tracks hnx/, where the pinned homelab-next goes"; exit 1; fi

      - name: homelab-next at the pinned commit (its history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: homelab-next/homelab-next
          ref: ${{ steps.hnx-ref.outputs.sha }}
          path: hnx
          fetch-depth: 0  # the history the ancestry check below walks
          persist-credentials: false

      - name: refuse an hnx commit that is not on homelab-next main
        env:
          HNX_REF: ${{ steps.hnx-ref.outputs.sha }}
        run: |
          set -euo pipefail
          head="$(git -C hnx rev-parse HEAD)"
          [ "$head" = "$HNX_REF" ] || { echo "::error::hnx/ is at $head, not the pinned $HNX_REF"; exit 1; }
          [ "$(git -C hnx rev-parse --is-shallow-repository)" = false ] || { echo "::error::hnx/ is a shallow clone: its ancestry cannot be checked"; exit 1; }
          git -C hnx fetch --quiet --no-tags origin +refs/heads/main:refs/hnx-pin/main
          git -C hnx merge-base --is-ancestor "$HNX_REF" refs/hnx-pin/main || { echo "::error::HNX_REF $HNX_REF is not on homelab-next main: only merged, reviewed code runs"; exit 1; }
          echo "hnx $HNX_REF is on homelab-next main"

  private-leak-check:
    name: private leak check
    needs: hnx-pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: refuse an unpinned hnx
        env:
          HNX_REF: ${{ needs.hnx-pin.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$HNX_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HNX_REF must be a full commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: refuse an hnx/ the change itself carries
        # the pinned checkout goes to hnx/ and is installed from there: a pull request that
        # tracks hnx/ must not get its own files under the pinned commit's name
        run: |
          set -euo pipefail
          if [ -e hnx ] || [ -L hnx ]; then echo "::error::the overlay tracks hnx/, where the pinned homelab-next goes"; exit 1; fi

      - name: homelab-next at the pinned commit (the check and the secret patterns)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: homelab-next/homelab-next
          ref: ${{ needs.hnx-pin.outputs.sha }}
          path: hnx
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: PyYAML, hash-pinned
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r hnx/constraints/bootstrap.txt
          python -m pip install --disable-pip-version-check -c hnx/constraints/ci.txt PyYAML

      - name: no plaintext secret, every sealed file sealed, no key next to its ciphertext
        run: python hnx/tools/private_leak_check.py private .

  # The module loader (docs/modules.md, "The loader at deploy time") on every pull request: the
  # check deploy.yml runs before it changes a host, run here first so a problem shows on the pull
  # request and not only when the operator dispatches the deploy.  hnx is the pinned commit; the
  # overlay is read as data, with a read-only token and no secret.  The census and the check of
  # what runs stay in deploy.yml: they need the hosts.  The same job checks the specs the
  # operator applies by hand (the SSH certificate roles, how each credential is seeded), so a
  # broken one shows on the pull request and not on the day it is applied.
  module-loader:
    name: module loader
    needs: hnx-pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: refuse an unpinned hnx
        env:
          HNX_REF: ${{ needs.hnx-pin.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$HNX_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HNX_REF must be a full commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: refuse an hnx/ the change itself carries
        # the pinned checkout goes to hnx/ and is installed from there: a pull request that
        # tracks hnx/ must not get its own files under the pinned commit's name
        run: |
          set -euo pipefail
          if [ -e hnx ] || [ -L hnx ]; then echo "::error::the overlay tracks hnx/, where the pinned homelab-next goes"; exit 1; fi

      - name: homelab-next at the pinned commit (the loader)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: homelab-next/homelab-next
          ref: ${{ needs.hnx-pin.outputs.sha }}
          path: hnx
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: hnx, hash-pinned bootstrap
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r hnx/constraints/bootstrap.txt
          python -m pip install --disable-pip-version-check -c hnx/constraints/ci.txt PyYAML jsonschema referencing setuptools
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation ./hnx

      - name: the module loader over this lab's own selection
        run: hnx modules check --root hnx --overlay . --deploy

  # The specs the operator applies by hand (docs/private-overlay.md, "SSH certificates" and
  # "Seeding the credentials"): the SSH certificate roles (`hnx ssh-ca check`) and how each
  # credential is seeded (`hnx secrets plan --spec`, which reads names only and reaches no
  # store), so a broken one shows on the pull request, not on the day it is applied.  Both files
  # are optional.  hnx is the pinned commit, no secret.
  lab-specs:
    name: lab specs
    needs: hnx-pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: refuse an unpinned hnx
        env:
          HNX_REF: ${{ needs.hnx-pin.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$HNX_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HNX_REF must be a full commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: refuse an hnx/ the change itself carries
        # the pinned checkout goes to hnx/ and is installed from there: a pull request that
        # tracks hnx/ must not get its own files under the pinned commit's name
        run: |
          set -euo pipefail
          if [ -e hnx ] || [ -L hnx ]; then echo "::error::the overlay tracks hnx/, where the pinned homelab-next goes"; exit 1; fi

      - name: homelab-next at the pinned commit (the spec checks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: homelab-next/homelab-next
          ref: ${{ needs.hnx-pin.outputs.sha }}
          path: hnx
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: hnx, hash-pinned bootstrap
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r hnx/constraints/bootstrap.txt
          python -m pip install --disable-pip-version-check -c hnx/constraints/ci.txt PyYAML jsonschema referencing setuptools
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation ./hnx

      - name: the SSH certificate roles and the seeding spec validate
        # both are optional; a lab that has one gets it checked (a link counts as present)
        run: |
          set -euo pipefail
          if [ -e lab/ssh-ca.yml ] || [ -L lab/ssh-ca.yml ]; then hnx ssh-ca check lab/ssh-ca.yml; fi
          if [ -e lab/secrets.yml ] || [ -L lab/secrets.yml ]; then hnx secrets plan lab --spec lab/secrets.yml; fi

  # The review tier of a change to what the lab claims (docs/private-overlay.md, "What a change to
  # the lab claims"): every change to the site, the selection, the registry, the guests and the
  # overlay's modules is human-approve but those the check knows widen nothing.  Each needs a code
  # owner as of the pull request's base (CODEOWNERS names every one of those files);
  # the approval itself is that code-owner review, which binds only where main's branch rules
  # require it.  hnx is the pinned commit, the base is read through git, no secret.
  site-review-tier:
    name: site review tier
    needs: hnx-pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: refuse an unpinned hnx
        env:
          HNX_REF: ${{ needs.hnx-pin.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$HNX_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HNX_REF must be a full commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the base commit
          persist-credentials: false

      - name: refuse an hnx/ the change itself carries
        # the pinned checkout goes to hnx/ and is installed from there: a pull request that
        # tracks hnx/ must not get its own files under the pinned commit's name
        run: |
          set -euo pipefail
          if [ -e hnx ] || [ -L hnx ]; then echo "::error::the overlay tracks hnx/, where the pinned homelab-next goes"; exit 1; fi

      - name: homelab-next at the pinned commit (the check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: homelab-next/homelab-next
          ref: ${{ needs.hnx-pin.outputs.sha }}
          path: hnx
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: hnx, hash-pinned bootstrap
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r hnx/constraints/bootstrap.txt
          python -m pip install --disable-pip-version-check -c hnx/constraints/ci.txt PyYAML jsonschema referencing setuptools
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation ./hnx

      - name: the review tier of this change to the lab's site and selection
        env:
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
        run: hnx site review-tier --root . --ci-base

  # The swap gate (docs/modules.md, "Swap record 1.2") over the lab's own model evidence: a change
  # to lab/model_roles.json needs a swap record added or changed under lab/swaps/ whose legs hold
  # against lab/model-serving/model_store.json, lab/model_roles.eval.json and lab/model-evals/ as
  # the pull request's BASE has them, so a change cannot vouch for itself.  A change to what
  # vouches for a model, or to the records, is human-approve (CODEOWNERS, site-review-tier).  hnx
  # is the pinned commit and supplies the code and the golden suites only, the base is read
  # through git, no secret.
  swap-gate:
    name: swap gate
    needs: hnx-pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: refuse an unpinned hnx
        env:
          HNX_REF: ${{ needs.hnx-pin.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$HNX_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HNX_REF must be a full commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the base commit
          persist-credentials: false

      - name: refuse an hnx/ the change itself carries
        # the pinned checkout goes to hnx/ and is installed from there: a pull request that
        # tracks hnx/ must not get its own files under the pinned commit's name
        run: |
          set -euo pipefail
          if [ -e hnx ] || [ -L hnx ]; then echo "::error::the overlay tracks hnx/, where the pinned homelab-next goes"; exit 1; fi

      - name: homelab-next at the pinned commit (the gate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: homelab-next/homelab-next
          ref: ${{ needs.hnx-pin.outputs.sha }}
          path: hnx
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: hnx, hash-pinned bootstrap
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r hnx/constraints/bootstrap.txt
          python -m pip install --disable-pip-version-check -c hnx/constraints/ci.txt PyYAML jsonschema referencing setuptools
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation ./hnx

      - name: a role-table change needs a swap record
        env:
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
        run: hnx modules swap-gate --overlay . --ci-base

  # The one check main's branch protection requires: it passes only when every other job here
  # succeeded, so a job added later blocks a merge once it is listed in needs (a test checks that
  # every job is), and no single job can be left out of the protection by accident.  always():
  # a failed or skipped job must fail this one, not skip it (a skipped required check passes).
  checks:
    name: checks
    if: always()
    needs: [hnx-pin, private-leak-check, module-loader, lab-specs, site-review-tier, swap-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          [ -n "$RESULTS" ] || { echo "::error::no job results"; exit 1; }
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a required job ended $r: $RESULTS"; exit 1; }
          done
