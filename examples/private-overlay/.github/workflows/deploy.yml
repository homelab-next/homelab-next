# SPDX-License-Identifier: Apache-2.0
# TEMPLATE for the PRIVATE overlay repository (fictional; docs/private-overlay.md "The deploy
# workflow").  It lives under examples/ in the public repository, where GitHub never runs it.
# Copy it to .github/workflows/deploy.yml of the private repository.
#
# Deploys from main only, and only when the operator starts it: `workflow_dispatch` is the
# approval step (`gh workflow run deploy.yml --ref main`).  On GitHub Pro or Team a private
# repository's Environment has secrets and a deployment-branch policy but no required reviewers,
# so a push trigger would deploy every merge unreviewed; pushes and pull requests run checks.yml
# only.  On Enterprise (or a public repository) you may add `push: {branches: [main]}` back AND
# required reviewers on the Environment (docs/private-overlay.md "GitHub plans").  Environment
# `production`: deployment branches main only.  The Environment's secrets, each read only by the
# steps that need it, never echoed:
#   SOPS_AGE_KEY             the deploy age identity (sops reads it from the environment)
#   DEPLOY_SSH_KEY           the deploy user's SSH private key (into ssh-agent, never on disk);
#                            interim: the target is short-lived certificates from an OpenBao SSH CA
#   BAO_SECRET_ID            the deploy AppRole's secret_id (bounded TTL): role credentials and the
#                            vault password are read from OpenBao by name, each with a token minted
#                            for that one read and revoked right after it
#   ANSIBLE_VAULT_PASSWORD   optional: the ansible-vault password, when it is not in OpenBao
# and the Environment's variables (not secret; Environment, not repository, variables, so only
# this job sees them):
#   HNX_REF                  full commit SHA of homelab-next whose roles and tools this deploys
#   SOPS_VERSION, SOPS_SHA256  the sops release and the sha256 of its linux.amd64 binary
#   HNX_DEPLOY_PATH          `tailscale` (default: a GitHub-hosted runner joins the tailnet) or
#                            `self-hosted` (an ephemeral JIT runner inside the lab, labels
#                            self-hosted+hnx-deploy, with the job-started hook in runner/)
#   BAO_ADDR, BAO_ROLE_ID    OpenBao (https://) and the deploy AppRole's role_id
#   BAO_CACERT_PEM           the internal CA that signed OpenBao's certificate (PEM)
#   HNX_VAULT_PASSWORD_REF   secret:<name> of the vault password in OpenBao (or use the secret)
#   TS_OAUTH_CLIENT_ID, TS_AUDIENCE
#                            Tailscale workload identity federation (a federated identity with the
#                            auth_keys scope and tag:ci-deploy, trusting this repository's
#                            `environment:production` subject): no Tailscale secret is stored
#
# Never add pull_request_target, never run this on a pull request, and never attach a
# self-hosted runner to a public repository: anyone who can open a pull request could run code
# on it.  Action pins are full commit SHAs; the trailing comment names the release.
name: deploy

on:
  workflow_dispatch:  # the only trigger: a manual dispatch from main is the approval

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never stop a deploy half way

jobs:
  deploy:
    name: deploy to production
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.HNX_DEPLOY_PATH == 'self-hosted' && fromJSON('["self-hosted", "linux", "hnx-deploy"]') || 'ubuntu-latest' }}
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # the Tailscale action exchanges the job's OIDC token (workload identity)
    steps:
      - name: refuse an unpinned hnx or sops, or no OpenBao
        env:
          HNX_REF: ${{ vars.HNX_REF }}
          SOPS_VERSION: ${{ vars.SOPS_VERSION }}
          SOPS_SHA256: ${{ vars.SOPS_SHA256 }}
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          BAO_ROLE_ID: ${{ vars.BAO_ROLE_ID }}
        run: |
          set -euo pipefail
          [[ "$HNX_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HNX_REF must be a full commit SHA"; exit 1; }
          [[ "$SOPS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::SOPS_VERSION must be X.Y.Z"; exit 1; }
          [[ "$SOPS_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::SOPS_SHA256 must be a sha256"; exit 1; }
          [[ "$BAO_ADDR" == https://* ]] || { echo "::error::BAO_ADDR must be an https:// address"; exit 1; }
          [[ -n "$BAO_ROLE_ID" ]] || { echo "::error::BAO_ROLE_ID (the deploy AppRole) is not set"; exit 1; }

      - name: this repository (the lab data)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: homelab-next at the pinned commit (roles, lookup plugin, tools)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: homelab-next/homelab-next
          ref: ${{ vars.HNX_REF }}
          path: hnx
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: ""  # no shared cache in a deploy job

      - name: hnx and the deploy tools, hash-pinned
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r hnx/constraints/bootstrap.txt
          python -m pip install --disable-pip-version-check -c hnx/constraints/ci.txt PyYAML jsonschema referencing setuptools
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation ./hnx
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r locks/deploy.txt

      - name: sops, checksum-verified
        env:
          SOPS_VERSION: ${{ vars.SOPS_VERSION }}
          SOPS_SHA256: ${{ vars.SOPS_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/bin/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  $RUNNER_TEMP/bin/sops" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/sops"
          echo "HNX_SOPS=$RUNNER_TEMP/bin/sops" >> "$GITHUB_ENV"

      - name: no plaintext secret, every sealed file sealed
        run: python hnx/tools/private_leak_check.py private .

      - name: the CA OpenBao's certificate is checked against
        env:
          BAO_CACERT_PEM: ${{ vars.BAO_CACERT_PEM }}
        run: |
          set -euo pipefail
          if [[ -n "$BAO_CACERT_PEM" ]]; then
            printf '%s\n' "$BAO_CACERT_PEM" > "$RUNNER_TEMP/openbao-ca.pem"
            echo "BAO_CACERT=$RUNNER_TEMP/openbao-ca.pem" >> "$GITHUB_ENV"
          fi

      - name: the lab data validates (SOPS files decrypted in memory)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          HNX_EXAMPLES_DIR: lab
          HNX_CUSTOMIZATIONS_DIR: lab/customizations
        run: |
          set -euo pipefail
          hnx registry validate lab/services.yml
          hnx site validate lab/site.yml
          hnx guests validate lab/guests --site lab/site.yml
          hnx custom check

      # The module loader (ADR-0027, docs/modules.md "The loader at deploy time"): the same check
      # `make gates` runs, over this lab's own selection, before anything changes on a host; a
      # problem stops the deploy.  --deploy refuses the repository's examples in place of a lab
      # input.  A lab that has taken up no modules (no lab/modules.yml, lab/modules/ or
      # lab/modules.lock) has nothing to check, and the run says so.
      - name: the module loader, before anything changes on a host
        id: modules
        run: |
          set -euo pipefail
          if [[ -e lab/modules.yml || -L lab/modules.yml || -e lab/modules || -e lab/modules.lock ]]; then
            hnx modules check --root hnx --overlay . --deploy
            echo "in_use=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::this lab selects no modules (no lab/modules.yml, lab/modules/ or lab/modules.lock): the module loader has nothing to check"
            echo "in_use=false" >> "$GITHUB_OUTPUT"
          fi

      # Tailscale path: join the tailnet for this run only, by workload identity federation: the
      # action trades the job's OIDC token for an ephemeral, pre-authorized node tagged
      # tag:ci-deploy, so no Tailscale secret exists to steal.  The tag's ACL is generated from
      # lab/site.yml tailnet.deploy (docs/private-overlay.md "Tailscale"): SSH to the declared
      # deploy zones, plus the OpenBao port as a declared exception, with policy tests.
      - name: join the tailnet as tag:ci-deploy
        if: vars.HNX_DEPLOY_PATH != 'self-hosted'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-deploy
          use-cache: "false"

      - name: deploy
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # role credentials (secret:<name>) and the vault password come from OpenBao by name: the
          # hnx_secret lookup and bin/vault-pass-client.py log in with the AppRole, read, and
          # revoke the token; no credential is an Actions secret of its own
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          BAO_ROLE_ID: ${{ vars.BAO_ROLE_ID }}
          BAO_SECRET_ID: ${{ secrets.BAO_SECRET_ID }}
          HNX_VAULT_PASSWORD_REF: ${{ vars.HNX_VAULT_PASSWORD_REF }}
          HNX_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}  # optional, wins when set
          ANSIBLE_CONFIG: ansible.cfg
          HNX_EXAMPLES_DIR: lab
          HNX_CUSTOMIZATIONS_DIR: lab/customizations
          MODULES_IN_USE: ${{ steps.modules.outputs.in_use }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | ssh-add - 2> /dev/null
          unset DEPLOY_SSH_KEY
          ansible-playbook ansible/playbooks/site.yml
          # the census of what runs, read-only on every host, into a fresh directory of this
          # runner's (the next step gathers and checks it)
          if [[ "$MODULES_IN_USE" == true ]]; then
            census="$(mktemp -d "$RUNNER_TEMP/census.XXXXXX")"
            ansible-playbook hnx/ansible/playbooks/module_census.yml -e "module_census_dir=$census"
            echo "HNX_CENSUS_DIR=$census" >> "$GITHUB_ENV"
          fi

      # After the deploy, what runs must be what the lab declares (the loader's two-way check
      # against the census just taken): a unit a selected module does not declare, one of a module
      # the lab does not select, or a declared one that is not running fails the run.  It is a
      # verification, not a gate: the deploy has already applied, and the red run is the alarm.
      - name: what runs matches what the lab declares
        if: steps.modules.outputs.in_use == 'true'
        run: |
          set -euo pipefail
          hnx modules gather "$HNX_CENSUS_DIR" --out "$HNX_CENSUS_DIR.inventory.json"
          hnx modules check --root hnx --overlay . --deploy --running "$HNX_CENSUS_DIR.inventory.json"
