# SPDX-License-Identifier: Apache-2.0
# TEMPLATE for the PRIVATE overlay repository (fictional; docs/private-overlay.md "The deploy
# workflow").  It lives under examples/ in the public repository, where GitHub never runs it.
# Copy it to .github/workflows/deploy.yml of the private repository.
#
# Deploys from main only, through the protected Environment `production` (required reviewers,
# deployment branches: main).  Every credential is an Environment secret, read only by the steps
# that need it, never echoed:
#   ANSIBLE_VAULT_PASSWORD   the ansible-vault password (to bin/vault-pass-client.py by env)
#   SOPS_AGE_KEY             the deploy age identity (sops reads it from the environment)
#   DEPLOY_SSH_KEY           the deploy user's SSH private key (into ssh-agent, never on disk)
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET
#                            Tailscale OAuth client (scope auth_keys, tag tag:ci-deploy); it mints
#                            an ephemeral, pre-authorized key per run (Tailscale path only)
# and these repository or Environment variables (not secret):
#   HNX_REF                  full commit SHA of homelab-next whose roles and tools this deploys
#   SOPS_VERSION, SOPS_SHA256  the sops release and the sha256 of its linux.amd64 binary
#   HNX_DEPLOY_PATH          `tailscale` (default: a GitHub-hosted runner joins the tailnet) or
#                            `self-hosted` (a runner inside the lab, labels self-hosted+hnx-deploy)
#
# Never add pull_request_target, never run this on a pull request, and never attach a
# self-hosted runner to a public repository: anyone who can open a pull request could run code
# on it.  Action pins are full commit SHAs; the trailing comment names the release.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never stop a deploy half way

jobs:
  deploy:
    name: deploy to production
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.HNX_DEPLOY_PATH == 'self-hosted' && fromJSON('["self-hosted", "linux", "hnx-deploy"]') || 'ubuntu-latest' }}
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: refuse an unpinned hnx or sops
        env:
          HNX_REF: ${{ vars.HNX_REF }}
          SOPS_VERSION: ${{ vars.SOPS_VERSION }}
          SOPS_SHA256: ${{ vars.SOPS_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$HNX_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HNX_REF must be a full commit SHA"; exit 1; }
          [[ "$SOPS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::SOPS_VERSION must be X.Y.Z"; exit 1; }
          [[ "$SOPS_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::SOPS_SHA256 must be a sha256"; exit 1; }

      - name: this repository (the lab data)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: homelab-next at the pinned commit (roles, lookup plugin, tools)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: homelab-next/homelab-next
          ref: ${{ vars.HNX_REF }}
          path: hnx
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: ""  # no shared cache in a deploy job

      - name: hnx and the deploy tools, hash-pinned
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r hnx/constraints/bootstrap.txt
          python -m pip install --disable-pip-version-check -c hnx/constraints/ci.txt PyYAML jsonschema referencing setuptools
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation ./hnx
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r locks/deploy.txt

      - name: sops, checksum-verified
        env:
          SOPS_VERSION: ${{ vars.SOPS_VERSION }}
          SOPS_SHA256: ${{ vars.SOPS_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/bin/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  $RUNNER_TEMP/bin/sops" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/sops"
          echo "HNX_SOPS=$RUNNER_TEMP/bin/sops" >> "$GITHUB_ENV"

      - name: no plaintext secret, every sealed file sealed
        run: python hnx/tools/private_leak_check.py private .

      - name: the lab data validates (SOPS files decrypted in memory)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          HNX_EXAMPLES_DIR: lab
          HNX_CUSTOMIZATIONS_DIR: lab/customizations
        run: |
          set -euo pipefail
          hnx registry validate lab/services.yml
          hnx site validate lab/site.yml
          hnx guests validate lab/guests --site lab/site.yml
          hnx custom check

      # Tailscale path: join the tailnet for this run only.  The OAuth client mints an ephemeral,
      # pre-authorized key tagged tag:ci-deploy; the node disappears when the job ends.  The tag's
      # ACL (docs/private-overlay.md "Tailscale") allows SSH to the deploy targets and nothing else.
      - name: join the tailnet as tag:ci-deploy
        if: vars.HNX_DEPLOY_PATH != 'self-hosted'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
          use-cache: "false"

      - name: deploy
        env:
          HNX_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ANSIBLE_CONFIG: ansible.cfg
          HNX_EXAMPLES_DIR: lab
          HNX_CUSTOMIZATIONS_DIR: lab/customizations
          # a role secret (secret:<name>) reaches the hnx_secret lookup as HNX_SECRET_<NAME>:
          # HNX_SECRET_REMOTE_ACCESS_AUTH_KEY: ${{ secrets.HNX_SECRET_REMOTE_ACCESS_AUTH_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | ssh-add - 2> /dev/null
          unset DEPLOY_SSH_KEY
          ansible-playbook ansible/playbooks/site.yml
