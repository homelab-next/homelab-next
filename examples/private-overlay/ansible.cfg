# Ansible configuration of the PRIVATE overlay (fictional template; docs/private-overlay.md).
# The roles and the plugins (the hnx_secret lookup among them) come from the pinned public
# checkout in ./hnx (the deploy workflow puts it there); the inventory and the vaulted variables
# are this repository's own.
[defaults]
inventory = ansible/inventory/production/hosts.yml
roles_path = hnx/ansible/roles
lookup_plugins = hnx/ansible/plugins/lookup
filter_plugins = hnx/ansible/plugins/filter
retry_files_enabled = False
interpreter_python = auto_silent
# The vault password comes from a CLIENT script (its name ends in -client, so Ansible passes it
# --vault-id): an environment variable the Actions Environment injects, or OpenBao by secret
# name.  Never a password file in this repository.  (Option names are case-insensitive; upper case
# keeps the public repository's leak scan, which flags vault-prefixed names, quiet.)
VAULT_IDENTITY_LIST = default@bin/vault-pass-client.py
# Host keys are always checked: commit the hosts' PUBLIC keys (or an SSH host CA line) here.
host_key_checking = True
[ssh_connection]
ssh_args = -o UserKnownHostsFile=ansible/known_hosts -o StrictHostKeyChecking=yes
[diff]
# a diff of a templated file can print a secret into the Actions log
always = False
