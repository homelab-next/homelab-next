# SPDX-License-Identifier: Apache-2.0
# An example novelty spec (ADR-0035, docs/novelty.md): two profiles over the example OCSF tables.
# `hnx novelty run --spec examples/novelty/spec.yml --as-of 2026-03-29T00:00:00Z --dry-run`
schema_version: "1.0"
description: first-seen baselines for hosts and users in the example lab
profiles:
  - id: host-dst-port
    description: has this source address connected to this destination port before?
    table: network_activity
    entity: src_endpoint.ip
    values: [dst_endpoint.port]
    learn_days: 28
    half_life_days: 7
    score_hours: 24
    min_support: 3
    entity_min_samples: 20
    max_values_per_entity: 200
    emit_at: 0.5
    max_findings: 100
  - id: user-src-ip
    description: has this user signed in from this source address before?
    table: authentication
    entity: user_name
    values: [src_endpoint.ip]
    where: {auth_protocol: ssh}
    learn_days: 28
    half_life_days: 14
    score_hours: 24
    min_support: 2
    entity_min_samples: 10
    max_values_per_entity: 50
    emit_at: 0.6
    max_findings: 50
    min_history_days: 14
