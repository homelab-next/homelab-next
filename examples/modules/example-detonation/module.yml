# SPDX-License-Identifier: Apache-2.0
# A detonation engine (fictional "Woodgrove Detonator") for the exposure-management slot, which
# has no contract yet (provisional). Its trial licence has an expiry, so the licence probe warns at
# 30 days, pages the owner at 7 and turns the criterion red on the day.
manifest_version: "1.0"
id: example-detonation
kind: provider
title: Exposure management on Woodgrove Detonator
description: Fills exposure-management with Woodgrove Detonator (fictional).
owner: platform-team
author: agent:example-builder
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: woodgrove-detonator
  display: Woodgrove Detonator
  version: 5.1.0
licence:
  kind: trial
  expires: '2027-03-31'
  renewal: the trial converts to a subscription or the slot is swapped
credentials:
  - secret: secret:example-detonation/console-token
    identity: token
    holder: provider
    purpose: the engine's console API, used by its adapter
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the secrets slot this provider stores into or reads by name
  hosts:
    - role: engine
      kind: vm
      exposure: isolated
      footprint: {cpu: 2, memory_mb: 2048, disk_gb: 100}
      roles: [role:example_detonation]
      purpose: runs Woodgrove Detonator
provides:
  slots:
    exposure-management:
      formats:
        - {format: sarif, version: 2.1.0}
        - {format: ocsf, version: 1.3.0, classes: [vulnerability_finding]}
      adapter: hnx_modules.example_detonation.exposure_management:make
      provisional: true
      reason: the exposure-management slot has no contract or conformance suite yet
contributes:
  roles:
    - file: roles/example_detonation
  preflight:
    - {role: role:example_detonation, hook: readiness}
lifecycle:
  install: {playbook: playbooks/install.yml}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, contributions]
