# SPDX-License-Identifier: Apache-2.0
# A second orchestration provider (fictional "Fourth Coffee Jobs"). The full profile runs it
# beside the platform's scheduler during a cutover: each agent lane is bound to exactly one
# orchestration instance in the selection, so the two never both run the same lane.
manifest_version: "1.0"
id: example-orchestrator
kind: provider
title: Orchestration on Fourth Coffee Jobs
description: Fills orchestration with Fourth Coffee Jobs (fictional).
owner: platform-team
author: agent:example-builder
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: fourth-coffee-jobs
  display: Fourth Coffee Jobs
  version: 2.4.0
licence:
  kind: open-source
  spdx: MIT
credentials:
  - secret: secret:example-orchestrator/api-token
    identity: token
    holder: provider
    purpose: the scheduler's job API, used by its adapter
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the secrets slot this provider stores into or reads by name
  hosts:
    - role: jobs
      kind: any
      footprint: {cpu: 1, memory_mb: 1024, disk_gb: 20}
      roles: [role:example_orchestrator]
      purpose: runs Fourth Coffee Jobs
provides:
  slots:
    orchestration:
      adapter: hnx_modules.example_orchestrator.orchestration:make
      conformance: {target: conformance/target.yml}
      migration: {formats: [jsonl], export: role:example_orchestrator, import: role:example_orchestrator}
contributes:
  roles:
    - file: roles/example_orchestrator
  preflight:
    - {role: role:example_orchestrator, hook: readiness}
lifecycle:
  install: {playbook: playbooks/install.yml}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, contributions]
