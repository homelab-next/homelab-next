# SPDX-License-Identifier: Apache-2.0
# A log pipeline (fictional "Relecloud Pipes") for the move-and-shape stage. The slot has no
# contract yet (provisional) and is stateless; a smaller site selects pass-through instead, which
# the slot registry allows only when the neighbouring stages share a format.
manifest_version: "1.0"
id: example-log-pipeline
kind: provider
title: Log pipeline on Relecloud Pipes
description: Fills log-pipeline with Relecloud Pipes (fictional).
owner: platform-team
author: agent:example-builder
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: relecloud-pipes
  display: Relecloud Pipes
  version: 3.0.5
licence:
  kind: open-source
  spdx: MPL-2.0
requires:
  hosts:
    - role: pipeline
      kind: any
      footprint: {cpu: 1, memory_mb: 1024, disk_gb: 20}
      roles: [role:example_log_pipeline]
      purpose: runs Relecloud Pipes
provides:
  slots:
    log-pipeline:
      formats:
        - {format: ocsf, version: 1.3.0}
      adapter: hnx_modules.example_log_pipeline.log_pipeline:make
      provisional: true
      reason: the log-pipeline slot has no contract or conformance suite yet
contributes:
  roles:
    - file: roles/example_log_pipeline
  preflight:
    - {role: role:example_log_pipeline, hook: readiness}
lifecycle:
  install: {playbook: playbooks/install.yml}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, contributions]
