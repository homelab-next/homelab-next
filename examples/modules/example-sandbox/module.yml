# SPDX-License-Identifier: Apache-2.0
# A minimal feature module (fictional) on the other side of the external data collector's
# sample-handoff interface. It requires the interface by name and version, never the collector, so
# any module that provides sample-handoff 1.0 satisfies it; with none selected it degrades.
id: example-sandbox
kind: feature
title: Example sandbox
description: Detonates files offered through the sample-handoff interface on an isolated guest and
  writes one report per file.
owner: detection-team
status: draft
version: 0.1.0
bundle: {id: soc, group: exposure-management}
requires:
  capabilities:
    - cap: cap:object-store
      version: "1.0"
      instance: samples
      purpose: reads offered files and writes reports beside them
    - cap: cap:exposure-management
      provisional: true
      formats:
        - format: ocsf
          version: 1.3.0
          schema_id: https://schemas.example.internal/homelabnext/ocsf/vulnerability_finding/1.0
          classes: [vulnerability_finding]
      purpose: the detonation engine; findings go to the lake in the findings schema (no contract yet)
  hosts:
    - role: detonation
      kind: vm
      exposure: internal
      footprint: {cpu: 4, memory_mb: 4096, disk_gb: 80}
      roles: [role:sandbox_guest]
      purpose: an isolated guest with no route to the lab
prefers:
  interfaces:
    - interface: sample-handoff
      version: "1.0"
      purpose: files collected by another module, with their sidecars
      fallback:
        behaviour: the sandbox only takes files a person submits
contributes:
  roles:
    - file: roles/sandbox_guest
data:
  - id: reports
    kind: object-prefix
    prefix: reports/
    description: one detonation report per file
    export: {format: object-tree, via: role:sandbox_guest}
    import: {format: object-tree, via: role:sandbox_guest}
    retention: {days: 365}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml}
  remove:
    playbook: playbooks/remove.yml
    audit: [inventory, playbooks, hv-config, hv-volumes, live-refs, contributions]
author: agent:example-builder
