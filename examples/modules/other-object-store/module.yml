# SPDX-License-Identifier: Apache-2.0
# A second provider for the same slot (fictional): "Tailspin Blobs", also S3-compatible. Selecting
# it instead of example-object-store for one instance is the swap the docs walk through
# (docs/modules.md, "How a swap works"); both export and import the slot's neutral object-tree
# format, so history moves across. Same adapter, same instance name: the swap record keys on the
# module ids, the slot and the instance, never on the adapter or the route.
manifest_version: "1.0"
id: other-object-store
kind: provider
title: Object store on Tailspin Blobs
description: Fills the object-store slot with Tailspin Blobs, an S3-compatible store; proved by the
  object-store conformance suite through the shared S3 adapter.
owner: platform-team
author: agent:example-builder
status: draft
version: 0.2.0
origin: {kind: in-tree}
product:
  name: tailspin-blobs
  display: Tailspin Blobs
  aliases: [tsblobs]
  version: 1.9.0
licence:
  kind: subscription
  tier: standard (object versioning included)
  expires: '2027-06-30'
  renewal: yearly, by the platform team
credentials:
  - secret: secret:other-object-store/access-key
    identity: key-pair
    holder: consumers
    purpose: the template of the per-consumer key pairs the store issues at bind time
  - secret: secret:other-object-store/admin-token
    identity: token
    holder: provider
    purpose: the store's own admin API, used by the role only
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the admin token and the issued key pairs are read by name at run time
  hosts:
    - role: store
      kind: vm
      exposure: internal
      footprint: {cpu: 2, memory_mb: 1024, disk_gb: 200}
      roles: [role:other_object_store]
      purpose: runs the store
provides:
  slots:
    object-store:
      formats:
        - {format: s3, version: '2006-03-01'}
      adapter: homelabnext.conform.adapters.s3:make_object_store
      features: [metadata]
      conformance:
        target: conformance/target.yml
      migration:
        formats: [object-tree]
        export: role:other_object_store
        import: role:other_object_store
egress: none
contributes:
  roles:
    - file: roles/other_object_store
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:other_object_store, hook: readiness}
config:
  data_dir:
    type: path
    description: where the store keeps its data, relative to the module's data root on the host
    default: objects
    overlay: optional
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: a pinned version bump; the role's upgrade hook records it}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
