# SPDX-License-Identifier: Apache-2.0
# An inference provider (fictional "Contoso Inference") behind the OpenAI-compatible contract.
# Its footprint asks for one exclusive GPU, which the site's placement binds to a named resource
# on the host (gpu0): two exclusive GPU users on one card are refused.
manifest_version: "1.0"
id: example-inference
kind: provider
title: Inference on Contoso Inference
description: Fills inference with Contoso Inference (fictional).
owner: platform-team
author: agent:example-builder
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: contoso-inference
  display: Contoso Inference
  version: 0.11.2
licence:
  kind: open-source
  spdx: Apache-2.0
requires:
  hosts:
    - role: server
      kind: any
      exposure: internal
      footprint: {cpu: 4, memory_mb: 5120, disk_gb: 60, gpu_memory_mb: 6144, resources: [{kind: gpu, exclusive: true}]}
      roles: [role:example_inference]
      purpose: runs Contoso Inference
provides:
  slots:
    inference:
      formats:
        - {format: openai-compatible, version: v1}
      adapter: hnx_modules.example_inference.inference:make
      conformance: {target: conformance/target.yml}
egress: none
contributes:
  roles:
    - file: roles/example_inference
  preflight:
    - {role: role:example_inference, hook: readiness}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, contributions]
