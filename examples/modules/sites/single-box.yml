# Reference site profile 1 of 3 (fictional): everything on one box. In a private overlay a site's
# selection is lab/modules.yml (platform/module_selection, specified in docs/modules.md); these
# public examples show the three shapes a lab is carved into. One all-in-one provider covers
# collect, the hot index, detection and alerting; there is no lake, so the external data collector
# falls back to the suite's index (its prefers) and its sessions dataset follows it there with the
# index's retention. Every selected module has a manifest, core modules included, and every
# footprint is summed per host over cpu, memory, disk and GPU memory, less the host's headroom.
profile: single-box
hosts:
  # capacity stands in for the host's platform/guest record (resources), which a real site references
  box:
    kind: host
    addresses: [192.0.2.10]
    capacity: {cpu: 16, memory_mb: 16384, disk_gb: 1000, gpu_memory_mb: 8192}
    resources: [{name: gpu0, kind: gpu}]
    headroom: {memory_mb: 2048}
  collector-edge:
    kind: external
    capacity: {cpu: 1, memory_mb: 1024, disk_gb: 25}
    headroom: {memory_mb: 256}
slots:
  secrets: [{provider: example-platform, instance: platform, placement: {platform: box}}]
  idp: [{provider: example-platform, instance: platform}]
  edge: [{provider: example-platform, instance: platform}]
  dns: [{provider: example-platform, instance: platform}]
  backup: [{provider: example-platform, instance: platform}]
  events: [{provider: example-platform, instance: platform}]
  broker: [{provider: example-platform, instance: platform}]
  records: [{provider: example-platform, instance: platform}]
  orchestration: [{provider: example-platform, instance: platform}]
  agent-runtime: [{provider: example-agent-runtime, instance: runtime, placement: {runtime: box}}]
  inference: [{provider: example-inference, instance: inference, placement: {server: box}}]
  object-store: [{provider: example-object-store, instance: samples, placement: {store: box}}]
  siem-source: [{provider: example-siem-suite, instance: siem, placement: {suite: box}}]
  hot-index: [{provider: example-siem-suite, instance: siem}]
  detections: [{provider: example-siem-suite, instance: siem}]
  notify: [{provider: example-siem-suite, instance: siem}]
  log-pipeline: pass-through      # the suite's agents already emit the index's format
  lake-catalog: none
  lake-query: none
features:
  external-collector:
    placement: {edge: collector-edge, receiver: box}
    config: {edge_region: region-example-1, mode: quiet}
    agents:
      external-collector-analyst: {lanes: {real: platform, shadow: platform}}
core:
  core-staff:
    agents:
      core-staff-scorecard: {lanes: {real: platform}}
grants:
  egress:
    external-collector: {edge: [external]}  # an external host is egress: it runs outside the lab
# The site's network scope (documentation ranges only in a public example; the real one is in the
# private overlay's lab/modules.yml). The collector requires trusted.wan, and both exclusions,
# as every module that reads addresses and runs unattended must: [] means nothing is excluded.
scope:
  trusted:
    wan: [203.0.113.7/32]
    nets: [192.0.2.0/24]
  exclude:
    unattended_mutation: []
    offensive: []
