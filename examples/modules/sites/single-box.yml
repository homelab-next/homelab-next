# SPDX-License-Identifier: Apache-2.0
# Reference site profile 1 of 3 (fictional): everything on one box. In a private overlay a site's
# selection is lab/modules.yml; these public examples show the three shapes a lab is carved into.
# One all-in-one provider covers collect, the hot index, detection and alerting; there is no lake,
# so the external data collector falls back to the suite's index (its prefers). Footprints placed
# on each host are summed against its memory less headroom, as the lab-in-a-box budget is.
profile: single-box
hosts:
  box: {kind: host, cpu: 8, memory_mb: 16384, disk_gb: 1000, headroom_mb: 2048}
  collector-edge: {kind: external, cpu: 1, memory_mb: 1024, disk_gb: 25, headroom_mb: 256}
# providers these examples do not define; the loader would read their manifests
outside_examples: [example-orchestrator, example-agent-runtime, example-records, example-secrets]
slots:
  secrets:
    - {provider: example-secrets, instance: secrets}
  object-store:
    - {provider: example-object-store, instance: samples, placement: {store: box}}
  siem-source:
    - {provider: example-siem-suite, instance: siem, placement: {suite: box}}
  hot-index:
    - {provider: example-siem-suite, instance: siem, placement: {suite: box}}
  detections:
    - {provider: example-siem-suite, instance: siem, placement: {suite: box}}
  notify:
    - {provider: example-siem-suite, instance: siem, placement: {suite: box}}
  log-pipeline: pass-through      # the suite's agents already emit the store's format
  lake-catalog: none
  lake-query: none
  orchestration:
    - {provider: example-orchestrator, instance: orchestrator}
  agent-runtime:
    - {provider: example-agent-runtime, instance: runtime}
  records:
    - {provider: example-records, instance: records}
features:
  external-collector:
    placement: {edge: collector-edge, receiver: box}
    config: {edge_region: region-example-1, mode: quiet}
