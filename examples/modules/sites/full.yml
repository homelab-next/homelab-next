# SPDX-License-Identifier: Apache-2.0
# Reference site profile 3 of 3 (fictional): the full pipeline. Two object-store providers serve
# different instances (the swap in docs/modules.md moves `samples` from one to the other), the
# sandbox takes the collector's sample handoff on an isolated host, and publishing is the only
# module granted the static-hosting slot. The collector's agent is mid-cutover between two
# orchestration instances: its real lane still runs on the platform instance, its shadow lane
# on the new orchestrator, and no lane is bound to both. Authority lives in grants: the egress of
# the collector's external edge host and of publishing, publishing's read of the hosting
# credential, and the publish grant itself.
profile: full
hosts:
  data-core:
    kind: vm
    capacity: {cpu: 16, memory_mb: 32768, disk_gb: 8000}
    headroom: {memory_mb: 4096}
  detect-core:
    kind: vm
    capacity: {cpu: 8, memory_mb: 16384, disk_gb: 2000}
    headroom: {memory_mb: 2048}
  sandbox-core:
    kind: vm
    isolated: true
    capacity: {cpu: 8, memory_mb: 16384, disk_gb: 500}
    headroom: {memory_mb: 2048}
  runtime-core:
    kind: vm
    capacity: {cpu: 8, memory_mb: 8192, disk_gb: 200, gpu_memory_mb: 8192}
    resources: [{name: gpu0, kind: gpu}]
    headroom: {memory_mb: 1024}
  collector-edge:
    kind: external
    capacity: {cpu: 1, memory_mb: 1024, disk_gb: 25}
    headroom: {memory_mb: 256}
slots:
  secrets: [{provider: example-platform, instance: platform, placement: {platform: data-core}}]
  idp: [{provider: example-platform, instance: platform}]
  edge: [{provider: example-platform, instance: platform}]
  dns: [{provider: example-platform, instance: platform}]
  backup: [{provider: example-platform, instance: platform}]
  events: [{provider: example-platform, instance: platform}]
  broker: [{provider: example-platform, instance: platform}]
  records: [{provider: example-platform, instance: platform}]
  orchestration:
    - {provider: example-platform, instance: platform}
    - {provider: example-orchestrator, instance: orchestrator, placement: {jobs: runtime-core}}
  agent-runtime: [{provider: example-agent-runtime, instance: runtime, placement: {runtime: runtime-core}}]
  inference: [{provider: example-inference, instance: inference, placement: {server: runtime-core}}]
  object-store:
    - {provider: example-object-store, instance: objects, placement: {store: data-core}}
    - {provider: other-object-store, instance: samples, placement: {store: data-core}}
  lake-catalog: [{provider: example-lake, instance: lake, placement: {lake: data-core}}]
  lake-query: [{provider: example-lake, instance: lake}]
  log-pipeline: [{provider: example-log-pipeline, instance: pipeline, placement: {pipeline: data-core}}]
  siem-source: [{provider: example-siem-suite, instance: siem, placement: {suite: detect-core}}]
  hot-index: [{provider: example-siem-suite, instance: siem}]
  detections: [{provider: example-siem-suite, instance: siem}]
  notify: [{provider: example-siem-suite, instance: siem}]
  cases: none
  exposure-management: [{provider: example-detonation, instance: detonation, placement: {engine: sandbox-core}}]
  static-hosting: [{provider: example-static-host, instance: public-site}]
features:
  external-collector:
    placement: {edge: collector-edge, receiver: data-core}
    config: {edge_region: region-example-3, mode: full}
    agents:
      external-collector-analyst: {lanes: {real: platform, shadow: orchestrator}}
  example-sandbox:
    placement: {detonation: sandbox-core}
    agents:
      example-sandbox-analyst: {lanes: {real: orchestrator}}
  publishing:
    placement: {publisher: runtime-core}
core:
  core-staff:
    agents:
      core-staff-scorecard: {lanes: {real: platform}}
grants:
  publish: [publishing]
  egress:
    publishing: {publisher: [internet]}
    external-collector: {edge: [external]}
  secrets:
    publishing: [secret:example-static-host/deploy-token]
