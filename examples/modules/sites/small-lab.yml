# SPDX-License-Identifier: Apache-2.0
# Reference site profile 2 of 3 (fictional): a small lab of two hosts. The suite keeps detection
# and alerting; a lake (catalog + query) takes the sessions table, so the collector's preferred
# slots are all selected. No sandbox and no publishing yet.
profile: small-lab
hosts:
  core: {kind: host, cpu: 8, memory_mb: 32768, disk_gb: 2000, headroom_mb: 4096}
  data: {kind: vm, cpu: 4, memory_mb: 16384, disk_gb: 4000, headroom_mb: 2048}
  collector-edge: {kind: external, cpu: 1, memory_mb: 1024, disk_gb: 25, headroom_mb: 256}
outside_examples: [example-lake, example-orchestrator, example-agent-runtime, example-records, example-secrets]
slots:
  secrets:
    - {provider: example-secrets, instance: secrets}
  object-store:
    - {provider: example-object-store, instance: samples, placement: {store: data}}
  lake-catalog:
    - {provider: example-lake, instance: lake-catalog}
  lake-query:
    - {provider: example-lake, instance: lake-query}
  siem-source:
    - {provider: example-siem-suite, instance: siem, placement: {suite: core}}
  hot-index: none
  detections:
    - {provider: example-siem-suite, instance: siem, placement: {suite: core}}
  notify:
    - {provider: example-siem-suite, instance: siem, placement: {suite: core}}
  log-pipeline: pass-through
  orchestration:
    - {provider: example-orchestrator, instance: orchestrator}
  agent-runtime:
    - {provider: example-agent-runtime, instance: runtime}
  records:
    - {provider: example-records, instance: records}
features:
  external-collector:
    placement: {edge: collector-edge, receiver: data}
    config: {edge_region: region-example-2}
