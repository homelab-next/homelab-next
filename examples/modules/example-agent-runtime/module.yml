# SPDX-License-Identifier: Apache-2.0
# A provider of the agent-runtime slot (fictional "Adatum Runtime"), held to the slot's contract,
# the agent-runner suite (ADR-0051), by its conformance target.
manifest_version: "1.0"
id: example-agent-runtime
kind: provider
title: Agent runtime on Adatum Runtime
description: Fills agent-runtime with Adatum Runtime (fictional).
owner: platform-team
author: agent:example-builder
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: adatum-runtime
  display: Adatum Runtime
  version: 0.9.3
licence:
  kind: open-source
  spdx: MIT
requires:
  hosts:
    - role: runtime
      kind: any
      footprint: {cpu: 1, memory_mb: 512, disk_gb: 20}
      roles: [role:example_agent_runtime]
      purpose: runs Adatum Runtime
provides:
  slots:
    agent-runtime:
      adapter: hnx_modules.example_agent_runtime.agent_runtime:make
      conformance: {target: conformance/target.yml}
contributes:
  roles:
    - file: roles/example_agent_runtime
  preflight:
    - {role: role:example_agent_runtime, hook: readiness}
lifecycle:
  install: {playbook: playbooks/install.yml}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, contributions]
