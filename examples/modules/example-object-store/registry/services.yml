# Registry rows (platform/service, the services map) this provider contributes. host names the
# module's host role (requires.hosts); the site's placement maps it to a registry host.
services:
  objects:
    capability: object-store
    impl: northwind-objects
    host: store
    protocol: https
    port: 9000
    health: {kind: http, path: /health/live}
    owner: platform-team
    version: "3.1.4"
    tls: internal
    tags: [storage]
