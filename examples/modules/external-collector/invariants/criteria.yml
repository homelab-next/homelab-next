# Criteria the module contributes, in the invariant register's shape. Module criterion ids are
# <module id>/<slug> (registers/invariant 1.1, specified in docs/modules.md), so they never take a
# core pillar letter. The plugin is the module's own entry point (contributes.entry_points).
criteria:
- id: external-collector/sessions-fresh
  statement: The external data collector's sessions land in the lake within their batch window.
  evidence: plugin
  plugin: external_collector
  expected: pass while the newest sessions row is younger than the table's freshness window
  remediation: >-
    Check the edge host, then the receiver's readiness hook; a silent collector is a blind spot
    that announces nothing.
