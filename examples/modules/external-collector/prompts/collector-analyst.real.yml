# SPDX-License-Identifier: Apache-2.0
# The collector-analyst's real-lane prompt (agent/prompt_template). One file per lane, so a
# candidate prompt runs in shadow beside the real one and is graded against it.
id: collector-analyst-real
version: 1
description: Daily report on the external data collector's sessions (real lane).
persona: persona:collector-analyst
budget_chars: 12000
system: |
  You report on the external data collector for {{ lab-name }}. You take no actions.
instructions: |
  Summarise the rows in the "sessions" section and write one finding note under {{ write-prefix }}.
slots:
  - name: lab-name
    trust: trusted
    description: The lab's display name from configuration.
    example: example lab
  - name: write-prefix
    trust: trusted
    description: The lane's write prefix from the module's lanes.
    example: findings/external-collector/
  - name: sessions
    trust: untrusted
    description: Session rows read from the lake; attacker-controlled text.
    max_chars: 8000
    example: 'one session from a documentation address to the bait login service'
