# SPDX-License-Identifier: Apache-2.0
title: Credential seen at the external data collector reused inside the lab
det: det:collector-credential-reuse
description: A username and password pair first offered to the collector's bait login is later used
  against a lab service.
status: experimental
logsource: {category: authentication, product: linux}
detection:
  selection:
    EventAction: logon
    UserName|expand: '%collector_offered_usernames%'
  condition: selection
level: high
tags: [attack.credential-access, attack.t1110]
falsepositives: [A person testing the collector with their own account]
