# SPDX-License-Identifier: Apache-2.0
# A platform/mcp_server record (ADR-0024) the module contributes: a read-only probe of the
# collector's own state. Fictional values; the real catalog lives in the private overlay.
id: collector-probe
description: Read-only status of the external data collector, its last batch and its sample queue.
owner: detection-team
status: draft
origin:
  kind: first-party
  path: hnx_modules/external_collector/probe/
transport:
  type: streamable-http
  endpoint: svc:collector-receiver
  path: /mcp
runtime:
  host: receiver
  user: collector-probe
headers:
  Authorization: Bearer secret:collector/probe-token
egress: none
data_tier: local-only
capabilities:
- cap:external-collector
tools:
- name: status
  classes:
  - read
  approval: false
- name: last_batch
  classes:
  - read
  approval: false
author: agent:example-builder
