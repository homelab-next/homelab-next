# SPDX-License-Identifier: Apache-2.0
# A platform/mcp_server record (ADR-0024) the module contributes: a read-only probe of the
# collector's own state. Its id is bound to the module id; it fronts no slot (a feature fills
# none), so it names no capability. Fictional values; a real catalog lives in the private overlay.
id: external-collector-probe
description: Read-only status of the external data collector, its last batch and its sample queue.
owner: detection-team
status: draft
origin:
  kind: first-party
  path: hnx_modules/external_collector/probe/
transport:
  type: streamable-http
  endpoint: svc:external-collector-receiver
  path: /mcp
runtime:
  host: receiver
  user: external-collector-probe
headers:
  Authorization: Bearer secret:external-collector/probe-token
egress: none
data_tier: local-only
tools:
- name: status
  classes:
  - read
  approval: false
- name: last_batch
  classes:
  - read
  approval: false
author: agent:example-builder
