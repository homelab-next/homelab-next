# SPDX-License-Identifier: Apache-2.0
# The orchestration adapter (homelabnext.conform.adapters.orchestrator) on a running controller
# elsewhere (the lab's private controller until its row is retired): HNX_ENDPOINT_ORCHESTRATION is
# its job API, HNX_ORCHESTRATION_PROFILES_DIR the profiles directory it loads, and its session
# runs conformance/fakes/llm_orchestrator_hermes.py. This repository's own binary is
# orchestration-orchestrator.yml (docs/orchestration-controller.md).
#   hnx conform run orchestration --target orchestration-llm-orchestrator
name: orchestration-llm-orchestrator
capabilities:
  orchestration:
    adapter: homelabnext.conform.adapters.orchestrator:make
