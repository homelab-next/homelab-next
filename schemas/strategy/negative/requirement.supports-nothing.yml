# a requirement supports one or more objectives
id: PIR-001
title: Is anyone probing the lab's monitoring or status endpoints?
status: active
date: '2026-10-20'
author: human:example-planner
consumer: human:example-operator
cadence: P1D
ltiov: standing
supports: []
serves:
- FFIR-001
sirs:
- 1.1 Requests to the status hub or the uptime service from outside the lab's own zones.
- 1.2 Repeated authentication failures against the monitoring stack.
indicators:
- proxy logs naming the status or uptime host from an unknown client
- an auth-failure burst detection firing on a monitoring host
sources:
- proxy access logs in the lake
- detection findings in the lake
tasked_to:
- profile:reader
question: Is anyone outside the lab probing or attacking its monitoring and status endpoints, which would
  blind the lab to an outage?
decision_supported: Whether to restrict the monitoring endpoints further (a proposal) and whether FFIR-001's
  answer may be under attack.
acceptance: A request burst against the status host from an address outside the lab's zones is reported
  as a finding within a day, naming the client and the window.
guardrails: Authorized internal testing of the operator's own lab only; findings stay internal and identifying
  details are redacted before any summary leaves the lab.
