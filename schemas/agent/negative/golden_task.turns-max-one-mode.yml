# SPDX-License-Identifier: Apache-2.0
# A per-mode max that names only one mode, so the other mode would go unchecked.
suite: codemode-triage
profile: profile:triage
modes: [mcp, codemode]
grant: [service.status]
tasks:
  - id: one-status
    prompt: What is the state of svc:queue?
    fixtures:
      service.status:
        svc:queue: {service: svc:queue, state: running, params: {}}
    expect: {scorer: json_fields, fields: {state: running}}
    checks:
      - {scorer: turns, max: {mcp: 3}}
