# SPDX-License-Identifier: Apache-2.0
# a config entry must be a value or a datastore key, never both
st2_pack: homelabnext
version: 0.1.0
deploy: workflows/deploy.yml
webhook: homelabnext
bridge_api_key: secret:stackstorm/webhook-key
broker_socket: /run/hnx-broker/broker.sock
actor: profile:workflow-agents
config:
  notify_token: {value: fake-token, st2kv: homelabnext.notify_token}
rules:
  - {pack: proposal-validate, mode: shadow}
