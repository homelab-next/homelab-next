# SPDX-License-Identifier: Apache-2.0
name: lab-secrets
capabilities:
  secrets:
    adapter: my_adapters.secrets:make_store
    config:
      token_env: LAB_SECRETS_DEV_TOKEN
      mount: secret
  object-store:
    adapter: conformance.fakes.object_store:FakeObjectStore
    features: [metadata]
    waive: {list-unicode-keys: backend rewrites keys}
  events:
    builtin: "broken:double-settle"
