# SPDX-License-Identifier: Apache-2.0
# Site profile small-lab, as examples/modules/sites/small-lab.yml.
profile: small-lab
hosts:
  core:
    kind: host
    capacity:
      cpu: 16
      memory_mb: 32768
      disk_gb: 2000
      gpu_memory_mb: 16384
    resources:
    - name: gpu0
      kind: gpu
    headroom:
      memory_mb: 4096
  data:
    kind: vm
    capacity:
      cpu: 8
      memory_mb: 16384
      disk_gb: 4000
    headroom:
      memory_mb: 2048
  collector-edge:
    kind: external
    capacity:
      cpu: 1
      memory_mb: 1024
      disk_gb: 25
    headroom:
      memory_mb: 256
slots:
  secrets:
  - provider: example-platform
    instance: platform
    placement:
      platform: core
  idp:
  - provider: example-platform
    instance: platform
  edge:
  - provider: example-platform
    instance: platform
  dns:
  - provider: example-platform
    instance: platform
  backup:
  - provider: example-platform
    instance: platform
  events:
  - provider: example-platform
    instance: platform
  broker:
  - provider: example-platform
    instance: platform
  records:
  - provider: example-platform
    instance: platform
  orchestration:
  - provider: example-platform
    instance: platform
  agent-runtime:
  - provider: example-agent-runtime
    instance: runtime
    placement:
      runtime: core
  inference:
  - provider: example-inference
    instance: inference
    placement:
      server: core
  object-store:
  - provider: example-object-store
    instance: samples
    placement:
      store: data
  lake-catalog:
  - provider: example-lake
    instance: lake
    placement:
      lake: data
  lake-query:
  - provider: example-lake
    instance: lake
  siem-source:
  - provider: example-siem-suite
    instance: siem
    placement:
      suite: core
  hot-index: none
  detections:
  - provider: example-siem-suite
    instance: siem
  notify:
  - provider: example-siem-suite
    instance: siem
  log-pipeline: pass-through
features:
  external-collector:
    placement:
      edge: collector-edge
      receiver: data
    config:
      edge_region: region-example-2
    agents:
      external-collector-analyst:
        lanes:
          real: platform
          shadow: platform
core:
  core-staff:
    agents:
      core-staff-scorecard:
        lanes:
          real: platform
grants:
  egress:
    external-collector:
      edge:
      - external
scope:
  trusted:
    wan:
    - 203.0.113.20/32
    nets:
    - 192.0.2.0/25
    - 2001:db8:20::/48
    tooling:
    - 192.0.2.200/32
  exclude:
    unattended_mutation: []
    offensive: []
