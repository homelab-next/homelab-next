# SPDX-License-Identifier: Apache-2.0
# A remote server: its endpoint is a registry name, its credential a secret name (fictional).
id: lake
description: SQL over the data lake through the query engine's MCP endpoint; read-only.
owner: data-team
status: active
origin:
  kind: image
  image: registry.example/lab/lake-mcp:1.2.0
  digest: sha256:520dff938bbea192813bfcf5ac3ae98ca3d7599429c2e20d5feca12635b3bbd1
transport:
  type: streamable-http
  endpoint: svc:lake-query
  path: /mcp
runtime:
  host: lake-core
  user: lake-mcp
headers:
  Authorization: Bearer secret:mcp/lake-token
egress:
- svc:lake-catalog
- svc:object-store
data_tier: local-only
capabilities:
- cap:lake-query
tools:
- name: describe_table
  classes:
  - read
  approval: false
- name: list_tables
  classes:
  - read
  approval: false
- name: query
  classes:
  - read
  approval: false
author: agent:example-builder
