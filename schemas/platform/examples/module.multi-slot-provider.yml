# SPDX-License-Identifier: Apache-2.0
# An all-in-one provider that fills several slots, as examples/modules/example-siem-suite/module.yml.
manifest_version: '1.0'
id: example-siem-suite
kind: provider
title: Detection suite on Litware SIEM
description: Fills the siem-source, hot-index, detections and notify slots with Litware SIEM, an all-in-one
  product for sites that cannot run the full pipeline.
owner: detection-team
author: agent:example-builder
status: draft
version: 0.2.0
origin:
  kind: in-tree
product:
  name: litware-siem
  display: Litware SIEM
  version: 4.12.0
licence:
  kind: open-source
  spdx: MPL-2.0
credentials:
- secret: secret:example-siem-suite/enrollment-password
  identity: password
  holder: consumers
  purpose: the template of the per-host enrollment secrets issued to collecting hosts
- secret: secret:example-siem-suite/api-token
  identity: token
  holder: provider
  purpose: the adapters' read and rule-load API
identifiers:
- kind: dns-name
  name: siem
  on_remove: keep
requires:
  capabilities:
  - cap: cap:secrets
    version: '1.0'
    purpose: enrollment and API credentials are read by name
  hosts:
  - role: suite
    kind: any
    footprint:
      cpu: 4
      memory_mb: 3072
      disk_gb: 250
    roles:
    - role:example_siem_suite
    purpose: runs the whole suite on one host
provides:
  slots:
    siem-source:
      formats:
      - format: ocsf
        version: 1.3.0
        classes:
        - authentication
        - network_activity
      adapter: hnx_modules.example_siem_suite.source:make_source
      provisional: true
      reason: the siem-source slot has no contract yet; the suite's agents emit OCSF it can read back
    hot-index:
      formats:
      - format: ocsf
        version: 1.3.0
        classes:
        - authentication
        - network_activity
      adapter: hnx_modules.example_siem_suite.index:make_index
      provisional: true
      reason: the hot-index slot has no contract yet (search over recent OCSF rows)
      migration:
        formats:
        - jsonl
        export: role:example_siem_suite
        import: role:example_siem_suite
    detections:
      formats:
      - format: sigma
        version: '2.0'
      adapter: hnx_modules.example_siem_suite.detections:make_engine
      conformance:
        target: conformance/target.yml
      migration:
        formats:
        - sigma
        export: role:example_siem_suite
        import: role:example_siem_suite
    notify:
      adapter: hnx_modules.example_siem_suite.notify:make_sender
      conformance:
        target: conformance/target.yml
contributes:
  roles:
  - file: roles/example_siem_suite
  preflight:
  - role: role:example_siem_suite
    hook: readiness
lifecycle:
  install:
    playbook: playbooks/install.yml
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit:
    - inventory
    - playbooks
    - siem-roster
    - monitoring
    - secret-names
    - dns
    - contributions
