# SPDX-License-Identifier: Apache-2.0
# What runs on the fictional small-lab site (examples/modules/sites/small-lab.yml), exactly what
# its selected modules declare: the loader's two-way check is clean against it.
schema_version: "1.0"
units: []
rows: [external-collector-receiver, samples]
mcp_servers: [external-collector-probe]
agents: [core-staff-scorecard, external-collector-analyst]
tables: ["table:external_collector.sessions"]
# the running notifier's recovery pairs: a module's carries its id; one without must be one of
# the core's own (homelabnext.notify.core_pairs)
notify_pairs:
  - problem: 'External data collector: no new sessions'
    recovery: 'External data collector: sessions arriving again'
    module: external-collector
  - problem: 'UPS on battery'
    recovery: 'UPS back on line power'
