# A profile names the shared entity namespace of its entity, so sources can be corroborated.
schema_version: "1.0"
profiles:
  - id: host-dst-port
    table: network_activity
    entity: src_endpoint.ip
    values: [dst_endpoint.port]
    learn_days: 28
    half_life_days: 7
    score_hours: 24
    min_support: 3
    entity_min_samples: 20
    max_values_per_entity: 200
    emit_at: 0.5
    max_findings: 100
