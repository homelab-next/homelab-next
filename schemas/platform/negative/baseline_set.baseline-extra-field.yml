# SPDX-License-Identifier: Apache-2.0
# negative: rejected by the JSON Schema layer (a baseline has no products field)
controls:
  ssh-hardening:
    layer: identity
    description: Key-only SSH and no direct root login.
    role: null
    verify: sshd -T shows passwordauthentication no
baselines:
  base:
    description: What every in-scope guest gets.
    controls: [ssh-hardening]
    products: [some-agent]
