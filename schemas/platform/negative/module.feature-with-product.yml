# SPDX-License-Identifier: Apache-2.0
# A feature module never names a product.
id: external-collector
kind: feature
title: External data collector
description: Collects connection attempts and dropped files on an internet-facing host outside the lab,
  lands sessions in the lake, hands files to a sandbox and keeps one agent that reports on them.
owner: detection-team
status: draft
version: 0.1.0
bundle:
  id: soc
  group: threat-intel
requires:
  capabilities:
  - cap: cap:object-store
    version: '1.0'
    features:
    - metadata
    formats:
    - format: s3
      version: '2006-03-01'
    instance: samples
    purpose: the receiver stores collected files under samples/ with a metadata sidecar
  - cap: cap:notify
    version: '1.0'
    purpose: pages once when sessions stop arriving and once on recovery
  - cap: cap:orchestration
    version: '1.0'
    purpose: runs the agent's daily job in both lanes
  - cap: cap:agent-runtime
    provisional: true
    purpose: the runtime the orchestrator dispatches the agent's job to (no contract yet)
  - cap: cap:records
    version: '1.0'
    purpose: the agent files one finding note per run
  model_roles:
  - role: mdl:main-reasoner
    purpose: the agent's daily summary
  hosts:
  - role: edge
    kind: external
    exposure: internet-facing
    footprint:
      cpu: 1
      memory_mb: 512
      disk_gb: 20
    roles:
    - role:collector_edge
    purpose: the collector itself, outside the lab; sends only outward to the receiver
  - role: receiver
    kind: vm
    exposure: internal
    footprint:
      cpu: 1
      memory_mb: 384
      disk_gb: 10
    roles:
    - role:collector_receiver
    purpose: receives batches, writes the lake and the object store
prefers:
  capabilities:
  - cap: cap:lake-catalog
    version: '1.0'
    formats:
    - format: ocsf
      version: 1.3.0
      schema_id: https://schemas.example.internal/homelabnext/ocsf/network_activity/1.0
      classes:
      - network_activity
    purpose: the receiver writes session rows with commit-then-checkpoint idempotency
    fallback:
      to: cap:hot-index
      behaviour: sessions are indexed as the same OCSF rows in the detection engine's own index; retention
        drops to that index's window
  - cap: cap:lake-query
    version: '1.0'
    purpose: the agent and the freshness check read the sessions table
    fallback:
      to: cap:hot-index
      behaviour: the agent and the freshness check query the detection engine's index instead, over its
        shorter window only
  - cap: cap:detections
    version: '1.0'
    formats:
    - format: sigma
      version: '2.0'
    purpose: the module's Sigma rules run on the detection engine
    fallback:
      behaviour: the credential-reuse rule does not run; sessions are still collected and reported
  - cap: cap:siem-source
    provisional: true
    purpose: forwards the collector host's own logs to the detection data source (no contract yet)
    fallback:
      behaviour: the collector host's own logs are not searched; its sessions still land
provides:
  interfaces:
  - id: sample-handoff
    version: '1.0'
    kind: object-prefix
    schema: interfaces/collected-sample.schema.json
    via:
      cap: cap:object-store
      prefix: samples/
    description: one collected file per object under samples/, with a JSON sidecar a sandbox reads before
      it detonates the file
  - id: publishable-output
    version: '1.0'
    kind: object-prefix
    schema: interfaces/publishable-item.schema.json
    via:
      cap: cap:object-store
      prefix: publish/
    description: the weekly public report, each item marked with its TLP; only the publishing module takes
      it off the lab, after its gate
contributes:
  roles:
  - file: roles/collector_edge
  - file: roles/collector_receiver
  services:
  - file: registry/services.yml
  status_sources:
  - status:collector-freshness
  notify_pairs:
  - problem: 'External data collector: no new sessions'
    recovery: 'External data collector: sessions arriving again'
    sender: roles/collector_receiver/files/freshness.py
  scheduler_jobs:
  - file: units/fleet_units.yml
  - timer: timer:collector_receiver/pull
  lake_tables:
  - table: table:collector.sessions
    schema_id: https://schemas.example.internal/homelabnext/ocsf/network_activity/1.0
    retention_days: 180
    maintenance:
      compact: true
      expire_snapshots_days: 7
    freshness:
      cadence: batch
      stale_after_s: 172800
  preflight:
  - role: role:collector_receiver
    hook: readiness
  mcp_servers:
  - file: mcp/collector-probe.yml
  agents:
  - key: collector-analyst
    profile: profile:collector-analyst
    charter: agents/collector-analyst.md
    spec: agents/collector-analyst.spec.yml
    model_role: mdl:main-reasoner
    needs:
    - cap: cap:lake-query
      access: read
      scope:
      - table:collector.sessions
    - cap: cap:object-store
      access: read
      scope:
      - samples/
    - cap: cap:records
      access: write
      scope:
      - findings/external-collector/
    tools:
    - lake-query.query
    - records.write_note
    - collector-probe.status
    prompts:
      real: prompts/collector-analyst.real.yml
      shadow: prompts/collector-analyst.shadow.yml
    schedule:
      on_calendar: '*-*-* 06:10:00 UTC'
      lanes:
      - real
      - shadow
    state:
    - cursor.json
    roster:
      recall: true
  invariants:
  - file: invariants/criteria.yml
  entry_points:
  - group: homelabnext.invariants.checks
    name: external_collector
    object: hnx_modules.external_collector.checks:register
  detections:
  - file: detections/collector-credential-reuse.yml
  docs:
  - file: docs/external-collector.md
data:
- id: sessions
  kind: lake-table
  table: table:collector.sessions
  description: one row per connection attempt the collector saw
  export:
    format: parquet
    via: role:collector_receiver
  import:
    format: parquet
    via: role:collector_receiver
  retention:
    days: 180
- id: samples
  kind: object-prefix
  prefix: samples/
  description: files dropped on the collector, with their sidecars
  export:
    format: object-tree
    via: role:collector_receiver
  import:
    format: object-tree
    via: role:collector_receiver
  retention:
    days: 90
- id: report
  kind: object-prefix
  prefix: publish/
  description: rendered report items offered for publishing
  export:
    format: object-tree
    via: role:collector_receiver
  import:
    format: object-tree
    via: role:collector_receiver
  retention:
    days: 30
- id: findings
  kind: records-prefix
  prefix: findings/external-collector/
  description: the agent's finding notes
  export:
    format: markdown-tree
    via: role:collector_receiver
  import:
    format: markdown-tree
    via: role:collector_receiver
  retention:
    keep: forever
lanes:
  production: real
  real:
    writes:
    - findings/external-collector/
    - state/external-collector/
    description: what consumers read
  shadow:
    writes:
    - findings/external-collector-shadow/
    - state/external-collector-shadow/
    compare_to: real
    description: a candidate prompt or model, graded against the real lane
config:
  edge_region:
    type: string
    description: the provider region the edge host runs in
    default: region-example-1
    overlay: required
  batch_signing:
    type: secret
    description: the token the edge signs batches with
    default: secret:collector/ingest-token
    overlay: required
  receiver:
    type: svc
    description: the registry service the edge sends batches to
    default: svc:collector-receiver
    overlay: optional
  batch_every_s:
    type: duration_s
    description: how often the edge ships a batch
    default: 900
    overlay: optional
  sample_max_bytes:
    type: integer
    description: files larger than this are hashed, not kept
    default: 16777216
    overlay: optional
  mode:
    type: enum
    description: listen on every bait port, or only the low-noise set
    values:
    - full
    - quiet
    default: quiet
    overlay: optional
lifecycle:
  install:
    playbook: playbooks/install.yml
    note: the receiver first, then the edge
  upgrade:
    playbook: playbooks/upgrade.yml
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit:
    - inventory
    - playbooks
    - iac
    - live-refs
    - monitoring
    - secret-names
    - dns
    - proxy
    - contributions
author: agent:example-builder
product:
  name: northwind-objects
  display: Northwind Objects
  version: '1.0'
