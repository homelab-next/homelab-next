# SPDX-License-Identifier: Apache-2.0
# negative: rejected by the JSON Schema layer (role is an Ansible role name, not a path)
controls:
  ssh-hardening:
    layer: identity
    description: Key-only SSH and no direct root login.
    role: ../roles/ssh
    verify: sshd -T shows passwordauthentication no
baselines:
  base:
    description: What every in-scope guest gets.
    controls: [ssh-hardening]
