# SPDX-License-Identifier: Apache-2.0
# A provider is either proved by a conformance target or provisional, not both.
id: example-object-store
kind: provider
title: Object store on Northwind Objects
description: Fills the object-store slot with Northwind Objects, an S3-compatible store; proved by the
  object-store conformance suite through the shared S3 adapter.
owner: platform-team
status: draft
version: 0.1.0
product:
  name: northwind-objects
  display: Northwind Objects
  aliases:
  - nwobjects
  version: 3.1.4
licence:
  kind: open-source
  spdx: Apache-2.0
credentials:
- secret: secret:object-store/access-key
  identity: key-pair
  purpose: the access key pair consumers sign requests with
- secret: secret:object-store/admin-token
  identity: token
  purpose: the store's own admin API, used by the role only
identifiers:
- kind: dns-name
  name: objects
  on_remove: keep
- kind: bucket
  name: lake
  on_remove: keep
requires:
  capabilities:
  - cap: cap:secrets
    purpose: the access key pair is read by name at run time
  hosts:
  - role: store
    kind: vm
    exposure: internal
    footprint:
      cpu: 2
      memory_mb: 1024
      disk_gb: 200
    roles:
    - role:northwind_objects
    purpose: runs the store
provides:
- slot: cap:object-store
  formats:
  - format: s3
    version: '2006-03-01'
  adapter: homelabnext.conform.adapters.s3:make_object_store
  features:
  - metadata
  conformance:
    target: conformance/target.yml
  migration:
    format: object-tree
    export: role:northwind_objects
    import: role:northwind_objects
  provisional: true
  reason: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
contributes:
  roles:
  - file: roles/northwind_objects
  services:
  - file: registry/services.yml
  preflight:
  - role: role:northwind_objects
    hook: readiness
data:
- id: objects
  kind: object-prefix
  prefix: buckets/
  description: every bucket and object the slot's consumers stored
  export:
    format: object-tree
    via: role:northwind_objects
  import:
    format: object-tree
    via: role:northwind_objects
  retention:
    keep: forever
config:
  data_dir:
    type: path
    description: where the store keeps its data on the host
    default: /srv/objects
    overlay: optional
  access_key:
    type: secret
    description: the access key pair consumers sign with
    default: secret:object-store/access-key
    overlay: required
lifecycle:
  install:
    playbook: playbooks/install.yml
  upgrade:
    playbook: playbooks/upgrade.yml
    note: a pinned version bump; the role's upgrade hook records it
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit:
    - inventory
    - playbooks
    - live-refs
    - monitoring
    - secret-names
    - dns
    - contributions
author: agent:example-builder
