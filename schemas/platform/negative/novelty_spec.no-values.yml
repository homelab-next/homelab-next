# A profile learns at least one value column.
schema_version: "1.0"
profiles:
  - id: host-dst-port
    table: network_activity
    entity: src_endpoint.ip
    values: []
    learn_days: 28
    half_life_days: 7
    score_hours: 24
    min_support: 3
    entity_min_samples: 20
    max_values_per_entity: 200
    max_findings: 100
    emit_at: 0.5
