# SPDX-License-Identifier: Apache-2.0
[build-system]
# license = "<SPDX expression>" needs setuptools 77; the upper bound keeps builds reproducible
# until a new major has been tried (dependabot proposes the bump).
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "homelabnext"
dynamic = ["version"]
description = "Contracts, libraries and conformance tests for a modular, swappable security-and-AI lab."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The HomelabNext contributors" }]
keywords = ["homelab", "soc", "conformance", "ocsf", "sigma"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Information Technology",
]
# The core is standard library only, so `hnx --help` works on a bare interpreter.  Each library
# family declares what it needs as an extra; a subcommand whose extra is missing says so.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
schema = ["jsonschema>=4.18", "referencing>=0.30"]
# everything the contracts-and-libraries drop needs at run time
core = ["PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]
detections = ["PyYAML>=6"]
test = ["pytest>=8", "pytest-cov>=5", "coverage>=7.10", "setuptools>=77,<85", "PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]
dev = ["pytest>=8", "pytest-cov>=5", "coverage>=7.10", "setuptools>=77,<85", "ruff>=0.6", "PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]
# optional: only needed to run the role/playbook tests that shell out to ansible
ansible = ["ansible-core>=2.16"]
# the lake library: DuckDB local queries, Iceberg tables over a SQLite catalog, Arrow batches
lake = [
  "duckdb>=1.5",
  "pyarrow>=26",
  "pyiceberg[sql-sqlite,pyiceberg-core]>=0.12",
]
# the swap kit: the registry flip and decommission scan need PyYAML, the swap record needs jsonschema
swap = ["PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]
# the agent profile compiler and context-pack assembler
agent = ["PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]
# planned families (declared so names are stable; their packages arrive in later waves)
trino = ["trino>=0.328"]
records = ["pydantic>=2"]
decide = ["pydantic>=2"]
nats = ["nats-py>=2.7"]
# the read-only MCP server over the repository (`hnx mcp serve`, docs/mcp.md): the official SDK
# (1.x and 2.x both work; homelabnext/mcp/server.py is the only module that imports it)
mcp = ["mcp>=1.29,<3", "PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]

[project.scripts]
hnx = "homelabnext.cli:main"

# Optional invariants plugins are discovered through this group (see homelabnext.invariants.api).
[project.entry-points."homelabnext.invariants.checks"]
x09_customizations = "homelabnext.customization.plugins.x09_customizations:register"
x10_conformance = "homelabnext.conform.plugins.x10_conformance:register"

[project.urls]
Homepage = "https://github.com/homelab-next/homelab-next"
Issues = "https://github.com/homelab-next/homelab-next/issues"

# schemas/, profiles/ and examples/ stay at the repository root (single source of truth) and are
# copied into the wheel as homelabnext/_data/ by the build_py hook in setup.py; MANIFEST.in puts
# them in the sdist.  Runtime lookup: homelabnext/paths.py.

[tool.setuptools.dynamic]
version = { attr = "homelabnext._version.VERSION" }

[tool.setuptools.packages.find]
# conformance.protocols holds the capability contracts that the broker, the StackStorm bridge and
# several adapters import at run time, so the wheel carries it (as part of the `conformance`
# namespace package; the repo-level conformance/ has no __init__.py).  The rest of conformance/
# (suites, fakes, targets) needs a source checkout and stays out:
# tests/packaging/test_runtime_imports_packaged.py
include = ["homelabnext*", "conformance.protocols"]

[tool.setuptools.package-data]
homelabnext = [
  "generators/templates/*.tmpl",
  "decide/examples/*.yml",
  "decide/safety_specs/*.yml",
  "golden/examples/*.yml",
  "golden/examples/codemode/*.yml",
  "agent/*.yml",
  "agent/terms.md",
  "agent/prompts/templates/*.yml",
  "agent/prompts/injection/*.yml",
  "status/maps/static/*.js",
  "status/maps/static/*.css",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
ignore = ["E501", "PT018", "E741", "PT006"]  # long fixture strings; composite asserts and short names are accepted style here

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "E402", "PT011"]
"tests/**" = ["B011", "E402", "PT011"]
"conformance/**" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tools/tests", "tests", "conformance"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "live: needs a real server or container; never runs in the default CI job",
  "slow: takes more than a few seconds",
]
# Q-02 (tests/suite_policy.py): per-suite time budgets in seconds (a suite = a test file's first two
# directories; HNX_SUITE_BUDGET_SCALE multiplies them), and the only legitimate skip reasons --
# any other skip fails.  `pytest --suite-times` prints the table.
suite_budget_default = "60"
suite_budgets = [
  # runs ansible-playbook against localhost (skipped where ansible is absent); 900 since the
  # baseline-control roles (21 roles, each config hook run end to end against fake daemons), 1080
  # since the serving roles (model store, vLLM, Open WebUI): about 0.85s a playbook start and 0.35s
  # a task, spread thinly over 445 tests, measured 850-920s on CI runners after model_store's
  # per-file stats became one module call; 1200 since main's own CI measured 1085s and 1096s
  # (2026-10-24/25), over 1080 with no test changed
  "tests/roles = 1200",
  "tools/tests = 240",
  # the golden suites: run whole they take about 20 s (2026-10-26, a local 4-core box), but the
  # code-mode report fixture (module scope, about 13 s) runs once in every CI shard that draws a
  # test of its module, and the merge sums every shard's time: 34.2 s in four shards (2026-10-25),
  # 61.0 s in six (2026-10-26, over the 60 s default); 90 is 1.5x that
  "tests/golden = 90",  # the gate tools run pytest, git and builds in subprocesses
  "tests/packaging = 120",  # builds and installs the wheel and the sdist
  # each test builds the whole repository graph (about 2s a build), so the suite grows with the docs;
  # 100 since CI measured 91s with 30 ADRs; 130 since CI measured 100.8s with 32 ADRs and the
  # md-levels pages (2026-10-25)
  "tests/graph = 130",
  # the read-only server starts the MCP SDK over stdio and builds the repository graph, and the
  # catalog's file-level rules (record files, locks, renders, imports) each copy the catalog
  "tests/mcp = 90",
  # every suite against its fake, the lab adapters over their stand-ins and records' interleaving
  # check (both wait in real time), the codemode suites' real programs, and the CLI report over
  # every suite and mutant. Until 2026-10-26 this
  # suite also held the mutant sweeps and was raised from 60 to 150 in five steps as they grew;
  # without them it measured 84.1s on a local 4-core box (2026-10-26), where it took 136s with
  # them, so 110 leaves it the headroom it had and the sweeps no longer push it
  "tests/conform = 110",
  # the sweeps: each registered mutant through its whole suite (test_conform_mutants.py, the
  # protocol mutants) and X-10 end to end over every suite (the CLI report tests, one of which
  # also runs every suite and mutant once, stay in tests/conform). They grow with
  # every check and mutant, so this budget is the one to raise as they do: 50.0s on the same box
  # (2026-10-26), 75 is 1.5x that
  "tests/conform_sweeps = 75",
]
skip_reasons = [
  "^could not import '[A-Za-z0-9_.]+'",  # pytest.importorskip: an optional extra is not installed
  "\\bnot installed\\b",  # an external tool (shellcheck, ansible, make, dnsmasq) is absent
  "\\bnot available\\b",  # a runtime facility (docker compose, unprivileged nft) is absent
  "^needs (git|a git checkout)$",  # run from an sdist or without git
  "^no sh/awk$",
  "^POSIX file modes$",
  "^systemd too old",
  "^no shipped wazuh snapshot",
]
quarantine_max_days = "90"
