# SPDX-License-Identifier: Apache-2.0
[build-system]
# license = "<SPDX expression>" needs setuptools 77; the upper bound keeps builds reproducible
# until a new major has been tried (dependabot proposes the bump).
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "homelabnext"
dynamic = ["version"]
description = "Contracts, libraries and conformance tests for a modular, swappable security-and-AI lab."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The HomelabNext contributors" }]
keywords = ["homelab", "soc", "conformance", "ocsf", "sigma"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Information Technology",
]
# The core is standard library only, so `hnx --help` works on a bare interpreter.  Each library
# family declares what it needs as an extra; a subcommand whose extra is missing says so.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
schema = ["jsonschema>=4.18", "referencing>=0.30"]
# everything the contracts-and-libraries drop needs at run time
core = ["PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]
detections = ["PyYAML>=6"]
test = ["pytest>=8", "pytest-cov>=5", "coverage>=7.10", "setuptools>=77,<85", "PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]
dev = ["pytest>=8", "pytest-cov>=5", "coverage>=7.10", "setuptools>=77,<85", "ruff>=0.6", "PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]
# optional: only needed to run the role/playbook tests that shell out to ansible
ansible = ["ansible-core>=2.16"]
# the lake library: DuckDB local queries, Iceberg tables over a SQLite catalog, Arrow batches
lake = [
  "duckdb>=1.5",
  "pyarrow>=26",
  "pyiceberg[sql-sqlite,pyiceberg-core]>=0.12",
]
# the swap kit: the registry flip and decommission scan need PyYAML, the swap record needs jsonschema
swap = ["PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]
# the agent profile compiler and context-pack assembler
agent = ["PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]
# trino and nats are imported (homelabnext/lake/trino.py, homelabnext/conform/adapters/
# nats_jetstream.py); records and decide declare pydantic, which no module imports yet (kept so
# the extra names stay stable until the records and decide validation choice is made)
# the semantic context adapter (hybrid BM25 + dense retrieval; txtai brings torch, so it is opt-in)
context-semantic = ["txtai>=9.14"]
trino = ["trino>=0.328"]
records = ["pydantic>=2"]
decide = ["pydantic>=2"]
nats = ["nats-py>=2.7"]
# the read-only MCP server over the repository (`hnx mcp serve`, docs/mcp.md): the official SDK
# (1.x and 2.x both work; homelabnext/mcp/server.py is the only module that imports it)
mcp = ["mcp>=1.29,<3", "PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]

[project.scripts]
hnx = "homelabnext.cli:main"

# Optional invariants plugins are discovered through this group (see homelabnext.invariants.api).
[project.entry-points."homelabnext.invariants.checks"]
x09_customizations = "homelabnext.customization.plugins.x09_customizations:register"
x10_conformance = "homelabnext.conform.plugins.x10_conformance:register"

[project.urls]
Homepage = "https://github.com/homelab-next/homelab-next"
Issues = "https://github.com/homelab-next/homelab-next/issues"

# schemas/, profiles/ and examples/ stay at the repository root (single source of truth) and are
# copied into the wheel as homelabnext/_data/ by the build_py hook in setup.py; MANIFEST.in puts
# them in the sdist.  Runtime lookup: homelabnext/paths.py.

[tool.setuptools.dynamic]
version = { attr = "homelabnext._version.VERSION" }

[tool.setuptools.packages.find]
# conformance.protocols holds the capability contracts that the broker, the StackStorm bridge and
# several adapters import at run time, so the wheel carries it (as part of the `conformance`
# namespace package; the repo-level conformance/ has no __init__.py).  The rest of conformance/
# (suites, fakes, targets) needs a source checkout and stays out:
# tests/packaging/test_runtime_imports_packaged.py
include = ["homelabnext*", "conformance.protocols"]

[tool.setuptools.package-data]
homelabnext = [
  "generators/templates/*.tmpl",
  "decide/examples/*.yml",
  "decide/safety_specs/*.yml",
  "golden/examples/*.yml",
  "golden/examples/codemode/*.yml",
  "agent/*.yml",
  "agent/terms.md",
  "agent/prompts/templates/*.yml",
  "agent/prompts/injection/*.yml",
  "status/*.yml",
  "status/maps/static/*.js",
  "status/maps/static/*.css",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
ignore = ["E501", "PT018", "E741", "PT006"]  # long fixture strings; composite asserts and short names are accepted style here

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "E402", "PT011"]
"tests/**" = ["B011", "E402", "PT011"]
"conformance/**" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tools/tests", "tests", "conformance"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "live: needs a real server or container; never runs in the default CI job",
  "slow: takes more than a few seconds",
]
# Q-02 (tests/suite_policy.py): per-suite time budgets in seconds (a suite = a test file's first two
# directories; HNX_SUITE_BUDGET_SCALE multiplies them), and the only legitimate skip reasons --
# any other skip fails.  `pytest --suite-times` prints the table.
suite_budget_default = "90"  # 60 until 2026-11-23: the suites near it (maps, registry, status) sat at 58-53 s on the pool
# the setup of module-, class-, package- and session-scoped fixtures runs once in every shard that
# draws a test needing it, so it is left out of the per-suite budgets below and held to its own
# budget per suite and per shard instead (seconds): this default, or the suite's line in
# suite_shared_budgets.  The merge (tests/shard_report.py) reads these from here, not from the
# shard reports.  Measured on 12 shards (2026-11-17), the worst single shard: roles 18.8 s,
# packaging 7.9 s, graph 3.8 s, context 2.8 s, everything else 1.3 s or less.
suite_shared_budget_default = "15"
suite_shared_budgets = [
  "tests/roles = 30",  # 18.8 s measured, about 1.6x
]
suite_budgets = [
  # 2026-11-23 (operator, "I dont care about limits ... the end goal is things getting done"; GATE EDIT):
  # the budgets are a runaway-suite tripwire, not a tuned figure.  Main failed about half of its runs on runner
  # noise alone (roles 10181-10543 s against 10000 with no test changed; 8111-9927 s on the green ones; one runner's
  # speed swings a suite by 25%), and the self-hosted pool's cores run a suite about 27% slower than a hosted one.
  # Each figure below is at least 1.4x the largest total seen across recent runs (2026-11-23: main, pull requests and the pool's 3.11 shards),
  # so a slower pool shard still passes, and a suite that doubles still fails.
  # runs ansible-playbook against localhost (skipped where ansible is absent); 900 since the
  # baseline-control roles (21 roles, each config hook run end to end against fake daemons), 1080
  # since the serving roles (model store, vLLM, Open WebUI): about 0.85s a playbook start and 0.35s
  # a task, spread thinly over 445 tests, measured 850-920s on CI runners after model_store's
  # per-file stats became one module call; 1200 since main's own CI measured 1085s and 1096s
  # (2026-10-24/25), over 1080 with no test changed; 900 since a test's first run starts beside
  # the others of its module (rolerun.first_run, one ansible-playbook per CPU): 1194s -> 700s
  # summed over the six shards on a 4-CPU box (2026-10-27) against CI's 1143.6s before, so about
  # 670s on CI, and 900 is about 1.3x that; 1100 since the openbao role's restore staging,
  # downgrade witnesses and their refusal cases (pull request #358): CI measured 761s/884s (3.11/3.12)
  # before them and 942s/1169s with them as first written; the cases then moved into run_cases
  # (one ansible-playbook for many) and the service tests stopped resolving a name, 176s -> 150s
  # for the module locally against 116s before the change (3.12's runners already sat at 884s of
  # 900 before it). After that batching the pull request's CI measured 937.2s (3.11) and 844.1s
  # (3.12) summed over the six shards (2026-11-12, head 6d70f118), then 986.5s and 1055.2s with
  # the round-4 restore and record cases (head 95a9e1cc; one 3.12 shard alone took 569s): 1320
  # since, about 1.25x the slower figure; 1680 since the control-plane roles (#360) landed beside
  # them: main measured 1116.7s (3.11) and 1205.2s (3.12) at 64fb744e, and the round-6 follow-ups
  # (#361: the bus ACL's validation cases; its pinned-server cases skip in these shards, without
  # nats-server or nats-py, and run in the external-tools job) 1227.2s and 1383.5s on a first run,
  # 1106.5s and 1411.2s on the green run of head 1210441b (2026-11-12): the spread is run-to-run
  # noise; #360's own pull request measured 991s once and about 770s typically before the
  # openbao suites joined it. 1680 is about 1.2x the slower figure. 2150 since the openbao ACME,
  # node-notify, ssh_hardening check-mode and docker_engine role suites joined (#367, #366, #368,
  # #372): on 2026-11-12 3.12 measured 1791.1s (#372, a red run over 1680), 1670.2s and 1460.0s
  # (its green rerun), and 1686.5s (#373, red); 3.11 1166.2s-1344.8s. 2150 is about 1.2x the
  # slowest figure. 2800 since modules/caddy, modules/keycloak and their role suites (#392, #393,
  # #394, #395) joined: on 2026-11-14 3.12 measured 2312.4s (#398, red over 2150; a rerun failed
  # the same) and 3.11 1782s. 2800 is about 1.2x the slowest figure
  # 3700 since the cutover wave-1 modules (prometheus #421, openproject #420, garage/iceberg-rest/
  # trino #424, media #423 and tunnel #422) and their role suites: on 2026-11-15 3.12 measured
  # 3018.8s (#424, red over 2800); 3700 is about 1.2x the slowest figure with two still to land
  # 5400 since the wave-2 modules (gateway #434, orchestration #437, llamacpp #433, nifi #438, stackstorm #440) and
  # their role suites: main measured 3821s on 3.12 (7a21c99b, 2026-11-16, red over 3700) with two of them in, and the
  # stackstorm pull request 4408s on 3.12 with three; 5400 is about 1.2x the slowest figure with two still to land
  # 6800 since the rest of wave 2 (openwebui #453, media-automation #455, tts #456, gitea #457, documents #454, the media
  # tmpfs #458) and their role suites: main measured about 4530s on 3.12 (2026-11-16 evening) and a loaded-runner rerun
  # of #458 5585s, over 5400; 6800 is about 1.2x that worst figure with three of those still to land
  # 8900 since the suite moved from 6 to 12 shards per Python version (#467), and the same roles
  # suites grew: the budgeted figure no longer counts module/session fixture setup (about 34 s of
  # roles' 6277 s on 3.12, 12 shards: it is not what grew), so the rise is per-test wall time: a
  # test's first run is prefetched beside the others of its shard, and a smaller shard has a
  # relatively longer straggler tail and less to overlap.  Seconds a roles test, summed over the
  # shards (2026-11-17): 1.8-2.25 in six shards (3.11/3.12, 7 runs on main), 1.9-2.5 in twelve
  # (7 runs, the worst 2.5 on 3.12 at 2676 tests); the budget misses on PRs #455 (7211.9 s and
  # 7440.2 s on 3.12) and #458 (6953 s) were that rate at about 2900 roles tests.  8900 is about
  # 1.2x 7440.2 s, the slowest figure: shard count moves the number, so recalibrate it from a
  # twelve-shard run if the shard count changes again
  "tests/roles = 14800",  # 1.4x 10543 s, the largest figure seen
  # 300 since the orchestration conformance harness's strict fault-injection test (stage 2.8)
  # builds the controller and runs the whole suite against it: main measured 180-186 s summed
  # over the shards (2026-11-09), and the pull request that added it 245.8 s, over 240
  "tools/tests = 425",
  # the golden suites: run whole they take about 20 s (2026-10-26, a local 4-core box), but the
  # code-mode report fixture (module scope, about 13 s) runs once in every CI shard that draws a
  # test of its module, and the merge sums every shard's time: 34.2 s in four shards (2026-10-25),
  # 61.0 s in six (2026-10-26, over the 60 s default); 90 is 1.5x that
  "tests/golden = 90",  # the gate tools run pytest, git and builds in subprocesses
  # about 1,130 tests: every schema version's frozen-baseline and additivity checks and the
  # fixtures; CI measured 61.1s on 3.12 (2026-10-27, after the guest 1.6 tests, over the 60 s
  # default); 90 is about 1.5x that
  # 120 since a 12-shard run measured 98.7 s on 3.12 (#455, over 90; 73-88 s typically): about 1.2x
  "tests/schemas = 155",
  # agent profiles, packs, prompts and memory: about 1,110 tests, 40.5 s on a local 4-core box
  # (2026-11-06) after the memory retraction suites (ADR-0037 PR 3); the coverage job (budgets
  # times 2) measured 126 s on CI before the fuzz was trimmed, against the 120 s it then had; 90
  # gives the coverage run 180 s
  "tests/agent = 90",
  # the module loader, review tier, swap gate and egress suites: about 1,000 tests, measured 60.7 s
  # on a local 4-core box (2026-10-28, over the 60 s default) after the swap gate's role-trust
  # cases, each of which builds two git commits; 90 is about 1.5x that; 150 since the apply path
  # runs its limits plays with ansible-playbook (#378): 58.8 s locally (2026-11-13), CI measured
  # 109.9 s on 3.11 and 104.7 s on 3.12 (ansible-playbook starts are slower there); 200 since the
  # cutover wave-1 modules joined: 3.12 measured 152.2 s (#424, red over 150), about 1.3x
  # 300 since the wave-2 modules joined: main measured 206s on 3.12 (7a21c99b, red over 200), the stackstorm pull
  # request 222s; 300 is about 1.3x that with two module test files still to land
  "tests/modules = 525",  # 1.4x 340 s
  "tests/packaging = 120",  # builds and installs the wheel and the sdist
  # each test builds the whole repository graph (about 2s a build), so the suite grows with the docs;
  # 100 since CI measured 91s with 30 ADRs; 130 since CI measured 100.8s with 32 ADRs and the
  # md-levels pages (2026-10-25); 170 since CI measured 131.4s on 3.12 (106.1s on 3.11) after the
  # extra-address, zone IPv6 and swap-evidence docs (2026-10-27)
  "tests/graph = 195",  # 1.4x 127 s
  # the read-only server starts the MCP SDK over stdio and builds the repository graph, and the
  # catalog's file-level rules (record files, locks, renders, imports) each copy the catalog
  "tests/mcp = 115",
  # 80 since the shard-report tests (subprocess pytest runs) joined: 50.5 s and 54.9 s on 3.11/3.12
  # (2026-11-17, twelve shards) against 57.8 s and 61.9 s (over the 60 s default) with the tests
  # of this change before they were trimmed; 80 is about 1.3x the slower figure
  "tests/gates = 95",
  # 75 since a 12-shard run measured 64.6 s on 3.11 (#455, over the 60 s default) against 42-58 s
  # typically: 1.3x the typical worst figure, 1.16x the one outlier
  "tests/compute = 90",
  # every suite against its fake, the lab adapters over their stand-ins and records' interleaving
  # check (both wait in real time), the codemode suites' real programs, and the CLI report over
  # every suite and mutant. Until 2026-10-26 this
  # suite also held the mutant sweeps and was raised from 60 to 150 in five steps as they grew;
  # without them it measured 84.1s on a local 4-core box (2026-10-26), where it took 136s with
  # them, so 110 leaves it the headroom it had and the sweeps no longer push it; 140 since CI
  # measured 111.2s on 3.12 (2026-11-05) after the lake-query count_by/cardinality and lake-catalog
  # batch-source checks (ADR-0036), about 1.25x that; 180 since the agent-runner suite (ADR-0051
  # step 2), whose every check starts real processes under the development launcher (about 8s a
  # run): 147.5s and then, after its gateway wait came down to 0.1s and its enough-checks test
  # stopped rerunning it, 137.4s on a shared local 4-core box (2026-11-09); 180 is about 1.3x
  "tests/conform = 200",  # 1.4x 136 s
  # the sweeps: each registered mutant through its whole suite (test_conform_mutants.py, the
  # protocol mutants) and X-10 end to end over every suite (the CLI report tests, one of which
  # also runs every suite and mutant once, stay in tests/conform). They grow with
  # every check and mutant, so this budget is the one to raise as they do: 50.0s on the same box
  # (2026-10-26), 75 is 1.5x that; 210 since the agent-runner suite's mutants, each a whole
  # run of real processes (about 8s): 143.7s, then 159.1s with its tenth mutant and three more
  # checks, then 185.6s with the two stale-record checks, on a shared local 4-core box
  # (2026-11-09); 240 is about 1.3x
  "tests/conform_sweeps = 270",  # 1.4x 181 s
]
skip_reasons = [
  "^could not import '[A-Za-z0-9_.]+'",  # pytest.importorskip: an optional extra is not installed
  "\\bnot installed\\b",  # an external tool (shellcheck, ansible, make, dnsmasq) is absent
  "\\bnot available\\b",  # a runtime facility (docker compose, unprivileged nft) is absent
  "^needs (git|a git checkout)$",  # run from an sdist or without git
  "^no sh/awk$",
  "^POSIX file modes$",
  "^systemd too old",
  "^no shipped wazuh snapshot",
]
quarantine_max_days = "90"
