name: controller-fail
roles: model_roles.json
domain: example.internal
master_key: secret:llm-gateway/master-key
database_url: secret:llm-gateway/database-url
backends:
  svc:vllm-a: {locality: local, port: 8000}
  svc:vllm-b: {locality: local, port: 8000}
  svc:vllm-d: {locality: local, port: 8000}
  svc:vllm-e: {locality: local, port: 8000}
  svc:vllm-f: {locality: local, port: 8000}
  svc:vllm-g: {locality: local, port: 8000}
controller:
  config: controller.yaml
  base_url: https://llm-gateway.example.internal/v1
  homes:
    vllm-a: homes/vllm-a
    vllm-b: homes/vllm-b
    vllm-d: homes/vllm-d
    vllm-e: homes/vllm-e
    vllm-f: homes/vllm-f
    vllm-g: homes/vllm-g
