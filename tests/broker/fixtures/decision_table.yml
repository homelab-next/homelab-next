# Table-driven broker fixtures: manifest x tier x handler x approval -> decision.
# `approval` is built by the test: none | valid | wrong-digest | denied | self | self-spelling |
# expired | expires-at-past | future | before-request | unlisted | other-issuer | agent | altered |
# listed-underscore | listed-dot | agent-spelling
# (altered = a valid approval, then the request params change; the digest no longer matches;
# listed-* = a spelling variant of the allowlisted approver-one: a distinct account, never it;
# agent-spelling = an allowlisted human entry whose subject folds to a granted profile).
manifests:
  enforce:
    manifest_id: table-enforce
    default: deny
    mode: enforce
    approval_ttl_s: 900
    actions:
      - {action: service.status, tier: read, handler: handlers/status.sh, requires_approval: false}
      - {action: records.annotate, tier: write, handler: handlers/annotate.sh, requires_approval: false}
      - {action: records.purge, tier: write, handler: handlers/purge.sh, requires_approval: true}
      - {action: service.restart, tier: execute, handler: handlers/restart.sh, requires_approval: true}
      - {action: host.reboot, tier: privileged, handler: handlers/reboot.sh, requires_approval: true}
    grants:
      - {profile: "profile:reader", actions: [service.status], max_tier: read}
      - {profile: "profile:writer", actions: [service.status, records.annotate, records.purge], max_tier: write}
      - {profile: "profile:operator", actions: [service.status, service.restart, host.reboot], max_tier: execute}
      - {profile: "profile:ops-bot", actions: [service.status], max_tier: read}
    approvers:
      - {issuer: sso, subject: approver-one, kind: human}
      - {issuer: sso, subject: ops_bot, kind: human}
      - {issuer: sso, subject: operator, kind: human}
      - {issuer: agents, subject: writer}
  shadow:
    manifest_id: table-shadow
    default: deny
    mode: shadow
    actions:
      - {action: service.status, tier: read, handler: handlers/status.sh, requires_approval: false}
    grants:
      - {profile: "profile:reader", actions: [service.status], max_tier: read}
  no-handler:
    manifest_id: table-no-handler
    default: deny
    mode: enforce
    actions:
      - {action: service.status, tier: read, handler: "", requires_approval: false}
    grants:
      - {profile: "profile:reader", actions: [service.status], max_tier: read}

cases:
  # ---- default deny
  - {name: unknown-action, manifest: enforce, actor: "profile:operator", action: host.format, approval: none, verdict: deny, reason: default-deny}
  - {name: unknown-actor, manifest: enforce, actor: "profile:stranger", action: service.status, approval: none, verdict: deny, reason: not-granted}
  - {name: action-not-in-grant, manifest: enforce, actor: "profile:reader", action: records.annotate, approval: none, verdict: deny, reason: not-granted}
  - {name: empty-manifest-actions, manifest: no-handler, actor: "profile:reader", action: service.restart, approval: none, verdict: deny, reason: default-deny}
  # ---- tier
  - {name: read-allowed, manifest: enforce, actor: "profile:reader", action: service.status, approval: none, verdict: allow, reason: allowed}
  - {name: write-allowed, manifest: enforce, actor: "profile:writer", action: records.annotate, approval: none, verdict: allow, reason: allowed}
  - {name: tier-above-grant, manifest: enforce, actor: "profile:operator", action: host.reboot, approval: valid, verdict: deny, reason: tier-exceeds-grant, note: "grant max_tier is execute; reboot is privileged"}
  # ---- handler
  - {name: handler-missing, manifest: no-handler, actor: "profile:reader", action: service.status, approval: none, verdict: deny, reason: handler-missing}
  # ---- approval
  - {name: execute-needs-approval, manifest: enforce, actor: "profile:operator", action: service.restart, approval: none, verdict: needs-approval, reason: approval-required}
  - {name: write-flagged-needs-approval, manifest: enforce, actor: "profile:writer", action: records.purge, approval: none, verdict: needs-approval, reason: approval-required}
  - {name: execute-approved, manifest: enforce, actor: "profile:operator", action: service.restart, approval: valid, verdict: allow, reason: approved}
  - {name: digest-mismatch, manifest: enforce, actor: "profile:operator", action: service.restart, approval: wrong-digest, verdict: deny, reason: approval-digest-mismatch}
  - {name: altered-after-approval, manifest: enforce, actor: "profile:operator", action: service.restart, approval: altered, verdict: deny, reason: approval-digest-mismatch}
  - {name: approval-denied, manifest: enforce, actor: "profile:operator", action: service.restart, approval: denied, verdict: deny, reason: approval-denied}
  - {name: self-approval, manifest: enforce, actor: "profile:operator", action: service.restart, approval: self, verdict: deny, reason: approval-self-approved}
  - {name: approval-expired, manifest: enforce, actor: "profile:operator", action: service.restart, approval: expired, verdict: deny, reason: approval-expired}
  - {name: self-approval-other-spelling, manifest: enforce, actor: "profile:operator", action: service.restart, approval: self-spelling, verdict: deny, reason: approval-self-approved}
  - {name: expires-at-in-the-past, manifest: enforce, actor: "profile:operator", action: service.restart, approval: expires-at-past, verdict: deny, reason: approval-expired}
  - {name: approved-in-the-future, manifest: enforce, actor: "profile:operator", action: service.restart, approval: future, verdict: deny, reason: approval-time-invalid}
  - {name: approved-before-request, manifest: enforce, actor: "profile:operator", action: service.restart, approval: before-request, verdict: deny, reason: approval-time-invalid}
  - {name: approver-not-listed, manifest: enforce, actor: "profile:operator", action: service.restart, approval: unlisted, verdict: deny, reason: approval-approver-not-allowed}
  - {name: approver-wrong-issuer, manifest: enforce, actor: "profile:operator", action: service.restart, approval: other-issuer, verdict: deny, reason: approval-approver-not-allowed}
  - {name: agent-approves-agent, manifest: enforce, actor: "profile:operator", action: service.restart, approval: agent, verdict: deny, reason: approval-agent-approver}
  # the allowlist is exact: a spelling variant of a listed approver is another account
  - {name: approver-variant-underscore, manifest: enforce, actor: "profile:operator", action: service.restart, approval: listed-underscore, verdict: deny, reason: approval-approver-not-allowed}
  - {name: approver-variant-dot, manifest: enforce, actor: "profile:operator", action: service.restart, approval: listed-dot, verdict: deny, reason: approval-approver-not-allowed}
  # folding still refuses: an allowlisted subject that folds to a granted profile is an agent
  - {name: agent-approver-other-spelling, manifest: enforce, actor: "profile:operator", action: service.restart, approval: agent-spelling, verdict: deny, reason: approval-agent-approver}
  # ---- mode
  - {name: shadow-records-but-does-not-enforce, manifest: shadow, actor: "profile:reader", action: service.status, approval: none, verdict: allow, reason: allowed, enforced: false}
  - {name: shadow-deny-not-enforced, manifest: shadow, actor: "profile:reader", action: host.format, approval: none, verdict: deny, reason: default-deny, enforced: false}
  - {name: enforce-is-enforced, manifest: enforce, actor: "profile:reader", action: service.status, approval: none, verdict: allow, reason: allowed, enforced: true}

# Ownership (P-07): who may read or cancel an existing request.  The request is always the one the
# test builds for `owner`; `caller` is who asks.  Only the owner, compared normalized, is allowed.
access_cases:
  - {name: owner-reads, manifest: enforce, owner: "profile:operator", caller: "profile:operator", operation: read, verdict: allow, reason: allowed}
  - {name: owner-cancels, manifest: enforce, owner: "profile:operator", caller: "profile:operator", operation: cancel, verdict: allow, reason: allowed}
  - {name: owner-other-spelling, manifest: enforce, owner: "profile:ops-bot", caller: "profile:ops_bot", operation: cancel, verdict: allow, reason: allowed}
  - {name: other-caller-reads, manifest: enforce, owner: "profile:operator", caller: "profile:reader", operation: read, verdict: deny, reason: not-request-owner}
  - {name: other-caller-cancels, manifest: enforce, owner: "profile:operator", caller: "profile:reader", operation: cancel, verdict: deny, reason: not-request-owner}
  - {name: same-grant-is-not-owner, manifest: enforce, owner: "profile:writer", caller: "profile:operator", operation: cancel, verdict: deny, reason: not-request-owner, note: "both are granted service.status; a shared grant does not share requests"}
  - {name: approver-is-not-owner, manifest: enforce, owner: "profile:operator", caller: "profile:approver-one", operation: read, verdict: deny, reason: not-request-owner}
  - {name: unknown-caller, manifest: enforce, owner: "profile:operator", caller: "profile:stranger", operation: read, verdict: deny, reason: not-request-owner}
  - {name: empty-caller, manifest: enforce, owner: "profile:operator", caller: "", operation: cancel, verdict: deny, reason: not-request-owner}
  - {name: other-kind-same-name, manifest: enforce, owner: "profile:operator", caller: "agent:operator", operation: cancel, verdict: deny, reason: not-request-owner}
  - {name: prefix-is-not-owner, manifest: enforce, owner: "profile:operator", caller: "profile:operator-two", operation: read, verdict: deny, reason: not-request-owner}
  - {name: shadow-not-owner-not-enforced, manifest: shadow, owner: "profile:reader", caller: "profile:writer", operation: read, verdict: deny, reason: not-request-owner, enforced: false}
