# guest 1.5: a NIC firewall off with an exemption that names where it is filtered instead
id: guest:infer-box
kind: vm
provisioning: terraform
placement: {node: hv-a, vmid: 240}
resources:
  cpu: {cores: 8}
  memory: {size_mb: 32768}
  disks: [{name: rootfs, size_gb: 40, pool: fast}]
image: {logical: debian-12-cloudinit, kind: template-clone, os_type: linux-6}
network:
  zone: compute
  ip: 198.51.100.140
  firewall: disabled
  firewall_exemption:
    reason: Filtered on the libvirt host by its own nftables ruleset.
    review_by: "2027-03-31"
    filtered_by: guest:hv-a
capability: cap:inference
owners: {primary: ml-team}
