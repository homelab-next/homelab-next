# SPDX-License-Identifier: Apache-2.0
# 1.3-only: named baselines with a per-guest addition and a documented removal
id: guest:hv-a
kind: host
provisioning: host-only
placement: {node: hv-a}
network: {zone: mgmt, ip: 192.0.2.10}
capability: cap:events
owners: {primary: platform-team}
baseline:
  names: [server, exposed]
  add: [network-sensor]
  remove:
    - {control: vuln-scan, reason: "Scanned out of band by the hypervisor vendor's own tool.", review_by: "2027-03-31"}
