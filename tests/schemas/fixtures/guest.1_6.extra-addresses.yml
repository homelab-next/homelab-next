# SPDX-License-Identifier: Apache-2.0
# guest 1.6: a model runtime that also sends from its IPv6 address and its containers' bridge
id: guest:infer-box
kind: vm
provisioning: terraform
placement: {node: hv-a, vmid: 240}
resources:
  cpu: {cores: 8}
  memory: {size_mb: 32768}
  disks: [{name: rootfs, size_gb: 40, pool: fast}]
image: {logical: debian-12-cloudinit, kind: template-clone, os_type: linux-6}
network:
  zone: compute
  ip: 198.51.100.140
  extra_addresses:
    - {address: "2001:db8:0:82::8c", why: The SLAAC address its IPv6 traffic leaves by.}
    - {address: 198.51.100.200, why: The bridge address its serving containers are NATted to.}
capability: cap:inference
owners: {primary: ml-team}
