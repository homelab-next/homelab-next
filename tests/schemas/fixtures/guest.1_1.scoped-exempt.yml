# SPDX-License-Identifier: Apache-2.0
id: guest:scratch-a
display_name: scratch-a
kind: vm
provisioning: terraform
placement: {node: hv-a, vmid: 9001, vmid_scheme: freeform}
resources:
  cpu: {cores: 4, type: host}
  memory: {size_mb: 16384, balloon_min_mb: null}
  disks:
    - {name: rootfs, size_gb: 20, pool: fast, discard: true, format: raw}
    - {name: data, size_gb: 200, pool: bulk}
image: {logical: debian-12-cloudinit, kind: template-clone, os_type: linux-6}
cloudinit:
  user: ansible
  ssh_authorized_keys: [operator]
  packages: [qemu-guest-agent]
  timezone: UTC
network:
  zone: data
  ip: 198.51.100.41
  gateway: inherit
  bridge: default
  vlan_tag_mode: in_bridge
  firewall: disabled
  firewall_exemption:
    reason: Throwaway guest used for packet-capture tests; replies must bypass the filter.
    review_by: "2027-01-31"
scope: out
firewall_rules:
  inbound_allow:
    - {name: ssh-from-mgmt, proto: tcp, ports: "22", source: "zone:mgmt"}
    - {name: query-api, proto: tcp, ports: "8443", source: "198.51.100.128/25"}
    - {name: ping, proto: icmp, source: any}
capability: cap:lake-query
capability_groups: [cap_lake, cap_query]
tags: [prod, stateful]
shared_dirs: []
backup:
  policy: daily
  include_memory: false
  retain: {daily: 7, weekly: 4, monthly: 6}
  export_hook: lake-export
lifecycle: {on_boot: true, ignore_changes: [clone]}
owners: {primary: data-team, oncall: platform-team}
