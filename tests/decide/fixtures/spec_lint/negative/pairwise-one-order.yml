# SPDX-License-Identifier: Apache-2.0
# Fails rule: pairwise (only one order asked)
id: lint-bad-pairwise-one-order
version: 1

question_set:
  - {text: "Is {left} riskier than {right}?", compare: [left, right]}
decision_table:
  - {when: matched, then: accept}
  - {when: otherwise, then: escalate}
tiers:
  - {name: floor}
  - {name: small, model_role: "mdl:fast-classifier", timeout_ms: 400}
error_direction: fail-closed
on_error: escalate
latency_budget_ms: 800
sample_audit_pct: 5
