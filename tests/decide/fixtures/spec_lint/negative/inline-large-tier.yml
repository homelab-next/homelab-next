# SPDX-License-Identifier: Apache-2.0
# Fails rule: inline (a slow tier on an inline spec)
id: lint-bad-inline-large-tier
version: 1
callers: [inline]
question_set:
  - Does the alert name a known host?
decision_table:
  - {when: matched, then: accept}
  - {when: otherwise, then: escalate}
tiers:
  - {name: floor}
  - {name: small, model_role: "mdl:fast-classifier", timeout_ms: 400}
  - {name: large, model_role: "mdl:main-reasoner", timeout_ms: 400}
error_direction: fail-closed
on_error: escalate
latency_budget_ms: 800
sample_audit_pct: 5
