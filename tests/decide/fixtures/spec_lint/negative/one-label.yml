# Fails rule: labels (1 < 2)
id: lint-bad-one-label
version: 1

question_set:
  - text: Is the alert real?
    labels: ["yes"]
decision_table:
  - {when: matched, then: accept}
  - {when: otherwise, then: escalate}
tiers:
  - {name: floor}
  - {name: small, model_role: "mdl:fast-classifier", timeout_ms: 400}
error_direction: fail-closed
on_error: escalate
latency_budget_ms: 800
sample_audit_pct: 5
