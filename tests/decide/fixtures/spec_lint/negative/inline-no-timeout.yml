# Fails rule: inline (model tier without a deadline)
id: lint-bad-inline-no-timeout
version: 1
callers: [inline]
question_set:
  - Does the alert name a known host?
decision_table:
  - {when: matched, then: accept}
  - {when: otherwise, then: escalate}
tiers:
  - {name: floor}
  - {name: small, model_role: "mdl:fast-classifier"}
error_direction: fail-closed
on_error: escalate
latency_budget_ms: 800
sample_audit_pct: 5
