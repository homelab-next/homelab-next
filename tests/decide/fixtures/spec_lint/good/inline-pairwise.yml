# Passes every rule: an inline spec (fast tiers only, 1 s budget, model tier with a deadline),
# its own label set, and a pairwise question asked in both orders.
id: lint-good-inline
version: 1
callers: [inline, batch]
question_set:
  - Does the alert name a known host?
  - text: How severe is the alert?
    labels: [none, low, medium, high, critical]
  - {text: "Is {left} riskier than {right}?", compare: [left, right], labels: ["yes", "no"]}
  - {text: "Is {right} riskier than {left}?", compare: [right, left], labels: ["yes", "no"]}
decision_table:
  - {when: known host, then: accept}
  - {when: otherwise, then: escalate}
tiers:
  - {name: floor}
  - {name: small, model_role: "mdl:fast-classifier", min_confidence: 0.9, timeout_ms: 400}
error_direction: fail-closed
on_error: escalate
latency_budget_ms: 800
sample_audit_pct: 5
