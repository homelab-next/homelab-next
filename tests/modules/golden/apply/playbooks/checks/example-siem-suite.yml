# generated by hnx modules render; do not edit
# The readiness and then the health hook of every role of module example-siem-suite, on each
# group it is placed on. Read-only by the role interface v1 contract.

- name: "every module group is in the inventory"
  hosts: localhost
  gather_facts: false
  tags: [always]
  tasks:
    - name: "refuse an inventory without the module groups"
      ansible.builtin.assert:
        that: "(groups[item] | default([])) | length > 0"
        fail_msg: "{{ item }} holds no host: render the inventory with hnx guests render --target inventory --selection (the selection this playbook was rendered from)"
        quiet: true
      loop: [mod_example_siem_suite_suite]

- name: "module example-siem-suite: host role suite: readiness, health"
  hosts: mod_example_siem_suite_suite
  become: true
  gather_facts: false
  tasks:
    - name: "readiness: example_siem_suite"
      ansible.builtin.include_role:
        name: "../../examples/modules/example-siem-suite/roles/example_siem_suite"
        tasks_from: readiness
        apply: {tags: [readiness]}
      tags: [readiness]
    - name: "health: example_siem_suite"
      ansible.builtin.include_role:
        name: "../../examples/modules/example-siem-suite/roles/example_siem_suite"
        tasks_from: health
        apply: {tags: [health]}
      tags: [health]
