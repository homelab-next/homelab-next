# A staged selection (fictional; tests/modules/test_planned_slots.py): the small-lab profile
# (examples/modules/sites/small-lab.yml) as a lab building in stages declares it. Three required
# core slots are incumbents (rows of the example core registry, examples/services.yml), three are
# planned (not built yet: each a warning with its why and review_by, never a provider), and the
# rest are module providers. The example tree's core-staff and external-collector require
# orchestration, records and agent-runtime, so those stay providers here (planned, each would be
# refused by name); the deploy test, whose lab ships one module, plans six.
profile: small-lab-staged
hosts:
  core:
    kind: host
    addresses: [192.0.2.10]
    capacity: {cpu: 16, memory_mb: 32768, disk_gb: 2000, gpu_memory_mb: 16384}
    resources: [{name: gpu0, kind: gpu}]
    headroom: {memory_mb: 4096}
  data:
    kind: vm
    addresses: [192.0.2.11, 2001:db8:20::11]
    capacity: {cpu: 8, memory_mb: 16384, disk_gb: 4000}
    headroom: {memory_mb: 2048}
  collector-edge:
    kind: external
    capacity: {cpu: 1, memory_mb: 1024, disk_gb: 25}
    headroom: {memory_mb: 256}
slots:
  backup: [{provider: example-platform, instance: platform, placement: {platform: core}}]
  broker: [{provider: example-platform, instance: platform}]
  records: [{provider: example-platform, instance: platform}]
  orchestration: [{provider: example-platform, instance: platform}]
  agent-runtime: [{provider: example-agent-runtime, instance: runtime, placement: {runtime: core}}]
  object-store: [{provider: example-object-store, instance: samples, placement: {store: data}}]
  lake-catalog: [{provider: example-lake, instance: lake, placement: {lake: data}}]
  lake-query: [{provider: example-lake, instance: lake}]
  siem-source: [{provider: example-siem-suite, instance: siem, placement: {suite: core}}]
  hot-index: none
  detections: [{provider: example-siem-suite, instance: siem}]
  notify: [{provider: example-siem-suite, instance: siem}]
  log-pipeline: pass-through
incumbents:
  secrets: {service: secrets, why: "the core's secret store role, deployed before any module"}
  dns: {service: dns, why: "the lab's existing resolvers"}
  events: {service: events, why: "the core's events bus role"}
planned:
  idp: {why: "an identity provider module, the next stage", review_by: "2027-01-15"}
  edge: {why: "the front door, after idp", review_by: "2027-01-15"}
  inference: {why: "a model server module, once the GPU host is up", review_by: "2027-03-01"}
features:
  external-collector:
    placement: {edge: collector-edge, receiver: data}
    config: {edge_region: region-example-2}
    agents:
      external-collector-analyst: {lanes: {real: platform, shadow: platform}}
core:
  core-staff:
    agents:
      core-staff-scorecard: {lanes: {real: platform}}
grants:
  egress:
    external-collector: {edge: [external]}  # an external host is egress: it runs outside the lab
# The site's network scope (documentation ranges only in a public example; the real one is in the
# private overlay's lab/modules.yml). The collector requires trusted.wan, and both exclusions,
# as every module that reads addresses and runs unattended must: [] means nothing is excluded.
scope:
  trusted:
    wan: [203.0.113.20/32]
    nets: [192.0.2.0/25, 2001:db8:20::/48]
    tooling: [192.0.2.200/32]
  exclude:
    unattended_mutation: []
    offensive: []
