# SPDX-License-Identifier: Apache-2.0
# A container too small for the data host's roles, with no baseline set named but base.
id: guest:small-1
kind: lxc
provisioning: terraform
placement: {node: hv-01, vmid: 212, vmid_scheme: freeform}
resources:
  cpu: {cores: 1}
  memory: {size_mb: 512}
  disks: [{name: rootfs, size_gb: 8, pool: fast}]
image: {logical: debian-12-standard, kind: tarball, os_type: l26}
network: {zone: data, ip: 192.0.2.12}
capability: cap:dns
backup: {policy: none}
owners: {primary: platform-team}
baseline: {names: [base]}
