# SPDX-License-Identifier: Apache-2.0
# The data host of the guest-hosts selection (tests/modules/test_guest_hosts.py): a VM sized for
# what small-lab places on its data host, with an IPv6 address it also sends from.
id: guest:data-1
kind: vm
provisioning: terraform
placement: {node: hv-01, vmid: 211, vmid_scheme: freeform}
resources:
  cpu: {cores: 8}
  memory: {size_mb: 16384}
  disks:
    - {name: rootfs, size_gb: 64, pool: fast}
    - {name: data, size_gb: 3936, pool: bulk}
image: {logical: debian-12-cloudinit, kind: template-clone, os_type: linux-6}
cloudinit: {user: ansible, ssh_authorized_keys: [operator]}
network:
  zone: data
  ip: 192.0.2.11
  extra_addresses:
    - {address: "2001:db8:20::11", why: The IPv6 address its traffic to the lab leaves by.}
capability: cap:object-store
tags: [prod]
backup: {policy: none}
owners: {primary: platform-team}
baseline: {names: [server]}
