  - id: passport-keyed
    type: national-id
    text: ["passport number: FAKE12345 (expired)"]
    secrets: [FAKE12345]
  - id: tax-id-keyed
    type: national-id
    text: ["tax id 12-3456789 on invoice"]
    secrets: [12-3456789]

  # -------------------------------------------------------------- phone numbers
  - id: phone-uk-international
    type: phone
    text: ["Call +44 20 7946 0123 to verify"]
    secrets: [+44 20 7946 0123]
  - id: phone-us-international
    type: phone
    text: ["callback +1 (202) 555-0143 requested"]
    secrets: [+1 (202) 555-0143]
  - id: phone-us-parentheses
    type: phone
    text: ["Helpdesk (202) 555-0188, ext 4"]
    secrets: [(202) 555-0188]
  - id: phone-us-dots
    type: phone
    text: ["vishing from 202.555.0167 reported"]
    secrets: [202.555.0167]
  - id: phone-au
    type: phone
    text: ["SMS sender +61 491 570 156"]
    secrets: [+61 491 570 156]
  - id: phone-keyed-local
    type: phone
    text: ["tel: 555 0142"]
    secrets: [555 0142]
  - id: phone-uk-mobile-keyed
    type: phone
    text: ["mobile 07700 900123 (do not call)"]
    secrets: [07700 900123]
  - id: phone-fr
    type: phone
    text: ["contact +33 1 23 45 67 89 after 18h"]
    secrets: [+33 1 23 45 67 89]

  # -------------------------------------------------------------- mixed and co-reference
  - id: mixed-log-line
    type: email
    text: ["2026-10-19T10:30:45Z auth fail user=heidi.fake@example.com src=192.0.2.33 password=fakeWrong1"]
    secrets: [heidi.fake@example.com, 192.0.2.33, fakeWrong1]
  - id: mixed-ticket
    type: phone
    text: ["Customer ivan@example.net (+44 20 7946 0999) paid with 4111-1111-1111-1111."]
    secrets: [ivan@example.net, +44 20 7946 0999, 4111-1111-1111-1111]
  - id: repeated-address
    type: ip
    text: ["192.0.2.50 scanned 198.51.100.9, then 192.0.2.50 scanned it again"]
    secrets: [192.0.2.50, 198.51.100.9]
  - id: secret-in-yaml-block
    type: secret
    text: ["smtp:\n  user: judy@example.org\n  password: \"fakeMailPw!9\"\n"]
    secrets: [fakeMailPw!9, judy@example.org]
  - id: token-and-email
    type: token
    text: ["mallory@example.com committed gh", "o_fakeOAUTH0123456789abcdefghijklmnopqr"]
    secrets: [mallory@example.com, ["gh", "o_fakeOAUTH0123456789abcdefghijklmnopqr"]]

  # -------------------------------------------------------------- shapes added from review
  - id: json-password-with-spaces
    type: secret
    text: ["{\"password\": \"my fake horse battery\"}"]
    secrets: [my fake horse battery]
  - id: yaml-quoted-passphrase
    type: secret
