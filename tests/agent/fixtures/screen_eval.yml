    secrets: [["ZmFrZTpm", "YWtlcGFzc3dvcmQ="]]
  - id: authorization-token-scheme
    type: token
    text: ["curl -H \"Authorization: Token ", "fake0token0value\" https://api.example.com/"]
    secrets: [fake0token0value]
  - id: authorization-json-short-bearer
    type: token
    text: ["{\"Authorization\": \"Bearer ", "fake0short\"}"]
    secrets: [fake0short]
  - id: authorization-digest
    type: token
    text: ["Authorization: Digest username=\"fake\", response=\"fake0digest0response0\"\n"]
    secrets: [fake0digest0response0]
  - id: cookie-header
    type: secret
    text: ["Cookie: sessionid=fake0session0value0123; theme=dark\n"]
    secrets: [fake0session0value0123]
  - id: set-cookie-header
    type: secret
    text: ["HTTP/1.1 200 OK\nSet-Cookie: sid=fake0sid0value; Path=/; HttpOnly\n"]
    secrets: [fake0sid0value]
  - id: ipv4-mapped-ipv6
    type: ip
    text: ["src ::ffff:192.0.2.44 dst ::ffff:198.51.100.7"]
    secrets: ["192.0.2.44", "198.51.100.7", "0.2.44", "51.100.7"]
  - id: ipv4-fullwidth-digits
    type: ip
    text: ["host １９２.０.２.４４ replied"]
    secrets: ["１９２.０.２.４４"]
  - id: email-zero-width-split
    type: email
    text: ["mail fake.user​@example.com now"]
    secrets: ["fake.user​@example.com", "fake.user"]
  - id: github-token-zero-width-split
    type: token
    text: ["token gh", "p_fake0123456789abcdef​ghijklmnopqrstuv end"]
    secrets: [["gh", "p_fake0123456789abcdef"], ghijklmnopqrstuv]

  # folding must only add: a format character or a compatibility character that folds to a
  # letter must not glue a value to its neighbour and hide it (each was missed by a folded-only
  # pass); the last two spans meet inside one original character and are merged
  - id: fold-boundary-aws-zwsp
    type: token
    text: ["key AKI", "AFAKE7EXAMPLE0KEY\u200bx"]
    secrets: [["AKI", "AFAKE7EXAMPLE0KEY"]]
  - id: fold-boundary-ip-soft-hyphen
    type: ip
    text: ["from 192.0.2.40\u00adx"]
    secrets: ["192.0.2.40"]
  - id: fold-boundary-email-trademark
    type: email
    text: ["mail alice.fake@example.com\u2122 today"]
    secrets: ["alice.fake@example.com"]
  - id: fold-boundary-ghp-word-joiner
    type: token
    text: ["x\u2060gh", "p_fake0123456789abcdefghijklmnopqrstuv"]
    secrets: [["gh", "p_fake0123456789abcdefghijklmnopqrstuv"]]
  - id: fold-merge-ip-into-email
    type: email
    text: ["192.0.2.4\u00bclice.fake@example.com"]
    secrets: ["192.0.2.4", "lice.fake@example.com"]

