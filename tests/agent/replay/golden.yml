# The memory replay's golden answers (ADR-0037 decision 16): one per step and question of
# fixture.yml, under the same name, in fixture form (uid:N, digest:N, mem:<who>/..., times of
# day; a record's pack is named by the fixture step that first assembled it, and an operator's
# user is <operator>).  Each was checked by hand against the ADR when it was written:
#
# - as-of-*: what the profile believed at T, rebuilt from the log (decision 5); as-of-0950-after
#   still shows a and b, retracted later, because as_of shows belief at T (follow-up 1).
# - history-*: every record, in order: rev never restarts, a replace keeps the closure of the
#   sources since the last add (decision 10), a verify takes no value, and only the verifier
#   sets verified_at (decision 15); a retraction's retire record names its reason and operator.
# - dependents-*: b is cited one hop through memory (its closure holds a@1's), d is exposed one
#   hop through memory (its pack's memory block showed a@1), e is exposed by rendering uid:1,
#   and the ledger's unchecked item-1 is cited with checked: false (decision 13).
# - retract-uid-1: cited entries are retired across owners, exposed ones are not without
#   include_exposed; cites-retracted, renders-retracted and cites-through-memory are refused
#   and change nothing (decision 14).
# - audit-*: every entry is stale except g, which the test verifier confirmed at 09:40 (no
#   Verifier ships); n and cursor-0 are unsourced; the ledger's platform writes are unchecked.
# - as-of-0925-green, withheld-green: the reader at a lowered ceiling (green) sees the amber h
#   withheld, by count only (decision 8).
