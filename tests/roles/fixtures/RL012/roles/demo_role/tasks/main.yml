- name: Create data directory
  ansible.builtin.file:
    path: "{{ demo_role_data_dir }}"
    state: directory
    mode: "0750"

- name: Pack the data directory through a shell
  ansible.builtin.shell: tar -czf /tmp/demo.tgz -C /var/lib/demo-role .
  changed_when: true
