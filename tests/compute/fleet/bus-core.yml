# SPDX-License-Identifier: Apache-2.0
id: guest:bus-core
kind: vm
provisioning: terraform
placement: {node: hv-a, vmid: 150, vmid_scheme: freeform}
resources:
  cpu: {cores: 2}
  memory: {size_mb: 4096, balloon_min_mb: 2048}
  disks: [{name: rootfs, size_gb: 32, pool: fast, format: qcow2}]
image: {logical: debian-12-cloudinit, kind: template-clone, os_type: linux-6}
cloudinit: {user: ansible, ssh_authorized_keys: [operator]}
network:
  zone: data
  ip: 198.51.100.50
  vlan_tag_mode: per_vlan_bridge
  firewall: disabled
  firewall_exemption:
    reason: Cluster peers connect from changing addresses and the bus enforces its own authentication.
    review_by: "2027-03-31"
capability: cap:events
capability_groups: [cap_orchestration]
tags: [prod, legacy-net]
backup: {policy: none}
lifecycle: {on_boot: false, ignore_changes: [clone, operating_system]}
owners: {primary: platform-team}
