# SPDX-License-Identifier: Apache-2.0
id: guest:secrets-core
kind: lxc
provisioning: manual
placement: {node: hv-a, vmid: 31, vmid_scheme: octet}
resources:
  cpu: {cores: 2}
  memory: {size_mb: 1024}
  disks: [{name: rootfs, size_gb: 8, pool: fast}]
image: {logical: debian-12-lxc, kind: tarball, os_type: debian}
network: {zone: mgmt, ip: 192.0.2.31}
capability: cap:secrets
capability_groups: [cap_secrets]
tags: [prod, secrets]
backup: {policy: daily, retain: {daily: 14}}
lifecycle:
  requires_root_steps:
    - "pct create <vmid> as a privileged container (hardware token passthrough)"
    - "append the device allow-list lines to the container config for <vmid>"
owners: {primary: platform-team}
