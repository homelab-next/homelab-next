# SPDX-License-Identifier: Apache-2.0
id: guest:lake-core
display_name: lake-core
kind: vm
provisioning: terraform
placement: {node: hv-a, vmid: 140, vmid_scheme: freeform}
resources:
  cpu: {cores: 4, type: host}
  memory: {size_mb: 16384}
  disks:
    - {name: rootfs, size_gb: 20, pool: fast}
    - {name: data, size_gb: 200, pool: bulk, discard: true}
image: {logical: debian-12-cloudinit, kind: template-clone, os_type: linux-6}
cloudinit:
  user: ansible
  ssh_authorized_keys: [operator, automation]
  packages: [qemu-guest-agent, chrony]
  timezone: UTC
  storage_pool: fast
network: {zone: data, ip: 198.51.100.40, gateway: inherit, bridge: default, firewall: enabled}
firewall_rules:
  inbound_allow:
    - {name: query-api, proto: tcp, ports: "8443", source: "zone:compute"}
    - {name: ssh-mgmt, proto: tcp, ports: "22", source: "zone:mgmt"}
    - {name: ping, proto: icmp, source: "192.0.2.0/24"}
capability: cap:lake-query
capability_groups: [cap_lake, cap_query]
tags: [prod, stateful]
backup:
  policy: daily
  retain: {daily: 7, weekly: 4, monthly: 6}
  export_hook: lake-export
lifecycle: {on_boot: true, ignore_changes: [clone]}
owners: {primary: data-team, oncall: platform-team}
