# SPDX-License-Identifier: Apache-2.0
id: guest:edge-core
kind: vm
provisioning: terraform
placement: {node: hv-a, vmid: 110, vmid_scheme: freeform}
resources:
  cpu: {cores: 2}
  memory: {size_mb: 2048}
  disks: [{name: rootfs, size_gb: 16, pool: fast}]
image: {logical: debian-12-cloudinit, kind: template-clone, os_type: linux-6}
cloudinit: {user: ansible, ssh_authorized_keys: [operator], packages: [qemu-guest-agent]}
network: {zone: edge, ip: 203.0.113.10, firewall: enabled}
firewall_rules:
  inbound_allow:
    - {name: https-public, proto: tcp, ports: "443", source: any}
    - {name: ssh-mgmt, proto: tcp, ports: "22", source: "zone:mgmt"}
capability: cap:orchestration
capability_groups: [cap_edge]
tags: [prod, edge]
backup: {policy: daily}
owners: {primary: platform-team}
baseline: {names: [exposed]}
