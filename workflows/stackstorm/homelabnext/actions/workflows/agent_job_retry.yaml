---
version: 1.0
description: Resubmit an agent job once, at lower priority, when it failed for an environment reason.
  (workflow pack agent-job-retry sha256:7e0687607fdbf948b18839cb31665db8c5534ff83ab241af2026267cc8959de3)
input:
- event
- mode: shadow
vars:
- steps: {}
- calls: []
- outcome: null
output:
- outcome: <% ctx(outcome) %>
- calls: <% ctx(calls) %>
- steps: <% ctx(steps) %>
tasks:
  admit:
    action: homelabnext.admit
    input:
      pack: agent-job-retry
      trigger:
        event: homelabnext.agent.job.failed
        where:
        - ref: $event.data.reason
          in:
          - capacity
          - stall
          - timeout
          - backend-down
        - ref: $event.data.resubmits
          in:
          - 0
      event: <% ctx(event) %>
      coalesce:
        key: $event.data.agent_key
        window_s: 600
    next:
    - when: <% succeeded() and result().result.admitted %>
      publish:
      - event: <% result().result.event %>
      do: step_resubmit
    - when: <% succeeded() and not result().result.admitted %>
      publish:
      - outcome: <% result().result.reason %>
    - when: <% failed() %>
      do: fail
  step_resubmit:
    action: homelabnext.step
    input:
      pack: agent-job-retry
      digest: sha256:7e0687607fdbf948b18839cb31665db8c5534ff83ab241af2026267cc8959de3
      actor: profile:workflow-agents
      step:
        id: resubmit
        kind: action
        action: agent.job.submit
        target: svc:orchestration
        params:
          agent_key: $event.data.agent_key
          retry_of_run_id: $event.data.run_id
          idempotency_key: $event.id
          priority: 90
          reason: $event.data.reason
      risky: false
      event: <% ctx(event) %>
      steps: <% ctx(steps) %>
      calls: <% ctx(calls) %>
      mode: <% ctx(mode) %>
    next:
    - when: <% succeeded() %>
      publish:
      - steps: <% result().result.steps %>
      - calls: <% result().result.calls %>
      - outcome: completed
    - when: <% failed() %>
      do: fail
