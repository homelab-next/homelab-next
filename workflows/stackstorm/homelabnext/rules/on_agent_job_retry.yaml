---
name: on_agent_job_retry
pack: homelabnext
description: 'A02: Resubmit an agent job once, at lower priority, when it failed for an environment reason.
  [shadow]'
enabled: true
trigger:
  type: core.st2.webhook
  parameters:
    url: homelabnext
criteria:
  trigger.body.type:
    type: equals
    pattern: homelabnext.agent.job.failed
  trigger.body.source:
    type: equals
    pattern: svc:llm-orchestrator
  trigger.body.data.reason:
    type: inside
    pattern:
    - capacity
    - stall
    - timeout
    - backend-down
  trigger.body.data.resubmits:
    type: inside
    pattern:
    - 0
  trigger.body.data.retried_by_run_id:
    type: nexists
  trigger.body.data.auto_retry_scheduled:
    type: nexists
action:
  ref: homelabnext.agent_job_retry
  parameters:
    event: '{{ trigger.body | to_json_string | urlencode }}'
