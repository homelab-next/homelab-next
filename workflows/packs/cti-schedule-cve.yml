# cti-cve: queue one cti-cve job on the orchestration controller at `0 14 * * *` (UTC),
# the lane the table was rendered for (shadow).  Replaces the old timer cti-cve.timer.  The firing's
# event id (the schedule and the firing time) is the idempotency key, so a timer that fires twice
# is one job.  The pack never runs the job: the controller admits it against live load.
pack: cti-schedule-cve
version: 1
description: Queue one cti-cve job for the cti-cve schedule (0 14 * * * UTC, lane shadow).
trigger:
  event: homelabnext.schedule.fired
  where:
    - {ref: $event.data.schedule, equals: cti-cve}
actor: profile:workflow-agents
broker_manifest: workflows/broker.manifest.json
steps:
  - id: submit
    kind: action
    action: agent.job.submit
    target: svc:orchestrator
    params:
      agent_key: cti-cve
      idempotency_key: $event.id
      priority: 60
      shadow: true
      task_description: "cti-cve: scheduled run, 0 14 * * * UTC, lane shadow"
