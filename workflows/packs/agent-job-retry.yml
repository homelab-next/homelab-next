# SPDX-License-Identifier: Apache-2.0
# A02: an agent job that failed for a reason of the environment (capacity, a stall, a timeout, a
# backend that went down) is resubmitted once, at a lower priority, through the orchestration
# controller's queue - never run directly.  The trigger bounds it: only an original submit
# (resubmits 0) is retried, so a resubmitted job that fails again stops here.  Failures the
# controller decided on purpose (deadline, cancel, turn cap, budget) are never retried.  On
# StackStorm this is rule A02, which also coalesces a burst of failures of one agent into one
# resubmit (workflows/stackstorm.yml, docs/stackstorm.md).  `reason` is the controller's failure
# class.  A resubmit sends no payload of its own (the controller replays the parent's, and refuses
# an override) and no `resubmits` (the controller counts the lineage itself).  Its idempotency key
# is the failed run's id, so every report of one failure is one resubmit (the controller refuses a
# key reused for another run: 422 idempotency_key_mismatch).
pack: agent-job-retry
version: 1
description: Resubmit an agent job once, at lower priority, when it failed for an environment reason.
trigger:
  event: homelabnext.agent.job.failed
  where:
    - {ref: $event.source, equals: "svc:llm-orchestrator"}  # the producer: the controller (its default events.source)
    - {ref: $event.data.reason, in: [capacity, stall, timeout, backend-down]}
    - {ref: $event.data.resubmits, in: [0]}
    - {ref: $event.data.retried_by_run_id, exists: false}  # retried already (a resubmit or the scheduler)
    - {ref: $event.data.auto_retry_scheduled, exists: false}  # the scheduler retried it itself
actor: profile:workflow-agents
broker_manifest: workflows/broker.manifest.json
steps:
  - id: resubmit
    kind: action
    action: agent.job.submit
    target: svc:orchestration
    params:
      agent_key: $event.data.agent_key
      retry_of_run_id: $event.data.run_id
      idempotency_key: $event.data.run_id  # stable per failed run, whatever event reports it
      priority: 90
      reason: $event.data.reason
fixtures:
  - name: capacity-failure-resubmitted
    event:
      specversion: "1.0"
      id: evt-job-0001
      source: svc:llm-orchestrator
      type: homelabnext.agent.job.failed
      time: "2026-01-01T00:00:00Z"
      subject: run-0001
      data: {run_id: run-0001, agent_key: triage, state: failed, reason: capacity, failure_class: capacity, attempts: 2, resubmits: 0}
    expect:
      calls:
        - action: agent.job.submit
          target: svc:orchestration
          params: {agent_key: triage, retry_of_run_id: run-0001, idempotency_key: run-0001, priority: 90, reason: capacity}
          result: executed
  - name: resubmitted-job-not-retried-again
    event:
      specversion: "1.0"
      id: evt-job-0002
      source: svc:llm-orchestrator
      type: homelabnext.agent.job.failed
      time: "2026-01-01T00:20:00Z"
      subject: run-0002
      data: {run_id: run-0002, agent_key: triage, state: failed, reason: capacity, failure_class: capacity, attempts: 2, resubmits: 1, retry_of_run_id: run-0001}
    expect:
      triggered: false
      calls: []
  - name: deadline-not-retried
    event:
      specversion: "1.0"
      id: evt-job-0003
      source: svc:llm-orchestrator
      type: homelabnext.agent.job.failed
      time: "2026-01-01T00:30:00Z"
      subject: run-0003
      data: {run_id: run-0003, agent_key: triage, state: failed, reason: deadline, failure_class: deadline, attempts: 1, resubmits: 0}
    expect:
      triggered: false
      calls: []
  - name: already-resubmitted-not-retried-again
    event:
      specversion: "1.0"
      id: evt-job-0004
      source: svc:llm-orchestrator
      type: homelabnext.agent.job.failed
      time: "2026-01-01T00:40:00Z"
      subject: run-0004
      data: {run_id: run-0004, agent_key: triage, state: failed, reason: stall, failure_class: stall, attempts: 1, resubmits: 0, retried_by_run_id: run-0005}
    expect:
      triggered: false
      calls: []
  - name: auto-retried-by-the-scheduler-not-resubmitted
    event:
      specversion: "1.0"
      id: evt-job-0006
      source: svc:llm-orchestrator
      type: homelabnext.agent.job.failed
      time: "2026-01-01T00:50:00Z"
      subject: run-0006
      data: {run_id: run-0006, agent_key: triage, state: failed, reason: timeout, failure_class: timeout, attempts: 1, resubmits: 0, auto_retry_scheduled: true}
    expect:
      triggered: false
      calls: []
