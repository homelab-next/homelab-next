# SPDX-License-Identifier: Apache-2.0
# cti-watch-site: every 30 minutes (UTC) look up the cti-watch-site row of table:cti.watch and page when it is stale.
# LL-134: the published page's own generated_at is older than 3 h.
# The row comes from homelabnext.workflows.cti_watch (the checks and their thresholds, tested
# there).  Like new-critical-alert this pack is a reference pack: a lookup step does not run on
# the workflow engine yet and notify.page's handler is the site's, so it is not pinned in deploy.yml
# or bound in the binding until both exist.  Schedule: `*/30 * * * *`, schedule id cti-watch-site.
pack: cti-watch-site
version: 1
description: Notify when the cti site check is stale.
trigger:
  event: homelabnext.schedule.fired
  where:
    - {ref: $event.data.schedule, equals: cti-watch-site}
actor: profile:workflow-soc
broker_manifest: workflows/broker.manifest.json
steps:
  - id: check
    kind: enrich
    op: lookup
    table: table:cti.watch
    key: $event.data.schedule
  - id: notify
    kind: action
    action: notify.page
    target: svc:notify
    when:
      - {ref: $steps.check.found, equals: true}
      - {ref: $steps.check.row.stale, equals: true}
    params:
      rota: cti-watch
      alert_id: cti-watch-site
      title: $steps.check.row.summary
fixtures:
  - name: stale-notifies
    event:
      specversion: "1.0"
      id: evt-cti-watch-site-stale-notifies
      source: svc:automation
      type: homelabnext.schedule.fired
      time: "2026-01-01T12:00:00Z"
      data: {schedule: cti-watch-site, fired_at: "2026-01-01T12:00:00Z", cron: "*/30 * * * *"}
    lookups:
      table:cti.watch:
        cti-watch-site: {check: site, stale: true, summary: "cti site: generated_at 5.0 h old (limit 3 h)", value: 1, threshold: 1}
    expect:
      calls:
        - action: notify.page
          target: svc:notify
          params:
            rota: cti-watch
            alert_id: cti-watch-site
            title: "cti site: generated_at 5.0 h old (limit 3 h)"
          result: executed
  - name: fresh-is-quiet
    event:
      specversion: "1.0"
      id: evt-cti-watch-site-fresh-is-quiet
      source: svc:automation
      type: homelabnext.schedule.fired
      time: "2026-01-01T12:00:00Z"
      data: {schedule: cti-watch-site, fired_at: "2026-01-01T12:00:00Z", cron: "*/30 * * * *"}
    lookups:
      table:cti.watch:
        cti-watch-site: {check: site, stale: false, summary: "cti site: generated_at 0.5 h old (limit 3 h)", value: 1, threshold: 1}
    expect:
      calls: []
  - name: another-schedule-ignored
    event:
      specversion: "1.0"
      id: evt-cti-watch-site-other
      source: svc:automation
      type: homelabnext.schedule.fired
      time: "2026-01-01T12:00:00Z"
      data: {schedule: not-cti-watch-site, fired_at: "2026-01-01T12:00:00Z"}
    expect:
      triggered: false
      calls: []
