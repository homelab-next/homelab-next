# Generated by homelabnext.workflows.cti_schedules; edit the table there, not this file.
# cti-publish: queue one cti-publish job on the orchestration controller at `20 * * * *` (UTC),
# the lane the table was rendered for (shadow).  Replaces the old timer cti-publish.timer.  The firing's
# event id (the schedule and the firing time) is the idempotency key, so a timer that fires twice
# is one job.  The pack never runs the job: the controller admits it against live load.
pack: cti-schedule-publish
version: 1
description: Queue one cti-publish job for the cti-publish schedule (20 * * * * UTC, lane shadow).
trigger:
  event: homelabnext.schedule.fired
  where:
    - {ref: $event.data.schedule, equals: cti-publish}
actor: profile:workflow-agents
broker_manifest: workflows/broker.manifest.json
steps:
  - id: submit
    kind: action
    action: agent.job.submit
    target: svc:orchestrator
    params:
      agent_key: cti-publish
      idempotency_key: $event.id
      priority: 30
      shadow: true
      task_description: "cti-publish: scheduled run, 20 * * * * UTC, lane shadow"
fixtures:
  - name: cti-publish-fired-queues-one-job
    event:
      specversion: "1.0"
      id: evt-cti-publish-0001
      source: svc:automation
      type: homelabnext.schedule.fired
      time: "2026-01-01T00:00:00Z"
      data: {schedule: cti-publish, fired_at: "2026-01-01T00:00:00Z", cron: "20 * * * *"}
    expect:
      calls:
        - action: agent.job.submit
          target: svc:orchestrator
          params:
            agent_key: cti-publish
            idempotency_key: evt-cti-publish-0001
            priority: 30
            shadow: true
            task_description: "cti-publish: scheduled run, 20 * * * * UTC, lane shadow"
          result: executed
  - name: another-schedule-ignored
    event:
      specversion: "1.0"
      id: evt-cti-publish-0002
      source: svc:automation
      type: homelabnext.schedule.fired
      time: "2026-01-01T00:00:00Z"
      data: {schedule: not-cti-publish, fired_at: "2026-01-01T00:00:00Z"}
    expect:
      triggered: false
      calls: []
