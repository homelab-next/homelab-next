# What the orchestrator may run, pinned by pack digest (`hnx workflows digest workflows/packs`).
# `hnx workflows validate` fails when a pin does not match its pack or names a pack that does
# not validate; the deployer loads only these digests from a commit CI passed (docs/workflows.md).
# A pin also needs a pack that can run: its handlers in the tree, pinned, and its producer pinned.
# case-opened-notify, new-critical-alert and phishing-report are reference packs: their handlers
# (case-open, notify-page, notify-post, dns-block-domains) are site code and their triggers pin
# no producer, so they are not pinned here (docs/workflows.md, Deploying).
deploy_id: lab-workflows
pins:
  - {pack: agent-job-retry, digest: "sha256:6477bc202afe4d08d749ad8964b1cc2afda2c3abbc5957d40646d5ccbe647699"}
  - {pack: proposal-validate, digest: "sha256:da650073ee0bc27b652bdbd6f45c5917c06cb4471208bc5c46f538e91367a0ce"}
