# SPDX-License-Identifier: Apache-2.0
name: nightly

# Brings the lab-in-a-box stack up on a runner, runs the smoke script (direct service checks, the
# status hub's Prometheus and Uptime Kuma collectors against the real products, the broker end to
# end across three containers and uids, then `hnx conform` where the harness exists) and uploads
# the report.  Scheduled and manual only: it
# never runs on a pull request and so can never block one.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

# Action pins below are full commit SHAs; the trailing comment names the release.

jobs:
  lab-in-a-box:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # the project with its core extra (so that hnx conform can read target files) and nats (the
      # events adapter's client), hash-pinned
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: core,nats
      - name: validate the compose file
        run: |
          docker compose --env-file compose/lab-in-a-box/.env.example \
            -f compose/lab-in-a-box/docker-compose.yml config --quiet
      - name: smoke test (up, health, checks, conformance where present, down)
        run: compose/lab-in-a-box/smoke.sh --report-dir build/lab-smoke
      - name: conformance suites against the built-in fakes, after the smoke
        if: always()
        run: |
          mkdir -p build/lab-smoke
          python -m homelabnext.cli conform run all --target fake --json --out build/lab-smoke/conform-all.json > /dev/null
          python -m homelabnext.cli conform report --json > build/lab-smoke/conform-report.json
          python -c "import json; d=json.load(open('build/lab-smoke/conform-report.json')); print('capabilities without a passing test:', d['capabilities_without_passing_test'])" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: summarise
        if: always()
        run: |
          if [ -f build/lab-smoke/report.json ]; then
            python -c "import json; d=json.load(open('build/lab-smoke/report.json')); print('ok:', d['ok']); [print(' ', c['status'], c['capability'], c['detail']) for c in d['checks']]; print('conformance:', d['conformance'])" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lab-smoke-report
          path: build/lab-smoke/
          if-no-files-found: warn
          retention-days: 14
