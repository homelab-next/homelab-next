# SPDX-License-Identifier: Apache-2.0
name: nightly

# Brings the lab-in-a-box stack up on a runner, runs the smoke script (direct service checks, the
# status hub's Prometheus and Uptime Kuma collectors against the real products, the broker end to
# end across three containers and uids, then `hnx conform` where the harness exists) and uploads
# the report.  Scheduled and manual only: this workflow never runs on a pull request.  The same
# steps run on every pull request that can affect the stack as ci.yml's lab-in-a-box job (gated by
# lab-ok); tests/compose/test_lab_in_a_box.py holds the two copies equal, so change both together.
#
# Two suites ci.yml leaves to the nightly (operator 2026-11-25, speed first): the whole suite on
# Python 3.11, the public package's requires-python floor, with only the test extra (the lake and
# MCP SDK tests must skip cleanly without theirs), in four shards; and the `perf` tests, whose
# wall-clock bounds a loaded pull-request runner trips (tests/context/test_levels.py and the like).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

# Action pins below are full commit SHAs; the trailing comment names the release.

jobs:
  lab-in-a-box:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # the project with its core extra (so that hnx conform can read target files) and nats (the
      # events adapter's client), hash-pinned
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.13"
          extras: core,nats
      - name: validate the compose file
        run: |
          docker compose --env-file compose/lab-in-a-box/.env.example \
            -f compose/lab-in-a-box/docker-compose.yml config --quiet
      - name: smoke test (up, health, checks, conformance where present, down)
        run: compose/lab-in-a-box/smoke.sh --report-dir build/lab-smoke
      - name: conformance suites against the built-in fakes, after the smoke
        if: always()
        run: |
          mkdir -p build/lab-smoke
          python -m homelabnext.cli conform run all --target fake --json --out build/lab-smoke/conform-all.json > /dev/null
          python -m homelabnext.cli conform report --json > build/lab-smoke/conform-report.json
          python -c "import json; d=json.load(open('build/lab-smoke/conform-report.json')); print('capabilities without a passing test:', d['capabilities_without_passing_test'])" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: summarise
        if: always()
        run: |
          if [ -f build/lab-smoke/report.json ]; then
            python -c "import json; d=json.load(open('build/lab-smoke/report.json')); print('ok:', d['ok']); [print(' ', c['status'], c['capability'], c['detail']) for c in d['checks']]; print('conformance:', d['conformance'])" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lab-smoke-report
          path: build/lab-smoke/
          if-no-files-found: warn
          retention-days: 14

  # The requires-python floor: every test but the live, experimental and perf ones, on 3.11 with
  # only the test extra, the network cut as in ci.yml's test job.
  test-floor:
    name: test-floor (3.11, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.11"
          extras: test
      - env:
          SHARD: ${{ matrix.shard }}
        run: >-
          sudo -E env "PATH=$PATH" "HOME=$HOME" "USER=$(id -un)" "LOGNAME=$(id -un)" unshare --net --
          sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 &&
          exec setpriv --no-new-privs --reuid="$u" --regid="$g" --init-groups -- "$@"'
          sh "$(id -u)" "$(id -g)"
          python -m pytest -q -m "not live and not experimental and not perf"
          --deselect tools/tests/test_coverage_floor.py::test_this_repo_meets_the_floor
          -n auto --dist loadfile
          --shard "$SHARD/4" --shard-report "$RUNNER_TEMP/shard.json"

  # The wall-clock performance tests (marker `perf`): linear-time parses and scans with a bound in
  # seconds, run alone on a quiet runner so a bound that trips is a regression, not a neighbour.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.13"
          extras: test,lake,mcp,ansible
      - name: the perf tests, serially
        run: python -m pytest -q -rs -m "perf and not live and not experimental"
