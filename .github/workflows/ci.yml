# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: applying the operator's experimental-growth label is the one run that may
    # let tools/experimental.yml grow (the label approves the head it was applied to; any later
    # push or label event checks again without it), and removing it runs CI again
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # superseded pull-request runs are cancelled; every push to main runs to completion
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Action pins below are full commit SHAs; the trailing comment names the release.  Every checkout
# sets persist-credentials: false, so no job leaves a token in .git/config for later steps.
# Python packages come from constraints/ci.txt (hash-pinned) via .github/actions/python-deps.

env:
  # The Go of the jobs that have no module of their own to read it from (a Go module's job installs
  # the version its go.mod names): the Python tools' Go tests and fix_has_test's Go proofs.  There
  # may be no go.mod at all yet, so it is pinned here, exactly; Dependabot does not raise it: bump
  # it by hand to a supported release (https://go.dev/doc/devel/release).
  GO_VERSION: "1.27.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          packages: ruff  # the version is the one .pre-commit-config.yaml pins (constraints/ci-tools.in)
          install-project: "false"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python tools/check_spdx.py
      - run: python tools/check_changelog.py
      - name: every component ships tests
        run: python tools/component_tests.py
      - name: test code reads no wall clock or unseeded randomness
        run: python tools/hermetic_lint.py

  # The suite in six shards per Python version: each job runs a sixth of the collected tests,
  # chosen by node id hash (tests/shard_report.py), and test-ok below proves from their reports
  # that together they ran every test exactly once and that each suite's summed time kept its
  # budget.  Run whole, the 3.12 job's pytest took 34.5 min on a runner (2026-10-25); in four
  # shards its slowest took 593 s against 491 s for the fastest (2026-10-26, near-equal test
  # counts: the spread is per-test cost, so more shards cut the slowest more than balancing would).
  test:
    name: test (${{ matrix.python.version }}, ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python:
          # the optional lake, mcp and ansible extras installed: the DuckDB/Iceberg, MCP SDK,
          # lookup-plugin (which import ansible) and playbook tests run, and must: an
          # importorskip of a module in require-modules (HNX_REQUIRE_MODULES) and a missing tool
          # in require-tools (HNX_REQUIRE_TOOLS) fail here instead of skipping, so a broken extra
          # cannot pass as a skip; and Go, which the Go tools' tests then require (HNX_REQUIRE_GO)
          - version: "3.12"
            extras: "test,lake,mcp,ansible"
            go: true
            require-modules: "duckdb,pyarrow,pyiceberg,sqlalchemy,mcp,ansible"
            require-tools: "ansible-playbook"
          # the extras absent: proves the lake and MCP SDK tests skip cleanly instead of failing
          - version: "3.11"
            extras: "test"
            go: false
            require-modules: ""
            require-tools: ""
        shard: [1, 2, 3, 4, 5, 6]  # --shard below names the 6: change both together
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: ${{ matrix.python.version }}
          extras: ${{ matrix.python.extras }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: matrix.python.go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # the tests build throwaway modules: nothing worth caching
      # The orchestrator module's dependencies, fetched (by go.sum) while the job still has a
      # network: tools/tests/test_orchestration_conformance.py builds the controller inside the
      # namespace below, from the module cache only (GOPROXY=off)
      - name: fetch the orchestrator module's dependencies
        if: matrix.python.go
        working-directory: orchestrator
        env:
          GOFLAGS: -mod=readonly
          GOWORK: "off"
        run: go mod download
      # test_this_repo_meets_the_floor runs tools/coverage_floor.py, which the coverage job below
      # already runs on every push; here it only repeated the whole suite under coverage (~220s a job)
      # No network: the suite runs as the runner user in a network namespace with only loopback,
      # as the go job's tests do, so a subprocess a test starts (git, curl, an installed tool) cannot
      # reach out either; tests/network_guard.py refuses Python's own sockets, and says which test.
      # sudo -E keeps the job's environment (sudo's secure_path would drop the setup-python PATH)
      - env:
          HNX_REQUIRE_GO: ${{ matrix.python.go && '1' || '' }}
          HNX_REQUIRE_MODULES: ${{ matrix.python.require-modules }}
          HNX_REQUIRE_TOOLS: ${{ matrix.python.require-tools }}
          SHARD: ${{ matrix.shard }}
        run: >-
          sudo -E env "PATH=$PATH" "HOME=$HOME" "USER=$(id -un)" "LOGNAME=$(id -un)" unshare --net --
          sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 &&
          exec setpriv --no-new-privs --reuid="$u" --regid="$g" --init-groups -- "$@"'
          sh "$(id -u)" "$(id -g)"
          python -m pytest -q -m "not live and not experimental"
          --deselect tools/tests/test_coverage_floor.py::test_this_repo_meets_the_floor
          --shard "$SHARD/6" --shard-report "$RUNNER_TEMP/shard.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()  # a failed shard's report says why to test-ok too
        with:
          name: shard-${{ matrix.python.version }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard.json
          if-no-files-found: error
          overwrite: true  # re-running a failed shard replaces its report
          retention-days: 3

  # the one stable check name for branch protection (the shard jobs' names carry the matrix):
  # fails unless every shard passed and together they ran the whole suite once
  test-ok:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/shards
      # standard library only (tests/shard_report.py): the runner's own python3, nothing installed
      - name: every shard passed, together they ran each test once, every suite kept its budget
        env:
          TEST: ${{ needs.test.result }}
        run: |
          echo "test: $TEST"
          python3 -m tests.shard_report --groups 3.11,3.12 "$RUNNER_TEMP/shards"
          [ "$TEST" = success ]

  # The linters and validators some tests call only when they are installed: actionlint and zizmor
  # (the workflows here and the private-overlay deploy templates), nats-server (the lab's events
  # config) and docker compose (the lab bind guard's resolved pass; the runner image has it).  Each
  # is pinned by version and checksum: the Go tools by their module sum (go also checks it against
  # the checksum database), and each binary's build info must name that module, version and sum;
  # zizmor by its wheel's sha256.  Bump a version and its checksum together (the hex of
  # `go mod download -json <module>@<version>`'s Sum, PyPI's file listing).  Built with the
  # workflow's GO_VERSION.  HNX_REQUIRE_TOOLS makes the tests' require_tool helper fail instead of
  # skipping when one of them is missing, so a broken install cannot pass as a skip.
  # Not installed here: dnsmasq (an apt package, not pinnable by version on a moving runner image)
  # and playwright for node (a browser download).
  external-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local  # the setup-go toolchain, never a download a module asks for
      ACTIONLINT_VERSION: "v1.7.12"
      # a module sum (go.sum's h1:) as hex: the SHA-256 of the module's file tree
      ACTIONLINT_SUM_SHA256: "bd0e0678937ce82d101fe81351072cf0c7262bad8e2d3de499a90f32d1166276"
      # the lab image's version (compose/lab-in-a-box/docker-compose.yml): bump the two together
      NATS_SERVER_VERSION: "v2.15.1"
      NATS_SERVER_SUM_SHA256: "7cadc07981488e2d529a783ad23074855a003d97b303f533b1a23706a5c53442"
      ZIZMOR_VERSION: "1.31.1"  # docs/private-overlay.md names the version the templates pass
      ZIZMOR_SHA256: "58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410"  # manylinux_2_28_x86_64 wheel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: install actionlint, nats-server and zizmor (pinned versions, checksums verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/tools"
          mkdir -p "$bin"
          pinned() {  # MODULE VERSION SHA256: download the module, compare its h1: sum with the pin
            got=$(go mod download -json "$1@$2" | python -c 'import base64, json, sys; s = json.load(sys.stdin)["Sum"]; print(base64.b64decode(s.removeprefix("h1:")).hex())')
            if [ "$got" != "$3" ]; then
              echo "::error::$1@$2 has sum $got, not the pinned $3"
              exit 1
            fi
          }
          built_from() {  # BINARY MODULE VERSION SHA256: its build info names that module, exactly
            want=$(python -c 'import base64, sys; print("h1:" + base64.b64encode(bytes.fromhex(sys.argv[1])).decode())' "$4")
            if ! go version -m "$1" | grep -qxF "$(printf '\tmod\t%s\t%s\t%s' "$2" "$3" "$want")"; then
              echo "::error::$1 was not built from $2@$3 with the pinned sum"
              go version -m "$1" | head -3
              exit 1
            fi
          }
          pinned github.com/rhysd/actionlint "$ACTIONLINT_VERSION" "$ACTIONLINT_SUM_SHA256"
          GOBIN="$bin" go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          # a package path resolves to the longest module providing it: the binary must say
          # it came from the pinned module, not from a nested one tagged later
          built_from "$bin/actionlint" github.com/rhysd/actionlint "$ACTIONLINT_VERSION" "$ACTIONLINT_SUM_SHA256"
          pinned github.com/nats-io/nats-server/v2 "$NATS_SERVER_VERSION" "$NATS_SERVER_SUM_SHA256"
          GOBIN="$bin" go install "github.com/nats-io/nats-server/v2@$NATS_SERVER_VERSION"
          built_from "$bin/nats-server" github.com/nats-io/nats-server/v2 "$NATS_SERVER_VERSION" "$NATS_SERVER_SUM_SHA256"
          printf 'zizmor==%s --hash=sha256:%s\n' "$ZIZMOR_VERSION" "$ZIZMOR_SHA256" > "$RUNNER_TEMP/zizmor.txt"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            --only-binary :all: -r "$RUNNER_TEMP/zizmor.txt"
          echo "$bin" >> "$GITHUB_PATH"
      - name: actionlint and zizmor on this repository's workflows and actions
        # medium and above: zizmor 1.31.1 also prints low-severity "self-repository" style help on
        # every local `uses: ./.github/actions/...`, which is not a finding about this repository
        run: |
          actionlint -version
          actionlint -no-color
          zizmor --version
          zizmor --offline --no-progress --min-severity medium .github/
      - name: the tests that call these tools; a missing one fails them here
        env:
          HNX_REQUIRE_TOOLS: actionlint,zizmor,nats-server,docker
        run: >-
          python -m pytest -q -m "not live" -rs
          tests/overlay/test_private_overlay_example.py tests/compose/test_lab_in_a_box.py

  # The tests that call the real nft (`nft -c` on the rendered firewall, the nftables_host role's
  # refusal of a ruleset nft rejects) and dnsmasq (`dnsmasq --test`), and the one that needs root
  # (the telemetry store read as two other users, with setpriv).  The test job above runs
  # unprivileged and offline, where these tools are absent or unusable, so there they skip; here
  # they are installed, and HNX_REQUIRE_TOOLS makes a missing or unusable one a failure
  # (tests/suite_policy.py: require_nft_check, require_dnsmasq, require_root_setpriv), so the
  # checks cannot go on skipping unseen.  The apt packages are the runner image's own archive: a
  # moving version, but a rendered file nft or dnsmasq rejects is a finding at any version.
  # -rs prints the skips, which must be none of nft, dnsmasq, unshare or setpriv.
  real-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: test,ansible  # the nftables_host role test runs a playbook
      - name: install nftables and dnsmasq; allow unprivileged user namespaces (nft -c runs in one)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nftables dnsmasq-base
          # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor; the key is absent
          # on an image without that restriction
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          nft --version
          dnsmasq --version | head -1
      - name: the nft and dnsmasq checks, and the root-only user-switching test; none may skip
        env:
          HNX_REQUIRE_TOOLS: nft,dnsmasq,unshare,setpriv,ansible-playbook
          # test ids, not scripts: scripts reality reads a path at the start of a run line as one
          REAL_TOOL_TESTS: >-
            tests/network/test_external_tools.py tests/network/test_wan6.py
            tests/network/test_ipv6_render.py
            tests/roles/test_control_roles.py::test_nftables_host_never_installs_a_ruleset_nft_rejects
          ROOT_TESTS: tests/orchestration/test_orchestration_readonly.py
        run: |
          set -euo pipefail
          read -ra real_tool_tests <<< "$REAL_TOOL_TESTS"
          python -m pytest -q -rs -m "not live and not experimental" "${real_tool_tests[@]}"
          sudo -E env "PATH=$PATH" "HOME=$HOME" python -m pytest -q -rs -m "not experimental" "$ROOT_TESTS"

  # The security-critical units (tools/coverage_floor.py UNITS, the one list): each keeps >= 80%
  # line coverage from its own tests (pytest-cov from the test extra).
  coverage:
    runs-on: ubuntu-latest
    # one pytest per group of units, Python subprocesses measured too: slower than the old single run
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: test,mcp  # homelabnext/mcp's SDK binding is measured too
      - name: security-critical coverage floor (80% lines per unit)
        run: python tools/coverage_floor.py

  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Caddy's own reading of every Caddyfile (caddy adapt) for the F-23 semantic check. Version
      # and checksum are pinned together: bump both from the release's checksums file
      # (caddy_<version>_checksums.txt, which publishes SHA-512).
      CADDY_VERSION: "2.11.7"
      CADDY_SHA512: "a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the base commit, for the append-only _frozen/ check
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: dev
      - name: schema contracts (examples, negatives, additive evolution, frozen baselines, append-only _frozen/)
        # a pull request's base must be readable (an error, never a skip); a push compares with
        # its previous tip, or HEAD^ when that is zero (a new branch) or gone (a force-push); any
        # other event, or a shallow checkout with no base, is an error; the step prints the base
        env:
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
        run: python tools/schema_check.py --strict --ci-base
      - name: generated module schemas, examples and negatives are current
        run: python -m homelabnext.schemas --check
      - name: no raw endpoints
        run: python tools/no_raw_endpoints.py .
      - name: product names only in provider modules (X-11); the baseline and vocabulary never grow
        env:
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
        run: python tools/product_name_lint.py --ci-base .
      # the change's own copy; its trusted-gates copy (the base's) follows once the tool is on main,
      # since a base without it has none to run: CONTRIBUTING.md, "Hygiene lints", tracks it
      - name: the gates' allowlists and suppression markers at their reviewed counts and digests (tools/allowlist_counts.yml), no raise against the base without its code owner
        env:
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
        run: python tools/allowlist_ratchet.py --ci-base .
      - name: helpers are shared, not copied (M-03)
        run: python tools/shared_helpers_lint.py .
      - name: no copy-paste beyond the shrinking baseline (M-03); the baseline never loosens against the base
        env:
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
        run: python tools/dup_check.py --ci-base .
      - name: tools/experimental.yml only shrinks against the base, unless the operator's experimental-growth label allows it
        env:
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
          HNX_EXPERIMENTAL_GROWTH: ${{ github.event_name == 'push' && 'push' || (github.event.action == 'labeled' && github.event.label.name == 'experimental-growth' && 'label' || 'none') }}
        run: python tools/experimental.py ratchet --ci-base .
      - name: TLS certificate verification never disabled (F-07)
        run: python tools/tls_verify_lint.py .
      - name: install caddy (pinned release, checksum verified) for the F-23 semantic check
        run: |
          set -euo pipefail
          archive="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/caddyserver/caddy/releases/download"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base/v${CADDY_VERSION}/${archive}"
          echo "${CADDY_SHA512}  $RUNNER_TEMP/$archive" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/caddy"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/caddy" caddy
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      - name: no Caddy config lets a client set its own identity headers, Caddy pinned >= 2.11.2 (F-23)
        env:
          HNX_CADDY_REQUIRED: "1"  # the semantic check must run here; a local run may skip it
        run: python tools/caddy_lint.py .
      - name: nothing at runtime points at the workstation (F-17)
        run: python tools/workstation_refs.py .
      - name: every pinned package and compose image has a reviewed licence, no linked one copyleft (ADR-0011)
        run: python tools/licence_check.py
      - name: no private overlay, SOPS ciphertext or decryption key in the public tree (ADR-0021)
        run: python tools/private_leak_check.py public .
      - name: scripts write scratch output only under their run directory or build/
        run: python tools/run_output_lint.py .
      - name: role and playbook lint
        run: |
          python tools/role_lint.py ansible/roles/*
          python tools/role_lint.py --playbook ansible/playbooks/*.yml --inventory ansible/inventory/example/hosts.yml
      - name: decision spec lint (complete, well-formed questions, inline specs fast)
        run: python -m homelabnext.cli decide lint
      - name: required safety specs pass their cases (K-15)
        run: python -m homelabnext.cli decide safety
      - name: models pinned by version and digest, evaluation report current (G-11, K-12); the example model store, serving plan and its gateway config current
        run: make models-check PY=python
      - name: the LLM gateway configs have no drift and no local-only or agent role reaches a cloud model
        run: make gateway-check PY=python
      - name: readers cannot act (agent profile and context manifest lint)
        run: python -m homelabnext.cli agent lint
      - name: prompt template lint (G-01, untrusted slots only inside fences)
        run: python -m homelabnext.cli agent prompts lint
      - name: injection corpus against the fence-respecting fake (G-02, golden report current)
        run: python -m homelabnext.cli agent injection run --fake fence --check homelabnext/agent/prompts/injection/report.json
      - name: the MCP catalog is valid, grants resolve, rendered client configs have 0 drift (ADR-0024)
        run: make mcp-check PY=python
      - name: the keyring has 0 drift from its sources (M-12)
        run: python -m homelabnext.cli agent keyring check examples/keyring/sources.yml
      - name: workflow packs (R-01/R-03/R-04/R-07, offline, deploy pins)
        run: python -m homelabnext.cli workflows validate
      - name: script catalog current, matches reality, checks only in the runner (M-01, M-02, M-04)
        run: |
          python -m homelabnext.cli scripts catalog --check
          python -m homelabnext.cli scripts reality
          python -m homelabnext.cli scripts runner-lint
      - name: detections lint, fixtures, ATT&CK map, no engine rule numbers in agent files
        run: |
          python -m homelabnext.detections lint
          python -m homelabnext.detections lint-ids
          python -m homelabnext.detections run
          python -m homelabnext.detections map --check
          python -m homelabnext.detections coverage --check detections/attack_coverage.json
          python -m homelabnext.detections validate-techniques
      - name: every event type and shared table has passing publisher and consumer contract tests
        run: python tools/contract_coverage.py
      - name: registers build from the examples, record Links blocks current, summaries present, well-formed and fresh
        run: |
          python -m homelabnext.registers build examples/registers build/registers
          python -m homelabnext.registers links --check examples/registers/lessons examples/registers/runbooks
          python -m homelabnext.registers review examples/registers
          python -m homelabnext.registers summaries examples/registers docs
      - name: conformance coverage (all 18 capabilities have a passing suite)
        run: python tools/conform_coverage.py
      - name: system pages match the inventory (L-05)
        run: python -m homelabnext.cli docs systems check examples/services.yml docs/systems
      - name: capability reference pages match the contracts, suites and adapters (L-05)
        run: python -m homelabnext.cli docs capabilities check
      - name: docs index and ADR log descriptions match the pages' summaries
        run: python -m homelabnext.cli docs index check docs/README.md docs/adr/README.md
      - name: generated docs facts (capability names, tool classes, schema versions) are current
        run: python -m homelabnext.cli docs facts check
      - name: knowledge graph current, no dangling edge or duplicate id (L-05)
        run: python -m homelabnext.cli graph check
      - name: the status source catalog (docs/status/sources.md) and views.yml match the registry
        run: |
          python -m homelabnext.cli status catalog check
          python -m homelabnext.cli status views check
      - name: docs/terms.md matches homelabnext/agent/terms.md
        run: python -m homelabnext.cli agent terms --check docs/terms.md
      - name: the example log pipeline's runtime table matches the example guests (docs/log-pipeline.md)
        run: |
          python -m homelabnext.cli guests plan examples/minimal/guests --site examples/minimal/site.yml \
            --target runtime-labels --against examples/log-pipeline --exit-code
      - name: the module loader loads the example lab for every profile (ADR-0027 follow-up 9)
        run: |
          for site in examples/modules/sites/*.yml; do
            python -m homelabnext.cli modules check --examples --site "$site"
          done
          python -m homelabnext.cli modules check --examples --site examples/modules/sites/small-lab.yml \
            --running schemas/platform/examples/module_inventory.small-lab.yml
      - name: hnx entry point
        run: |
          hnx --help
          hnx registry validate examples/services.yml
          hnx custom check

  # The gates a change must not be able to argue its way past run the BASE's code, never the
  # change's: the checker is the base commit's homelabnext (a detached worktree of the same clone,
  # imported from there with python -P so the checkout's own package is never on the path), and it
  # reads the change's working tree only as data (--root).  Nothing of the change runs before the
  # gates: no composite action from the checkout (./.github/actions/ is the change's), Python comes
  # from actions/setup-python pinned here and is called by the absolute path it reports (so a
  # $GITHUB_PATH shim cannot stand in for it), and pip and the checker's dependencies are installed
  # from the BASE's constraints and pyproject.toml.  The base rule is homelabnext/gitbase.py, read
  # from the commit the event names (the pull request's base, or the pushed tip of main) rather
  # than from the checkout, since running the change's code to find it is the thing being
  # avoided.  A pull_request run still takes this workflow file from the change, so the
  # guarantee rests on it being human-approve (CODEOWNERS, hnx modules review-tier) until a
  # ruleset requires this job from the default branch; the privileged pull-request trigger is never
  # used.  A base that cannot run a gate fails the job: the change's own code never stands in.
  trusted-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the base commit
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        with:
          python-version: "3.12"
      - name: the base commit, checked out apart as the checker, with its own pinned dependencies
        id: base
        env:
          # whose code picks the base: the pull request's base, or (a push to main) the pushed tip
          TRUSTED: ${{ github.event.pull_request.base.sha || github.sha }}
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
          PY: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          # the base rule is homelabnext/gitbase.py (the one copy, which register-ids and
          # regression-tests run too), read from TRUSTED and never from the checkout; a root
          # commit has no base, and is refused here
          git cat-file -e "$TRUSTED^{commit}" || { echo "the commit $TRUSTED is not readable"; exit 1; }
          git show "$TRUSTED:homelabnext/gitbase.py" > "$RUNNER_TEMP/gitbase.py"
          base=$("$PY" -I - "$RUNNER_TEMP/gitbase.py" "$GITHUB_WORKSPACE" <<'RULE'
          import runpy, sys
          from pathlib import Path
          try:
              sha, why = runpy.run_path(sys.argv[1])["ci_base_from_env"](Path(sys.argv[2]))
          except ValueError as exc:
              sys.exit(f"no base: {exc}")
          if sha is None:
              sys.exit(f"no base: {why}")
          print(f"base rule: {sha} ({why})", file=sys.stderr)
          print(sha)
          RULE
          )
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          cd "$RUNNER_TEMP/base"
          "$PY" -m pip install --disable-pip-version-check --require-hashes --no-deps -r constraints/bootstrap.txt
          req="$RUNNER_TEMP/checker-requirements.txt"
          # the core dependencies (YAML, JSON Schema) the checker imports; the project is not installed
          "$PY" -I -c 'import tomllib; p = tomllib.load(open("pyproject.toml", "rb"))["project"]; print("\n".join([*p.get("dependencies", []), *p["optional-dependencies"]["core"]]))' > "$req"
          "$PY" -m pip install --disable-pip-version-check -c constraints/ci.txt -r "$req"
          got=$(PYTHONPATH="$PWD" "$PY" -P -c 'import homelabnext; print(homelabnext.__file__)')
          case "$got" in "$PWD"/*) ;; *) echo "the checker imports $got, not the base's"; exit 1;; esac
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "checker: the base commit $base, interpreter $PY"
      - name: each changed module path's review tier, and a code owner (as of the base) for every human-approve one (ADR-0027 follow-up 4), by the base's code
        env:
          BASE: ${{ steps.base.outputs.sha }}
          PY: ${{ steps.python.outputs.python-path }}
        run: |
          cd "$RUNNER_TEMP/base"
          PYTHONPATH="$PWD" "$PY" -P -m homelabnext.cli modules review-tier --root "$GITHUB_WORKSPACE" --base "$BASE"
      - name: a role-table change is covered by a swap record whose legs hold against the base's evidence (docs/modules.md, "Swap record 1.2"), by the base's code
        env:
          BASE: ${{ steps.base.outputs.sha }}
          PY: ${{ steps.python.outputs.python-path }}
        run: |
          cd "$RUNNER_TEMP/base"
          PYTHONPATH="$PWD" "$PY" -P -m homelabnext.cli modules swap-gate --root "$GITHUB_WORKSPACE" --base "$BASE"
      # The ratchets: each holds the change to the base and is a tools/ script that puts its own
      # repository (the base's worktree) first on sys.path, run with "$PY" -I so nothing of the
      # environment adds a path; the schemas and register-ids jobs run the change's own copies too,
      # as quick feedback (tests/gates/test_ci_trusted_gates.py, RATCHETS, lists them)
      - name: schema contracts against the base (additive evolution, frozen baselines, append-only _frozen/), by the base's code
        env:
          BASE: ${{ steps.base.outputs.sha }}
          PY: ${{ steps.python.outputs.python-path }}
        run: '"$PY" -I "$RUNNER_TEMP/base/tools/schema_check.py" --strict --root "$GITHUB_WORKSPACE" --base "$BASE"'
      - name: product names only in provider modules (X-11), the baseline and vocabulary never grow against the base, by the base's code
        env:
          BASE: ${{ steps.base.outputs.sha }}
          PY: ${{ steps.python.outputs.python-path }}
        run: '"$PY" -I "$RUNNER_TEMP/base/tools/product_name_lint.py" --base "$BASE" "$GITHUB_WORKSPACE"'
      - name: no copy-paste beyond the baseline, which never loosens against the base (M-03), by the base's code
        env:
          BASE: ${{ steps.base.outputs.sha }}
          PY: ${{ steps.python.outputs.python-path }}
        run: '"$PY" -I "$RUNNER_TEMP/base/tools/dup_check.py" --base "$BASE" "$GITHUB_WORKSPACE"'
      - name: no register record that the base has vanished (M-16), by the base's code
        env:
          BASE: ${{ steps.base.outputs.sha }}
          PY: ${{ steps.python.outputs.python-path }}
        # register_ids finds the repository from the working directory; -I keeps it off sys.path
        run: |
          cd "$GITHUB_WORKSPACE"
          "$PY" -I "$RUNNER_TEMP/base/tools/register_ids.py" check-lost --base "$BASE"
      # a listed component's tests, gates, invariants and code block no merge, so the list only
      # shrinks; growth passes only on the run that applying the operator's experimental-growth
      # label triggered, so the label approves that head and no later push (a push to main was
      # gated at its pull request, given branch protection requires one)
      - name: tools/experimental.yml only shrinks against the base, unless the operator's experimental-growth label allows it, by the base's code
        env:
          BASE: ${{ steps.base.outputs.sha }}
          PY: ${{ steps.python.outputs.python-path }}
          HNX_EXPERIMENTAL_GROWTH: ${{ github.event_name == 'push' && 'push' || (github.event.action == 'labeled' && github.event.label.name == 'experimental-growth' && 'label' || 'none') }}
        run: '"$PY" -I "$RUNNER_TEMP/base/tools/experimental.py" ratchet --base "$BASE" "$GITHUB_WORKSPACE"'

  # The example invariants register's fast criteria through the runner (the plugin-only rows X-04,
  # X-06, X-09 and X-10 run nowhere else); slow criteria are the gates of the other jobs.  No state
  # file and --no-notify: CI never pages.  Could-not-measure (exit 100) fails the job here, where
  # every dependency is installed.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: test
      - name: invariants register, fast criteria
        run: make invariants PY=python

  # The experimental and frozen components of tools/experimental.yml (the one list; v0 cuts,
  # 2026-10-31): their gates and their tests, which the jobs above leave out (`-m "not live and not
  # experimental"`).  Allowed to fail and needed by no other job, so it blocks no merge; it runs so
  # that they do not rot unseen.  Do not make it a required check (tools/tests/test_experimental.py).
  experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: "test,lake,mcp,ansible"
      - name: experimental and frozen components, gates and tests (non-blocking)
        run: make experimental PY=python

  # Go: every tracked go.mod is a module (tools/go_modules.py; <module>/tools/go.mod is that
  # module's linters, not a module of its own), and the go job runs once per module, so a second or
  # nested module is checked without being listed anywhere.  With no module the go job is skipped
  # and go-ok passes: a no-op.  Go outside every module, or a go.work, fails go-modules.
  go-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
      present: ${{ steps.discover.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: discover the Go modules
        id: discover
        run: python tools/go_modules.py --github-output "$GITHUB_OUTPUT"

  # One Go module.  Tests run as the runner user in a network namespace with only loopback (no
  # network), race-enabled and shuffled; tests that need root run first, under sudo, and
  # tools/go_test_policy.py judges both event streams: no failure, no build failure, no skip without
  # a registered reason (skip_reasons in pyproject.toml), quarantines in the module's skips.yml
  # bounded to 90 days.
  #
  # Trust: the handshake (the streams, each root-run binary's exit status, the policy that judges
  # them) guards against accidents and casual tampering -- a TestMain that crashes after PASS, a
  # race after the tests, a test that writes into the workspace or quarantines itself on the way
  # out -- not against hostile pull-request code.  A job that runs the PR's code on a hosted runner
  # cannot be made safe from that code from inside: the PR controls this file, root-run tests are
  # root, and code that runs as the runner user can steer later steps through $GITHUB_ENV and
  # $GITHUB_PATH.  Branch protection and human review are the boundary for hostile code.  Kept,
  # because they are cheap: the results live in a fresh root-owned mktemp directory in /run that
  # each step checks; the policy, its inputs and PyYAML (checked against its RECORD hashes) are
  # copied there before any of the module's code runs; the judge is the image's root-owned
  # /usr/bin/python3 -I, run with /usr/bin/sudo; the judge's step comes before any linter, vet or
  # build, so the only module code that runs before it is the tests; and every runner-user run of
  # module code is under no_new_privs (setpriv --no-new-privs), where sudo fails.
  go:
    needs: go-modules
    if: needs.go-modules.outputs.present == 'true'
    name: go (${{ matrix.module.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.go-modules.outputs.modules) }}
    env:
      GOFLAGS: -mod=readonly  # go.mod and go.sum are inputs: a build never rewrites them
      GOTOOLCHAIN: local  # the go setup-go installed from go.mod, never a download
      GOWORK: "off"  # each module on its own: a go.work never changes how modules resolve
    defaults:
      run:
        shell: bash  # bash --noprofile --norc -eo pipefail: a failing command in a pipe fails
        working-directory: ${{ matrix.module.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: ${{ matrix.module.dir }}/go.mod
          cache-dependency-path: ${{ matrix.module.dir }}/**/go.sum  # the module's and tools/'s
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: yaml  # go_test_policy.py reads skips.yml
          install-project: "false"
      # before any of the module's code runs: a directory only root can write, for the streams and
      # exit statuses, and in it a copy of the policy tool and its inputs, which judges them later
      - name: a root-owned results directory with a copy of the policy, before any test runs
        run: |
          res=$(/usr/bin/sudo mktemp -d /run/go-results.XXXXXX)
          /usr/bin/sudo chmod 0755 "$res"
          pol="$res/policy"
          /usr/bin/sudo install -d -m 0755 "$pol" "$pol/vendor"
          /usr/bin/sudo install -m 0644 "$GITHUB_WORKSPACE/tools/go_test_policy.py" \
            "$GITHUB_WORKSPACE/pyproject.toml" "$pol/"
          if [ -f skips.yml ]; then /usr/bin/sudo install -m 0644 skips.yml go.mod "$pol/"; fi
          # PyYAML for the isolated interpreter, if the image lacks it: python-deps' hash-pinned
          # install, found by its metadata from / with -I (no module file can stand in for it),
          # in site-packages, and copied with its RECORD, against which the judge checks every
          # file before it imports one
          paths=$(cd / && python -I -c 'import importlib.metadata as md, pathlib, site
          d = md.distribution("PyYAML")
          pkg = pathlib.Path(d.locate_file("yaml")).resolve()
          sites = [pathlib.Path(s).resolve() for s in site.getsitepackages()]
          assert pkg.parent in sites, f"{pkg} is not in {sites}"
          rec = next(f for f in d.files if f.name == "RECORD")
          print(pkg)
          print(pathlib.Path(d.locate_file(rec)).resolve())')
          /usr/bin/sudo cp -R --no-dereference "${paths%%$'\n'*}" "$pol/vendor/yaml"
          /usr/bin/sudo find "$pol/vendor/yaml" -name __pycache__ -prune -exec rm -rf {} +
          /usr/bin/sudo install -m 0644 "${paths#*$'\n'}" "$pol/vendor/RECORD"
          echo "GO_RESULTS=$res" >> "$GITHUB_ENV"
      - name: modules downloaded and verified against go.sum
        run: go mod download && go mod verify
      # the reason go_test_policy.py reads is the last line before --- SKIP: a skip says it in
      # the call, on one line (no SkipNow or Skipf, whose reason is a logged or formatted line)
      - name: every skip names its reason in the call
        run: |
          res="$GO_RESULTS"
          # the directory the first step made: a later step's environment is writable by the
          # runner user, so the path and its owner are checked, not trusted
          case "$res" in /run/go-results.??????) ;; *) echo "::error::GO_RESULTS=$res"; exit 1;; esac
          /usr/bin/sudo test -d "$res" -a ! -L "$res" -a -O "$res"
          /usr/bin/sudo /usr/bin/python3 -I "$res/policy/go_test_policy.py" --check-sources .
      - name: root-only tests (skips.yml privileged) under sudo, no network
        run: |
          res="$GO_RESULTS"
          # the directory the first step made: a later step's environment is writable by the
          # runner user, so the path and its owner are checked, not trusted
          case "$res" in /run/go-results.??????) ;; *) echo "::error::GO_RESULTS=$res"; exit 1;; esac
          /usr/bin/sudo test -d "$res" -a ! -L "$res" -a -O "$res"
          pol="$res/policy"
          out="$res/go-test-root.json"
          exits="$res/go-test-root.exit"
          /usr/bin/sudo install -m 0644 /dev/null "$out"
          /usr/bin/sudo install -m 0644 /dev/null "$exits"
          policy=()
          if [ -f "$pol/skips.yml" ]; then policy=(--policy "$pol/skips.yml"); fi
          /usr/bin/sudo /usr/bin/python3 -I "$pol/go_test_policy.py" "${policy[@]}" --list-privileged \
            | /usr/bin/sudo tee "$res/privileged.txt" > /dev/null
          while read -r pkg rx; do
            [ -n "$pkg" ] || continue
            bin="$res/privileged-$(echo "$pkg" | tr '/.' '__').test"
            # go test -c on a package without test files writes nothing and exits 0: never run
            # the previous package's binary in its place
            rm -f "$RUNNER_TEMP/privileged.test"
            go test -c -race -o "$RUNNER_TEMP/privileged.test" "$pkg"
            if [ ! -f "$RUNNER_TEMP/privileged.test" ]; then
              echo "::error::$pkg: no test binary built (no test files?) for skips.yml privileged"
              exit 1
            fi
            /usr/bin/sudo install -m 0755 "$RUNNER_TEMP/privileged.test" "$bin"  # root's copy is the one run
            imp=$(go list "$pkg")
            # the verdict is go_test_policy.py's (next step): the stream, and this exit status,
            # which test2json does not see (a TestMain panic after PASS still reads as a pass)
            # only root writes the results (sudo tee); --no-new-privs, though root holds every
            # privilege already, keeps both runs from gaining any through an exec
            # --mount: a test's mounts (the bind-mount tests) live in a private mount namespace
            # and vanish with it, never touching the runner's
            (cd "$pkg" && status=0 && { /usr/bin/sudo unshare --net --mount -- \
              sh -c 'ip link set lo up && exec setpriv --no-new-privs -- "$@"' \
              sh "$bin" -test.run "$rx" -test.count=1 -test.v=test2json 2>&1 || status=$?; } \
              && echo "$imp $status" | /usr/bin/sudo tee -a "$exits" > /dev/null) \
              | go tool test2json -t -p "$imp" | /usr/bin/sudo tee -a "$out" > /dev/null
          done < "$res/privileged.txt"
      - name: tests (race, shuffled, no network) judged by go_test_policy.py
        run: |
          res="$GO_RESULTS"
          # the directory the first step made: a later step's environment is writable by the
          # runner user, so the path and its owner are checked, not trusted
          case "$res" in /run/go-results.??????) ;; *) echo "::error::GO_RESULTS=$res"; exit 1;; esac
          /usr/bin/sudo test -d "$res" -a ! -L "$res" -a -O "$res"
          pol="$res/policy"
          policy=(--pyproject "$pol/pyproject.toml")
          if [ -f "$pol/skips.yml" ]; then policy+=(--policy "$pol/skips.yml"); fi
          out="$res/go-test.json"
          # every package the run covers must show up in the stream, even one that has no tests,
          # and one whose test files declare tests must report one (a floor under tests TestMain
          # hides)
          go list ./... | /usr/bin/sudo tee "$res/go-packages.txt" > /dev/null
          /usr/bin/sudo test -s "$res/go-packages.txt"
          # (read before the tests run, so a test that rewrites its own files cannot change it)
          # with -race, as the run below, so race-tagged files count as they will there; the file
          # lists are joined with "/", which no file name contains
          go list -race -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{"\t"}}{{.Dir}}{{"\t"}}{{join .TestGoFiles "/"}}{{"\t"}}{{join .XTestGoFiles "/"}}{{end}}' ./... \
            | /usr/bin/sudo tee "$res/go-test-files.txt" > /dev/null
          /usr/bin/sudo /usr/bin/python3 -I "$pol/go_test_policy.py" \
            --declared-tests "$res/go-test-files.txt" | /usr/bin/sudo tee "$res/go-tested.txt" > /dev/null
          status=0
          # root opens the stream file, then drops to the runner user, which cannot sudo from there
          /usr/bin/sudo env "PATH=$PATH" "HOME=$HOME" \
            "GOFLAGS=$GOFLAGS" "GOTOOLCHAIN=$GOTOOLCHAIN" "GOWORK=$GOWORK" \
            unshare --net -- \
            sh -c 'ip link set lo up && exec setpriv --no-new-privs --reuid="$1" --regid="$2" \
              --clear-groups -- go test -race -shuffle=on -count=1 -json ./... > "$3"' \
            sh "$(id -u)" "$(id -g)" "$out" || status=$?
          # go test exits 1 on a quarantined failure too: the policy tool judges the stream and
          # go's own exit status together (any other status, or a 1 the stream does not explain,
          # fails), so a stream cut short cannot pass while go test failed
          /usr/bin/sudo /usr/bin/python3 -I "$pol/go_test_policy.py" "${policy[@]}" \
            --privileged "$res/go-test-root.json" \
            --privileged-exit "$res/go-test-root.exit" \
            --forbid 'python3 not available' --go-exit "$status" \
            --expect-packages "$res/go-packages.txt" --expect-tests "$res/go-tested.txt" "$out"

      # Checks that run the module's code, or code it pins, come after the verdict: none of them
      # can steer the judge's step through $GITHUB_ENV or $GITHUB_PATH
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: setpriv --no-new-privs -- go vet ./...
      - name: build every package and binary
        run: setpriv --no-new-privs -- go build ./...
      # Linters as Go tool dependencies: version and checksum pinned by tools/go.mod and go.sum.
      # They run code the module pins, so like the tests they cannot sudo (no_new_privs).
      - name: staticcheck and govulncheck (pinned in tools/go.mod)
        if: matrix.module.tools
        run: |
          setpriv --no-new-privs -- go tool -modfile=tools/go.mod staticcheck ./...
          setpriv --no-new-privs -- go tool -modfile=tools/go.mod govulncheck ./...
  # The gateway against its contract (ADR-0038 decision 7, as ADR-0026 amends it): build
  # orchestrator/cmd/gateway, render the conformance gateway spec with --conformance, start the
  # fake inference server and the gateway (-conformance) on loopback with generated keys, and run
  # the inference suite on compose/lab-in-a-box/targets/inference-own-gateway.yml with every
  # check held to a pass (none skipped or untested).  The steps are tools/gateway_conformance.sh,
  # which runs the same way on a workstation; its venv is pip-by-hash plus the core extra under
  # constraints/ci.txt, and refuses any installed distribution the constraints do not pin.  It
  # runs on every change, unconditionally: the contract, the renderer, the spec and the binary all
  # live here, so any of them can break it, and it costs a few minutes.  go-ok requires it, so a
  # Python-side break (the suite, the renderer, the spec or the fake) also shows as a red go-ok.
  # The run step needs only loopback: it runs in a network namespace with only loopback, as the
  # runner user under no_new_privs (sudo opens the namespace, setpriv drops back), as the go job's
  # tests do; deps, which downloads, runs before it with the network.
  gateway-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -mod=readonly  # go.mod is an input: a build never rewrites it
      GOTOOLCHAIN: local  # the go setup-go installed from go.mod, never a download
      GOWORK: "off"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: orchestrator/go.mod
          cache: false  # the gateway's packages are standard library only: nothing of the module's deps is built here (the go job caches them)
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: build orchestrator/cmd/gateway
        working-directory: orchestrator
        run: go build -o "$RUNNER_TEMP/llm-gateway" ./cmd/gateway
      - name: the suite's Python deps (venv, hash-pinned constraints, nothing unpinned)
        env:
          HNX_PYTHON: ${{ steps.python.outputs.python-path }}
        run: HNX_VENV="$RUNNER_TEMP/hnx-venv" tools/gateway_conformance.sh deps
      - name: inference conformance against the gateway (fake upstream, loopback only, every check a pass)
        run: |
          /usr/bin/sudo env "PATH=$PATH" "HOME=$HOME" "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" \
            "HNX_VENV=$RUNNER_TEMP/hnx-venv" "GATEWAY_BIN=$RUNNER_TEMP/llm-gateway" \
            "WORK_DIR=$RUNNER_TEMP/gateway-conformance" \
            unshare --net -- sh -c 'ip link set lo up && exec setpriv --no-new-privs --reuid="$1" \
              --regid="$2" --clear-groups -- tools/gateway_conformance.sh run' \
            sh "$(id -u)" "$(id -g)"

  # The controller against its contract (ADR-0026 decision 14, PR 2.7c): build
  # orchestrator/cmd/controller, check the fictional example configuration with it (decision 17),
  # and run the orchestration suite strict against the binary on loopback, with process-level
  # fault injection (tools/orchestration_conformance.py), in a network namespace with only
  # loopback, as an unprivileged user under no_new_privs. Every executed check must pass.
  orchestration-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOFLAGS: -mod=readonly  # go.mod is an input: a build never rewrites it
      GOTOOLCHAIN: local  # the go setup-go installed from go.mod, never a download
      GOWORK: "off"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: build orchestrator/cmd/controller
        working-directory: orchestrator
        run: go build -o "$RUNNER_TEMP/controller" ./cmd/controller
      - name: the controller's check on the example configuration (make controller-check)
        run: make controller-check
      - name: the suite's Python deps (venv, hash-pinned constraints, nothing unpinned)
        env:
          HNX_PYTHON: ${{ steps.python.outputs.python-path }}
        # the same venv the gateway's job makes: the core extra and this checkout, by hash
        run: HNX_VENV="$RUNNER_TEMP/hnx-venv" tools/gateway_conformance.sh deps
      - name: orchestration conformance against the controller (strict, fault injection, loopback only)
        run: |
          /usr/bin/sudo env "PATH=$PATH" "HOME=$HOME" \
            "PY=$RUNNER_TEMP/hnx-venv/bin/python" "BIN=$RUNNER_TEMP/controller" \
            "WORK=$RUNNER_TEMP/orchestration-conformance" \
            unshare --net -- sh -c 'ip link set lo up && exec setpriv --no-new-privs --reuid="$1" \
              --regid="$2" --clear-groups -- "$PY" -I tools/orchestration_conformance.py run \
              --controller "$BIN" --work "$WORK" --strict' \
            sh "$(id -u)" "$(id -g)"

  # One stable check name for branch protection, whatever the modules are called: the discovery
  # passed, every module's go job passed (or there was none to run), and the gateway and the
  # controller passed their conformance suites (always run: both are modules here, ADR-0026).
  go-ok:
    needs: [go-modules, go, gateway-conformance, orchestration-conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: the Go modules were discovered and every one passed, and so did the gateway's and the controller's conformance runs
        env:
          MODULES: ${{ needs.go-modules.result }}
          GO: ${{ needs.go.result }}
          GATEWAY: ${{ needs.gateway-conformance.result }}
          ORCHESTRATION: ${{ needs.orchestration-conformance.result }}
        run: |
          echo "go-modules: $MODULES, go: $GO, gateway-conformance: $GATEWAY, orchestration-conformance: $ORCHESTRATION"
          [ "$MODULES" = success ] && { [ "$GO" = success ] || [ "$GO" = skipped ]; } \
            && [ "$GATEWAY" = success ] && [ "$ORCHESTRATION" = success ]

  # The lab-in-a-box: the real stack, brought up by the nightly's smoke, on every change that can
  # affect it.  lab-paths decides (tools/lab_paths.py: the stack's compose file, config, images and
  # their COPY sources, the conformance adapters, the install, the jobs that run it; a test
  # re-derives the list from the compose file), lab-in-a-box runs the nightly's steps unchanged
  # (tests/compose/test_lab_in_a_box.py holds the two copies equal), and lab-ok is the one stable
  # check name for branch protection: it passes when the stack ran and passed, or when nothing it
  # reads changed and it was skipped.  No secret is used (.env.example's throwaway values), so a
  # Dependabot pull request, which gets a read-only token and no Actions secrets, runs it as is.
  lab-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.decide.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the base commit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # standard library only: the base rule is homelabnext.gitbase's, the one copy
      - name: decide whether the change can affect the lab-in-a-box
        id: decide
        env:
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=$(python -m homelabnext.gitbase)
          python tools/lab_paths.py --changed-since "$base" --github-output "$GITHUB_OUTPUT"

  lab-in-a-box:
    needs: lab-paths
    if: needs.lab-paths.outputs.affected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # the project with its core extra (so that hnx conform can read target files) and nats (the
      # events adapter's client), hash-pinned
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: core,nats
      - name: validate the compose file
        run: |
          docker compose --env-file compose/lab-in-a-box/.env.example \
            -f compose/lab-in-a-box/docker-compose.yml config --quiet
      - name: smoke test (up, health, checks, conformance where present, down)
        run: compose/lab-in-a-box/smoke.sh --report-dir build/lab-smoke
      - name: conformance suites against the built-in fakes, after the smoke
        if: always()
        run: |
          mkdir -p build/lab-smoke
          python -m homelabnext.cli conform run all --target fake --json --out build/lab-smoke/conform-all.json > /dev/null
          python -m homelabnext.cli conform report --json > build/lab-smoke/conform-report.json
          python -c "import json; d=json.load(open('build/lab-smoke/conform-report.json')); print('capabilities without a passing test:', d['capabilities_without_passing_test'])" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: summarise
        if: always()
        run: |
          if [ -f build/lab-smoke/report.json ]; then
            python -c "import json; d=json.load(open('build/lab-smoke/report.json')); print('ok:', d['ok']); [print(' ', c['status'], c['capability'], c['detail']) for c in d['checks']]; print('conformance:', d['conformance'])" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lab-smoke-report
          path: build/lab-smoke/
          if-no-files-found: warn
          retention-days: 14

  # The LLM gateway profile (docs/llm-gateway.md): LiteLLM on the lab's postgres, its keys
  # provisioned by llm-gateway-keys, in front of the fake inference server, then the inference
  # suite with the gateway feature against targets/inference-gateway.yml.  A job of its own, not a
  # step of lab-in-a-box: that job is the nightly's step for step (tests/compose), and the default
  # stack plus the profile (about 4.5 GB of mem_limit) would not fit the 4 GB budget the nightly is
  # held to; the gateway-only path is 1280 MB (tests/compose sums its depends_on closure) and runs
  # beside the stack instead of after it.  The same lab-paths decision gates it: every input of
  # the profile (the compose file, its targets and config, the generator and the adapter under
  # homelabnext/, the suite under conformance/, the role table under schemas/, this file) is a
  # LAB_PATHS entry.  No secret: the keys are .env.example's throwaway values.
  lab-gateway:
    needs: lab-paths
    if: needs.lab-paths.outputs.affected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    # bash -eo pipefail in every step (GitHub's default without a shell: is bash -e, no pipefail)
    defaults:
      run:
        shell: bash
    # docker compose reads these in every step: the lab's compose file, its throwaway env file and
    # the profile (a service named on the command line starts whatever its profile)
    env:
      COMPOSE_FILE: compose/lab-in-a-box/docker-compose.yml
      COMPOSE_ENV_FILES: compose/lab-in-a-box/.env.example
      COMPOSE_PROFILES: gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # the project with its core extra, so that hnx conform can read the target file (the
      # gateway adapter itself is standard library only)
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: core
      - name: validate the compose file with the gateway profile
        run: docker compose config --quiet
      - name: bring up the gateway and what it depends on (postgres, the fake inference)
        run: |
          mkdir -p build/lab-gateway
          docker compose up -d --build --wait --wait-timeout 420 llm-gateway
      # in the foreground, not under `up --wait`: `up --wait` returns while a one-shot still runs
      # (and fails on one that exits before its first poll); `run` returns the container's own exit
      # code once it is done.  Without its keys the throttle check has nothing to hit.
      - name: provision the gateway's keys (the llm-gateway-keys one-shot)
        run: docker compose run --rm --build -T llm-gateway-keys
      # the output is written to a file and printed after, so no pipe stands between the command
      # and the step's exit code whatever the shell
      - name: inference conformance through the gateway (bad key 401, throttle 429, models are the role table)
        run: |
          set -a; . compose/lab-in-a-box/.env.example; set +a
          export HNX_ENDPOINT_LLM_GATEWAY="http://${LAB_BIND}:${LAB_PORT_GATEWAY}"
          export HNX_SECRET_LLM_GATEWAY_MASTER_KEY="$LAB_GATEWAY_MASTER_KEY"
          export HNX_SECRET_LLM_GATEWAY_KEY_CONFORMANCE_THROTTLE="$LAB_GATEWAY_KEY_THROTTLE"
          rc=0
          python -m homelabnext.cli conform run inference \
            --target compose/lab-in-a-box/targets/inference-gateway.yml \
            --out build/lab-gateway/conform-inference.json > build/lab-gateway/conform-inference.log 2>&1 || rc=$?
          cat build/lab-gateway/conform-inference.log
          exit "$rc"
      # tests/compose runs this step against passing and failing results
      - name: the gateway's own checks ran and passed (none skipped)
        run: |
          rc=0
          python - build/lab-gateway/conform-inference.json > build/lab-gateway/verdict.txt 2>&1 <<'PY' || rc=$?
          import json, sys
          (run,) = json.load(open(sys.argv[1]))["runs"]
          status = {r["check"]: r["status"] for r in run["results"]}
          print("lab-gateway: inference through the gateway:", run["verdict"], run["counts"])
          for check, st in sorted(status.items()):
              if st != "pass":
                  print(f"  {st}: {check}")
          want = ("gateway-rejects-bad-key", "gateway-limit-throttles", "gateway-models-match-roles")
          bad = {c: status.get(c, "missing") for c in want if status.get(c) != "pass"}
          sys.exit(f"gateway checks not passed: {bad}" if bad or run["verdict"] != "pass" else 0)
          PY
          cat build/lab-gateway/verdict.txt
          cat build/lab-gateway/verdict.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: collect the gateway's state and logs
        if: always()
        run: |
          mkdir -p build/lab-gateway
          docker compose ps -a > build/lab-gateway/ps.txt 2>&1 || true
          docker compose logs --no-color --tail 200 > build/lab-gateway/compose.log 2>&1 || true
      - name: tear everything down
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lab-gateway-report
          path: build/lab-gateway/
          if-no-files-found: warn
          retention-days: 14

  lab-ok:
    needs: [lab-paths, lab-in-a-box, lab-gateway]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: the stack and the gateway profile ran and passed, or nothing they read changed
        env:
          PATHS: ${{ needs.lab-paths.result }}
          AFFECTED: ${{ needs.lab-paths.outputs.affected }}
          LAB: ${{ needs.lab-in-a-box.result }}
          GATEWAY: ${{ needs.lab-gateway.result }}
        run: |
          echo "lab-paths: $PATHS (affected: $AFFECTED), lab-in-a-box: $LAB, lab-gateway: $GATEWAY"
          [ "$PATHS" = success ] || exit 1
          case "$AFFECTED" in true) want=success ;; false) want=skipped ;; *) exit 1 ;; esac
          [ "$LAB" = "$want" ] && [ "$GATEWAY" = "$want" ]

  # Build the sdist and wheel exactly as a release would and leak-scan what they contain (the
  # path allowlist for both artefacts is tests/packaging/test_artifacts.py, run by `test`).
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          packages: build
          install-project: "false"
      - name: build sdist and wheel (no isolation, so the build backend is the hash-pinned one)
        run: python -m build --no-isolation --outdir "$RUNNER_TEMP/dist" .
      - name: list the wheel and leak-scan both unpacked artefacts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/unpacked"
          mkdir -p "$out/wheel" "$out/sdist"
          python -m zipfile -e "$RUNNER_TEMP"/dist/*.whl "$out/wheel"
          tar -xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$out/sdist"
          python -m zipfile -l "$RUNNER_TEMP"/dist/*.whl >> "$GITHUB_STEP_SUMMARY"
          rm "$out"/wheel/*.dist-info/RECORD  # file hashes by construction
          python tools/leak_scan.py "$out"

  leak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: scan the tree
        run: python tools/leak_scan.py .
      - name: scan the commits of this push or pull request (messages, added lines, identities)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD_SHA"
          else
            range="$HEAD_SHA"  # new branch: the whole reachable history
          fi
          echo "range: $range"
          git log --format=%B "$range" | python tools/leak_scan.py --stdin
          python tools/leak_scan.py --check-authors "$range"
          # network and identity shapes in every added line, so a value committed and then
          # deleted inside the same pull request is still caught
          if [ "$range" != "$HEAD_SHA" ]; then
            python tools/leak_scan.py --history "$range"
          fi

  register-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: yaml  # the register tooling parses YAML
          install-project: "false"
      - name: no record vanished relative to the base, no key twice, every record has its uid
        # the base rule is homelabnext.gitbase's, the one copy (a root commit has no base: the
        # check runs without one); the base used is printed
        env:
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=$(python -m homelabnext.gitbase --allow-root)
          echo "register ids: base ${base:-none (a root commit)}"
          if [ -n "$base" ]; then
            make ids-check PY=python BASE="$base"
          else
            make ids-check PY=python
          fi

  # Q-08: every bugfix commit of this push or pull request touches a test file, and that test fails
  # on the fix's parent (tools/fix_has_test.py --prove; CONTRIBUTING.md "Bug fixes"). 25 minutes:
  # a push to main re-proves the whole merged range and is never cancelled, so a timeout there
  # turns main red; a 17-fix range took about 4 minutes on CI.
  regression-tests:
    needs: go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: test,ansible  # a fix to an ansible plugin proves its test like any other
          # a register criterion's test may run the tools its observable needs (Q-06)
          packages: ruff pip-audit
      # a Go fix proves its test with go test (no toolchain is "cannot prove", never a pass); the
      # pinned GO_VERSION, which switches to a newer toolchain a module's go.mod asks for
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: needs.go-modules.outputs.present == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: every fix ships a regression test that fails without the fix
        # the base rule is homelabnext.gitbase's, the one copy (a root commit has no base and
        # nothing to prove); the base used is printed
        env:
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base=$(python -m homelabnext.gitbase --allow-root)
          echo "regression tests: base ${base:-none (a root commit)}"
          if [ -n "$base" ]; then
            # the judge is the base's fix_has_test.py, so a change cannot loosen the rule that
            # judges it; the tests it proves, and this job's environment, are the change's
            git worktree add --detach "$RUNNER_TEMP/judge" "$base"
            python -I "$RUNNER_TEMP/judge/tools/fix_has_test.py" --repo "$GITHUB_WORKSPACE" \
              --range "$base..$HEAD_SHA" --prove
          fi

  # Developer Certificate of Origin: every non-merge commit of a pull request carries a
  # Signed-off-by trailer for its author (CONTRIBUTING.md, ground rule 1).  Dependabot cannot certify
  # the DCO, so its commits are exempt, but only in a pull request GitHub says Dependabot opened:
  # a commit's author email is whatever the committer typed, so it never exempts on its own.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          bad=0
          dependabot="49699333+dependabot[bot]@users.noreply.github.com"
          from_dependabot=0
          if [ "$PR_USER_TYPE" = "Bot" ] && [ "$PR_USER_LOGIN" = "dependabot[bot]" ]; then
            from_dependabot=1
          fi
          for c in $(git rev-list --no-merges "$BASE..$HEAD_SHA"); do
            author=$(git log -1 --format='%ae' "$c")
            # Dependabot cannot certify the DCO; the maintainer who merges does.  The exemption is
            # narrowed to Dependabot's own pull requests by GitHub's record of who opened it, which
            # no commit can set; within one, the author e-mail is commit metadata, so a commit a
            # writer pushes to that branch under Dependabot's address is exempt too.  It narrows
            # the hole, it does not close it: the merging maintainer's review is the control
            if [ "$from_dependabot" = 1 ] && [ "$author" = "$dependabot" ]; then
              continue
            fi
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" \
                 | grep -qiF "<$author>"; then
              echo "::error::commit $(git log -1 --format=%h "$c") has no Signed-off-by for its author (git commit -s)"
              bad=1
            fi
          done
          exit "$bad"

  # The pre-commit hooks that do not need their own environment, run on the whole tree.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: yaml
          install-project: "false"
      - name: merge markers, large files, private keys, YAML/JSON syntax, symlinks
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          import yaml

          class Loader(yaml.SafeLoader):
              pass

          # Ansible and CloudFormation tags are data here; only the syntax is checked
          Loader.add_multi_constructor("!", lambda loader, suffix, node: None)
          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True)
          problems = []
          # fixtures that are malformed on purpose (a role-lint parse-error case)
          invalid_on_purpose = ("tests/roles/fixtures/RL000/",)
          marker = re.compile(rb"^(?:<{7}|>{7})(?: |$)|^={7}$", re.M)
          key = re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY")
          for name in files.stdout.decode().split("\0"):
              if not name:
                  continue
              if os.path.islink(name):
                  problems.append(f"{name}: symbolic link (packaging refuses them)")
                  continue
              data = open(name, "rb").read()
              if len(data) > 512 * 1024:
                  problems.append(f"{name}: larger than 512 KB")
              if marker.search(data):
                  problems.append(f"{name}: merge-conflict marker")
              if key.search(data):
                  problems.append(f"{name}: private key block")
              try:
                  if name.startswith(invalid_on_purpose):
                      pass
                  elif name.endswith((".yml", ".yaml")):
                      list(yaml.load_all(data, Loader=Loader))
                  elif name.endswith(".json"):
                      json.loads(data)
              except Exception as exc:  # noqa: BLE001 - report every parse failure
                  problems.append(f"{name}: does not parse ({exc.__class__.__name__})")
          print("\n".join(problems) or "hygiene: clean")
          sys.exit(1 if problems else 0)
          PY

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The gitleaks-action needs a licence secret for organisation repositories; the CLI does not.
      # Version and checksum are pinned together: bump both from the release's checksums file.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks over full history (.gitleaks.toml)
        run: gitleaks git . --no-banner --redact --verbose
      - name: gitleaks over the checked-out tree
        run: gitleaks dir . --no-banner --redact --verbose

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          packages: pip-audit
          install-project: "false"
      - name: known vulnerabilities in every pinned dependency
        run: python -m pip_audit --strict --progress-spinner off --disable-pip --require-hashes -r constraints/ci.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          # LGPL only as an unmodified dependency (CONTRIBUTING.md, ground rule 8). Copyleft is
          # refused for linked code; ansible-core is a separately run tool (ADR-0011 decision 4,
          # NOTICE), the one exception. tools/tests/test_licence_policy.py holds this to the ADR.
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          allow-dependencies-licenses: pkg:pypi/ansible-core

  markdown-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: check relative links and anchors (offline, deterministic)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --offline --no-progress --include-fragments "./**/*.md"
          fail: true
