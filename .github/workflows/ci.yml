# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # superseded pull-request runs are cancelled; every push to main runs to completion
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Action pins below are full commit SHAs; the trailing comment names the release.  Every checkout
# sets persist-credentials: false, so no job leaves a token in .git/config for later steps.
# Python packages come from constraints/ci.txt (hash-pinned) via .github/actions/python-deps.

env:
  # The Go of the jobs that have no module of their own to read it from (a Go module's job installs
  # the version its go.mod names): the Python tools' Go tests and fix_has_test's Go proofs.  There
  # may be no go.mod at all yet, so it is pinned here, exactly; Dependabot does not raise it: bump
  # it by hand to a supported release (https://go.dev/doc/devel/release).
  GO_VERSION: "1.26.9"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          packages: ruff  # the version is the one .pre-commit-config.yaml pins (constraints/ci-tools.in)
          install-project: "false"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python tools/check_spdx.py
      - run: python tools/check_changelog.py
      - name: every component ships tests
        run: python tools/component_tests.py
      - name: test code reads no wall clock or unseeded randomness
        run: python tools/hermetic_lint.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # the optional lake, mcp and ansible extras installed: the DuckDB/Iceberg, MCP SDK and
          # lookup-plugin tests (which import ansible) run; and Go, which the Go tools' tests
          # then require (HNX_REQUIRE_GO), so they cannot skip with "go is not installed" here
          - python-version: "3.12"
            extras: "test,lake,mcp,ansible"
            go: true
          # the extras absent: proves the lake and MCP SDK tests skip cleanly instead of failing
          - python-version: "3.11"
            extras: "test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: ${{ matrix.python-version }}
          extras: ${{ matrix.extras }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        if: matrix.go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # the tests build throwaway modules: nothing worth caching
      # test_this_repo_meets_the_floor runs tools/coverage_floor.py, which the coverage job below
      # already runs on every push; here it only repeated the whole suite under coverage (~220s a job)
      - env:
          HNX_REQUIRE_GO: ${{ matrix.go && '1' || '' }}
        run: >-
          python -m pytest -q -m "not live"
          --deselect tools/tests/test_coverage_floor.py::test_this_repo_meets_the_floor

  # Broker, scope guard, records lifecycle, decide cascade and the agent grant ceiling: each keeps
  # >= 80% line coverage from its own tests (tools/coverage_floor.py; pytest-cov from the test extra).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: test,mcp  # homelabnext/mcp's SDK binding is measured too
      - name: security-critical coverage floor (80% lines per unit)
        run: python tools/coverage_floor.py

  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the base commit, for the append-only _frozen/ check
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: dev
      - name: schema contracts (examples, negatives, additive evolution, frozen baselines, append-only _frozen/)
        # a pull request's base must be readable (an error, never a skip); a push compares with
        # its previous tip, or HEAD^ when that is zero (a new branch) or gone (a force-push); any
        # other event, or a shallow checkout with no base, is an error; the step prints the base
        env:
          HNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HNX_PUSH_BEFORE: ${{ github.event.before }}
        run: python tools/schema_check.py --strict --ci-base
      - name: generated module schemas, examples and negatives are current
        run: python -m homelabnext.schemas --check
      - name: no raw endpoints
        run: python tools/no_raw_endpoints.py .
      - name: helpers are shared, not copied (M-03)
        run: python tools/shared_helpers_lint.py .
      - name: no copy-paste beyond the shrinking baseline (M-03)
        run: python tools/dup_check.py .
      - name: TLS certificate verification never disabled (F-07)
        run: python tools/tls_verify_lint.py .
      - name: nothing at runtime points at the workstation (F-17)
        run: python tools/workstation_refs.py .
      - name: no private overlay, SOPS ciphertext or decryption key in the public tree (ADR-0021)
        run: python tools/private_leak_check.py public .
      - name: scripts write scratch output only under their run directory or build/
        run: python tools/run_output_lint.py .
      - name: role and playbook lint
        run: |
          python tools/role_lint.py ansible/roles/*
          python tools/role_lint.py --playbook ansible/playbooks/*.yml --inventory ansible/inventory/example/hosts.yml
      - name: decision spec lint (complete, well-formed questions, inline specs fast)
        run: python -m homelabnext.cli decide lint
      - name: required safety specs pass their cases (K-15)
        run: python -m homelabnext.cli decide safety
      - name: models pinned by version and digest, evaluation report current (G-11, K-12)
        run: python -m homelabnext.cli golden pins check --roles examples/model_roles.json --report examples/model_roles.eval.json
      - name: readers cannot act (agent profile and context manifest lint)
        run: python -m homelabnext.cli agent lint
      - name: prompt template lint (G-01, untrusted slots only inside fences)
        run: python -m homelabnext.cli agent prompts lint
      - name: injection corpus against the fence-respecting fake (G-02, golden report current)
        run: python -m homelabnext.cli agent injection run --fake fence --check homelabnext/agent/prompts/injection/report.json
      - name: the MCP catalog is valid, grants resolve, rendered client configs have 0 drift (ADR-0024)
        run: make mcp-check PY=python
      - name: the keyring has 0 drift from its sources (M-12)
        run: python -m homelabnext.cli agent keyring check examples/keyring/sources.yml
      - name: workflow packs (R-01/R-03/R-04/R-07, offline, deploy pins)
        run: python -m homelabnext.cli workflows validate
      - name: script catalog current, matches reality, checks only in the runner (M-01, M-02, M-04)
        run: |
          python -m homelabnext.cli scripts catalog --check
          python -m homelabnext.cli scripts reality
          python -m homelabnext.cli scripts runner-lint
      - name: detections lint, fixtures, ATT&CK map, no engine rule numbers in agent files
        run: |
          python -m homelabnext.detections lint
          python -m homelabnext.detections lint-ids
          python -m homelabnext.detections run
          python -m homelabnext.detections map --check
          python -m homelabnext.detections coverage --check detections/attack_coverage.json
      - name: every event type and shared table has passing publisher and consumer contract tests
        run: python tools/contract_coverage.py
      - name: registers build from the examples, record Links blocks current
        run: |
          python -m homelabnext.registers build examples/registers build/registers
          python -m homelabnext.registers links --check examples/registers/lessons examples/registers/runbooks
          python -m homelabnext.registers review examples/registers
      - name: conformance coverage (all 16 capabilities have a passing suite)
        run: python tools/conform_coverage.py
      - name: system pages match the inventory (L-05)
        run: python -m homelabnext.cli docs systems check examples/services.yml docs/systems
      - name: capability reference pages match the contracts, suites and adapters (L-05)
        run: python -m homelabnext.cli docs capabilities check
      - name: knowledge graph current, no dangling edge or duplicate id (L-05)
        run: python -m homelabnext.cli graph check
      - name: hnx entry point
        run: |
          hnx --help
          hnx registry validate examples/services.yml
          hnx custom check

  # The example invariants register's fast criteria through the runner (the plugin-only rows X-04,
  # X-06, X-09 and X-10 run nowhere else); slow criteria are the gates of the other jobs.  No state
  # file and --no-notify: CI never pages.  Could-not-measure (exit 100) fails the job here, where
  # every dependency is installed.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: test
      - name: invariants register, fast criteria
        run: make invariants PY=python

  # Go: every tracked go.mod is a module (tools/go_modules.py; <module>/tools/go.mod is that
  # module's linters, not a module of its own), and the go job runs once per module, so a second or
  # nested module is checked without being listed anywhere.  With no module the go job is skipped
  # and go-ok passes: a no-op.  Go outside every module, or a go.work, fails go-modules.
  go-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
      present: ${{ steps.discover.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: discover the Go modules
        id: discover
        run: python tools/go_modules.py --github-output "$GITHUB_OUTPUT"

  # One Go module.  Tests run as the runner user in a network namespace with only loopback (no
  # network), race-enabled and shuffled; tests that need root run first, under sudo, and
  # tools/go_test_policy.py judges both event streams: no failure, no build failure, no skip without
  # a registered reason (skip_reasons in pyproject.toml), quarantines in the module's skips.yml
  # bounded to 90 days.
  #
  # Trust: the root run's handshake (its streams, each binary's exit status, the policy that judges
  # them) guards against accidents -- a TestMain that crashes after PASS, a race after the tests, a
  # test that writes where it should not -- not against hostile test code.  Root-run tests are root
  # and can rewrite anything in this job, the results and the policy copy included.  The main run's
  # tests are the runner user under no_new_privs (setpriv --no-new-privs: no sudo), so they cannot
  # write the root-owned results directory or the policy copied into it before any test ran, but
  # the workspace, the toolchains and the caches are the runner user's.  Isolating the root run for
  # real would take a job of its own that passes on nothing but its stream.
  go:
    needs: go-modules
    if: needs.go-modules.outputs.present == 'true'
    name: go (${{ matrix.module.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.go-modules.outputs.modules) }}
    env:
      GOFLAGS: -mod=readonly  # go.mod and go.sum are inputs: a build never rewrites them
      GOTOOLCHAIN: local  # the go setup-go installed from go.mod, never a download
      GOWORK: "off"  # each module on its own: a go.work never changes how modules resolve
    defaults:
      run:
        working-directory: ${{ matrix.module.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: ${{ matrix.module.dir }}/go.mod
          cache-dependency-path: ${{ matrix.module.dir }}/**/go.sum  # the module's and tools/'s
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: yaml  # go_test_policy.py reads skips.yml
          install-project: "false"
      # before any of the module's code runs: a directory only root can write, for the streams and
      # exit statuses, and in it a copy of the policy tool and its inputs, which judges them later
      - name: a root-owned results directory with a copy of the policy, before any test runs
        run: |
          pol="$RUNNER_TEMP/go-results/policy"
          sudo install -d -m 0755 "$RUNNER_TEMP/go-results" "$pol"
          sudo install -m 0644 "$GITHUB_WORKSPACE/tools/go_test_policy.py" \
            "$GITHUB_WORKSPACE/pyproject.toml" "$pol/"
          if [ -f skips.yml ]; then sudo install -m 0644 skips.yml go.mod "$pol/"; fi
      - name: modules downloaded and verified against go.sum
        run: go mod download && go mod verify
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build every package and binary
        run: go build ./...
      # Linters as Go tool dependencies: version and checksum pinned by tools/go.mod and go.sum.
      - name: staticcheck and govulncheck (pinned in tools/go.mod)
        if: matrix.module.tools
        run: |
          go tool -modfile=tools/go.mod staticcheck ./...
          go tool -modfile=tools/go.mod govulncheck ./...
      # the reason go_test_policy.py reads is the last line before --- SKIP: a skip says it in
      # the call, on one line (no SkipNow or Skipf, whose reason is a logged or formatted line)
      - name: every skip names its reason in the call
        run: python "$RUNNER_TEMP/go-results/policy/go_test_policy.py" --check-sources .
      - name: root-only tests (skips.yml privileged) under sudo, no network
        run: |
          res="$RUNNER_TEMP/go-results"
          pol="$res/policy"
          out="$res/go-test-root.json"
          exits="$res/go-test-root.exit"
          sudo install -m 0644 /dev/null "$out"
          sudo install -m 0644 /dev/null "$exits"
          policy=()
          if [ -f "$pol/skips.yml" ]; then policy=(--policy "$pol/skips.yml"); fi
          python "$pol/go_test_policy.py" "${policy[@]}" --list-privileged > "$RUNNER_TEMP/privileged.txt"
          while read -r pkg rx; do
            [ -n "$pkg" ] || continue
            bin="$RUNNER_TEMP/privileged-$(echo "$pkg" | tr '/.' '__').test"
            go test -c -race -o "$bin" "$pkg"
            imp=$(go list "$pkg")
            # the verdict is go_test_policy.py's (next step): the stream, and this exit status,
            # which test2json does not see (a TestMain panic after PASS still reads as a pass)
            # only root writes the results (sudo tee); --no-new-privs, though root holds every
            # privilege already, keeps both runs from gaining any through an exec
            (cd "$pkg" && status=0 && { sudo unshare --net -- \
              sh -c 'ip link set lo up && exec setpriv --no-new-privs -- "$@"' \
              sh "$bin" -test.run "$rx" -test.count=1 -test.v=test2json 2>&1 || status=$?; } \
              && echo "$imp $status" | sudo tee -a "$exits" > /dev/null) \
              | go tool test2json -t -p "$imp" | sudo tee -a "$out" > /dev/null
          done < "$RUNNER_TEMP/privileged.txt"
      - name: tests (race, shuffled, no network) judged by go_test_policy.py
        run: |
          res="$RUNNER_TEMP/go-results"
          pol="$res/policy"
          policy=(--pyproject "$pol/pyproject.toml")
          if [ -f "$pol/skips.yml" ]; then policy+=(--policy "$pol/skips.yml"); fi
          out="$res/go-test.json"
          # every package the run covers must show up in the stream, even one that has no tests
          go list ./... | sudo tee "$res/go-packages.txt" > /dev/null
          status=0
          # root opens the stream file, then drops to the runner user, which cannot sudo from there
          sudo env "PATH=$PATH" "HOME=$HOME" \
            "GOFLAGS=$GOFLAGS" "GOTOOLCHAIN=$GOTOOLCHAIN" "GOWORK=$GOWORK" \
            unshare --net -- \
            sh -c 'ip link set lo up && exec setpriv --no-new-privs --reuid="$1" --regid="$2" \
              --clear-groups -- go test -race -shuffle=on -count=1 -json ./... > "$3"' \
            sh "$(id -u)" "$(id -g)" "$out" || status=$?
          # go test exits 1 on a quarantined failure too: the policy tool judges the stream and
          # go's own exit status together (any other status, or a 1 the stream does not explain,
          # fails), so a stream cut short cannot pass while go test failed
          python "$pol/go_test_policy.py" "${policy[@]}" \
            --privileged "$res/go-test-root.json" \
            --privileged-exit "$res/go-test-root.exit" \
            --forbid 'python3 not available' --go-exit "$status" \
            --expect-packages "$res/go-packages.txt" "$out"

  # One stable check name for branch protection, whatever the modules are called: the discovery
  # passed, and every module's go job passed (or there was none to run).
  go-ok:
    needs: [go-modules, go]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: the Go modules were discovered and every one passed
        env:
          MODULES: ${{ needs.go-modules.result }}
          GO: ${{ needs.go.result }}
        run: |
          echo "go-modules: $MODULES, go: $GO"
          [ "$MODULES" = success ] && { [ "$GO" = success ] || [ "$GO" = skipped ]; }

  # Build the sdist and wheel exactly as a release would and leak-scan what they contain (the
  # path allowlist for both artefacts is tests/packaging/test_artifacts.py, run by `test`).
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          packages: build
          install-project: "false"
      - name: build sdist and wheel (no isolation, so the build backend is the hash-pinned one)
        run: python -m build --no-isolation --outdir "$RUNNER_TEMP/dist" .
      - name: list the wheel and leak-scan both unpacked artefacts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/unpacked"
          mkdir -p "$out/wheel" "$out/sdist"
          python -m zipfile -e "$RUNNER_TEMP"/dist/*.whl "$out/wheel"
          tar -xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$out/sdist"
          python -m zipfile -l "$RUNNER_TEMP"/dist/*.whl >> "$GITHUB_STEP_SUMMARY"
          rm "$out"/wheel/*.dist-info/RECORD  # file hashes by construction
          python tools/leak_scan.py "$out"

  leak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: scan the tree
        run: python tools/leak_scan.py .
      - name: scan the commits of this push or pull request (messages, added lines, identities)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD_SHA"
          else
            range="$HEAD_SHA"  # new branch: the whole reachable history
          fi
          echo "range: $range"
          git log --format=%B "$range" | python tools/leak_scan.py --stdin
          python tools/leak_scan.py --check-authors "$range"
          # network and identity shapes in every added line, so a value committed and then
          # deleted inside the same pull request is still caught
          if [ "$range" != "$HEAD_SHA" ]; then
            python tools/leak_scan.py --history "$range"
          fi

  register-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: yaml  # the register tooling parses YAML
          install-project: "false"
      - name: no record vanished relative to the base, no key twice, every record has its uid
        # the same base rule as the schemas job: a pull request's base must be readable; a push
        # falls back to HEAD^ when its previous tip is zero or gone; other events and a shallow
        # checkout are errors; the base used is printed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          zero=0000000000000000000000000000000000000000
          case "$EVENT" in
            pull_request)
              if ! base=$(git rev-parse --verify --quiet "${PR_BASE:-0}^{commit}"); then
                echo "::error::the pull request's base ${PR_BASE:-(unset)} is not readable"
                exit 1
              fi ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] \
                 && base=$(git rev-parse --verify --quiet "$BEFORE^{commit}"); then
                :
              elif base=$(git rev-parse --verify --quiet "HEAD^^{commit}"); then
                # with fetch-depth: 0 an unreadable non-zero tip is a force-push; a shallow
                # checkout of depth > 1 would also land here (latent: every job fetches in full)
                if [ -z "$BEFORE" ] || [ "$BEFORE" = "$zero" ]; then
                  echo "a new branch (the push's previous tip is zero): HEAD^"
                else
                  echo "a force-push (the push's previous tip $BEFORE is not fetchable): HEAD^"
                fi
              elif [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                echo "::error::no base and the checkout is shallow (fetch-depth: 0)"
                exit 1
              else
                base=""
              fi ;;
            *)
              echo "::error::event ${EVENT:-(unset)}: only push and pull_request have a base rule"
              exit 1 ;;
          esac
          echo "register ids: base ${base:-none (a root commit)}"
          if [ -n "$base" ]; then
            make ids-check PY=python BASE="$base"
          else
            make ids-check PY=python
          fi

  # Q-08: every bugfix commit of this push or pull request touches a test file, and that test fails
  # on the fix's parent (tools/fix_has_test.py --prove; CONTRIBUTING.md "Bug fixes").
  regression-tests:
    needs: go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: test,ansible  # a fix to an ansible plugin proves its test like any other
      # a Go fix proves its test with go test (no toolchain is "cannot prove", never a pass); the
      # pinned GO_VERSION, which switches to a newer toolchain a module's go.mod asks for
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        if: needs.go-modules.outputs.present == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: every fix ships a regression test that fails without the fix
        # the same base rule as the schemas and register-ids jobs: a pull request's base must be
        # readable; a push falls back to HEAD^ when its previous tip is zero or gone; other events
        # and a shallow checkout are errors; the base used is printed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base=""
          zero=0000000000000000000000000000000000000000
          case "$EVENT" in
            pull_request)
              if ! base=$(git rev-parse --verify --quiet "${PR_BASE:-0}^{commit}"); then
                echo "::error::the pull request's base ${PR_BASE:-(unset)} is not readable"
                exit 1
              fi ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] \
                 && base=$(git rev-parse --verify --quiet "$BEFORE^{commit}"); then
                :
              elif base=$(git rev-parse --verify --quiet "HEAD^^{commit}"); then
                # with fetch-depth: 0 an unreadable non-zero tip is a force-push; a shallow
                # checkout of depth > 1 would also land here (latent: every job fetches in full)
                if [ -z "$BEFORE" ] || [ "$BEFORE" = "$zero" ]; then
                  echo "a new branch (the push's previous tip is zero): HEAD^"
                else
                  echo "a force-push (the push's previous tip $BEFORE is not fetchable): HEAD^"
                fi
              elif [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                echo "::error::no base and the checkout is shallow (fetch-depth: 0)"
                exit 1
              else
                base=""
              fi ;;
            *)
              echo "::error::event ${EVENT:-(unset)}: only push and pull_request have a base rule"
              exit 1 ;;
          esac
          echo "regression tests: base ${base:-none (a root commit)}"
          if [ -n "$base" ]; then
            python tools/fix_has_test.py --range "$base..$HEAD_SHA" --prove
          fi

  # Developer Certificate of Origin: every non-merge commit of a pull request carries a
  # Signed-off-by trailer for its author (CONTRIBUTING.md, ground rule 1); GitHub App bots are exempt.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD_SHA"); do
            author=$(git log -1 --format='%ae' "$c")
            # GitHub App bots (Dependabot) cannot certify the DCO; the maintainer who merges does.
            if [[ "$author" =~ ^[0-9]+\+[a-z0-9-]+\[bot\]@users\.noreply\.github\.com$ ]]; then
              continue
            fi
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" \
                 | grep -qiF "<$author>"; then
              echo "::error::commit $(git log -1 --format=%h "$c") has no Signed-off-by for its author (git commit -s)"
              bad=1
            fi
          done
          exit "$bad"

  # The pre-commit hooks that do not need their own environment, run on the whole tree.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          extras: yaml
          install-project: "false"
      - name: merge markers, large files, private keys, YAML/JSON syntax, symlinks
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          import yaml

          class Loader(yaml.SafeLoader):
              pass

          # Ansible and CloudFormation tags are data here; only the syntax is checked
          Loader.add_multi_constructor("!", lambda loader, suffix, node: None)
          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True)
          problems = []
          # fixtures that are malformed on purpose (a role-lint parse-error case)
          invalid_on_purpose = ("tests/roles/fixtures/RL000/",)
          marker = re.compile(rb"^(?:<{7}|>{7})(?: |$)|^={7}$", re.M)
          key = re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY")
          for name in files.stdout.decode().split("\0"):
              if not name:
                  continue
              if os.path.islink(name):
                  problems.append(f"{name}: symbolic link (packaging refuses them)")
                  continue
              data = open(name, "rb").read()
              if len(data) > 512 * 1024:
                  problems.append(f"{name}: larger than 512 KB")
              if marker.search(data):
                  problems.append(f"{name}: merge-conflict marker")
              if key.search(data):
                  problems.append(f"{name}: private key block")
              try:
                  if name.startswith(invalid_on_purpose):
                      pass
                  elif name.endswith((".yml", ".yaml")):
                      list(yaml.load_all(data, Loader=Loader))
                  elif name.endswith(".json"):
                      json.loads(data)
              except Exception as exc:  # noqa: BLE001 - report every parse failure
                  problems.append(f"{name}: does not parse ({exc.__class__.__name__})")
          print("\n".join(problems) or "hygiene: clean")
          sys.exit(1 if problems else 0)
          PY

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The gitleaks-action needs a licence secret for organisation repositories; the CLI does not.
      # Version and checksum are pinned together: bump both from the release's checksums file.
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks over full history (.gitleaks.toml)
        run: gitleaks git . --no-banner --redact --verbose
      - name: gitleaks over the checked-out tree
        run: gitleaks dir . --no-banner --redact --verbose

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-deps
        with:
          python-version: "3.12"
          packages: pip-audit
          install-project: "false"
      - name: known vulnerabilities in every pinned dependency
        run: python -m pip_audit --strict --progress-spinner off --disable-pip --require-hashes -r constraints/ci.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          # LGPL only as an unmodified dependency (CONTRIBUTING.md, ground rule 8)
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  markdown-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: check relative links and anchors (offline, deterministic)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --offline --no-progress --include-fragments "./**/*.md"
          fail: true
