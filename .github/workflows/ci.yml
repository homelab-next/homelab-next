# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Action pins below are full commit SHAs; the trailing comment names the release.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ruff
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python tools/check_spdx.py
      - run: python tools/check_changelog.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # the optional lake extras installed: the DuckDB/Iceberg tests run
          - python-version: "3.12"
            extras: "test,lake"
          # the extras absent: proves the lake tests skip cleanly instead of failing
          - python-version: "3.11"
            extras: "test"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[${{ matrix.extras }}]"
      - run: python -m pytest -q -m "not live"

  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: schema contracts (examples, negatives, additive evolution, frozen baselines)
        run: python tools/schema_check.py --strict
      - name: no raw endpoints
        run: python tools/no_raw_endpoints.py .
      - name: role and playbook lint
        run: |
          python tools/role_lint.py ansible/roles/*
          python tools/role_lint.py --playbook ansible/playbooks/*.yml --inventory ansible/inventory/example/hosts.yml
      - name: detections lint, fixtures and ATT&CK map
        run: |
          python -m homelabnext.detections lint
          python -m homelabnext.detections run
          python -m homelabnext.detections map --check
      - name: registers build from the examples
        run: python -m homelabnext.registers build examples/registers build/registers
      - name: hnx entry point
        run: |
          hnx --help
          hnx registry validate examples/services.yml
          hnx custom check

  leak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: scan the tree
        run: python tools/leak_scan.py .
      - name: scan commit messages of this push or pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            git log --format=%B "$BASE..HEAD" | python tools/leak_scan.py --stdin
          else
            git log --format=%B | python tools/leak_scan.py --stdin
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The gitleaks-action needs a licence secret for organisation repositories; the CLI does not.
      # Version and checksum are pinned together: bump both from the release's checksums file.
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks detect (full history, .gitleaks.toml)
        run: gitleaks detect --source . --no-banner --redact --verbose

  markdown-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: check relative links and anchors (offline, deterministic)
        uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332  # v2.4.1
        with:
          args: --offline --no-progress --include-fragments "./**/*.md"
          fail: true
