# SPDX-License-Identifier: Apache-2.0
# Dependency updates.  Actions are pinned by commit SHA and dependabot keeps SHA and version
# comment together.  The cooldown leaves a new release alone for two weeks before proposing it.
# After a pip update, regenerate the hashed constraints with `make constraints` in the same PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/python-deps"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Only constraints/: listing "/" as well opened a duplicate pull request for every update.
  - package-ecosystem: pip
    directories:
      - "/constraints"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      # pydantic pins pydantic-core exactly, so a core bump on its own can never install.
      pydantic:
        patterns: ["pydantic", "pydantic-core"]
    commit-message:
      prefix: "deps"

  # The Go module and its pinned linters (orchestrator/tools/go.mod); it also raises the
  # toolchain line that actions/setup-go reads.
  - package-ecosystem: gomod
    directories:
      - "/orchestrator"
      - "/orchestrator/tools"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
