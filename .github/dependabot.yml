# SPDX-License-Identifier: Apache-2.0
# Dependency updates.  Actions are pinned by commit SHA and dependabot keeps SHA and version
# comment together.  The cooldown leaves a new release alone for two weeks before proposing it.
# After a pip update, regenerate the hashed constraints with `make constraints` in the same PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/python-deps"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directories:
      - "/"
      - "/constraints"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
