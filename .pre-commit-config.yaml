# Install: pip install pre-commit && pre-commit install
# SPDX-License-Identifier: Apache-2.0
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # v0.17.1
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      # Generic shapes: addresses, MACs, e-mails, private TLDs, keys, tokens, entropy.
      # Set HNX_DENYLIST=<file> locally to add run-time terms; the file is never committed.
      - id: leak-scan
        name: leak scan (generic patterns + optional HNX_DENYLIST)
        entry: python3 tools/leak_scan.py
        language: system
        pass_filenames: true
      # detect-secrets-style: credential shapes only, so it can be bypassed for nothing else.
      - id: secret-scan
        name: secret scan (key material and tokens)
        entry: python3 tools/leak_scan.py --groups secret
        language: system
        pass_filenames: true
      - id: spdx-header
        name: SPDX header on Python, shell, YAML and TOML files
        entry: python3 tools/check_spdx.py
        language: system
        files: '\.(py|sh|ya?ml|toml)$'
        exclude: '(^|/)golden/'
      # Register ids: never pick one by hand.  Write XX-NEW (LL-NEW, RB-NEW, ...) and commit it as
      # is: XX-NEW is a valid committed state.  A maintainer allocates numbers once, at merge time,
      # on the target branch (`make ids-resolve`, or `pre-commit run register-ids-resolve
      # --hook-stage manual`), under a per-repository lock kept in the git common dir.
      # `check-lost` refuses any commit in which an id that the parent commit had has vanished (a
      # merge that fused two entries); `check-dupes` refuses an allocated id that occurs twice.
      # Record directories (lessons/LL-001.md) are checked whole: the hooks take no file names and
      # find every register themselves, so a commit that only deletes a record file is still seen.
      - id: register-ids-resolve
        name: register ids - resolve NEW placeholders (maintainers, at merge time)
        entry: python3 tools/register_ids.py resolve
        language: system
        stages: [manual]
        pass_filenames: false
        files: '(^|/)((lessons|runbooks|invariants|queue)\.ya?ml|(lessons|runbooks)/[^/]+\.md)$'
      - id: register-ids-check-lost
        name: register ids - no id may vanish
        entry: python3 tools/register_ids.py check-lost
        language: system
        pass_filenames: false
        always_run: true
      - id: register-ids-check-dupes
        name: register ids - no allocated id twice
        entry: python3 tools/register_ids.py check-dupes
        language: system
        pass_filenames: false
        files: '(^|/)((lessons|runbooks|invariants|queue)\.ya?ml|(lessons|runbooks)/[^/]+\.md)$'
      - id: register-links
        name: register records - generated Links blocks current
        entry: python3 -m homelabnext.registers links --check examples/registers/lessons examples/registers/runbooks
        language: system
        pass_filenames: false
        files: '(^|/)(lessons|runbooks)/[^/]+\.md$'
