# Upgrade: validate and record a pinned image bump (openwebui_target_image, tag and digest), export
# the data directory first (its database is migrated forward on the new image's first start and
# cannot be opened by the old one afterwards), then converge with the new pin.
#   ansible-playbook -i <inventory> modules/openwebui/playbooks/upgrade.yml -e openwebui_target_image=<ref>
- name: Upgrade Open WebUI
  hosts: mod_openwebui_server
  become: true
  tasks:
    - name: Validate and record the bump
      ansible.builtin.include_role:
        name: openwebui
        tasks_from: upgrade
    - name: Export the data directory before the new image opens it
      ansible.builtin.include_role:
        name: openwebui
        tasks_from: export
    - name: Converge on the new pin
      ansible.builtin.include_role:
        name: openwebui
      vars:
        openwebui_image: "{{ openwebui_target_image }}"
