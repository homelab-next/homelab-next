# Restore the data directory (the database with its accounts and chats, the uploads); the settings
# are the environment's and are not in it.
- block:
    - name: Map this module's settings onto the core role's
      ansible.builtin.include_tasks: map.yml
    - name: Delegate to the core role (restore)
      ansible.builtin.include_role:
        name: open_webui
        tasks_from: restore
      vars:
        open_webui_restore_source: "{{ openwebui_restore_source }}"
  tags: [restore]
