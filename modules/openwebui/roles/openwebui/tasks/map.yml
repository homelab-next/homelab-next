# The core open_webui role's inputs, from this module's: one place, so every hook converges on the
# very same application spec. Nothing here is a secret (references only).
- name: Map this module's settings onto the core role's
  ansible.builtin.set_fact:
    open_webui_gateway_id: "{{ openwebui_gateway_id }}"
    open_webui_image: "{{ openwebui_image }}"
    open_webui_gateway_capabilities: [inference]
    open_webui_gateway_impls: "{{ openwebui_gateway_impls }}"
    open_webui_gateway_key_ref: "{{ openwebui_gateway_key_ref }}"
    open_webui_gateway_tlp: "{{ openwebui_gateway_tlp }}"
    open_webui_gateway_tag_prefix: "{{ openwebui_gateway_tag_prefix }}"
    open_webui_gateway_tag_per_user: true
    open_webui_session_key_ref: "{{ openwebui_session_key_ref }}"
    open_webui_oidc_issuer_url: "{{ openwebui_oidc_issuer_url }}"
    open_webui_oidc_client_id: "{{ openwebui_logical_id }}"
    open_webui_oidc_client_secret_ref: "{{ openwebui_oidc_client_secret_ref }}"
    open_webui_oidc_provider_name: "{{ openwebui_oidc_provider_name }}"
    open_webui_admin_email: "{{ openwebui_admin_email }}"
    open_webui_admin_password_ref: "{{ openwebui_admin_login_ref }}"
    open_webui_public_url: "{{ openwebui_public_url }}"
    open_webui_bind: "{{ openwebui_bind }}"
    open_webui_port: "{{ openwebui_port }}"
    open_webui_dir: "{{ openwebui_dir }}"
    open_webui_owner: "{{ openwebui_owner }}"
    open_webui_group: "{{ openwebui_group }}"
    open_webui_mem_limit: "{{ openwebui_mem_limit }}"
    open_webui_extra_env: "{{ openwebui_extra_env }}"
    open_webui_web_search_id: "{{ openwebui_web_search_id }}"
    open_webui_web_search_result_count: "{{ openwebui_web_search_result_count }}"
    open_webui_export_dir: "{{ openwebui_export_dir }}"
    open_webui_start: "{{ openwebui_start }}"
    open_webui_validate_with_docker: "{{ openwebui_validate_with_docker }}"
    open_webui_health_timeout: "{{ openwebui_health_timeout }}"
  no_log: true

# The concierge shim (off: nothing below changes the core role's inputs). Open WebUI's one connection
# points at the shim, with the shim's own token; the shim is an extra service of the same project.
- name: The concierge shim's settings (no secret in them)
  ansible.builtin.set_fact:
    openwebui_concierge_config: >-
      {{ {'port': openwebui_concierge_port | int, 'bind': '0.0.0.0',
          'gateway_url': lookup('hnx_registry', openwebui_gateway_id, field='url'),
          'default_tlp': openwebui_gateway_tlp, 'max_tlp': openwebui_gateway_tlp,
          'default_tag': openwebui_gateway_tag_prefix,
          'history_chars': openwebui_concierge_history_chars | int,
          'max_body_bytes': 4000000, 'timeout_s': openwebui_concierge_timeout_s | int,
          'always_on_tier': openwebui_concierge_always_on_tier,
          'tiers': openwebui_concierge_tiers, 'models': openwebui_concierge_models,
          'persona': openwebui_concierge_persona}
         | combine({'context': {'url': lookup('hnx_registry', openwebui_concierge_context_id, field='url'),
                                'allowed': openwebui_concierge_context_allowed,
                                'ceiling': openwebui_concierge_context_ceiling,
                                'top_k': openwebui_concierge_context_top_k | int}}
                   if openwebui_concierge_context_id | length > 0 else {}) }}
  when: openwebui_concierge_enabled | bool

- name: The concierge shim's inputs for the core role
  ansible.builtin.set_fact:
    open_webui_connection_url: "http://concierge-shim:{{ openwebui_concierge_port }}/v1"
    open_webui_connection_key_ref: "{{ openwebui_concierge_link_ref }}"
    open_webui_extra_secret_env:
      concierge-shim: >-
        {{ {'CONCIERGE_GATEWAY_KEY': openwebui_gateway_key_ref, 'CONCIERGE_TOKEN': openwebui_concierge_link_ref}
           | combine({'CONCIERGE_CONTEXT_TOKEN': openwebui_concierge_context_link_ref}
                     if openwebui_concierge_context_id | length > 0 else {}) }}
    open_webui_extra_services:
      concierge-shim:
        image: "{{ openwebui_concierge_image.split('@')[0].rsplit(':', 1)[0] }}"
        tag: "{{ openwebui_concierge_image.split('@')[0].rsplit(':', 1)[1] }}"
        digest: "{{ openwebui_concierge_image.split('@')[1] }}"
        command: [python, /opt/concierge/concierge_shim.py]
        user: "65534:65534"
        read_only: true
        environment:
          CONCIERGE_CONFIG: /etc/concierge/config.json
          CONCIERGE_CONFIG_SHA: "{{ (openwebui_concierge_config | to_json ~ lookup('ansible.builtin.file', role_path ~ '/files/concierge_shim.py')) | hash('sha256') }}"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
        volumes:
          - "{{ openwebui_dir }}/concierge/concierge_shim.py:/opt/concierge/concierge_shim.py:ro"
          - "{{ openwebui_dir }}/concierge/config.json:/etc/concierge/config.json:ro"
        mem_limit: "{{ openwebui_concierge_mem_limit }}"
        healthcheck:
          test: [CMD, python, /opt/concierge/concierge_shim.py, --healthcheck]
          interval: 30s
          timeout: 10s
          retries: 5
          start_period: 20s
  when: openwebui_concierge_enabled | bool
