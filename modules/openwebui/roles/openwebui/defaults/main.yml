# Open WebUI, the chat slot's provider (modules/openwebui): the core open_webui role (a compose_app)
# with this module's policy. Required, with no default (the site's): openwebui_logical_id (the
# instance's registry id, also the OpenID Connect client's id), openwebui_gateway_id (the lab's own
# LLM gateway's registry id), openwebui_gateway_impls (the product that gateway row names: the
# gateway and an engine behind it both answer as 'inference', and this app may reach the gateway only),
# openwebui_public_url (https://<the row's public_hostname>),
# openwebui_oidc_issuer_url (https://<sso name>/realms/<realm>), openwebui_oidc_client_secret_ref
# (the realm generator's name for this row's client secret) and openwebui_admin_email.
openwebui_image: "ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded"
# this app's own key at the gateway (the gateway spec's `keys:` entry for it); outside this module's
# namespace, since the gateway's spec names it, and read by name at deploy time
openwebui_gateway_key_ref: secret:gateway/key-openwebui
# the label of what this app sends (X-HNX-TLP on every gateway call) and the usage tag's prefix; the
# tag is <prefix>:<signed-in user's id>, so the gateway's records say whose calls they are
openwebui_gateway_tlp: amber
openwebui_gateway_tag_prefix: openwebui
openwebui_session_key_ref: secret:openwebui/session-key
openwebui_admin_login_ref: secret:openwebui/admin-password
openwebui_oidc_provider_name: SSO
# published on the guest's own address, never all interfaces: the edge guest reaches it there
openwebui_bind: "{{ ansible_host }}"
openwebui_port: 8080
openwebui_dir: /opt/compose/openwebui
openwebui_owner: root
openwebui_group: root
openwebui_mem_limit: 2g
# optional web search through the lab's metasearch service: its registry id (capability web-search;
# empty: web search stays off) and how many results go in front of the model. Answers are made from
# the results' snippets: this container fetches no result page and embeds nothing
openwebui_web_search_id: ""
openwebui_web_search_result_count: 5
# extra, non-secret settings from the core role's allowlist (open_webui_allowed_env)
openwebui_extra_env: {}
openwebui_export_dir: /var/backups/compose/openwebui/export
openwebui_start: true
openwebui_validate_with_docker: true
openwebui_health_timeout: 10
# --- the concierge shim (optional; off keeps Open WebUI talking to the gateway directly) ---
# A small OpenAI-compatible front between Open WebUI and the gateway (files/concierge_shim.py, standard
# library only, run from the pinned stock Python image with the file mounted read-only): named model
# tiers mapped to gateway roles, a lab persona, bounded history, optional retrieval from the lab's
# context service. It holds the gateway key (openwebui_gateway_key_ref); Open WebUI holds only the
# shim's own token, and the shim's port is never published (the compose network only).
openwebui_concierge_enabled: false
openwebui_concierge_image: "docker.io/library/python:3.11.17-slim-trixie@sha256:b7a9e5f6a93d6d4a31f129bbd4bdee69efccb6ded0fb230d78aafaf37af98377"
openwebui_concierge_link_ref: secret:openwebui/shim-token
openwebui_concierge_mem_limit: 256m
# tier name -> gateway role. A tier is offered in the model list only while the gateway lists its role
# (the main tier always), so fast and deep appear on their own when their roles exist.
openwebui_concierge_tiers: {fast: fast, main: main-reasoner, deep: deep}
openwebui_concierge_always_on_tier: main
# the models Open WebUI shows: id, tier and (optional) persona/context overrides
openwebui_concierge_models:
  - {id: concierge-fast, tier: fast}
  - {id: concierge, tier: main}
  - {id: concierge-deep, tier: deep}
# the system prompt every model gets (empty: none); the site's text
openwebui_concierge_persona: ""
# the newest turns kept within this many characters of history (the system messages always stay)
openwebui_concierge_history_chars: 48000
openwebui_concierge_timeout_s: 600
# optional retrieval from the lab's context service: its registry id (empty: off), the token's
# reference, the namespaces the shim may read (the service's `allowed`) and the most restrictive label a
# passage may carry to be sent to a model; a model sets `context: true` to use it
openwebui_concierge_context_id: ""
openwebui_concierge_context_link_ref: secret:context/openwebui-token
openwebui_concierge_context_allowed: []
openwebui_concierge_context_ceiling: amber
openwebui_concierge_context_top_k: 4
