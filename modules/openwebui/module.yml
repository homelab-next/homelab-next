# SPDX-License-Identifier: Apache-2.0
# The chat provider on Open WebUI (docs/modules.md; README.md beside this file): the core open_webui
# role (a compose_app container from a pinned image) with this module's policy. Models only through
# the lab's own gateway, with this app's own key and the headers the gateway reads (X-HNX-TLP,
# X-HNX-Tag); no provider key of its own, web search only through the lab's metasearch service (opt-in)
# and every other feature that calls out off;
# sign-in through the identity provider (a client the realm generator renders for the row) and one
# break-glass local administrator. Every real value (the guest, its address, the public name, the
# secret values) is the site's: the overlay's lab/modules.yml, lab/services.yml, group variables and
# secret store.
manifest_version: "1.0"
id: openwebui
kind: provider
title: Chat on Open WebUI
description: Fills the chat slot with Open WebUI as one compose_app container behind the edge; models
  only through the lab's gateway under its own key, OpenID Connect sign-in plus a break-glass
  administrator, no internet egress; probed by the shared chat adapter.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: openwebui
  version: 0.12.5
licence:
  kind: open-source
  # Open WebUI's licence carries a branding clause (its BSD-3 terms plus a requirement to keep the
  # Open WebUI name and logo in the interface for deployments of more than 50 users); the lab has 2.
  spdx: LicenseRef-open-webui
credentials:
  - secret: secret:openwebui/session-key
    identity: key
    holder: provider
    purpose: the key Open WebUI signs its sessions with (WEBUI_SECRET_KEY, 32 characters or more); a new one signs everyone out
  - secret: secret:openwebui/admin-password
    identity: password
    holder: provider
    purpose: the break-glass local administrator's password, used only when the database has no user (12 characters or more); the identity provider is the everyday sign-in
identifiers:
  - {kind: secret-name, name: openwebui, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the session key, the administrator's password, this app's gateway key (gateway/key-openwebui) and the sign-in client's secret (idp/clients/<instance>) are read by name at deploy time
    - cap: cap:inference
      version: "1.0"
      purpose: the lab's gateway, the app's only source of models (no engine and no provider is called directly)
    - cap: cap:idp
      version: "1.0"
      purpose: the sign-in (OpenID Connect, authorization code with PKCE) and the realm's client for this row
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 2, memory_mb: 3072, disk_gb: 10}
      guest:
        baselines: [base]
      roles: [role:openwebui]
      purpose: runs the Open WebUI container (docker_engine applied first, compose_app renders it)
provides:
  slots:
    chat:
      adapter: homelabnext.conform.adapters.chat:make
      provisional: true
      reason: chat has no contract yet; the obvious standard is the app answering its health check and its public configuration (an administrator exists, sign-up off, the sign-in provider listed), which is what the role's health hook reads
      migration: {formats: [object-tree], export: role:openwebui, import: role:openwebui}
egress: none
contributes:
  roles:
    - file: roles/openwebui
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:openwebui, hook: readiness}
  docs:
    - file: README.md
data:
  - id: app-data
    kind: database
    description: The data directory - the SQLite database (accounts, chats, settings the admin UI does not override), uploaded files and the vector store.
    export: {formats: [object-tree], via: role:openwebui}
    import: {formats: [object-tree], via: role:openwebui}
    retention: {keep: forever}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest): the role's upgrade hook validates and records it, the data directory is exported, then it converges (the database is migrated forward on the first start of the new image; an older image cannot open it)"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
