# The registry row (platform/service) this provider contributes. It is keyed by the slot and
# renamed to the instance the site selects; version is product.version (never repeated here), and
# host is the module's host role, which the site places on a guest. The lab registry
# (lab/services.yml) must carry it exactly as bound (hnx modules check, docs/modules/registry-rows.md).
# Internal only: no public_hostname and no public route, so the edge renders no site for it and
# the user interface is reachable on the guest's address by the zones the site's firewall admits
# (the service has no login of its own: auth: none states that, the network is the control).
# `upstreams: [notify]` names the service the alert forwarder posts to.
services:
  metrics:
    capability: metrics
    impl: prometheus  # caddy-lint: allow a provider's row never repeats its version; the site binds product.version (3.15.1) into it
    host: server
    protocol: http
    port: 9090
    health: {kind: http, path: /-/healthy, expect_status: 200}
    metrics: {path: /metrics}
    upstreams: [notify]
    owner: operator
    tls: none
    auth: none
    tags: [monitoring, ops]
    description: Prometheus with targets generated from the registry, default alert rules and an alert forwarder to the notify service. No public route.
