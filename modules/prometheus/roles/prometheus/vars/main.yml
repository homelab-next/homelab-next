# SPDX-License-Identifier: Apache-2.0
# Fixed, not settings: role vars outrank inventory, so a deployment cannot loosen them.
prometheus_container_config_dir: /etc/prometheus
prometheus_container_data_dir: /prometheus
# the port the service listens on INSIDE its container (the published prometheus_port maps to it)
prometheus_container_port: 9090
# where the generator's credential paths point (generated scrape_configs name files here)
prometheus_container_authfiles_dir: /etc/hnx/scrape-credentials
prometheus_generated_dir: generated
prometheus_scrape_file: prometheus/scrape_configs.yml
prometheus_authlist_file: prometheus/credentials.json
prometheus_node_targets_file: prometheus/node_targets.yml
prometheus_path_pattern: '^(/(?!\.\.?(?:/|\Z))[A-Za-z0-9_.-]+)+\Z'
prometheus_ref_pattern: '^secret:[a-z][a-z0-9_-]*(?:/[a-z][a-z0-9_-]*)*\Z'
prometheus_duration_pattern: '^[1-9][0-9]{0,3}[smhdwy]\Z'
prometheus_interval_pattern: '^[1-9][0-9]{0,3}[sm]\Z'
# the rules the role ships, by name (health proves each is loaded)
prometheus_base_rule_names: [Watchdog, TargetDown, NoTargets, DiskAlmostFull, FilesystemReadOnly, MemoryPressure, UpsOnBattery, UpsLowBattery, UpsMonitorDown, UpsUnreadable, UpsCheckStale]
# the hardware rules (always rendered: a host without the families never fires them)
prometheus_hardware_rule_names: [CpuTemperatureHigh, CpuTemperatureCritical, NvmeTemperatureHigh, NvmeTemperatureCritical, GpuTemperatureHigh, GpuTemperatureCritical, GpuPowerOverCap, GpuPowerCapNotApplied, GpuLost, GpuCountDropped, GpuDriverError, GpuNotComputing, PoolUnhealthy, PoolDeviceErrors, PoolDataErrors, PoolAlmostFull, BoardSensorCritical, BoardSensorWarning, FanFailed, FanReadingLost, BoardCriticalEvent, GuestDown, HardwareMetricsStale, HardwareCollectorDown]
prometheus_snmp_rule_names: [NetworkPortDown, NetworkPortErrors, NetworkPortSpeedDropped, NasDiskUnhealthy, NasDiskTemperatureHigh, NasVolumeNotReady, NasVolumeAlmostFull, NasFanStopped]
prometheus_llm_rule_names: [LlmProbeFailed, LlmProbeSlow]
# the model-server throughput rule (always rendered: it reads the llama.cpp servers' own metrics, no probe needed)
prometheus_llm_throughput_rule_names: [LlmDecodeCollapsed]
prometheus_rule_names: >-
  {{ prometheus_base_rule_names + prometheus_hardware_rule_names
     + (prometheus_llm_throughput_rule_names if prometheus_inference_metric_prefix | length > 0 else [])
     + (['ProbeDown'] if prometheus_probes_enabled | bool else [])
     + (prometheus_snmp_rule_names if prometheus_snmp_enabled | bool else [])
     + (prometheus_llm_rule_names if prometheus_llm_probes_on | bool else []) }}
prometheus_llm_probes_on: "{{ prometheus_probes_enabled | bool and prometheus_llm_probe_roles | length > 0 }}"
# the CPU temperature chips of the host exporter's hwmon collector (AMD and Intel package sensors)
prometheus_cpu_temp_chips: "k10temp|coretemp|zenpower"
# where the forwarder and its token are installed (the service's ExecStart names the script)
prometheus_alert_script: /usr/local/libexec/homelabnext/prometheus-alert-notify
prometheus_notify_auth_file: /etc/homelabnext/prometheus-notify.auth
# the shared last-run writer (role last_run) the forwarder's unit names, and the record directory
prometheus_last_run_writer: /usr/local/libexec/homelabnext/hnx-last-run
# The seconds between the forwarder's runs, derived from its schedule (validate.yml allows two)
prometheus_alert_schedules: {"*-*-* *:*:00 UTC": 60, "*-*-* *:*:00,30 UTC": 30}
prometheus_alert_interval_seconds: "{{ prometheus_alert_schedules[prometheus_alert_schedule] }}"
prometheus_alert_ignore_pattern: '^[A-Za-z0-9_/.|^$*+()-]{0,200}\Z'
prometheus_getent_cli: getent
# the probe exporter: its port inside the compose network, where it reads its modules, and the file
# the generator renders the targets to
prometheus_blackbox_port: 9115
prometheus_container_blackbox_dir: /etc/blackbox
prometheus_probe_targets_file: prometheus/probe_targets.yml
prometheus_blackbox_service: blackbox
# the SNMP exporter: its port inside the compose network, where it reads the role's modules and the
# community (a directory of its own, mounted into that container alone)
prometheus_snmp_port: 9116
prometheus_snmp_service: snmp
prometheus_container_snmp_dir: /etc/hnx-snmp
prometheus_container_snmp_auth_dir: /etc/hnx/snmp-credentials
prometheus_snmp_auth_name: hnx
# the exporter's bundled modules the role allows, and its own
prometheus_snmp_known_modules: [if_mib, ip_mib, system, hrDevice, hrStorage, hrSystem, ucd_la_table, ucd_memory, ucd_system_stats, nas_storage]
prometheus_snmp_watch_pattern: '^[A-Za-z0-9_.*+?|()\[\]^$ /-]{0,120}\Z'
# the gateway probe key's directory, mounted into the blackbox exporter alone
prometheus_container_probe_auth_dir: /etc/hnx/probe-credentials
prometheus_llm_role_pattern: '^[a-z][a-z0-9-]{0,62}\Z'
