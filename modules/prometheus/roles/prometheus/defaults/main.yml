# SPDX-License-Identifier: Apache-2.0
# The metrics provider (modules/metrics): one container from a pinned image, run by compose_app,
# with its scrape targets GENERATED from the registry (every service row with `metrics:`, plus the
# host exporter on every registry host), a small set of default alert rules, and a state-diffed
# alert forwarder that posts to the notify service. No public route; no egress but the scrapes.
# prometheus_logical_id (required): the instance's registry id, e.g. metrics
# prometheus_registry (required): absolute path of the lab registry on the controller (services.yml)
# prometheus_node_exporter_port (required): the port of the host exporter on every guest
# prometheus_network_subnet (required): the pinned compose network, an IPv4 CIDR from /16 to /29
prometheus_image: "docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2"
# published on the guest's own address (the inventory's ansible_host), never all interfaces; the
# guest firewall admits the lab's readers (the status hub, the operator's tooling)
prometheus_bind: "{{ ansible_host }}"
prometheus_port: 9090
prometheus_dir: /opt/compose/prometheus
# The compose network the container lives in, pinned so a host firewall rule can name it. The
# container reaches the guest's OWN address (the host exporter of its own guest) through the
# guest's INPUT chain, with the container's address as the source, so the guest's firewall_rules
# must admit this subnet to the exporter port (and only that: README, "The guest's own exporter").
# It must not overlap the guest's real networks or docker's other bridges. Required (no default:
# an address range is the site's, and one that clashed would be a silent outage); changing it
# recreates the network and the container.
prometheus_owner: root
prometheus_group: "{{ prometheus_gid }}"
# the module's data root on its host (docs/modules/data.md): config/ (rendered), tsdb/ (the
# container's), scrape-credentials/ (written from the secret store)
prometheus_data_root: /var/lib/hnx-modules/prometheus
# the container's user and group: an id no account on the host has
prometheus_uid: 61001
prometheus_gid: 61001
# how long samples are kept (a number and s, m, h, d, w or y), and optionally a size cap beside it
# (a number and KB, MB, GB or TB; empty: none). Both go in prometheus.yml (storage.tsdb.retention).
prometheus_retention_time: 30d
prometheus_retention_size: ""
prometheus_scrape_interval: 30s
prometheus_evaluation_interval: 30s
prometheus_mem_limit: 768m
prometheus_start: true
prometheus_validate_with_docker: true
prometheus_health_timeout: 10
# where the target lists come from: the registry (rendered on the controller by the generator)
prometheus_hnx_cli: [hnx]
# registry hosts that run no host exporter (an appliance), left out of the host target list
prometheus_node_exporter_exclude: []
# The default alert rules (the thresholds are settings; the rule set is the role's).
prometheus_alert_target_down_for: 10m
prometheus_alert_disk_used_percent: 90
prometheus_alert_disk_for: 10m
prometheus_alert_readonly_for: 2m
# Mount points a read-only mount is deliberate on (a regular expression matched against the whole
# mount point, e.g. "/boot/efi|/mnt/media"); empty: none, every read-only filesystem alerts.
prometheus_alert_readonly_ignore: ""
prometheus_alert_memory_available_percent: 10
prometheus_alert_memory_for: 10m
# The alert forwarder: a timer asks the metrics service which alerts fire and posts to the notify
# service (ntfy) by logical id, state-diffed (a message only when the set of firing alerts
# changes, once more when it empties; a failed post stays owed). A metrics service that cannot be
# asked for prometheus_unreachable_after_minutes in a row is itself alerted, once, and its recovery.
prometheus_notify_id: notify
prometheus_notify_topic: homelabnext-alerts
prometheus_notify_priority: 3
prometheus_notify_auth_ref: secret:prometheus/notify-token
# Explicit opt-in, LAN only, for a notify endpoint that has no TLS: the write-only publish token
# then travels in clear. Off: the role refuses a token over plain http.
prometheus_notify_allow_plain_http: false
# The dead-man heartbeat (LL-571): the metrics guest cannot page about itself being down, so the
# forwarder posts one minimum-priority message to this topic of the notify service every
# prometheus_heartbeat_every_minutes, only while the metrics service answers AND the always-firing
# Watchdog rule is firing. The notify service's host (a DIFFERENT host: the role refuses a notify
# service on this guest) watches the topic (module ntfy, ntfy_deadman_beats) and pages when it goes
# quiet. Empty topic: no heartbeat, and nothing outside this guest notices the metrics path die.
prometheus_heartbeat_topic: hnx-heartbeat-metrics
prometheus_heartbeat_every_minutes: 5
# Accept a heartbeat receiver whose name does not resolve on this guest (the placement guard then
# cannot show it is on another host; it still compares the registry placement). Off: refused.
prometheus_heartbeat_allow_unresolved: false
# The forwarder's timer (OnCalendar, ending in UTC): every minute, or every 30 seconds. The seconds
# between its runs (prometheus_alert_interval_seconds, vars/main.yml) are derived from it, so the
# unreachable counter can never disagree with the timer.
prometheus_alert_schedule: "*-*-* *:*:00 UTC"
prometheus_unreachable_after_minutes: 5
# The most UTF-8 bytes one alert post may carry. The notify service refuses a larger body (HTTP 400 "attachments not
# allowed", limit 4096), so during an alert storm nothing would page. Over the limit, the body keeps the
# recovery line, new FIRING (critical first), RESOLVED, then the still-firing summary, and ends "... and N more".
prometheus_alert_body_max_bytes: 4000
# Run the forwarder's --test (one low-priority message through the real send path) once at deploy
# when the channel changed, failing the play with the script's error (LL-567). Skipped in --check.
prometheus_notify_test_on_change: true
# A boot unit (compose_app_boot_unit) that runs docker compose up -d after docker at every boot, so the
# container that sat Exited for 16 h after a power cycle (LL-571) is started; remove deletes it.
prometheus_boot_unit: true
prometheus_systemctl_cli: systemctl
prometheus_unit_dir: /etc/systemd/system
prometheus_state_dir: /var/lib/homelabnext/prometheus
# The forwarder's last-run record (role last_run, docs/role-interface.md section 8): the shared
# per-host directory the status hub's job-last-run mapping reads, and the group that may read it.
prometheus_last_run_dir: /var/lib/homelabnext/last-run
prometheus_last_run_group: root
# HTTP(S) up/down probes (the Kuma function). Off by default; on, the role runs a blackbox exporter
# beside the service (a second container of the same compose project, pinned by digest), renders
# the probe target list from the registry (every row published at the edge, or declaring an http
# health endpoint, less prometheus_probe_exclude: a row published at the edge is probed by its edge
# name, any other by the name it answers by) and a ProbeDown rule that goes through the same
# state-diffed forwarder as every other alert. An edge answer of 2xx, 3xx, 401 or 403 is "up"
# (a login redirect is the edge working); a 5xx, a refused connection, a bad certificate or no
# answer in prometheus_probe_timeout is "down".
prometheus_probes_enabled: false
prometheus_probe_exclude: []
prometheus_probe_interval: 60s
prometheus_probe_timeout: 10s
# A private CA (a secret holding its PEM) the probes also trust: services on the lab's internal
# certificates are then verified, not refused. Written beside the probe modules as the system roots
# plus this CA, so a probe of a publicly certified name still verifies. Empty: the system roots only.
prometheus_probe_ca_ref: ""
prometheus_probe_system_roots: /etc/ssl/certs/ca-certificates.crt
prometheus_alert_probe_down_for: 5m
prometheus_blackbox_image: "docker.io/prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc"
prometheus_blackbox_mem_limit: 128m
# Hardware alerts (README "Hardware alerts"): the host exporter's own CPU and NVMe temperature
# sensors, and the families the hardware-metrics control writes (pools, the board's sensors and event
# log, GPUs, the hypervisor's guests). A host without a family never fires its rules.
prometheus_alert_cpu_temp_warning_celsius: 85
prometheus_alert_cpu_temp_critical_celsius: 92
prometheus_alert_cpu_temp_warning_for: 5m
prometheus_alert_cpu_temp_critical_for: 1m
prometheus_alert_nvme_temp_warning_celsius: 70
prometheus_alert_nvme_temp_critical_celsius: 80
prometheus_alert_gpu_temp_warning_celsius: 85
prometheus_alert_gpu_temp_critical_celsius: 92
# the site's per-GPU power cap: a sustained draw over it, and a power limit in force above it, alert
prometheus_alert_gpu_power_cap_watts: 200
# LlmDecodeCollapsed: a model server generating slower than this many tokens/s (over the window) while it is serving
# requests is almost certainly on the CPU after a GPU fault (2026-11-25: 0.46 tok/s for 17 h against ~19 on the GPUs)
prometheus_alert_llm_decode_min_tps: 5
prometheus_alert_llm_decode_window: 15m
# the metric-name prefix the inference-server slot's provider exports its counters under (tokens_predicted_total, ...);
# the site sets it for its provider; empty leaves LlmDecodeCollapsed out
prometheus_inference_metric_prefix: ""
prometheus_alert_gpu_power_for: 5m
prometheus_alert_pool_used_percent: 85
prometheus_alert_board_event_window: 30m
prometheus_alert_guest_down_for: 5m
# a host expected to compute on its GPUs (hardware-metrics expect_gpu_processes) with no process
# holding GPU memory for this long: the workload fell back to the CPU or died
prometheus_alert_gpu_idle_for: 10m
# SNMP polling (README "SNMP polling"), off by default. On, an SNMP exporter runs beside the service
# (another container of the compose project, pinned by digest, no published port) and every entry of
# prometheus_snmp_targets is a job of its own: {host: <registry host id>, modules: [<module>...],
# watch_ports: <regex of ifName>}. The address is the registry host's; the community is read from the
# store by reference (prometheus_snmp_community_ref) and written owner-group readable for the exporter
# alone. watch_ports names the interfaces whose state, errors and speed alert (anchored; empty: none).
# modules: the exporter's own (if_mib, system, ...) and the role's nas_storage (disks, fans, volumes).
prometheus_snmp_enabled: false
prometheus_snmp_targets: []
prometheus_snmp_community_ref: ""
prometheus_snmp_interval: 60s
prometheus_snmp_timeout: 30s
prometheus_snmp_image: "docker.io/prom/snmp-exporter:v0.31.0@sha256:e5f1aba929145cea2a3bad89c29959efaec0dc26fb87e3761414616a1a392c1c"
prometheus_snmp_mem_limit: 128m
prometheus_alert_port_down_for: 5m
prometheus_alert_port_errors_per_minute: 10
prometheus_alert_nas_disk_temp_celsius: 55
prometheus_alert_nas_volume_used_percent: 85
# LLM completion probes through the gateway (README "Inference probes"), off by default; needs
# prometheus_probes_enabled (the blackbox exporter). Every prometheus_llm_probe_interval, each role of
# prometheus_llm_probe_roles is asked for a one-token chat completion through the gateway row
# prometheus_llm_probe_gateway with the key prometheus_llm_probe_key_ref: a refusal, a 5xx (upstream
# unavailable) or no answer in the timeout is down, and a slow answer alerts.
prometheus_llm_probe_gateway: ""
prometheus_llm_probe_roles: []
prometheus_llm_probe_key_ref: ""
prometheus_llm_probe_interval: 5m
prometheus_llm_probe_timeout: 90s
prometheus_alert_llm_probe_failed_for: 10m
prometheus_alert_llm_probe_slow_seconds: 60

# Reliability alerts (README "Reliability alerts"). Regexes are RE2, matched whole against the unit name.
# SystemdUnitFailed (warning): a unit failed for most of this window; the units matching the critical list
# page as CriticalUnitFailed instead, over the shorter window. The default names only this module set's own
# units; a site lists the agents and servers it cannot lose (the overlay's value).
prometheus_alert_unit_failed_for: 15m
prometheus_alert_unit_failed_ignore: ""
prometheus_alert_critical_units: 'hnx-lake-writer@.+\.service'
prometheus_alert_critical_unit_failed_for: 5m
# TimerJobNotSucceeding: a timer-driven oneshot failed on every run for this long (1h for a 10-minute timer)
prometheus_alert_timer_job_failing_for: 1h
# HostOomKill: any kernel OOM kill in this window
prometheus_alert_oom_window: 10m
# FilesystemFillPredicted: the trend of the last lookback says the free space ends within the horizon
prometheus_alert_fill_lookback: 6h
prometheus_alert_fill_horizon_hours: 24
prometheus_alert_fill_ignore_fstypes: 'tmpfs|overlay|squashfs|ramfs|devtmpfs|fuse.*|nsfs|proc|sysfs'
# CertExpiringSoon / CertExpiryCritical (with probes): days left on a certificate a probe sees
prometheus_alert_cert_warning_days: 14
prometheus_alert_cert_critical_days: 3
