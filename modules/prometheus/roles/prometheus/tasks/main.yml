- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Build the application spec
  ansible.builtin.include_tasks: app.yml

- name: Render the target lists for this registry (the generator, on the controller)
  ansible.builtin.include_tasks: generate.yml

- name: Refuse a credential that is not in its form before anything is written
  ansible.builtin.include_tasks: credentials.yml

- name: Create the data directories
  ansible.builtin.include_tasks: dirs.yml

- name: Install the configuration, the rules, the target lists and the scrape credentials
  ansible.builtin.include_tasks: render.yml

- name: Render and start the metrics service
  ansible.builtin.include_role:
    name: compose_app
  vars:
    compose_app_name: "{{ prometheus_app.compose_app_name }}"
    compose_app_dir: "{{ prometheus_app.compose_app_dir }}"
    compose_app_data_dir: "{{ prometheus_app.compose_app_data_dir }}"
    compose_app_export_dir: "{{ prometheus_app.compose_app_export_dir }}"
    compose_app_owner: "{{ prometheus_app.compose_app_owner }}"
    compose_app_group: "{{ prometheus_app.compose_app_group }}"
    compose_app_start: "{{ prometheus_app.compose_app_start }}"
    compose_app_validate_with_docker: "{{ prometheus_app.compose_app_validate_with_docker }}"
    compose_app_network_subnet: "{{ prometheus_app.compose_app_network_subnet }}"
    compose_app_boot_unit: "{{ prometheus_boot_unit }}"
    compose_app_unit_dir: "{{ prometheus_unit_dir }}"
    compose_app_systemctl_cli: "{{ prometheus_systemctl_cli }}"
    compose_app_spec: "{{ prometheus_app.compose_app_spec }}"

# A running Prometheus reads its configuration at start or on SIGHUP: when a file or a credential
# changed, signal it (a reload, never a restart; a bad file leaves the old configuration running
# and health reports the failed reload). The lifecycle HTTP API stays off. SIGHUP kills a process
# that has not installed its handler yet, so the signal waits for the service to say it is ready.
- name: Wait until the metrics service is ready (its signal handler is installed)
  ansible.builtin.uri:
    url: "http://{{ prometheus_bind }}:{{ prometheus_port | int }}/-/ready"
    status_code: 200
    timeout: "{{ prometheus_health_timeout | int }}"
  register: prometheus_ready
  until: prometheus_ready.status == 200
  retries: 30
  delay: 2
  changed_when: false
  when: >-
    prometheus_start | bool and not ansible_check_mode and
    (prometheus_config_written is changed or prometheus_targets_written is changed
     or prometheus_auths_written is changed or prometheus_auths_removed is changed
     or prometheus_probes_written is changed or prometheus_probes_removed is changed)

- name: Reload the metrics service when its configuration or a credential changed
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ prometheus_dir }}/docker-compose.yml", kill, -s, HUP, prometheus]
  changed_when: true
  when: >-
    prometheus_start | bool and not ansible_check_mode and
    (prometheus_config_written is changed or prometheus_targets_written is changed
     or prometheus_auths_written is changed or prometheus_auths_removed is changed
     or prometheus_probes_written is changed or prometheus_probes_removed is changed)

# the SNMP exporter reads its modules and the community at start or on SIGHUP
- name: Reload the SNMP exporter when its module or the community changed
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ prometheus_dir }}/docker-compose.yml", kill, -s, HUP, "{{ prometheus_snmp_service }}"]
  changed_when: true
  when: >-
    prometheus_start | bool and prometheus_snmp_enabled | bool and not ansible_check_mode and
    (prometheus_snmp_auth_written is changed or
     (prometheus_config_written.results | default([]) | selectattr('item.dest', 'equalto', 'snmp/snmp.yml')
      | selectattr('changed') | list | length > 0))

# the probe exporter reads its modules (and the trust bundle they name) at start or on SIGHUP
- name: Reload the probe exporter when its modules or its trust bundle changed
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ prometheus_dir }}/docker-compose.yml", kill, -s, HUP, "{{ prometheus_blackbox_service }}"]
  changed_when: true
  when: >-
    prometheus_start | bool and prometheus_probes_enabled | bool and not ansible_check_mode and
    (prometheus_probe_ca_written is changed or prometheus_llm_key_written is changed or
     (prometheus_config_written.results | default([]) | selectattr('item.dest', 'equalto', 'blackbox/blackbox.yml')
      | selectattr('changed') | list | length > 0))

- name: Install the alert forwarder and its timer
  ansible.builtin.include_tasks: alerts.yml
