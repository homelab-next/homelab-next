# The forwarder's unit ignores a failure of the last-run writer (the - prefix every role timer has),
# so a timer that runs but cannot write its record would look healthy: health looks at the record.
# Missing, unreadable or older than five intervals and a minute is a failure that names the cause.
- block:
    - name: Read the forwarder's last-run record (the unit ignores a writer failure, so health looks)
      ansible.builtin.slurp:
        src: "{{ prometheus_last_run_dir }}/timer%3Aprometheus%2Falerts.json"
      register: prometheus_last_run
      failed_when: false
    - name: Name when the forwarder last finished
      ansible.builtin.set_fact:
        prometheus_ended: "{{ (prometheus_last_run.content | default('e30=') | b64decode | from_json).finished_at | default('') }}"
    - name: Read that time, and the time now, on the host
      ansible.builtin.command:
        argv: "{{ ['date', '-u', '-d', prometheus_ended, '+%s'] if prometheus_ended is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z\\Z') else ['echo', '0'] }}"
      register: prometheus_ended_at
      changed_when: false
      check_mode: false
    - name: Read the time now on the host
      ansible.builtin.command:
        argv: [date, -u, +%s]
      register: prometheus_now
      changed_when: false
      check_mode: false
    - name: The forwarder ran lately
      ansible.builtin.assert:
        that:
          - (prometheus_now.stdout | int) - (prometheus_ended_at.stdout | int) < (prometheus_alert_interval_seconds | int) * 5 + 60
        fail_msg: >-
          prometheus: the alert forwarder has no fresh last-run record in {{ prometheus_last_run_dir }}
          (last finished {{ prometheus_ended or 'never' }}): its timer is not running, or its unit cannot
          write the record (ReadWritePaths); alerts are not being forwarded
  tags: [health]
