# Every secret the role reads resolves in its form: the alert token (printable ASCII a header can
# carry) and each scrape credential the registry names (one non-empty line). Only the verdicts
# leave the no_log tasks; a failure names the secret: reference, never a value.
- name: Look for each secret reference the role reads in the store
  ansible.builtin.set_fact:
    prometheus_unset_refs: >-
      {%- set bad = [] -%}
      {%- for ref in [prometheus_notify_auth_ref] + (prometheus_scrape_auths | map(attribute='secret') | list) -%}
      {%-   if not (lookup('hnx_secret', ref, errors='ignore') | default('', true)) -%}{%- set _ = bad.append(ref) -%}{%- endif -%}
      {%- endfor -%}
      {{ bad }}
  no_log: true
  tags: [readiness]

- name: Refuse a secret the store does not hold, by name, before anything is written
  ansible.builtin.assert:
    that: prometheus_unset_refs | length == 0
    fail_msg: "prometheus: the secret store has no value for {{ prometheus_unset_refs }}; create the entry (README, Secrets) before deploying"
  tags: [readiness]

- name: Read each credential's form
  ansible.builtin.set_fact:
    prometheus_token_ok: "{{ (lookup('hnx_secret', prometheus_notify_auth_ref) | trim) is match('^[\\x21-\\x7e]{8,200}\\Z') }}"
    prometheus_bad_auth_refs: >-
      {%- set bad = [] -%}
      {%- for a in prometheus_scrape_auths -%}
      {%-   set v = lookup('hnx_secret', a.secret) | trim -%}
      {%-   if v == '' or v.splitlines() | length != 1 -%}{%- set _ = bad.append(a.secret) -%}{%- endif -%}
      {%- endfor -%}
      {{ bad }}
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - prometheus_token_ok | bool
      - prometheus_bad_auth_refs | length == 0
    fail_msg: >-
      prometheus: {{ prometheus_notify_auth_ref }} must be a publish token for the notify service
      (8 to 200 printable characters), and each scrape credential a registry row names must be
      one non-empty line; wrong: {{ prometheus_bad_auth_refs }}
  tags: [readiness]
