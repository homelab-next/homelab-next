# The compose_app inputs (shared by main and the hooks that delegate to compose_app). Everything the
# container reads is mounted read-only (config/ and the credential files); only tsdb/ is writable.
# A reload on a changed configuration is a SIGHUP, never the lifecycle HTTP API (which would let
# anyone who can reach the port shut the server down).
- name: Build the application spec
  ansible.builtin.set_fact:
    prometheus_app:
      compose_app_name: prometheus
      compose_app_dir: "{{ prometheus_dir }}"
      compose_app_data_dir: "{{ prometheus_data_root }}"
      compose_app_export_dir: "{{ prometheus_data_root }}/export"
      compose_app_owner: "{{ prometheus_owner }}"
      compose_app_group: "{{ prometheus_group }}"
      compose_app_start: "{{ prometheus_start }}"
      compose_app_validate_with_docker: "{{ prometheus_validate_with_docker }}"
      compose_app_network_subnet: "{{ prometheus_network_subnet }}"
      compose_app_spec:
        services:
          prometheus:
            image: "{{ prometheus_image.split('@')[0].rsplit(':', 1)[0] }}"
            tag: "{{ prometheus_image.split('@')[0].rsplit(':', 1)[1] }}"
            digest: "{{ prometheus_image.split('@')[1] }}"
            command:
              - "--config.file={{ prometheus_container_config_dir }}/prometheus.yml"
              - "--storage.tsdb.path={{ prometheus_container_data_dir }}"
            user: "{{ prometheus_uid | int }}:{{ prometheus_gid | int }}"
            read_only: true
            ports: ["{{ prometheus_bind }}:{{ prometheus_port | int }}:9090"]
            volumes:
              - "{{ prometheus_data_root }}/tsdb:{{ prometheus_container_data_dir }}"
              - "{{ prometheus_data_root }}/config:{{ prometheus_container_config_dir }}:ro"
              - "{{ prometheus_data_root }}/scrape-credentials:{{ prometheus_container_authfiles_dir }}:ro"
            mem_limit: "{{ prometheus_mem_limit }}"
            healthcheck:
              test: [CMD, promtool, check, ready]  # the tool asks its own default URL, the container itself
              interval: 30s
              timeout: 5s
              retries: 5
              start_period: 30s
  tags: [health, backup, restore, export, upgrade]

# The probe exporter is a second container of the same project, only while probes are on: it reads
# its modules (rendered, mounted read-only) and publishes no port (the metrics service reaches it
# by name on the project's network).
- name: Add the probe exporter to the application spec
  ansible.builtin.set_fact:
    prometheus_app: >-
      {{ prometheus_app | combine({'compose_app_spec': {'services': prometheus_app.compose_app_spec.services | combine({
           prometheus_blackbox_service: {
             'image': prometheus_blackbox_image.split('@')[0].rsplit(':', 1)[0],
             'tag': prometheus_blackbox_image.split('@')[0].rsplit(':', 1)[1],
             'digest': prometheus_blackbox_image.split('@')[1],
             'command': ['--config.file=' ~ prometheus_container_blackbox_dir ~ '/blackbox.yml'],
             'user': (prometheus_uid | int | string) ~ ':' ~ (prometheus_gid | int | string),
             'read_only': true,
             'volumes': [prometheus_data_root ~ '/config/blackbox:' ~ prometheus_container_blackbox_dir ~ ':ro'],
             'mem_limit': prometheus_blackbox_mem_limit,
             'healthcheck': {
               'test': ['CMD', 'wget', '-q', '--spider', 'http://localhost:' ~ (prometheus_blackbox_port | string) ~ '/-/healthy'],
               'interval': '30s', 'timeout': '5s', 'retries': 5, 'start_period': '15s'}}})}}) }}
  when: prometheus_probes_enabled | bool
  tags: [health, backup, restore, export, upgrade]
