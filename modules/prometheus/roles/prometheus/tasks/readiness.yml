# The service's dependencies are the container engine (docker_engine, applied before this module),
# the registry the targets are generated from, and its credentials in the secret store.
- block:
    - name: The container engine is ready (docker_engine readiness)
      ansible.builtin.include_role:
        name: docker_engine
        tasks_from: readiness
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: The targets render from the registry
      ansible.builtin.include_tasks: generate.yml
    - name: Every credential resolves in its form
      ansible.builtin.include_tasks: credentials.yml
  tags: [readiness]
