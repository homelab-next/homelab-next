# The configuration on the host: prometheus.yml and the rules (rendered), the generated target
# lists, and the scrape credentials written from the secret store by reference (the container's
# group reads them; a file the registry no longer names is removed). A changed configuration
# leaves a reload owed, which only a successful SIGHUP clears.
# The SNMP targets' addresses are the registry hosts' (never listed by hand), and the gateway the LLM
# probes go through is a registry row's URL; a host or row the registry lacks is refused by name.
- name: Read the registry's hosts for the SNMP targets
  ansible.builtin.set_fact:
    prometheus_registry_hosts: "{{ (lookup('ansible.builtin.file', prometheus_registry) | from_yaml).hosts | default({}) }}"
  when: prometheus_snmp_enabled | bool
  delegate_to: localhost
  become: false

- name: Refuse an SNMP target the registry has no host for
  ansible.builtin.assert:
    that: prometheus_snmp_targets | map(attribute='host') | difference(prometheus_registry_hosts.keys() | list) | length == 0
    fail_msg: >-
      prometheus: the SNMP targets {{ prometheus_snmp_targets | map(attribute='host') | difference(prometheus_registry_hosts.keys() | list) }}
      are not hosts of the registry
  when: prometheus_snmp_enabled | bool

- name: Resolve the SNMP targets' addresses
  ansible.builtin.set_fact:
    prometheus_snmp_addresses: >-
      {{ dict(prometheus_snmp_targets | map(attribute='host')
              | zip(prometheus_snmp_targets | map(attribute='host') | map('extract', prometheus_registry_hosts) | map(attribute='address') | map('string'))) }}
  when: prometheus_snmp_enabled | bool

- name: Resolve the gateway the LLM probes go through
  ansible.builtin.set_fact:
    prometheus_llm_probe_url: "{{ lookup('hnx_registry', prometheus_llm_probe_gateway, field='url') }}"
  vars:
    hnx_registry_file: "{{ prometheus_registry }}"
  when: prometheus_llm_probes_on | bool

- name: Render the configuration and the default alert rules
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ prometheus_data_root }}/config/{{ item.dest }}"
    owner: "{{ prometheus_owner }}"
    group: "{{ prometheus_gid | int }}"
    mode: "0640"
  loop:
    - {src: prometheus.yml.j2, dest: prometheus.yml}
    - {src: rules.yml.j2, dest: rules.yml}
    - {src: blackbox.yml.j2, dest: blackbox/blackbox.yml}
    - {src: snmp.yml.j2, dest: snmp/snmp.yml}
  loop_control:
    label: "{{ item.dest }}"
  register: prometheus_config_written

# the probes' trust: the system roots plus the lab CA, one bundle beside the probe modules (mounted
# read-only into the exporter); only while probes are on and a CA is named
- name: Read the system roots for the probe bundle
  ansible.builtin.slurp:
    src: "{{ prometheus_probe_system_roots }}"
  register: prometheus_probe_roots
  when: prometheus_probes_enabled | bool and prometheus_probe_ca_ref != ''

- name: Write the probe trust bundle
  ansible.builtin.copy:
    dest: "{{ prometheus_data_root }}/config/blackbox/probe-ca.pem"
    content: "{{ prometheus_probe_roots.content | b64decode | trim }}\n{{ lookup('hnx_secret', prometheus_probe_ca_ref) | trim }}\n"
    owner: "{{ prometheus_owner }}"
    group: "{{ prometheus_gid | int }}"
    mode: "0640"
  when: prometheus_probes_enabled | bool and prometheus_probe_ca_ref != ''
  register: prometheus_probe_ca_written

- name: Install the generated target lists
  ansible.builtin.copy:
    dest: "{{ prometheus_data_root }}/config/{{ prometheus_generated_dir }}/{{ item.dest }}"
    content: "{{ item.text }}"
    owner: "{{ prometheus_owner }}"
    group: "{{ prometheus_gid | int }}"
    mode: "0640"
  loop:
    - {dest: scrape_configs.yml, text: "{{ prometheus_scrape_text }}"}
    - {dest: node_targets.yml, text: "{{ prometheus_node_text }}"}
  loop_control:
    label: "{{ item.dest }}"
  register: prometheus_targets_written

# the probe target list exists only while probes are on (a stale list would be unreferenced, but
# a file nothing names is removed, as a credential is)
- name: Install the generated probe target list
  ansible.builtin.copy:
    dest: "{{ prometheus_data_root }}/config/{{ prometheus_generated_dir }}/probe_targets.yml"
    content: "{{ prometheus_probe_text }}"
    owner: "{{ prometheus_owner }}"
    group: "{{ prometheus_gid | int }}"
    mode: "0640"
  when: prometheus_probes_enabled | bool
  register: prometheus_probes_written

- name: Remove the probe target list when probes are off
  ansible.builtin.file:
    path: "{{ prometheus_data_root }}/config/{{ prometheus_generated_dir }}/probe_targets.yml"
    state: absent
  when: not (prometheus_probes_enabled | bool)
  register: prometheus_probes_removed

- name: Create the credential subdirectories
  ansible.builtin.file:
    path: "{{ prometheus_data_root }}/scrape-credentials{{ item }}"
    state: directory
    owner: "{{ prometheus_owner }}"
    group: "{{ prometheus_gid | int }}"
    mode: "0750"
  loop: "{{ prometheus_scrape_auths | map(attribute='path') | map('dirname') | map('replace', prometheus_container_authfiles_dir, '', 1) | reject('equalto', '') | unique | sort }}"

- name: Write each scrape credential from the secret store
  ansible.builtin.copy:
    dest: "{{ prometheus_data_root }}/scrape-credentials{{ item.path | replace(prometheus_container_authfiles_dir, '', 1) }}"
    content: "{{ lookup('hnx_secret', item.secret) | trim }}\n"
    owner: "{{ prometheus_owner }}"
    group: "{{ prometheus_gid | int }}"
    mode: "0640"
  loop: "{{ prometheus_scrape_auths }}"
  loop_control:
    label: "{{ item.path }}"
  register: prometheus_auths_written
  no_log: true
  diff: false

- name: List the credential files on the host
  ansible.builtin.find:
    paths: "{{ prometheus_data_root }}/scrape-credentials"
    recurse: true
    file_type: file
    hidden: true
  register: prometheus_auths_found

- name: Remove a credential file the registry no longer names
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ prometheus_auths_found.files | map(attribute='path') | sort
       | difference(prometheus_scrape_auths | map(attribute='path')
                    | map('replace', prometheus_container_authfiles_dir, prometheus_data_root ~ '/scrape-credentials', 1) | list) }}
  register: prometheus_auths_removed

# The SNMP community, from the store by reference, in the exporter's own credentials directory (its
# group reads it; the metrics container never mounts it). Removed when SNMP is off.
- name: Write the SNMP community file
  ansible.builtin.copy:
    dest: "{{ prometheus_data_root }}/snmp-credentials/auth.yml"
    content: "{{ {'auths': {prometheus_snmp_auth_name: {'community': lookup('hnx_secret', prometheus_snmp_community_ref) | trim, 'version': 2}}} | to_nice_yaml }}"
    owner: "{{ prometheus_owner }}"
    group: "{{ prometheus_gid | int }}"
    mode: "0640"
  when: prometheus_snmp_enabled | bool
  register: prometheus_snmp_auth_written
  no_log: true
  diff: false

- name: Remove the SNMP community file when SNMP is off
  ansible.builtin.file:
    path: "{{ prometheus_data_root }}/snmp-credentials/auth.yml"
    state: absent
  when: not (prometheus_snmp_enabled | bool)

# The gateway key the LLM probes present, from the store by reference, in the blackbox exporter's own
# credentials directory. Removed when the probes are off.
- name: Write the gateway probe key
  ansible.builtin.copy:
    dest: "{{ prometheus_data_root }}/probe-credentials/gateway-key"
    content: "{{ lookup('hnx_secret', prometheus_llm_probe_key_ref) | trim }}\n"
    owner: "{{ prometheus_owner }}"
    group: "{{ prometheus_gid | int }}"
    mode: "0640"
  when: prometheus_llm_probes_on | bool
  register: prometheus_llm_key_written
  no_log: true
  diff: false

- name: Remove the gateway probe key when the probes are off
  ansible.builtin.file:
    path: "{{ prometheus_data_root }}/probe-credentials/gateway-key"
    state: absent
  when: not (prometheus_llm_probes_on | bool)
