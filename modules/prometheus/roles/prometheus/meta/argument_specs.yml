# SPDX-License-Identifier: Apache-2.0
argument_specs:
  main:
    short_description: Run the metrics service as a compose_app with targets generated from the registry, default alert rules and a state-diffed alert forwarder.
    options:
      prometheus_logical_id: &logical_id
        type: str
        description: "The instance's registry id (the service row the site binds, e.g. metrics)."
        required: true
      prometheus_registry: &registry
        type: path
        description: "Absolute path of the lab registry (services.yml) on the controller, the targets' source."
        required: true
      prometheus_node_exporter_port: &node_exporter_port
        type: int
        description: "The port of the host exporter on every registry host (the site's one choice, also the exporter role's)."
        required: true
      prometheus_image: &image
        type: str
        description: "repository:tag@sha256:<digest> of the metrics service image."
        default: "docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2"
      prometheus_bind: &bind
        type: str
        description: "The guest's own IPv4 address the port is published on (never all interfaces)."
        default: "{{ ansible_host }}"
      prometheus_port: &port
        type: int
        description: "Host port (the registry row's port)."
        default: 9090
      prometheus_network_subnet: &network_subnet
        type: str
        description: "IPv4 CIDR (/16 to /29) the container's compose network is pinned to; the guest's firewall_rules admit it to the exporter port, for the scrape of the guest's own exporter."
        required: true
      prometheus_dir: &dir
        type: path
        description: "The compose project directory."
        default: "/opt/compose/prometheus"
      prometheus_owner: &owner
        type: str
        description: "Owner of the compose project and the data root."
        default: "root"
      prometheus_group: &group
        type: str
        description: "Group of the compose project and the data root: the container's gid, so its user reads config/ and the credentials."
        default: "{{ prometheus_gid }}"
      prometheus_data_root: &data_root
        type: path
        description: "The module's data root on the host: config/, tsdb/, scrape-credentials/, export/."
        default: "/var/lib/hnx-modules/prometheus"
      prometheus_uid: &uid
        type: int
        description: "The container's user id (no account on the host has it); owns tsdb/."
        default: 61001
      prometheus_gid: &gid
        type: int
        description: "The container's group id."
        default: 61001
      prometheus_retention_time: &retention_time
        type: str
        description: "How long samples are kept (a number and s, m, h, d, w or y)."
        default: "30d"
      prometheus_retention_size: &retention_size
        type: str
        description: "Optional size cap beside the time (a number and KB, MB, GB or TB); empty for none."
        default: ""
      prometheus_scrape_interval: &scrape_interval
        type: str
        description: "Default scrape interval (a number and s or m)."
        default: "30s"
      prometheus_evaluation_interval: &evaluation_interval
        type: str
        description: "Rule evaluation interval (a number and s or m)."
        default: "30s"
      prometheus_mem_limit: &mem_limit
        type: str
        description: "Container memory limit."
        default: "768m"
      prometheus_start: &start
        type: bool
        description: "Run docker compose up after rendering."
        default: true
      prometheus_validate_with_docker: &validate_with_docker
        type: bool
        description: "Run docker compose config on the rendered file."
        default: true
      prometheus_health_timeout: &health_timeout
        type: int
        description: "Seconds for each health request."
        default: 10
      prometheus_hnx_cli: &hnx_cli
        type: list
        elements: str
        description: "The hnx command as a one-element list (bare, or by absolute path); run on the controller to render the targets."
        default: ["hnx"]
      prometheus_node_exporter_exclude: &node_exporter_exclude
        type: list
        elements: str
        description: "Registry hosts that run no host exporter, left out of the host target list."
        default: []
      prometheus_probes_enabled: &probes_enabled
        type: bool
        description: "Run HTTP(S) up/down probes: a blackbox exporter beside the service, a probe target list generated from the registry (every row published at the edge or declaring an http health endpoint) and the ProbeDown rule."
        default: false
      prometheus_probe_exclude: &probe_exclude
        type: list
        elements: str
        description: "Service rows (by name) not to probe."
        default: []
      prometheus_probe_interval: &probe_interval
        type: str
        description: "How often each target is probed (a number and s or m)."
        default: "60s"
      prometheus_probe_timeout: &probe_timeout
        type: str
        description: "Whole seconds after which a probe has failed (shorter than the interval)."
        default: "10s"
      prometheus_probe_ca_ref: &probe_ca_ref
        type: str
        description: "A secret reference to a private CA's PEM the probes trust beside the system roots (empty: the system roots only)."
        default: ""
      prometheus_probe_system_roots: &probe_system_roots
        type: path
        description: "The host's system root bundle, the base of the probes' trust bundle."
        default: /etc/ssl/certs/ca-certificates.crt
      prometheus_alert_probe_down_for: &alert_probe_down_for
        type: str
        description: "How long a probe must keep failing before ProbeDown fires."
        default: "5m"
      prometheus_blackbox_image: &blackbox_image
        type: str
        description: "repository:tag@sha256:<digest> of the probe exporter image."
        default: "docker.io/prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc"
      prometheus_blackbox_mem_limit: &blackbox_mem_limit
        type: str
        description: "The probe exporter container's memory limit."
        default: "128m"
      prometheus_alert_cpu_temp_warning_celsius: &alert_cpu_temp_warning_celsius
        type: int
        description: 'CpuTemperatureHigh: a CPU package sensor over this (C).'
        default: 85
      prometheus_alert_cpu_temp_critical_celsius: &alert_cpu_temp_critical_celsius
        type: int
        description: 'CpuTemperatureCritical: a CPU package sensor over this (C).'
        default: 92
      prometheus_alert_cpu_temp_warning_for: &alert_cpu_temp_warning_for
        type: str
        description: How long CpuTemperatureHigh must hold.
        default: 5m
      prometheus_alert_cpu_temp_critical_for: &alert_cpu_temp_critical_for
        type: str
        description: How long CpuTemperatureCritical must hold.
        default: 1m
      prometheus_alert_nvme_temp_warning_celsius: &alert_nvme_temp_warning_celsius
        type: int
        description: 'NvmeTemperatureHigh: an NVMe composite temperature over this (C).'
        default: 70
      prometheus_alert_nvme_temp_critical_celsius: &alert_nvme_temp_critical_celsius
        type: int
        description: 'NvmeTemperatureCritical: an NVMe composite temperature over this (C).'
        default: 80
      prometheus_alert_gpu_temp_warning_celsius: &alert_gpu_temp_warning_celsius
        type: int
        description: 'GpuTemperatureHigh: a GPU over this (C).'
        default: 85
      prometheus_alert_gpu_temp_critical_celsius: &alert_gpu_temp_critical_celsius
        type: int
        description: 'GpuTemperatureCritical: a GPU over this (C).'
        default: 92
      prometheus_alert_gpu_power_cap_watts: &alert_gpu_power_cap_watts
        type: int
        description: 'The site''s per-GPU power cap (W): a sustained draw over it and a power limit in
  force above it alert.'
        default: 200
      prometheus_alert_llm_decode_min_tps: &alert_llm_decode_min_tps
        type: int
        description: 'LlmDecodeCollapsed: a generating model server slower than this (tokens/s) pages.'
        default: 5
      prometheus_alert_llm_decode_window: &alert_llm_decode_window
        type: str
        description: 'LlmDecodeCollapsed: the rate window for the tokens/s.'
        default: 15m
      prometheus_inference_metric_prefix: &inference_metric_prefix
        type: str
        description: 'The metric-name prefix of the inference-server slot provider''s counters (LlmDecodeCollapsed reads <prefix>tokens_predicted_total and <prefix>tokens_predicted_seconds_total; empty: the rule is not rendered).'
        default: ""
      prometheus_alert_gpu_power_for: &alert_gpu_power_for
        type: str
        description: How long a draw over the cap must last for GpuPowerOverCap.
        default: 5m
      prometheus_alert_pool_used_percent: &alert_pool_used_percent
        type: int
        description: 'PoolAlmostFull: a pool at this percent or more.'
        default: 85
      prometheus_alert_board_event_window: &alert_board_event_window
        type: str
        description: How long BoardCriticalEvent and GpuDriverError fire after a new event.
        default: 30m
      prometheus_alert_guest_down_for: &alert_guest_down_for
        type: str
        description: How long GuestDown must hold.
        default: 5m
      prometheus_alert_gpu_idle_for: &alert_gpu_idle_for
        type: str
        description: How long GpuNotComputing must hold (no process on the GPUs of a host expected to compute).
        default: 10m
      prometheus_snmp_enabled: &snmp_enabled
        type: bool
        description: Run the SNMP exporter beside the service and a job per prometheus_snmp_targets entry.
        default: false
      prometheus_snmp_targets: &snmp_targets
        type: list
        elements: dict
        description: 'SNMP targets: {host: registry host id, modules: [module...], watch_ports: ifName
  regex}.'
        default: []
      prometheus_snmp_community_ref: &snmp_community_ref
        type: str
        description: The SNMP community (v2c), a secret:<name> reference; required when SNMP is on.
        default: ''
      prometheus_snmp_interval: &snmp_interval
        type: str
        description: The SNMP jobs' scrape interval.
        default: 60s
      prometheus_snmp_timeout: &snmp_timeout
        type: str
        description: The SNMP jobs' scrape timeout.
        default: 30s
      prometheus_snmp_image: &snmp_image
        type: str
        description: The SNMP exporter image, pinned by tag and digest.
        default: docker.io/prom/snmp-exporter:v0.31.0@sha256:e5f1aba929145cea2a3bad89c29959efaec0dc26fb87e3761414616a1a392c1c
      prometheus_snmp_mem_limit: &snmp_mem_limit
        type: str
        description: The SNMP exporter container's memory limit.
        default: 128m
      prometheus_alert_port_down_for: &alert_port_down_for
        type: str
        description: How long NetworkPortDown must hold.
        default: 5m
      prometheus_alert_port_errors_per_minute: &alert_port_errors_per_minute
        type: int
        description: 'NetworkPortErrors: errors a minute on a watched port over this.'
        default: 10
      prometheus_alert_nas_disk_temp_celsius: &alert_nas_disk_temp_celsius
        type: int
        description: 'NasDiskTemperatureHigh: a NAS disk over this (C).'
        default: 55
      prometheus_alert_nas_volume_used_percent: &alert_nas_volume_used_percent
        type: int
        description: 'NasVolumeAlmostFull: a NAS volume at this percent or more.'
        default: 85
      prometheus_llm_probe_gateway: &llm_probe_gateway
        type: str
        description: The LLM gateway's registry row id the completion probes go through.
        default: ''
      prometheus_llm_probe_roles: &llm_probe_roles
        type: list
        elements: str
        description: 'Model roles asked for a one-token completion (empty: no LLM probes; needs prometheus_probes_enabled).'
        default: []
      prometheus_llm_probe_key_ref: &llm_probe_key_ref
        type: str
        description: The gateway key the probes present, a secret:<name> reference.
        default: ''
      prometheus_llm_probe_interval: &llm_probe_interval
        type: str
        description: How often each model role is probed (minutes).
        default: 5m
      prometheus_llm_probe_timeout: &llm_probe_timeout
        type: str
        description: The probe's scrape timeout (seconds, 15 or more, inside the interval).
        default: 90s
      prometheus_alert_llm_probe_failed_for: &alert_llm_probe_failed_for
        type: str
        description: How long LlmProbeFailed must hold.
        default: 10m
      prometheus_alert_llm_probe_slow_seconds: &alert_llm_probe_slow_seconds
        type: int
        description: 'LlmProbeSlow: a successful probe slower than this (s).'
        default: 60
      prometheus_alert_unit_failed_for: &alert_unit_failed_for
        type: str
        description: "SystemdUnitFailed: how long (an averaging window, like 15m) a unit must have been failed."
        default: 15m
      prometheus_alert_unit_failed_ignore: &alert_unit_failed_ignore
        type: str
        description: "A regex of unit names SystemdUnitFailed ignores (empty: none)."
        default: ''
      prometheus_alert_critical_units: &alert_critical_units
        type: str
        description: "A regex of unit names that matter: they page as CriticalUnitFailed and are left out of SystemdUnitFailed."
        default: 'hnx-lake-writer@.+\.service'
      prometheus_alert_critical_unit_failed_for: &alert_critical_unit_failed_for
        type: str
        description: "CriticalUnitFailed: the averaging window a critical unit must have been failed."
        default: 5m
      prometheus_alert_timer_job_failing_for: &alert_timer_job_failing_for
        type: str
        description: "TimerJobNotSucceeding: how long a timer-driven oneshot must have failed on every run."
        default: 1h
      prometheus_alert_oom_window: &alert_oom_window
        type: str
        description: "HostOomKill: any kernel OOM kill within this window."
        default: 10m
      prometheus_alert_fill_lookback: &alert_fill_lookback
        type: str
        description: "FilesystemFillPredicted: the window the fill rate is measured over."
        default: 6h
      prometheus_alert_fill_horizon_hours: &alert_fill_horizon_hours
        type: int
        description: "FilesystemFillPredicted: alert when the free space is projected to end within this many hours."
        default: 24
      prometheus_alert_fill_ignore_fstypes: &alert_fill_ignore_fstypes
        type: str
        description: "A regex of filesystem types FilesystemFillPredicted ignores."
        default: 'tmpfs|overlay|squashfs|ramfs|devtmpfs|fuse.*|nsfs|proc|sysfs'
      prometheus_alert_cert_warning_days: &alert_cert_warning_days
        type: int
        description: "CertExpiringSoon: days left under which a probed certificate warns."
        default: 14
      prometheus_alert_cert_critical_days: &alert_cert_critical_days
        type: int
        description: "CertExpiryCritical: days left under which a probed certificate pages."
        default: 3
      prometheus_alert_target_down_for: &alert_target_down_for
        type: str
        description: "How long a target must be down before TargetDown fires."
        default: "10m"
      prometheus_alert_disk_used_percent: &alert_disk_used_percent
        type: int
        description: "DiskAlmostFull fires above this used percentage (1-99)."
        default: 90
      prometheus_alert_disk_for: &alert_disk_for
        type: str
        description: "How long a filesystem must stay over the threshold."
        default: "10m"
      prometheus_alert_readonly_for: &alert_readonly_for
        type: str
        description: "How long a filesystem must stay read-only before FilesystemReadOnly fires."
        default: "2m"
      prometheus_alert_readonly_ignore: &alert_readonly_ignore
        type: str
        description: "Mount points (a regular expression) on which a read-only mount is deliberate; empty for none."
        default: ""
      prometheus_alert_memory_available_percent: &alert_memory_available_percent
        type: int
        description: "MemoryPressure fires below this available-memory percentage (1-99)."
        default: 10
      prometheus_alert_memory_for: &alert_memory_for
        type: str
        description: "How long memory must stay short."
        default: "10m"
      prometheus_notify_id: &notify_id
        type: str
        description: "Registry logical id of the notify service the alerts are posted to."
        default: "notify"
      prometheus_notify_topic: &notify_topic
        type: str
        description: "The notify topic alerts are posted to."
        default: "homelabnext-alerts"
      prometheus_notify_priority: &notify_priority
        type: int
        description: "Priority (1-5) of an alert; a message naming a critical alert is sent at 4."
        default: 3
      prometheus_notify_auth_ref: &notify_auth_ref
        type: str
        description: "secret:<name> of the publish token for the notify service (sent as a Bearer token)."
        default: "secret:prometheus/notify-token"
      prometheus_notify_allow_plain_http: &notify_allow_plain_http
        type: bool
        description: "Explicit opt-in, LAN only: send the token to a notify endpoint with no TLS."
        default: false
      prometheus_heartbeat_topic: &heartbeat_topic
        type: str
        description: "The dead-man heartbeat: the notify topic the forwarder posts one minimum-priority message to, only while the metrics service answers and its Watchdog rule fires. The notify service's host (never this guest) pages when the topic goes quiet (module ntfy, ntfy_deadman_beats). Empty: no heartbeat (no outside dead-man)."
        default: "hnx-heartbeat-metrics"
      prometheus_heartbeat_allow_unresolved: &heartbeat_unresolved
        type: bool
        description: "Accept a heartbeat receiver whose name does not resolve on this guest (the placement guard cannot then show it is on another host). Off: refused."
        default: false
      prometheus_heartbeat_every_minutes: &heartbeat_every_minutes
        type: int
        description: "Minutes between heartbeats (the watcher's threshold must be several times this)."
        default: 5
      prometheus_alert_schedule: &alert_schedule
        type: str
        description: "The forwarder timer's OnCalendar: \"*-*-* *:*:00 UTC\" (every minute) or \"*-*-* *:*:00,30 UTC\" (every 30 seconds)."
        default: "*-*-* *:*:00 UTC"
      prometheus_unreachable_after_minutes: &unreachable_after_minutes
        type: int
        description: "Minutes of failed asks in a row before the metrics service is alerted as unreachable."
        default: 5
      prometheus_alert_body_max_bytes: &alert_body_max_bytes
        type: int
        description: "Most UTF-8 bytes of one alert post (the notify service refuses over 4096); over it the body keeps new critical FIRING first, then FIRING, RESOLVED, still-firing, and ends '... and N more'. 256 to 4096."
        default: 4000
      prometheus_notify_test_on_change: &notify_test_on_change
        type: bool
        description: "Send one test message at deploy when the channel changed; fail the play if it does not deliver."
        default: true
      prometheus_boot_unit: &boot_unit
        type: bool
        description: "Install the compose_app boot unit: docker compose up -d after docker at every boot, so a container that did not come back after a power cycle is started (LL-571)."
        default: true
      prometheus_systemctl_cli: &systemctl_cli
        type: str
        description: "The systemctl command."
        default: "systemctl"
      prometheus_unit_dir: &unit_dir
        type: path
        description: "Where the forwarder's units are written."
        default: "/etc/systemd/system"
      prometheus_state_dir: &state_dir
        type: path
        description: "Where the forwarder keeps its state, its last send record and the channel-test digest."
        default: "/var/lib/homelabnext/prometheus"
      prometheus_last_run_dir: &last_run_dir
        type: path
        description: "The shared per-host directory of last-run records (role last_run), read by the status hub."
        default: "/var/lib/homelabnext/last-run"
      prometheus_last_run_group: &last_run_group
        type: str
        description: "The group that may read the last-run records."
        default: "root"
  health:
    short_description: "Fail unless the service is healthy and ready, runs the configuration on disk with the configured retention, has its default rules loaded and ok, and the last alert reached the notify service."
    options:
      prometheus_logical_id: *logical_id
      prometheus_registry: *registry
      prometheus_node_exporter_port: *node_exporter_port
      prometheus_image: *image
      prometheus_bind: *bind
      prometheus_port: *port
      prometheus_dir: *dir
      prometheus_network_subnet: *network_subnet
      prometheus_owner: *owner
      prometheus_group: *group
      prometheus_data_root: *data_root
      prometheus_uid: *uid
      prometheus_gid: *gid
      prometheus_retention_time: *retention_time
      prometheus_retention_size: *retention_size
      prometheus_scrape_interval: *scrape_interval
      prometheus_evaluation_interval: *evaluation_interval
      prometheus_mem_limit: *mem_limit
      prometheus_health_timeout: *health_timeout
      prometheus_hnx_cli: *hnx_cli
      prometheus_node_exporter_exclude: *node_exporter_exclude
      prometheus_probes_enabled: *probes_enabled
      prometheus_probe_exclude: *probe_exclude
      prometheus_probe_interval: *probe_interval
      prometheus_probe_timeout: *probe_timeout
      prometheus_probe_ca_ref: *probe_ca_ref
      prometheus_probe_system_roots: *probe_system_roots
      prometheus_alert_probe_down_for: *alert_probe_down_for
      prometheus_blackbox_image: *blackbox_image
      prometheus_blackbox_mem_limit: *blackbox_mem_limit
      prometheus_alert_cpu_temp_warning_celsius: *alert_cpu_temp_warning_celsius
      prometheus_alert_cpu_temp_critical_celsius: *alert_cpu_temp_critical_celsius
      prometheus_alert_cpu_temp_warning_for: *alert_cpu_temp_warning_for
      prometheus_alert_cpu_temp_critical_for: *alert_cpu_temp_critical_for
      prometheus_alert_nvme_temp_warning_celsius: *alert_nvme_temp_warning_celsius
      prometheus_alert_nvme_temp_critical_celsius: *alert_nvme_temp_critical_celsius
      prometheus_alert_gpu_temp_warning_celsius: *alert_gpu_temp_warning_celsius
      prometheus_alert_gpu_temp_critical_celsius: *alert_gpu_temp_critical_celsius
      prometheus_alert_gpu_power_cap_watts: *alert_gpu_power_cap_watts
      prometheus_alert_gpu_power_for: *alert_gpu_power_for
      prometheus_alert_llm_decode_min_tps: *alert_llm_decode_min_tps
      prometheus_alert_llm_decode_window: *alert_llm_decode_window
      prometheus_inference_metric_prefix: *inference_metric_prefix
      prometheus_alert_pool_used_percent: *alert_pool_used_percent
      prometheus_alert_board_event_window: *alert_board_event_window
      prometheus_alert_guest_down_for: *alert_guest_down_for
      prometheus_alert_gpu_idle_for: *alert_gpu_idle_for
      prometheus_snmp_enabled: *snmp_enabled
      prometheus_snmp_targets: *snmp_targets
      prometheus_snmp_community_ref: *snmp_community_ref
      prometheus_snmp_interval: *snmp_interval
      prometheus_snmp_timeout: *snmp_timeout
      prometheus_snmp_image: *snmp_image
      prometheus_snmp_mem_limit: *snmp_mem_limit
      prometheus_alert_port_down_for: *alert_port_down_for
      prometheus_alert_port_errors_per_minute: *alert_port_errors_per_minute
      prometheus_alert_nas_disk_temp_celsius: *alert_nas_disk_temp_celsius
      prometheus_alert_nas_volume_used_percent: *alert_nas_volume_used_percent
      prometheus_llm_probe_gateway: *llm_probe_gateway
      prometheus_llm_probe_roles: *llm_probe_roles
      prometheus_llm_probe_key_ref: *llm_probe_key_ref
      prometheus_llm_probe_interval: *llm_probe_interval
      prometheus_llm_probe_timeout: *llm_probe_timeout
      prometheus_alert_llm_probe_failed_for: *alert_llm_probe_failed_for
      prometheus_alert_llm_probe_slow_seconds: *alert_llm_probe_slow_seconds
      prometheus_alert_unit_failed_for: *alert_unit_failed_for
      prometheus_alert_unit_failed_ignore: *alert_unit_failed_ignore
      prometheus_alert_critical_units: *alert_critical_units
      prometheus_alert_critical_unit_failed_for: *alert_critical_unit_failed_for
      prometheus_alert_timer_job_failing_for: *alert_timer_job_failing_for
      prometheus_alert_oom_window: *alert_oom_window
      prometheus_alert_fill_lookback: *alert_fill_lookback
      prometheus_alert_fill_horizon_hours: *alert_fill_horizon_hours
      prometheus_alert_fill_ignore_fstypes: *alert_fill_ignore_fstypes
      prometheus_alert_cert_warning_days: *alert_cert_warning_days
      prometheus_alert_cert_critical_days: *alert_cert_critical_days
      prometheus_alert_target_down_for: *alert_target_down_for
      prometheus_alert_disk_used_percent: *alert_disk_used_percent
      prometheus_alert_disk_for: *alert_disk_for
      prometheus_alert_readonly_for: *alert_readonly_for
      prometheus_alert_readonly_ignore: *alert_readonly_ignore
      prometheus_alert_memory_available_percent: *alert_memory_available_percent
      prometheus_alert_memory_for: *alert_memory_for
      prometheus_notify_id: *notify_id
      prometheus_notify_topic: *notify_topic
      prometheus_notify_priority: *notify_priority
      prometheus_notify_auth_ref: *notify_auth_ref
      prometheus_notify_allow_plain_http: *notify_allow_plain_http
      prometheus_heartbeat_topic: *heartbeat_topic
      prometheus_heartbeat_every_minutes: *heartbeat_every_minutes
      prometheus_heartbeat_allow_unresolved: *heartbeat_unresolved
      prometheus_alert_schedule: *alert_schedule
      prometheus_unreachable_after_minutes: *unreachable_after_minutes
      prometheus_alert_body_max_bytes: *alert_body_max_bytes
      prometheus_state_dir: *state_dir
      prometheus_last_run_dir: *last_run_dir
      prometheus_last_run_group: *last_run_group
      prometheus_start: *start
