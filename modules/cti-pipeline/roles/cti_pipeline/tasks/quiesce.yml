# Block the lane's job units (cti_pipeline_quiesce_lane) for what the caller does next: each declared
# instance is masked for this boot only (systemctl mask --runtime: the dispatcher's start then fails
# and the controller retries it later), then the role waits until none of them runs, up to
# cti_pipeline_quiesce_wait_s. The caller unmasks them (unquiesce.yml) in an always: block, so a
# failure never leaves the lane blocked. Root works on a lane's tree only while its own code is not
# running there.
# systemd's own list as well as the declared one: an instance of a job the site just removed may
# still be running, and it writes the same lane root
- name: List the lane's loaded units (declared or not)
  ansible.builtin.command:
    argv:
      - "{{ cti_pipeline_systemctl_cli }}"
      - list-units
      - --all
      - --plain
      - --no-legend
      - "hnx-{{ cti_pipeline_logical_id }}@*-{{ cti_pipeline_quiesce_lane }}.service"
  register: cti_pipeline_quiesce_loaded
  changed_when: false
  tags: [export, backup, restore]

- name: Name the lane's units
  ansible.builtin.set_fact:
    # an older systemd marks a failed unit with a leading bullet even with --plain: stripped first
    cti_pipeline_quiesce_units: >-
      {{ ((cti_pipeline_instances | selectattr('lane', 'equalto', cti_pipeline_quiesce_lane)
           | map(attribute='unit') | list)
          + (cti_pipeline_quiesce_loaded.stdout_lines | map('regex_replace', '^[\s●*]+', '')
             | reject('equalto', '') | map('split') | map('first')
             | select('match', '^hnx-' ~ (cti_pipeline_logical_id | regex_escape) ~ '@[a-z0-9-]+-'
                      ~ cti_pipeline_quiesce_lane ~ '\.service\Z') | list))
         | unique | sort | list }}
  tags: [export, backup, restore]

# the marker tells an install that converges meanwhile (a scheduled deploy during a backup) to leave
# this lane's masks alone; unquiesce.yml removes it, and an install treats an old one as left behind
- name: Mark the lane quiesced (an install converging meanwhile leaves its masks alone)
  ansible.builtin.copy:
    content: "{{ {'lane': cti_pipeline_quiesce_lane, 'since': now().timestamp() | int} | to_json }}\n"
    dest: "{{ cti_pipeline_data_root }}/.quiesced-{{ cti_pipeline_quiesce_lane }}"
    owner: "{{ cti_pipeline_owner }}"
    group: "{{ cti_pipeline_owner_group }}"
    mode: "0600"
  tags: [export, backup, restore]

- name: Block the lane's units from starting (for this boot only)
  ansible.builtin.command:
    argv: "{{ [cti_pipeline_systemctl_cli, 'mask', '--runtime'] + cti_pipeline_quiesce_units }}"
  changed_when: true
  when: cti_pipeline_quiesce_units | length > 0
  tags: [export, backup, restore]

- name: Wait until none of the lane's units runs
  ansible.builtin.command:
    argv: >-
      {{ [cti_pipeline_systemctl_cli, 'list-units', '--plain', '--no-legend',
          '--state=active,activating,deactivating,reloading'] + cti_pipeline_quiesce_units }}
  register: cti_pipeline_quiesce_running
  changed_when: false
  until: cti_pipeline_quiesce_running.stdout | trim == ''
  retries: "{{ (cti_pipeline_quiesce_wait_s | int / 10) | round(0, 'ceil') | int }}"
  delay: 10
  when: cti_pipeline_quiesce_units | length > 0
  tags: [export, backup, restore]
