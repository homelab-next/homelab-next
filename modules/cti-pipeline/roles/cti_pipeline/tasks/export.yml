# The exit copy (state, object-tree): for each deployed lane that has a store, a new
# <data root>/export/<lane>-<stamp>/ (hnx-cti-state/1: a consistent copy of the store through the
# database's backup API, every table's row count, the state directories' files and a sha256
# listing; cti_state.py export builds it beside its name and renames it when complete). The
# exports past cti_pipeline_keep_exports are pruned (only directories named as one).
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Create the directories
      ansible.builtin.include_tasks: dirs.yml
    - name: Look for each lane's store
      ansible.builtin.stat:
        path: "{{ cti_pipeline_data_root }}/{{ item }}/data/cti.db"
      register: cti_pipeline_stores
      loop: "{{ cti_pipeline_lanes }}"
    - name: Name this export
      ansible.builtin.set_fact:
        cti_pipeline_export_stamp: "{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"
    - name: Export each lane's store and state
      ansible.builtin.command:
        argv: >-
          {{ ['python3', '-I', '-c', lookup('ansible.builtin.file', 'cti_state.py'), 'export',
              cti_pipeline_data_root ~ '/' ~ item.item,
              cti_pipeline_export_dir ~ '/' ~ item.item ~ '-' ~ cti_pipeline_export_stamp]
             + (cti_pipeline_state_dirs | map('regex_replace', '^', '--include=') | list) }}
      register: cti_pipeline_exports
      changed_when: true
      loop: "{{ cti_pipeline_stores.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"
    - name: Prune the exports past the ones kept
      ansible.builtin.command:
        argv: ['python3', '-I', '-c', "{{ lookup('ansible.builtin.file', 'cti_state.py') }}", 'prune-exports',
               "{{ cti_pipeline_export_dir }}", "{{ item }}", "{{ cti_pipeline_keep_exports | int }}"]
      register: cti_pipeline_pruned
      changed_when: cti_pipeline_pruned.rc == 0 and (cti_pipeline_pruned.stdout | from_json).changed
      loop: "{{ cti_pipeline_lanes }}"
  tags: [export, backup]
