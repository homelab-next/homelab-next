# SPDX-License-Identifier: Apache-2.0
# Every secret the lanes, the gateway probe and the lake CA name resolves, in a form a systemd
# credential and an environment variable can carry: non-empty, one line, no NUL (the CA is PEM).
# A reference that is unset is refused here, before any file is written. Only the verdicts leave
# the no_log tasks.
- name: Start the verdicts empty (this file runs again from every hook)
  ansible.builtin.set_fact:
    cti_pipeline_ref_forms: {}
  tags: [readiness, health]

- name: Read each lane secret's form
  ansible.builtin.set_fact:
    cti_pipeline_ref_forms: >-
      {{ cti_pipeline_ref_forms | combine({item.lane ~ '/' ~ item.name:
           lookup('hnx_secret', item.ref) is match('^[^\n\r\x00]{1,65536}\Z')}) }}
  loop: "{{ cti_pipeline_ref_items }}"
  loop_control:
    label: "{{ item.lane }}/{{ item.name }}"
  no_log: true
  tags: [readiness, health]

- name: Read the gateway key's and the lake CA's forms, where they are used
  ansible.builtin.set_fact:
    cti_pipeline_gateway_form: >-
      {{ true if cti_pipeline_gateway_id == ''
         else lookup('hnx_secret', cti_pipeline_gateway_key_ref) is match('^[A-Za-z0-9._~+/=:-]{8,512}\Z') }}
    cti_pipeline_ca_form: >-
      {{ true if cti_pipeline_lake_ca_ref == ''
         else lookup('hnx_secret', cti_pipeline_lake_ca_ref) is search('-----BEGIN CERTIFICATE-----') }}
    cti_pipeline_synapse_ca_form: >-
      {{ true if cti_pipeline_synapse_ca_ref == ''
         else lookup('hnx_secret', cti_pipeline_synapse_ca_ref) is search('-----BEGIN CERTIFICATE-----') }}
  no_log: true
  tags: [readiness, health]

- name: Every secret has its form
  ansible.builtin.assert:
    that:
      - cti_pipeline_ref_forms.values() | reject | list | length == 0
      - cti_pipeline_gateway_form | bool
      - cti_pipeline_ca_form | bool
      - cti_pipeline_synapse_ca_form | bool
    fail_msg: >-
      cti-pipeline: every lane secret must be one non-empty line (forms by lane/name:
      {{ cti_pipeline_ref_forms }}); the gateway key (when cti_pipeline_gateway_id is set) 8 to 512
      characters without a space ({{ cti_pipeline_gateway_form }}); the lake CA (when named) PEM
      ({{ cti_pipeline_ca_form }}); the graph store's certificate (when named) PEM ({{ cti_pipeline_synapse_ca_form }})
  tags: [readiness, health]
