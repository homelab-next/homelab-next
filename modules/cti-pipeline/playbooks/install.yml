# Install (and converge) the pipeline's job units on the guests the site placed the module's
# `worker` role on. The apply path (docs/modules/apply.md) renders its own modules.yml from the
# selection and does not import this file; it is the module's own entry point, for a lab that runs
# one module by hand:
#   ansible-playbook -i <inventory with --selection> modules/cti-pipeline/playbooks/install.yml
# The units run only when the orchestration dispatcher starts them (orchestration_job_units names
# this instance's set and jobs); the role's readiness hook refuses to go on without the pinned
# artefact or every secret.
- name: Install the threat-intelligence pipeline's job units
  hosts: mod_cti_pipeline_worker
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: cti_pipeline
        tasks_from: readiness
      tags: [mod_cti_pipeline]
  roles:
    - role: cti_pipeline
      tags: [mod_cti_pipeline]
