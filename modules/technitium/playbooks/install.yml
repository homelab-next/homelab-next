# SPDX-License-Identifier: Apache-2.0
# Install (and converge) Technitium on the guests the site placed the module's `server` role on.
# The apply path (docs/modules/apply.md) renders its own modules.yml from the selection and does
# not import this file; it is the module's own entry point, for a lab that runs one module by hand:
#   ansible-playbook -i <inventory with --selection> modules/technitium/playbooks/install.yml
# docker_engine is applied to the guest first (a compose_app module's host); the role's readiness
# hook refuses to go on without it. Seeding the zones is a separate, explicit step (the role's
# restore_archive or restore hook, README "Cutover").
- name: Install Technitium (the dns provider)
  hosts: mod_technitium_server
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: technitium
        tasks_from: readiness
      tags: [mod_technitium]
  roles:
    - role: technitium
      tags: [mod_technitium]
