# SPDX-License-Identifier: Apache-2.0
# The dns provider on Technitium DNS Server (docs/modules.md; README.md beside this file): one
# container from a pinned image, run by compose_app on a guest that already has docker_engine. It
# answers DNS on the guest's own address and serves the admin API and console beside it; its zones
# are its state, seeded from an archived config tar or an export and checked by record counts.
# Every real value (the guest, its address, the zone counts, the secret value) is the site's: the
# overlay's lab/modules.yml, lab/services.yml and secret store.
manifest_version: "1.0"
id: technitium
kind: provider
title: DNS on Technitium
description: Fills the dns slot with Technitium DNS Server, run as one compose_app container; zones
  restored from an archived config or an export and verified by record counts; proved by the dns
  conformance suite through the Technitium adapter.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: technitium
  version: 15.4.0
licence:
  kind: open-source
  spdx: GPL-3.0-only
credentials:
  - secret: secret:technitium/admin-password
    identity: password
    holder: provider
    purpose: the admin account's password; the server reads it on its first start, and the role's health, export and restore hooks sign in with it
identifiers:
  - {kind: secret-name, name: technitium, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the admin password is read by name at deploy time
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 1, memory_mb: 1024, disk_gb: 8}
      guest:
        baselines: [base]
      roles: [role:technitium]
      purpose: runs the Technitium container (docker_engine applied first, compose_app renders it)
provides:
  slots:
    dns:
      adapter: homelabnext.conform.adapters.dns_zone:make
      conformance:
        target: conformance/target.yml
      migration: {formats: [zone-file], export: role:technitium, import: role:technitium}
egress:
  - host: server
    to: [internet]
    purpose: recursive resolution from the root servers (port 53) for the clients' lookups, and the daily fetch of the block lists a site configures
contributes:
  roles:
    - file: roles/technitium
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:technitium, hook: readiness}
  docs:
    - file: README.md
data:
  - id: zones
    kind: state
    description: Every primary zone as a zone file, with settings.zip (the server's own settings backup, without the accounts) and a listing of sizes, sha256 and each zone's record count.
    export: {formats: [zone-file], via: role:technitium}
    import: {formats: [zone-file], via: role:technitium}
    retention: {keep: forever}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest): the role's upgrade hook validates and records it, the zones are exported, then it converges"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
