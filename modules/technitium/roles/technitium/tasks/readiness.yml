# SPDX-License-Identifier: Apache-2.0
# Technitium's dependencies are the container engine (docker_engine, applied to the guest before
# this module) and the admin password in the secret store; it calls no other service of the lab.
- block:
    - name: The container engine is ready (docker_engine readiness)
      ansible.builtin.include_role:
        name: docker_engine
        tasks_from: readiness
    - name: The credential resolves in its form
      ansible.builtin.include_tasks: credentials.yml
  tags: [readiness]
