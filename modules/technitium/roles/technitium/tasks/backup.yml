# SPDX-License-Identifier: Apache-2.0
# The backup takes the data root whole (the VM's backup job, or a file backup of the manifest's
# paths); the export first writes consistent copies of every zone into it (export/), so a
# restore never depends on the live files being caught between two writes.
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Export the zones
      ansible.builtin.include_tasks: export.yml
    - name: Delegate to compose_app (the backup manifest names the data root)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: backup
      vars:
        compose_app_name: technitium
        compose_app_dir: "{{ technitium_app.compose_app_dir }}"
        compose_app_data_dir: "{{ technitium_app.compose_app_data_dir }}"
        compose_app_export_dir: "{{ technitium_app.compose_app_export_dir }}"
        compose_app_owner: "{{ technitium_app.compose_app_owner }}"
        compose_app_group: "{{ technitium_app.compose_app_group }}"
        compose_app_spec: "{{ technitium_app.compose_app_spec }}"
  tags: [backup]
