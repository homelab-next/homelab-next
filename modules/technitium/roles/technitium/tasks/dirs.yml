# The data root is the project owner's (root); config/ and log/ belong to the container's user,
# so the server creates and rewrites its own files; export/ is the project owner's, root's by default (the export runs as root).
- name: Create the data root, the config, log and export directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ technitium_data_root }}", owner: "{{ technitium_owner }}", group: "{{ technitium_group }}", mode: "0750"}
    - {path: "{{ technitium_data_root }}/config", owner: "{{ technitium_uid | int }}", group: "{{ technitium_gid | int }}", mode: "0750"}
    - {path: "{{ technitium_data_root }}/log", owner: "{{ technitium_uid | int }}", group: "{{ technitium_gid | int }}", mode: "0750"}
    - {path: "{{ technitium_data_root }}/export", owner: "{{ technitium_owner }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"
  tags: [backup, restore, restore_archive, export]
