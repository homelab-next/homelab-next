# SPDX-License-Identifier: Apache-2.0
# The admin password resolves and is long enough; only the verdict leaves the no_log task.
- name: Read the credential's form
  ansible.builtin.set_fact:
    technitium_forms:
      password: "{{ lookup('hnx_secret', technitium_admin_login_ref) | length >= 12 }}"
  no_log: true
  tags: [readiness]

- name: The credential has its form
  ansible.builtin.assert:
    that:
      - technitium_forms.password | bool
    fail_msg: "technitium: {{ technitium_admin_login_ref }} must be a password of 12 characters or more"
  tags: [readiness]
