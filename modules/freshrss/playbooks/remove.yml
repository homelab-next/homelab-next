# Remove: export every account first (export_first), then stop and remove the container. The data
# root (with the export in it) and the compose project are kept for the operator to archive or
# delete. The decommission audit (module.yml lifecycle.remove.audit) checks nothing still names the
# service.
- name: Remove the feed reader
  hosts: mod_freshrss_server
  become: true
  tasks:
    - name: Export every account first
      ansible.builtin.include_role:
        name: freshrss
        tasks_from: export
    - name: Stop and remove the container
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ freshrss_dir | default('/opt/compose/freshrss') }}/docker-compose.yml", down]
      changed_when: true
