# SPDX-License-Identifier: Apache-2.0
# The registry row (platform/service) this provider contributes, keyed by the slot and renamed to
# the instance the site selects; version is product.version (never repeated here), host is the
# module's host role. The lab registry (lab/services.yml) must carry it exactly as bound
# (hnx modules check, docs/modules/registry-rows.md). auth: own - the product's local accounts and
# per-account API passwords. No public_hostname: the reader is private by default; a site that wants
# a route adds one with the public_hostname and the grant, and sets freshrss_base_url to that name.
# The health path is the sign-in page.
services:
  feed-reader:
    capability: feed-reader
    impl: freshrss
    host: server
    protocol: http
    port: 8084
    health: {kind: http, path: /i/, expect_status: 200}
    owner: operator
    tls: none
    auth: own
    tags: [feeds]
    description: The feed reader with its own accounts, the Fever and Google Reader APIs and a scheduled refresh. No public route.
