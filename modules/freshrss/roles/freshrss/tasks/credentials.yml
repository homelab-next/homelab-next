# Every credential resolves in its form before a container sees it: each account name the product's
# own pattern, each password long enough to matter and made of characters a shell and an environment
# variable carry literally, every API password and name distinct from the others. A reference with no
# value in the secret store stops the run here, by name, before anything is rendered or started. No
# value is printed.
# A failed lookup under no_log is reported as "output hidden", which would hide the one thing the
# operator needs: which reference has no value. So each reference is probed alone first (its value
# is never kept: only whether it resolved) and the refusal names the references, never a value.
- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    freshrss_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop: "{{ freshrss_refs }}"
  loop_control:
    label: "{{ item }}"
  register: freshrss_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: freshrss_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      freshrss: no value in the secret store for
      {{ freshrss_refs | zip(freshrss_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Every account name and password resolves in its form
  ansible.builtin.assert:
    that:
      - >-
        lookup('hnx_secret', *(freshrss_accounts | map(attribute='name_ref') | select | list), wantlist=True)
        | reject('match', freshrss_user_pattern) | list | length == 0
      - >-
        lookup('hnx_secret', *((freshrss_accounts | map(attribute='password_ref') | select | list)
                               + (freshrss_accounts | map(attribute='api_password_ref') | select | list)), wantlist=True)
        | reject('match', freshrss_passphrase_pattern) | list | length == 0
      # every account has a name of its own and every password is its own: a repeated name would be one
      # account twice, a repeated password would let one account's key open another
      - >-
        (lookup('hnx_secret', *(freshrss_accounts | map(attribute='name_ref') | select | list), wantlist=True)
         + (freshrss_accounts | map(attribute='name') | select | list)) | unique | length
        == (freshrss_accounts | map(attribute='name_ref') | select | list | length)
           + (freshrss_accounts | map(attribute='name') | select | list | length)
      - >-
        lookup('hnx_secret', *((freshrss_accounts | map(attribute='password_ref') | select | list)
                               + (freshrss_accounts | map(attribute='api_password_ref') | select | list)), wantlist=True)
        | unique | length
        == (freshrss_accounts | map(attribute='password_ref') | select | list | length)
           + (freshrss_accounts | map(attribute='api_password_ref') | select | list | length)
    fail_msg: >-
      freshrss: each additional account's name (1 to 38 of A-Z a-z 0-9 . _ @ -, not starting with a
      dot, an at sign or a hyphen) and each password (16 to 128 of A-Z a-z 0-9 . _ ~ -) must resolve in
      its form, no two accounts with the same name and no password shared by two
  no_log: true
  tags: [readiness]
