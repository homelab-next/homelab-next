# SPDX-License-Identifier: Apache-2.0
# The exit copy (object-tree, docs/modules/data.md): <data root>/export/latest/ holds, for every
# account, the product's own SQLite export (every subscription, category, entry and read state, a
# consistent copy made through the running application: no stop) and an OPML list of its
# subscriptions, beside manifest.json (the names and counts) and listing.jsonl (each file's size and
# sha256). It is built in export/.new and renamed into place only when every account's export is
# whole: the SQLite copy holds as many feeds and categories as the application reported, and no
# account that should hold subscriptions holds fewer than the floor. A failure leaves the previous
# latest in place. A snapshot: every run writes a new copy (the hook reports changed).
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Refuse a feed list that is not the one pinned
      ansible.builtin.include_tasks: opml_check.yml
      when: freshrss_opml_src | length > 0
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Create the data directories
      ansible.builtin.include_tasks: dirs.yml
    - name: Look at the build directory an earlier run may have left
      ansible.builtin.stat:
        path: "{{ freshrss_data_root }}/export/.new"
        follow: false
      register: freshrss_export_new
    - name: Refuse a build directory that is not a plain directory
      ansible.builtin.assert:
        that: not freshrss_export_new.stat.exists or (freshrss_export_new.stat.isdir and not freshrss_export_new.stat.islnk)
        fail_msg: "freshrss: {{ freshrss_data_root }}/export/.new is not a directory; move it away"
    - name: Clear it (a fixed path inside the data root's export directory)
      ansible.builtin.file:
        path: "{{ freshrss_data_root }}/export/.new"
        state: absent
    - name: Create the build directory
      ansible.builtin.file:
        path: "{{ freshrss_data_root }}/export/.new"
        state: directory
        owner: "{{ freshrss_app_uid | int }}"
        group: "{{ freshrss_app_gid | int }}"
        mode: "0700"
    - name: Reset what was collected
      ansible.builtin.set_fact:
        freshrss_export_accounts: []
        freshrss_export_files: []
      no_log: true
    - name: Export each account
      ansible.builtin.include_tasks: export_one.yml
      loop: "{{ freshrss_accounts }}"
      loop_control:
        loop_var: freshrss_acct
        index_var: freshrss_i
        label: "account {{ freshrss_i }}"
    - name: Write the manifest
      ansible.builtin.copy:
        dest: "{{ freshrss_data_root }}/export/.new/manifest.json"
        content: "{{ {'format': 'freshrss-export-1', 'accounts': freshrss_export_accounts} | to_nice_json(sort_keys=true) }}\n"
        owner: "{{ freshrss_app_uid | int }}"
        group: "{{ freshrss_app_gid | int }}"
        mode: "0600"
      no_log: true
    - name: Read the manifest (size, sha256)
      ansible.builtin.stat:
        path: "{{ freshrss_data_root }}/export/.new/manifest.json"
        checksum_algorithm: sha256
      register: freshrss_export_manifest
    - name: Write the listing
      vars:
        newline: "\n"
      ansible.builtin.copy:
        dest: "{{ freshrss_data_root }}/export/.new/listing.jsonl"
        content: >-
          {{ ((freshrss_export_files + [{'key': 'manifest.json', 'size': freshrss_export_manifest.stat.size, 'sha256': freshrss_export_manifest.stat.checksum}])
              | map('to_json', sort_keys=True) | join(newline)) ~ newline }}
        owner: "{{ freshrss_app_uid | int }}"
        group: "{{ freshrss_app_gid | int }}"
        mode: "0600"
      no_log: true
    - name: Look at the copy in place
      ansible.builtin.stat:
        path: "{{ freshrss_data_root }}/export/latest"
        follow: false
      register: freshrss_export_old
    - name: Refuse a previous copy that is not a plain directory
      ansible.builtin.assert:
        that: not freshrss_export_old.stat.exists or (freshrss_export_old.stat.isdir and not freshrss_export_old.stat.islnk)
        fail_msg: "freshrss: {{ freshrss_data_root }}/export/latest is not a directory; move it away"
    - name: Set the previous copy aside
      ansible.builtin.command:
        argv: [mv, -T, "{{ freshrss_data_root }}/export/latest", "{{ freshrss_data_root }}/export/.previous"]
      changed_when: true
      when: freshrss_export_old.stat.exists
    - name: Put the new copy in place
      ansible.builtin.command:
        argv: [mv, -T, "{{ freshrss_data_root }}/export/.new", "{{ freshrss_data_root }}/export/latest"]
      changed_when: true
    - name: Remove the previous copy (a fixed path inside the data root's export directory)
      ansible.builtin.file:
        path: "{{ freshrss_data_root }}/export/.previous"
        state: absent
  tags: [export]
