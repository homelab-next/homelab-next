        type: str
        description: The language of a new account (a code such as en).
        default: en
      freshrss_base_url:
        type: str
        description: The name the people and agents use for the reader when a route exists (an http(s)
          URL); empty means the guest's own address and port.
        default: ''
      freshrss_cron_minutes:
        type: str
        description: The minutes of each hour the image's own cron refreshes the feeds (comma separated,
          0 to 59).
        default: 7,37
      freshrss_admin_user:
        type: str
        description: The administrator's account name (the product's default user).
        default: admin
      freshrss_admin_login_ref:
        type: str
        description: 'secret: reference of the administrator''s web password.'
        default: secret:freshrss/admin-password
      freshrss_admin_api_login_ref:
        type: str
        description: 'secret: reference of the administrator''s API password; empty means the administrator
          has no API.'
        default: ''
      freshrss_users:
        type: list
        description: 'The additional accounts: mappings of name_ref and api_password_ref (secret: references;
          the name is a secret too), password_ref (optional: without it the account has no web sign-in)
          and opml (optional, default true: whether the feed list is subscribed for it).'
        default: []
        elements: dict
      freshrss_opml_src:
        type: path
        description: An OPML feed list on the control host; with freshrss_opml_sha256, or neither.
        default: ''
      freshrss_opml_sha256:
        type: str
        description: The sha256 of that file; the role refuses any other content before it copies anything.
        default: ''
      freshrss_admin_import_opml:
        type: bool
        description: Whether the feed list is subscribed for the administrator too.
        default: false
      freshrss_opml_tolerance:
        type: int
        description: How many fewer feeds than the list has distinct addresses the import and health accept
          (a feed the product merges with another).
        default: 0
      freshrss_expected_min_feeds:
        type: int
        description: Health and export fail when an account that subscribed the list holds fewer feeds
          than this (0 means only the list is checked).
        default: 0
      freshrss_mem_limit:
        type: str
        description: The container's memory limit.
        default: 512m
      freshrss_start:
        type: bool
        description: Start the container (false renders only).
        default: true
      freshrss_validate_with_docker:
        type: bool
        description: Have compose validate the rendered project.
        default: true
      freshrss_health_timeout:
        type: int
        description: Seconds each health request may take.
        default: 15
      freshrss_ready_timeout:
        type: int
        description: Seconds main waits for the application to answer after a start (the first one installs
          the product).
        default: 300
      freshrss_import_timeout:
        type: int
        description: Seconds a subscription of the feed list may take for one account (the product reads
          each new feed's page and icon).
        default: 1800
      freshrss_target_image:
        type: str
        description: repository:tag@sha256:<digest> to move to.
        required: true
