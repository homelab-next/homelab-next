# The account, then the directories. One account runs the slots and their VMs and is the one the
# feeder's key logs in as (forced to the feed command), so every file of the pool is that
# account's alone (0700 directories, 0600/0400 files) and nothing is shared through a group. The
# configuration and the feed key are root's.
- name: Create the module's group
  ansible.builtin.group:
    name: "{{ ci_runner_group }}"
    system: true
  when: ci_runner_manage_accounts | bool

- name: Create the slots' account (kvm for the job VMs; sshd's group for the feeder's forced-command key)
  ansible.builtin.user:
    name: "{{ ci_runner_user }}"
    group: "{{ ci_runner_group }}"
    groups: [kvm, "{{ ci_runner_feed_ssh_group }}"]
    append: true
    system: true
    create_home: false
    home: "{{ ci_runner_data_root }}/feed"
    shell: /bin/sh
    password: "!"
  when: ci_runner_manage_accounts | bool

- name: Create the directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ ci_runner_bin_dir }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ ci_runner_config_dir }}", owner: root, group: "{{ ci_runner_group }}", mode: "0750"}
    - {path: "{{ ci_runner_build_dir }}", owner: root, group: "{{ ci_runner_group }}", mode: "0750"}
    - {path: "{{ ci_runner_data_root }}", owner: root, group: "{{ ci_runner_group }}", mode: "0750"}
    - {path: "{{ ci_runner_images_dir }}", owner: "{{ ci_runner_user }}", group: "{{ ci_runner_group }}", mode: "0700"}
    - {path: "{{ ci_runner_slots_dir }}", owner: "{{ ci_runner_user }}", group: "{{ ci_runner_group }}", mode: "0700"}
    - {path: "{{ ci_runner_spool_dir }}", owner: "{{ ci_runner_user }}", group: "{{ ci_runner_group }}", mode: "0700"}
    - {path: "{{ ci_runner_data_root }}/feed", owner: root, group: "{{ ci_runner_group }}", mode: "0750"}
    - {path: "{{ ci_runner_data_root }}/feed/.ssh", owner: root, group: "{{ ci_runner_group }}", mode: "0750"}
  loop_control:
    label: "{{ item.path }}"
