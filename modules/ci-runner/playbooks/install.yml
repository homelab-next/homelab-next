# Install (and converge) the CI runner pool on the guest the site placed the module's `runner` role
# on. The apply path (docs/modules/apply.md) renders its own modules.yml from the selection and does
# not import this file; it is the module's own entry point, for a lab that runs one module by hand:
#   ansible-playbook -i <inventory with --selection> modules/ci-runner/playbooks/install.yml
- name: Install the ephemeral CI runner pool
  hosts: mod_ci_runner_runner
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: ci_runner
        tasks_from: readiness
      tags: [mod_ci_runner]
  roles:
    - role: ci_runner
      tags: [mod_ci_runner]
