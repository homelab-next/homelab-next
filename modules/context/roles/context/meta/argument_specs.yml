        default: []
      context_callers:
        type: list
        description: 'The callers: {name, secret, ceiling, scopes} with scopes from query and reindex;
          only each token''s sha256 reaches the service.'
        elements: dict
        default: []
      context_admin_ref:
        type: str
        description: The admin token's secret (the timer's reindex and the health hook's self-check; never
          query).
        default: secret:context/admin-token
      context_health_query:
        type: dict
        description: 'The canned query: {text, expect: the id of a known document, ceiling}; required
          (no lab value has a default).'
        default: {}
      context_gateway_id:
        type: str
        description: 'The gateway''s registry id; empty: the judge is off (plain ranking).'
        default: ''
      context_gateway_key_ref:
        type: str
        description: The secret of the key this service presents to the gateway (read only when context_gateway_id
          is set).
        default: secret:context/gateway-key
      context_judge_role:
        type: str
        description: The gateway's decision role the judge asks (kind decision).
        default: fast-classifier
      context_judge_threshold:
        type: float
        description: Abstain when no top passage reaches this probability (the eval's 0.10).
        default: 0.1
      context_judge_workers:
        type: int
        description: Concurrent judge calls (the decision server's parallel slots).
        default: 2
      context_judge_top_k:
        type: int
        description: How many top passages the judge may be asked about.
        default: 5
      context_judge_ceiling:
        type: str
        description: The most restrictive TLP label a passage sent to the gateway may carry.
        default: amber
      context_judge_on_error:
        type: str
        description: 'A judge failure: fallback (the store''s own ranking) or abstain.'
        default: fallback
      context_allow_plain_http:
        type: bool
        description: 'Allow a gateway or a source over plain http (LAN only): the key or credential then
          travels in clear.'
        default: false
      context_dense_weight:
        type: float
        description: The semantic adapter's weight of the dense score in [0, 1].
        default: 0.5
      context_min_similarity:
        type: float
        description: The cosine a document needs to be a hit without a shared word.
        default: 0.36
      context_min_score:
        type: float
        description: The fused score a hit needs (0 keeps every hit).
        default: 0.0
      context_reindex_schedule:
        type: str
        description: The reindex timer's OnCalendar.
        default: '*-*-* *:20:00 UTC'
      context_reindex_timeout_s:
        type: int
        description: Seconds one reindex (fetch and index) may take.
