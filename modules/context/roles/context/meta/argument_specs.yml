      context_systemctl_cli:
        type: str
        description: The systemctl command.
        default: systemctl
      context_docker_cli:
        type: path
        description: 'The docker command (absolute: the timer''s unit runs it).'
        default: /usr/bin/docker
      context_mem_limit:
        type: str
        description: The container's memory limit, like 3g.
        default: 3g
      context_start:
        type: bool
        description: 'Start (and wait for) the service and the timer (false: render only).'
