        type: int
        description: The container's user id (no account on the host has it); owns the data root.
        default: 61013
      context_gid:
        type: int
        description: The container's group id.
        default: 61013
      context_sources:
        type: list
        description: 'The git sources: {name, url, ref, kind, tlp, paths, format?, records_key?, id_field?,
          title_field?, honour_item_labels?, credential?, credential_scheme?} (README.md, "Sources").'
