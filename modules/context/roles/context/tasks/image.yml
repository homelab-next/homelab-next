# The image is built by the lab, not pulled from a registry. When context_image_archive names a local
# `docker save` of that exact image (compressed or not; docker load reads gzip, xz and zstd), the image is
# loaded from it if the daemon lacks the digest, and the role refuses to go on if it is still missing.
- name: Ask whether the daemon already has the pinned image
  ansible.builtin.command:
    argv: [docker, image, inspect, --format, "{{ '{{.Id}}' }}", "{{ context_repository }}@{{ context_digest }}"]
  register: context_have_image
  changed_when: false
  failed_when: false
  check_mode: false

- name: Load the pinned image from the archive when the daemon lacks it
  when: context_have_image.rc != 0
  block:
    - name: The archive is a regular file
      ansible.builtin.stat:
        path: "{{ context_image_archive }}"
        follow: false
      register: context_archive
    - name: Refuse anything but a regular archive
      ansible.builtin.assert:
        that: context_archive.stat.exists and context_archive.stat.isreg
        fail_msg: "context: {{ context_image_archive }} is not a regular file"
    - name: Load the image
      ansible.builtin.command:
        argv: [docker, load, -i, "{{ context_image_archive }}"]
      changed_when: true
    - name: The pinned digest is there now
      ansible.builtin.command:
        argv: [docker, image, inspect, --format, "{{ '{{.Id}}' }}", "{{ context_repository }}@{{ context_digest }}"]
      changed_when: false
      register: context_loaded
      failed_when: context_loaded.rc != 0
