# Every credential the configuration needs resolves, in the form the service takes: the admin's and
# each caller's token (32 to 256 characters a bearer header can carry, all distinct), the gateway key
# when the judge is on, each source's git credential when it names one. A reference that is unset is
# refused here, before any file is written. Only the verdicts leave the no_log tasks.
- name: Start the verdicts empty (this file runs again from every hook)
  ansible.builtin.set_fact:
    context_bearer_forms: []
    context_bearer_digests: []
    context_source_forms: []
  tags: [readiness, health]

- name: Read the admin's and each caller's token form and digest
  ansible.builtin.set_fact:
    context_bearer_forms: "{{ context_bearer_forms + [lookup('hnx_secret', item) is match(context_bearer_pattern)] }}"
    context_bearer_digests: "{{ context_bearer_digests + [lookup('hnx_secret', item) | hash('sha256')] }}"
  loop: "{{ [context_admin_ref] + (context_callers | map(attribute='secret') | list) }}"
  no_log: true
  tags: [readiness, health]

- name: Read each source's git credential form, where one is named
  ansible.builtin.set_fact:
    context_source_forms: >-
      {{ context_source_forms + [lookup('hnx_secret', item.credential) | length >= 8
         and lookup('hnx_secret', item.credential) is match('^[!-~]{8,512}\Z')] }}
  loop: "{{ context_sources | selectattr('credential', 'defined') | rejectattr('credential', 'equalto', '') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  tags: [readiness, health]

- name: Read the gateway key's form, when the judge is on
  ansible.builtin.set_fact:
    context_gateway_form: >-
      {{ true if context_gateway_id == ''
         else (lookup('hnx_secret', context_gateway_key_ref) | length >= 8
               and lookup('hnx_secret', context_gateway_key_ref) is match('^[A-Za-z0-9._~+/=:-]+\Z')) }}
  no_log: true
  tags: [readiness, health]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - context_bearer_forms | select | list | length == context_bearer_forms | length
      - context_bearer_digests | unique | list | length == context_bearer_digests | length
      - context_source_forms | select | list | length == context_source_forms | length
      - context_gateway_form | bool
    fail_msg: >-
      context: the admin's and every caller's token must be 32 to 256 characters of letters, digits and
      . _ ~ + / = - and different from every other; a source's git credential 8 or more printable
      characters without a space; the gateway key (when context_gateway_id is set) 8 or more without a
      space. Token forms {{ context_bearer_forms }}; shared tokens
      {{ context_bearer_digests | length != context_bearer_digests | unique | list | length }}; source
      credentials {{ context_source_forms }}; gateway key {{ context_gateway_form }}
  tags: [readiness, health]
