# SPDX-License-Identifier: Apache-2.0
# Every credential resolves, and the two the server is given have ntfy's form: a malformed one
# would stop the server at start (auth-users and auth-tokens are checked then). Only the verdicts
# leave the no_log task.
- name: Read each credential's form
  ansible.builtin.set_fact:
    ntfy_forms:
      password: "{{ lookup('hnx_secret', ntfy_admin_login_ref) | length >= 12 }}"
      hash: "{{ lookup('hnx_secret', ntfy_admin_hash_ref) is match(ntfy_bcrypt_pattern) }}"
      token: "{{ lookup('hnx_secret', ntfy_publisher_key_ref) is match(ntfy_key_pattern) }}"
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - ntfy_forms.password | bool
      - ntfy_forms.hash | bool
      - ntfy_forms.token | bool
    fail_msg: >-
      ntfy: {{ ntfy_admin_login_ref }} must be a password of 12 characters or more,
      {{ ntfy_admin_hash_ref }} its bcrypt hash of cost 10 or more (ntfy user hash) and
      {{ ntfy_publisher_key_ref }} a token of tk_ and 29 letters, digits, - or _ (ntfy token
      generate); forms: {{ ntfy_forms }}
  tags: [readiness]
