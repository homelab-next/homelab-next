# SPDX-License-Identifier: Apache-2.0
# ntfy, the notify provider (modules/ntfy): one container, deny-all auth, no egress. Every account,
# access entry and token is provisioned from the server's environment at each start (ntfy's
# auth-users, auth-access and auth-tokens), so what runs is what these settings and the secrets say.
# ntfy_logical_id (required): the instance's registry id, e.g. notify
ntfy_image: "docker.io/binwiederhier/ntfy:v2.35.0@sha256:6f0c9abab7b99a978d816611cc90dabb4849b81f60c53114e91cd07931085dc0"
# published on the guest's own address (the inventory's ansible_host), never all interfaces; the
# guest firewall admits the lab's publishers
ntfy_bind: "{{ ansible_host }}"
ntfy_port: 80
ntfy_dir: /opt/compose/ntfy
# owner and group of the compose project and the data root (db/ and export/ are the container's).
# The group is the container's gid, so the container's user can pass through the data root (0750)
# to db/ and export/ (the export runs as that user); no account on the host has that gid.
ntfy_owner: root
ntfy_group: "{{ ntfy_gid }}"
# the module's data root on its host (docs/modules/data.md): db/ (the container's) and export/
ntfy_data_root: /var/lib/hnx-modules/ntfy
# the container's user and group: an id no account on the host has
ntfy_uid: 61000
ntfy_gid: 61000
ntfy_admin_user: admin
ntfy_admin_login_ref: secret:ntfy/admin-password
ntfy_admin_hash_ref: secret:ntfy/admin-password-hash
ntfy_publisher_user: publisher
ntfy_publisher_key_ref: secret:ntfy/publisher-token
# topic patterns the publisher may publish to (write-only: it never reads them)
ntfy_publisher_topics: ["*"]
# the scratch topics (this prefix, then anything) the publisher may also read back: the health
# hook's round trip and the conformance suite's topics (the shared adapter's hnxconf-<hex>)
ntfy_scratch_prefix: hnxconf-
ntfy_cache_duration: 12h
ntfy_mem_limit: 256m
ntfy_start: true
ntfy_validate_with_docker: true
ntfy_health_timeout: 10
# The dead-man watch (LL-571): things that cannot report their own death (the metrics guest) post a
# heartbeat to a topic of this service; a timer on THIS host reads the newest message time of each
# topic from the message cache and pages through this service when a topic goes quiet, once, and
# once more when it speaks again. Empty (the default): no watch. Each beat: {name: <slug>, topic:
# <a topic the publisher may write>, max_age_minutes: <silence that pages>}. The limit must be at
# least twice the watch's interval and at most half the cache duration (a heartbeat the cache has
# already dropped cannot be told from none). The watch pages to ntfy_deadman_alert_topic with the
# publisher token; it cannot page if this service is itself down (the compose boot unit and the
# role's health are what notice that).
ntfy_deadman_beats: []
ntfy_deadman_alert_topic: homelabnext-alerts
# the watch's timer: an OnCalendar ending in UTC (LL-041: a calendar, not a boot-relative timer), one
# of ntfy_deadman_schedules (vars/main.yml); the minutes between its runs
# (ntfy_deadman_interval_minutes) are derived from it, so the limits can never disagree with the timer
ntfy_deadman_schedule: "*-*-* *:0/5:00 UTC"
# a watch that cannot read the message cache judges nothing (the dead-man is off): after this many
# consecutive such runs it pages once, through the service, and once more when it reads again
ntfy_deadman_unreadable_after_runs: 3
ntfy_systemctl_cli: systemctl
ntfy_unit_dir: /etc/systemd/system
# the shared last-run record directory (role last_run) and the group that may read it
ntfy_last_run_dir: /var/lib/homelabnext/last-run
ntfy_last_run_group: root
