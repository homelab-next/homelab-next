# Remove: stop and disable the unit, stop and remove the container and delete the unit file. The
# module keeps no data: the weights are the model store's, and the data root (the launcher's settings and the tokenizer it builds from the weights, both rebuilt on start) and
# the rest of the compose project are kept for the operator to delete; the decommission audit
# (module.yml lifecycle.remove.audit) checks nothing still names the service.
- name: Remove Strata
  hosts: mod_strata_server
  become: true
  tasks:
    - name: Stop and disable the unit (stopping it stops the container)
      ansible.builtin.command:
        argv: [systemctl, disable, --now, hnx-strata.service]
      changed_when: true
      failed_when: false
    - name: Remove the container
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ strata_dir | default('/opt/compose/strata') }}/docker-compose.yml", down]
      changed_when: true
    - name: Delete the unit file
      ansible.builtin.file:
        path: "{{ strata_unit_dir | default('/etc/systemd/system') }}/hnx-strata.service"
        state: absent
    - name: Reload systemd
      ansible.builtin.command:
        argv: [systemctl, daemon-reload]
      changed_when: true
