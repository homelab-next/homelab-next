# SPDX-License-Identifier: Apache-2.0
# Install (and converge) Strata on the guests the site placed the module's `server` role on. The
# apply path (docs/modules/apply.md) renders its own modules.yml from the selection and does not
# import this file; it is the module's own entry point, for a lab that runs one module by hand:
#   ansible-playbook -i <inventory with --selection> modules/strata/playbooks/install.yml
# docker_engine and model_store are applied to the guest first (the weights must be in the store);
# the role's readiness hook refuses to go on without either.
- name: Install Strata (the inference provider)
  hosts: mod_strata_server
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: strata
        tasks_from: readiness
      tags: [mod_strata]
  roles:
    - role: strata
      tags: [mod_strata]
