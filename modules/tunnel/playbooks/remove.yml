# Remove: stop and remove the container and delete the env_file that holds the tunnel token. The
# connector keeps no data, so there is nothing to export. Removing a connector does not delete the
# tunnel or its public names (they live in the Cloudflare dashboard); remove it only when another
# connector of the same tunnel is healthy (README, "Handing the tunnel over"). The decommission
# audit (module.yml lifecycle.remove.audit) checks nothing still names the service.
- name: Remove the tunnel connector
  hosts: mod_tunnel_server
  become: true
  tasks:
    - name: Stop and remove the container
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ tunnel_dir | default('/opt/compose/tunnel') }}/docker-compose.yml", down]
      changed_when: true
    - name: Delete the credential the container was given (the tunnel token)
      ansible.builtin.file:
        path: "{{ tunnel_dir | default('/opt/compose/tunnel') }}/secrets/tunnel.env"
        state: absent
