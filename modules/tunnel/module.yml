# SPDX-License-Identifier: Apache-2.0
# The tunnel provider on cloudflared (docs/modules.md; README.md beside this file): the connector of a
# REMOTELY MANAGED Cloudflare Tunnel, run as one compose_app container from a pinned image on a guest
# that already has docker_engine. The tunnel's ingress rules, public hostnames and Access policies
# live in the Cloudflare dashboard, so the connector needs one credential, the tunnel token, and the
# role renders no ingress configuration. Outbound only: the connection to Cloudflare's edge; the one
# port it listens on is its metrics and readiness listener, on the guest's own address. Every real
# value (the guest, its address, the token) is the site's: the overlay's lab/modules.yml,
# lab/services.yml and secret store.
manifest_version: "1.0"
id: tunnel
kind: provider
title: A public tunnel connector on cloudflared
description: Fills the tunnel slot with cloudflared, the connector of a remotely managed Cloudflare
  Tunnel, run as one compose_app container with a pinned image; outbound only, ingress and access
  policy stay in the Cloudflare dashboard.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: cloudflared
  version: 2026.10.7
licence:
  kind: open-source
  spdx: Apache-2.0
credentials:
  - secret: secret:tunnel/token
    identity: api-token
    holder: provider
    purpose: the tunnel token of the remotely managed tunnel (base64 JSON naming the account, the tunnel and its secret); the only thing the connector needs to join it, shared by every connector of that tunnel
identifiers:
  - {kind: secret-name, name: tunnel, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the tunnel token is read by name at deploy time
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 1, memory_mb: 256, disk_gb: 2}
      guest:
        baselines: [base]
      roles: [role:tunnel]
      purpose: runs the cloudflared connector (docker_engine applied first, compose_app renders it)
provides:
  slots:
    tunnel:
      adapter: hnx_modules.tunnel.adapter:make
      provisional: true
      reason: tunnel has no contract yet; the observable is the connector's own readiness endpoint (200 with at least one ready connection), which the role's health hook proves
egress:
  - host: server
    to: [internet]
    purpose: the connection to Cloudflare's edge (outbound, port 7844 over QUIC or HTTP/2) that carries the public names to the tunnel's origin
contributes:
  roles:
    - file: roles/tunnel
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:tunnel, hook: readiness}
  docs:
    - file: README.md
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest): the role's upgrade hook validates and records it, then it converges"}
  remove:
    playbook: playbooks/remove.yml
    export_first: false
    discard_reason: the connector keeps no data (the tunnel, its public names and its policies are the provider's, in the dashboard) and its token is in the secret store
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
