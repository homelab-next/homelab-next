# The registry row (platform/service) this provider contributes. It is keyed by the slot and
# renamed to the instance the site selects; version is product.version (never repeated here), and
# host is the module's host role, which the site places on a guest. The lab registry
# (lab/services.yml) must carry it exactly as bound (hnx modules check, docs/modules/registry-rows.md):
# the instance's name, the placed guest's name as host, the product's version, and at most the
# lab's own standing, backup_job and scope beside it. The port is the connector's metrics and
# readiness listener (the tunnel itself is outbound only); there is no public_hostname here: the
# public names are the tunnel's, set in the Cloudflare dashboard.
services:
  tunnel:
    capability: tunnel
    impl: cloudflared
    host: server
    protocol: http
    port: 20241
    health: {kind: http, path: /ready, expect_status: 200}
    owner: operator
    tls: none
    tags: [tunnel]
    description: cloudflared, the connector of a remotely managed tunnel; outbound only. Its port is the metrics and readiness listener (/ready is 200 with a ready connection).
