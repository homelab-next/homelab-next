# The tunnel token resolves, is not empty, and has the form cloudflared reads (base64 of a JSON
# object with the keys a, s and t): an empty or malformed token would start a connector that never
# joins the tunnel, and nothing would say why. Only the verdicts leave the no_log tasks; the token
# never reaches a message.
- name: Read the token's form
  ansible.builtin.set_fact:
    tunnel_forms:
      present: "{{ lookup('hnx_secret', tunnel_join_ref) | trim | length > 0 }}"
      charset: "{{ lookup('hnx_secret', tunnel_join_ref) is match(tunnel_join_form) }}"
  no_log: true
  ignore_errors: true
  register: tunnel_forms_read
  tags: [readiness]

# The lookup fails on an unset or empty secret (its own message is hidden with the token).
- name: The token is set, present and base64
  ansible.builtin.assert:
    that:
      - tunnel_forms_read is not failed
      - tunnel_forms.present | default(false) | bool
      - tunnel_forms.charset | default(false) | bool
    fail_msg: >-
      tunnel: {{ tunnel_join_ref }} must hold the tunnel token (the base64 string the dashboard
      gives for the tunnel's connector; at least 60 characters, no spaces or newlines); it is
      {{ 'unset or empty' if (tunnel_forms_read is failed or not (tunnel_forms.present | default(false) | bool)) else 'not base64' }}.
      Refusing to start a connector that cannot join the tunnel.
  tags: [readiness]

- name: Decode the token (verdict only)
  ansible.builtin.set_fact:
    tunnel_join_keys_found: "{{ ((tunnel_join_norm ~ ('=' * ((4 - (tunnel_join_norm | length) % 4) % 4))) | b64decode | from_json).keys() | sort | list }}"
  vars:
    # URL-safe and unpadded forms are normalised to padded standard base64 first
    tunnel_join_norm: "{{ lookup('hnx_secret', tunnel_join_ref) | trim | replace('-', '+') | replace('_', '/') | regex_replace('=+$', '') }}"
  no_log: true
  ignore_errors: true
  register: tunnel_join_decode
  tags: [readiness]

- name: The token decodes to the object cloudflared reads
  ansible.builtin.assert:
    that:
      - tunnel_join_decode is not failed
      - tunnel_join_keys_found | default([]) == tunnel_join_keys
    fail_msg: >-
      tunnel: {{ tunnel_join_ref }} does not decode to the tunnel token object (base64 of JSON
      with the keys {{ tunnel_join_keys | join(', ') }}): copy the token of the connector the
      dashboard shows, not an API token or a tunnel id
  tags: [readiness]
