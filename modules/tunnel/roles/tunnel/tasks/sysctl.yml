# QUIC's UDP buffers (LL-173): an undersized net.core.rmem_max starved quic-go and the connector's
# connections to the edge timed out under loss, while every container and LAN check stayed green.
# The role only RAISES the ceilings to tunnel_udp_buffer_bytes: when both live values are already
# at least that, it writes nothing and never lowers a higher value another file set.
- name: Read the live UDP buffer ceilings
  ansible.builtin.command:
    argv: ["{{ tunnel_sysctl_cli }}", -n, "{{ item }}"]
  loop: [net.core.rmem_max, net.core.wmem_max]
  register: tunnel_sysctl_live
  changed_when: false
  check_mode: false

- name: Decide whether either ceiling is below the floor
  ansible.builtin.set_fact:
    tunnel_sysctl_low: "{{ tunnel_sysctl_live.results | selectattr('stdout', 'defined') | map(attribute='stdout') | map('trim') | map('int') | select('lt', tunnel_udp_buffer_bytes | int) | list | length > 0 }}"

- name: Persist the floor for the ceilings that are below it
  ansible.builtin.copy:
    dest: "{{ tunnel_sysctl_file }}"
    owner: "{{ tunnel_owner }}"
    group: "{{ tunnel_group }}"
    mode: "0644"
    content: |
      # managed by the tunnel module (QUIC needs large UDP buffers); a floor, raised only
      net.core.rmem_max = {{ tunnel_udp_buffer_bytes | int }}
      net.core.wmem_max = {{ tunnel_udp_buffer_bytes | int }}
  register: tunnel_sysctl_written
  when: tunnel_sysctl_low | bool

- name: Raise the low ceilings now
  ansible.builtin.command:
    argv: ["{{ tunnel_sysctl_cli }}", -w, "{{ item.item }}={{ tunnel_udp_buffer_bytes | int }}"]
  loop: "{{ tunnel_sysctl_live.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: tunnel_sysctl_apply | bool and tunnel_sysctl_low | bool and (item.stdout | trim | int) < (tunnel_udp_buffer_bytes | int)
  changed_when: true
