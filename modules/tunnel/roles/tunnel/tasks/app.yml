# The compose_app inputs (shared by main and the hooks that delegate to compose_app): one
# container as its own non-root user, every capability dropped, a read-only root filesystem, no
# volume and no config file (the tunnel is remotely managed), published on the guest's address only.
- name: Build the application spec
  ansible.builtin.set_fact:
    tunnel_app:
      compose_app_name: tunnel
      compose_app_dir: "{{ tunnel_dir }}"
      compose_app_data_dir: "{{ tunnel_data_root }}"
      compose_app_export_dir: "{{ tunnel_data_root }}/export"
      compose_app_owner: "{{ tunnel_owner }}"
      compose_app_group: "{{ tunnel_group }}"
      compose_app_start: "{{ tunnel_start }}"
      compose_app_validate_with_docker: "{{ tunnel_validate_with_docker }}"
      compose_app_spec:
        services:
          tunnel:
            image: "{{ tunnel_repository }}"
            tag: "{{ tunnel_tag }}"
            digest: "{{ tunnel_digest }}"
            command: "{{ ['tunnel', '--no-autoupdate', '--metrics', tunnel_container_metrics_listen, 'run'] }}"
            user: "{{ tunnel_uid | int }}:{{ tunnel_gid | int }}"
            read_only: true
            ports: ["{{ tunnel_bind }}:{{ tunnel_port | int }}:{{ tunnel_container_metrics_listen[1:] }}"]
            mem_limit: "{{ tunnel_mem_limit }}"
            healthcheck:
              test: [CMD, cloudflared, tunnel, --metrics, "{{ tunnel_container_metrics_listen }}", ready]
              interval: 30s
              timeout: 5s
              retries: 5
              start_period: 20s
  tags: [health, backup, restore, export, upgrade]
