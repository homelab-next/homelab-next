# Every credential the chosen sign-in and the parameters need resolves, and has the form the service
# needs. Only the verdicts leave the no_log task.
- name: Read each credential's form
  ansible.builtin.set_fact:
    nifi_forms:
      cert: "{{ lookup('hnx_secret', nifi_tls_cert_ref) is search(nifi_pem_cert_pattern) }}"
      key: "{{ lookup('hnx_secret', nifi_tls_key_ref) is search(nifi_pem_key_pattern) }}"
      ca: "{{ lookup('hnx_secret', nifi_ca_ref) is search(nifi_pem_cert_pattern) }}"
      store: "{{ lookup('hnx_secret', nifi_store_pw_ref) is match('^[A-Za-z0-9._~+=/-]{16,128}\\Z') }}"
      props_key: "{{ lookup('hnx_secret', nifi_sensitive_props_key_ref) is match('^[A-Za-z0-9._~+=/-]{12,128}\\Z') }}"
      user: "{{ nifi_auth != 'single-user' or lookup('hnx_secret', nifi_user_pw_ref) is match('^[A-Za-z0-9._~+=/!@#%^*-]{12,128}\\Z') }}"
      oidc: "{{ nifi_auth != 'oidc' or lookup('hnx_secret', nifi_oidc_cred_ref) is match('^[A-Za-z0-9._~+=/-]{16,256}\\Z') }}"
      token: "{{ nifi_auth != 'oidc' or lookup('hnx_secret', nifi_api_bearer_ref) is match('^[A-Za-z0-9._~+=/-]{20,4096}\\Z') }}"
      key_id: "{{ lookup('hnx_secret', nifi_s3_access_key_ref) is match(nifi_key_id_pattern) }}"
      key_value: "{{ lookup('hnx_secret', nifi_s3_signing_ref) is match(nifi_hex64_pattern) }}"
      events: "{{ lookup('hnx_secret', nifi_events_auth_ref) is match('^[A-Za-z0-9._~+=/ -]{8,4096}\\Z') }}"
      registry: "{{ nifi_registry_auth_ref == '' or lookup('hnx_secret', nifi_registry_auth_ref) is match('^[A-Za-z0-9._~+=/-]{8,512}\\Z') }}"
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - nifi_forms.cert | bool
      - nifi_forms.key | bool
      - nifi_forms.ca | bool
      - nifi_forms.store | bool
      - nifi_forms.props_key | bool
      - nifi_forms.user | bool
      - nifi_forms.oidc | bool
      - nifi_forms.token | bool
      - nifi_forms.key_id | bool
      - nifi_forms.key_value | bool
      - nifi_forms.events | bool
      - nifi_forms.registry | bool
    fail_msg: >-
      nifi: {{ nifi_tls_cert_ref }}, {{ nifi_tls_key_ref }} and {{ nifi_ca_ref }} must be PEM;
      {{ nifi_store_pw_ref }} 16 to 128 characters and {{ nifi_sensitive_props_key_ref }} 12 to 128
      characters of A-Z a-z 0-9 . _ ~ + = / -; with the single-user sign-in {{ nifi_user_pw_ref }}
      12 to 128 characters; with oidc {{ nifi_oidc_cred_ref }} 16 or more and {{ nifi_api_bearer_ref }}
      a bearer token; {{ nifi_s3_access_key_ref }} must be GK and 24 to 32 hex digits and
      {{ nifi_s3_signing_ref }} 64 hex digits; {{ nifi_events_auth_ref }} the Authorization header value;
      {{ nifi_registry_auth_ref | default('(no registry token)', true) }} a token; forms: {{ nifi_forms }}
  tags: [readiness]

- name: Every extra parameter's secret resolves and is a single line
  ansible.builtin.assert:
    that:
      - lookup('hnx_secret', item) | length > 0
      - lookup('hnx_secret', item) is match('^[^\\r\\n\\0]{1,4096}\\Z')
    fail_msg: "nifi: {{ item }} does not resolve to a non-empty single-line value"
  loop: "{{ nifi_extra_parameters.values() | list }}"
  no_log: true
  tags: [readiness]
