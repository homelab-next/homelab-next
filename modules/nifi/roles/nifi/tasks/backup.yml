# The backup manifest names the state the export keeps (conf/flow.json.gz, users.xml, authorizations.xml
# and the state and repository directories), NOT the data root whole: conf/nifi.properties holds the
# sensitive-props key and the keystore passwords, login-identity-providers.xml the single-user hash, and
# tls/ the keys; those are rebuilt (seed.yml, tls.yml) and the export leaves them out for the same reason.
# A copy of a running service's repositories is crash-consistent, which NiFi recovers from. The
# export hook is the consistent copy (the service stopped for the repositories, the flow definitions
# through the API first), so a restore never depends on that.
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Create the data directories
      ansible.builtin.include_tasks: dirs.yml
    - name: Write the backup manifest (the state the export keeps; not the seeded configuration, not tls/)
      ansible.builtin.copy:
        dest: "{{ nifi_dir }}/backup-manifest.json"
        content: "{{ {'app': 'nifi', 'paths': (nifi_state_files + nifi_restore_dirs) | map('regex_replace', '^', nifi_data_root ~ '/') | list | sort} | to_nice_json }}\n"
        owner: "{{ nifi_owner }}"
        group: "{{ nifi_group }}"
        mode: "0640"
  tags: [backup]
