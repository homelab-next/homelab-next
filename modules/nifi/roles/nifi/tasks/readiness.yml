# The service's dependencies are the container engine (docker_engine, applied to the guest before this
# module), its credentials in the secret store, and the object store, the catalog, the query engine and
# the bus it talks to (each must accept a connection).
- block:
    - name: The container engine is ready (docker_engine readiness)
      ansible.builtin.include_role:
        name: docker_engine
        tasks_from: readiness
    - name: Every credential resolves in its form
      ansible.builtin.include_tasks: credentials.yml
    - name: Resolve the addresses
      ansible.builtin.include_tasks: endpoint.yml
    - name: The object store answers (200, or 403 to an unsigned request)
      ansible.builtin.uri:
        url: "{{ nifi_s3_endpoint }}/"
        status_code: [200, 403]
        timeout: "{{ nifi_health_timeout | int }}"
      changed_when: false
    - name: The catalog answers its config
      ansible.builtin.uri:
        url: "{{ nifi_catalog_endpoint }}{{ nifi_catalog_path }}/v1/config?warehouse={{ nifi_warehouse | urlencode }}"
        status_code: 200
        timeout: "{{ nifi_health_timeout | int }}"
      changed_when: false
    # Events are on only when nifi_events_url names an HTTP forwarder; the bus row alone (a bus
    # that listens on its own host) is not something NiFi publishes to, so it is not waited for.
    - name: Events are off (no forwarder address), so the bus is not waited for
      ansible.builtin.debug:
        msg: "nifi: events are off (nifi_events_url is empty); the bus {{ nifi_events_endpoint }} is not checked"
      when: nifi_events_url == ''
    - name: The query engine accepts a connection, and the events forwarder when events are on
      ansible.builtin.wait_for:
        host: "{{ item | urlsplit('hostname') }}"
        port: "{{ item | urlsplit('port') }}"
        timeout: "{{ nifi_health_timeout | int }}"
      loop: "{{ [nifi_query_endpoint] + ([nifi_events_url] if nifi_events_url != '' else []) }}"
      changed_when: false
  tags: [readiness]
