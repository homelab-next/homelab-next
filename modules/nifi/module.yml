# SPDX-License-Identifier: Apache-2.0
# The dataflow provider on Apache NiFi (docs/modules.md; README.md beside this file): a single node
# run as one compose_app container, the lab's batch, feed, file and API ETL into the lake with
# provenance, a dead-letter path and completion events. It sits on the lake's guest next to the
# object store, the catalog and the query engine, and reaches them through the registry. HTTPS
# only on the published port, with a certificate from the lab's internal CA; the sign-in is its own
# (a single user) or the identity provider's (OpenID Connect). Flows are code: a Git flow registry
# client is configured when the site gives it a repository, and the credentials a flow uses are
# parameters supplied from secret references, never part of a flow definition. Every real value
# (the guest, its address, the names, the secret values) is the site's: the overlay's
# lab/modules.yml, lab/services.yml, group variables and secret store.
manifest_version: "1.0"
id: nifi
kind: provider
title: Dataflow on Apache NiFi
description: Fills the dataflow slot with Apache NiFi, a single-node dataflow engine run as one
  compose_app container with TLS from the lab CA, one sign-in (its own user, or OpenID Connect), the
  lake's endpoints and credentials supplied as parameters from secret references, an optional Git
  flow registry client, a smoke flow the health check reads, and an export and restore of the flow
  definitions, state and repositories.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: nifi
  display: Apache NiFi
  version: 2.12.0
licence:
  kind: open-source
  spdx: Apache-2.0
credentials:
  - secret: secret:nifi/tls-cert
    identity: certificate
    holder: provider
    purpose: the server certificate (PEM, with its chain) the lab's internal CA issued for the service's internal name
  - secret: secret:nifi/tls-key
    identity: private-key
    holder: provider
    purpose: the server certificate's private key (PEM), written readable by the container's user only
  - secret: secret:nifi/ca
    identity: certificate
    holder: provider
    purpose: the lab CA's certificate (the service's truststore, and what the role's hooks verify it with)
  - secret: secret:nifi/store-password
    identity: password
    holder: provider
    purpose: the password of the keystore and truststore the role builds from the certificate (16 to 128 characters; only the container reads it)
  - secret: secret:nifi/sensitive-props-key
    identity: shared-secret
    holder: provider
    purpose: the key that encrypts sensitive values inside the stored flow (12 or more characters); changing it after the first start makes the stored sensitive values unreadable
  - secret: secret:nifi/single-user-password
    identity: password
    holder: provider
    purpose: the password of the single sign-in user (12 to 128 characters); read only with the single-user sign-in, which is the default
  - secret: secret:nifi/oidc-client-secret
    identity: client-secret
    holder: provider
    purpose: the client secret of the identity provider's OpenID Connect client for this service; read only with the oidc sign-in
  - secret: secret:nifi/api-token
    identity: token
    holder: provider
    purpose: a bearer token the service accepts, for the role's own API calls; read only with the oidc sign-in (the single-user sign-in signs in with its password)
  - secret: secret:nifi/s3-access-key
    identity: key-id
    holder: provider
    purpose: the object store's lake key id, supplied to flows as a sensitive parameter (the same value as the object store's own access key, or a key limited to the lake's writers)
  - secret: secret:nifi/s3-secret-key
    identity: password
    holder: provider
    purpose: the object store's lake key secret, supplied to flows as a sensitive parameter
  - secret: secret:nifi/events-token
    identity: token
    holder: provider
    purpose: the publish credential of the events forwarder (the whole Authorization header value, scheme included), supplied to flows as a sensitive parameter
  - secret: secret:nifi/registry-token
    identity: token
    holder: provider
    purpose: the access token of the Git flow registry client's repository; read only when the site sets a registry repository
identifiers:
  - {kind: secret-name, name: nifi, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the certificate, the keys, the passwords and the parameter values are read by name at deploy time
    - cap: cap:object-store
      version: "1.0"
      purpose: the warehouse bucket the flows' table files are written to
    - cap: cap:lake-catalog
      version: "1.0"
      purpose: the catalog the flows commit their tables through
    - cap: cap:lake-query
      version: "1.0"
      purpose: the query engine the flows read the lake through (freshness and report flows)
    - cap: cap:events
      version: "1.0"
      purpose: the bus the flows publish their completion, failure and feed events to
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 2, memory_mb: 4096, disk_gb: 40}
      guest:
        baselines: [base]
      roles: [role:nifi]
      purpose: runs the service (docker_engine applied first, compose_app renders it); the lake's other providers are normally on the same guest
provides:
  slots:
    dataflow:
      adapter: homelabnext.conform.adapters.dataflow:make
      provisional: true
      reason: dataflow has no contract yet; the obvious standard is the service answering its version, its single-node cluster summary and its controller status, which is what the status hub's collector and the role's health hook read
      migration: {formats: [json], export: role:nifi, import: role:nifi}
# No internet egress is requested: the smoke flow and the module's own steps need none. A flow that
# pulls a public feed adds `egress: [{host: server, to: [internet], purpose: ...}]` in the same
# change as the overlay's `grants.egress.nifi.server: [internet]` (README, "Egress").
egress: none
contributes:
  roles:
    - file: roles/nifi
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:nifi, hook: readiness}
  docs:
    - file: README.md
data:
  - id: state
    kind: state
    description: The stored flow, users and policies, component state and the flowfile, content and database repositories (provenance when asked), archived with the service stopped, and every top-level process group's definition as portable JSON (sensitive values blank).
    export: {formats: [json], via: role:nifi}
    import: {formats: [json], via: role:nifi}
    retention: {keep: forever}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest): the role's upgrade hook validates and records it, the state is exported, then it converges (the configuration files are taken afresh from the new image, the stored flow is kept; NiFi migrates its own repositories on first start)"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
