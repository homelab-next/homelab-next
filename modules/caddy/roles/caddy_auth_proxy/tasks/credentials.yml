# SPDX-License-Identifier: Apache-2.0
# Both credentials resolve in the form oauth2-proxy accepts (a malformed cookie key stops it at
# start); only the verdicts leave the no_log task.
- name: Read each credential's form
  ansible.builtin.set_fact:
    caddy_auth_proxy_forms:
      client: "{{ lookup('hnx_secret', caddy_auth_proxy_client_ref) is match(caddy_auth_proxy_client_value_pattern) }}"
      cookie: "{{ lookup('hnx_secret', caddy_auth_proxy_cookie_ref) is match(caddy_auth_proxy_cookie_value_pattern) }}"
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - caddy_auth_proxy_forms.client | bool
      - caddy_auth_proxy_forms.cookie | bool
    fail_msg: >-
      caddy_auth_proxy: {{ caddy_auth_proxy_client_ref }} must be the IdP client's secret (16 to
      256 printable characters, no quote or space) and {{ caddy_auth_proxy_cookie_ref }} a cookie
      key of 16, 24 or 32 characters of [A-Za-z0-9_-], or 32 bytes in URL-safe base64
      (openssl rand -base64 32 | tr -- '+/' '-_'); forms: {{ caddy_auth_proxy_forms }}
  tags: [readiness]
