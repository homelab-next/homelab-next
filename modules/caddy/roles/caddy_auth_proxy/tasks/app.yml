# The compose_app inputs (shared by main and the hooks that delegate to compose_app): one
# container as its own user, every capability dropped, a read-only root filesystem, published on
# the guest's address only.
- name: Read the gateway of the proxy's own compose network (the one peer it sees)
  ansible.builtin.command:
    argv:
      - "{{ caddy_auth_proxy_docker_cli }}"
      - network
      - inspect
      - "{{ caddy_auth_proxy_network }}"
      - --format
      - "{{ '{{' }}(index .IPAM.Config 0).Gateway{{ '}}' }}"
  register: caddy_auth_proxy_gateway_read
  changed_when: false
  failed_when: false
  check_mode: false
  when: caddy_auth_proxy_trusted_proxy_ips == 'auto'
  tags: [health, backup, restore, export, upgrade]

# Empty while the network does not exist yet (main creates it before it starts anything). Anything
# that is not one IPv4 address is refused: the value goes into the proxy's trust list.
- name: The gateway is one IPv4 address, or not known yet
  ansible.builtin.assert:
    that:
      - caddy_auth_proxy_gateway_ip == '' or caddy_auth_proxy_gateway_ip is match(caddy_auth_proxy_ipv4_pattern)
      - caddy_auth_proxy_gateway_ip != '0.0.0.0'
    fail_msg: "caddy_auth_proxy: the network {{ caddy_auth_proxy_network }} has the gateway {{ caddy_auth_proxy_gateway_ip | to_json }}, not one IPv4 address"
  vars:
    caddy_auth_proxy_gateway_ip: "{{ (caddy_auth_proxy_gateway_read.stdout | default('') | trim) if (caddy_auth_proxy_gateway_read.rc | default(1)) == 0 else '' }}"
  when: caddy_auth_proxy_trusted_proxy_ips == 'auto'
  tags: [health, backup, restore, export, upgrade]

- name: The proxies the proxy trusts to set X-Forwarded-*
  ansible.builtin.set_fact:
    caddy_auth_proxy_trusted_resolved: >-
      {{ (([caddy_auth_proxy_gateway_known ~ '/32'] if caddy_auth_proxy_gateway_known != '' else caddy_auth_proxy_placeholder_trusted)
          if caddy_auth_proxy_trusted_proxy_ips == 'auto' else caddy_auth_proxy_trusted_proxy_ips) }}
    caddy_auth_proxy_trusted_pending: "{{ caddy_auth_proxy_trusted_proxy_ips == 'auto' and caddy_auth_proxy_gateway_known == '' }}"
  vars:
    caddy_auth_proxy_gateway_known: "{{ (caddy_auth_proxy_gateway_read.stdout | default('') | trim) if (caddy_auth_proxy_gateway_read.rc | default(1)) == 0 else '' }}"
  tags: [health, backup, restore, export, upgrade]

- name: Build the application spec
  ansible.builtin.set_fact:
    caddy_auth_proxy_app:
      compose_app_name: caddy-auth-proxy
      compose_app_dir: "{{ caddy_auth_proxy_dir }}"
      compose_app_data_dir: "{{ caddy_auth_proxy_dir }}/data"
      compose_app_export_dir: "{{ caddy_auth_proxy_dir }}/export"
      compose_app_owner: "{{ caddy_auth_proxy_owner }}"
      compose_app_group: "{{ caddy_auth_proxy_owner }}"
      compose_app_start: "{{ caddy_auth_proxy_start }}"
      compose_app_validate_with_docker: "{{ caddy_auth_proxy_validate_with_docker }}"
      compose_app_spec:
        services:
          auth-proxy:
            image: "{{ caddy_auth_proxy_image_parts.repository }}"  # caddy-lint: allow the auth proxy (oauth2-proxy), not Caddy
            tag: "{{ caddy_auth_proxy_image_parts.tag }}"
            digest: "{{ caddy_auth_proxy_image_parts.digest }}"
            user: "{{ caddy_auth_proxy_uid | int }}:{{ caddy_auth_proxy_gid | int }}"
            read_only: true
            environment: >-
              {{ caddy_auth_proxy_fixed_env | combine({
                   'OAUTH2_PROXY_OIDC_ISSUER_URL': caddy_auth_proxy_issuer_url,
                   'OAUTH2_PROXY_CLIENT_ID': caddy_auth_proxy_client_id,
                   'OAUTH2_PROXY_TRUSTED_PROXY_IPS': caddy_auth_proxy_trusted_resolved | join(','),
                   'OAUTH2_PROXY_WHITELIST_DOMAINS': caddy_auth_proxy_sites | join(','),
                   'OAUTH2_PROXY_COOKIE_EXPIRE': caddy_auth_proxy_cookie_expire}) }}
            ports: ["{{ caddy_auth_proxy_bind }}:{{ caddy_auth_proxy_port | int }}:{{ caddy_auth_proxy_container_port }}"]
            mem_limit: "{{ caddy_auth_proxy_mem_limit }}"
            healthcheck:
              test: [CMD, wget, -q, -T, "5", -O, /dev/null, "http://127.0.0.1:{{ caddy_auth_proxy_container_port }}/ping"]  # no-raw-endpoint: allow the container probes itself
              interval: 30s
              timeout: 5s
              retries: 5
              start_period: 20s
  tags: [health, backup, restore, export, upgrade]
