# SPDX-License-Identifier: Apache-2.0
# Healthy means: the container runs and is healthy, /ping answers, the check refuses a request
# with no session (401: the edge turns it into the sign-in redirect), and signing in for each site
# starts the authorization code flow at the configured issuer (a 302 to its authorization endpoint
# for this client, with PKCE S256 and the site's own callback), which proves the proxy read the
# IdP's discovery document. The sign-in is asked THROUGH THE EDGE (https://<site>/oauth2/start, on
# the edge's own address, TLS verified by the site's name), as a user gets it: the proxy trusts
# X-Forwarded-* only from the gateway of its own network (--trusted-proxy-ip), so a request sent
# straight to its port cannot say which site it is for and would name the bind address in the
# redirect_uri. Only the sites the deployed configuration fronts with forward auth are asked: the issuer's
# own site (and any other unprotected one) is not behind the proxy and answers its own way. Read-only.
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Every container of the spec is running and healthy
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: health
      vars:
        compose_app_name: caddy-auth-proxy
        compose_app_dir: "{{ caddy_auth_proxy_app.compose_app_dir }}"
        compose_app_spec: "{{ caddy_auth_proxy_app.compose_app_spec }}"
    - name: The published port is bound to the guest's address only
      ansible.builtin.command:
        argv: ["{{ caddy_auth_proxy_docker_cli }}", compose, -f, "{{ caddy_auth_proxy_app.compose_app_dir }}/docker-compose.yml", port, auth-proxy, "{{ caddy_auth_proxy_container_port }}"]
      register: caddy_auth_proxy_published
      changed_when: false
      check_mode: false
      failed_when: >-
        caddy_auth_proxy_published.rc != 0 or
        (caddy_auth_proxy_published.stdout_lines | default([])) | length == 0 or
        (caddy_auth_proxy_published.stdout_lines | default([])) | reject('equalto', caddy_auth_proxy_bind ~ ':' ~ (caddy_auth_proxy_port | int)) | list | length > 0
    - name: The proxy answers /ping
      ansible.builtin.uri:
        url: "http://{{ caddy_auth_proxy_bind }}:{{ caddy_auth_proxy_port | int }}/ping"
        status_code: 200
        timeout: "{{ caddy_auth_proxy_health_timeout | int }}"
      changed_when: false
    - name: The check refuses a request with no session
      ansible.builtin.uri:
        url: "http://{{ caddy_auth_proxy_bind }}:{{ caddy_auth_proxy_port | int }}/oauth2/auth"
        status_code: 401
        timeout: "{{ caddy_auth_proxy_health_timeout | int }}"
      changed_when: false
    - name: Read the deployed sites (which of them forward auth fronts)
      ansible.builtin.slurp:
        src: "{{ caddy_auth_proxy_sites_file }}"
      register: caddy_auth_proxy_sites_deployed
    - name: Sign in for each forward-auth site through the edge, as a user does
      ansible.builtin.command:
        argv:
          - python3
          - -I
          - -c
          - "{{ caddy_auth_proxy_probe_script }}"
          - >-
            {{ {'address': caddy_auth_proxy_edge_address, 'port': caddy_auth_proxy_edge_port | int,
                'bundle': caddy_auth_proxy_edge_trust_bundle, 'names': caddy_auth_proxy_sites,
                'sites': caddy_auth_proxy_sites_deployed.content | b64decode,
                'timeout': caddy_auth_proxy_health_timeout | int} | to_json }}
      register: caddy_auth_proxy_probe
      changed_when: false
      check_mode: false
    - name: Read the probe's findings
      ansible.builtin.set_fact:
        caddy_auth_proxy_found: "{{ caddy_auth_proxy_probe.stdout | from_json }}"
    - name: Every forward-auth site's sign-in answers 302 over TLS that verifies by the site's name
      ansible.builtin.assert:
        that:
          - caddy_auth_proxy_found | length > 0
          - caddy_auth_proxy_found.values() | map(attribute='status') | unique | list == [302]
        fail_msg: "caddy_auth_proxy: signing in through the edge at {{ caddy_auth_proxy_edge_address }}:{{ caddy_auth_proxy_edge_port }} failed: {{ caddy_auth_proxy_found }}"
    - name: The sign-in goes to the issuer's authorization endpoint for this client with PKCE
      ansible.builtin.assert:
        that:
          - item.value.location is match('^' ~ (caddy_auth_proxy_issuer_url | regex_escape) ~ '/protocol/openid-connect/auth\?')
          - item.value.location is search('[?&]client_id=' ~ (caddy_auth_proxy_client_id | regex_escape) ~ '(&|$)')
          - item.value.location is search('[?&]code_challenge_method=S256(&|$)')
          - item.value.location is search('[?&]redirect_uri=https%3A%2F%2F' ~ (item.key | regex_escape) ~ '%2Foauth2%2Fcallback(&|$)')
        fail_msg: "caddy_auth_proxy: signing in for {{ item.key }} goes to {{ item.value.location | default('nowhere') }}"
      loop: "{{ caddy_auth_proxy_found | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
  tags: [health]
