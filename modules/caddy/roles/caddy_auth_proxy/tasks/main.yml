- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Build the application spec
  ansible.builtin.include_tasks: app.yml

- name: Refuse a malformed client secret or cookie key before the proxy sees it
  ansible.builtin.include_tasks: credentials.yml

# Only the env_file (0600) holds the IdP client's secret and the cookie key.
- name: Read the IdP client's secret and the cookie key
  ansible.builtin.set_fact:
    caddy_auth_proxy_secret_env:
      auth-proxy:
        OAUTH2_PROXY_CLIENT_SECRET: "{{ lookup('hnx_secret', caddy_auth_proxy_client_ref) }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ lookup('hnx_secret', caddy_auth_proxy_cookie_ref) }}"
  no_log: true

- name: Render and start the auth proxy
  ansible.builtin.include_role:
    name: compose_app
  vars:
    compose_app_name: "{{ caddy_auth_proxy_app.compose_app_name }}"
    compose_app_dir: "{{ caddy_auth_proxy_app.compose_app_dir }}"
    compose_app_data_dir: "{{ caddy_auth_proxy_app.compose_app_data_dir }}"
    compose_app_export_dir: "{{ caddy_auth_proxy_app.compose_app_export_dir }}"
    compose_app_owner: "{{ caddy_auth_proxy_app.compose_app_owner }}"
    compose_app_group: "{{ caddy_auth_proxy_app.compose_app_group }}"
    compose_app_start: "{{ caddy_auth_proxy_app.compose_app_start }}"
    compose_app_validate_with_docker: "{{ caddy_auth_proxy_app.compose_app_validate_with_docker }}"
    compose_app_spec: "{{ caddy_auth_proxy_app.compose_app_spec }}"
    compose_app_secret_env: "{{ caddy_auth_proxy_secret_env }}"
  no_log: true
