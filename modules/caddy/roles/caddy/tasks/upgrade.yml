# SPDX-License-Identifier: Apache-2.0
- block:
    - name: Refuse a target that is not pinned by tag and digest, or is another repository
      ansible.builtin.assert:
        that:
          - caddy_target_image is match(caddy_pinned_ref_pattern)
          - caddy_target_image.split('@')[0].rsplit(':', 1)[0] == caddy_image_parts.repository
        fail_msg: "caddy: the target must be {{ caddy_image_parts.repository }}:<tag>@sha256:<64 hex>"
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Validate and record the bump (compose_app upgrade)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: upgrade
      vars:
        compose_app_name: caddy
        compose_app_dir: "{{ caddy_app.compose_app_dir }}"
        compose_app_owner: "{{ caddy_app.compose_app_owner }}"
        compose_app_group: "{{ caddy_app.compose_app_group }}"
        compose_app_spec: "{{ caddy_app.compose_app_spec }}"
        compose_app_upgrade_service: caddy
        compose_app_upgrade_tag: "{{ caddy_target_image.split('@')[0].rsplit(':', 1)[1] }}"
        compose_app_upgrade_digest: "{{ caddy_target_image.split('@')[1] }}"
  tags: [upgrade]
