# SPDX-License-Identifier: Apache-2.0
# Every credential the edge reads resolves in its form: the DNS provider's token (one printable
# word: it goes into an environment file), each front door's shared secret (16 characters or more,
# no quote or line break: it goes into an env_file) and each upstream TLS file the sites name (a
# PEM private key for a file of mode 0600, else PEM certificates and no key). Only the verdicts
# leave the no_log task.
- name: Read each credential's form
  ansible.builtin.set_fact:
    caddy_forms: >-
      {%- set out = {caddy_acme_dns_ref: lookup('hnx_secret', caddy_acme_dns_ref) is match(caddy_dns_value_pattern)} -%}
      {%- for ref in caddy_front_door_refs -%}
      {%-   set _ = out.update({ref: lookup('hnx_secret', ref) is match(caddy_front_door_value_pattern)}) -%}
      {%- endfor -%}
      {%- for f in caddy_edge_tls_files -%}
      {%-   set v = lookup('hnx_secret', f.secret) -%}
      {%-   if f.mode == '0600' -%}
      {%-     set _ = out.update({f.secret: v is search(caddy_pem_key_pattern)}) -%}
      {%-   else -%}
      {%-     set _ = out.update({f.secret: v is search(caddy_pem_cert_pattern) and v is not search('PRIVATE KEY')}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that: caddy_forms | dict2items | rejectattr('value') | list | length == 0
    fail_msg: >-
      caddy: {{ caddy_forms | dict2items | rejectattr('value') | map(attribute='key') | join(', ') }}
      not in its form: the DNS token one word of [A-Za-z0-9._~+/=-], a front door's secret 16
      characters or more without a quote or a line break, a client key a PEM private key, a
      certificate or CA PEM certificates without a key
  tags: [readiness]
