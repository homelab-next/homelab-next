# SPDX-License-Identifier: Apache-2.0
# The reader's engine password, by name: one 0600 file owned by the service account (the server reads
# it at every request and refuses it when group or others may read it). The value is read from the
# secret store here and never appears in the repository, the settings or a task's output.
- name: The reader's password
  ansible.builtin.copy:
    dest: "{{ lake_mcp_cred_dir }}/reader-password"
    content: "{{ lookup('hnx_secret', lake_mcp_reader_cred) }}\n"
    owner: "{{ lake_mcp_user }}"
    group: "{{ lake_mcp_group }}"
    mode: "0600"
  no_log: true

- name: The CA that verifies the endpoint (public)
  ansible.builtin.copy:
    dest: "{{ lake_mcp_ca_file }}"
    content: "{{ lookup('hnx_secret', lake_mcp_ca_ref) | trim }}\n"
    owner: "{{ lake_mcp_root_owner }}"
    group: "{{ lake_mcp_group }}"
    mode: "0644"
  when: lake_mcp_ca_ref != ''
