# The server is code in the runtime release, so there is no version of its own to bump: this hook
# proves the installed release answers the server command and records which release it is.
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: The installed release
      ansible.builtin.command:
        argv: ["{{ lake_mcp_hnx_bin }}", --version]
      register: lake_mcp_release
      changed_when: false
      check_mode: false
    - name: The release answers the server command
      ansible.builtin.command:
        argv: ["{{ lake_mcp_hnx_bin }}", lake, mcp, --help]
      changed_when: false
      check_mode: false
    - name: Record the release
      ansible.builtin.copy:
        dest: "{{ lake_mcp_config_dir }}/release.json"
        content: "{{ {'runtime': lake_mcp_release.stdout | trim} | to_nice_json }}\n"
        owner: "{{ lake_mcp_root_owner }}"
        group: "{{ lake_mcp_group }}"
        mode: "0644"
  tags: [upgrade]
