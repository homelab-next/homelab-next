lake_mcp_cred_dir: "{{ lake_mcp_config_dir }}/credentials"
lake_mcp_config_file: "{{ lake_mcp_config_dir }}/lake-mcp.yml"
lake_mcp_ca_file: "{{ lake_mcp_config_dir }}/lake-ca.pem"
lake_mcp_ssh_dir: "{{ lake_mcp_home }}/.ssh"
lake_mcp_command: "{{ lake_mcp_hnx_bin }} lake mcp --config {{ lake_mcp_config_file }}"
lake_mcp_name_pattern: '^[a-z_][a-z0-9_-]{0,31}\Z'
lake_mcp_ident_pattern: '^[a-z_][a-z0-9_]{0,127}\Z'
lake_mcp_engine_user_pattern: '^[A-Za-z0-9._-]{1,64}(:[A-Za-z0-9._-]{1,64})?\Z'
lake_mcp_path_pattern: '^(/(?!\.{1,2}(/|\Z))[A-Za-z0-9._-]+)+\Z'
lake_mcp_ref_pattern: '^secret:[a-z0-9][a-z0-9-]*(/[a-z0-9][a-z0-9-]*)+\Z'
# a bare public key: type, base64 body, an optional comment; never an options prefix (the role writes the options)
lake_mcp_key_pattern: '^(ssh-ed25519|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\.com) [A-Za-z0-9+/]+={0,2}( [A-Za-z0-9@._:+-]{1,64})?\Z'
lake_mcp_from_pattern: '^[0-9a-f.:]+(/[0-9]{1,3})?\Z'
lake_mcp_key_options: >-
  restrict,command="{{ lake_mcp_command }}"{{ (',from="' ~ (lake_mcp_ssh_from | join(',')) ~ '"') if lake_mcp_ssh_from | length > 0 else '' }}
lake_mcp_settings:
  endpoint: "{{ lake_mcp_endpoint if lake_mcp_endpoint != '' else lookup('hnx_registry', lake_mcp_lake_query_id, field='url') }}"
  user: "{{ lake_mcp_lake_user }}"
  catalog: "{{ lake_mcp_catalog }}"
  schemas: "{{ lake_mcp_schemas }}"
  credential_file: "{{ lake_mcp_cred_dir }}/reader-password"
  max_rows: "{{ lake_mcp_max_rows | int }}"
  timeout_s: "{{ lake_mcp_timeout_s | int }}"
