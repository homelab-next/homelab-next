# The registry row (platform/service) this provider contributes. It is keyed by the slot and
# renamed to the instance the site selects; version is product.version (never repeated here), and
# host is the module's host role. A passive monitor listens on nothing, so its health is the
# host's SSH; capture health is the role's health hook. A site that also selects the other
# network-sensor provider names each instance differently.
services:
  network-sensor:
    capability: network-sensor
    impl: zeek
    host: sensor
    protocol: ssh
    port: 22
    health: {kind: tcp}
    owner: operator
    tls: none
    tags: [network-sensor]
    description: Zeek on a capture host; it listens on nothing. Its health is the host's SSH; the capture itself is proved by the role's health hook (running, drops under a bound, stats heartbeat).
