- block:
    - name: Refuse a target that is not pinned by tag and digest, or is another repository
      ansible.builtin.assert:
        that:
          - zeek_target_image is match(zeek_pinned_ref_pattern)
          - zeek_target_image.split('@')[0].rsplit(':', 1)[0] == zeek_base_image.split('@')[0].rsplit(':', 1)[0]
        fail_msg: "zeek: the target must be {{ zeek_base_image.split('@')[0].rsplit(':', 1)[0] }}:<tag>@sha256:<64 hex>"
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
  tags: [upgrade]
