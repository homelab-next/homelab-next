      trino_last_run_dir:
        type: path
        description: The shared last-run record directory (role last_run).
        default: /var/lib/homelabnext/last-run
      trino_last_run_group:
        type: str
        description: The group that may read the last-run records.
        default: root
      trino_maintenance_max_age_hours:
        type: int
        description: Health fails when the maintenance last finished longer ago than this many hours.
        default: 50
  export:
    short_description: 'Nothing to export: the engine is stateless.'
    options:
      trino_image:
        type: str
        description: repository:tag@sha256:<digest> of the engine image.
        default: docker.io/trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
      trino_bind:
        type: str
        description: The guest's own IPv4 address the HTTPS port is published on (never all interfaces).
        default: '{{ ansible_host }}'
      trino_port:
        type: int
        description: Host port of the HTTPS listener (the registry row's port).
        default: 8443
      trino_dir:
        type: path
        description: The compose project directory (etc/ holds the configuration mounted in the container).
        default: /opt/compose/trino
      trino_data_root:
        type: path
        description: 'The data root on the host: node/ (the engine scratch directory).'
        default: /var/lib/hnx-modules/trino
      trino_owner:
        type: str
        description: Owner of the compose project and the data root.
        default: root
      trino_group:
        type: str
        description: 'Group of the project and of the files the container reads: the container''s gid.'
        default: '{{ trino_gid }}'
      trino_uid:
        type: int
        description: The container's user id (no account on the host has it).
        default: 61003
      trino_gid:
        type: int
        description: The container's group id.
        default: 61003
      trino_catalog_name:
        type: str
        description: The catalog name clients use; fixed to iceberg.
        default: iceberg
      trino_warehouse:
        type: str
        description: 'The warehouse the catalog client names: s3://<bucket>/ (the reference catalog) or a warehouse name (a catalog with named warehouses).'
        default: s3://iceberg-warehouse/
      trino_catalog_path:
        type: str
        description: 'The path the catalog serves its API under, appended to its address (empty for the reference catalog, /catalog for a catalog that serves it there).'
        default: ''
      trino_region:
        type: str
        description: The S3 region the engine signs with.
        default: garage
      trino_catalog_id:
        type: str
        description: The lake-catalog row's registry id; its url is resolved from the registry.
        default: lake-catalog
      trino_catalog_url:
        type: str
        description: 'scheme://host:port of the catalog, overriding the registry (empty: resolve it).'
        default: ''
      trino_object_store_id:
        type: str
        description: The object-store row's registry id; its url is resolved from the registry.
        default: object-store
      trino_s3_url:
        type: str
        description: 'scheme://host:port of the object store, overriding the registry (empty: resolve
          it).'
        default: ''
      trino_access_key_ref:
        type: str
        description: 'secret: reference of the lake key''s id.'
        default: secret:trino/s3-access-key
      trino_signing_ref:
        type: str
        description: 'secret: reference of the lake key''s secret.'
        default: secret:trino/s3-secret-key
      trino_tls_cert_ref:
        type: str
        description: 'secret: reference of the server certificate (PEM, with its chain).'
        default: secret:trino/tls-cert
      trino_tls_key_ref:
        type: str
        description: 'secret: reference of the server certificate''s private key (PEM).'
        default: secret:trino/tls-key
      trino_ca_ref:
        type: str
        description: 'secret: reference of the lab CA''s certificate (PEM).'
        default: secret:trino/ca
      trino_users_ref:
        type: str
        description: 'secret: reference of the password file (user:bcrypt lines).'
        default: secret:trino/password-db
      trino_shared_ref:
        type: str
        description: 'secret: reference of the engine''s internal-communication shared secret.'
        default: secret:trino/internal-secret
      trino_heap:
        type: str
        description: JVM heap, like 14G.
        default: 14G
      trino_query_max_memory:
        type: str
        description: Per-query and per-node memory bound, like 9GB (at most 70 percent of the heap).
        default: 9GB
      trino_mem_limit:
        type: str
        description: The container's memory limit, like 20g (at least 2 GB over the heap).
        default: 20g
      trino_expire_min_retention:
        type: str
        description: The engine's floor for expire_snapshots, in whole days (iceberg.expire-snapshots.min-retention).
        default: 7d
      trino_orphan_min_retention:
        type: str
        description: The engine's floor for remove_orphan_files, in whole days (iceberg.remove-orphan-files.min-retention).
        default: 3d
      trino_access_rules_src:
        type: str
        description: 'Controller path of a file-based access-control rules file to install (empty: none).'
