      trino_maintenance_script:
        type: str
        description: Where the maintenance script is installed.
        default: /usr/local/libexec/homelabnext/hnx-lake-maintenance
      trino_maintenance_state_dir:
        type: path
        description: The maintenance run's state directory (owner-only).
