        description: The maintenance run's state directory (owner-only).
        default: /var/lib/hnx-modules/trino-maintenance
      trino_maintenance_env_file:
        type: str
        description: The owner-only env file the service loads (the maintenance password and the notify
          token).
        default: /etc/hnx-modules/trino/maintenance.env
      trino_unit_dir:
        type: path
        description: Where the systemd units are written.
        default: /etc/systemd/system
      trino_systemctl_cli:
        type: str
        description: The systemctl command.
        default: systemctl
      trino_access_unrestricted:
        type: bool
        description: 'Run with no access-rules file: every signed-in user may alter and drop tables. Without
          it an empty trino_access_rules_src is refused.'
        default: false
      trino_reader_catalog:
        type: str
        description: 'Name of a second, read-only catalog over the same lake (empty: none); not iceberg.'
        default: ''
