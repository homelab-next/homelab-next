# SPDX-License-Identifier: Apache-2.0
# Every credential resolves (the timer's two only when the timer is installed), and each has the form the engine needs: a certificate and a key in PEM,
# a password file of bcrypt lines that holds the maintenance user, a key pair in the object store's
# form. Only the verdicts leave the no_log task.
- name: Read each credential's form
  ansible.builtin.set_fact:
    trino_forms:
      key_id: "{{ lookup('hnx_secret', trino_access_key_ref) is match(trino_key_id_pattern) }}"
      key_value: "{{ lookup('hnx_secret', trino_signing_ref) is match(trino_hex64_pattern) }}"
      cert: "{{ lookup('hnx_secret', trino_tls_cert_ref) is search(trino_pem_cert_pattern) }}"
      key: "{{ lookup('hnx_secret', trino_tls_key_ref) is search(trino_pem_key_pattern) }}"
      ca: "{{ lookup('hnx_secret', trino_ca_ref) is search(trino_pem_cert_pattern) }}"
      db_lines: "{{ lookup('hnx_secret', trino_users_ref).splitlines() | map('trim') | reject('equalto', '') | reject('match', trino_user_line_pattern) | list | length == 0 }}"
      db_user: "{{ not (trino_maintenance_enabled | bool) or (lookup('hnx_secret', trino_users_ref).splitlines() | map('trim') | select('match', '^' ~ (trino_maintenance_user | regex_escape) ~ ':') | list | length) == 1 }}"
      shared: "{{ lookup('hnx_secret', trino_shared_ref) | length >= 32 and lookup('hnx_secret', trino_shared_ref) is match('^[A-Za-z0-9+/=_-]+\\Z') }}"
      maintenance: "{{ not (trino_maintenance_enabled | bool) or lookup('hnx_secret', trino_maintenance_ref) is match('^[A-Za-z0-9._~+=/-]{16,128}\\Z') }}"
      notify: "{{ not (trino_maintenance_enabled | bool) or lookup('hnx_secret', trino_notify_ref) is match('^[A-Za-z0-9._~+=/-]{8,128}\\Z') }}"
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - trino_forms.key_id | bool
      - trino_forms.key_value | bool
      - trino_forms.cert | bool
      - trino_forms.key | bool
      - trino_forms.ca | bool
      - trino_forms.db_lines | bool
      - trino_forms.db_user | bool
      - trino_forms.shared | bool
      - trino_forms.maintenance | bool
      - trino_forms.notify | bool
    fail_msg: >-
      trino: {{ trino_access_key_ref }} must be GK and 24 to 32 hex digits and {{ trino_signing_ref }}
      64 hex digits; {{ trino_tls_cert_ref }}, {{ trino_tls_key_ref }} and {{ trino_ca_ref }} PEM;
      {{ trino_users_ref }} one user:bcrypt line per reader (cost 10 or more) with exactly one
      line for {{ trino_maintenance_user }}; {{ trino_shared_ref }} 32 or more characters of
      A-Z a-z 0-9 + / = _ -; {{ trino_maintenance_ref }} 16 to 128 characters and
      {{ trino_notify_ref }} 8 to 128 characters of A-Z a-z 0-9 . _ ~ + = / -; forms: {{ trino_forms }}
  tags: [readiness]
