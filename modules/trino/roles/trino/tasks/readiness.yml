# The engine's dependencies are the container engine (docker_engine, applied to the guest before this
# module), its credentials in the secret store, and the catalog and object store it talks to.
- block:
    - name: The container engine is ready (docker_engine readiness)
      ansible.builtin.include_role:
        name: docker_engine
        tasks_from: readiness
    - name: Every credential resolves in its form
      ansible.builtin.include_tasks: credentials.yml
    - name: Resolve the addresses
      ansible.builtin.include_tasks: endpoint.yml
    - name: The catalog answers its config
      ansible.builtin.uri:
        url: "{{ trino_catalog_endpoint }}/v1/config"
        status_code: 200
        timeout: "{{ trino_health_timeout | int }}"
      changed_when: false
    - name: The object store answers (200, or 403 to an unsigned request)
      ansible.builtin.uri:
        url: "{{ trino_s3_endpoint }}/"
        status_code: [200, 403]
        timeout: "{{ trino_health_timeout | int }}"
      changed_when: false
  tags: [readiness]
