# SPDX-License-Identifier: Apache-2.0
# Healthy means: the container runs and is healthy, the engine answers over HTTPS (verified against
# the lab CA) and has finished starting, an anonymous statement is refused, the maintenance user
# signs in, and the maintenance timer is enabled and active with its last run clean. Nothing is
# written to the lake.
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Every container of the spec is running and healthy
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: health
      vars:
        compose_app_name: trino
        compose_app_dir: "{{ trino_app.compose_app_dir }}"
        compose_app_spec: "{{ trino_app.compose_app_spec }}"
    - name: The engine answers over HTTPS and has finished starting
      ansible.builtin.uri:
        url: "{{ trino_self_endpoint }}/v1/info"
        ca_path: "{{ trino_dir }}/etc/tls/ca.pem"
        status_code: 200
        return_content: true
        timeout: "{{ trino_health_timeout | int }}"
      register: trino_info
      changed_when: false
      failed_when: trino_info.status != 200 or (trino_info.json.starting | default(true))
    - name: An anonymous statement is refused
      ansible.builtin.uri:
        url: "{{ trino_self_endpoint }}/v1/statement"
        method: POST
        body: "SELECT 1"
        headers:
          X-Trino-User: anonymous
        ca_path: "{{ trino_dir }}/etc/tls/ca.pem"
        status_code: [401, 403]
        timeout: "{{ trino_health_timeout | int }}"
      changed_when: false
    - name: The maintenance user signs in and a statement is accepted
      ansible.builtin.uri:
        url: "{{ trino_self_endpoint }}/v1/statement"
        method: POST
        body: "SELECT 1"
        headers:
          X-Trino-User: "{{ trino_maintenance_user }}"
        url_username: "{{ trino_maintenance_user }}"
        url_password: "{{ lookup('hnx_secret', trino_maintenance_ref) }}"
        force_basic_auth: true
        ca_path: "{{ trino_dir }}/etc/tls/ca.pem"
        status_code: 200
        return_content: true
        timeout: "{{ trino_health_timeout | int }}"
      register: trino_signin
      changed_when: false
      no_log: true
      when: trino_maintenance_enabled | bool
    - name: The maintenance timer is enabled
      ansible.builtin.command:
        argv: ["{{ trino_systemctl_cli }}", is-enabled, hnx-lake-maintenance.timer]
      changed_when: false
      when: trino_maintenance_armed | bool
    - name: The maintenance timer is active
      ansible.builtin.command:
        argv: ["{{ trino_systemctl_cli }}", is-active, hnx-lake-maintenance.timer]
      changed_when: false
      when: trino_maintenance_armed | bool
    - name: Read the maintenance timer's last-run record (the unit ignores a writer failure, so health looks)
      ansible.builtin.slurp:
        src: "{{ trino_last_run_dir }}/timer%3Atrino%2Flake-maintenance.json"
      register: trino_last_run
      failed_when: false
      when: trino_maintenance_armed | bool
    - name: Read the timer unit's age (a timer installed lately has not been due yet)
      ansible.builtin.stat:
        path: "{{ trino_unit_dir }}/hnx-lake-maintenance.timer"
      register: trino_timer_unit
      when: trino_maintenance_armed | bool
    - name: Read the time now, on the host
      ansible.builtin.command:
        argv: [date, -u, +%s]
      register: trino_now
      changed_when: false
      check_mode: false
      when: trino_maintenance_armed | bool
    - name: Name when the maintenance last finished
      ansible.builtin.set_fact:
        trino_ended: "{{ (trino_last_run.content | default('e30=') | b64decode | from_json).finished_at | default('') }}"
      when: trino_maintenance_armed | bool
    - name: Read that time on the host
      ansible.builtin.command:
        argv: "{{ ['date', '-u', '-d', trino_ended, '+%s'] if trino_ended is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z\\Z') else ['echo', '0'] }}"
      register: trino_ended_at
      changed_when: false
      check_mode: false
      when: trino_maintenance_armed | bool
    - name: The maintenance ran lately (or the timer is too new to have been due)
      ansible.builtin.assert:
        that:
          - >-
            (trino_now.stdout | int) - (trino_ended_at.stdout | int) < (trino_maintenance_max_age_hours | int) * 3600
            or (trino_ended == '' and (trino_now.stdout | int) - (trino_timer_unit.stat.mtime | default(0) | int) < (trino_maintenance_max_age_hours | int) * 3600)
        fail_msg: >-
          trino: the lake maintenance has no fresh last-run record in {{ trino_last_run_dir }}
          (last finished {{ trino_ended or 'never' }}): its timer is not running, or its unit cannot
          write the record (ReadWritePaths); snapshots and orphan files are not being cleaned
      when: trino_maintenance_armed | bool
    - name: The timer is not armed (not acknowledged) and so must not be running
      ansible.builtin.command:
        argv: ["{{ trino_systemctl_cli }}", is-active, hnx-lake-maintenance.timer]
      register: trino_unarmed_active
      changed_when: false
      failed_when: trino_unarmed_active.stdout | default('') | trim == 'active'
      when: trino_maintenance_enabled | bool and not (trino_maintenance_armed | bool)
    - name: Read the last maintenance run's state
      ansible.builtin.slurp:
        src: "{{ trino_maintenance_state_dir }}/state.json"
      register: trino_maintenance_state
      failed_when: false
      when: trino_maintenance_enabled | bool
    - name: The last maintenance run, if there was one, had no failing step
      ansible.builtin.assert:
        that:
          - (trino_maintenance_state.content | b64decode | from_json).failed | default({}) | length == 0
        fail_msg: >-
          trino: the last maintenance run ({{ (trino_maintenance_state.content | b64decode | from_json).time }})
          had failing steps: {{ (trino_maintenance_state.content | b64decode | from_json).failed.keys() | list }}
      when: trino_maintenance_enabled | bool and trino_maintenance_state.content is defined
  tags: [health]
