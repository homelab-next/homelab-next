# SPDX-License-Identifier: Apache-2.0
# Conformance target (docs/conformance.md, Targets) for this provider: the lake-query suite through
# the shared lake adapter, which resolves both endpoints from HNX_ENDPOINT_LAKE_QUERY and
# HNX_ENDPOINT_LAKE_CATALOG (never a URL here), signs the conformance reader in to the engine with
# the password delivered in HNX_SECRET_LAKE_QUERY_READERS_HNX_CONFORM (a non-loopback engine is
# refused without a credential) and works in its own scratch namespace (hnx_conform_<run>). The
# reader's login must be in the engine's password file and permitted by its access rules.
#   HNX_ENDPOINT_LAKE_QUERY=https://<host>:8443 HNX_ENDPOINT_LAKE_CATALOG=http://<host>:8181 \
#   LAB_WAREHOUSE=s3://iceberg-warehouse/ HNX_SECRET_LAKE_QUERY_READERS_HNX_CONFORM=<password> \
#     hnx conform run lake-query --target modules/trino/conformance/target.yml
# The catalog serves its API at the root with no warehouse prefix (api_root empty,
# catalog_prefix_optional). A lab whose CA is private runs it with ca_file set to the CA's path, and
# reaches the catalog over plain http inside its own network with allow_plaintext: true, in a copy
# of this file, with the lab's own domain in place of example.internal (the endpoint overrides
# above name the endpoints; the adapter needs a domain or a resolver, and has no default).
name: trino
capabilities:
  lake-query:
    adapter: homelabnext.conform.adapters.lake:make_lake
    config:
      domain: example.internal
      namespace: auto
      trino_catalog: iceberg
      api_root: ""
      catalog_prefix_optional: true
      credential: secret:lake-query/readers/hnx-conform
