# SPDX-License-Identifier: Apache-2.0
# The lake-query provider on Trino (docs/modules.md; README.md beside this file): a single-node
# query engine (coordinator and worker in one JVM) with one Iceberg catalog named `iceberg`, over the
# lake-catalog and object-store slots. HTTPS only on the published port, password sign-in for every
# reader. The role also installs the lake's maintenance timer (snapshot expiry and orphan-file
# removal per table, a state-diffed alert on failure). Every real value (the guest, its address,
# the names, the secret values) is the site's: the overlay's lab/modules.yml, lab/services.yml,
# group variables and secret store.
manifest_version: "1.0"
id: trino
kind: provider
title: Lake query on Trino
description: Fills the lake-query slot with Trino, a single-node SQL engine run as one compose_app
  container with TLS and password sign-in, its Iceberg catalog `iceberg` over the lake-catalog and
  object-store slots, and the lake's maintenance timer; proved by the lake-query conformance suite
  through the shared lake adapter.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: trino
  version: "484.0"
licence:
  kind: open-source
  spdx: Apache-2.0
credentials:
  - secret: secret:trino/s3-access-key
    identity: key-id
    holder: provider
    purpose: the object store's lake key id; the engine reads and writes table files with it (the same value as the object store's own access key)
  - secret: secret:trino/s3-secret-key
    identity: password
    holder: provider
    purpose: the object store's lake key secret (the same value as the object store's own secret key)
  - secret: secret:trino/tls-cert
    identity: certificate
    holder: provider
    purpose: the server certificate (PEM, with its chain) the lab's internal CA issued for the engine's internal name
  - secret: secret:trino/tls-key
    identity: private-key
    holder: provider
    purpose: the server certificate's private key (PEM), written readable by the engine's container user only
  - secret: secret:trino/ca
    identity: certificate
    holder: provider
    purpose: the lab CA's certificate the role's hooks and the maintenance timer verify the engine with
  - secret: secret:trino/password-db
    identity: password-file
    holder: provider
    purpose: the engine's password file (one user:bcrypt line per reader, cost 10 or more, including the maintenance user); the engine reloads it every few seconds
  - secret: secret:trino/internal-secret
    identity: shared-secret
    holder: provider
    purpose: the engine's internal-communication shared secret (required once sign-in is on)
  - secret: secret:trino/maintenance-password
    identity: password
    holder: provider
    purpose: the maintenance user's password (its bcrypt line is in the password file); the timer and the health hook sign in with it
  - secret: secret:trino/notify-token
    identity: token
    holder: provider
    purpose: the publish token of the notify channel, used by the maintenance timer's failure alert
identifiers:
  - {kind: secret-name, name: trino, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the key pair, the certificate and key, the password file and the shared secret are read by name at deploy time
    - cap: cap:lake-catalog
      version: "1.0"
      purpose: the catalog the `iceberg` catalog of the engine talks to
    - cap: cap:object-store
      version: "1.0"
      purpose: the warehouse bucket the engine reads and writes table files in
    - cap: cap:notify
      version: "1.0"
      purpose: the maintenance timer posts a failure alert to the notify slot
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 4, memory_mb: 20480, disk_gb: 20}
      guest:
        baselines: [base]
      roles: [role:trino]
      purpose: runs the engine and the maintenance timer (docker_engine applied first, compose_app renders the engine)
provides:
  slots:
    lake-query:
      adapter: homelabnext.conform.adapters.lake:make_lake
      conformance:
        target: conformance/target.yml
egress: none
contributes:
  roles:
    - file: roles/trino
  services:
    - file: registry/services.yml
  scheduler_jobs:
    - {timer: timer:trino/lake-maintenance}
  preflight:
    - {role: role:trino, hook: readiness}
  docs:
    - file: README.md
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest): the role's upgrade hook validates and records it, then it converges; the engine holds no data of its own"}
  remove:
    playbook: playbooks/remove.yml
    export_first: false
    discard_reason: the engine is stateless - tables and files live in the catalog and the object store, which export their own data; only a scratch node directory is discarded
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
