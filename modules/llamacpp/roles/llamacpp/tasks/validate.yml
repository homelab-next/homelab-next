# SPDX-License-Identifier: Apache-2.0
# Every value lands in a compose file, a unit or an argument vector: refuse anything but the shapes
# the role writes, before a file exists.
- name: Validate the settings
  ansible.builtin.assert:
    that:
      - llamacpp_logical_id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)*\Z')
      - llamacpp_backend in llamacpp_backends
      - llamacpp_mode in llamacpp_modes
      - llamacpp_image is match(llamacpp_ref_pattern)
      # the image is the backend's own build: server-vulkan-b<N> for vulkan, server-cuda-b<N> for cuda ...
      - llamacpp_tag is match('^' ~ llamacpp_tag_prefix[llamacpp_backend] ~ 'b[0-9]{1,6}\Z')
      - llamacpp_image_archive == '' or llamacpp_image_archive is match(llamacpp_path_pattern)
      # an IPv4 address in dotted form (the guest's): a hostname and all interfaces are refused
      - llamacpp_bind is match('^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}\Z')
      - llamacpp_bind != '0.0.0.0'
      - llamacpp_port | int >= 1024 and llamacpp_port | int <= 65535
      - llamacpp_uid | int >= 1000 and llamacpp_gid | int >= 1000
      - >-
        [llamacpp_dir, llamacpp_data_root, llamacpp_store_root, llamacpp_precheck_bin, llamacpp_unit_dir,
        llamacpp_sysfs_root, llamacpp_dev_root] | reject('match', llamacpp_path_pattern) | list | length == 0
      - llamacpp_model_repo is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,95}/[A-Za-z0-9][A-Za-z0-9._-]{0,95}\Z')
      - llamacpp_model_file is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,127}[.]gguf\Z')
      - llamacpp_model_store_id is match('^[a-z][a-z0-9]*([-.][a-z0-9]+)*\Z')
      - llamacpp_model_digest is match(llamacpp_digest_pattern)
      - llamacpp_served_model_name is match('^[A-Za-z0-9._:/-]{1,128}\Z')
      - llamacpp_context_size | int >= 256 and llamacpp_context_size | int <= 1048576
      - llamacpp_parallel | int >= 1 and llamacpp_parallel | int <= 32
      - llamacpp_n_gpu_layers | string is match('^(all|auto|[0-9]{1,3})\Z')
      - llamacpp_flash_attn in ['on', 'off', 'auto']
      - llamacpp_render_node is match('^renderD[0-9]{3}\Z')
      - llamacpp_render_gid | string == '' or llamacpp_render_gid | string is match('^[1-9][0-9]{0,9}\Z')
      - llamacpp_models_gid | string == '' or llamacpp_models_gid | string is match('^[1-9][0-9]{0,9}\Z')
      - llamacpp_render_gid | string == '' or llamacpp_render_gid | int <= llamacpp_gid_max
      - llamacpp_models_gid | string == '' or llamacpp_models_gid | int <= llamacpp_gid_max
      - llamacpp_gpu_index | int >= 0 and llamacpp_gpu_index | int <= 15
      - llamacpp_power_cap_max_watts | int >= 1 and llamacpp_power_cap_max_watts | int <= llamacpp_power_cap_ceiling_watts | int
      - llamacpp_power_cap_attrs is sequence and llamacpp_power_cap_attrs is not string
      - llamacpp_power_cap_attrs | length > 0
      - llamacpp_power_cap_attrs | reject('string') | list | length == 0
      - llamacpp_power_cap_attrs | reject('match', '^power[0-9]+_[a-z]+\Z') | list | length == 0
      - llamacpp_unit_name is match('^[A-Za-z0-9@._-]+[.]service\Z')
      - llamacpp_start_timeout_s | int >= 60 and llamacpp_start_timeout_s | int <= 86400
    fail_msg: >-
      llamacpp: a registry id, a mode (generate or decision), a backend (vulkan, sycl, cuda or cpu) with that backend's image
      pinned by tag (server-vulkan-b<N>, server-intel-b<N>, server-cuda-b<N>, server-b<N>) and
      digest, the guest's IPv4 address to publish on (not all interfaces), an unprivileged port,
      a container uid and gid of 1000 or more, canonical absolute paths, a model repository, a
      .gguf file, a store id and the entry's sha256 digest, a served model id, a context of 256
      tokens or more per slot, 1 to 32 slots, layers as a count, all or auto, a render node
      (renderD<NNN>), group ids that are not 0, a power limit of 200 W at most (the operator's rule: a setting can only tighten it) and the hwmon attributes
      that carry it
  tags: [health, backup, restore, export, upgrade]
