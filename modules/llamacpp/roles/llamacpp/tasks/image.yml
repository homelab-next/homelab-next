# A model runtime's egress is default-deny, so the guest cannot pull the pinned image from the
# registry. When llamacpp_image_archive names a local `docker save` of that exact image (compressed
# or not; docker load reads gzip, xz and zstd), the image is loaded from it if the daemon lacks the
# digest, and the role refuses to go on if it is still missing.
- name: Ask whether the daemon already has the pinned image
  ansible.builtin.command:
    argv: [docker, image, inspect, --format, "{{ '{{.Id}}' }}", "{{ llamacpp_repository }}@{{ llamacpp_digest }}"]
  register: llamacpp_have_image
  changed_when: false
  failed_when: false
  check_mode: false

- name: Load the pinned image from the archive when the daemon lacks it
  when: llamacpp_have_image.rc != 0
  block:
    - name: The archive is a regular file
      ansible.builtin.stat:
        path: "{{ llamacpp_image_archive }}"
        follow: false
      register: llamacpp_archive
    - name: Refuse anything but a regular archive
      ansible.builtin.assert:
        that: llamacpp_archive.stat.exists and llamacpp_archive.stat.isreg
        fail_msg: "llamacpp: {{ llamacpp_image_archive }} is not a regular file"
    - name: Load the image
      ansible.builtin.command:
        argv: [docker, load, -i, "{{ llamacpp_image_archive }}"]
      changed_when: true
    - name: The pinned digest is there now
      ansible.builtin.command:
        argv: [docker, image, inspect, --format, "{{ '{{.Id}}' }}", "{{ llamacpp_repository }}@{{ llamacpp_digest }}"]
      changed_when: false
      register: llamacpp_loaded
      failed_when: llamacpp_loaded.rc != 0
