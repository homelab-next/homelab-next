# The secret key resolves in its form (32 or more characters of a safe alphabet) before anything is
# rendered. A failed lookup under no_log is reported as "output hidden", which would hide the one
# thing the operator needs: which reference has no value. So the reference is probed alone first (its
# value is never kept: only whether it resolved) and the refusal names the reference, never a value.
- name: Probe the reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    searxng_probe_ok: "{{ lookup('hnx_secret', searxng_key_ref) | length > 0 }}"
  register: searxng_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: not (searxng_probe.failed | default(false))
    fail_msg: >-
      searxng: no value in the secret store for {{ searxng_key_ref }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Read the key's form (only the verdict leaves the task)
  ansible.builtin.set_fact:
    searxng_key_ok: "{{ lookup('hnx_secret', searxng_key_ref) is match(searxng_key_pattern) }}"
  no_log: true
  tags: [readiness]

- name: The key has its form
  ansible.builtin.assert:
    that: searxng_key_ok | bool
    fail_msg: >-
      searxng: {{ searxng_key_ref }} must be 32 or more characters of letters, digits and . _ ~ + = -
      (the value is not printed)
  tags: [readiness]
