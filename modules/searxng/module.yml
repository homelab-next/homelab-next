# SPDX-License-Identifier: Apache-2.0
# The web-search provider on SearXNG (docs/modules.md; README.md beside this file): a metasearch
# service that asks many public search engines at once and answers the lab's own callers over HTTP
# (html and json), run as one compose_app container from a pinned image. Stateless: the settings are
# rendered from the role's variables and the one secret, nothing is kept that a rebuild cannot
# re-create. Internal only: no public route. Egress is the point of a metasearch: it queries the
# engines' sites. Every real value (the guest, its address, the secret value, which callers may
# reach it) is the site's: the overlay's lab/modules.yml, lab/services.yml, group variables, the
# guest's firewall file and the secret store.
manifest_version: "1.0"
id: searxng
kind: provider
title: Web search on SearXNG
description: Fills the web-search slot with SearXNG, one compose_app container with the default
  engine set, the JSON format on for API callers, the limiter off (an internal service whose
  callers are programs), settings rendered from variables and one secret key read by name at deploy;
  stateless, with a health hook that must see a real JSON search return results.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: searxng
  version: 2026.11.9-57ff753ad
licence:
  kind: open-source
  spdx: AGPL-3.0-or-later
credentials:
  - secret: secret:searxng/secret-key
    identity: key
    holder: provider
    purpose: the instance's secret key (32 or more characters), rendered only into the 0600 settings file the container reads; it signs the image-proxy links
identifiers:
  - {kind: secret-name, name: searxng, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the secret key is read by name at deploy time
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 1, memory_mb: 1024, disk_gb: 5}
      guest:
        baselines: [base]
      roles: [role:searxng]
      purpose: runs the SearXNG container (docker_engine applied first, compose_app renders it); the rendered settings file is the only state, so the guest can be rebuilt from the site's files
provides:
  slots:
    web-search:
      adapter: homelabnext.conform.adapters.web_search:make
      provisional: true
      reason: web-search has no contract yet; the obvious standard is the service answering its health path and a JSON search (q and format=json) with a list of results, which is what the role's health hook and a consumer's first call read
egress:
  - host: server
    to: [internet]
    purpose: the search engines' own sites, queried for every search (the product also fetches result images through its image proxy)
contributes:
  roles:
    - file: roles/searxng
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:searxng, hook: readiness}
  docs:
    - file: README.md
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest): validated and recorded, then converged; the service keeps no data, so nothing is exported first"}
  remove:
    playbook: playbooks/remove.yml
    export_first: false
    discard_reason: the service keeps no data (its settings are rendered from the site's variables, its secret key is in the secret store)
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
