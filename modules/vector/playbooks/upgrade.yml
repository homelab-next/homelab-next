# Upgrade: validate and record a pinned image bump (vector_target_image, tag and digest), export the
# checkpoints first, then converge with the new pin (set vector_image to the target in the overlay).
#   ansible-playbook -i <inventory> modules/vector/playbooks/upgrade.yml -e vector_target_image=<ref>
- name: Upgrade the log pipeline
  hosts: mod_vector_aggregator
  become: true
  tasks:
    - name: Validate and record the bump
      ansible.builtin.include_role:
        name: vector
        tasks_from: upgrade
    - name: Export the checkpoints before the new image reads them
      ansible.builtin.include_role:
        name: vector
        tasks_from: export
    - name: Converge on the new pin
      ansible.builtin.include_role:
        name: vector
      vars:
        vector_image: "{{ vector_target_image }}"
