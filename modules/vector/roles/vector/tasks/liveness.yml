# The liveness metrics (README, "Liveness and the stalled-pipeline alert"): a timer writes vector_pipeline_*
# textfile metrics once a minute (are both containers running and healthy, how often did they restart, how old
# is the sidecar's status, how many rows has each route moved) and the monitoring rules page on them.
# Off when vector_textfile_dir is empty.
# the writer itself (code/hnx_modules/vector/liveness.py) is copied with the package by files.yml

- name: The textfile directory exists
  ansible.builtin.file:
    path: "{{ vector_textfile_dir }}"
    state: directory
    owner: "{{ vector_owner }}"
    group: "{{ vector_owner }}"
    mode: "0755"

- name: Write the liveness service and timer units
  ansible.builtin.template:
    src: "hnx-vector-liveness.{{ item }}.j2"
    dest: "{{ vector_unit_dir }}/hnx-vector-liveness.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: vector_liveness_units

- name: Reload systemd (units changed)
  ansible.builtin.command:
    argv: [systemctl, daemon-reload]
  when: vector_liveness_units is changed and not ansible_check_mode
  changed_when: true

- name: Enable and start the timer
  ansible.builtin.command:
    argv: [systemctl, enable, --now, hnx-vector-liveness.timer]
  when: vector_start | bool and not ansible_check_mode
  changed_when: vector_liveness_units is changed
