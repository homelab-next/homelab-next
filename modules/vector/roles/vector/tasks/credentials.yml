# SPDX-License-Identifier: Apache-2.0
# Every credential resolves and has its form (the object store's key forms; a PEM certificate chain
# and a PEM private key). Only the verdicts leave the no_log task.
- name: Read each credential's form
  ansible.builtin.set_fact:
    vector_forms:
      key_id: "{{ lookup('hnx_secret', vector_s3_access_key_ref) is match(vector_key_id_pattern) }}"
      key_value: "{{ lookup('hnx_secret', vector_s3_signing_ref) is match(vector_hex64_pattern) }}"
      cert: "{{ lookup('hnx_secret', vector_tls_cert_ref) is match(vector_pem_cert_pattern) }}"
      private_key: "{{ lookup('hnx_secret', vector_tls_pem_ref) is match(vector_pem_key_pattern) }}"
      ca: "{{ vector_sensor_ca_ref == '' or lookup('hnx_secret', vector_sensor_ca_ref) is match(vector_pem_cert_pattern) }}"
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - vector_forms.key_id | bool
      - vector_forms.key_value | bool
      - vector_forms.cert | bool
      - vector_forms.private_key | bool
      - vector_forms.ca | bool
    fail_msg: >-
      vector: {{ vector_s3_access_key_ref }} must be GK and 24 to 32 hex digits, {{ vector_s3_signing_ref }}
      64 hex digits, {{ vector_tls_cert_ref }} a PEM certificate chain and {{ vector_tls_pem_ref }} a PEM
      private key (and the sensor CA a PEM certificate); forms: {{ vector_forms }}
  tags: [readiness]
