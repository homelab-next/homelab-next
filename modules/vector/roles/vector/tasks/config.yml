# SPDX-License-Identifier: Apache-2.0
# The aggregator's configuration, validated by Vector itself (the pinned image, no network, no
# healthchecks) before it replaces the one in use: a refused file never reaches the running
# aggregator.
- name: Resolve the object store's address
  ansible.builtin.include_tasks: endpoint.yml

- name: Render the candidate configuration
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_data_root }}/config/vector.yaml.candidate"
    owner: "{{ vector_owner }}"
    group: "{{ vector_group }}"
    mode: "0640"
  changed_when: false

- name: Vector validates the candidate (the pinned image; the secrets are dummies here)
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network=none
      - --cap-drop=ALL
      - --user
      - "{{ vector_uid | int }}:{{ vector_gid | int }}"
      - --env
      - VECTOR_S3_ACCESS_KEY
      - --env
      - VECTOR_S3_SECRET_KEY
      - --volume
      - "{{ vector_data_root }}/config/vector.yaml.candidate:/etc/vector/vector.yaml:ro"
      - --volume
      - "{{ vector_data_root }}/tls:{{ vector_container_tls_dir }}:ro"
      - --entrypoint
      - vector
      - "{{ vector_image }}"
      - validate
      - --no-environment
      - /etc/vector/vector.yaml
  environment:
    VECTOR_S3_ACCESS_KEY: placeholder
    VECTOR_S3_SECRET_KEY: placeholder
  changed_when: false
  when: vector_validate_with_docker | bool

- name: Put the validated configuration in use
  ansible.builtin.copy:
    src: "{{ vector_data_root }}/config/vector.yaml.candidate"
    dest: "{{ vector_data_root }}/config/vector.yaml"
    remote_src: true
    owner: "{{ vector_owner }}"
    group: "{{ vector_group }}"
    mode: "0640"
  register: vector_config_written

- name: Remove the candidate
  ansible.builtin.file:
    path: "{{ vector_data_root }}/config/vector.yaml.candidate"
    state: absent
  changed_when: false
