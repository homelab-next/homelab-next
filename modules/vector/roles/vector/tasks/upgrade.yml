# SPDX-License-Identifier: Apache-2.0
- block:
    - name: Refuse a target that is not pinned by tag and digest, or is another repository
      ansible.builtin.assert:
        that:
          - vector_target_image is match(vector_pin_pattern)
          - vector_target_image.split('@')[0].rsplit(':', 1)[0] == vector_repository
        fail_msg: "vector: the target must be {{ vector_repository }}:<tag>@sha256:<64 hex>"
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Validate and record the bump (compose_app upgrade)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: upgrade
      vars:
        compose_app_name: vector
        compose_app_dir: "{{ vector_app.compose_app_dir }}"
        compose_app_owner: "{{ vector_app.compose_app_owner }}"
        compose_app_group: "{{ vector_app.compose_app_group }}"
        compose_app_spec: "{{ vector_app.compose_app_spec }}"
        compose_app_upgrade_service: vector
        compose_app_upgrade_tag: "{{ vector_target_image.split('@')[0].rsplit(':', 1)[1] }}"
        compose_app_upgrade_digest: "{{ vector_target_image.split('@')[1] }}"
  tags: [upgrade]
