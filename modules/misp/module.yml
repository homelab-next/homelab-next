# SPDX-License-Identifier: Apache-2.0
# The threat-intel provider on MISP (docs/modules.md; README.md beside this file): a threat
# intelligence sharing platform run as one compose_app project of four containers (the application,
# its modules service, MariaDB and a Valkey cache), every image pinned by tag and digest. Local
# accounts of its own; every API key is a secret by reference. Feeds are untrusted input by design:
# egress is the internet, and nothing on the guest trusts what a feed delivers. No public route.
# Every real value (the guest, its address, the names, the secret values, the dump's path) is the
# site's: the overlay's lab/modules.yml, lab/services.yml, group variables and secret store.
manifest_version: "1.0"
id: misp
kind: provider
title: Threat-intelligence platform on MISP
description: Fills the threat-intel slot with MISP, one compose_app project (application, modules,
  MariaDB, Valkey) with every image pinned by digest, secrets by reference, the background workers
  started on every container lifetime, API keys set from secrets for the administrator and each
  consumer, a mysqldump export and an import that verifies event, attribute, object, galaxy and feed
  counts against the source's.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: misp
  version: 2.5.44
licence:
  kind: open-source
  spdx: AGPL-3.0-only
credentials:
  - secret: secret:misp/admin-password
    identity: password
    holder: provider
    purpose: the administrator's web password (the first account on an empty database; after an import the imported account's own hash is kept)
  - secret: secret:misp/admin-api-key
    identity: token
    holder: granted
    purpose: the administrator's API key; set on the administrator account on every run and the key a consumer such as an enrichment job reads; on a migration the old instance's value, so no consumer changes
  - secret: secret:misp/mysql-password
    identity: password
    holder: provider
    purpose: the application's database account password
  - secret: secret:misp/mysql-root-password
    identity: password
    holder: provider
    purpose: the database's root password (the role's export and import hooks use it inside the database container only)
  - secret: secret:misp/redis-password
    identity: password
    holder: provider
    purpose: the cache's password
  - secret: secret:misp/encryption-key
    identity: key
    holder: provider
    purpose: the key MISP encrypts stored credentials (sync servers, feed passwords) with; on a migration the source's value, or those credentials cannot be read
  - secret: secret:misp/gpg-passphrase
    identity: password
    holder: provider
    purpose: the passphrase of the instance's own GnuPG key
identifiers:
  - {kind: secret-name, name: misp, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: every password and key is read by name at deploy time
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 4, memory_mb: 28672, disk_gb: 120}
      guest:
        baselines: [base]
      roles: [role:misp]
      purpose: runs the four containers (docker_engine applied first, compose_app renders them); the database, the attachments and the export live on this guest's disk
provides:
  slots:
    threat-intel:
      adapter: homelabnext.conform.adapters.threat_intel:make
      provisional: true
      reason: threat-intel has no contract yet; the obvious standard is the service answering its sign-in page and refusing a call that carries no valid API key, which is what the role's health hook and a consumer's first call read
      migration: {formats: [object-tree], export: role:misp, import: role:misp}
egress:
  - host: server
    to: [internet]
    purpose: the feeds' own sites (fetched by the application's scheduled jobs; every feed is untrusted input) and the application's taxonomy, galaxy and warninglist updates
contributes:
  roles:
    - file: roles/misp
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:misp, hook: readiness}
  docs:
    - file: README.md
data:
  - id: database
    kind: database
    description: The application database as a mysqldump (zstd) beside a manifest of row counts and its sha256; the audit log table is excluded by design (own-system telemetry). Attachments are the event directories under the data root's files directory.
    export: {formats: [object-tree], via: role:misp}
    import: {formats: [object-tree], via: role:misp}
    retention: {keep: forever}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest) of the application and its modules service, same or newer version: validated and recorded, the database exported, then converged; the application migrates its own schema on first start"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
