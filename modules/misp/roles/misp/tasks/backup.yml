# SPDX-License-Identifier: Apache-2.0
# The backup manifest names the data root: the database files, the attachments, the configuration
# and the last export. The database is written while the service runs, so a backup of the guest is
# crash-consistent (the engine recovers from that); the consistent copy is export/latest, which the
# upgrade and remove playbooks refresh and which an operator refreshes before a copy that must not
# depend on recovery (README, "Backup and restore").
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Create the data directories
      ansible.builtin.include_tasks: dirs.yml
    - name: Create the compose project directory
      ansible.builtin.file:
        path: "{{ misp_dir }}"
        state: directory
        owner: "{{ misp_owner }}"
        group: "{{ misp_group }}"
        mode: "0750"
    - name: Write the backup manifest (the data root)
      ansible.builtin.copy:
        dest: "{{ misp_dir }}/backup-manifest.json"
        content: "{{ {'app': 'misp', 'paths': [misp_data_root]} | to_nice_json }}\n"
        owner: "{{ misp_owner }}"
        group: "{{ misp_group }}"
        mode: "0640"
  tags: [backup]
