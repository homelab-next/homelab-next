# One run of the helper (files/hnx_misp.py) with the command misp_helper_cmd and the settings
# misp_helper_input, on standard input (never a command line). The database's root password, when the
# command needs it, is in the environment of the docker client the helper starts (MYSQL_PWD), never
# an argument. What it prints is one line of JSON; a failure's one-line reason holds no credential
# and is shown. misp_helper_async (seconds) runs a long command asynchronously and polls it.
- name: Run the helper
  ansible.builtin.command:
    # the script itself is the role's file, run with -c: nothing has to be installed first, and
    # what runs is exactly what the role shipped
    argv: [python3, -I, -c, "{{ lookup('ansible.builtin.file', 'hnx_misp.py') }}", "{{ misp_helper_cmd }}"]
    stdin: "{{ misp_helper_input | to_json }}"
  environment:
    MYSQL_PWD: "{{ lookup('hnx_secret', misp_db_root_login_ref) if misp_helper_cmd in ['dump', 'load'] else '' }}"
  register: misp_helper_result
  changed_when: misp_helper_cmd in ['dump', 'load', 'files']
  failed_when: false
  check_mode: false
  no_log: true
  async: "{{ misp_helper_async | default(omit) }}"
  poll: "{{ 3 if (misp_helper_async | default(0) | int) > 0 else omit }}"

- name: The helper succeeded
  ansible.builtin.assert:
    that: misp_helper_result.rc | default(1) == 0
    fail_msg: "misp: {{ misp_helper_cmd }} failed: {{ misp_helper_result.stderr | default('') | trim | truncate(500) }}"

- name: Read what the helper reported
  ansible.builtin.set_fact:
    misp_facts: "{{ misp_helper_result.stdout | from_json }}"
