# SPDX-License-Identifier: Apache-2.0
# Every credential resolves in its form before a container sees it: each password and the
# encryption key long enough to matter and made of characters a shell, an environment variable, an
# ini file and a SQL string carry literally, each API key the 40 alphanumeric characters the
# application issues, all of them distinct. A reference with no value in the secret store stops the
# run here, by name, before anything is rendered or started. No value is printed.
# A failed lookup under no_log is reported as "output hidden", which would hide the one thing the
# operator needs: which reference has no value. So each reference is probed alone first (its value
# is never kept: only whether it resolved) and the refusal names the references, never a value.
- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    misp_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop: "{{ misp_refs }}"
  loop_control:
    label: "{{ item }}"
  register: misp_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: misp_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      misp: no value in the secret store for
      {{ misp_refs | zip(misp_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Every password, key and API key resolves in its form
  ansible.builtin.assert:
    that:
      - >-
        lookup('hnx_secret', misp_admin_login_ref, misp_db_login_ref, misp_db_root_login_ref,
               misp_cache_login_ref, misp_encryption_key_ref, misp_gpg_passphrase_ref, wantlist=True)
        | reject('match', misp_passphrase_pattern) | list | length == 0
      - >-
        lookup('hnx_secret', *(misp_accounts | map(attribute='key_ref') | list), wantlist=True)
        | reject('match', misp_user_key_pattern) | list | length == 0
      # every secret is its own: a repeated one would let one credential open another's door
      - >-
        lookup('hnx_secret', *misp_refs, wantlist=True) | unique | length == misp_refs | length
    fail_msg: >-
      misp: each password and the encryption key (16 to 128 of A-Z a-z 0-9 . _ ~ -) and each API key
      (exactly 40 of A-Z a-z 0-9) must resolve in its form, and no two credentials may share a value
  no_log: true
  tags: [readiness]

- name: The certificate and key are PEM and the key is a private key
  ansible.builtin.assert:
    that:
      - lookup('hnx_secret', misp_tls_cert_ref) is search('-----BEGIN CERTIFICATE-----')
      - lookup('hnx_secret', misp_tls_key_ref) is search('-----BEGIN [A-Z ]*PRIVATE KEY-----')
    fail_msg: "misp: the TLS certificate must be PEM and the TLS key a PEM private key"
  no_log: true
  when: misp_tls_refs | length > 0
  tags: [readiness]
