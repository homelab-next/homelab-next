# SPDX-License-Identifier: Apache-2.0
# Import a database dump into a fresh platform (README, "Importing the old instance"): the dump is
# a zstd mysqldump (misp_restore_dump) whose sha256 the site states (misp_restore_sha256) and whose
# source row counts the site states (misp_restore_counts: events, attributes, objects,
# galaxy_clusters, feeds, at least; users optional). Nothing is written until the dump is the pinned
# file, decompresses whole and ends with the dump's completion line, and the platform's database
# holds NO events, attributes or objects (an import is not a merge). The application is stopped for
# the load (nothing else writes the database), the dump's tables replace the freshly built ones
# (the audit log table, excluded from the dump, stays as the fresh empty one), and the counts are
# read BEFORE the application starts again and must EQUAL the source's: a count that is zero where
# the source has rows, or that differs, fails the import and the application is left stopped. A
# platform started on a failed import would begin fetching feeds into half a database.
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Refuse an import with no dump, no sha256 or too few source counts (nothing is written)
      ansible.builtin.assert:
        that:
          - misp_restore_dump | length > 0
          - misp_restore_sha256 | length > 0
          - misp_restore_counts | list | intersect(['events', 'attributes', 'objects', 'galaxy_clusters', 'feeds']) | length == 5
          - misp_restore_counts.events | int > 0
          - misp_restore_counts.attributes | int > 0
          - misp_restore_files_tar | length == 0 or misp_restore_files_sha256 | length > 0
        fail_msg: "misp: an import needs misp_restore_dump, misp_restore_sha256 and the source's counts for events, attributes, objects, galaxy_clusters and feeds (events and attributes above zero: an import that expects nothing proves nothing)"
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Create the data directories
      ansible.builtin.include_tasks: dirs.yml
    - name: Look at the dump
      ansible.builtin.stat:
        path: "{{ misp_restore_dump }}"
        checksum_algorithm: sha256
        follow: false
      register: misp_restore_stat
    - name: Refuse a dump that is not the pinned file (nothing is written)
      ansible.builtin.assert:
        that:
          - misp_restore_stat.stat.exists
          - misp_restore_stat.stat.isreg
          - not misp_restore_stat.stat.islnk
          - misp_restore_stat.stat.size | int > 0
          - misp_restore_stat.stat.checksum == misp_restore_sha256
        fail_msg: "misp: {{ misp_restore_dump }} is not the pinned dump (missing, not a regular file, a link, empty, or its sha256 differs from misp_restore_sha256)"
    - name: The dump decompresses whole and ends with the dump's completion line
      ansible.builtin.include_tasks: helper.yml
      vars:
        misp_helper_cmd: verify
        misp_helper_input: {path: "{{ misp_restore_dump }}"}
        misp_helper_async: "{{ misp_import_timeout }}"
    - name: The platform is up (its first start builds the schema the dump replaces)
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ misp_dir }}/docker-compose.yml", up, -d, --wait, db]
      changed_when: false
    - name: Read what the database holds now
      ansible.builtin.include_tasks: counts.yml
    - name: Refuse a database that already holds events, attributes or objects (an import is not a merge)
      ansible.builtin.assert:
        that:
          - misp_counts.events | int == 0
          - misp_counts.attributes | int == 0
          - misp_counts.objects | int == 0
        fail_msg: >-
          misp: the database already holds {{ misp_counts.events }} events, {{ misp_counts.attributes }}
          attributes and {{ misp_counts.objects }} objects; the import is not a merge. Move
          {{ misp_data_root }} aside and deploy again, then import into that.
    - name: Stop the application (nothing else may write the database during the load)
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ misp_dir }}/docker-compose.yml", stop, misp-core]
      changed_when: true
    - name: Load the dump (replaces every table it holds)
      ansible.builtin.include_tasks: helper.yml
      vars:
        misp_helper_cmd: load
        misp_helper_input:
          compose: "{{ misp_dir }}/docker-compose.yml"
          dump: "{{ misp_restore_dump }}"
        misp_helper_async: "{{ misp_import_timeout }}"
    - name: Read what the database holds after the load (the application is still stopped)
      ansible.builtin.include_tasks: counts.yml
    - name: The counts equal the source's (the application stays stopped when they do not)
      ansible.builtin.assert:
        that: misp_counts[item.key] | int == item.value | int
        fail_msg: "misp: after the load the database holds {{ misp_counts[item.key] }} {{ item.key }} where the source had {{ item.value }}; the application was left STOPPED"
      loop: "{{ misp_restore_counts | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
    - name: Put the attachments in place
      ansible.builtin.include_tasks: restore_files.yml
      when: misp_restore_files_tar | length > 0
    - name: Start the application on the imported database
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ misp_dir }}/docker-compose.yml", up, -d, --wait, misp-core]
      changed_when: true
    - name: Settle the application (its start finishes; restarted once when it came up broken)
      ansible.builtin.include_tasks: settle.yml
    - name: Wait for the application to answer
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ misp_dir }}/docker-compose.yml", exec, -T, -e, HNX_PATH, misp-core, sh, -c, "{{ misp_api_status_script }}"]
        expand_argument_vars: false
      environment:
        HNX_PATH: /users/heartbeat
      register: misp_up
      until: misp_up.rc == 0 and misp_up.stdout | trim == '200'
      retries: "{{ ((misp_ready_timeout | int) / 10) | int }}"
      delay: 10
      changed_when: false
      failed_when: false
    - name: Start the background workers
      ansible.builtin.include_tasks: workers.yml
    - name: Set the administrator's and the consumers' API keys on the imported accounts
      ansible.builtin.include_tasks: keys.yml
  tags: [restore]
