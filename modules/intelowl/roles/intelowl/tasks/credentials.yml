# Every credential resolves in its form before a container sees it. A reference with no value in the
# secret store stops the run here, by name, before anything is rendered or started. No value is
# printed. A failed lookup under no_log is reported as "output hidden", which would hide the one thing
# the operator needs (which reference has no value), so each reference is probed alone first (only
# whether it resolved is kept) and the refusal names the references, never a value.
- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    intelowl_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop: "{{ intelowl_refs }}"
  loop_control:
    label: "{{ item }}"
  register: intelowl_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: intelowl_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      intelowl: no value in the secret store for
      {{ intelowl_refs | zip(intelowl_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Every credential resolves in its form
  ansible.builtin.assert:
    that:
      - lookup('hnx_secret', intelowl_db_login_ref) is match(intelowl_db_value_pattern)
      - lookup('hnx_secret', intelowl_signing_ref) is match(intelowl_django_value_pattern)
      - lookup('hnx_secret', intelowl_api_login_ref) is match(intelowl_api_value_pattern)
      - >-
        not (intelowl_admin_bootstrap | bool)
        or lookup('hnx_secret', intelowl_admin_login_ref) is match(intelowl_admin_value_pattern)
      - >-
        intelowl_otx_key_ref | length == 0
        or lookup('hnx_secret', intelowl_otx_key_ref) is match(intelowl_otx_value_pattern)
      - lookup('hnx_secret', intelowl_signing_ref) != lookup('hnx_secret', intelowl_db_login_ref)
    fail_msg: >-
      intelowl: the database password (24 to 128 of A-Z a-z 0-9 . _ ~ -), the application secret (32 to 256
      of A-Z a-z 0-9 . _ ~ + / = -; after a migration the source's own value), the API token (exactly 40 of
      A-Z a-z 0-9), the admin password (16 to 128 of A-Z a-z 0-9 . _ ~ -, read only when
      intelowl_admin_bootstrap) and the OTX key (32 to 128 of A-Z a-z 0-9, only when intelowl_otx_key_ref is
      set) must resolve, the database password and the application secret different
  no_log: true
  tags: [readiness]
