# SPDX-License-Identifier: Apache-2.0
# Every credential resolves in its form before a container sees it. A reference with no value in the
# secret store stops the run here, by name, before anything is rendered or started. No value is
# printed. A failed lookup under no_log is reported as "output hidden", which would hide the one
# thing the operator needs: which reference has no value. So each reference is probed alone first
# (its value is never kept: only whether it resolved) and the refusal names the references.
- name: Name the references this configuration reads
  ansible.builtin.set_fact:
    dfir_iris_read_refs:
      - "{{ dfir_iris_db_login_ref }}"
      - "{{ dfir_iris_db_admin_login_ref }}"
      - "{{ dfir_iris_session_key_ref }}"
      - "{{ dfir_iris_salt_ref }}"
      - "{{ dfir_iris_admin_login_ref }}"
      - "{{ dfir_iris_access_ref }}"
      - "{{ dfir_iris_tls_cert_ref }}"
      - "{{ dfir_iris_tls_key_ref }}"
      - "{{ dfir_iris_ca_ref }}"
  tags: [readiness]

- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    dfir_iris_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop: "{{ dfir_iris_read_refs }}"
  loop_control:
    label: "{{ item }}"
  register: dfir_iris_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: dfir_iris_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      case-management: no value in the secret store for
      {{ dfir_iris_read_refs | zip(dfir_iris_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Read each credential's form
  ansible.builtin.set_fact:
    dfir_iris_forms:
      db: "{{ [lookup('hnx_secret', dfir_iris_db_login_ref), lookup('hnx_secret', dfir_iris_db_admin_login_ref)] | reject('match', dfir_iris_db_value_pattern) | list | length == 0 }}"
      session: "{{ [lookup('hnx_secret', dfir_iris_session_key_ref), lookup('hnx_secret', dfir_iris_salt_ref)] | reject('match', dfir_iris_key_value_pattern) | list | length == 0 }}"
      api: "{{ lookup('hnx_secret', dfir_iris_access_ref) is match(dfir_iris_api_value_pattern) }}"
      admin: "{{ lookup('hnx_secret', dfir_iris_admin_login_ref) is match(dfir_iris_admin_value_pattern) and ([lookup('hnx_secret', dfir_iris_admin_login_ref) is search('[a-z]'), lookup('hnx_secret', dfir_iris_admin_login_ref) is search('[A-Z]'), lookup('hnx_secret', dfir_iris_admin_login_ref) is search('[0-9]'), lookup('hnx_secret', dfir_iris_admin_login_ref) is search('[._~-]')] | select | list | length == 4) }}"
      distinct: >-
        {{ [lookup('hnx_secret', dfir_iris_db_login_ref), lookup('hnx_secret', dfir_iris_db_admin_login_ref),
            lookup('hnx_secret', dfir_iris_session_key_ref), lookup('hnx_secret', dfir_iris_salt_ref),
            lookup('hnx_secret', dfir_iris_admin_login_ref), lookup('hnx_secret', dfir_iris_access_ref)]
           | unique | length == 6 }}
      cert: "{{ lookup('hnx_secret', dfir_iris_tls_cert_ref) is search(dfir_iris_pem_cert_pattern) }}"
      key: "{{ lookup('hnx_secret', dfir_iris_tls_key_ref) is search(dfir_iris_pem_key_pattern) }}"
      ca: "{{ lookup('hnx_secret', dfir_iris_ca_ref) is search(dfir_iris_pem_cert_pattern) }}"
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - dfir_iris_forms.db | bool
      - dfir_iris_forms.session | bool
      - dfir_iris_forms.api | bool
      - dfir_iris_forms.admin | bool
      - dfir_iris_forms.distinct | bool
      - dfir_iris_forms.cert | bool
      - dfir_iris_forms.key | bool
      - dfir_iris_forms.ca | bool
    fail_msg: >-
      case-management: {{ dfir_iris_db_login_ref }} and {{ dfir_iris_db_admin_login_ref }} must be
      24 to 128 of A-Z a-z 0-9 . _ ~ -; {{ dfir_iris_session_key_ref }} and {{ dfir_iris_salt_ref }}
      16 to 256 printable characters without a space or a quote (after a migration, the source's values);
      {{ dfir_iris_access_ref }} 32 to 128 of A-Z a-z 0-9 . _ ~ -; {{ dfir_iris_admin_login_ref }} 16 to
      128 of the same with a lower, an upper, a digit and one of . _ ~ -; the six all different;
      {{ dfir_iris_tls_cert_ref }} and {{ dfir_iris_ca_ref }} PEM certificates and {{ dfir_iris_tls_key_ref }} a
      PEM private key; forms: {{ dfir_iris_forms }}
  tags: [readiness]
