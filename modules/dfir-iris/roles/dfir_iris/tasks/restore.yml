# SPDX-License-Identifier: Apache-2.0
# Restore from an export (README, "Migrating in" and "Restore drill"): the source is checked first
# and nothing is written until it passes (listing.jsonl names exactly the dump and the archive,
# with the sizes and sha256 the files have). Then, with the app, the worker and the front STOPPED,
# the dump is staged in export/db/ as the database's user, hashed again (what is restored is what
# was checked), and restored with pg_restore --clean --if-exists in one transaction; the files
# directory is emptied and the archive unpacked into it and given to the app's user; the staged copy
# is removed and the app started again whatever happened (it brings the schema forward to the
# running image as it starts). Run again with a newer export for the final delta after a freeze:
# --clean replaces everything the first restore wrote. The restored database brings its own
# accounts and passwords; the administrator's API key is set to the secret's value (reconcile.yml).
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Create the data directories
      ansible.builtin.include_tasks: dirs.yml
    - name: Read the source's listing
      ansible.builtin.slurp:
        src: "{{ dfir_iris_restore_source }}/listing.jsonl"
      register: dfir_iris_restore_listing
    - name: Read the source's files (size, sha256)
      ansible.builtin.stat:
        path: "{{ dfir_iris_restore_source }}/{{ item }}"
        checksum_algorithm: sha256
        follow: false
      loop: [db/iris.dump, files.tar]
      register: dfir_iris_restore_stat
    - name: Refuse a source that is not exactly what its listing says (nothing is written)
      ansible.builtin.assert:
        that:
          - >-
            (dfir_iris_restore_listing.content | b64decode).splitlines() | reject('equalto', '')
            | map('from_json') | map(attribute='key') | sort == ['db/iris.dump', 'files.tar']
          - dfir_iris_restore_stat.results | rejectattr('stat.exists') | list | length == 0
          - dfir_iris_restore_stat.results | selectattr('stat.islnk', 'equalto', true) | list | length == 0
          - dfir_iris_restore_stat.results[0].stat.size | int > 0
          - >-
            dfir_iris_restore_stat.results | map(attribute='stat') | map(attribute='checksum') | sort
            == (dfir_iris_restore_listing.content | b64decode).splitlines() | reject('equalto', '')
               | map('from_json') | map(attribute='sha256') | sort
          - >-
            dfir_iris_restore_stat.results | map(attribute='stat') | map(attribute='size') | map('int') | sort
            == (dfir_iris_restore_listing.content | b64decode).splitlines() | reject('equalto', '')
               | map('from_json') | map(attribute='size') | map('int') | sort
        fail_msg: "case-management: {{ dfir_iris_restore_source }} is not an intact export (listing, sizes or sha256 differ)"
    - name: Restore with the app, the worker and the front stopped
      block:
        - name: Make sure the database and the broker are up
          ansible.builtin.command:
            argv: [docker, compose, -f, "{{ dfir_iris_dir }}/docker-compose.yml", up, -d, --wait, db, broker]
          changed_when: false
        - name: Stop the front, the app and the worker
          ansible.builtin.command:
            argv: [docker, compose, -f, "{{ dfir_iris_dir }}/docker-compose.yml", stop, nginx, worker, app]
          changed_when: true
        - name: Stage the dump as the database's user
          ansible.builtin.copy:
            src: "{{ dfir_iris_restore_source }}/db/iris.dump"
            dest: "{{ dfir_iris_data_root }}/export/db/.restore.dump"
            remote_src: true
            owner: "{{ dfir_iris_db_uid | int }}"
            group: "{{ dfir_iris_db_gid | int }}"
            mode: "0600"
        - name: Hash the staged copy
          ansible.builtin.stat:
            path: "{{ dfir_iris_data_root }}/export/db/.restore.dump"
            checksum_algorithm: sha256
          register: dfir_iris_staged
        - name: What is staged is what was checked
          ansible.builtin.assert:
            that: dfir_iris_staged.stat.checksum == dfir_iris_restore_stat.results[0].stat.checksum
            fail_msg: "case-management: the staged dump differs from the checked one"
        - name: Restore the database (one transaction)
          ansible.builtin.command:
            argv: [docker, compose, -f, "{{ dfir_iris_dir }}/docker-compose.yml", exec, -T, db,
                   pg_restore, -U, "{{ dfir_iris_db_user }}", -d, "{{ dfir_iris_db_name }}",
                   --clean, --if-exists, --no-owner, --no-acl, --single-transaction, --exit-on-error,
                   "{{ dfir_iris_container_export }}/.restore.dump"]
          changed_when: true
        - name: Empty the files directory (a delta replaces, it does not add)
          ansible.builtin.command:
            argv: [find, "{{ dfir_iris_data_root }}/files", -mindepth, "1", -delete]
          changed_when: true
        - name: Unpack the files (extracted by root, never taking the archive's owners)
          ansible.builtin.command:
            argv: [tar, --extract, --no-same-owner, --no-same-permissions,
                   --file, "{{ dfir_iris_restore_source }}/files.tar",
                   --directory, "{{ dfir_iris_data_root }}/files"]
          changed_when: true
        - name: Give the files to the app's user
          ansible.builtin.file:
            path: "{{ dfir_iris_data_root }}/files"
            state: directory
            recurse: true
            owner: "{{ dfir_iris_app_uid | int }}"
            group: "{{ dfir_iris_app_gid | int }}"
      always:
        - name: Remove the staged copy
          ansible.builtin.file:
            path: "{{ dfir_iris_data_root }}/export/db/.restore.dump"
            state: absent
    - name: Create the datastore's directories the archive may not hold
      ansible.builtin.include_tasks: dirs.yml
    - name: Start the app, the worker and the front
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ dfir_iris_dir }}/docker-compose.yml", up, -d, app, worker, nginx]
      changed_when: true
    - name: Wait for the API to answer
      ansible.builtin.include_tasks: probe.yml
      vars:
        dfir_iris_probe_path: /api/ping
        dfir_iris_probe_keyed: false
        dfir_iris_probe_wait: true
        # no key yet: a running API refuses the caller, which is the answer waited for
        dfir_iris_probe_expect: ['401', '403']
    - name: Make the administrator's API key the secret's value
      ansible.builtin.include_tasks: reconcile.yml
    - name: Prove the restored service (health)
      ansible.builtin.include_tasks: health.yml
  tags: [restore]
