# Set the first administrator's real password through the API (the key is already the secret's, see
# reconcile.yml). The product prints the password it creates the administrator with into the app's log,
# so the first start is given only a throwaway one (main.yml); this replaces it. Both the lookup and
# the update are keyed calls whose bodies carry no secret except the password, which travels on curl's
# standard input. A failure stops the run before the marker is written, so the next run repeats it.
- name: Look the administrator up
  ansible.builtin.include_tasks: probe.yml
  vars:
    dfir_iris_probe_path: "/manage/users/lookup/login/{{ dfir_iris_admin_user }}"
    dfir_iris_probe_keyed: true

- name: Refuse an administrator the API cannot find
  ansible.builtin.assert:
    that:
      - dfir_iris_probe_code == '200'
      - (dfir_iris_probe_body | from_json).data.user_id | int > 0
    fail_msg: >-
      case-management: the API did not find the administrator {{ dfir_iris_admin_user }} (status
      {{ dfir_iris_probe_code }}, curl exit {{ dfir_iris_probe_curl_rc }}); its password was not set
  no_log: true

- name: Keep the administrator's id
  ansible.builtin.set_fact:
    dfir_iris_admin_id: "{{ (dfir_iris_probe_body | from_json).data.user_id | int }}"

- name: Set the password
  ansible.builtin.include_tasks: probe.yml
  vars:
    dfir_iris_probe_path: "/manage/users/update/{{ dfir_iris_admin_id }}"
    dfir_iris_probe_keyed: true
    dfir_iris_probe_json: "{{ {'user_password': lookup('hnx_secret', dfir_iris_admin_login_ref)} | to_json }}"

- name: Refuse an update the API did not accept
  ansible.builtin.assert:
    that:
      - dfir_iris_probe_code == '200'
      - dfir_iris_probe_body is search('success')
    fail_msg: >-
      case-management: the API refused the administrator's password (status {{ dfir_iris_probe_code }});
      check it against the product's password policy
