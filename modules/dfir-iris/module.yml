# SPDX-License-Identifier: Apache-2.0
# The case-management provider on DFIR-IRIS (docs/modules.md; README.md beside this file): the web
# app and its background worker (one image, two commands), PostgreSQL, a message broker and the
# product's TLS front as compose_app containers in the module's slice, the database and the
# evidence under the module's data root. HTTPS only, with a certificate from the lab's internal CA;
# accounts of the product's own (auth: own), consumers call the API with the first administrator's
# API key; no public route. Every real value (the guest, its address, the names, the secret
# values) is the site's: the overlay's lab/modules.yml, lab/services.yml, group variables and
# secret store.
manifest_version: "1.0"
id: dfir-iris
kind: provider
title: Case management on DFIR-IRIS
description: Fills the case-management slot with DFIR-IRIS, its worker, PostgreSQL, a broker and the
  product's TLS front as compose_app containers; local accounts and an API key for consumers by
  reference; health that proves the API refuses a caller with no key and answers one with it; the
  database and the evidence exportable and restorable, so a fresh install is the default and the
  cases of an earlier instance can be carried in from its database dump.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: dfir-iris
  display: DFIR-IRIS
  version: 2.4.29
licence:
  kind: open-source
  spdx: LGPL-3.0-or-later
credentials:
  - secret: secret:dfir-iris/db-password
    identity: password
    holder: provider
    purpose: the database role's password, given to PostgreSQL at its first start and to the app and the worker at every start
  - secret: secret:dfir-iris/db-admin-password
    identity: password
    holder: provider
    purpose: the password of the database administrator role the product's own set-up creates and connects as
  - secret: secret:dfir-iris/session-key
    identity: key
    holder: provider
    purpose: the product's session and encryption key; after a migration it is the source instance's value, so its sessions and stored module settings still open
  - secret: secret:dfir-iris/password-salt
    identity: key
    holder: provider
    purpose: the salt the product hashes passwords with; after a migration it is the source instance's value, or its users' passwords no longer match
  - secret: secret:dfir-iris/admin-password
    identity: password
    holder: provider
    purpose: the first administrator's password, used only when the product meets an empty database (a restored database brings its own accounts)
  - secret: secret:dfir-iris/api-key
    identity: token
    holder: provider
    purpose: the first administrator's API key, the bearer token the consumers and the health hook call the API with; the role sets the key in the database to this value, fresh or restored
  - secret: secret:dfir-iris/threat-intel-key
    identity: token
    holder: provider
    purpose: a dedicated threat-intel account's API key (not the platform administrator's), set in the product's enrichment module; read only when dfir_iris_intel_enabled is on
  - secret: secret:dfir-iris/tls-cert
    identity: certificate
    holder: provider
    purpose: the server certificate (PEM, with its chain) the lab's internal CA issued for the service's internal name
  - secret: secret:dfir-iris/tls-key
    identity: private-key
    holder: provider
    purpose: the server certificate's private key (PEM), readable by the front's group only
  - secret: secret:dfir-iris/ca
    identity: certificate
    holder: provider
    purpose: the lab CA's certificate, what the role's health hook verifies the service with
identifiers:
  - {kind: secret-name, name: dfir-iris, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the passwords, keys, certificate and API key are read by name at deploy time
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 4, memory_mb: 6144, disk_gb: 30}
      guest:
        baselines: [base]
      roles: [role:dfir_iris]
      purpose: runs the web app, its worker, PostgreSQL, the broker and the TLS front (docker_engine applied first, compose_app renders them)
prefers:
  capabilities:
    - cap: cap:threat-intel
      provisional: true
      purpose: the product's bundled enrichment module enriches an IOC from the threat-intel platform over HTTPS with a dedicated account's key (dfir_iris_intel_enabled)
      fallback:
        behaviour: the enrichment module stays off and an IOC gets no threat-intel insight; every other function is unchanged
provides:
  slots:
    case-management:
      adapter: homelabnext.conform.adapters.case_management:make
      provisional: true
      reason: case-management has no contract yet; the standard is the API refusing a caller with no key, answering one with a valid key and reporting its version, which the role's health hook reads (the cases slot keeps the alert-to-case contract)
      migration: {formats: [object-tree], export: role:dfir_iris, import: role:dfir_iris}
egress: none  # the threat-intel platform is reached as a preferred capability (a slot grants no egress line)
contributes:
  roles:
    - file: roles/dfir_iris
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:dfir_iris, hook: readiness}
  docs:
    - file: README.md
    - file: CHANGELOG.md
data:
  - id: database
    kind: database
    description: The PostgreSQL database - every case, alert, note, IOC, asset, task, account (with its password hash and API key) and setting - as pg_dump's custom format with a sha256 listing.
    export: {formats: [object-tree], via: role:dfir_iris}
    import: {formats: [object-tree], via: role:dfir_iris}
    retention: {keep: forever}
  - id: files
    kind: files
    prefix: dfir-iris/files/
    description: The product's datastore (uploaded evidence and attachments), report templates and downloads, as a tar archive listed beside the database dump.
    export: {formats: [object-tree], via: role:dfir_iris}
    import: {formats: [object-tree], via: role:dfir_iris}
    retention: {keep: forever}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest) of one image: validated (never older than the running one) and recorded, the database and files exported, then converged; a newer product image migrates the database forward as it starts"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
