# Remove: export the store (export_first), stop and disable the unit, delete the unit and the files
# that hold credentials (the token digests, the events token's environment file, the runner homes'
# gateway keys). The data root with the export in it, the releases and the rest of the configuration
# are kept for the operator to archive or delete; the decommission audit (module.yml
# lifecycle.remove.audit) checks nothing still names the service.
- name: Remove the orchestration controller
  hosts: mod_orchestration_server
  become: true
  tasks:
    - name: Export the store first
      ansible.builtin.include_role:
        name: orchestration
        tasks_from: export
    - name: Stop and disable the unit
      ansible.builtin.command:
        argv: ["{{ orchestration_systemctl_cli | default('systemctl') }}", disable, --now, "hnx-{{ orchestration_logical_id }}.service"]
      changed_when: true
      failed_when: false
    - name: Delete the unit
      ansible.builtin.file:
        path: "{{ orchestration_systemd_dir | default('/etc/systemd/system') }}/hnx-{{ orchestration_logical_id }}.service"
        state: absent
    - name: Delete the files that hold credentials
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ orchestration_config_dir | default('/etc/hnx/orchestration') }}/api-tokens.yaml"
        - "{{ orchestration_config_dir | default('/etc/hnx/orchestration') }}/events.token"
    # the grants go with the controller: no rule may let a user that no longer runs anything start
    # a module's units (only a rule this role wrote, by its first line); run files and logs are kept
    - name: Find the polkit rules the role wrote for the module job units
      ansible.builtin.find:
        paths: "{{ orchestration_polkit_rules_dir | default('/etc/polkit-1/rules.d') }}"
        patterns: ["49-hnx-*.rules"]
        contains: '^// Managed by homelabnext \(role orchestration, service {{ orchestration_logical_id | regex_escape }}, '
        read_whole_file: false
        file_type: file
        recurse: false
      register: orchestration_remove_rules
    - name: Delete those polkit rules and the dispatch table
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ (orchestration_remove_rules.files | map(attribute='path') | list)
           + [(orchestration_config_dir | default('/etc/hnx/orchestration')) ~ '/dispatch.json'] }}
    - name: Reload systemd
      ansible.builtin.command:
        argv: ["{{ orchestration_systemctl_cli | default('systemctl') }}", daemon-reload]
      changed_when: true
