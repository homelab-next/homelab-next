# SPDX-License-Identifier: Apache-2.0
# Every credential the configuration needs resolves, in the form the controller and its callers
# take (a bearer token the broker's handler can put in a header: no space, no control character).
# A reference that is unset is refused here, before any file is written, never a half-configured
# service. Only the verdicts leave the no_log tasks.
- name: Start the verdicts empty (this file runs again from every hook)
  ansible.builtin.set_fact:
    orchestration_bearer_forms: {}
    orchestration_bearer_digests: []
  tags: [readiness, health]

- name: Read each caller's token form (and the digests, to refuse a token two callers share)
  ansible.builtin.set_fact:
    orchestration_bearer_forms: >-
      {{ orchestration_bearer_forms | combine({item.name: lookup('hnx_secret', item.secret) is match(orchestration_bearer_pattern)}) }}
    orchestration_bearer_digests: >-
      {{ orchestration_bearer_digests + [lookup('hnx_secret', item.secret) | hash('sha256')] }}
  loop: "{{ orchestration_callers }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  tags: [readiness, health]

- name: Read the events token's and the gateway key's forms, where they are used
  ansible.builtin.set_fact:
    orchestration_events_form: >-
      {{ true if orchestration_events_forwarder_url == ''
         else lookup('hnx_secret', orchestration_events_ref) is match(orchestration_bearer_pattern) }}
    orchestration_gateway_form: >-
      {{ true if orchestration_gateway_id == ''
         else (lookup('hnx_secret', orchestration_gateway_key_ref) | length >= 8
               and lookup('hnx_secret', orchestration_gateway_key_ref) is match('^[A-Za-z0-9._~+/=:-]+\Z')) }}
  no_log: true
  tags: [readiness, health]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - orchestration_bearer_forms.values() | select | list | length == orchestration_callers | length
      - orchestration_bearer_digests | unique | list | length == orchestration_callers | length
      - orchestration_events_form | bool
      - orchestration_gateway_form | bool
    fail_msg: >-
      orchestration: every caller's token must be 32 to 256 characters of letters, digits and . _ ~ + / = -
      (no space or control character), and different from every other caller's; the events token
      (when the forwarder is set) the same; the gateway key (when the gateway is set) 8 characters or
      more without a space. Forms by caller: {{ orchestration_bearer_forms }}; shared tokens:
      {{ orchestration_bearer_digests | length != orchestration_bearer_digests | unique | list | length }};
      events {{ orchestration_events_form }}; gateway key {{ orchestration_gateway_form }}
  tags: [readiness, health]
