# SPDX-License-Identifier: Apache-2.0
# The backup takes the data root whole (the VM's backup job, or a file backup of the manifest's
# paths) after the export has written a consistent MongoDB archive into it (export/), so a restore
# never depends on a live database caught between two writes. virtualenvs/, python/, mongo/'s
# files and the pack releases are rebuilt or are covered by the archive; the secrets are the
# secret store's, never in a backup of this host.
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Create the data directories
      ansible.builtin.include_tasks: dirs.yml
    - name: Dump and list
      ansible.builtin.include_tasks: dump.yml
    - name: Delegate to compose_app (the backup manifest names the data root)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: backup
      vars:
        compose_app_name: stackstorm
        compose_app_dir: "{{ stackstorm_app.compose_app_dir }}"
        compose_app_data_dir: "{{ stackstorm_app.compose_app_data_dir }}"
        compose_app_export_dir: "{{ stackstorm_app.compose_app_export_dir }}"
        compose_app_owner: "{{ stackstorm_app.compose_app_owner }}"
        compose_app_group: "{{ stackstorm_app.compose_app_group }}"
        compose_app_spec: "{{ stackstorm_app.compose_app_spec }}"
  tags: [backup]
