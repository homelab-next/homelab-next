# SPDX-License-Identifier: Apache-2.0
# Every credential resolves in its form before a container sees it. A reference with no value in
# the secret store stops the run here, by name, before anything is rendered or started. A failed
# lookup under no_log is reported as "output hidden", which would hide the one thing the operator
# needs (which reference has no value), so each reference is probed alone first: only whether it
# resolved is kept, and the refusal names references, never values.
- name: List the references this run needs
  ansible.builtin.set_fact:
    stackstorm_needed_refs: >-
      {{ [stackstorm_admin_login_ref, stackstorm_mongo_root_login_ref, stackstorm_mongo_login_ref,
          stackstorm_rabbitmq_login_ref, stackstorm_datastore_key_ref, stackstorm_kv_key_ref,
          stackstorm_webhook_key_ref, stackstorm_status_key_ref]
         + ([stackstorm_events_login_ref] if stackstorm_bridge_enabled | bool else [])
         + ([stackstorm_broker_key_ref] if stackstorm_broker_tunnel_enabled | bool else [])
         + ([stackstorm_events_forward_key_ref] if stackstorm_events_forward_enabled | bool else []) }}
  tags: [readiness]

- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    stackstorm_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop: "{{ stackstorm_needed_refs }}"
  loop_control:
    label: "{{ item }}"
  register: stackstorm_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: stackstorm_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      stackstorm: no value in the secret store for
      {{ stackstorm_needed_refs | zip(stackstorm_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Every credential resolves in its form
  ansible.builtin.assert:
    that:
      - lookup('hnx_secret', stackstorm_admin_login_ref) is match(stackstorm_admin_login_value_pattern)
      - lookup('hnx_secret', stackstorm_mongo_root_login_ref) is match(stackstorm_login_value_pattern)
      - lookup('hnx_secret', stackstorm_mongo_login_ref) is match(stackstorm_login_value_pattern)
      - lookup('hnx_secret', stackstorm_rabbitmq_login_ref) is match(stackstorm_login_value_pattern)
      - lookup('hnx_secret', stackstorm_kv_key_ref) is match(stackstorm_key_pattern)
      - lookup('hnx_secret', stackstorm_webhook_key_ref) is match(stackstorm_key_pattern)
      - lookup('hnx_secret', stackstorm_status_key_ref) is match(stackstorm_key_pattern)
      # the datastore key is the JSON st2-generate-symmetric-crypto-key writes (AES and HMAC halves)
      - (lookup('hnx_secret', stackstorm_datastore_key_ref) | from_json) is mapping
      - (lookup('hnx_secret', stackstorm_datastore_key_ref) | from_json).aesKeyString is defined
      - (lookup('hnx_secret', stackstorm_datastore_key_ref) | from_json).hmacKey is defined
      # no value serves two purposes
      - >-
        [lookup('hnx_secret', stackstorm_admin_login_ref), lookup('hnx_secret', stackstorm_mongo_root_login_ref),
         lookup('hnx_secret', stackstorm_mongo_login_ref), lookup('hnx_secret', stackstorm_rabbitmq_login_ref),
         lookup('hnx_secret', stackstorm_kv_key_ref), lookup('hnx_secret', stackstorm_webhook_key_ref),
         lookup('hnx_secret', stackstorm_status_key_ref)] | unique | list | length == 7
    fail_msg: >-
      stackstorm: the admin password (16 to 128 of A-Z a-z 0-9 . _ ~ -), the database, root and broker
      passwords (24 to 128 of the same), the datastore key's name-key (32 to 128 of the same), the two API
      keys (32 to 128 of the same) must resolve, each different from the others, and the datastore key
      must be the JSON `st2-generate-symmetric-crypto-key` writes (aesKeyString and hmacKey)
  no_log: true
  tags: [readiness]

- name: Every credential of the optional services resolves in its form
  ansible.builtin.assert:
    that:
      - stackstorm_bridge_enabled | bool is false or lookup('hnx_secret', stackstorm_events_login_ref) is match('^[^\s\x00-\x1f\x7f]{8,256}\Z')
      - stackstorm_broker_tunnel_enabled | bool is false or lookup('hnx_secret', stackstorm_broker_key_ref) is match('(?s)^-{5}BEGIN OPENSSH PRIVATE KEY-{5}\n.*\n-{5}END OPENSSH PRIVATE KEY-{5}\n?\Z')
      - stackstorm_events_forward_enabled | bool is false or lookup('hnx_secret', stackstorm_events_forward_key_ref) is match('(?s)^-{5}BEGIN OPENSSH PRIVATE KEY-{5}\n.*\n-{5}END OPENSSH PRIVATE KEY-{5}\n?\Z')
    fail_msg: >-
      stackstorm: the bus password (8 to 256 characters, no whitespace) and the broker and bus forwards'
      keys (OpenSSH private keys) must resolve in their forms
  no_log: true
  tags: [readiness]
