# The bus forward: the bridge reaches a bus that listens on loopback on another host through an SSH
# local forward, as a login on the bus host whose key and sshd Match block allow that one forward
# (role events_bus, events_bus_forward_logins). The key is the forward user's alone (owner-only),
# the bus host's key is pinned, and a forward that cannot be set up fails the service.
- name: The bus forward's own user (no shell, no home)
  ansible.builtin.user:
    name: "{{ stackstorm_events_forward_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: The bus forward's directory
  ansible.builtin.file:
    path: "{{ stackstorm_events_forward_state_dir }}"
    state: directory
    owner: root
    group: "{{ stackstorm_events_forward_user }}"
    mode: "0750"

- name: Write the bus forward's key (owner-only)
  ansible.builtin.copy:
    dest: "{{ stackstorm_events_forward_state_dir }}/events.key"
    content: "{{ lookup('hnx_secret', stackstorm_events_forward_key_ref) | trim }}\n"
    owner: "{{ stackstorm_events_forward_user }}"
    group: "{{ stackstorm_events_forward_user }}"
    mode: "0400"
  no_log: true
  register: stackstorm_events_tunnel_key

- name: Pin the bus host's key
  ansible.builtin.copy:
    dest: "{{ stackstorm_events_forward_state_dir }}/known_hosts"
    content: "{{ stackstorm_events_forward_host_key }}\n"
    owner: root
    group: "{{ stackstorm_events_forward_user }}"
    mode: "0644"
  register: stackstorm_events_tunnel_hosts

- name: Write the bus forward's unit
  ansible.builtin.template:
    src: events-tunnel.service.j2
    dest: "{{ stackstorm_unit_dir }}/hnx-st2-events-tunnel.service"
    owner: root
    group: root
    mode: "0644"
  register: stackstorm_events_tunnel_unit

- name: Start the bus forward
  ansible.builtin.systemd_service:
    name: hnx-st2-events-tunnel.service
    enabled: true
    state: "{{ 'restarted' if (stackstorm_events_tunnel_unit is changed or stackstorm_events_tunnel_key is changed or stackstorm_events_tunnel_hosts is changed) else 'started' }}"
    daemon_reload: "{{ stackstorm_events_tunnel_unit is changed }}"
  when: stackstorm_start | bool and not ansible_check_mode
