      stackstorm_data_root: *id020
      stackstorm_uid: *id021
      stackstorm_gid: *id022
      stackstorm_mongo_uid: *id023
      stackstorm_mongo_gid: *id024
      stackstorm_rabbitmq_uid: *id025
      stackstorm_rabbitmq_gid: *id026
      stackstorm_redis_uid: *id027
      stackstorm_redis_gid: *id028
      stackstorm_start: *id029
      stackstorm_validate_with_docker: *id030
      stackstorm_health_timeout: *id031
      stackstorm_ready_timeout: *id032
