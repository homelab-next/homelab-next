# Install and converge the sensor. Order matters and is the safety design:
#   package -> configuration written (the previous copy kept) -> rules -> HOME_NET generated and
#   tested by suricata_enroll (a staged copy of the whole configuration, suricata -T) -> a final
#   suricata -T of the live configuration, the deploy gate (LL-281: a ruleset that does not load
#   leaves a sensor that looks up and sees nothing) -> only then the service is started or restarted.
# A failed gate restores the previous configuration and stops the run; the running sensor is untouched.
- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Preflight the capture interfaces and the guest list
  ansible.builtin.include_tasks: readiness.yml

- name: Install the pinned package and the rule updater
  ansible.builtin.apt:
    name:
      - "suricata={{ suricata_package_version }}"
      - suricata-update
      - logrotate
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: suricata_install_packages | bool

- name: Create the log and rule directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: ["{{ suricata_log_dir }}", "{{ suricata_lib_dir }}"]

- name: Is the sensor running now
  ansible.builtin.command:
    argv: ["{{ suricata_systemctl_cli }}", is-active, --quiet, suricata.service]
  register: suricata_was_active
  changed_when: false
  failed_when: false
  check_mode: false
  when: suricata_service_manage | bool

- name: Is there a configuration already
  ansible.builtin.stat:
    path: "{{ suricata_config_dir }}/{{ suricata_config_file }}"
  register: suricata_prev

- name: Would the configuration change
  ansible.builtin.template:
    src: suricata.yaml.j2
    dest: "{{ suricata_config_dir }}/{{ suricata_config_file }}"
    mode: "0644"
  check_mode: true
  register: suricata_conf_would

- name: Keep the previous configuration to restore if the gate fails (only when it is about to change)
  ansible.builtin.copy:
    src: "{{ suricata_config_dir }}/{{ suricata_config_file }}"
    dest: "{{ suricata_config_dir }}/{{ suricata_config_file }}.hnx-prev"
    remote_src: true
    mode: "0644"
  when: suricata_prev.stat.exists and suricata_conf_would is changed

- name: Render the configuration
  ansible.builtin.template:
    src: suricata.yaml.j2
    dest: "{{ suricata_config_dir }}/{{ suricata_config_file }}"
    mode: "0644"
  register: suricata_conf

- name: Rules, HOME_NET and the gate
  block:
    - name: Enable the rule sources and fetch the rules
      ansible.builtin.include_tasks: rules.yml

    - name: Generate HOME_NET from the enrolled guests (tested with the whole configuration)
      ansible.builtin.include_role:
        name: suricata_enroll
      vars:
        suricata_enroll_guests: "{{ suricata_guests }}"
        suricata_enroll_config_dir: "{{ suricata_config_dir }}"
        suricata_enroll_config_file: "{{ suricata_config_file }}"
        suricata_enroll_groups_file: "{{ suricata_groups_file }}"
        suricata_enroll_suricata_cli: "{{ suricata_cli }}"
        suricata_enroll_suricatasc_cli: "{{ suricata_suricatasc_cli }}"
        suricata_enroll_reload: "{{ (suricata_reload | bool) and (suricata_was_active.rc | default(1)) == 0 and suricata_conf is not changed }}"

    - name: The deploy gate, a full load of the live configuration and ruleset (suricata -T)
      ansible.builtin.command:
        argv: ["{{ suricata_cli }}", -T, -c, "{{ suricata_config_dir }}/{{ suricata_config_file }}"]
      changed_when: false
      check_mode: false
  rescue:
    - name: Restore the previous configuration
      ansible.builtin.copy:
        src: "{{ suricata_config_dir }}/{{ suricata_config_file }}.hnx-prev"
        dest: "{{ suricata_config_dir }}/{{ suricata_config_file }}"
        remote_src: true
        mode: "0644"
      when: suricata_prev.stat.exists and suricata_conf is changed
    - name: Stop the run; the running sensor was not touched
      ansible.builtin.fail:
        msg: >-
          suricata: the configuration or ruleset did not load (suricata -T) or HOME_NET was refused;
          the previous configuration was restored and the running sensor was not restarted

- name: Alert-only log for the SIEM agent
  ansible.builtin.include_tasks: siem.yml
  when: suricata_siem_agent_manage | bool

- name: Rotation rule
  ansible.builtin.include_tasks: units.yml

- name: Start the sensor, or restart it only when its configuration changed
  when: suricata_service_manage | bool
  block:
    - name: Enable and start
      ansible.builtin.systemd:
        name: suricata.service
        enabled: true
        state: started
        daemon_reload: true
    - name: Restart for a changed configuration (the gate passed)
      ansible.builtin.systemd:
        name: suricata.service
        state: restarted
      when: suricata_conf is changed and (suricata_was_active.rc | default(1)) == 0
