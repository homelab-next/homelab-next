# Every secret resolves, in a form an environment file can carry (one line, no quote or space). A
# reference with no secret behind it is refused here, before any file is written. Only verdicts
# leave the no_log task.
- name: Read each secret's form
  ansible.builtin.set_fact:
    alert_intake_ref_forms:
      webhook: "{{ lookup('hnx_secret', alert_intake_webhook_login_ref) is match(alert_intake_forms.hook) }}"
      cases: "{{ lookup('hnx_secret', alert_intake_cases_key_ref) is match(alert_intake_forms.store) }}"
      notify: "{{ lookup('hnx_secret', alert_intake_notify_login_ref) is match(alert_intake_forms.hook) }}"
      distinct: "{{ lookup('hnx_secret', alert_intake_webhook_login_ref) not in [lookup('hnx_secret', alert_intake_cases_key_ref), lookup('hnx_secret', alert_intake_notify_login_ref)] }}"
      cases_ca: "{{ lookup('hnx_secret', alert_intake_cases_ca_ref) is search('-----BEGIN CERTIFICATE-----') }}"
      notify_ca: "{{ alert_intake_notify_ca_ref == '' or lookup('hnx_secret', alert_intake_notify_ca_ref) is search('-----BEGIN CERTIFICATE-----') }}"
  no_log: true
  tags: [readiness, health]

- name: Every secret has its form
  ansible.builtin.assert:
    that: alert_intake_ref_forms.values() | reject | list | length == 0
    fail_msg: >-
      alert-intake: a secret is missing or malformed (forms: {{ alert_intake_ref_forms }}): the webhook
      token {{ alert_intake_webhook_login_ref }} and the notification token {{ alert_intake_notify_login_ref }} must
      be 24 to 256 characters from A-Z a-z 0-9 and . _ ~ + / = -, the case store's key
      {{ alert_intake_cases_key_ref }} 8 to 512 characters from A-Z a-z 0-9 and . _ ~ + / = : @ % ^ - (it
      is written into a systemd environment file), the webhook token different from both, the CAs PEM
  tags: [readiness, health]
