# Upgrade: the module pins no artefact or image (its script ships with the role), so an upgrade is a
# validated re-converge: the upgrade hook refuses a live state that is not this module's form, the state is
# exported first, then the role converges on the new script. Run the health hook after.
#   ansible-playbook -i <inventory> modules/alert-intake/playbooks/upgrade.yml
- name: Upgrade the alert webhook
  hosts: mod_alert_intake_server
  become: true
  tasks:
    - name: Validate the upgrade
      ansible.builtin.include_role:
        name: alert_intake
        tasks_from: upgrade
    - name: Export the state first
      ansible.builtin.include_role:
        name: alert_intake
        tasks_from: export
    - name: Converge on the new script
      ansible.builtin.include_role:
        name: alert_intake
