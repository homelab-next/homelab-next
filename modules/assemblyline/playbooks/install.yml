# Install (and converge) the file-analysis provider on the guest the site placed the module's `server`
# role on. The apply path (docs/modules/apply.md) renders its own modules.yml from the selection and
# does not import this file; it is the module's own entry point, for a lab that runs one module by hand:
#   ansible-playbook -i <inventory with --selection> modules/assemblyline/playbooks/install.yml
# docker_engine is applied first; the role's readiness hook refuses to go on without it, without
# the image archive and without the credentials.
- name: Install the file-analysis provider
  hosts: mod_assemblyline_server
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: assemblyline
        tasks_from: readiness
      tags: [mod_assemblyline]
  roles:
    - role: assemblyline
      tags: [mod_assemblyline]
