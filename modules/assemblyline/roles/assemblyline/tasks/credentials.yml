# Every credential resolves in its form, and is not one of the appliance's own defaults, before a
# container sees it. Each reference is probed alone first so a missing one is named; no value is printed.
- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    assemblyline_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop: "{{ assemblyline_refs }}"
  loop_control:
    label: "{{ item }}"
  register: assemblyline_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: assemblyline_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      assemblyline: no value in the secret store for
      {{ assemblyline_refs | zip(assemblyline_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Every credential is long enough, free of quote and line break, and not an appliance default
  ansible.builtin.assert:
    that:
      - lookup('hnx_secret', item) | length >= assemblyline_secret_min_length | int
      - lookup('hnx_secret', item) is not search("['\"\\n\\r$ ]")
      - lookup('hnx_secret', item) not in assemblyline_default_passwords
    fail_msg: >-
      assemblyline: {{ item }} must be at least {{ assemblyline_secret_min_length }} characters with no quote, space, dollar sign
      or line break, and never one of the appliance's own defaults
  loop: "{{ assemblyline_refs }}"
  loop_control:
    label: "{{ item }}"
  no_log: true
  tags: [readiness]

- name: No two credentials are the same value
  ansible.builtin.assert:
    that:
      - >-
        [lookup('hnx_secret', assemblyline_admin_login_ref), lookup('hnx_secret', assemblyline_elastic_login_ref),
         lookup('hnx_secret', assemblyline_filestore_login_ref), lookup('hnx_secret', assemblyline_service_key_ref)]
        | unique | length == 4
    fail_msg: "assemblyline: the administrator's, the datastore's, the object store's and the service key's secrets must be four different values"
  no_log: true
  tags: [readiness]
