# Upgrade: validate and record a pinned image bump (iceberg_rest_target_image, tag
# and digest), export the catalog file first, then converge with the new pin (set iceberg_rest_image to the
# target in the overlay).
#   ansible-playbook -i <inventory> modules/iceberg-rest/playbooks/upgrade.yml -e iceberg_rest_target_image=<ref>
- name: Upgrade the Iceberg REST catalog
  hosts: mod_iceberg_rest_server
  become: true
  tasks:
    - name: Validate and record the bump
      ansible.builtin.include_role:
        name: iceberg_rest
        tasks_from: upgrade
    - name: Export the catalog file before the new image opens it
      ansible.builtin.include_role:
        name: iceberg_rest
        tasks_from: export
    - name: Converge on the new pin
      ansible.builtin.include_role:
        name: iceberg_rest
      vars:
        iceberg_rest_image: "{{ iceberg_rest_target_image }}"
