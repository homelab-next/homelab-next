# Fixed, not settings: role vars outrank inventory, so a deployment cannot loosen them.
iceberg_rest_container_port: 8181
iceberg_rest_container_data_dir: /data
iceberg_rest_db_file: iceberg_catalog.db
# the server's settings (CATALOG_* are read by the catalog, AWS_* by the object-store client)
iceberg_rest_fixed_env:
  REST_PORT: "8181"
  CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
  CATALOG_JDBC_USER: user
  CATALOG_JDBC_STRICT__MODE: "true"
  CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
  CATALOG_S3_PATH__STYLE__ACCESS: "true"
  # Garage does not support the streaming-unsigned-payload checksum the AWS SDK sends by default
  # since 2.30: without this every write fails with "Invalid payload signature"
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
iceberg_rest_ref_pattern: '^secret:[a-z0-9][a-z0-9/_.-]*\Z'
iceberg_rest_path_pattern: '^(/(?!\.\.?(?:/|\Z))[A-Za-z0-9_.-]+)+\Z'
iceberg_rest_warehouse_pattern: '^s3://[a-z0-9][a-z0-9-]{1,61}[a-z0-9]/\Z'
iceberg_rest_region_pattern: '^[a-z][a-z0-9-]{1,31}\Z'
iceberg_rest_url_pattern: '^https?://[A-Za-z0-9.-]+:[0-9]{1,5}\Z'
iceberg_rest_key_id_pattern: '^GK[0-9a-f]{24,32}\Z'
iceberg_rest_hex64_pattern: '^[0-9a-f]{64}\Z'
iceberg_rest_repository: "{{ iceberg_rest_image.split('@')[0].rsplit(':', 1)[0] }}"
iceberg_rest_tag: "{{ iceberg_rest_image.split('@')[0].rsplit(':', 1)[1] | default('') }}"
iceberg_rest_digest: "{{ iceberg_rest_image.split('@')[1] | default('') }}"
# The export (docs/modules/data.md, object-tree): iceberg_catalog.db copied with SQLite's online
# backup (consistent while the server writes), then listing.jsonl (key, size, sha256).
iceberg_rest_export_script: |
  import hashlib, json, os, pathlib, sqlite3, sys
  src, dst, name = sys.argv[1], sys.argv[2], sys.argv[3]
  path = os.path.join(src, name)
  if not os.path.isfile(path) or os.path.islink(path):
      sys.exit("export: " + path + " is missing (or a link)")
  tmp = os.path.join(dst, "." + name + ".tmp")
  if os.path.lexists(tmp):
      os.unlink(tmp)
  a = sqlite3.connect(pathlib.Path(path).as_uri() + "?mode=ro", uri=True)
  b = sqlite3.connect(tmp)
  a.backup(b)
  a.close(); b.close()
  os.chmod(tmp, 0o600)
  os.replace(tmp, os.path.join(dst, name))
  h = hashlib.sha256()
  with open(os.path.join(dst, name), "rb") as f:
      for chunk in iter(lambda: f.read(1 << 20), b""):
          h.update(chunk)
  row = {"key": name, "size": os.path.getsize(os.path.join(dst, name)), "sha256": h.hexdigest()}
  tmp = os.path.join(dst, ".listing.jsonl.tmp")
  with open(tmp, "w", encoding="utf-8") as f:
      f.write(json.dumps(row, sort_keys=True) + "\n")
  os.chmod(tmp, 0o600)
  os.replace(tmp, os.path.join(dst, "listing.jsonl"))
  print(json.dumps([row]))
# The restore (import): two passes of one script, run as root.
#   check SRC NAME UID        reads, never writes: one listed file, a single-link regular file of the
#                             listed size and sha256, an SQLite database that passes integrity_check;
#                             the directory and the files belong to root or the container's user
#                             (UID) and are writable by no one else
#   apply SRC DB UID GID NAME with the server stopped: copies through the descriptor that was
#                             opened, re-hashes the copy, removes the stale -wal/-shm/-journal and
#                             renames it into place, owned by the container's user, 0600
iceberg_rest_restore_script: |
  import hashlib, json, os, pathlib, sqlite3, stat, sys
  mode, src = sys.argv[1], sys.argv[2]
  name = sys.argv[3] if mode == "check" else sys.argv[6]
  owner = int(sys.argv[4]) if mode == "check" else int(sys.argv[4])
  def fail(why):
      sys.exit("restore refused: " + why)
  nf = os.O_NOFOLLOW | getattr(os, "O_CLOEXEC", 0)
  try:
      dfd = os.open(src, os.O_RDONLY | os.O_DIRECTORY | nf)
  except OSError:
      fail("the source is not a directory (or is a link)")
  def opened(n):
      try:
          fd = os.open(n, os.O_RDONLY | nf, dir_fd=dfd)
      except OSError:
          fail(n + ": cannot be opened (missing, or a link)")
      st = os.fstat(fd)
      if not stat.S_ISREG(st.st_mode) or st.st_nlink != 1:
          fail(n + ": not a single-link regular file")
      if st.st_uid not in (0, owner) or st.st_mode & 0o022:
          fail(n + " must belong to root or the container's user and be writable by no one else")
      return fd, st
  dst = os.fstat(dfd)
  if dst.st_uid not in (0, owner) or dst.st_mode & 0o022:
      fail("the source directory must belong to root or the container's user and be writable by no one else")
  fd, _ = opened("listing.jsonl")
  with os.fdopen(fd, encoding="utf-8") as f:
      rows = [json.loads(x) for x in f.read(1 << 16).splitlines() if x.strip()]
  if len(rows) != 1 or rows[0].get("key") != name:
      fail("the listing must name exactly " + name)
  if set(os.listdir(dfd)) - {"listing.jsonl"} != {name}:
      fail("the source holds files the listing does not name")
  fd, st = opened(name)
  if st.st_size != rows[0].get("size"):
      fail(name + ": not the listed size")
  def hashed(fd, out=None):
      h = hashlib.sha256()
      while True:
          chunk = os.read(fd, 1 << 20)
          if not chunk:
              return h.hexdigest()
          h.update(chunk)
          if out is not None:
              out.write(chunk)
  def sound(path):
      c = sqlite3.connect(pathlib.Path(path).as_uri() + "?mode=ro&immutable=1", uri=True)
      try:
          return c.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
      finally:
          c.close()
  if mode == "check":
      if hashed(fd) != rows[0].get("sha256"):
          fail(name + ": sha256 differs from the listing")
      os.close(fd)
      print(json.dumps([name]))
      sys.exit(0)
  db, uid, gid = sys.argv[3], int(sys.argv[4]), int(sys.argv[5])
  staged = os.path.join(db, "." + name + ".restore")
  if os.path.lexists(staged):
      os.unlink(staged)
  ofd = os.open(staged, os.O_WRONLY | os.O_CREAT | os.O_EXCL | nf, 0o600)
  with os.fdopen(ofd, "wb") as out:
      got = hashed(fd, out)
      out.flush(); os.fsync(out.fileno())
  os.close(fd)
  if got != rows[0].get("sha256") or not sound(staged):
      os.unlink(staged)
      fail(name + ": the staged copy differs from the listing or fails integrity_check")
  os.chown(staged, uid, gid)
  for suffix in ("-wal", "-shm", "-journal"):
      if os.path.lexists(os.path.join(db, name + suffix)):
          os.unlink(os.path.join(db, name + suffix))
  os.replace(staged, os.path.join(db, name))
  print(json.dumps([name]))
