# Both credentials resolve and have the object store's form (a key id of GK and 24 to 32 hex
# digits, a secret of 64 hex digits). Only the verdicts leave the no_log task.
- name: Read each credential's form
  ansible.builtin.set_fact:
    iceberg_rest_forms:
      key_id: "{{ lookup('hnx_secret', iceberg_rest_access_key_ref) is match(iceberg_rest_key_id_pattern) }}"
      key_value: "{{ lookup('hnx_secret', iceberg_rest_signing_ref) is match(iceberg_rest_hex64_pattern) }}"
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - iceberg_rest_forms.key_id | bool
      - iceberg_rest_forms.key_value | bool
    fail_msg: >-
      iceberg-rest: {{ iceberg_rest_access_key_ref }} must be GK and 24 to 32 hex digits and
      {{ iceberg_rest_signing_ref }} 64 hex digits; forms: {{ iceberg_rest_forms }}
  tags: [readiness]
