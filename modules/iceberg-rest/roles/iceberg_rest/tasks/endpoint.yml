# The object store's scheme://host:port: the override, else the registry row of
# iceberg_rest_object_store_id (which must be an object-store).
- name: Refuse an id that is not an object store
  ansible.builtin.assert:
    that: iceberg_rest_s3_url != '' or lookup('hnx_registry', iceberg_rest_object_store_id, field='capability') == 'object-store'
    fail_msg: "iceberg-rest: the registry row {{ iceberg_rest_object_store_id }} is not an object-store"
  tags: [readiness, health, backup, restore, export, upgrade]

- name: Resolve the object store's address
  ansible.builtin.set_fact:
    iceberg_rest_s3_endpoint: "{{ iceberg_rest_s3_url if iceberg_rest_s3_url != '' else lookup('hnx_registry', iceberg_rest_object_store_id, field='url') }}"
  tags: [readiness, health, backup, restore, export, upgrade]
