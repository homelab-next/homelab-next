# SPDX-License-Identifier: Apache-2.0
# The backup takes the data root whole (the VM's backup job, or a file backup of the manifest's
# paths); the export first writes a consistent copy of the catalog file (SQLite's online backup),
# so a restore never depends on the live file being caught between two writes.
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Create the data directories
      ansible.builtin.include_tasks: dirs.yml
    - name: Copy the catalog file consistently (the export)
      ansible.builtin.include_tasks: copy_out.yml
    - name: Delegate to compose_app (the backup manifest names the data root)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: backup
      vars:
        compose_app_name: iceberg-rest
        compose_app_dir: "{{ iceberg_rest_app.compose_app_dir }}"
        compose_app_data_dir: "{{ iceberg_rest_app.compose_app_data_dir }}"
        compose_app_export_dir: "{{ iceberg_rest_app.compose_app_export_dir }}"
        compose_app_owner: "{{ iceberg_rest_app.compose_app_owner }}"
        compose_app_group: "{{ iceberg_rest_app.compose_app_group }}"
        compose_app_spec: "{{ iceberg_rest_app.compose_app_spec }}"
  tags: [backup]
