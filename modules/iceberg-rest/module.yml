# SPDX-License-Identifier: Apache-2.0
# The lake-catalog provider on the Apache Iceberg REST catalog (docs/modules.md; README.md beside
# this file): the project's REST catalog server (its reference "fixture" build, the one the old
# lab's lake runs) as one compose_app container, with the catalog kept in one SQLite file on the
# data root. It carries the old lake's catalog as it was: the same build (pinned by digest), the
# same warehouse (s3://iceberg-warehouse/) and the same SQLite file. Every real value (the guest, its
# address, the secret values) is the site's: the overlay's lab/modules.yml, lab/services.yml and
# secret store.
manifest_version: "1.0"
id: iceberg-rest
kind: provider
title: Lake catalog on the Apache Iceberg REST catalog
description: Fills the lake-catalog slot with the Apache Iceberg REST catalog server, one compose_app
  container over a SQLite catalog file and the object store's warehouse bucket; proved by the
  lake-catalog conformance suite through the shared lake adapter.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: iceberg-rest-fixture
  display: Apache Iceberg REST catalog
  version: 2026.4.29-b0df3ca
licence:
  kind: open-source
  spdx: Apache-2.0
credentials:
  - secret: secret:iceberg-rest/s3-access-key
    identity: key-id
    holder: provider
    purpose: the object store's lake key id; the catalog writes table metadata with it (the same value as the object store's own access key)
  - secret: secret:iceberg-rest/s3-secret-key
    identity: password
    holder: provider
    purpose: the object store's lake key secret (the same value as the object store's own secret key)
identifiers:
  - {kind: secret-name, name: iceberg-rest, on_remove: keep}
  - {kind: lake-namespace, name: iceberg, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the key pair is read by name at deploy time
    - cap: cap:object-store
      version: "1.0"
      purpose: the warehouse bucket the catalog writes its table metadata into
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 1, memory_mb: 2048, disk_gb: 4}
      guest:
        baselines: [base]
      roles: [role:iceberg_rest]
      purpose: runs the catalog container (docker_engine applied first, compose_app renders it)
provides:
  slots:
    lake-catalog:
      adapter: homelabnext.conform.adapters.lake:make_lake
      conformance:
        target: conformance/target.yml
      # the slot's export format is Parquet: the tables' Parquet files are the object store's (its
      # own migration exports them as an object-tree) and this role exports and restores the
      # catalog's database, the pointers to them; together they are the lake (README, "Migration")
      migration: {formats: [parquet], export: role:iceberg_rest, import: role:iceberg_rest}
egress: none
contributes:
  roles:
    - file: roles/iceberg_rest
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:iceberg_rest, hook: readiness}
  docs:
    - file: README.md
data:
  - id: catalog
    kind: database
    description: The catalog database (iceberg_catalog.db, SQLite) - the namespaces, the tables and the pointer to each table's current metadata file; the data itself is in the object store.
    export: {formats: [object-tree], via: role:iceberg_rest}
    import: {formats: [object-tree], via: role:iceberg_rest}
    retention: {keep: forever}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest): the role's upgrade hook validates and records it, the catalog file is exported, then it converges"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
