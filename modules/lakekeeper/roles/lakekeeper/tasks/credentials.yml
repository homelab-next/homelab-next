# SPDX-License-Identifier: Apache-2.0
# Every credential resolves in its form before a container sees it: the database password fits a URL
# and the env_file (no quote, no line break), the encryption key is long, the key pair has the object
# store's form (a key id of GK and 24 to 32 hex digits, a secret of 64 hex digits). Only the verdicts
# leave the no_log task.
- name: Read each credential's form
  ansible.builtin.set_fact:
    lakekeeper_forms:
      db_login: "{{ lookup('hnx_secret', lakekeeper_db_login_ref) is match(lakekeeper_db_login_pattern) }}"
      encryption_key: "{{ lookup('hnx_secret', lakekeeper_encryption_key_ref) is match(lakekeeper_encryption_key_pattern) }}"
      key_id: "{{ lookup('hnx_secret', lakekeeper_access_key_ref) is match(lakekeeper_key_id_pattern) }}"
      key_value: "{{ lookup('hnx_secret', lakekeeper_signing_ref) is match(lakekeeper_hex64_pattern) }}"
      distinct: "{{ [lookup('hnx_secret', lakekeeper_db_login_ref), lookup('hnx_secret', lakekeeper_encryption_key_ref)] | unique | length == 2 }}"
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - lakekeeper_forms.db_login | bool
      - lakekeeper_forms.encryption_key | bool
      - lakekeeper_forms.key_id | bool
      - lakekeeper_forms.key_value | bool
      - lakekeeper_forms.distinct | bool
    fail_msg: >-
      lakekeeper: {{ lakekeeper_db_login_ref }} must be 24 to 128 of A-Z a-z 0-9 . _ ~ -,
      {{ lakekeeper_encryption_key_ref }} 32 to 256 of A-Z a-z 0-9 . _ ~ + / = - and different from it,
      {{ lakekeeper_access_key_ref }} GK and 24 to 32 hex digits and {{ lakekeeper_signing_ref }} 64 hex
      digits; forms: {{ lakekeeper_forms }}
  tags: [readiness]
