# The registry row (platform/service) this provider contributes: keyed by the slot, renamed to the
# instance the site selects; version is product.version, host the module's host role (docs/modules/
# registry-rows.md). Internal only, no public route. Authentication is OFF (the catalog's allow-all
# authorization backend, no OIDC provider configured), so the network is the only control and it is
# a HARD REQUIREMENT, exactly as for the catalog this replaces: the Proxmox VM-level (NIC) firewall
# rendered from the overlay's guest file admits only the query engine and the lake's writers to the
# port. A firewall on the guest does not help: Docker's published ports bypass its INPUT chain. From a
# non-admitted host, the port must time out (README, "The catalog has no sign-in"). Clients use the
# base path /catalog and the warehouse NAME (README, "Client settings").
services:
  lake-catalog:
    capability: lake-catalog
    impl: lakekeeper
    host: server
    protocol: http
    port: 8181
    health: {kind: http, path: /health, expect_status: 200}
    upstreams: [object-store]
    owner: operator
    tls: none
    auth: none
    tags: [data, catalog]
    description: The Iceberg REST catalog on Lakekeeper over PostgreSQL; clients use /catalog and the warehouse name. No sign-in, no public route.
