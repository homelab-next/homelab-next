# SPDX-License-Identifier: Apache-2.0
# The lake-catalog provider on Lakekeeper (docs/modules.md; README.md beside this file): the Iceberg REST
# catalog as two compose_app containers, the catalog server and its PostgreSQL, in the module's slice.
# It takes over a lake whose tables already exist by REGISTERING each at its current metadata file
# (tools/migrate/catalog_register.py): no data or metadata file is copied, rewritten or deleted.
# Every real value (the guest, its address, the secret values) is the site's: the overlay's
# lab/modules.yml, lab/services.yml and secret store.
manifest_version: "1.0"
id: lakekeeper
kind: provider
title: Lake catalog on Lakekeeper
description: Fills the lake-catalog slot with Lakekeeper over PostgreSQL, one warehouse on the object
  store's bucket with deletes soft and tables protectable, the catalog database dumped for backup and
  restore; proved by the lake-catalog conformance suite through the shared lake adapter.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: lakekeeper
  display: Lakekeeper
  version: 0.14.1
licence:
  kind: open-source
  spdx: Apache-2.0
credentials:
  - secret: secret:lakekeeper/pg-password
    identity: password
    holder: provider
    purpose: the catalog database role's password, given to PostgreSQL at its first start and to the catalog at every start
  - secret: secret:lakekeeper/encryption-key
    identity: password
    holder: provider
    purpose: the key that encrypts the stored warehouse credential in the catalog database; create-only, never changed (losing it loses the stored credential)
  - secret: secret:lakekeeper/s3-access-key
    identity: key-id
    holder: provider
    purpose: the object store's lake key id, stored (encrypted) in the warehouse and used by the catalog to write table metadata
  - secret: secret:lakekeeper/s3-secret-key
    identity: password
    holder: provider
    purpose: the object store's lake key secret (the same value as the object store's own secret key)
identifiers:
  - {kind: secret-name, name: lakekeeper, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the database password, the encryption key and the object store key pair are read by name at deploy time
    - cap: cap:object-store
      version: "1.0"
      purpose: the warehouse bucket the catalog writes its table metadata into
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 1, memory_mb: 1536, disk_gb: 10}
      guest:
        baselines: [base]
      roles: [role:lakekeeper]
      purpose: runs the catalog and its PostgreSQL (docker_engine applied first, compose_app renders both)
provides:
  slots:
    lake-catalog:
      adapter: homelabnext.conform.adapters.lake:make_lake
      conformance:
        target: conformance/target.yml
      # the tables' Parquet files are the object store's (its own migration exports them as an
      # object-tree); this role exports and restores the catalog database, the pointers to them
      migration: {formats: [parquet], export: role:lakekeeper, import: role:lakekeeper}
egress: none
contributes:
  roles:
    - file: roles/lakekeeper
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:lakekeeper, hook: readiness}
  docs:
    - file: README.md
data:
  - id: catalog
    kind: database
    description: The catalog database (PostgreSQL, dumped in custom format) - the warehouse, the namespaces, the tables and the pointer to each table's current metadata file; the data itself is in the object store.
    export: {formats: [object-tree], via: role:lakekeeper}
    import: {formats: [object-tree], via: role:lakekeeper}
    retention: {keep: forever}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest): the role's upgrade hook validates and records it, the catalog database is dumped, then it converges and runs the one-way schema migration"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
