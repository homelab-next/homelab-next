# SPDX-License-Identifier: Apache-2.0
# Both passwords resolve, are long enough to be a password and are two different values. Only the
# verdicts leave the no_log task.
- name: Read each credential's form
  ansible.builtin.set_fact:
    caldera_forms:
      admin_long: "{{ lookup('hnx_secret', caldera_admin_login_ref) | length >= 12 }}"
      red_long: "{{ lookup('hnx_secret', caldera_red_login_ref) | length >= 12 }}"
      distinct: "{{ lookup('hnx_secret', caldera_admin_login_ref) != lookup('hnx_secret', caldera_red_login_ref) }}"
      plain: "{{ (lookup('hnx_secret', caldera_admin_login_ref) ~ lookup('hnx_secret', caldera_red_login_ref)) is match('^[\\x21-\\x7e]+\\Z') }}"
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - caldera_forms.admin_long | bool
      - caldera_forms.red_long | bool
      - caldera_forms.distinct | bool
      - caldera_forms.plain | bool
    fail_msg: >-
      caldera: {{ caldera_admin_login_ref }} and {{ caldera_red_login_ref }} must each be a password of
      12 or more printable characters (no space, no line break) and differ from each other; forms:
      {{ caldera_forms }}
  tags: [readiness]
