# SPDX-License-Identifier: Apache-2.0
# Lab-internal adversary-emulation control validation and research, as a feature module (docs/modules.md; README.md beside this file): one
# compose_app container of the Caldera server, built on the guest from a pinned source tag (no
# prebuilt image exists), on an ISOLATED guest. It is not a slot provider. The UI is published on
# the guest's own address only: no public route, no SSO, no reverse proxy. Every real value (the
# guest, its address, the secret values, the network rules to named assessment targets) is the
# site's: the overlay's lab/modules.yml, lab/guests and secret store.
manifest_version: "1.0"
id: caldera
kind: feature
title: Adversary-emulation control validation server on an isolated guest
description: Runs the Caldera adversary-emulation server (its UI and agent contact on one port) as a
  single compose_app container built from a pinned source tag on an isolated guest, with the admin
  and research-account passwords written from the secret store at every converge; operations, adversaries,
  agents and artifacts are exported as an object tree before a removal.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
identifiers:
  - {kind: secret-name, name: caldera, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the admin and research-account passwords are read by name at deploy time
  hosts:
    - role: server
      kind: vm
      exposure: isolated
      footprint: {cpu: 2, memory_mb: 4096, disk_gb: 40}
      guest:
        baselines: [base]
      roles: [role:caldera]
      purpose: builds and runs the Caldera container (docker_engine applied first, compose_app renders it); lands only on a host the site marks isolated
egress:
  - host: server
    to: [internet]
    purpose: install and upgrade only - the pinned source clone and the image build's package, npm, pip and git fetches; the running server opens none
    optional: true
contributes:
  roles:
    - file: roles/caldera
  preflight:
    - {role: role:caldera, hook: readiness}
  docs:
    - file: README.md
data:
  - id: operations
    kind: state
    description: The operations and their results, held in the server's object store (data/object_store) and the saved result files (data/results), exported with the agents.
    export: {formats: [object-tree], via: role:caldera}
    import: {formats: [object-tree], via: role:caldera}
    retention: {keep: forever}
  - id: adversaries
    kind: state
    description: The adversary profiles and abilities the operator authored or changed (data/adversaries, data/abilities, data/objectives).
    export: {formats: [object-tree], via: role:caldera}
    import: {formats: [object-tree], via: role:caldera}
    retention: {keep: forever}
  - id: agents
    kind: state
    description: The agent registry (in the object store) and the server's agent and payload settings (conf/agents.yml, conf/payloads.yml); the generated configuration with the passwords is never exported.
    export: {formats: [object-tree], via: role:caldera}
    import: {formats: [object-tree], via: role:caldera}
    retention: {keep: forever}
  - id: artifacts
    kind: state
    description: The payloads, fact sources and collected files the exercises produced (data/payloads, data/sources, data/facts).
    export: {formats: [object-tree], via: role:caldera}
    import: {formats: [object-tree], via: role:caldera}
    retention: {keep: forever}
config:
  caldera_version:
    type: string
    description: the pinned upstream release tag the image is built from (caldera_version); the role also pins its commit (caldera_source_commit)
    default: "5.3.0"
    overlay: optional
  caldera_admin_password_ref:
    type: secret
    description: the admin account's password, written into the server's generated configuration at every converge (caldera_admin_login_ref)
    default: secret:caldera/admin-password
    overlay: optional
  caldera_red_password_ref:
    type: secret
    description: the research account's password, written into the server's generated configuration at every converge (caldera_red_login_ref)
    default: secret:caldera/red-password
    overlay: optional
lifecycle:
  install: {playbook: playbooks/install.yml, note: "builds the image from source on first run (slow: UI build, packages, two public repository clones); the egress needed is install-time only"}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned release bump (version and commit): the role's upgrade hook validates and records it, the data is exported, then it converges and rebuilds"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
