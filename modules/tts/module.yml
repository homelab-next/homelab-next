# SPDX-License-Identifier: Apache-2.0
# The speech provider (docs/modules.md; README.md beside this file): the operator's own cloned voice,
# served over the /synthesize contract the old podcast service had, as one compose_app container
# built from this repository (image/Dockerfile, homelabnext/tts_service). The voice model is the model
# store's (a pinned revision, a sha256 per file); the operator's reference recordings are the module's
# data. Loaded on demand and unloaded when idle (the GPU backend), never fetching anything at run time.
# Every real value (the guest, its address, the GPU, the image the site built) is the site's: the
# overlay's lab/modules.yml, lab/services.yml and group variables.
manifest_version: "1.0"
id: tts
kind: provider
title: Speech synthesis in the operator's cloned voice
description: Fills the tts slot with a speech service that clones the operator's voice from four reference
  recordings, answering POST /synthesize as the old podcast service did (JSON text in, 24 kHz mono WAV out).
  One container built from this repository; the voice model is the model store's, read-only; it loads per job
  and unloads when idle (GPU), refusing to load onto a card whose power cap is above the limit; no public route.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: coqui-tts
  display: coqui-tts with the XTTS-v2 voice model
  version: 2.0.0
licence:
  # the software (coqui-tts 0.27.5, the engine library) is MPL-2.0. The voice MODEL is not open source:
  # it is under the Coqui Public Model License 1.0.0, non-commercial use only (README.md, "Licence")
  kind: open-source
  spdx: MPL-2.0
# No credentials: the service holds no key and nothing is read from the secret store. The reference
# recordings are the operator's own data (data root voice/), not a secret of this module's namespace.
credentials: []
requires:
  hosts:
    - role: server
      kind: vm
      footprint:
        cpu: 8
        memory_mb: 12288
        disk_gb: 20
      guest:
        baselines: [server]
      roles: [role:tts]
      purpose: runs the speech container (docker_engine, then model_store, applied first; compose_app renders it); on the cuda backend the card is handed over by its CDI device
provides:
  slots:
    tts:
      adapter: homelabnext.conform.adapters.tts:make
      provisional: true
      reason: tts has no contract yet; the standard is the contract the old service had (POST /synthesize, a WAV out), probed here read-only (health, readiness) and pinned by tests/tts/test_tts_contract.py
      migration: {formats: [object-tree], export: role:tts, import: role:tts}
egress: none
contributes:
  roles:
    - file: roles/tts
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:tts, hook: readiness}
  docs:
    - file: README.md
data:
  - id: voice
    kind: state
    description: The operator's four reference recordings (voice/ref1.wav to ref4.wav, the voice itself) and the speaker-embedding cache derived from them (state/latents-*.pt, rebuilt on demand, kept because it saves a minute of work per restart). The model weights are not here; they are the model store's.
    export: {formats: [object-tree], via: role:tts}
    import: {formats: [object-tree], via: role:tts}
    retention: {keep: forever}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a new image the site built (tag and digest of the same repository and backend): the role's upgrade hook validates and records it, then it converges; the voice and the weights do not move with it"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, contributions]
