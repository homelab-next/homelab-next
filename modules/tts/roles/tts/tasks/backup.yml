# The backup manifest names the data root only (the voice, the embeddings, the export): the weights are
# the model store's own data with its own export, and the cache is rebuilt.
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Create the data directories
      ansible.builtin.include_tasks: dirs.yml
    - name: Create the compose project directory
      ansible.builtin.file:
        path: "{{ tts_dir }}"
        state: directory
        owner: "{{ tts_owner }}"
        group: "{{ tts_gid }}"
        mode: "0750"
    - name: Write the backup manifest (the data root; not the weights, not the cache)
      ansible.builtin.copy:
        dest: "{{ tts_dir }}/backup-manifest.json"
        content: "{{ {'app': 'tts', 'paths': [tts_data_root]} | to_nice_json }}\n"
        owner: "{{ tts_owner }}"
        group: "{{ tts_gid }}"
        mode: "0640"
  tags: [backup]
