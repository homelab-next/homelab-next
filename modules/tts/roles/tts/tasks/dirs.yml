# SPDX-License-Identifier: Apache-2.0
# The data root is the project owner's; voice/ is readable by the container's group and never writable
# by it; state/, the cache and export/ belong to the container's user, so the service (and the export,
# run as that user) create files it can open.
- name: Create the data root, the voice directory, the state, the cache and the export directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ tts_data_root }}", owner: "{{ tts_owner }}", group: "{{ tts_gid }}", mode: "0750"}
    - {path: "{{ tts_data_root }}/voice", owner: "{{ tts_owner }}", group: "{{ tts_gid }}", mode: "0750"}
    - {path: "{{ tts_data_root }}/state", owner: "{{ tts_uid | int }}", group: "{{ tts_gid | int }}", mode: "0700"}
    - {path: "{{ tts_data_root }}/export", owner: "{{ tts_uid | int }}", group: "{{ tts_gid | int }}", mode: "0700"}
    - {path: "{{ tts_cache_dir }}", owner: "{{ tts_uid | int }}", group: "{{ tts_gid | int }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"
  tags: [backup, export, restore]
