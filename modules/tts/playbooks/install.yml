# Install (and converge) the speech service on the guests the site placed the module's `server` role on.
# The apply path (docs/modules/apply.md) renders its own modules.yml from the selection and does not
# import this file; it is the module's own entry point, for a lab that runs one module by hand:
#   ansible-playbook -i <inventory with --selection> modules/tts/playbooks/install.yml
# docker_engine and model_store are applied to the guest first (the weights must be in the store); the
# role's readiness hook refuses to go on without either.
- name: Install the speech service (the tts provider)
  hosts: mod_tts_server
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: tts
        tasks_from: readiness
      tags: [mod_tts]
  roles:
    - role: tts
      tags: [mod_tts]
