# SPDX-License-Identifier: Apache-2.0
# The gateway's dependencies are the container engine (docker_engine, applied to the guest before
# this module), the site's gateway spec (rendered and audited on the controller) and every key it
# names in the secret store; it calls no other service of the lab itself (its backends are
# reached when a role is called).
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: The container engine is ready (docker_engine readiness)
      ansible.builtin.include_role:
        name: docker_engine
        tasks_from: readiness
    - name: The configuration renders and is one this site allows
      ansible.builtin.include_tasks: generate.yml
    - name: Every key resolves in its form
      ansible.builtin.include_tasks: credentials.yml
  tags: [readiness]
