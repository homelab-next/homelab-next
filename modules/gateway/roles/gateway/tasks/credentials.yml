# Every key the configuration names resolves, and each has the form the gateway demands at start
# (a refusal here names the reference, a refusal there is a crash loop): the admin, every caller's
# and the telemetry reader's key at least 32 bytes and all distinct, a provider's key one line.
# Only verdicts leave the no_log tasks; the values stay in gateway_secret_values for main.
- name: Read which references resolve (verdicts only)
  ansible.builtin.set_fact:
    gateway_resolves: >-
      {{ gateway_resolves | default({}) | combine({item: (lookup('hnx_secret', gateway_env_refs[item][0], errors='ignore') | default('', true) | string | length) > 0}) }}
  loop: "{{ gateway_caller_envs + gateway_upstream_envs }}"
  no_log: true
  tags: [readiness]

- name: Name the references that do not resolve
  ansible.builtin.set_fact:
    gateway_missing: >-
      {{ gateway_resolves | dict2items | rejectattr('value') | map(attribute='key') | list
         | map('extract', gateway_env_refs) | map('first') | list }}
  tags: [readiness]

- name: Every key resolves
  ansible.builtin.assert:
    that: gateway_missing | length == 0
    fail_msg: >-
      gateway: these secret: references are not in the secret store (or are empty): {{ gateway_missing }}
  tags: [readiness]

- name: Read the keys
  ansible.builtin.set_fact:
    gateway_secret_values: >-
      {{ gateway_secret_values | default({}) | combine({item: lookup('hnx_secret', gateway_env_refs[item][0])}) }}
  loop: "{{ gateway_caller_envs + gateway_upstream_envs }}"
  no_log: true
  tags: [readiness]

- name: Read each key's form (verdicts only)
  ansible.builtin.set_fact:
    gateway_forms:
      callers: "{{ gateway_caller_envs | map('extract', gateway_secret_values) | reject('match', gateway_key_pattern) | list | length == 0 }}"
      distinct: "{{ gateway_caller_envs | map('extract', gateway_secret_values) | list | unique | length == gateway_caller_envs | length }}"
      upstream: "{{ gateway_upstream_envs | map('extract', gateway_secret_values) | reject('match', gateway_upstream_key_pattern) | list | length == 0 }}"
      apart: "{{ gateway_caller_envs | map('extract', gateway_secret_values) | list | intersect(gateway_upstream_envs | map('extract', gateway_secret_values) | list) | length == 0 }}"
  no_log: true
  tags: [readiness]

- name: Every key has its form
  ansible.builtin.assert:
    that:
      - gateway_forms.callers | bool
      - gateway_forms.distinct | bool
      - gateway_forms.upstream | bool
      - gateway_forms.apart | bool
    fail_msg: >-
      gateway: the admin key, every caller's key and the telemetry reader's must each be 32 to 512
      characters of letters, digits and . _ ~ + / = - (the gateway refuses a shorter key at start), no
      two of them the same, and none of them a provider's key; a provider's key is one line of 8 to
      512 of those characters; forms: {{ gateway_forms }} (callers {{ gateway_caller_envs }}, provider
      keys {{ gateway_upstream_envs }})
  tags: [readiness]
