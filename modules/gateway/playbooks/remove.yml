# Remove: export the usage records (export_first), stop and remove the container, and delete the
# env_file that holds every key. The data root (with the export in it) and the rest of the compose
# project are kept for the operator to archive or delete; the decommission audit
# (module.yml lifecycle.remove.audit) checks nothing still names the service.
- name: Remove the LLM gateway
  hosts: mod_gateway_server
  become: true
  tasks:
    - name: Export the usage records first
      ansible.builtin.include_role:
        name: gateway
        tasks_from: export
    - name: Stop and remove the container
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ gateway_dir | default('/opt/compose/gateway') }}/docker-compose.yml", down]
      changed_when: true
    - name: Delete the keys the container was given
      ansible.builtin.file:
        path: "{{ gateway_dir | default('/opt/compose/gateway') }}/secrets/gateway.env"
        state: absent
