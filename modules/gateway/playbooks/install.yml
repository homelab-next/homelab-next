# Install (and converge) the gateway on the guests the site placed the module's `server` role on.
# The apply path (docs/modules/apply.md) renders its own modules.yml from the selection and does
# not import this file; it is the module's own entry point, for a lab that runs one module by hand:
#   ansible-playbook -i <inventory with --selection> modules/gateway/playbooks/install.yml \
#     -e gateway_spec=<abs path of the gateway spec> -e gateway_image=<pinned image>
# docker_engine is applied to the guest first (a compose_app module's host); the role's readiness
# hook refuses to go on without it.
- name: Install the LLM gateway (the inference provider)
  hosts: mod_gateway_server
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: gateway
        tasks_from: readiness
      tags: [mod_gateway]
  roles:
    - role: gateway
      tags: [mod_gateway]
