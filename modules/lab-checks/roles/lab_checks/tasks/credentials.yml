# The publish token resolves, in a form a header can carry. Only the verdict leaves the no_log task.
- name: Read the secret's form
  ansible.builtin.set_fact:
    lab_checks_publisher_ok: "{{ lookup('hnx_secret', lab_checks_notify_publisher_ref) | trim is match(lab_checks_forms.publisher) }}"
  no_log: true
  tags: [readiness, health, upgrade]

- name: The token has its form
  ansible.builtin.assert:
    that: lab_checks_publisher_ok | bool
    fail_msg: >-
      lab-checks: the publish token {{ lab_checks_notify_publisher_ref }} is missing or malformed (8 to 128
      letters, digits, - and _)
  tags: [readiness, health, upgrade]
