# SPDX-License-Identifier: Apache-2.0
# The lab's continuous checks as a feature module (docs/modules.md; README.md beside this file; ADR-0049 decision 7):
# the site's invariants register, run hourly by `hnx invariants run` from a systemd timer, with a state-diffed page
# to the notify slot when a criterion is NEWLY red and once when it recovers, and the read-only probes the criteria
# use. The register itself (the criteria, their owners and the lab's real names) is the site's: the overlay's
# lab/registers/invariants.yml. Every real value (the guest, the notify instance, the secret value) is the site's.
manifest_version: "1.0"
id: lab-checks
kind: feature
title: Continuous lab checks
description: Runs the site's invariants register every hour on one guest and pages the operators once when a criterion
  turns red (and once when it recovers); ships the read-only probes (an HTTP status, a TCP connect, a DNS answer, a
  metrics value, a last-run record) the criteria are written with.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
identifiers:
  - {kind: secret-name, name: lab-checks, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the notify publish token is read by name at deploy time
    - cap: cap:notify
      version: "1.0"
      purpose: pages when a criterion is newly red, and once when it recovers
  hosts:
    - role: runner
      kind: vm
      footprint: {cpu: 0.5, memory_mb: 256, disk_gb: 1}
      guest:
        baselines: [base]
      roles: [role:lab_checks]
      purpose: runs the hourly register; place it on a guest that carries hnx (installed by the module that runs it there) and can reach what the criteria probe
egress: none
contributes:
  roles:
    - file: roles/lab_checks
  preflight:
    - {role: role:lab_checks, hook: readiness}
  notify_pairs:
    - problem: 'Invariant newly broken'
      recovery: 'Invariant recovered'
  docs:
    - file: README.md
data:
  - id: results
    kind: state
    description: "The last results document (results/<instance>.hourly.json) and the paging state (state/<instance>.hourly.json, the last status of each criterion), exported under export/<stamp>/. Both are derived from the register and a run; a lost state only means the next run pages every red criterion once."
    export: {formats: [object-tree], via: role:lab_checks}
    import: {formats: [object-tree], via: role:lab_checks}
    retention: {keep: transient}
config:
  notify_token:
    type: secret
    description: the notify provider's publisher token, copied under this module's own namespace (write-only; it is the only credential the module holds) (lab_checks_notify_publisher_ref)
    default: secret:lab-checks/notify-token
    overlay: required
  ca:
    type: secret
    description: the lab CA certificate (PEM, public) the probes verify internal TLS services with, written to a world-readable file (lab_checks_ca_ref)
    default: secret:lab-checks/ca
    overlay: optional
lifecycle:
  install: {playbook: playbooks/install.yml, note: "the register is validated on the host before it replaces the live one; the first run pages each criterion that is red then (state absent counts as not red before)"}
  upgrade: {playbook: playbooks/upgrade.yml, note: "no pinned artefact: a validated re-converge"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
