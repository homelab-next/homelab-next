# SPDX-License-Identifier: Apache-2.0
# Install (and converge) the lab checks on the guest the site placed the module's `runner` role on. The apply
# path (docs/modules/apply.md) renders its own modules.yml from the selection and does not import this file; it is
# the module's own entry point, for a lab that runs one module by hand:
#   ansible-playbook -i <inventory with --selection> modules/lab-checks/playbooks/install.yml
# The readiness hook refuses to go on without the secret in its form, hnx on the guest and the register.
- name: Install the continuous lab checks
  hosts: mod_lab_checks_runner
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: lab_checks
        tasks_from: readiness
      tags: [mod_lab_checks]
  roles:
    - role: lab_checks
      tags: [mod_lab_checks]
