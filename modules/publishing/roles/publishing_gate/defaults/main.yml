# SPDX-License-Identifier: Apache-2.0
publishing_gate_mode: stage
publishing_gate_tlp_allowed: clear
publishing_gate_audience: public
publishing_gate_access_control: ""
publishing_gate_posture_rules: true
publishing_gate_user: hnx-publishing
publishing_gate_group: hnx-publishing
publishing_gate_hnx_bin: /opt/hnx/bin/hnx
publishing_gate_node: /usr/bin/node
publishing_gate_npm: /usr/bin/npm
publishing_gate_wrangler_version: 4.157.0
publishing_gate_wrangler_lock_src: ""
publishing_gate_wrangler_lock_sha256: ""
publishing_gate_pages_project: ""
publishing_gate_pages_branch: pages
publishing_gate_cloudflare_account_id: ""
publishing_gate_r2_bucket: ""
publishing_gate_feed_public_base_url: ""
publishing_gate_feed_title: ""
publishing_gate_feed_description: ""
publishing_gate_feed_author: ""
publishing_gate_feed_owner_email: ""
publishing_gate_feed_category: Technology
publishing_gate_notify_url: ""
publishing_gate_notify_topic: ""
publishing_gate_deny_list_ref: secret:publishing/deny-list
publishing_gate_pages_cred: secret:publishing/cloudflare-api-token
publishing_gate_r2_id_cred: secret:publishing/r2-access-key-id
publishing_gate_r2_sk_cred: secret:publishing/r2-secret-access-key
publishing_gate_notify_cred: ""
publishing_gate_export_dir: /var/lib/hnx-modules/publishing/export
publishing_gate_restore_source: ""
publishing_gate_target_wrangler_version: ""
publishing_gate_snapshots_keep: 5
publishing_gate_snapshots_min_age_s: 3600
publishing_gate_legacy_exceptions: []
publishing_gate_staging_keep: 48
publishing_gate_staging_min_age_s: 172800
# Producer lanes (homelabnext.publishing.config.LaneSource): [{lane, dir}], each an output directory in
# the publishable-item layout that a producer's lane writes (the shadow lane's handoff directory). ALWAYS
# stage-only: gated and staged under staging/lane-<lane>/, never deployed or uploaded, in any mode.
publishing_gate_lane_sources: []
# Supplementary groups the service user joins to READ those directories (the producer's handoff group);
# created here when absent (a system group), so the install order of the two modules does not matter.
publishing_gate_extra_groups: []
