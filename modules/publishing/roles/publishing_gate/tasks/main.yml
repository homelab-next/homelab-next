# SPDX-License-Identifier: Apache-2.0
- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Create the users and directories
  ansible.builtin.include_tasks: dirs.yml

- name: Install the pinned wrangler (only the live Pages deploy runs it)
  ansible.builtin.include_tasks: wrangler.yml
  when: publishing_gate_needs_wrangler | bool

- name: Write the credentials
  ansible.builtin.include_tasks: credentials.yml

- name: Write the configuration
  ansible.builtin.include_tasks: config.yml
