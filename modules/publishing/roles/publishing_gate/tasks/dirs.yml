- name: The service group
  ansible.builtin.group:
    name: "{{ publishing_gate_group }}"
    system: true

- name: The groups that grant read access to producers' lane output (shared with the producer's module)
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop: "{{ publishing_gate_extra_groups }}"

- name: The service user (a member of those groups, which grant read access and nothing else)
  ansible.builtin.user:
    name: "{{ publishing_gate_user }}"
    group: "{{ publishing_gate_group }}"
    groups: "{{ publishing_gate_extra_groups }}"
    append: true
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: The data directories (the producers write items into publishable/)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ publishing_gate_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ publishing_gate_root }}", owner: "{{ publishing_gate_root_owner }}", mode: "0755"}
    - {path: "{{ publishing_gate_publishable_dir }}", owner: "{{ publishing_gate_root_owner }}", mode: "0775"}
    - {path: "{{ publishing_gate_staging_dir }}", owner: "{{ publishing_gate_user }}", mode: "0750"}
    - {path: "{{ publishing_gate_state_dir }}", owner: "{{ publishing_gate_user }}", mode: "0750"}
    - {path: "{{ publishing_gate_tools_dir }}", owner: "{{ publishing_gate_root_owner }}", mode: "0755"}
    - {path: "{{ publishing_gate_export_dir }}", owner: "{{ publishing_gate_user }}", mode: "0750"}
    - {path: "{{ publishing_gate_config_dir }}", owner: "{{ publishing_gate_root_owner }}", mode: "0755"}
    - {path: "{{ publishing_gate_cred_src_dir }}", owner: "{{ publishing_gate_user }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"
