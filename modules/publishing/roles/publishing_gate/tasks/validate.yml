- name: Validate the settings
  ansible.builtin.assert:
    that:
      - publishing_gate_logical_id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)*\Z')
      - publishing_gate_mode in ['stage', 'dry-run', 'live']
      - publishing_gate_tlp_allowed in ['clear', 'green']
      - publishing_gate_audience in ['public', 'community']
      # green is not public: it needs a community audience and the access control that enforces it
      - publishing_gate_tlp_allowed == 'clear' or (publishing_gate_audience == 'community' and publishing_gate_access_control | length > 0)
      # the pin: an exact version (never latest, a range or a tag)
      - publishing_gate_wrangler_version is match(publishing_gate_semver_pattern)
      # the lockfile is pinned by sha256 (it pins every package and its integrity hash); required for a Pages project
      - publishing_gate_wrangler_lock_sha256 == '' or publishing_gate_wrangler_lock_sha256 is match(publishing_gate_hex64_pattern)
      - publishing_gate_pages_project == '' or (publishing_gate_wrangler_lock_sha256 != '' and publishing_gate_wrangler_lock_src != '')  # the pin is config in every mode (the adapter refuses without it); only live installs it
      - publishing_gate_snapshots_keep | int >= 1 and publishing_gate_snapshots_min_age_s | int >= 0
      - publishing_gate_staging_keep | int >= 1 and publishing_gate_staging_min_age_s | int >= 0
      - publishing_gate_legacy_exceptions is sequence and publishing_gate_legacy_exceptions is not string
      - publishing_gate_legacy_exceptions | selectattr('sha256', 'defined') | map(attribute='sha256') | reject('match', publishing_gate_hex64_pattern) | list | length == 0
      - publishing_gate_pages_branch is match('^[A-Za-z0-9._/-]{1,60}\Z')
      - publishing_gate_pages_project == '' or publishing_gate_pages_project is match('^[a-z0-9][a-z0-9-]{0,57}\Z')
      - publishing_gate_feed_public_base_url == '' or (publishing_gate_feed_public_base_url is match('^https://[^/ ]+(/[^ ]*[^/ ])?\Z'))
      - >-
        [publishing_gate_deny_list_ref, publishing_gate_pages_cred, publishing_gate_r2_id_cred,
         publishing_gate_r2_sk_cred] | reject('match', publishing_gate_ref_pattern) | list | length == 0
      - publishing_gate_notify_cred == '' or publishing_gate_notify_cred is match(publishing_gate_ref_pattern)
      - >-
        publishing_gate_lane_sources is sequence and publishing_gate_lane_sources is not string
      - >-
        publishing_gate_lane_sources | select('mapping') | list | length == publishing_gate_lane_sources | length
      - >-
        publishing_gate_lane_sources | select('mapping') | map(attribute='lane', default='') | reject('match', publishing_gate_lane_pattern) | list | length == 0
      - >-
        publishing_gate_lane_sources | select('mapping') | map(attribute='dir', default='') | reject('match', publishing_gate_path_pattern) | list | length == 0
      - >-
        publishing_gate_lane_sources | select('mapping') | map('length') | reject('equalto', 2) | list | length == 0
      - publishing_gate_lane_sources | map(attribute='lane', default='') | unique | list | length == publishing_gate_lane_sources | length
      - publishing_gate_lane_sources | map(attribute='dir', default='') | unique | list | length == publishing_gate_lane_sources | length
      - publishing_gate_lane_sources | map(attribute='dir', default='') | select('equalto', publishing_gate_publishable_dir) | list | length == 0
      - publishing_gate_live_source is mapping
      - publishing_gate_live_source | length == 0 or (publishing_gate_live_source | length == 3 and publishing_gate_live_source.lane is defined and publishing_gate_live_source.dir is defined and publishing_gate_live_source.root is defined)
      - publishing_gate_live_source | length == 0 or (publishing_gate_live_source.lane is string and publishing_gate_live_source.lane is match(publishing_gate_lane_pattern) and publishing_gate_live_source.lane | length <= 32)
      - publishing_gate_live_source | length == 0 or (publishing_gate_live_source.dir is string and publishing_gate_live_source.dir is match(publishing_gate_path_pattern))
      - publishing_gate_live_source | length == 0 or (publishing_gate_live_source.root is string and publishing_gate_live_source.root is match(publishing_gate_path_pattern))
      # a POSITIVE check: the real lane's directory, exactly <root>/<lane> (the run re-checks by real path and inode)
      - publishing_gate_live_source | length == 0 or publishing_gate_live_source.lane in ['real']
      - publishing_gate_live_source | length == 0 or publishing_gate_live_source.dir == publishing_gate_live_source.root ~ '/' ~ publishing_gate_live_source.lane
      - publishing_gate_live_source | length == 0 or (publishing_gate_lane_sources | map(attribute='lane', default='') | select('equalto', publishing_gate_live_source.lane) | list | length == 0)
      # the shadow lane is never the live source: not by lane name, not by any path component
      - publishing_gate_live_source | length == 0 or publishing_gate_live_source.lane is not search(publishing_gate_shadow_pattern)
      - publishing_gate_live_source | length == 0 or (publishing_gate_live_source.dir | split('/') | select('search', publishing_gate_shadow_pattern) | list | length == 0)
      # nor the same place as a stage-only lane, a lane's parent or the module's own areas
      - publishing_gate_live_source | length == 0 or (publishing_gate_lane_sources | map(attribute='dir', default='') | select('equalto', publishing_gate_live_source.dir) | list | length == 0)
      - >-
        publishing_gate_live_source | length == 0 or
        ([publishing_gate_staging_dir, publishing_gate_state_dir, publishing_gate_cred_src_dir] | select('equalto', publishing_gate_live_source.dir) | list | length == 0)
      - publishing_gate_extra_groups is sequence and publishing_gate_extra_groups is not string
      - publishing_gate_extra_groups | reject('match', publishing_gate_group_pattern) | list | length == 0
      - >-
        [publishing_gate_root, publishing_gate_config_dir, publishing_gate_export_dir, publishing_gate_hnx_bin,
         publishing_gate_node, publishing_gate_npm] | reject('match', publishing_gate_path_pattern) | list | length == 0
    fail_msg: >-
      publishing: a registry-style id, a mode (stage, dry-run, live), a TLP ceiling of clear or green (green
      only for a community audience with an access control), a wrangler pin that is an exact X.Y.Z (never latest) with a lockfile pinned
      by sha256 when a Pages project is set, a production branch, https feed links, secret references (never
      values) and absolute canonical paths are required
  tags: [health, backup, restore, export, upgrade, readiness]

- name: Live needs a named static-hosting provider (it fails closed, because the loader cannot see this mode)
  ansible.builtin.assert:
    that:
      - publishing_gate_mode != 'live' or publishing_gate_hosting_provider is match(publishing_gate_lane_pattern)
    fail_msg: >-
      publishing: mode live pushes through the static-hosting slot, and publishing_gate_hosting_provider (the
      selected provider's logical id) is empty or malformed. Select a static-hosting provider in the site and
      name it; stage and dry-run need none
  tags: [health, backup, restore, export, upgrade, readiness]

- name: A live or dry-run mode has what it needs to reach a destination
  ansible.builtin.assert:
    that:
      - publishing_gate_pages_project != '' or publishing_gate_r2_bucket != ''
      - publishing_gate_r2_bucket == '' or (publishing_gate_cloudflare_account_id != '' and publishing_gate_feed_public_base_url != '' and publishing_gate_feed_title != '' and publishing_gate_feed_description != '' and publishing_gate_feed_author != '' and publishing_gate_feed_owner_email != '')
    fail_msg: "publishing: name at least one destination (a Pages project or an R2 bucket); a bucket needs the account id and the whole feed identity"
  when: publishing_gate_mode != 'stage'
  tags: [health, backup, restore, export, upgrade, readiness]

- name: Stat the live source's root and its parent (no lane user may be able to repoint them)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ [publishing_gate_live_source.root, publishing_gate_live_source.root | dirname] if publishing_gate_live_source else [] }}"
  register: publishing_gate_live_parents
  tags: [health, backup, restore, export, upgrade, readiness]

- name: The live source's root and parent are the root owner's and not group- or world-writable
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.pw_name == publishing_gate_root_owner and item.stat.mode is match('^[0-7][0-7][0145][0145]$'))
    fail_msg: >-
      publishing: the live source's root and its parent must be owned by {{ publishing_gate_root_owner }} and not
      writable by group or others: a lane user who could write them could repoint the live source after validation
  loop: "{{ publishing_gate_live_parents.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when: publishing_gate_live_source | length > 0
  tags: [health, backup, restore, export, upgrade, readiness]
