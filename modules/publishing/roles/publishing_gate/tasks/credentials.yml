# SPDX-License-Identifier: Apache-2.0
# The credentials, by name: one 0600 file each, owned by the service user (the scheduled run reads
# them directly and refuses any that is group- or world-readable). Values are read from the secret
# store here and never appear in the repository, the config or a task's output.
- name: One file per credential (the hosting ones only where a mode that uses them is set)
  ansible.builtin.copy:
    dest: "{{ publishing_gate_cred_src_dir }}/{{ item.name }}"
    content: "{{ lookup('hnx_secret', item.ref) }}\n"
    owner: "{{ publishing_gate_user }}"
    group: "{{ publishing_gate_group }}"
    mode: "0600"
  loop: "{{ publishing_gate_credentials }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: item.need == 'always' or publishing_gate_mode != 'stage'

- name: The notify token
  ansible.builtin.copy:
    dest: "{{ publishing_gate_cred_src_dir }}/notify-token"
    content: "{{ lookup('hnx_secret', publishing_gate_notify_cred) }}\n"
    owner: "{{ publishing_gate_user }}"
    group: "{{ publishing_gate_group }}"
    mode: "0600"
  no_log: true
  when: publishing_gate_notify_cred != ''
