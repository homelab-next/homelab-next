# Fail unless the host can run the gate, before anything is written.
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    # Host preconditions no module provides: the site applies them to the guest (role hnx_runtime for the
    # runtime release; the distribution's node and npm). Each is its own check with its own message, so the
    # failure names exactly what is missing and how to supply it.
    - name: The runtime release's hnx command
      ansible.builtin.stat:
        path: "{{ publishing_gate_hnx_bin }}"
      register: publishing_gate_hnx_stat
    - name: It is installed
      ansible.builtin.assert:
        that: publishing_gate_hnx_stat.stat.exists and publishing_gate_hnx_stat.stat.executable | default(false)
        fail_msg: >-
          publishing: {{ publishing_gate_hnx_bin }} is missing. The publishing run is `hnx publishing`, from the
          homelab-next runtime release: apply the hnx_runtime role (ansible/roles/hnx_runtime, docs/broker.md
          "Deploying with Ansible") to this guest first; no module installs it
    - name: The runtime has the publishing package
      ansible.builtin.command:
        argv: ["{{ publishing_gate_hnx_bin }}", publishing, --help]
      register: publishing_gate_hnx_help
      changed_when: false
      check_mode: false
      failed_when: false
    - name: It answers
      ansible.builtin.assert:
        that: publishing_gate_hnx_help.rc == 0
        fail_msg: >-
          publishing: `{{ publishing_gate_hnx_bin }} publishing --help` failed (exit {{ publishing_gate_hnx_help.rc }}):
          the installed runtime release does not carry the publishing package; bump the hnx_runtime pin to a release
          that does
    # wrangler is the Pages deploy's, and only `live` deploys (stage: no network; dry-run: reads only)
    - name: The Pages deploy's node and npm (live only)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: ["{{ publishing_gate_node }}", "{{ publishing_gate_npm }}"]
      register: publishing_gate_node_stats
      when: publishing_gate_needs_wrangler | bool
    - name: They are installed
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.executable | default(false)
        fail_msg: >-
          publishing: {{ item.item }} is missing: mode live with a Pages project runs the pinned wrangler on node 22
          or newer, with npm for the lockfile install (install nodejs and npm on the guest; stage and dry-run need
          neither)
      loop: "{{ publishing_gate_node_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: publishing_gate_needs_wrangler | bool
    - name: Node's version
      ansible.builtin.command:
        argv: ["{{ publishing_gate_node }}", --version]
      register: publishing_gate_node_said
      changed_when: false
      check_mode: false
      when: publishing_gate_needs_wrangler | bool
    - name: Node is 22 or newer (the pinned wrangler's own requirement)
      ansible.builtin.assert:
        that: (publishing_gate_node_said.stdout | trim | regex_findall('^v([0-9]+)') | first | default(0) | int) >= 22
        fail_msg: "publishing: node {{ publishing_gate_node_said.stdout }} is older than 22"
      when: publishing_gate_needs_wrangler | bool
    - name: The pinned lockfile is on the control host (a Pages project needs wrangler)
      ansible.builtin.stat:
        path: "{{ publishing_gate_wrangler_lock_src }}"
        checksum_algorithm: sha256
        get_checksum: true
      register: publishing_gate_lock_probe
      delegate_to: localhost
      become: false
      when: publishing_gate_pages_project != ''
    - name: It hashes to the pin
      ansible.builtin.assert:
        that: publishing_gate_lock_probe.stat.exists and publishing_gate_lock_probe.stat.checksum == publishing_gate_wrangler_lock_sha256
        fail_msg: "publishing: {{ publishing_gate_wrangler_lock_src }} is missing or does not hash to the pinned lockfile sha256"
      when: publishing_gate_pages_project != ''
    - name: Start the credential verdicts empty (this file runs again from every hook)
      ansible.builtin.set_fact:
        publishing_gate_cred_state: {}
    - name: Is each credential the mode needs set (only the verdict is kept, never a value)
      ansible.builtin.set_fact:
        publishing_gate_cred_state: >-
          {{ publishing_gate_cred_state | combine({item.ref: ((lookup('hnx_secret', item.ref, errors='ignore') or '') | string | length > 0)}) }}
      loop: "{{ publishing_gate_credentials }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      when: item.need == 'always' or publishing_gate_mode != 'stage'
    - name: Every credential the mode needs is set
      ansible.builtin.assert:
        that: publishing_gate_cred_state.values() | select | list | length == publishing_gate_cred_state | length
        fail_msg: >-
          publishing: not set in the secret store: {{ publishing_gate_cred_state | dict2items | rejectattr('value') | map(attribute='key') | sort | join(', ') }}
  tags: [readiness]
