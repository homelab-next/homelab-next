# Upgrade a pinned wrangler: validate and record the bump (publishing_gate_target_wrangler_version, an
# exact X.Y.Z), export the manifest, then converge with the new pin and integrity set in the overlay
# (the role refuses a pin that its shipped lockfile does not carry).
#   ansible-playbook -i <inventory> modules/publishing/playbooks/upgrade.yml -e publishing_gate_target_wrangler_version=<X.Y.Z>
- name: Upgrade the pinned wrangler
  hosts: mod_publishing_publisher
  become: true
  tasks:
    - name: Validate and record the bump
      ansible.builtin.include_role:
        name: publishing_gate
        tasks_from: upgrade
    - name: Export the published manifest first
      ansible.builtin.include_role:
        name: publishing_gate
        tasks_from: export
    - name: Converge on the new pin
      ansible.builtin.include_role:
        name: publishing_gate
      vars:
        publishing_gate_wrangler_version: "{{ publishing_gate_target_wrangler_version }}"
