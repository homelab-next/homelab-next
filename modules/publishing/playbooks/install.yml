# Install (and converge) the publishing gate on the guest the site placed the module's `publisher`
# role on. The apply path (docs/modules/apply.md) renders its own modules.yml from the selection;
# this is the module's own entry point. Needs the runtime release (role hnx_runtime), node 22+ and
# npm on the guest.
#   ansible-playbook -i <inventory with --selection> modules/publishing/playbooks/install.yml
- name: Install the publishing gate
  hosts: mod_publishing_publisher
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: publishing_gate
        tasks_from: readiness
      tags: [mod_publishing]
  roles:
    - role: publishing_gate
      tags: [mod_publishing]
