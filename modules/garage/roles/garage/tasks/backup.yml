# SPDX-License-Identifier: Apache-2.0
# The backup takes the data root whole (the VM's backup job, or a file backup of the manifest's
# paths). Garage's metadata is a live database: the VM-level backup is crash-consistent, and a
# consistent copy comes from the export hook (a metadata snapshot first).
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Delegate to compose_app (the backup manifest names the data root)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: backup
      vars:
        compose_app_name: garage
        compose_app_dir: "{{ garage_app.compose_app_dir }}"
        compose_app_data_dir: "{{ garage_app.compose_app_data_dir }}"
        compose_app_export_dir: "{{ garage_app.compose_app_export_dir }}"
        compose_app_owner: "{{ garage_app.compose_app_owner }}"
        compose_app_group: "{{ garage_app.compose_app_group }}"
        compose_app_spec: "{{ garage_app.compose_app_spec }}"
  tags: [backup]
