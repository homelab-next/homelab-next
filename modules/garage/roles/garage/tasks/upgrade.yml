# SPDX-License-Identifier: Apache-2.0
- block:
    - name: Refuse a target that is not pinned by tag and digest, or is another repository
      ansible.builtin.assert:
        that:
          - garage_target_image is match('^[^@:]+(/[^@:]+)*:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}@sha256:[0-9a-f]{64}\Z')
          - garage_target_image.split('@')[0].rsplit(':', 1)[0] == garage_repository
        fail_msg: "garage: the target must be {{ garage_repository }}:<tag>@sha256:<64 hex>"
    - name: Refuse a bump across a major version (the product's migration guide comes first)
      ansible.builtin.assert:
        that:
          - garage_target_image.split('@')[0].rsplit(':', 1)[1].lstrip('v').split('.')[0] == garage_tag.lstrip('v').split('.')[0]
        fail_msg: "garage: {{ garage_target_image }} is another major version than {{ garage_tag }}: follow the product's migration guide, then set garage_image"
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Validate and record the bump (compose_app upgrade)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: upgrade
      vars:
        compose_app_name: garage
        compose_app_dir: "{{ garage_app.compose_app_dir }}"
        compose_app_owner: "{{ garage_app.compose_app_owner }}"
        compose_app_group: "{{ garage_app.compose_app_group }}"
        compose_app_spec: "{{ garage_app.compose_app_spec }}"
        compose_app_upgrade_service: garage
        compose_app_upgrade_tag: "{{ garage_target_image.split('@')[0].rsplit(':', 1)[1] }}"
        compose_app_upgrade_digest: "{{ garage_target_image.split('@')[1] }}"
  tags: [upgrade]
