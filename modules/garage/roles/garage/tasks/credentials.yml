# SPDX-License-Identifier: Apache-2.0
# Every credential resolves, and each has Garage's form: a malformed key id or secret would stop
# the server at start (the default key is imported then). Only the verdicts leave the no_log task.
- name: Read each credential's form
  ansible.builtin.set_fact:
    garage_forms:
      rpc_secret: "{{ lookup('hnx_secret', garage_rpc_ref) is match(garage_hex64_pattern) }}"
      admin_token: "{{ lookup('hnx_secret', garage_admin_ref) is match(garage_admin_pattern) }}"
      key_id: "{{ lookup('hnx_secret', garage_access_key_ref) is match(garage_key_id_pattern) }}"
      key_secret: "{{ lookup('hnx_secret', garage_signing_ref) is match(garage_hex64_pattern) }}"
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - garage_forms.rpc_secret | bool
      - garage_forms.admin_token | bool
      - garage_forms.key_id | bool
      - garage_forms.key_secret | bool
    fail_msg: >-
      garage: {{ garage_rpc_ref }} and {{ garage_signing_ref }} must be 64 hex digits,
      {{ garage_access_key_ref }} GK and 24 to 32 hex digits and {{ garage_admin_ref }} 32 to
      128 characters of A-Z a-z 0-9 _ . ~ + / = -; forms: {{ garage_forms }}
  tags: [readiness]
