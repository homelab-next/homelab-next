# Remove: export the data root first (export_first), stop and remove the container, and delete the
# env_file that holds the RPC secret, the admin token and the key pair. The data root and the
# export are kept for the operator to archive or delete; the decommission audit
# (module.yml lifecycle.remove.audit) checks nothing still names the service.
- name: Remove Garage
  hosts: mod_garage_server
  become: true
  tasks:
    - name: Export the data root first
      ansible.builtin.include_role:
        name: garage
        tasks_from: export
    - name: Stop and remove the container
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ garage_dir | default('/opt/compose/garage') }}/docker-compose.yml", down]
      changed_when: true
    - name: Delete the credentials the container was given
      ansible.builtin.file:
        path: "{{ garage_dir | default('/opt/compose/garage') }}/secrets/garage.env"
        state: absent
