# SPDX-License-Identifier: Apache-2.0
# The honeypot's receiving side as a feature module (docs/modules.md; README.md beside this file):
# an always-on, ingest-only receiver for the events a remote honeypot pushes, a daily lake writer
# that lands them in the lake's honeypot events table through the query service, and a daily intel
# report job. It names slots and a model role, never a product: which query service, gateway or
# network carries the push is the site's selection, and every real value (the lake and gateway
# ids, the secrets, the friendly addresses, the placement, the sender's repoint) is the overlay's.
manifest_version: "1.0"
id: honeypot
kind: feature
title: Honeypot event receiver, lake writer and daily intel report
description: Receives the events a remote honeypot pushes (ingest only, a size-capped spool),
  lands them daily in the lake's honeypot events table through the query service with the table's
  contract checked first, and renders a daily intel report (enriched attacker addresses, high-value
  commands and samples, a model-written brief); health judges the receiver, the timers, the table's
  contract and the freshness of what arrives and what is landed.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
bundle: {id: soc, group: deception}
identifiers:
  - {kind: secret-name, name: honeypot, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the query-service password, the gateway key and the lake CA are read by name at deploy time
  hosts:
    - role: receiver
      kind: vm
      footprint: {cpu: 1, memory_mb: 1024, disk_gb: 20}
      guest:
        baselines: [base]
      roles: [role:honeypot]
      purpose: runs the receiver, holds the spool, the writer's state and the rendered reports; the writer and the report are daily jobs on it
prefers:
  capabilities:
    - cap: cap:lake-query
      version: "1.0"
      purpose: the writer INSERTs the events through the query service, the report reads them, and the health hook checks the table's contract and freshness
      fallback:
        behaviour: the receiver still spools every event (the spool is size-capped), the writer and the report fail loudly and health goes red; nothing is lost until the cap
    - cap: cap:inference
      version: "1.0"
      purpose: the report's analyst brief is written by the model tier through the gateway
      fallback:
        behaviour: the brief says the model tier did not answer; the data below it is complete
egress:
  - host: receiver
    to: [internet]
    purpose: the report's attacker-address enrichment (geolocation and ASN, a scanner classification, the Tor exit list) from public sources; set honeypot_enrich false and nothing leaves
contributes:
  roles:
    - file: roles/honeypot
  preflight:
    - {role: role:honeypot, hook: readiness}
  docs:
    - file: README.md
data:
  - id: state
    kind: state
    description: The writer's offset (state/lake-state.json), its last-run record and the rendered reports, exported under export/<stamp>/ (JSON and HTML); the events themselves are the lake's table, exported with the lake.
    export: {formats: [object-tree], via: role:honeypot}
    import: {formats: [object-tree], via: role:honeypot}
    retention: {keep: forever}
config:
  lake_table:
    type: string
    description: the events table's name inside the lake's honeypot schema (honeypot_lake_table); the table's columns are the module's contract
    default: events
    overlay: optional
  lake_password:
    type: secret
    description: the query-service account's password (honeypot_lake_login_ref)
    default: secret:honeypot/lake-password
    overlay: optional
  gateway_key:
    type: secret
    description: the key the report's brief presents to the gateway (honeypot_gateway_key_ref)
    default: secret:honeypot/gateway-key
    overlay: optional
lifecycle:
  install: {playbook: playbooks/install.yml, note: "the honeypot's own push target is repointed to this receiver by the overlay and the honeypot's own configuration, one publisher at a time (README, Cutover)"}
  upgrade: {playbook: playbooks/upgrade.yml, note: "no pinned artefact: a validated re-converge that first checks the table is the writer's contract"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
