# Every secret resolves, in a form a file and a systemd credential can carry: one line, no NUL.
# A reference with no secret behind it is refused here, before any file is written. Only the
# verdicts leave the no_log tasks.
- name: Read each secret's form
  ansible.builtin.set_fact:
    honeypot_ref_forms:
      login: "{{ lookup('hnx_secret', honeypot_lake_login_ref) is match(honeypot_forms.login) }}"
      key: "{{ true if honeypot_gateway_id == '' else lookup('hnx_secret', honeypot_gateway_key_ref) is match(honeypot_forms.key) }}"
      ca: "{{ true if honeypot_lake_ca_ref == '' else lookup('hnx_secret', honeypot_lake_ca_ref) is search('-----BEGIN CERTIFICATE-----') }}"
  no_log: true
  tags: [readiness, health]

- name: Every secret has its form
  ansible.builtin.assert:
    that: honeypot_ref_forms.values() | reject | list | length == 0
    fail_msg: >-
      honeypot: a secret is missing or malformed (forms: {{ honeypot_ref_forms }}): the lake
      password {{ honeypot_lake_login_ref }} must be 8 to 512 characters from A-Z a-z 0-9 and . _ ~ + / = : @ % ^ - (it is written into a systemd environment file, which reads quotes, backslashes and spaces specially); the
      gateway key (when a gateway is named) {{ honeypot_gateway_key_ref }} 8 to 512 characters
      without a space; the lake CA (when named) PEM
  tags: [readiness, health]
