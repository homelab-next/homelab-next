# The account, then the directories, one owner each: the data root is root's, read by the module's
# group; spool/, state/ and reports/ are the module's user's (the receiver and the jobs write
# there); export/ is root's (the backup, export and restore hooks run as root). The install and
# configuration directories are root's; the credentials directory is root-only.
- name: Create the module's group
  ansible.builtin.group:
    name: "{{ honeypot_group }}"
    system: true
  when: honeypot_manage_accounts | bool
  tags: [backup, export, restore, upgrade]

- name: Create the module's user (no home, no shell)
  ansible.builtin.user:
    name: "{{ honeypot_user }}"
    group: "{{ honeypot_group }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin
  when: honeypot_manage_accounts | bool
  tags: [backup, export, restore, upgrade]

- name: Create the data root and the export directory (root's)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ honeypot_owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ honeypot_data_root }}", group: "{{ honeypot_group }}", mode: "0750"}
    - {path: "{{ honeypot_export_dir }}", group: "{{ honeypot_owner_group }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"
  tags: [backup, export, restore, upgrade]

- name: Create the working directories (the module's user's)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ honeypot_user }}"
    group: "{{ honeypot_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ honeypot_spool_dir }}", mode: "0700"}
    - {path: "{{ honeypot_state_dir }}", mode: "0700"}
    - {path: "{{ honeypot_reports_dir }}", mode: "0750"}
  loop_control:
    label: "{{ item.path }}"
  tags: [backup, export, restore, upgrade]
