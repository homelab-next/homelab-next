# SPDX-License-Identifier: Apache-2.0
# Keycloak's dependencies are the container engine (docker_engine, applied to the guest before this
# module), its credentials in the secret store and the rendered realm on the controller; it calls
# no other service.
- block:
    - name: The container engine is ready (docker_engine readiness)
      ansible.builtin.include_role:
        name: docker_engine
        tasks_from: readiness
    - name: The rendered realm is this lab's and passkey-only
      ansible.builtin.include_tasks: realm.yml
    - name: Every credential resolves in its form
      ansible.builtin.include_tasks: credentials.yml
  tags: [readiness]
