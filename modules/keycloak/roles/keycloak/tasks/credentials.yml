# SPDX-License-Identifier: Apache-2.0
# Every credential resolves in its form before a container sees it: the passwords are long and fit
# the env_file (no quote, no line break), the certificate and the CA are PEM certificates, the key
# a PEM private key, and every client the rendered realm names has a secret of 32 characters or
# more under the client's name in secret:idp/clients (ADR-0034: the generator's names; the clients read the
# same ones). No value is printed.
- name: Every credential resolves in its form
  ansible.builtin.assert:
    that:
      - lookup('hnx_secret', keycloak_admin_login_ref) is match(keycloak_login_value_pattern)
      - lookup('hnx_secret', keycloak_db_login_ref) is match(keycloak_login_value_pattern)
      - lookup('hnx_secret', keycloak_admin_login_ref) != lookup('hnx_secret', keycloak_db_login_ref)
      - lookup('hnx_secret', keycloak_tls_cert_ref) is search('-----BEGIN CERTIFICATE-----')
      - lookup('hnx_secret', keycloak_ca_ref) is search('-----BEGIN CERTIFICATE-----')
      - lookup('hnx_secret', keycloak_tls_key_ref) is search('-----BEGIN ([A-Z]+ )?PRIVATE KEY-----')
      - lookup('hnx_secret', keycloak_tls_key_ref) is not search('ENCRYPTED')
    fail_msg: >-
      keycloak: the admin and database passwords (24 to 256 of A-Z a-z 0-9 . _ ~ + / = @ % ^ * -,
      different from each other), the server certificate and the CA (PEM certificates) and an
      unencrypted PEM key must resolve
  no_log: true
  tags: [readiness]

- name: Every client of the rendered realm has its secret
  ansible.builtin.assert:
    that:
      - lookup('hnx_secret', keycloak_client_area ~ '/' ~ item) is match(keycloak_client_value_pattern)
    fail_msg: >-
      keycloak: the secret of client {{ item }} (in {{ keycloak_client_area }}) must resolve to 32 to 256 of A-Z a-z 0-9 . _ ~ + / = -
  loop: "{{ keycloak_client_ids }}"
  no_log: true
  tags: [readiness]
