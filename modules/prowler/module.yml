# SPDX-License-Identifier: Apache-2.0
# A scheduled, read-only cloud-posture scan as a feature module (docs/modules.md; README.md beside this
# file): a weekly job that scans one cloud account from a pinned virtualenv and writes the failing checks
# as flat JSON lines to a file the SIEM agent and the log pipeline tail. It is not a slot provider and
# listens on nothing. It names slots and capabilities, never a site: which account, which regions, which
# exposures the site accepts, the credential's value and the placement are the overlay's.
manifest_version: "1.0"
id: prowler
kind: feature
title: Scheduled read-only cloud-posture scan
description: Security-audit module, lab-internal only (use outside the lab needs explicit permission). A weekly read-only cloud-posture audit from a pinned virtualenv; writes a summary and one flat line per failing check to a findings file, with a mutelist that demands a reason per entry; health judges the audit's age, the credential file and the mutelist's review dates.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
bundle: {id: soc, group: cloud-posture}
identifiers:
  - {kind: secret-name, name: prowler, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the read-only cloud credential is read by name at deploy time and written to a root-only file
  hosts:
    - role: scanner
      kind: vm
      footprint: {cpu: 1, memory_mb: 2048, disk_gb: 10}
      guest:
        baselines: [base]
      roles: [role:prowler]
      purpose: runs the weekly scan and holds the findings and the last-run record; never on a host meant to be attacked (a decoy), since the credential can enumerate the whole account
prefers:
  capabilities:
    - cap: cap:log-pipeline
      version: "1.0"
      purpose: the pipeline tails the findings file and stages the compliance-finding events the lake writer commits to the lake
      fallback:
        behaviour: the findings still land in the file (replaced by every scan) and the SIEM agent still tails it; nothing reaches the lake, and the lake's compliance table goes stale, which its own freshness check reports
egress:
  - host: scanner
    to: [internet]
    purpose: read-only https calls to the cloud provider's API endpoints (amazonaws.com) and, at install and upgrade only, the package index; the site's firewall should limit the guest to those names
contributes:
  roles:
    - file: roles/prowler
  preflight:
    - {role: role:prowler, hook: readiness}
  docs:
    - file: README.md
data:
  - id: state
    kind: state
    description: The last scan's record (state/last-run.json) and the last findings file, exported under export/<stamp>/ (JSON); the landed findings are the lake's, exported with the lake.
    export: {formats: [object-tree], via: role:prowler}
    import: {formats: [object-tree], via: role:prowler}
    retention: {keep: forever}
config:
  aws_credentials:
    type: secret
    description: the read-only principal's "<access key id>:<secret access key>" (prowler_login_ref); the provider's SecurityAudit and ViewOnlyAccess policies are the scope, nothing that writes
    default: secret:prowler/aws-credentials
    overlay: optional
  oncalendar:
    type: string
    description: the scan's systemd calendar (prowler_oncalendar)
    default: "Tue *-*-* 03:00:00 UTC"
    overlay: optional
lifecycle:
  install: {playbook: playbooks/install.yml, note: "the readiness hook refuses to go on without the credential, systemd or a virtualenv-capable Python; the account in scope and the credential's creation are the operator's"}
  upgrade: {playbook: playbooks/upgrade.yml, note: "raise prowler_version and converge: pip installs the new pin into the virtualenv; the state is exported first"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
