# The credential resolves, in a form an environment file can carry: "<access key id>:<secret access
# key>", one line. A reference with no secret behind it is refused here, before any file is written.
# Only the verdict leaves the no_log task.
- name: Read the credential's form
  ansible.builtin.set_fact:
    prowler_login_ok: "{{ lookup('hnx_secret', prowler_login_ref) is match(prowler_login_form) }}"
  no_log: true
  tags: [readiness, health]

- name: The credential has its form
  ansible.builtin.assert:
    that: prowler_login_ok | bool
    fail_msg: >-
      prowler: the secret {{ prowler_login_ref }} is missing or malformed: it must be one line,
      "<access key id>:<secret access key>" (the id upper-case letters and digits, the key the
      base64 alphabet), for a read-only principal
  tags: [readiness, health]
