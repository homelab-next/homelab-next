# SPDX-License-Identifier: Apache-2.0
- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

# a reference with no secret behind it is refused here, before any file is written
- name: Every secret resolves, in its form
  ansible.builtin.include_tasks: credentials.yml

- name: Create the accounts and the directories
  ansible.builtin.include_tasks: dirs.yml

- name: Write the script, the schemas, the environment, the logins and the units
  ansible.builtin.include_tasks: config.yml

- name: Create the soc namespace and its tables on a fresh lake (never alters an existing table)
  ansible.builtin.command:
    argv: ["{{ lake_writer_runtime_python }}", -I, "{{ lake_writer_script }}", ensure-tables]
  environment: "{{ lake_writer_script_env }}"
  no_log: true
  changed_when: true
  when: lake_writer_ensure_tables | bool and not ansible_check_mode
