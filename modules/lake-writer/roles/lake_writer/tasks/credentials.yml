# Every secret resolves, in a form an environment file can carry (one line, no quote or space). A
# reference with no secret behind it is refused here, before any file is written. Only verdicts
# leave the no_log task.
- name: Read each secret's form
  ansible.builtin.set_fact:
    lake_writer_ref_forms:
      login: "{{ lookup('hnx_secret', lake_writer_lake_login_ref) is match(lake_writer_forms.login) }}"
      s3_access: "{{ lookup('hnx_secret', lake_writer_s3_id_ref) is match(lake_writer_forms.s3) }}"
      s3_secret: "{{ lookup('hnx_secret', lake_writer_s3_key_ref) is match(lake_writer_forms.s3) }}"
      token: "{{ true if lake_writer_catalog_bearer_ref == '' else lookup('hnx_secret', lake_writer_catalog_bearer_ref) is match(lake_writer_forms.bearer) }}"
      ca: "{{ true if lake_writer_lake_ca_ref == '' else lookup('hnx_secret', lake_writer_lake_ca_ref) is search('-----BEGIN CERTIFICATE-----') }}"
  no_log: true
  tags: [readiness, health]

- name: Every secret has its form
  ansible.builtin.assert:
    that: lake_writer_ref_forms.values() | reject | list | length == 0
    fail_msg: >-
      lake-writer: a secret is missing or malformed (forms: {{ lake_writer_ref_forms }}): the lake
      password {{ lake_writer_lake_login_ref }} must be 8 to 512 characters from A-Z a-z 0-9 and
      . _ ~ + / = : @ % ^ - (it is written into a systemd environment file); the object store key
      pair {{ lake_writer_s3_id_ref }} and {{ lake_writer_s3_key_ref }} 8 to 128
      characters from A-Z a-z 0-9 and . _ ~ + / = : -; the catalog token (when named) and the lake
      CA (when named, PEM) likewise
  tags: [readiness, health]
