# Install (and converge) the source census on the guest the site placed the module's `checker` role
# on. The apply path (docs/modules/apply.md) renders its own modules.yml from the selection; this is
# the module's own entry point. Needs the runtime release (role hnx_runtime) on the guest.
#   ansible-playbook -i <inventory with --selection> modules/source-census/playbooks/install.yml
- name: Install the source census
  hosts: mod_source_census_checker
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: source_census
        tasks_from: readiness
      tags: [mod_source_census]
  roles:
    - role: source_census
      tags: [mod_source_census]
