# SPDX-License-Identifier: Apache-2.0
- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Create the user and the directories
  ansible.builtin.include_tasks: dirs.yml

- name: Write the credentials
  ansible.builtin.include_tasks: credentials.yml

- name: Write the settings
  ansible.builtin.include_tasks: config.yml

- name: The daily unit (a site without a fleet scheduler)
  ansible.builtin.include_tasks: units.yml
  when: source_census_install_unit | bool
