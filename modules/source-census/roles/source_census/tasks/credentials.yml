# SPDX-License-Identifier: Apache-2.0
# The credentials, by name: one 0600 file each, owned by the service user (the run reads them
# itself and refuses any that is group- or world-readable). Values are read from the secret store
# here and never appear in the repository, the settings or a task's output.
- name: One file per credential
  ansible.builtin.copy:
    dest: "{{ source_census_cred_dir }}/{{ item.name }}"
    content: "{{ lookup('hnx_secret', item.ref) }}\n"
    owner: "{{ source_census_user }}"
    group: "{{ source_census_group }}"
    mode: "0600"
  loop: "{{ source_census_credentials }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
