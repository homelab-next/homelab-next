# Validate and record an image bump (compose_app upgrade) for the app (openproject_target_image),
# the database (openproject_target_postgres_image, a minor version only: a major one is a dump and a
# restore into a new cluster) or the cache (openproject_target_cache_image). The playbook exports
# first, then converges; the seeder runs for the new app image before the app opens the database.
- block:
    - name: Name the target
      ansible.builtin.set_fact:
        openproject_up_app: "{{ openproject_target_image | default('') }}"
        openproject_up_db: "{{ openproject_target_postgres_image | default('') }}"
        openproject_up_cache: "{{ openproject_target_cache_image | default('') }}"
    - name: Refuse a target that is not pinned by tag and digest, or is another repository
      ansible.builtin.assert:
        that:
          - >-
            [openproject_up_app, openproject_up_db, openproject_up_cache] | select('ne', '') | list | length == 1
          - >-
            openproject_up_app | length == 0 or (openproject_up_app is match(openproject_pinned_ref_pattern)
            and openproject_up_app.split('@')[0].rsplit(':', 1)[0] == openproject_repository)
          - >-
            openproject_up_cache | length == 0 or (openproject_up_cache is match(openproject_pinned_ref_pattern)
            and openproject_up_cache.split('@')[0].rsplit(':', 1)[0] == openproject_cache_repository)
          - >-
            openproject_up_db | length == 0 or
            (openproject_up_db is match(openproject_pinned_ref_pattern)
             and openproject_up_db.split('@')[0].rsplit(':', 1)[0] == openproject_db_repository
             and openproject_up_db.split('@')[0].rsplit(':', 1)[1].split('.')[0]
                 == openproject_db_tag.split('.')[0])
        fail_msg: >-
          projects: name one target, {{ openproject_repository }}:<tag>@sha256:<64 hex>,
          {{ openproject_cache_repository }}:<tag>@sha256:<64 hex> or
          {{ openproject_db_repository }}:<same major>.<minor>@sha256:<64 hex>
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Validate and record the bump (compose_app upgrade)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: upgrade
      vars:
        openproject_target: "{{ openproject_up_app | default('', true) or openproject_up_db | default('', true) or openproject_up_cache }}"
        compose_app_name: openproject
        compose_app_dir: "{{ openproject_app.compose_app_dir }}"
        compose_app_owner: "{{ openproject_app.compose_app_owner }}"
        compose_app_group: "{{ openproject_app.compose_app_group }}"
        compose_app_spec: "{{ openproject_app.compose_app_spec }}"
        compose_app_upgrade_service: "{{ 'web' if openproject_up_app | length > 0 else ('postgres' if openproject_up_db | length > 0 else 'cache') }}"
        compose_app_upgrade_tag: "{{ openproject_target.split('@')[0].rsplit(':', 1)[1] }}"
        compose_app_upgrade_digest: "{{ openproject_target.split('@')[1] }}"
  tags: [upgrade]
