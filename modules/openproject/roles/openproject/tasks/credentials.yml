# SPDX-License-Identifier: Apache-2.0
# Every credential resolves in its form before a container sees it: the database password fits
# the database URL and the env_file (no quote, no line break, nothing a URL would read), the
# session key is long enough to matter, the admin password carries three of the four character
# classes the product asks for. A reference with no value in the secret store stops the run here,
# by name, before anything is rendered or started. No value is printed.
# A failed lookup under no_log is reported as "output hidden", which would hide the one thing the
# operator needs: which reference has no value. So each reference is probed alone first (its value
# is never kept: only whether it resolved) and the refusal names the references, never a value.
- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    openproject_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop:
    - "{{ openproject_db_login_ref }}"
    - "{{ openproject_session_key_ref }}"
    - "{{ openproject_admin_login_ref }}"
  loop_control:
    label: "{{ item }}"
  register: openproject_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: openproject_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      projects: no value in the secret store for
      {{ [openproject_db_login_ref, openproject_session_key_ref, openproject_admin_login_ref] | zip(openproject_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Every credential resolves in its form
  ansible.builtin.assert:
    that:
      - lookup('hnx_secret', openproject_db_login_ref) is match(openproject_db_value_pattern)
      - lookup('hnx_secret', openproject_session_key_ref) is match(openproject_key_migrated_value_pattern if (openproject_secret_key_base_migrated | bool) else openproject_key_value_pattern)
      - lookup('hnx_secret', openproject_admin_login_ref) is match(openproject_admin_value_pattern)
      - >-
        [lookup('hnx_secret', openproject_admin_login_ref) is search('[a-z]'),
         lookup('hnx_secret', openproject_admin_login_ref) is search('[A-Z]'),
         lookup('hnx_secret', openproject_admin_login_ref) is search('[0-9]'),
         lookup('hnx_secret', openproject_admin_login_ref) is search('[._~-]')] | select | list | length >= 3
      - lookup('hnx_secret', openproject_db_login_ref) != lookup('hnx_secret', openproject_admin_login_ref)
      - lookup('hnx_secret', openproject_session_key_ref) != lookup('hnx_secret', openproject_db_login_ref)
    fail_msg: >-
      projects: the database password (24 to 128 of A-Z a-z 0-9 . _ ~ -), the session key (64 to
      256 of A-Z a-z 0-9 . _ ~ + / = -; with openproject_secret_key_base_migrated, 1 to 256 printable
      characters without whitespace or quotes) and the admin password (16 to 128 of A-Z a-z 0-9 . _ ~ -,
      three of lower, upper, digit and special) must resolve, each different from the others
  no_log: true
  tags: [readiness]

- name: Warn that the session key is a migrated weak key
  ansible.builtin.debug:
    msg: >-
      WARNING projects: openproject_secret_key_base_migrated is true, so {{ openproject_session_key_ref }}
      is accepted as a carried-over key that may be far shorter than the 64 characters the module
      otherwise requires. It protects sessions and encrypted settings only as well as its length allows:
      ROTATE it after the cutover (set a new strong secret, re-run the role; users sign in again; see
      the README, "Rotating a migrated key").
  when: openproject_secret_key_base_migrated | bool
  tags: [readiness]
