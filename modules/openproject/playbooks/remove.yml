# Remove: export the database and the attachments (export_first), stop and remove the containers,
# and delete the env_files (the database password, the session key and the seed password). The
# data root (with the export in it) and the rest of the compose project are kept for the
# operator to archive or delete; the decommission audit (module.yml lifecycle.remove.audit)
# checks nothing still names the service. Every project, work package and account is in the
# database: removing the module and its data root ends them.
- name: Remove the projects provider
  hosts: mod_openproject_server
  become: true
  tasks:
    - name: Export the database and the attachments first
      ansible.builtin.include_role:
        name: openproject
        tasks_from: export
    - name: Stop and remove the containers
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ openproject_dir | default('/opt/compose/openproject') }}/docker-compose.yml", down]
      changed_when: true
    - name: Delete the credentials the containers were given
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ openproject_dir | default('/opt/compose/openproject') }}/secrets/postgres.env"
        - "{{ openproject_dir | default('/opt/compose/openproject') }}/secrets/web.env"
        - "{{ openproject_dir | default('/opt/compose/openproject') }}/secrets/worker.env"
