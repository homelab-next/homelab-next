# SPDX-License-Identifier: Apache-2.0
# The registry row (platform/service) this provider contributes, keyed by the slot and renamed to
# the instance the site selects; version is product.version (never repeated here), host is the
# module's host role. The lab registry (lab/services.yml) must carry it exactly as bound
# (hnx modules check, docs/modules/registry-rows.md). auth: own - the service's own accounts. No
# public_hostname: the graph is private; its consumers (the CTI pipeline's graph sync and graph
# report) call it directly and the hypervisor's per-VM firewall admits only them. The service's
# certificate is its own (self-signed, kept in the data), so a consumer pins it (tls: internal).
# The health path is the service's unauthenticated "active" endpoint.
services:
  graph-store:
    capability: graph-store
    impl: synapse-cortex
    host: server
    protocol: https
    port: 4443
    health: {kind: http, path: /api/v1/active, expect_status: 200}
    owner: operator
    tls: internal
    auth: own
    tags: [graph, cti]
    description: The CTI graph (Synapse Cortex) with its own accounts and an HTTPS API. No public route, no egress.
