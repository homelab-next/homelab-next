# The service is stopped, the offline backup tool runs on its stopped directory (a one-off container
# of the same pinned image, no ports, no dependencies), and the service is started again whatever
# happened (the counts after are read from the restarted service).
- block:
    - name: Stop the service (it flushes its slabs on a clean stop)
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ synapse_cortex_dir }}/docker-compose.yml", stop, -t, "120", app]
      changed_when: true
    - name: Run the backup tool on the stopped directory
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ synapse_cortex_dir }}/docker-compose.yml", run, --rm, --no-deps, -T,
               --entrypoint, python, app, -m, synapse.tools.service.backup,
               "{{ synapse_cortex_container_storage }}", "{{ synapse_cortex_container_export }}/backups/{{ synapse_cortex_backup_name }}"]
      async: "{{ synapse_cortex_backup_timeout | int }}"
      poll: 3
      changed_when: true
  always:
    - name: Start the service again
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ synapse_cortex_dir }}/docker-compose.yml", up, -d, --wait, app]
      changed_when: true
