# Validate and record an image bump (compose_app upgrade). Only the same or a NEWER version of the
# same repository: the service migrates its storage forward on first start and cannot be taken back,
# so an older tag is refused. The playbook exports first, then converges.
- block:
    - name: Refuse a target that is not pinned by tag and digest, is another repository or is older
      ansible.builtin.assert:
        that:
          - synapse_cortex_target_image is match(synapse_cortex_pinned_ref_pattern)
          - synapse_cortex_target_image.split('@')[0].rsplit(':', 1)[0] == synapse_cortex_repository
          - synapse_cortex_target_image.split('@')[0].rsplit(':', 1)[1] is match(synapse_cortex_version_tag_pattern)
          - >-
            synapse_cortex_target_image.split('@')[0].rsplit(':', 1)[1][1:].split('.') | map('int') | list
            >= synapse_cortex_tag[1:].split('.') | map('int') | list
        fail_msg: >-
          synapse-cortex: the target must be {{ synapse_cortex_repository }}:v<version>@sha256:<64 hex>, a
          version equal to or newer than {{ synapse_cortex_tag }} (the storage is migrated forward on first
          start and cannot go back)
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Validate and record the bump (compose_app upgrade)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: upgrade
      vars:
        compose_app_name: synapse-cortex
        compose_app_dir: "{{ synapse_cortex_app.compose_app_dir }}"
        compose_app_owner: "{{ synapse_cortex_app.compose_app_owner }}"
        compose_app_group: "{{ synapse_cortex_app.compose_app_group }}"
        compose_app_spec: "{{ synapse_cortex_app.compose_app_spec }}"
        compose_app_upgrade_service: app
        compose_app_upgrade_tag: "{{ synapse_cortex_target_image.split('@')[0].rsplit(':', 1)[1] }}"
        compose_app_upgrade_digest: "{{ synapse_cortex_target_image.split('@')[1] }}"
  tags: [upgrade]
