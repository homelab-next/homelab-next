# Every credential resolves in its form before a container sees it: each account name the service's
# own pattern (and none of them root), each password long enough to matter and made of characters a
# shell and an environment variable carry literally, every name and password distinct from the
# others. A reference with no value in the secret store stops the run here, by name, before anything
# is rendered or started. No value is printed. (A failed lookup under no_log is reported as "output
# hidden", which would hide the one thing the operator needs: which reference has no value. So each
# reference is probed alone first and the refusal names the references, never a value.)
- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    synapse_cortex_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop: "{{ synapse_cortex_refs }}"
  loop_control:
    label: "{{ item }}"
  register: synapse_cortex_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: synapse_cortex_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      synapse-cortex: no value in the secret store for
      {{ synapse_cortex_refs | zip(synapse_cortex_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Every account name and password resolves in its form
  ansible.builtin.assert:
    that:
      - >-
        (synapse_cortex_accounts | map(attribute='name_ref') | select | list | length) == 0 or
        lookup('hnx_secret', *(synapse_cortex_accounts | map(attribute='name_ref') | select | list), wantlist=True)
        | reject('match', synapse_cortex_user_pattern) | list | length == 0
      - >-
        (synapse_cortex_accounts | map(attribute='name_ref') | select | list | length) == 0 or
        'root' not in lookup('hnx_secret', *(synapse_cortex_accounts | map(attribute='name_ref') | select | list), wantlist=True)
      - >-
        lookup('hnx_secret', *(synapse_cortex_accounts | map(attribute='password_ref') | select | list), wantlist=True)
        | reject('match', synapse_cortex_passphrase_pattern) | list | length == 0
      # every account has a name of its own and every password is its own
      - >-
        (synapse_cortex_accounts | map(attribute='name_ref') | select | list | length) == 0 or
        lookup('hnx_secret', *(synapse_cortex_accounts | map(attribute='name_ref') | select | list), wantlist=True) | unique | length
        == (synapse_cortex_accounts | map(attribute='name_ref') | select | list | length)
      - >-
        lookup('hnx_secret', *(synapse_cortex_accounts | map(attribute='password_ref') | select | list), wantlist=True) | unique | length
        == (synapse_cortex_accounts | map(attribute='password_ref') | select | list | length)
    fail_msg: >-
      synapse-cortex: each additional account's name (1 to 38 of A-Z a-z 0-9 . _ @ -, not starting with
      a dot, an at sign or a hyphen, and not root) and each password (16 to 128 of A-Z a-z 0-9 . _ ~ -)
      must resolve in its form, no two accounts with the same name and no password shared by two
  no_log: true
  tags: [readiness]
