# Install (and converge) the graph store on the guests the site placed the module's `server` role
# on. The apply path (docs/modules/apply.md) renders its own modules.yml from the selection and does
# not import this file; it is the module's own entry point, for a lab that runs one module by hand:
#   ansible-playbook -i <inventory with --selection> modules/synapse-cortex/playbooks/install.yml
# docker_engine is applied to the guest first (a compose_app module's host); the role's readiness
# hook refuses to go on without it and without the secrets. To bring an existing graph over, deploy
# with synapse_cortex_start false, run the restore hook, then deploy again (README, "Restore").
- name: Install the graph store (Synapse Cortex)
  hosts: mod_synapse_cortex_server
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: synapse_cortex
        tasks_from: readiness
      tags: [mod_synapse_cortex]
  roles:
    - role: synapse_cortex
      tags: [mod_synapse_cortex]
