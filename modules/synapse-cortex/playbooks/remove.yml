# Remove: export the graph first (export_first), then stop and remove the container. The data root
# (with the sealed backup in it) and the compose project are kept for the operator to archive or
# delete. The decommission audit (module.yml lifecycle.remove.audit) checks nothing still names the
# service.
- name: Remove the graph store
  hosts: mod_synapse_cortex_server
  become: true
  tasks:
    - name: Export the graph first
      ansible.builtin.include_role:
        name: synapse_cortex
        tasks_from: export
    - name: Stop and remove the container
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ synapse_cortex_dir | default('/opt/compose/synapse-cortex') }}/docker-compose.yml", down]
      changed_when: true
