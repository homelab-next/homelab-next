      velociraptor_server_hunt_principal: *hunt_principal
      velociraptor_server_client_config_group: *client_config_group
      velociraptor_server_results_group: *results_group
      velociraptor_server_mem_limit: *mem_limit
      velociraptor_server_start: *start
      velociraptor_server_validate_with_docker: *validate_with_docker
      velociraptor_server_ready_timeout: *ready_timeout
      velociraptor_server_accept_new_ca: *accept_new_ca
      velociraptor_server_schedule: *schedule
      velociraptor_server_hunt_interval_hours: *hunt_interval_hours
      velociraptor_server_collect_after_minutes: *collect_after_minutes
      velociraptor_server_stale_after_minutes: *stale_after_minutes
      velociraptor_server_min_clients: *min_clients
      velociraptor_server_systemctl_cli: *systemctl_cli
      velociraptor_server_unit_dir: *unit_dir
