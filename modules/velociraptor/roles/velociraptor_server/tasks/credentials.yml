# SPDX-License-Identifier: Apache-2.0
# The administrator's password resolves and is long enough: the image sets it only on the first
# start, so a short one cannot be mended afterwards by the role.
- name: Read the credential's form
  ansible.builtin.set_fact:
    velociraptor_server_forms:
      admin: "{{ lookup('hnx_secret', velociraptor_server_admin_login_ref) | length >= 12 }}"
      admin_clean: "{{ lookup('hnx_secret', velociraptor_server_admin_login_ref) is match('^[A-Za-z0-9._~+=@#%^*-]+\\Z') }}"
  no_log: true
  tags: [readiness]

- name: The credential has its form
  ansible.builtin.assert:
    that:
      - velociraptor_server_forms.admin | bool
      - velociraptor_server_forms.admin_clean | bool
    fail_msg: >-
      velociraptor: {{ velociraptor_server_admin_login_ref }} must be a password of 12 characters or
      more made of letters, digits and . _ ~ + = @ # % ^ * - (no space, quote or backslash: it
      reaches the first start through an environment file); forms: {{ velociraptor_server_forms }}
  tags: [readiness]
