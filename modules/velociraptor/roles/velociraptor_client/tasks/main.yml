- name: Validate the inputs
  ansible.builtin.include_tasks: validate.yml

- name: Refuse a client configuration that is not the server's generated one
  ansible.builtin.include_tasks: config.yml

- name: Install the pinned release binary
  ansible.builtin.include_tasks: binary.yml

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ velociraptor_client_config_dir }}"
    state: directory
    owner: "{{ velociraptor_client_owner }}"
    group: "{{ velociraptor_client_group }}"
    mode: "0755"

# a second client on the host (a migration) must not share the first one's identity file: the
# server-generated configuration names the default one, so it is overridden when asked, and nothing
# else in it is touched
- name: Give this client its own identity file when asked
  ansible.builtin.set_fact:
    velociraptor_client_config_text: >-
      {{ (velociraptor_client_config_text | from_yaml)
         | combine({'Client': {'writeback_linux': velociraptor_client_writeback}}, recursive=True)
         | to_nice_yaml(indent=2, width=4096) }}
  when: velociraptor_client_writeback | length > 0
  no_log: true

# 0600: the configuration holds the enrolment nonce
- name: Install the client configuration
  ansible.builtin.copy:
    content: "{{ velociraptor_client_config_text | trim }}\n"
    dest: "{{ velociraptor_client_config_path }}"
    owner: "{{ velociraptor_client_owner }}"
    group: "{{ velociraptor_client_group }}"
    mode: "0600"
  no_log: true
  register: velociraptor_client_config_written

- name: Install the systemd unit
  ansible.builtin.template:
    src: velociraptor-client.service.j2
    dest: "{{ velociraptor_client_unit_dir }}/{{ velociraptor_client_service }}.service"
    mode: "0644"
  register: velociraptor_client_unit

- name: Reload systemd when the unit changed
  ansible.builtin.command:
    argv: ["{{ velociraptor_client_systemctl_cli }}", daemon-reload]
  when: velociraptor_client_unit is changed
  changed_when: true

- name: Enable and start the client
  ansible.builtin.command:
    argv: ["{{ velociraptor_client_systemctl_cli }}", enable, --now, "{{ velociraptor_client_service }}.service"]
  when: velociraptor_client_start | bool
  changed_when: velociraptor_client_unit is changed or velociraptor_client_config_written is changed or velociraptor_client_binary is changed

- name: Restart the client when its binary or configuration changed
  ansible.builtin.command:
    argv: ["{{ velociraptor_client_systemctl_cli }}", restart, "{{ velociraptor_client_service }}.service"]
  when: velociraptor_client_start | bool and (velociraptor_client_config_written is changed or velociraptor_client_binary is changed) and velociraptor_client_unit is not changed
  changed_when: true

- name: Wait for the client to enrol
  ansible.builtin.include_tasks: enrolled.yml
  when: velociraptor_client_start | bool
