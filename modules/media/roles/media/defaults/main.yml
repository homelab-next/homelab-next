# SPDX-License-Identifier: Apache-2.0
# Jellyfin, the media provider (modules/media): one container, local accounts, a read-only library,
# CPU transcoding. media_logical_id (required): the instance's registry id, e.g. media
media_image: "docker.io/jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e"
# published on the guest's own address (the inventory's ansible_host), never all interfaces; the
# guest firewall admits the edge and the TV clients' zone
media_bind: "{{ ansible_host }}"
media_port: 8096
media_dir: /opt/compose/media
# the library as the guest sees it, mounted read-only into the container at the same path. The
# site supplies the real source (a mount of its own on the guest); the role never writes to it.
media_library_path: /srv/media
# proof that the library is really there: the server must not start on an empty directory (an
# unmounted mount point is one) and prune its database on the next scan. The path must be a mount
# point (mountpoint -q) or hold this marker file, which the operator places on the library itself.
media_library_marker: .hnx-media-library
# owner and group of the compose project and the data root
media_owner: root
media_group: "{{ media_gid }}"
# the module's data root on its host (docs/modules/data.md): config/ (the container's /config:
# data/, config/, root/, metadata/, plugins/) and export/. Backed up; the library is not here.
media_data_root: /var/lib/hnx-modules/media
# transcode scratch and image cache: rebuilt by the server, never backed up, so outside the data root
media_cache_dir: /var/cache/hnx-modules/media
# the container's user and group. The library must be readable by this gid (the site chooses the
# gid of the mount's group, or leaves the library world-readable).
media_uid: 61010
media_gid: 61010
media_timezone: Etc/UTC
# the URL clients are told to use (JELLYFIN_PublishedServerUrl); empty = none
media_published_url: ""
# Quick Connect stays enabled: a TV app signs in with a code approved from a signed-in device.
# The role seeds config/system.xml with it on a fresh install and health fails if it is off.
media_quick_connect: true
# hardware transcoding is off: no GPU dependency. "none" is the only value today; a later value
# (vaapi, nvenc) also needs compose_app to pass devices through, which it does not yet.
media_hwaccel: none
# the server id a restored or imported config must answer with (data/device.txt); empty = not
# checked. Set it at a cutover so health proves the Fire Cubes' server is the one that answers.
media_expected_server_id: ""
# the container's memory limit. tmpfs pages (the transcode directory, /tmp) are charged to it, so it
# must cover media_transcode_tmpfs_size and /tmp plus the server and its encoder: validation holds
# it to at least those plus 2 GiB. The default is the default tmpfs (8 GiB) plus headroom.
media_mem_limit: 12g
# the transcode scratch directory, a RAM-backed tmpfs mounted at /transcode (server setting
# TranscodingTempPath): size in BYTES, 8 GiB by default; 0 turns it off and the server transcodes into
# the cache volume (/cache/transcodes) as before. The size is memory the guest must have and
# playback fails when it fills: see the README's sizing rule.
media_transcode_tmpfs_size: 8589934592
media_start: true
media_validate_with_docker: true
media_health_timeout: 10
# health proves the server STARTED, not only that something answers on the port: a server that
# cannot open its database (a downgrade) can still answer /health. Every hook run reads the
# container's log since it last started for the startup failures in media_startup_failure_patterns,
# and, when this is above 0, signs in with the API key (media_api_login_ref, an administrator's key
# made in the server's dashboard, or carried over by the import) and requires at least this many
# libraries (virtual folders). Set it at a cutover to the source's library count (the importer's
# report, "libraries").
media_health_min_libraries: 0
# the API key health signs in with, read only when media_health_min_libraries is above 0
media_api_login_ref: secret:media/api-token
