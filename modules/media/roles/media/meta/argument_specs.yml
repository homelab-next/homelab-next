argument_specs:
  main:
    short_description: Run Jellyfin as a compose_app with local accounts, Quick Connect on, a read-only library mount and CPU transcoding.
    options:
      media_logical_id:
        type: str
        description: The instance's registry id (the service row the site binds, e.g. media).
        required: true
      media_image:
        type: str
        description: repository:tag@sha256:<digest> of the Jellyfin image.
        default: docker.io/jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
      media_bind:
        type: str
        description: The guest's own IPv4 address the port is published on (never all interfaces).
        default: '{{ ansible_host }}'
      media_port:
        type: int
        description: Host port (the registry row's port).
        default: 8096
      media_dir:
        type: path
        description: The compose project directory.
        default: /opt/compose/media
      media_library_path:
        type: path
        description: The library as the guest sees it, mounted read-only into the container at the same path.
        default: /srv/media
      media_library_marker:
        type: str
        description: File that proves the library is mounted when its path is not a mount point; placed by the operator on the library itself.
        default: .hnx-media-library
      media_owner:
        type: str
        description: Owner of the compose project and the data root.
        default: root
      media_group:
        type: str
        description: Group of the compose project and the data root (the container's gid by default).
        default: '{{ media_gid }}'
      media_data_root:
        type: path
        description: 'The module''s data root on the host: config/ (the container''s /config) and export/.'
        default: /var/lib/hnx-modules/media
      media_cache_dir:
        type: path
        description: 'Transcode scratch and image cache: rebuilt by the server, never backed up.'
        default: /var/cache/hnx-modules/media
      media_uid:
        type: int
        description: The container's user id (no account on the host has it); owns config/, the cache and export/.
        default: 61010
      media_gid:
        type: int
        description: The container's group id; the library must be readable by it.
        default: 61010
      media_timezone:
        type: str
        description: The container's TZ.
        default: Etc/UTC
      media_published_url:
        type: str
        description: The URL clients are told to use (JELLYFIN_PublishedServerUrl); empty for none.
        default: ''
      media_quick_connect:
        type: bool
        description: Keep Quick Connect enabled (seeded on a fresh install, checked by health).
        default: true
      media_hwaccel:
        type: str
        description: 'Hardware transcoding: none (the only supported value; CPU transcoding).'
        default: none
      media_expected_server_id:
        type: str
        description: The server id (32 hex) health requires; empty = not checked.
        default: ''
      media_mem_limit:
        type: str
        description: >-
          Container memory limit, like 12g. The transcode tmpfs and /tmp count against it, so it must be at least
          media_transcode_tmpfs_size plus 256 MiB for /tmp plus 2 GiB of headroom.
        default: 12g
      media_transcode_tmpfs_size:
        type: int
        description: >-
          Size in bytes of the RAM-backed tmpfs mounted at /transcode, which the server's TranscodingTempPath
          (encoding.xml) names, with throttling and segment deletion on. 0 turns it off: transcodes go to the
          cache volume. Otherwise 1 GiB to 1 TiB; playback fails when it fills.
        default: 8589934592
      media_start:
        type: bool
        description: Start the container (false renders only).
        default: true
      media_validate_with_docker:
        type: bool
        description: Validate the rendered compose file with docker compose config.
        default: true
      media_health_timeout:
        type: int
        description: Seconds each health request may take.
        default: 10
      media_health_min_libraries:
        type: int
        description: >-
          When above 0, health signs in with the API key (media_api_login_ref) and requires at least this many
          libraries (virtual folders), and requires the server to report its first-run setup complete. Set it at a
          cutover to the source's library count. 0 = not checked.
        default: 0
      media_api_login_ref:
        type: str
        description: The secret reference of an administrator's API key; read by health only when media_health_min_libraries is above 0.
        default: secret:media/api-token
