# SPDX-License-Identifier: Apache-2.0
# Fixed, not settings: role vars outrank inventory, so a deployment cannot loosen them.
media_path_pattern: '^(/(?!\.\.?(?:/|\Z))[A-Za-z0-9_.-]+)+\Z'
media_hwaccel_values: [none]
# the container root is read-only (compose_app read_only: true); what the server writes outside
# /config and /cache is /tmp, a small tmpfs, and the transcode directory
media_tmp_tmpfs_size: 268435456
media_transcode_path: /transcode
media_transcode_tmpfs_min: 1073741824
media_transcode_tmpfs_max: 1099511627776
# memory the server, the encoder and the page cache need on top of the tmpfs mounts
media_mem_headroom: 2147483648
media_mem_units: {k: 1024, m: 1048576, g: 1073741824}
# encoding.xml (the server's EncodingOptions), Jellyfin 10.11: throttling pauses the encoder once it
# is media_transcode_throttle_seconds ahead of the player and segment deletion removes segments
# media_transcode_keep_seconds behind it, so one long stream holds roughly (throttle + keep) seconds
# of output in the tmpfs instead of the whole file
media_transcode_throttle_seconds: 60
media_transcode_keep_seconds: 300
media_repository: "{{ media_image.split('@')[0].rsplit(':', 1)[0] }}"
media_tag: "{{ media_image.split('@')[0].rsplit(':', 1)[1] | default('') }}"
media_digest: "{{ media_image.split('@')[1] | default('') }}"
# the minimal system.xml seeded on a fresh install (never over an existing one): the server fills
# every other setting with its defaults and runs its first-run wizard
media_system_xml_seed: |
  <?xml version="1.0" encoding="utf-8"?>
  <ServerConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
    <QuickConnectAvailable>true</QuickConnectAvailable>
  </ServerConfiguration>
# the minimal encoding.xml seeded on a fresh install (never over an existing one)
media_encoding_xml_seed: |
  <?xml version="1.0" encoding="utf-8"?>
  <EncodingOptions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
  </EncodingOptions>
# what the export leaves out: rebuilt by the server, or logs
media_export_excludes: [./log, ./cache, ./transcodes]
