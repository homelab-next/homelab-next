# Upgrade: validate and record a pinned image bump (media_target_image, tag and digest), export the
# config first (a newer server migrates its own databases on first start, and cannot be undone by
# an older one), then converge with the new pin (set media_image to the target in the overlay).
#   ansible-playbook -i <inventory> modules/media/playbooks/upgrade.yml -e media_target_image=<ref>
- name: Upgrade the media server
  hosts: mod_media_server
  become: true
  tasks:
    - name: Validate and record the bump
      ansible.builtin.include_role:
        name: media
        tasks_from: upgrade
    - name: Export the config before the new image opens the databases
      ansible.builtin.include_role:
        name: media
        tasks_from: export
    - name: Converge on the new pin
      ansible.builtin.include_role:
        name: media
      vars:
        media_image: "{{ media_target_image }}"
