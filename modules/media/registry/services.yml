# SPDX-License-Identifier: Apache-2.0
# The registry row (platform/service) this provider contributes, keyed by the slot and renamed to
# the instance the site selects; version is product.version (never repeated here), host is the
# module's host role. The lab registry (lab/services.yml) must carry it exactly as bound
# (hnx modules check, docs/modules/registry-rows.md). auth: own - Jellyfin's local accounts; the
# edge does not put forward-auth in front of it. The public name is the site's value.
services:
  media:
    capability: media
    impl: jellyfin
    host: server
    protocol: http
    port: 8096
    health: {kind: http, path: /health, expect_status: 200}
    owner: operator
    tls: none
    auth: own
    public_hostname: media.example.internal
    tags: [media]
    description: Jellyfin with local accounts and Quick Connect (TV apps cannot do a browser sign-in), a read-only library, CPU transcoding.
