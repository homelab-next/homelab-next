# SPDX-License-Identifier: Apache-2.0
# The media provider on Jellyfin (docs/modules.md; README.md beside this file): one container from
# a pinned image, run by compose_app on a guest that already has docker_engine. Jellyfin keeps its
# own local accounts (auth: own) and is NOT put behind the edge's forward-auth: TV apps (Fire TV
# cubes) cannot do a browser sign-in, they use the account password or Quick Connect, which the
# role keeps enabled. The library is a read-only mount at a configurable path; transcoding runs on
# the CPU. Every real value (the guest, its address, the library's real source, the public name)
# is the site's: the overlay's lab/modules.yml, lab/services.yml and group variables.
manifest_version: "1.0"
id: media
kind: provider
title: Media server on Jellyfin
description: Fills the media slot with Jellyfin, a self-hosted media server, run as one compose_app
  container with local accounts, Quick Connect on, a read-only library mount and root, and CPU transcoding into a RAM-backed tmpfs;
  its config and data (server id, users, devices, watch state) move with tools/migrate/jellyfin.py.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: jellyfin
  version: 10.11.11
licence:
  kind: open-source
  spdx: GPL-2.0-only
# No credentials: the server's accounts are its own, made in its first-run wizard or brought by the
# import (tools/migrate/jellyfin.py). Nothing here is read from the secret store.
credentials: []
identifiers:
  - {kind: secret-name, name: media, on_remove: keep}
requires:
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 4, memory_mb: 16384, disk_gb: 40}
      guest:
        baselines: [base]
      roles: [role:media]
      purpose: runs the Jellyfin container (docker_engine applied first, compose_app renders it); the library mount is the guest's, the role only binds it read-only
provides:
  slots:
    media:
      adapter: homelabnext.conform.adapters.media:make
      provisional: true
      reason: media has no contract yet; the obvious standard is the server answering a health check and its public system info, with the library readable and the accounts local
      migration: {formats: [object-tree], export: role:media, import: role:media}
egress:
  - host: server
    to: [internet]
    purpose: metadata and artwork lookups for the library (the server's metadata providers) and its plugin catalogue; no library file or account leaves
contributes:
  roles:
    - file: roles/media
  services:
    - file: registry/services.yml
  preflight:
    - {role: role:media, hook: readiness}
  docs:
    - file: README.md
data:
  - id: config
    kind: state
    description: The server's configuration and data directory - the server id (data/device.txt), settings (config/*.xml), libraries (root/), users, devices, watch state and metadata (the databases and metadata/). The library files are not here; they are the site's.
    export: {formats: [object-tree], via: role:media}
    import: {formats: [object-tree], via: role:media}
    retention: {keep: forever}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest): the role's upgrade hook validates and records it, the config is exported, then it converges (the server migrates its own databases on first start with a newer version)"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
