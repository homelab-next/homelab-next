# SPDX-License-Identifier: Apache-2.0
# Every credential resolves in its form before a container sees it: the signing key long enough to
# matter and quote-free, the admin password (needed only when the role creates the first
# administrator) of the characters a shell and an env_file read literally, the API token the 40 hex
# characters the product's token table holds. A reference with no value in the secret store stops
# the run here, by name, before anything is rendered or started. No value is printed.
# A failed lookup under no_log is reported as "output hidden", which would hide the one thing the
# operator needs: which reference has no value. So each reference is probed alone first (its value
# is never kept: only whether it resolved) and the refusal names the references, never a value.
- name: Name the references this run reads
  ansible.builtin.set_fact:
    documents_needed_refs: >-
      {{ [documents_signing_ref, documents_api_login_ref]
         + ([documents_admin_login_ref] if documents_admin_bootstrap | bool else []) }}
  tags: [readiness]

- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    documents_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop: "{{ documents_needed_refs }}"
  loop_control:
    label: "{{ item }}"
  register: documents_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: documents_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      documents: no value in the secret store for
      {{ documents_needed_refs | zip(documents_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Every credential resolves in its form
  ansible.builtin.assert:
    that:
      - lookup('hnx_secret', documents_signing_ref) is match('^[A-Za-z0-9._~+/=-]{50,256}\Z')
      - lookup('hnx_secret', documents_api_login_ref) is match('^[0-9a-f]{40}\Z')
      - >-
        not (documents_admin_bootstrap | bool) or
        lookup('hnx_secret', documents_admin_login_ref) is match('^[A-Za-z0-9._~-]{16,128}\Z')
      - lookup('hnx_secret', documents_signing_ref) != lookup('hnx_secret', documents_api_login_ref)
      - >-
        not (documents_admin_bootstrap | bool) or
        lookup('hnx_secret', documents_admin_login_ref) not in [lookup('hnx_secret', documents_signing_ref), lookup('hnx_secret', documents_api_login_ref)]
    fail_msg: >-
      documents: the signing key (50 to 256 of A-Z a-z 0-9 . _ ~ + / = -), the API token (exactly 40
      lowercase hex characters) and, when documents_admin_bootstrap is true, the admin password (16
      to 128 of A-Z a-z 0-9 . _ ~ -) must resolve, each different from the others
  no_log: true
  tags: [readiness]
