# Validate and record an image bump (compose_app upgrade) for the application. Only the same or a
# NEWER version of the same repository: the application migrates its database forward on first
# start and cannot be taken back, so an older tag is refused. The playbook exports first, then
# converges. The broker's image is bumped through the overlay's pin (a cache: nothing to migrate).
- block:
    - name: Refuse a target that is not pinned by tag and digest, is another repository or is older
      ansible.builtin.assert:
        that:
          - documents_target_image is match(documents_pinned_ref_pattern)
          - documents_target_image.split('@')[0].rsplit(':', 1)[0] == documents_repository
          - documents_target_image.split('@')[0].rsplit(':', 1)[1] is match(documents_version_tag_pattern)
          - >-
            documents_target_image.split('@')[0].rsplit(':', 1)[1].split('.') | map('int') | list
            >= documents_tag.split('.') | map('int') | list
        fail_msg: >-
          documents: the target must be {{ documents_repository }}:<version>@sha256:<64 hex>, a version
          equal to or newer than {{ documents_tag }} (the database is migrated forward on first start
          and cannot go back)
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Validate and record the bump (compose_app upgrade)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: upgrade
      vars:
        compose_app_name: documents
        compose_app_dir: "{{ documents_app.compose_app_dir }}"
        compose_app_owner: "{{ documents_app.compose_app_owner }}"
        compose_app_group: "{{ documents_app.compose_app_group }}"
        compose_app_spec: "{{ documents_app.compose_app_spec }}"
        compose_app_upgrade_service: app
        compose_app_upgrade_tag: "{{ documents_target_image.split('@')[0].rsplit(':', 1)[1] }}"
        compose_app_upgrade_digest: "{{ documents_target_image.split('@')[1] }}"
  tags: [upgrade]
