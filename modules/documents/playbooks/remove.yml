# Remove: export the library (export_first), then stop and remove the containers. The data root
# (with the export in it) and the compose project are kept for the operator to archive or delete.
# The decommission audit (module.yml lifecycle.remove.audit) checks nothing still names the service.
- name: Remove the document library
  hosts: mod_documents_server
  become: true
  tasks:
    - name: Export the library first
      ansible.builtin.include_role:
        name: documents
        tasks_from: export
    - name: Stop and remove the containers
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ documents_dir | default('/opt/compose/documents') }}/docker-compose.yml", down]
      changed_when: true
