# Install (and converge) the document library on the guests the site placed the module's `server`
# role on. The apply path (docs/modules/apply.md) renders its own modules.yml from the selection and
# does not import this file; it is the module's own entry point, for a lab that runs one module by
# hand:
#   ansible-playbook -i <inventory with --selection> modules/documents/playbooks/install.yml
# docker_engine is applied to the guest first (a compose_app module's host); the role's readiness
# hook refuses to go on without it and without the three secrets.
- name: Install the document library (Paperless-ngx)
  hosts: mod_documents_server
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: documents
        tasks_from: readiness
      tags: [mod_documents]
  roles:
    - role: documents
      tags: [mod_documents]
