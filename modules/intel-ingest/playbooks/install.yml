# SPDX-License-Identifier: Apache-2.0
# Install (and converge) the ingest on the guest the site placed the module's `job` role on. The apply
# path (docs/modules/apply.md) renders its own modules.yml from the selection and does not import this
# file; it is the module's own entry point, for a lab that runs one module by hand:
#   ansible-playbook -i <inventory with --selection> modules/intel-ingest/playbooks/install.yml
# The readiness hook refuses to go on without every secret in its form.
- name: Install the threat-intel indicator ingest
  hosts: mod_intel_ingest_job
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: intel_ingest
        tasks_from: readiness
      tags: [mod_intel_ingest]
  roles:
    - role: intel_ingest
      tags: [mod_intel_ingest]
