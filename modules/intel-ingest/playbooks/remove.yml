# Remove: export the state first (lifecycle.remove.export_first), stop and disable the timer, then
# remove the units, the credentials and the script, and reload systemd. The data root (the state and
# the exports) is kept for the operator to archive or delete; neither service's data is touched. The
# decommission audit (module.yml lifecycle.remove.audit) checks nothing still names the module.
- name: Remove the threat-intel indicator ingest
  hosts: mod_intel_ingest_job
  become: true
  tasks:
    - name: Export the state first
      ansible.builtin.include_role:
        name: intel_ingest
        tasks_from: export
    - name: Stop and disable the timer (a no-op when it is not there)
      ansible.builtin.systemd_service:
        name: "hnx-{{ intel_ingest_logical_id }}.timer"
        state: stopped
        enabled: false
      failed_when: false
    - name: Remove the units, the credentials and the script
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/etc/systemd/system/hnx-{{ intel_ingest_logical_id }}.service"
        - "/etc/systemd/system/hnx-{{ intel_ingest_logical_id }}.timer"
        - "{{ intel_ingest_config_dir | default('/etc/hnx/' ~ intel_ingest_logical_id) }}/credentials"
        - /usr/local/libexec/homelabnext/hnx-intel-ingest
    - name: Reload systemd
      ansible.builtin.command:
        argv: [systemctl, daemon-reload]
      changed_when: true
