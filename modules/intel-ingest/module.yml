# SPDX-License-Identifier: Apache-2.0
# The indicator ingest between the threat-intel platform and the graph store as a feature module
# (docs/modules.md; README.md beside this file): a daily job that pulls the platform's actionable
# indicators per type and writes them as graph nodes, with a resumable, atomically checkpointed walk.
# It names the two slots, and the script's own source is the one place that names the two products
# (the product-names allowlist says so). Every real value (the guest, the two URLs, the account, the
# secret values, the name its certificate carries) is the site's: the overlay's lab/modules.yml,
# group variables and secret store.
manifest_version: "1.0"
id: intel-ingest
kind: feature
title: Threat-intel indicators into the graph store
description: Runs a daily job that pulls the threat-intel platform's actionable indicators per type and writes them as graph nodes, with a resumable walk (a per-type watermark and an in-progress page, saved atomically after every page); both services are verified, never unverified.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
bundle: {id: soc, group: threat-intel}
identifiers:
  - {kind: secret-name, name: intel-ingest, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the platform key, the graph password and the CA are read by name at deploy time
    - cap: cap:threat-intel
      provisional: true
      purpose: the job reads the platform's actionable attributes over its HTTPS API with a dedicated account's key
    - cap: cap:graph-store
      provisional: true
      purpose: the job writes the indicators as nodes through the graph store's HTTPS API with the site's account
  hosts:
    - role: job
      kind: vm
      footprint: {cpu: 1, memory_mb: 1024, disk_gb: 5}
      guest:
        baselines: [base]
      roles: [role:intel_ingest]
      purpose: runs the daily job and holds its checkpoint; place it where both services answer (on the guest that holds them, or beside it)
egress: none
contributes:
  roles:
    - file: roles/intel_ingest
  preflight:
    - {role: role:intel_ingest, hook: readiness}
  docs:
    - file: README.md
data:
  - id: state
    kind: state
    description: "The walk's checkpoint (state.json, per type the highest attribute id ingested and the in-progress page), exported under export/<stamp>/. Without it a restored job re-pages the whole attribute table; the indicators are the two services' own data."
    export: {formats: [object-tree], via: role:intel_ingest}
    import: {formats: [object-tree], via: role:intel_ingest}
    retention: {keep: forever}
config:
  threat_intel_key:
    type: secret
    description: the API key of a dedicated platform account (read access to attributes, never the administrator's), in a root-only environment file the unit loads (intel_ingest_threat_intel_key_ref)
    default: secret:intel-ingest/threat-intel-key
    overlay: optional
  graph_login:
    type: secret
    description: the password of the graph store account the job writes with, in the same root-only environment file (intel_ingest_graph_login_ref)
    default: secret:intel-ingest/graph-login
    overlay: optional
  graph_ca:
    type: secret
    description: the CA certificate (PEM) that signed the graph store's certificate, or that exact self-signed certificate, trusted for the graph store (intel_ingest_graph_ca_ref)
    default: secret:intel-ingest/graph-ca
    overlay: optional
  threat_intel_ca:
    type: secret
    description: the lab CA certificate (PEM) the platform is verified against, written to a world-readable bundle (intel_ingest_threat_intel_ca_ref)
    default: secret:intel-ingest/ca
    overlay: optional
lifecycle:
  install: {playbook: playbooks/install.yml, note: "the old job's state is installed once (intel_ingest_state_seed_file, create-only) so the walk resumes; the old job must be stopped first (README, Cutover)"}
  upgrade: {playbook: playbooks/upgrade.yml, note: "no pinned artefact: a validated re-converge that first checks the live state is this module's form"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
