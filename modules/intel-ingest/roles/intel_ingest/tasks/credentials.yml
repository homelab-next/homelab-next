# Every secret resolves, in a form an environment file can carry (one line, no quote or space). A
# reference with no secret behind it is refused here, before any file is written. Only verdicts
# leave the no_log task.
- name: Read each secret's form
  ansible.builtin.set_fact:
    intel_ingest_ref_forms:
      key: "{{ lookup('hnx_secret', intel_ingest_threat_intel_key_ref) is match(intel_ingest_forms.key) }}"
      login: "{{ lookup('hnx_secret', intel_ingest_graph_login_ref) is match(intel_ingest_forms.login) }}"
      distinct: "{{ lookup('hnx_secret', intel_ingest_threat_intel_key_ref) != lookup('hnx_secret', intel_ingest_graph_login_ref) }}"
      ti_ca: "{{ lookup('hnx_secret', intel_ingest_threat_intel_ca_ref) is search('-----BEGIN CERTIFICATE-----') }}"
      graph_ca: "{{ true if intel_ingest_graph_ca_ref == '' else lookup('hnx_secret', intel_ingest_graph_ca_ref) is search('-----BEGIN CERTIFICATE-----') }}"
  no_log: true
  tags: [readiness, health]

- name: Every secret has its form
  ansible.builtin.assert:
    that: intel_ingest_ref_forms.values() | reject | list | length == 0
    fail_msg: >-
      intel-ingest: a secret is missing or malformed (forms: {{ intel_ingest_ref_forms }}): the platform
      key {{ intel_ingest_threat_intel_key_ref }} must be 40 letters and digits, the graph password
      {{ intel_ingest_graph_login_ref }} 8 to 512 characters from A-Z a-z 0-9 and . _ ~ + / = : @ % ^ -
      (it is written into a systemd environment file) and different from the key, the CAs PEM
  tags: [readiness, health]
