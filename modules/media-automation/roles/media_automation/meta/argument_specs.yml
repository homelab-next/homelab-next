      media_automation_vpn_input_ports:
        type: list
        description: 'Ports the VPN provider forwards to this account (gluetun FIREWALL_VPN_INPUT_PORTS): the one inbound exception on the tunnel; the torrent client''s listen port must be the same. Empty:
          none.'
        elements: str
        default: []
      media_automation_vpn_outbound_subnets:
        type: list
        description: 'IPv4 CIDRs the downloaders may answer through the tunnel kill-switch (gluetun FIREWALL_OUTBOUND_SUBNETS): the lab subnets the web interfaces and the apps are reached from. Required,
          at least one.'
        elements: str
