# Fixed, not settings: role vars outrank inventory, so a deployment cannot loosen them.
media_automation_path_pattern: '^(/(?!\.\.?(?:/|\Z))[A-Za-z0-9_.-]+)+\Z'
media_automation_ref_pattern: '^secret:[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*\Z'
media_automation_cidr_pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}/([89]|[12][0-9]|3[0-2])\Z'
# the kill-switch's way out to the lab only: private (RFC 1918), shared (100.64/10), link-local and
# loopback ranges, each with a prefix no shorter than its own range (a /8 spelt in the 192.168 block is a public range)
media_automation_lan_cidr_pattern: '^(10\.[0-9.]+/([89]|[12][0-9]|3[0-2])|172\.(1[6-9]|2[0-9]|3[01])\.[0-9.]+/(1[2-9]|2[0-9]|3[0-2])|192\.168\.[0-9.]+/(1[6-9]|2[0-9]|3[0-2])|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9.]+/(1[0-9]|2[0-9]|3[0-2])|169\.254\.[0-9.]+/(1[6-9]|2[0-9]|3[0-2])|127\.[0-9.]+/([89]|[12][0-9]|3[0-2]))\Z'
media_automation_ipv4_pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}\Z'
# the credential forms: a WireGuard key is 32 bytes in base64; the address list is CIDRs; the
# password carries no quote, space, backslash or $ (it goes through an env file)
media_automation_key_pattern: '^[A-Za-z0-9+/]{43}=\Z'
media_automation_addresses_pattern: '^[0-9A-Fa-f.:]+/[0-9]{1,3}(,[0-9A-Fa-f.:]+/[0-9]{1,3}){0,3}\Z'
media_automation_client_login_pattern: '^[A-Za-z0-9._~!@#%^*+=:,-]{12,128}\Z'
# every app's image, by app name (the upgrade hook and the validation read this)
media_automation_images:
  gluetun: "{{ media_automation_gluetun_image }}"
  qbittorrent: "{{ media_automation_qbittorrent_image }}"
  nzbget: "{{ media_automation_nzbget_image }}"
  prowlarr: "{{ media_automation_prowlarr_image }}"
  flaresolverr: "{{ media_automation_flaresolverr_image }}"
  sonarr: "{{ media_automation_sonarr_image }}"
  radarr: "{{ media_automation_radarr_image }}"
  lidarr: "{{ media_automation_lidarr_image }}"
  seerr: "{{ media_automation_seerr_image }}"
  tdarr: "{{ media_automation_tdarr_image }}"
media_automation_ports:
  - "{{ media_automation_sonarr_port }}"
  - "{{ media_automation_radarr_port }}"
  - "{{ media_automation_lidarr_port }}"
  - "{{ media_automation_prowlarr_port }}"
  - "{{ media_automation_qbittorrent_port }}"
  - "{{ media_automation_nzbget_port }}"
  - "{{ media_automation_seerr_port }}"
  - "{{ media_automation_tdarr_port }}"
  - "{{ media_automation_tdarr_server_port }}"
# the apps whose config directory is the module's state (config/<app>); the config.xml of the
# first four is what a restore and the helpers look for
media_automation_config_apps: [gluetun, qbittorrent, nzbget, prowlarr, sonarr, radarr, lidarr, seerr, tdarr]
media_automation_arr_apps: [sonarr, radarr, lidarr, prowlarr]
media_automation_downloads_dir: "{{ media_automation_library_path }}/{{ media_automation_downloads_subdir }}"
media_automation_state_dir: "{{ media_automation_data_root }}/state"
media_automation_helpers_dir: "{{ media_automation_dir }}/helpers"
# what the export leaves out: logs, and the cover art the apps re-download
media_automation_export_excludes: ['./*/log', './*/logs', './*/MediaCover', './*/logs.db*', './*/cache']
# the subdirectories of the downloads directory the clients write under (created when absent)
media_automation_downloads_tree:
  - qbittorrent
  - qbittorrent/completed
  - qbittorrent/incomplete
  - nzbget
  - nzbget/completed
  - nzbget/intermediate
# the ports the apps listen on inside their containers (the published host ports are settings)
media_automation_container_ports:
  qbittorrent: 8080
  nzbget: 6789
  prowlarr: 9696
  sonarr: 8989
  radarr: 7878
  lidarr: 8686
  flaresolverr: 8191
  seerr: 5055
  tdarr: 8265
