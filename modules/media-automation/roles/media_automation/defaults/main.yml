# repository:tag@sha256:<digest> of the nzbget image.
media_automation_nzbget_image: ghcr.io/linuxserver/nzbget:v26.3-ls270@sha256:adea51082575ce3e09d3b636b320c039109df7e21afd1234ad7c97b9df7c79c8
# repository:tag@sha256:<digest> of the prowlarr image.
