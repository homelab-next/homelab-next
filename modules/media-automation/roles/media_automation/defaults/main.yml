# The media automation provider (modules/media-automation): the download-automation stack beside the media
# server, one compose_app project. media_automation_logical_id and media_automation_vpn_outbound_subnets
# are required (no default). The three VPN credentials and the torrent client password are secret
# references, never values.
# repository:tag@sha256:<digest> of the gluetun image.
media_automation_gluetun_image: docker.io/qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
# repository:tag@sha256:<digest> of the qbittorrent image.
