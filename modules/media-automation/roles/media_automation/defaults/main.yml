# repository:tag@sha256:<digest> of the sonarr image.
media_automation_sonarr_image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
# repository:tag@sha256:<digest> of the radarr image.
media_automation_radarr_image: ghcr.io/linuxserver/radarr:6.4.4.10685-ls325@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
# repository:tag@sha256:<digest> of the lidarr image.
media_automation_lidarr_image: ghcr.io/linuxserver/lidarr:3.1.6.5079-ls46@sha256:9fddcf5c613361edfce390d4e6b7c364282e71e90a40ce7793077fed788f6e63
# repository:tag@sha256:<digest> of the seerr image.
media_automation_seerr_image: ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
# repository:tag@sha256:<digest> of the tdarr image.
media_automation_tdarr_image: ghcr.io/haveagitgat/tdarr:3.04.00@sha256:0ea9217f69f40e49977dbcbc0319224e625c90d808d39bf075483fe45e9612f1
# The guest's own IPv4 address every port is published on (never all interfaces).
media_automation_bind: "{{ ansible_host }}"
# Host port of the sonarr web interface.
media_automation_sonarr_port: 8989
# Host port of the radarr web interface.
media_automation_radarr_port: 7878
# Host port of the lidarr web interface.
media_automation_lidarr_port: 8686
# Host port of the prowlarr web interface.
media_automation_prowlarr_port: 9696
# Host port of the qbittorrent web interface (published on the VPN container, whose network the container shares).
media_automation_qbittorrent_port: 8080
# Host port of the nzbget web interface (published on the VPN container, whose network the container shares).
media_automation_nzbget_port: 6789
# Host port of the seerr web interface.
media_automation_seerr_port: 5055
# Host port of the tdarr web interface.
media_automation_tdarr_port: 8265
# Host port of the transcode server's node endpoint.
media_automation_tdarr_server_port: 8266
# The compose project directory (also the helpers and the secret files).
media_automation_dir: /opt/compose/media-automation
# The module's data root: config/<app>/ (each app's /config), state/ and export/. Backed up; the library is not here.
media_automation_data_root: /var/lib/hnx-modules/media-automation
# Transcode scratch (the transcode node temp directory): rebuilt, never backed up.
media_automation_cache_dir: /var/cache/hnx-modules/media-automation
# The library as the guest sees it, mounted WRITABLE into the apps at the same path (the guest mounts the host dataset here).
media_automation_library_path: /srv/media
# File that proves the library is mounted when its path is not a mount point; placed by the operator on the library itself.
media_automation_library_marker: .hnx-media-library
# The downloads directory, a directory directly inside the library (beside movies/, shows/, music/ ...) so an import is a hardlink on one filesystem.
media_automation_downloads_subdir: downloads
# Owner of the compose project and the data root.
media_automation_owner: root
# Group of the compose project and the data root (the apps' gid by default).
media_automation_group: "{{ media_automation_gid }}"
# The user id the apps run as (the old library's files are owned by 101000, an unprivileged-container shift); owns config/ and state/. The role never chowns the library: the overlay decides it once (README).
media_automation_uid: 101000
# The group id the apps run as; the library must be writable by it.
media_automation_gid: 101000
# The request app's user id (its image runs as its own non-root user 1000 and has no uid setting).
media_automation_seerr_uid: 1000
# The request app's group id.
media_automation_seerr_gid: 1000
# The containers' TZ.
media_automation_timezone: Etc/UTC
# The VPN service provider (gluetun VPN_SERVICE_PROVIDER); the credentials are WireGuard.
media_automation_vpn_provider: airvpn
# Optional plain list (comma separated) of VPN server hostnames to pin (gluetun SERVER_HOSTNAMES); empty lets the client pick from the provider pool. Not a secret.
media_automation_vpn_server_hostnames: ''
# Ports the VPN provider forwards to this account (gluetun FIREWALL_VPN_INPUT_PORTS): the one inbound exception on the tunnel; the torrent client's listen port must be the same. Empty: none.
media_automation_vpn_input_ports: []
# Secret reference of the WireGuard private key.
media_automation_vpn_key_ref: secret:media-automation/vpn-wireguard-private-key
# Secret reference of the WireGuard preshared key (the provider mandates one).
media_automation_vpn_psk_ref: secret:media-automation/vpn-wireguard-preshared-key
# Secret reference of the WireGuard interface address(es) the provider assigned (CIDR, comma separated).
media_automation_vpn_addresses_ref: secret:media-automation/vpn-wireguard-addresses
# Secret reference of the torrent client web interface password the helper timers log in with (the same value the apps hold for their download client).
media_automation_qbittorrent_login_ref: secret:media-automation/qbittorrent-password
# The torrent client web interface user the helper timers log in as.
media_automation_qbittorrent_user: admin
# Install the helper scripts and their systemd timers.
media_automation_helpers_enabled: true
# Enable the completed-downloads cleanup timer.
media_automation_helper_cleanup_enabled: true
# Enable the stalled-torrent repair timer.
media_automation_helper_stalled_enabled: true
# Enable the release-name cleanup timer (renames files in the library; the apps are rescanned after).
media_automation_helper_rename_enabled: true
# Create the system account (named hnx-media, uid/gid = the apps') the helper units run as; systemd refuses a numeric User= with no passwd entry.
media_automation_helper_account_manage: true
# Hours without progress before a torrent counts as stalled.
media_automation_helper_stall_hours: 24
# Minimum age of a directory/partfile before the cleanup removes it.
media_automation_helper_min_age_hours: 6
# Where the helper scripts are installed (root-owned; the units run them at this path, fixed in the unit templates).
media_automation_libexec_dir: /usr/local/libexec/homelabnext
# Where the helper units are installed.
media_automation_unit_dir: /etc/systemd/system
# Where the helper timers' last-run records go (role last_run, docs/role-interface.md section 8; the units run the writer as root) and the group that may read them.
media_automation_last_run_dir: /var/lib/homelabnext/last-run
media_automation_last_run_group: root
# The systemctl command (a test fake).
media_automation_systemctl_cli: systemctl
# Seconds each health request may take.
media_automation_health_timeout: 10
# Start the containers (false renders only).
media_automation_start: true
# Validate the rendered compose file with docker compose config.
media_automation_validate_with_docker: true
