# SPDX-License-Identifier: Apache-2.0
# The exit copy (data config, object-tree): <data root>/export/{media-automation-config.tar.gz,listing.jsonl}.
# The stack is stopped for the copy (the apps' databases are SQLite: a tar of files being written is
# not a consistent copy) and started again whatever happened; logs, cover art and caches are left
# out. It is a snapshot: every run writes a new one (the hook reports changed).
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Create the data directories
      ansible.builtin.include_tasks: dirs.yml
    - name: Copy the config with the stack stopped
      block:
        - name: Stop the stack
          ansible.builtin.command:
            argv: [docker, compose, -f, "{{ media_automation_dir }}/docker-compose.yml", stop]
          changed_when: true
        - name: Archive the config directories
          ansible.builtin.command:
            argv: >-
              {{ ['tar', '-czf', media_automation_data_root ~ '/export/media-automation-config.tar.gz', '-C', media_automation_data_root ~ '/config']
                 + (media_automation_export_excludes | map('regex_replace', '^(.*)$', '--exclude=\1') | list) + ['.'] }}
          changed_when: true
        - name: Hash the archive
          ansible.builtin.stat:
            path: "{{ media_automation_data_root }}/export/media-automation-config.tar.gz"
            checksum_algorithm: sha256
            get_checksum: true
          register: media_automation_archive
        - name: Write the listing
          ansible.builtin.copy:
            dest: "{{ media_automation_data_root }}/export/listing.jsonl"
            content: "{{ {'key': 'media-automation-config.tar.gz', 'size': media_automation_archive.stat.size, 'sha256': media_automation_archive.stat.checksum} | to_json }}\n"
            owner: "{{ media_automation_uid | int }}"
            group: "{{ media_automation_gid | int }}"
            mode: "0600"
        - name: The archive belongs to the apps' user
          ansible.builtin.file:
            path: "{{ media_automation_data_root }}/export/media-automation-config.tar.gz"
            owner: "{{ media_automation_uid | int }}"
            group: "{{ media_automation_gid | int }}"
            mode: "0600"
      always:
        - name: Start the stack again
          ansible.builtin.command:
            argv: [docker, compose, -f, "{{ media_automation_dir }}/docker-compose.yml", up, -d]
          changed_when: true
          when: media_automation_start | bool
  tags: [export]
