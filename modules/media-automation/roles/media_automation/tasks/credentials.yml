# Every credential resolves in its form before a container sees it. A reference with no value in
# the secret store stops the run here, by name, before anything is rendered or started. A failed
# lookup under no_log is reported as "output hidden", which would hide the one thing the operator
# needs (which reference has no value), so each reference is probed alone first: only whether it
# resolved is kept, and the refusal names references, never values.
- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    media_automation_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop:
    - "{{ media_automation_vpn_key_ref }}"
    - "{{ media_automation_vpn_psk_ref }}"
    - "{{ media_automation_vpn_addresses_ref }}"
    - "{{ media_automation_qbittorrent_login_ref }}"
  loop_control:
    label: "{{ item }}"
  register: media_automation_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: media_automation_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      media-automation: no value in the secret store for
      {{ [media_automation_vpn_key_ref, media_automation_vpn_psk_ref,
          media_automation_vpn_addresses_ref, media_automation_qbittorrent_login_ref]
         | zip(media_automation_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Every credential resolves in its form
  ansible.builtin.assert:
    that:
      - lookup('hnx_secret', media_automation_vpn_key_ref) is match(media_automation_key_pattern)
      - lookup('hnx_secret', media_automation_vpn_psk_ref) is match(media_automation_key_pattern)
      - lookup('hnx_secret', media_automation_vpn_addresses_ref) is match(media_automation_addresses_pattern)
      - lookup('hnx_secret', media_automation_qbittorrent_login_ref) is match(media_automation_client_login_pattern)
      - lookup('hnx_secret', media_automation_vpn_key_ref) != lookup('hnx_secret', media_automation_vpn_psk_ref)
    fail_msg: >-
      media-automation: the VPN private key and preshared key (44 characters of base64, different
      from each other), the VPN addresses (CIDRs, comma separated) and the torrent client password
      (12 to 128 characters without a space, quote, backslash or dollar sign) must resolve in their form
  no_log: true
  tags: [readiness]
