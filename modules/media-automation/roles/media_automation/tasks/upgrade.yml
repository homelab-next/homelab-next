# SPDX-License-Identifier: Apache-2.0
- block:
    - name: Refuse an app that is not one of the stack's, or a target not pinned by tag and digest, or another repository
      ansible.builtin.assert:
        that:
          - media_automation_upgrade_app in media_automation_images
          - media_automation_target_image is match('^[^@:]+(/[^@:]+)*:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}@sha256:[0-9a-f]{64}\Z')
          - >-
            media_automation_target_image.split('@')[0].rsplit(':', 1)[0] ==
            media_automation_images[media_automation_upgrade_app].split('@')[0].rsplit(':', 1)[0]
        fail_msg: >-
          media-automation: the upgrade names an app of the stack ({{ media_automation_images | list | join(', ') }})
          and a target of the same repository as its current image, pinned
          <repository>:<tag>@sha256:<64 hex>
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Validate and record the bump (compose_app upgrade)
      ansible.builtin.include_role:
        name: compose_app
        tasks_from: upgrade
      vars:
        compose_app_name: media-automation
        compose_app_dir: "{{ media_automation_app.compose_app_dir }}"
        compose_app_owner: "{{ media_automation_app.compose_app_owner }}"
        compose_app_group: "{{ media_automation_app.compose_app_group }}"
        compose_app_spec: "{{ media_automation_app.compose_app_spec }}"
        compose_app_upgrade_service: "{{ media_automation_upgrade_app }}"
        compose_app_upgrade_tag: "{{ media_automation_target_image.split('@')[0].rsplit(':', 1)[1] }}"
        compose_app_upgrade_digest: "{{ media_automation_target_image.split('@')[1] }}"
  tags: [upgrade]
