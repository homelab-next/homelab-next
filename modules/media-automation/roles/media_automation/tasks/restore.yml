# SPDX-License-Identifier: Apache-2.0
# Restore the config directories from an export (media_automation_restore_source:
# media-automation-config.tar.gz and listing.jsonl): the archive's hash must equal the listing and it
# may hold no member that leaves the directory, no link and no special file, and it must hold each
# library manager's config.xml (the apps' identity and API key). It is extracted beside the config and
# checked while the stack still runs; only then is the stack stopped, the live config moved aside
# (never deleted) and the staged one moved in. The stack is started only after a complete swap; a
# failure leaves it stopped and says so. A source tree from another host (the old lab's volumes) goes
# through tools/migrate/media_automation.py instead, which maps library paths and host names.
- block:
    - name: Validate the inputs
      ansible.builtin.include_tasks: validate.yml
    - name: Build the application spec
      ansible.builtin.include_tasks: app.yml
    - name: Create the data directories
      ansible.builtin.include_tasks: dirs.yml
    - name: Read the listing and hash the archive
      ansible.builtin.slurp:
        src: "{{ media_automation_restore_source }}/listing.jsonl"
      register: media_automation_listing
    - name: Hash the archive
      ansible.builtin.stat:
        path: "{{ media_automation_restore_source }}/media-automation-config.tar.gz"
        checksum_algorithm: sha256
        get_checksum: true
      register: media_automation_restore_archive
    - name: Refuse an archive that differs from its listing
      ansible.builtin.assert:
        that:
          - (media_automation_listing.content | b64decode | from_json).sha256 == media_automation_restore_archive.stat.checksum
        fail_msg: "media-automation: the export is not intact (its hash differs from the listing)"
    - name: List the archive's members (names, and kinds for the links)
      ansible.builtin.command:
        argv: [tar, -tzf, "{{ media_automation_restore_source }}/media-automation-config.tar.gz"]
      register: media_automation_members
      changed_when: false
    - name: List the archive's member types
      ansible.builtin.command:
        argv: [tar, -tvzf, "{{ media_automation_restore_source }}/media-automation-config.tar.gz"]
      register: media_automation_member_types
      changed_when: false
    - name: Refuse an archive that leaves its directory, holds a link or a special file, or lacks a library manager's config.xml
      ansible.builtin.assert:
        that:
          - media_automation_members.stdout_lines | select('match', '^/') | list | length == 0
          - media_automation_members.stdout_lines | select('search', '(^|/)\.\.(/|$)') | list | length == 0
          # a symlink (l), hard link (h), device, fifo: only regular files and directories are restored
          - media_automation_member_types.stdout_lines | reject('match', '^[-d]') | list | length == 0
          - >-
            ['sonarr/config.xml', 'radarr/config.xml', 'lidarr/config.xml', 'prowlarr/config.xml']
            | difference(media_automation_members.stdout_lines | map('regex_replace', '^\\./', '') | list) | length == 0
        fail_msg: "media-automation: the archive leaves its directory, holds a link or special file, or lacks one of sonarr, radarr, lidarr, prowlarr config.xml"
    - name: Look for a config an earlier restore moved aside
      ansible.builtin.stat:
        path: "{{ media_automation_data_root }}/config.before-restore"
      register: media_automation_stale_aside
    - name: Refuse to nest under it
      ansible.builtin.assert:
        that: not media_automation_stale_aside.stat.exists
        fail_msg: "media-automation: {{ media_automation_data_root }}/config.before-restore is left from an earlier restore; archive or move it away first"
    - name: Look for a staging directory an earlier restore left
      ansible.builtin.stat:
        path: "{{ media_automation_data_root }}/config.restoring"
      register: media_automation_stale_staging
    - name: Refuse to extract over it
      ansible.builtin.assert:
        that: not media_automation_stale_staging.stat.exists
        fail_msg: "media-automation: {{ media_automation_data_root }}/config.restoring is left from an earlier restore; inspect it and move it away"
    - name: Extract into a fresh directory beside the config (the stack keeps running meanwhile)
      block:
        - name: Create the staging directory
          ansible.builtin.file:
            path: "{{ media_automation_data_root }}/config.restoring"
            state: directory
            mode: "0700"
        - name: Extract the archive
          ansible.builtin.command:
            argv: [tar, -xzf, "{{ media_automation_restore_source }}/media-automation-config.tar.gz", -C, "{{ media_automation_data_root }}/config.restoring", --no-same-owner, --no-same-permissions]
          changed_when: true
        - name: Look for links in what was extracted
          ansible.builtin.command:
            argv: [find, "{{ media_automation_data_root }}/config.restoring", -type, l]
          register: media_automation_staged_links
          changed_when: false
        - name: The staged config is what it should be
          ansible.builtin.assert:
            that:
              - media_automation_staged_links.stdout_lines | length == 0
            fail_msg: >-
              media-automation: the staged config holds a link. Nothing was changed; the staging
              directory {{ media_automation_data_root }}/config.restoring is left for inspection.
        - name: Give the staged config to the apps' user (each app its own)
          ansible.builtin.command:
            argv: [chown, -R, "{{ item.owner }}", "{{ media_automation_data_root }}/config.restoring/{{ item.dir }}"]
          loop:
            - {dir: "", owner: "{{ media_automation_uid | int }}:{{ media_automation_gid | int }}"}
            - {dir: seerr, owner: "{{ media_automation_seerr_uid | int }}:{{ media_automation_seerr_gid | int }}"}
            - {dir: gluetun, owner: "{{ media_automation_owner }}:{{ media_automation_group }}"}
          args:
            removes: "{{ media_automation_data_root }}/config.restoring/{{ item.dir }}"
          loop_control:
            label: "{{ item.dir | default('config', true) }}"
          changed_when: true
    - name: Swap the staged config in with the stack stopped
      block:
        - name: Stop the stack
          ansible.builtin.command:
            argv: [docker, compose, -f, "{{ media_automation_dir }}/docker-compose.yml", stop]
          changed_when: true
        - name: Move the live config aside (never deleted)
          ansible.builtin.command:
            argv: [mv, "{{ media_automation_data_root }}/config", "{{ media_automation_data_root }}/config.before-restore"]
            removes: "{{ media_automation_data_root }}/config"
          changed_when: true
        - name: Move the verified config into place
          ansible.builtin.command:
            argv: [mv, "{{ media_automation_data_root }}/config.restoring", "{{ media_automation_data_root }}/config"]
          changed_when: true
      rescue:
        - name: Say that the stack was left stopped
          ansible.builtin.fail:
            msg: >-
              media-automation: the swap failed part way. The stack is LEFT STOPPED. The previous config is at
              {{ media_automation_data_root }}/config.before-restore (or still at config) and the verified one
              at {{ media_automation_data_root }}/config.restoring; put them right by hand, then start the stack.
    - name: Start the stack on the restored config
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ media_automation_dir }}/docker-compose.yml", up, -d]
      changed_when: true
      when: media_automation_start | bool
  tags: [restore]
