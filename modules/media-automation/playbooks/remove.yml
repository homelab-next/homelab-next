# Remove: export the config (export_first), then stop and remove the containers. The data root
# (with the export in it), the cache, the compose project and the helper units are kept for the
# operator to archive or delete; the library and the downloads are never touched. The VPN stays
# down with the stack. The decommission audit (module.yml lifecycle.remove.audit) checks nothing
# still names the service.
- name: Remove the media automation stack
  hosts: mod_media_automation_server
  become: true
  tasks:
    - name: Export the config first
      ansible.builtin.include_role:
        name: media_automation
        tasks_from: export
    - name: Stop and remove the containers
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ media_automation_dir | default('/opt/compose/media-automation') }}/docker-compose.yml", down]
      changed_when: true
