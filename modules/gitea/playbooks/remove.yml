# Remove: export the instance (export_first), stop and remove the container, and delete the
# credential files the container was given (the env_file, the TLS key and the SSH host keys). The
# data root (with the export in it) and the rest of the compose project are kept for the operator
# to archive or delete; the decommission audit (module.yml lifecycle.remove.audit) checks nothing
# still names the service. Every repository, account and package is in the data root: removing the
# module and its data root ends them.
- name: Remove the forge provider
  hosts: mod_gitea_server
  become: true
  tasks:
    - name: Export the instance first
      ansible.builtin.include_role:
        name: gitea
        tasks_from: export
    - name: Stop and remove the container
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ gitea_dir | default('/opt/compose/gitea') }}/docker-compose.yml", down]
      changed_when: true
    - name: Delete the credentials the container was given
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ gitea_dir | default('/opt/compose/gitea') }}/secrets/gitea.env"
        - "{{ gitea_dir | default('/opt/compose/gitea') }}/tls/server.key"
        - "{{ gitea_dir | default('/opt/compose/gitea') }}/sshkeys/gitea.ed25519"
        - "{{ gitea_dir | default('/opt/compose/gitea') }}/sshkeys/gitea.rsa"
        - "{{ gitea_dir | default('/opt/compose/gitea') }}/sshkeys/gitea.ecdsa"
