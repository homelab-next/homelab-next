# SPDX-License-Identifier: Apache-2.0
# Fixed, not settings: role vars outrank inventory, so a deployment cannot loosen them.
# the product version the health hook expects the service to report: the image's own tag
gitea_product_version: "{{ gitea_image.split('@')[0].rsplit(':', 1)[1] | regex_replace('-rootless\\Z', '') }}"
# where the module's files are mounted in the container (the rootless image's own layout)
gitea_container_http_port: 3000
gitea_container_ssh_port: 2222
gitea_container_data: /var/lib/gitea
gitea_container_conf: /etc/gitea
gitea_container_tls: /tls
gitea_container_sshkeys: /sshkeys
gitea_container_export: /export
gitea_container_repos: /var/lib/gitea/git/repositories
# the compose service name (also the container's)
gitea_service: gitea
gitea_ref_pattern: '^secret:[a-z0-9][a-z0-9/_.-]*\Z'
gitea_pinned_ref_pattern: '^[^@:]+(/[^@:]+)*:[0-9]+\.[0-9]+\.[0-9]+-rootless@sha256:[0-9a-f]{64}\Z'
gitea_ipv4_pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}\Z'
gitea_hostname_pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+\Z'
gitea_path_pattern: '^(/(?!\.\.?(?:/|\Z))[A-Za-z0-9_.-]+)+\Z'
gitea_user_pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,38}\Z'
gitea_name_pattern: '^[A-Za-z][A-Za-z0-9._-]{0,62}\Z'
gitea_issuer_pattern: '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~-]+)*\Z'
gitea_pem_cert_pattern: '(?s)-----BEGIN CERTIFICATE-----.+-----END CERTIFICATE-----'
gitea_pem_key_pattern: '(?s)-----BEGIN (RSA |EC )?PRIVATE KEY-----.+-----END (RSA |EC )?PRIVATE KEY-----'
gitea_ssh_key_pattern: '(?s)\A-----BEGIN (OPENSSH|RSA|EC) PRIVATE KEY-----\n.+\n-----END (OPENSSH|RSA|EC) PRIVATE KEY-----\n?\Z'
# a value that is safe in the env_file (no quote, no line break, nothing a shell or a URL would read)
gitea_app_value_pattern: '^[A-Za-z0-9._~-]{16,512}\Z'
gitea_admin_value_pattern: '^[A-Za-z0-9._~-]{16,128}\Z'
gitea_pull_value_pattern: '^[A-Za-z0-9._~-]{8,128}\Z'
gitea_ssh_key_types: [ed25519, rsa, ecdsa]
# the ROOT_URL every link is built from: the port is part of it unless it is 443
gitea_root_url: "https://{{ gitea_hostname }}{{ '' if gitea_port | int == 443 else ':' ~ (gitea_port | int) }}/"
# Gitea's own settings, as its GITEA__<section>__<KEY> environment. Nothing here is a secret. The
# layout is the source instance's (everything under one application data path), so a dump's data/
# directory maps onto it name for name. No sign-up, no anonymous reading, no Actions runner, no
# OpenID, no LFS server, no mail, no telemetry of any kind; the packages (the container registry)
# are on.
gitea_fixed_env:
  GITEA__server__PROTOCOL: https
  GITEA__server__HTTP_PORT: "3000"
  GITEA__server__CERT_FILE: /tls/chain.pem
  GITEA__server__KEY_FILE: /tls/server.key
  GITEA__server__APP_DATA_PATH: /var/lib/gitea
  GITEA__server__START_SSH_SERVER: "true"
  GITEA__server__DISABLE_SSH: "false"
  GITEA__server__SSH_LISTEN_PORT: "2222"
  GITEA__server__LFS_START_SERVER: "false"
  GITEA__server__OFFLINE_MODE: "true"
  GITEA__database__DB_TYPE: sqlite3
  GITEA__database__PATH: /var/lib/gitea/gitea.db
  GITEA__repository__ROOT: /var/lib/gitea/git/repositories
  GITEA__picture__AVATAR_UPLOAD_PATH: /var/lib/gitea/avatars
  GITEA__picture__REPOSITORY_AVATAR_UPLOAD_PATH: /var/lib/gitea/repo-avatars
  GITEA__attachment__PATH: /var/lib/gitea/attachments
  GITEA__security__INSTALL_LOCK: "true"
  GITEA__service__DISABLE_REGISTRATION: "true"
  GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
  GITEA__service__ENABLE_NOTIFY_MAIL: "false"
  GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
  GITEA__openid__ENABLE_OPENID_SIGNUP: "false"
  GITEA__actions__ENABLED: "false"
  GITEA__packages__ENABLED: "true"
  GITEA__mailer__ENABLED: "false"
  GITEA__cron_0X2E_update_checker__ENABLED: "false"
  GITEA__other__SHOW_FOOTER_VERSION: "false"
# the [oauth2_client] section: no automatic registration, and an account is linked only by signing in to it
gitea_oauth_client_settings:
  ENABLE_AUTO_REGISTRATION: "false"
  ACCOUNT_LINKING: login
# the repositories' manifest, one line per repository (path, number of refs, sha256 of the sorted
# "<refname> <object>" lines, git fsck verdict), run in a container of the image with the repository
# root as its one argument; the migration tool runs the same text against the source
gitea_repos_script: |
  set -u
  root="$1"
  cd "$root" || exit 3
  find . -mindepth 2 -maxdepth 2 -type d -name '*.git' | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r r; do
    refs=$(git --git-dir="$root/$r" for-each-ref --format='%(refname) %(objectname)' | LC_ALL=C sort)
    n=$(printf '%s' "$refs" | grep -c . || true)
    d=$(printf '%s\n' "$refs" | sha256sum | cut -d' ' -f1)
    if git --git-dir="$root/$r" fsck --no-progress --no-dangling >/dev/null 2>&1; then f=ok; else f=fail; fi
    printf '%s\t%s\t%s\t%s\n' "$r" "$n" "$d" "$f"
  done
