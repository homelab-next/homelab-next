# SPDX-License-Identifier: Apache-2.0
# Every credential resolves in its form before a container sees it. A reference with no value in the
# secret store stops the run here, by name, before anything is rendered or started. No value is
# printed. A failed lookup under no_log is reported as "output hidden", which would hide the one
# thing the operator needs: which reference has no value. So each reference is probed alone first
# (its value is never kept: only whether it resolved) and the refusal names the references.
- name: Name the references this configuration reads
  ansible.builtin.set_fact:
    gitea_read_refs: >-
      {{ [gitea_app_key_ref, gitea_internal_auth_ref, gitea_signing_ref, gitea_admin_login_ref,
          gitea_tls_cert_ref, gitea_tls_key_ref, gitea_ca_ref] + (gitea_ssh_host_key_refs.values() | list)
         + ([gitea_oidc_cred_ref] if gitea_oidc_enabled | bool else [])
         + ([gitea_pull_auth_ref] if gitea_registry_pull_user != '' else []) }}
  tags: [readiness]

- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    gitea_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop: "{{ gitea_read_refs }}"
  loop_control:
    label: "{{ item }}"
  register: gitea_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: gitea_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      forge: no value in the secret store for
      {{ gitea_read_refs | zip(gitea_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Read each credential's form
  ansible.builtin.set_fact:
    gitea_forms:
      app: "{{ [lookup('hnx_secret', gitea_app_key_ref), lookup('hnx_secret', gitea_internal_auth_ref), lookup('hnx_secret', gitea_signing_ref)] | reject('match', gitea_app_value_pattern) | list | length == 0 }}"
      distinct: "{{ [lookup('hnx_secret', gitea_app_key_ref), lookup('hnx_secret', gitea_internal_auth_ref), lookup('hnx_secret', gitea_signing_ref), lookup('hnx_secret', gitea_admin_login_ref)] | unique | length == 4 }}"
      admin: "{{ lookup('hnx_secret', gitea_admin_login_ref) is match(gitea_admin_value_pattern) }}"
      cert: "{{ lookup('hnx_secret', gitea_tls_cert_ref) is search(gitea_pem_cert_pattern) }}"
      key: "{{ lookup('hnx_secret', gitea_tls_key_ref) is search(gitea_pem_key_pattern) }}"
      ca: "{{ lookup('hnx_secret', gitea_ca_ref) is search(gitea_pem_cert_pattern) }}"
      oidc: "{{ not (gitea_oidc_enabled | bool) or lookup('hnx_secret', gitea_oidc_cred_ref) is match(gitea_admin_value_pattern) }}"
      pull: "{{ gitea_registry_pull_user == '' or lookup('hnx_secret', gitea_pull_auth_ref) is match(gitea_pull_value_pattern) }}"
  no_log: true
  tags: [readiness]

- name: Read each SSH host key's form
  ansible.builtin.set_fact:
    gitea_ssh_forms: "{{ gitea_ssh_forms | default({}) | combine({item.key: lookup('hnx_secret', item.value) is search(gitea_ssh_key_pattern)}) }}"
  loop: "{{ gitea_ssh_host_key_refs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - gitea_forms.app | bool
      - gitea_forms.distinct | bool
      - gitea_forms.admin | bool
      - gitea_forms.cert | bool
      - gitea_forms.key | bool
      - gitea_forms.ca | bool
      - gitea_ssh_forms.values() | select('equalto', false) | list | length == 0
      - gitea_forms.oidc | bool
      - gitea_forms.pull | bool
    fail_msg: >-
      forge: {{ gitea_app_key_ref }}, {{ gitea_internal_auth_ref }} and {{ gitea_signing_ref }} must be
      16 to 512 of A-Z a-z 0-9 . _ ~ - and different from each other and from the admin password
      ({{ gitea_admin_login_ref }}, 16 to 128 of the same); {{ gitea_tls_cert_ref }} and {{ gitea_ca_ref }}
      must be PEM certificates and {{ gitea_tls_key_ref }} a PEM private key; each SSH host key must be a
      PEM or OpenSSH private key; with oidc {{ gitea_oidc_cred_ref }} 16 to 128 and with a pull account
      {{ gitea_pull_auth_ref }} 8 to 128 characters of A-Z a-z 0-9 . _ ~ -;
      forms: {{ gitea_forms | combine({'ssh': gitea_ssh_forms}) }}
  tags: [readiness]
