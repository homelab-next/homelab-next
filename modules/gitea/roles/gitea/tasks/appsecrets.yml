# The three application secrets as files under <project>/appsecrets (mounted read-only at
# /appsecrets), no trailing newline. The service reads them at start, so a change restarts it
# (main.yml). What the product does with them is documented in the README ("Where the secrets live"):
# its entrypoint writes the resolved values into conf/app.ini, a 0700 directory of the container's user.
- name: Write the application secrets
  ansible.builtin.copy:
    content: "{{ lookup('hnx_secret', lookup('ansible.builtin.vars', item.value.ref)) | trim }}"
    dest: "{{ gitea_dir }}/appsecrets/{{ item.key }}"
    owner: "{{ gitea_owner }}"
    group: "{{ gitea_gid | int }}"
    mode: "0440"
  loop: "{{ gitea_app_secret_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: gitea_secret_files
  no_log: true
