# SPDX-License-Identifier: Apache-2.0
# The SIEM provider on Wazuh (docs/modules.md; README.md beside this file, which is also the API
# contract the agent, the log pipeline and the alert intake build against): the manager, the
# indexer and the dashboard as three compose_app containers in the module's slice, on one guest.
# The agents enrol and send events to the manager (1514 and 1515, from the lab's subnets); the
# manager writes its alert and archive streams as JSON files under the module's data root, which
# the log pipeline on the same guest tails; the indexer holds the hot index (30 days); the
# dashboard is plain http on the guest, reached through the edge only. The manager acts on no host
# (active response off, remote commands off). Rules are native (ADR-0006 decision 4, ADR-0049
# decision 2): the role loads the site's native rule and decoder files, tests them in the manager's
# own configuration test before it restarts, and puts the previous set back if the test fails.
# Every real value (the guest, the names, the secret values, the rules) is the site's: the
# overlay's lab/modules.yml, lab/services.yml, group variables and secret store.
manifest_version: "1.0"
id: wazuh
kind: provider
title: SIEM on Wazuh
description: Fills the siem-source and hot-index slots with the Wazuh manager, indexer and dashboard
  as compose_app containers; credentials by reference; a private CA for the stack's TLS; native
  rules loaded under a configuration test with a rollback; alerts posted to the events forwarder as
  homelabnext.alert.created; health that proves the daemons are live processes; the manager state
  and the hot index exportable and restorable.
owner: operator
author: agent:claude
status: draft
version: 0.1.0
origin: {kind: in-tree}
product:
  name: wazuh
  display: Wazuh
  version: 4.14.9
licence:
  kind: open-source
  spdx: GPL-2.0-only
credentials:
  - secret: secret:wazuh/enrollment-password
    identity: password
    holder: consumers
    purpose: the template of the agents' enrolment password; the manager's enrolment service refuses a request that does not carry it, and the siem-agent control reads it by this name
  - secret: secret:wazuh/indexer-admin-password
    identity: password
    holder: provider
    purpose: the indexer's administrator account, used by the manager's indexer connector and the role's security initialisation
  - secret: secret:wazuh/dashboard-password
    identity: password
    holder: provider
    purpose: the dashboard's service account on the indexer (kibanaserver)
  - secret: secret:wazuh/api-password
    identity: password
    holder: provider
    purpose: the manager API's service account the dashboard and the health hook sign in with
  - secret: secret:wazuh/alert-forwarder-auth
    identity: token
    holder: provider
    purpose: the whole Authorization header value the alert integration sends to the events forwarder; read only when wazuh_alert_forward_url is set
identifiers:
  - {kind: secret-name, name: wazuh, on_remove: keep}
requires:
  capabilities:
    - cap: cap:secrets
      version: "1.0"
      purpose: the enrolment, indexer, dashboard, API and forwarder credentials are read by name at deploy time
  hosts:
    - role: server
      kind: vm
      footprint: {cpu: 8, memory_mb: 24576, disk_gb: 300}
      guest:
        baselines: [base]
      roles: [role:wazuh]
      purpose: runs the manager, the indexer and the dashboard (docker_engine applied first, compose_app renders them); the indexer needs vm.max_map_count of 262144 from the guest's sysctl
prefers:
  capabilities:
    - cap: cap:events
      version: "1.0"
      purpose: the alert integration posts each alert at or above the threshold to the events forwarder (wazuh_alert_forward_url) as homelabnext.alert.created
      fallback:
        behaviour: the integration stays off; alerts are in the manager's alert stream and the hot index, and nothing opens a case from them
provides:
  slots:
    siem-source:
      adapter: homelabnext.conform.adapters.siem:make_siem_source
      provisional: true
      reason: siem-source has no contract yet; the standard is the manager answering the enrolment and event ports and its daemons being alive, which the role's health hook proves
    hot-index:
      adapter: homelabnext.conform.adapters.siem:make_hot_index
      provisional: true
      reason: hot-index has no contract yet; the standard is the indexer answering its cluster health over TLS with the administrator account
      migration: {formats: [jsonl], export: role:wazuh, import: role:wazuh}
egress: none
contributes:
  roles:
    - file: roles/wazuh
  services:
    - file: registry/services.yml
  status_sources: [status:wazuh-manager-daemons, status:wazuh-alert-stream-age, status:wazuh-liveness-check-stale]
  preflight:
    - {role: role:wazuh, hook: readiness}
  docs:
    - file: README.md
    - file: CHANGELOG.md
data:
  - id: manager-state
    kind: state
    description: The manager's own state (agent keys, the rule and decoder files in use, the agent groups, the integrations) as a tar archive with a sha256 listing; the agents' keys are in it, so the export directory is 0700.
    export: {formats: [jsonl], via: role:wazuh}
    import: {formats: [jsonl], via: role:wazuh}
    retention: {keep: forever}
  - id: alert-index
    kind: database
    description: The hot index (the last 30 days of alerts) as a snapshot archive of the indexer's data directory taken with the indexer stopped, with a sha256 listing; the long-term history is the lake's.
    export: {formats: [jsonl], via: role:wazuh}
    import: {formats: [jsonl], via: role:wazuh}
    retention: {days: 30}
lifecycle:
  install: {playbook: playbooks/install.yml}
  upgrade: {playbook: playbooks/upgrade.yml, note: "a pinned image bump (tag and digest) of one of the three images: validated (same repository, never older than the running one) and recorded, the manager state exported, then converged; the three images move together within one minor series"}
  remove:
    playbook: playbooks/remove.yml
    export_first: true
    audit: [inventory, playbooks, live-refs, monitoring, secret-names, dns, contributions]
