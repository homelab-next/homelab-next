# Every credential resolves in its form before a container sees it. A reference with no value in the
# secret store stops the run here, by name, before anything is rendered or started. No value is
# printed. A failed lookup under no_log is reported as "output hidden", which would hide the one
# thing the operator needs: which reference has no value. So each reference is probed alone first
# (its value is never kept: only whether it resolved) and the refusal names the references.
- name: Name the references this configuration reads
  ansible.builtin.set_fact:
    wazuh_read_refs: >-
      {{ [wazuh_enrollment_ref, wazuh_indexer_admin_ref, wazuh_dashboard_login_ref, wazuh_api_login_ref]
         + ([wazuh_alert_auth_ref] if wazuh_alert_forward_url | length > 0 else []) }}
  tags: [readiness]

- name: Probe each reference (only whether it resolves is kept)
  ansible.builtin.set_fact:
    wazuh_probe_ok: "{{ lookup('hnx_secret', item) | length > 0 }}"
  loop: "{{ wazuh_read_refs }}"
  loop_control:
    label: "{{ item }}"
  register: wazuh_probe
  ignore_errors: true
  no_log: true
  tags: [readiness]

- name: Refuse a reference that has no value in the secret store, naming it
  ansible.builtin.assert:
    that: wazuh_probe.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: >-
      siem: no value in the secret store for
      {{ wazuh_read_refs | zip(wazuh_probe.results)
         | selectattr('1.failed', 'defined') | selectattr('1.failed') | map(attribute='0') | join(', ') }}
      (set it before deploying; nothing was rendered or started)
  tags: [readiness]

- name: Read each credential's form
  ansible.builtin.set_fact:
    wazuh_forms:
      enrollment: "{{ lookup('hnx_secret', wazuh_enrollment_ref) is match(wazuh_enrollment_pattern) }}"
      passwords: >-
        {{ [lookup('hnx_secret', wazuh_indexer_admin_ref), lookup('hnx_secret', wazuh_dashboard_login_ref),
            lookup('hnx_secret', wazuh_api_login_ref)] | reject('match', wazuh_login_form) | list | length == 0
           and ([lookup('hnx_secret', wazuh_api_login_ref) is search('[a-z]'), lookup('hnx_secret', wazuh_api_login_ref) is search('[A-Z]'),
                 lookup('hnx_secret', wazuh_api_login_ref) is search('[0-9]'), lookup('hnx_secret', wazuh_api_login_ref) is search('[.~-]')]
                | select | list | length == 4) }}
      distinct: >-
        {{ [lookup('hnx_secret', wazuh_enrollment_ref), lookup('hnx_secret', wazuh_indexer_admin_ref),
            lookup('hnx_secret', wazuh_dashboard_login_ref), lookup('hnx_secret', wazuh_api_login_ref)]
           | unique | length == 4 }}
      forwarder: >-
        {{ wazuh_alert_forward_url | length == 0 or lookup('hnx_secret', wazuh_alert_auth_ref) is match(wazuh_auth_pattern) }}
  no_log: true
  tags: [readiness]

- name: Every credential has its form
  ansible.builtin.assert:
    that:
      - wazuh_forms.enrollment | bool
      - wazuh_forms.passwords | bool
      - wazuh_forms.distinct | bool
      - wazuh_forms.forwarder | bool
    fail_msg: >-
      siem: {{ wazuh_enrollment_ref }} and the three account passwords ({{ wazuh_indexer_admin_ref }},
      {{ wazuh_dashboard_login_ref }}, {{ wazuh_api_login_ref }}) must be 16 to 64 of A-Z a-z 0-9 . _ ~ -;
      the API password ({{ wazuh_api_login_ref }}) needs a lower, an upper, a digit and one of . ~ -
      (the manager API's policy); the four all different; with the alert integration on,
      {{ wazuh_alert_auth_ref }} must be a whole Authorization header value (a scheme, a space and a
      credential, 16 to 512 printable characters); forms: {{ wazuh_forms }}
  tags: [readiness]
