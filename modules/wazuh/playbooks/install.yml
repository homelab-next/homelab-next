# Install (and converge) the SIEM provider on the guest the site placed the module's `server` role
# on. The apply path (docs/modules/apply.md) renders its own modules.yml from the selection and does
# not import this file; it is the module's own entry point, for a lab that runs one module by hand:
#   ansible-playbook -i <inventory with --selection> modules/wazuh/playbooks/install.yml
# docker_engine is applied to the guest first (a compose_app module's host); the role's readiness
# hook refuses to go on without it or without the indexer's kernel setting.
- name: Install the SIEM provider
  hosts: mod_wazuh_server
  become: true
  pre_tasks:
    - name: Preflight (readiness)
      ansible.builtin.include_role:
        name: wazuh
        tasks_from: readiness
      tags: [mod_wazuh]
  roles:
    - role: wazuh
      tags: [mod_wazuh]
